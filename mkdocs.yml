# Portal técnico del frontend Mantra Core Health.
#
# ⚠️  MkDocs NO está instalado en este proyecto y este archivo no lo instala.
#     Añadirlo sería una dependencia nueva (Python) y necesita autorización; el
#     plan maestro lo dice explícitamente. Este archivo existe para que el día
#     que se apruebe, la navegación ya esté escrita y verificada.
#
#     Mientras tanto la documentación se lee como Markdown, y sus enlaces se
#     verifican con `node scripts/check-doc-links.mjs`, que hace lo que la
#     construcción estricta de MkDocs haría con los enlaces — sin instalar nada.
#
# Para levantarlo, con Python disponible:
#     pip install mkdocs-material
#     mkdocs serve
#
# `strict: true` convierte cualquier aviso en error, incluidos los enlaces rotos
# y los archivos que no estén en la navegación.

site_name: Mantra Core Health — Frontend
site_description: Documentación técnica del frontend del ecosistema REDESA
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    # Mismos roles que el sistema REDSAT: el azul estructura y la aguamarina
    # acciona. Los valores viven en src/styles.css; acá solo la referencia.
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: es

