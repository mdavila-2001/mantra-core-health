<!doctype html>
<meta charset="utf-8">
<title>AloVida — video sobre el frontend real</title>
<style>
@font-face{font-family:Poppins;src:url(assets/poppins-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(assets/poppins-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(assets/poppins-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Inter Variable';src:url(assets/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:block}
:root{--petroleo:#0B557E;--petroleo-p:#0B3953;--aguamarina:#4FB3A9;--menta:#9FD8D0;
  --tinta:#242828;--tinta-3:#787B7B;--filete-2:#E3EAE7;
  --sans:'Inter Variable',system-ui,sans-serif;--display:Poppins,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{font-family:var(--sans);color:var(--tinta);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
#wash{position:absolute;inset:0;background:
  radial-gradient(1100px 700px at 6% -12%, rgba(79,179,169,.16), transparent 60%),
  radial-gradient(900px 620px at 102% 110%, rgba(11,85,126,.14), transparent 62%), #fff}
#grano{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(11,85,126,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,85,126,.045) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(1400px 900px at 50% 45%,#000 20%,transparent 78%)}

/* marca */
.marca{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:
  radial-gradient(1200px 820px at 20% 0%, #0E6A95 0%, transparent 55%),
  radial-gradient(1000px 700px at 90% 100%, #10796F 0%, transparent 52%),
  linear-gradient(140deg,#0B557E 0%,#0B3953 48%,#072F45 100%)}
.anillo{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:1.5px solid rgba(159,216,208,.35);opacity:0}
.centro{position:relative;text-align:center}
.centro img{width:200px;display:block;margin:0 auto 32px}
.wordmark{font-family:var(--display);font-weight:700;font-size:112px;letter-spacing:-.02em;color:#fff;line-height:1}
.wordmark span{display:inline-block}
.linea{width:0;height:3px;background:linear-gradient(90deg,var(--menta),var(--aguamarina));margin:28px auto 24px;border-radius:3px}
.claim{font-family:var(--display);font-weight:500;font-size:33px;color:#CFE7E3}
.pastillas{display:flex;gap:14px;justify-content:center;margin-top:36px}
.pastilla{border:1px solid rgba(159,216,208,.45);border-radius:999px;padding:12px 24px;font-size:20px;color:#EAF6F4;opacity:0}

/* la ventana con el frontend de verdad adentro */
#ventana{position:absolute;left:200px;top:70px;width:1520px;height:950px;border-radius:20px;overflow:hidden;
  border:1px solid var(--filete-2);box-shadow:0 46px 92px -34px rgba(11,57,83,.46),0 8px 22px rgba(11,57,83,.08);background:#fff;opacity:0}
#ventana iframe{position:absolute;inset:0;width:1520px;height:950px;border:0;opacity:0;background:#fff}

/* puntero y rótulos */
#cursor{position:absolute;width:30px;height:30px;left:0;top:0;z-index:60;opacity:0;filter:drop-shadow(0 4px 8px rgba(7,47,69,.4))}
#pulso{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid var(--aguamarina);opacity:0;z-index:59}
#rotulo{position:absolute;left:150px;bottom:54px;z-index:70;opacity:0}
.rot-caja{display:inline-block;background:linear-gradient(120deg,rgba(11,85,126,.97),rgba(11,57,83,.97));
  border-radius:18px;padding:20px 30px 22px;box-shadow:0 22px 44px -18px rgba(7,47,69,.6)}
.rot-eyebrow{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--menta);font-weight:600;margin-bottom:8px}
.rot-tit{font-family:var(--display);font-weight:600;font-size:33px;color:#fff}
#paso{position:absolute;left:150px;top:26px;z-index:70;display:flex;align-items:center;gap:14px;opacity:0}
#paso .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--petroleo)}
#paso .raya{width:60px;height:2px;background:var(--aguamarina);border-radius:2px}
#paso .txt{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);font-weight:600}
</style>
<div id="stage">
  <div id="wash"></div>
  <div id="grano"></div>
  <div id="ventana"></div>
  <div class="marca" id="marcaIn">
    <div class="anillo" id="a1"></div><div class="anillo" id="a2"></div><div class="anillo" id="a3"></div>
    <div class="centro">
      <img src="assets/alovida-logo-blanco.svg" id="logoIn" alt="AloVida">
      <div class="wordmark" id="wmIn"></div>
      <div class="linea" id="lineaIn"></div>
      <div class="claim" id="claimIn">Pedir turno, atender, publicar y encontrar.</div>
    </div>
  </div>
  <div class="marca" id="marcaOut">
    <div class="centro">
      <img src="assets/alovida-logo-blanco.svg" id="logoOut" alt="AloVida">
      <div class="wordmark" id="wmOut" style="font-size:96px">AloVida</div>
      <div class="claim" id="claimOut" style="margin-top:20px">Cada pantalla de este video es el producto, tal cual.</div>
      <div class="pastillas">
        <div class="pastilla" id="pa1">Turnos reales</div>
        <div class="pastilla" id="pa2">Historia clínica</div>
        <div class="pastilla" id="pa3">Red profesional</div>
        <div class="pastilla" id="pa4">Directorios</div>
      </div>
    </div>
  </div>
  <div id="paso"><span class="num">01</span><span class="raya"></span><span class="txt">Registro</span></div>
  <div id="rotulo"><div class="rot-caja"><div class="rot-eyebrow">AloVida</div><div class="rot-tit">Texto</div></div></div>
  <div id="pulso"></div>
  <div id="cursor"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2l7.5 19 2.4-7.6 7.6-2.4L4 2z" fill="#fff" stroke="#0B3953" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
</div>
<script>
/* ============================================================================
   El material de este video es el frontend de `mantra-core-health`: cada pantalla
   es su DOM y sus hojas de estilo, congelados por `extraer.mjs` y montados acá en
   un iframe. La animación se hace SOBRE ese DOM —se escribe en los campos reales,
   se revelan las tarjetas reales, se abre el menú real— así que no hay ni una
   caja dibujada a mano.

   Como en el primer video, cada fotograma es función pura de `t`: el capturador
   llama `__seek(t)` y fotografía.
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const VENT = $('#ventana'), CUR = $('#cursor'), PULSO = $('#pulso'),
      ROT = $('#rotulo'), ROTE = $('.rot-eyebrow'), ROTT = $('.rot-tit'), PASO = $('#paso');
const EZ = {
  out: p => 1 - Math.pow(1 - p, 3),
  out5: p => 1 - Math.pow(1 - p, 5),
  io:  p => (p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2),
  lin: p => p,
  atras: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); },
};
const PISTAS = [];
const pista = (t0, dur, fn, e = EZ.out) => PISTAS.push({ t0, t1: t0 + dur, fn, e });
const siempre = (fn) => PISTAS.push({ t0: 0, t1: 0, e: EZ.lin, fn });
const mez = (a, b, p) => a + (b - a) * p;
function trans(el, o){
  const s = el.__t = Object.assign({ x:0, y:0, s:1 }, el.__t, o);
  el.style.transform = `translate3d(${s.x}px,${s.y}px,0) scale(${s.s})`;
}
const opa  = (el,t0,dur,a,b,e) => pista(t0,dur,p => el.style.opacity = mez(a,b,p), e);
const desY = (el,t0,dur,a,b,e) => pista(t0,dur,p => trans(el,{y:mez(a,b,p)}), e);

/* --- las pantallas del repositorio, cada una en su iframe --- */
const PANTALLAS = ['registro-tipos','registro-medico','paciente-turnos','paciente-citas',
                   'medico-pago','medico-consulta','red-muro','directorio-medicos','directorio-clinicas'];
const marcos = {};
for (const nombre of PANTALLAS){
  const f = document.createElement('iframe');
  f.src = `pantallas/${nombre}.html`;
  f.dataset.nombre = nombre;
  VENT.appendChild(f);
  marcos[nombre] = f;
}
const doc = (n) => marcos[n].contentDocument;
const uno = (n, sel) => doc(n).querySelector(sel);
const todos = (n, sel) => [...doc(n).querySelectorAll(sel)];
/** El elemento cuyo texto contiene `txt` (como lo buscaría una persona). */
const porTexto = (n, sel, txt) => todos(n, sel).find((e) => (e.innerText ?? '').includes(txt));
/** Centro de un elemento del iframe, en coordenadas del escenario. */
const centro = (el) => {
  const r = el.getBoundingClientRect();
  return { x: 200 + r.left + r.width/2, y: 70 + r.top + r.height/2 };
};

/* --- una pantalla entra y sale --- */
function pantalla(nombre, t0, t1, { ent = .55, sal = .5 } = {}){
  const f = marcos[nombre];
  /* fuera de su tramo la pantalla no se pinta: nueve iframes vivos a la vez
     cuestan carísimo cuando hay que fotografiar 2 760 fotogramas */
  siempre((_, t) => { f.style.display = (t >= t0 - .3 && t <= t1 + .3) ? 'block' : 'none'; });
  opa(f, t0, ent, 0, 1);
  pista(t0, ent + .5, p => trans(f, { s: mez(.992, 1, p) }), EZ.out);
  opa(f, t1 - sal, sal, 1, 0, EZ.lin);
  return f;
}
/** Revela elementos REALES de la pantalla, uno tras otro, como el primer video. */
function aparecer(els, t0, { paso = .09, dur = .5, dy = 22 } = {}){
  els.forEach((el, i) => {
    const ti = t0 + i * paso;
    pista(ti, dur, p => { el.style.opacity = p; el.style.transform = `translateY(${mez(dy,0,p)}px)`; }, EZ.out);
    siempre((_, t) => { if (t < ti) { el.style.opacity = 0; el.style.transform = `translateY(${dy}px)`; } });
  });
}
/** Escribe en un campo real de la aplicación, letra por letra. */
function teclear(el, texto, t0, dur){
  const escribir = (n) => {
    const v = texto.slice(0, n);
    if ('value' in el) el.value = v; else el.textContent = v;
  };
  pista(t0, dur, p => escribir(Math.round(p * texto.length)), EZ.lin);
  siempre((_, t) => { if (t < t0) escribir(0); });
}
/** Enciende o apaga algo de la pantalla en un instante dado. */
function verEn(el, t0, { dur = .35, escala = false } = {}){
  siempre((_, t) => { if (t < t0) { el.style.opacity = 0; el.style.pointerEvents = 'none'; } });
  pista(t0, dur, p => {
    el.style.opacity = p;
    if (escala) el.style.transform = `scale(${mez(.94, 1, p)})`;
  }, EZ.out);
}
const ocultarEn = (el, t0, dur = .3) => pista(t0, dur, p => el.style.opacity = 1 - p, EZ.lin);
/** Cambia clases y texto de un elemento real (el estado que la aplicación pintaría). */
function estadoEn(el, t0, { quita = [], pone = [], texto = null } = {}){
  const antes = texto === null ? null : el.textContent;
  siempre((_, t) => {
    const ya = t >= t0;
    quita.forEach((c) => el.classList.toggle(c, !ya));
    pone.forEach((c) => el.classList.toggle(c, ya));
    if (texto !== null) el.textContent = ya ? texto : antes;
  });
}

/* --- puntero --- */
let ultimo = () => ({ x: 1760, y: 1040 });
const cursorVisible = (t0, dur, a, b) => opa(CUR, t0, dur, a, b, EZ.lin);
function cursorA(t0, dur, destino){
  const desde = ultimo;
  pista(t0, dur, p => {
    const a = desde(), b = destino();
    const arco = Math.sin(Math.PI*p) * -Math.min(80, Math.abs(b.x - a.x) * .13);
    CUR.style.left = mez(a.x, b.x, p) + 'px';
    CUR.style.top  = (mez(a.y, b.y, p) + arco) + 'px';
  }, EZ.io);
  ultimo = destino;
}
function clic(t0){
  const d = ultimo;
  pista(t0, .001, () => { const c = d(); PULSO.style.left = c.x + 'px'; PULSO.style.top = c.y + 'px'; }, EZ.lin);
  pista(t0, .42, p => { PULSO.style.opacity = (1 - p) * .9; trans(PULSO, { s: mez(.35, 1.5, p) }); });
  pista(t0, .10, p => trans(CUR, { s: mez(1, .82, p) }));
  pista(t0 + .10, .16, p => trans(CUR, { s: mez(.82, 1, p) }));
}

/* --- rótulos --- */
function rotulo(t0, dur, eyebrow, titulo){
  pista(t0, .001, () => { ROTE.textContent = eyebrow; ROTT.textContent = titulo; }, EZ.lin);
  opa(ROT, t0, .45, 0, 1); desY(ROT, t0, .5, 22, 0);
  opa(ROT, t0 + dur - .4, .4, 1, 0, EZ.lin);
}
function paso(t0, dur, num, txt){
  pista(t0, .001, () => { $('#paso .num').textContent = num; $('#paso .txt').textContent = txt; }, EZ.lin);
  opa(PASO, t0, .4, 0, 1);
  opa(PASO, t0 + dur - .35, .35, 1, 0, EZ.lin);
}

/* ===================== el guion ===================== */
function construir(){
  /* --- 00 · marca --- */
  const mIn = $('#marcaIn');
  $('#wmIn').innerHTML = 'AloVida'.split('').map((c,i) => `<span id="l${i}">${c}</span>`).join('');
  opa(mIn, 0, .5, 0, 1, EZ.lin);
  opa(mIn, 5.7, .6, 1, 0, EZ.lin);
  $('#logoIn').style.opacity = 0;
  opa($('#logoIn'), .15, .7, 0, 1);
  pista(.15, 1.1, p => trans($('#logoIn'), { s: mez(.78, 1, p) }), EZ.atras);
  for (let i = 0; i < 7; i++){ const l = $('#l'+i); l.style.opacity = 0; opa(l, .85 + i*.07, .5, 0, 1); desY(l, .85 + i*.07, .6, 24, 0); }
  pista(1.7, .8, p => $('#lineaIn').style.width = (230*p) + 'px');
  { const c = $('#claimIn'); c.style.opacity = 0; opa(c, 2.1, .7, 0, 1); desY(c, 2.1, .8, 16, 0); }
  [['#a1',0],['#a2',.5],['#a3',1]].forEach(([sel,off]) => {
    const el = $(sel);
    pista(.2+off, 4.4, p => { el.style.opacity = Math.sin(Math.PI*p)*.5; trans(el,{s:mez(.55,2.6,p)}); }, EZ.lin);
  });
  opa(VENT, 5.9, .6, 0, 1);

  /* --- 01 · registro --- */
  pantalla('registro-tipos', 6.0, 14.2);
  const tipos = todos('registro-tipos', '.tipos__card');
  aparecer(tipos, 6.8, { paso: .1 });
  const medicoCard = tipos[1];
  cursorVisible(7.9, .4, 0, 1);
  cursorA(8.1, 1.1, () => centro(medicoCard));
  clic(9.3);
  pista(9.3, .16, p => medicoCard.style.transform = `translateY(0) scale(${mez(1,.985,p)})`, EZ.out);
  pista(9.46, .22, p => medicoCard.style.transform = `translateY(0) scale(${mez(.985,1,p)})`, EZ.out);
  cursorVisible(9.9, .45, 1, 0);

  pantalla('registro-medico', 14.0, 22.2);
  teclear(uno('registro-medico', 'input[placeholder="Ana"]'), 'Valeria', 15.3, 1.0);
  teclear(uno('registro-medico', 'input[placeholder="Rojas"]'), 'Rojas Mendoza', 16.7, 1.5);
  aparecer(todos('registro-medico', '.ayuda__tarjeta'), 18.9, { paso: .18, dy: 18 });

  paso(6.4, 15.4, '01', 'Registro');
  rotulo(6.9, 4.0, 'Registro', 'Cinco tipos de cuenta, y cada una pide lo suyo.');
  rotulo(14.7, 4.4, 'Registro · médico', 'El alta del profesional, paso a paso.');

  /* --- 02 · el paciente pide turno --- */
  pantalla('paciente-turnos', 22.0, 33.6);
  teclear(uno('paciente-turnos', 'main input[type="text"]'), 'Valeria Rojas Mendoza', 22.9, 1.4);
  const horarios = todos('paciente-turnos', '.turnos__horario');
  aparecer(horarios, 24.6, { paso: .13 });
  const pedir = horarios[0].querySelector('a.btn');
  cursorVisible(25.7, .4, 0, 1);
  cursorA(25.9, 1.1, () => centro(pedir));
  clic(27.1);
  pista(27.1, .16, p => pedir.style.transform = `scale(${mez(1,.95,p)})`, EZ.out);
  pista(27.26, .22, p => pedir.style.transform = `scale(${mez(.95,1,p)})`, EZ.out);
  cursorVisible(27.8, .45, 1, 0);

  pantalla('paciente-citas', 33.4, 40.8);
  aparecer(todos('paciente-citas', '.turnos__item'), 34.1, { paso: .07, dy: 16 });

  paso(22.2, 18.2, '02', 'El paciente pide turno');
  rotulo(22.6, 3.6, 'Paciente', 'Buscás al profesional por su nombre.');
  rotulo(26.3, 3.4, 'Paciente', 'Y pedís el horario que te sirve.');
  rotulo(34.3, 4.0, 'Paciente', 'La cita queda pedida, con su estado.');

  /* --- 03 · la agenda y el cobro --- */
  pantalla('medico-pago', 40.6, 51.8);
  aparecer(todos('medico-pago', 'tbody tr'), 41.2, { paso: .06, dy: 14 });
  const menu = uno('medico-pago', 'app-menu.menu--open');
  const lapiz = todos('medico-pago', 'tbody tr')[1].querySelector('.agenda__pago button');
  const chip = todos('medico-pago', 'tbody tr')[1].querySelector('app-badge');
  const opcionPagada = todos('medico-pago', 'app-menu.menu--open .menu-item')
    .find((e) => e.innerText.trim() === 'Pagada');
  cursorVisible(42.7, .4, 0, 1);
  cursorA(42.9, 1.1, () => centro(lapiz));
  clic(44.1);
  verEn(menu, 44.25, { dur: .3, escala: true });
  cursorA(45.5, 1.0, () => centro(opcionPagada));
  clic(46.6);
  ocultarEn(menu, 46.8, .25);
  estadoEn(chip, 47.0, { quita: ['badge--warning','tone--warning'], pone: ['badge--success','tone--success'], texto: 'Pagada' });
  pista(47.0, .5, p => chip.style.transform = `scale(${mez(1.14,1,p)})`, EZ.atras);
  cursorVisible(47.1, .45, 1, 0);

  paso(40.8, 11.2, '03', 'La agenda y el cobro');
  rotulo(41.4, 4.0, 'Médico', 'Motivo, seguro, estado y pago en la misma fila.');
  rotulo(45.6, 4.2, 'Cobros', 'El estado del pago se marca sin salir de la agenda.');

  /* --- 04 · la consulta --- */
  pantalla('medico-consulta', 51.6, 59.0);
  const casillas = todos('medico-consulta', '.consulta__casilla');
  aparecer(casillas, 52.3, { paso: .08, dy: 18 });
  const dx = casillas.find((e) => e.innerText.includes('Diagnóstico'));
  cursorVisible(54.1, .4, 0, 1);
  cursorA(54.3, 1.0, () => centro(dx));
  clic(55.4);
  pista(55.4, .16, p => dx.style.transform = `translateY(0) scale(${mez(1,.98,p)})`, EZ.out);
  pista(55.56, .22, p => dx.style.transform = `translateY(0) scale(${mez(.98,1,p)})`, EZ.out);
  cursorVisible(56.0, .45, 1, 0);

  paso(51.8, 7.4, '04', 'La consulta');
  rotulo(52.4, 4.4, 'Médico', 'Todo lo que se registra durante la consulta.');

  /* --- 05 · la red social --- */
  pantalla('red-muro', 58.8, 69.6);
  const texto = 'Ya está cargado el arancel odontológico 2026 en el catálogo de servicios: endodoncia, periodoncia, ortodoncia y odontopediatría tienen su precio de referencia. #aranceles #odontología';
  teclear(uno('red-muro', 'main textarea'), texto, 59.7, 4.4);
  const publicar = todos('red-muro', 'button').find((e) => e.innerText.trim() === 'Publicar');
  /* el botón se habilita mientras hay texto y el campo se vacía al publicar, como en la aplicación */
  if (publicar) siempre((_, t) => {
    const activo = t >= 59.9 && t < 65.7;
    publicar.toggleAttribute('disabled', !activo);
    publicar.setAttribute('aria-disabled', String(!activo));
  });
  { const ta = uno('red-muro', 'main textarea');
    siempre((_, t) => { if (t >= 65.75) ta.value = ''; }); }
  const nueva = todos('red-muro', '.card').find((e) => e.innerText.includes('#aranceles'));
  cursorVisible(64.3, .4, 0, 1);
  cursorA(64.5, 1.0, () => centro(publicar));
  clic(65.6);
  cursorVisible(66.0, .45, 1, 0);
  if (nueva) aparecer([nueva], 65.9, { dur: .6, dy: 26 });

  paso(59.0, 10.8, '05', 'La red social');
  rotulo(59.6, 4.2, 'Red social', 'Escribís, y elegís quién puede leerlo.');
  rotulo(65.7, 3.4, 'Red social', 'Queda publicado, con sus etiquetas.');

  /* --- 06 · los directorios --- */
  pantalla('directorio-medicos', 69.4, 76.6);
  aparecer(todos('directorio-medicos', '.rejilla__tarjeta'), 70.1, { paso: .035, dur: .45, dy: 16 });

  pantalla('directorio-clinicas', 76.4, 84.0);
  const mapa = uno('directorio-clinicas', 'main svg');
  if (mapa) { mapa.style.opacity = 0; verEn(mapa, 77.0, { dur: .6 }); }
