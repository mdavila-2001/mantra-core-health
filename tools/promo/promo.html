<!doctype html>
<meta charset="utf-8">
<title>AloVida — video promocional</title>
<style>
@font-face{font-family:Poppins;src:url(assets/poppins-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:Poppins;src:url(assets/poppins-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(assets/poppins-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Inter Variable';src:url(assets/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:block}

:root{
  --petroleo:#0B557E; --petroleo-h:#0B4768; --petroleo-p:#0B3953; --petroleo-x:#072F45;
  --aguamarina:#4FB3A9; --menta:#9FD8D0; --ambar:#E4A96B; --salvia:#CDD9D5; --marfil:#F6F3ED;
  --tinta:#242828; --tinta-2:#4E5151; --tinta-3:#787B7B;
  --filete:#CDD9D5; --filete-2:#E3EAE7; --inset:#F9F8F4;
  --ok-bg:#DFEDE9; --ok-tinta:#27725C; --aviso-bg:#FBF2E8; --aviso-tinta:#5E4B35;
  --info-bg:#E4F3F2; --info-tinta:#33706C; --neutro-bg:#F3F6F5; --neutro-tinta:#4E5151;
  --sans:'Inter Variable',system-ui,sans-serif; --display:Poppins,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{font-family:var(--sans);color:var(--tinta);-webkit-font-smoothing:antialiased}

#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff}
#wash{position:absolute;inset:0;
  background:
    radial-gradient(1100px 700px at 8% -10%, rgba(79,179,169,.16), transparent 60%),
    radial-gradient(900px 620px at 100% 108%, rgba(11,85,126,.13), transparent 62%),
    #fff;}
#grano{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(11,85,126,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,85,126,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(1400px 900px at 50% 45%,#000 20%,transparent 78%)}

.escena{position:absolute;inset:0;opacity:0;will-change:opacity,transform}

/* ---------- marca ---------- */
.marca{display:grid;place-items:center;height:100%;background:
  radial-gradient(1200px 820px at 20% 0%, #0E6A95 0%, transparent 55%),
  radial-gradient(1000px 700px at 90% 100%, #10796F 0%, transparent 52%),
  linear-gradient(140deg,#0B557E 0%,#0B3953 48%,#072F45 100%)}
.marca .pulso{position:absolute;inset:0;overflow:hidden}
.marca .anillo{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;border:1.5px solid rgba(159,216,208,.35)}
.marca-centro{position:relative;text-align:center}
.marca-centro img{width:210px;display:block;margin:0 auto 34px}
.marca-wordmark{font-family:var(--display);font-weight:700;font-size:118px;letter-spacing:-.02em;color:#fff;line-height:1}
.marca-wordmark span{display:inline-block}
.marca-linea{width:0;height:3px;background:linear-gradient(90deg,var(--menta),var(--aguamarina));margin:30px auto 26px;border-radius:3px}
.marca-claim{font-family:var(--display);font-weight:500;font-size:34px;color:#CFE7E3;letter-spacing:.01em}
.marca-pie{margin-top:18px;font-size:21px;color:rgba(255,255,255,.62);letter-spacing:.14em;text-transform:uppercase}

/* ---------- ventana de aplicación ---------- */
.ventana{position:absolute;left:200px;top:118px;width:1520px;height:846px;background:#fff;border-radius:22px;
  border:1px solid var(--filete-2);box-shadow:0 48px 96px -32px rgba(11,57,83,.38),0 8px 24px rgba(11,57,83,.10);overflow:hidden;display:flex}
.ventana.publica{display:block;top:196px;height:688px}
.lateral{width:252px;flex:0 0 252px;background:linear-gradient(176deg,#0B557E 0%,#0B3953 100%);color:#fff;padding:26px 18px;position:relative}
.lateral::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.10)}
.lat-marca{display:flex;align-items:center;gap:11px;padding:0 8px 26px}
.lat-marca img{width:34px}
.lat-marca b{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.lat-grupo{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.46);padding:18px 10px 8px}
.lat-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-size:16px;color:rgba(255,255,255,.80);margin-bottom:3px}
.lat-item.activo{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.lat-item .pt{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.34);flex:0 0 9px;margin:0 4px}
.lat-item.activo .pt{background:var(--menta);box-shadow:0 0 0 4px rgba(159,216,208,.20)}

.cuerpo{flex:1;display:flex;flex-direction:column;min-width:0}
.barra{height:70px;flex:0 0 70px;background:var(--inset);border-bottom:1px solid var(--filete-2);display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.barra .miga{font-size:15px;color:var(--tinta-3)}
.barra .miga b{color:var(--petroleo);font-weight:600}
.barra .der{display:flex;align-items:center;gap:16px}
.sede{display:flex;align-items:center;gap:9px;border:1px solid var(--filete);background:#fff;border-radius:11px;padding:9px 15px;font-size:15px;color:var(--tinta-2)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--menta);color:var(--petroleo-p);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--display)}
.lienzo{flex:1;padding:34px 40px;overflow:hidden;position:relative;background:#fff}

h1.tit{font-family:var(--display);font-weight:600;font-size:38px;color:var(--petroleo);letter-spacing:-.01em}
p.baj{font-size:18px;color:var(--tinta-2);margin-top:8px}
.fila-tit{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}

.pest{display:flex;gap:30px;border-bottom:1px solid var(--filete-2);margin-bottom:26px}
.pest div{padding:0 2px 13px;font-size:17px;color:var(--tinta-3);position:relative}
.pest div.on{color:var(--petroleo);font-weight:600}
.pest div.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--petroleo);border-radius:3px}

.tarjeta{background:#fff;border:1px solid var(--filete-2);border-radius:16px;padding:22px 24px;box-shadow:0 2px 10px rgba(11,57,83,.05)}
.insignia{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;letter-spacing:.01em}
.i-espera{background:var(--aviso-bg);color:var(--aviso-tinta)}
.i-ok{background:var(--ok-bg);color:var(--ok-tinta)}
.i-info{background:var(--info-bg);color:var(--info-tinta)}
.i-neutro{background:var(--neutro-bg);color:var(--neutro-tinta)}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--petroleo);color:#fff;border-radius:12px;padding:13px 24px;font-size:16px;font-weight:600;font-family:var(--sans)}
.boton.fant{background:#fff;color:var(--petroleo);border:1px solid var(--filete)}
.boton.ambar{background:var(--ambar);color:#3A2B18}

/* cursor */
#cursor{position:absolute;width:30px;height:30px;left:0;top:0;z-index:60;pointer-events:none;opacity:0;
  filter:drop-shadow(0 4px 8px rgba(7,47,69,.4))}
#cursor svg{display:block}
#pulsoclick{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:2px solid var(--aguamarina);opacity:0;z-index:59}

/* rótulos */
#rotulo{position:absolute;left:200px;bottom:62px;z-index:70;opacity:0}
.rot-caja{display:inline-block;background:linear-gradient(120deg,rgba(11,85,126,.97),rgba(11,57,83,.97));backdrop-filter:blur(6px);
  border-radius:18px;padding:22px 32px 24px;box-shadow:0 22px 44px -18px rgba(7,47,69,.6)}
.rot-eyebrow{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--menta);font-weight:600;margin-bottom:9px}
.rot-tit{font-family:var(--display);font-weight:600;font-size:34px;color:#fff;letter-spacing:-.005em}
#paso{position:absolute;left:200px;top:56px;z-index:70;display:flex;align-items:center;gap:14px;opacity:0}
#paso .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--petroleo)}
#paso .raya{width:64px;height:2px;background:var(--aguamarina);border-radius:2px}
#paso .txt{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3);font-weight:600}

/* aviso flotante */
.aviso{position:absolute;right:38px;top:104px;z-index:50;display:flex;align-items:center;gap:13px;background:#fff;
  border:1px solid var(--filete-2);border-left:4px solid var(--aguamarina);border-radius:14px;padding:15px 22px;
  box-shadow:0 18px 40px -16px rgba(11,57,83,.4);opacity:0}
.aviso .ic{width:30px;height:30px;border-radius:50%;background:var(--ok-bg);color:var(--ok-tinta);display:grid;place-items:center;font-weight:700;font-size:16px}
.aviso b{font-size:17px;font-weight:600;color:var(--tinta)}
.aviso span{display:block;font-size:14px;color:var(--tinta-3);margin-top:2px}
</style>
<div id="stage">
  <div id="wash"></div>
  <div id="grano"></div>
  <div id="escenas"></div>
  <div id="paso"><span class="num">01</span><span class="raya"></span><span class="txt">Registro</span></div>
  <div id="rotulo"><div class="rot-caja"><div class="rot-eyebrow">AloVida</div><div class="rot-tit">Texto</div></div></div>
  <div id="pulsoclick"></div>
  <div id="cursor"><svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 2l7.5 19 2.4-7.6 7.6-2.4L4 2z" fill="#fff" stroke="#0B3953" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
</div>
<script>
/* ============================================================================
   Motor determinista: todo fotograma es funcion pura de t (segundos).
   El capturador llama window.__seek(t) y fotografia. Sin animaciones CSS.
   ========================================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const ESC = $('#escenas'), CUR = $('#cursor'), PULSO = $('#pulsoclick'),
      ROT = $('#rotulo'), ROTE = $('.rot-eyebrow'), ROTT = $('.rot-tit'), PASO = $('#paso');
const EZ = {
  out:  p => 1 - Math.pow(1-p, 3),
  out5: p => 1 - Math.pow(1-p, 5),
  io:   p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2,
  lin:  p => p,
  atras:p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); },
};
const PISTAS = [];
const pista = (t0, dur, fn, e=EZ.out) => PISTAS.push({t0, t1:t0+dur, fn, e});
const mez = (a,b,p) => a + (b-a)*p;

function trans(el, o){
  const s = el.__t = Object.assign({x:0,y:0,s:1,r:0}, el.__t, o);
  el.style.transform = `translate3d(${s.x}px,${s.y}px,0) scale(${s.s}) rotate(${s.r}deg)`;
}
const opa  = (el,t0,dur,a,b,e) => pista(t0,dur,p=>el.style.opacity = mez(a,b,p), e);
const desY = (el,t0,dur,a,b,e) => pista(t0,dur,p=>trans(el,{y:mez(a,b,p)}), e);
const desX = (el,t0,dur,a,b,e) => pista(t0,dur,p=>trans(el,{x:mez(a,b,p)}), e);
const esc  = (el,t0,dur,a,b,e) => pista(t0,dur,p=>trans(el,{s:mez(a,b,p)}), e);
const entra = (el,t0,dur=.55,dy=26) => { opa(el,t0,dur,0,1); desY(el,t0,dur,dy,0); };

function tecleo(el, texto, t0, dur){
  pista(t0, dur, p => {
    const n = Math.round(p * texto.length);
    el.textContent = texto.slice(0, n);
    el.dataset.cursor = (p < 1 && Math.floor((t0 + p*dur)*2) % 2 === 0) ? '1' : '0';
  }, EZ.lin);
}

/* --- cursor: cadena cronologica de destinos resueltos por selector --- */
let ultimoDestino = () => ({x:1700, y:1000});
const centro = sel => {
  const r = $(sel).getBoundingClientRect();
  return {x:r.left + r.width/2, y:r.top + r.height/2};
};
const punto = (sel, dx=0, dy=0) => () => { const c = centro(sel); return {x:c.x+dx, y:c.y+dy}; };

function cursorVisible(t0, dur, a, b){ opa(CUR, t0, dur, a, b, EZ.lin); }
function cursorA(t0, dur, destino){
  const desde = ultimoDestino, hasta = destino;
  pista(t0, dur, p => {
    const a = desde(), b = hasta();
    const arco = Math.sin(Math.PI*p) * -Math.min(90, Math.abs(b.x-a.x)*0.14);
    CUR.style.left = mez(a.x, b.x, p) + 'px';
    CUR.style.top  = (mez(a.y, b.y, p) + arco) + 'px';
  }, EZ.io);
  ultimoDestino = destino;
}
function clic(t0){
  const d = ultimoDestino;
  pista(t0, .001, () => { const c = d(); PULSO.style.left = c.x+'px'; PULSO.style.top = c.y+'px'; }, EZ.lin);
  pista(t0, .42, p => { PULSO.style.opacity = (1-p)*0.9; trans(PULSO,{s:mez(.35,1.5,p)}); }, EZ.out);
  pista(t0, .10, p => trans(CUR,{s:mez(1,.82,p)}), EZ.out);
  pista(t0+.10, .16, p => trans(CUR,{s:mez(.82,1,p)}), EZ.out);
}

/* --- rotulos --- */
function rotulo(t0, dur, eyebrow, titulo){
  pista(t0, .001, () => { ROTE.textContent = eyebrow; ROTT.textContent = titulo; }, EZ.lin);
  opa(ROT, t0, .45, 0, 1); desY(ROT, t0, .5, 24, 0);
  opa(ROT, t0+dur-.4, .4, 1, 0, EZ.lin);
}
function paso(t0, dur, num, txt){
  pista(t0, .001, () => { $('#paso .num').textContent = num; $('#paso .txt').textContent = txt; }, EZ.lin);
  opa(PASO, t0, .4, 0, 1); desX(PASO, t0, .5, -18, 0);
  opa(PASO, t0+dur-.35, .35, 1, 0, EZ.lin);
}

/* --- escenas --- */
function nuevaEscena(html){
  const d = document.createElement('div');
  d.className = 'escena';
  d.innerHTML = html;
  ESC.appendChild(d);
  return d;
}
function vive(el, t0, t1, opts={}){
  const ent = opts.ent ?? .6, sal = opts.sal ?? .5;
  opa(el, t0, ent, 0, 1, EZ.out);
  esc(el, t0, ent+.4, opts.s0 ?? .985, 1, EZ.out);
  opa(el, t1-sal, sal, 1, 0, EZ.lin);
  pista(t1-sal, sal, p => trans(el,{s:mez(1, opts.s1 ?? 1.012, p)}), EZ.lin);
}

/* --- piezas de interfaz --- */
const LOGO = 'assets/alovida-logo.svg', LOGOB = 'assets/alovida-logo-blanco.svg';
const item = (txt, on) => `<div class="lat-item${on?' activo':''}"><i class="pt"></i>${txt}</div>`;
function shell(o){
  return `<div class="ventana" id="${o.id}">
    <aside class="lateral">
      <div class="lat-marca"><img src="${LOGOB}" alt=""><b>AloVida</b></div>
      ${o.nav}
    </aside>
    <div class="cuerpo">
      <div class="barra">
        <div class="miga">${o.miga}</div>
        <div class="der"><div class="sede">${o.sede}</div><div class="ava">${o.ini}</div></div>
      </div>
      <div class="lienzo">${o.lienzo}</div>
    </div>
  </div>`;
}
</script>
<style>
/* ---------- registro publico ---------- */
.marca-barra{height:80px;background:linear-gradient(100deg,#0B557E,#0B3953);display:flex;align-items:center;justify-content:space-between;padding:0 36px}

.reg-cuerpo{padding:44px 90px}
.opciones{display:flex;gap:26px;margin-top:34px}
.opcion{flex:1;border:1.5px solid var(--filete-2);border-radius:20px;padding:28px 26px;background:#fff;position:relative;box-shadow:0 2px 12px rgba(11,57,83,.05)}

.opcion h3{font-family:var(--display);font-weight:600;font-size:26px;color:var(--petroleo);margin-bottom:9px}

.form-reg{position:absolute;left:90px;right:90px;top:252px}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
.campo label{display:block;font-size:15px;font-weight:600;color:var(--tinta-2);margin-bottom:8px}
.campo .caja{height:56px;border:1.5px solid var(--filete);border-radius:13px;background:#fff;display:flex;align-items:center;padding:0 17px;font-size:17px;color:var(--tinta)}
.campo .caja.foco{border-color:var(--petroleo);box-shadow:0 0 0 4px rgba(11,85,126,.12)}
.campo .caja .ph{color:var(--tinta-3)}
.campo .caja[data-cursor="1"]::after{content:'';width:2px;height:22px;background:var(--petroleo);margin-left:2px}
.pie-form{display:flex;align-items:center;gap:18px;margin-top:34px}

/* ---------- buscador del paciente ---------- */
.buscador{border:1.5px solid var(--filete);border-radius:16px;height:74px;display:flex;align-items:center;gap:14px;padding:0 22px;font-size:20px;background:#fff;box-shadow:0 2px 12px rgba(11,57,83,.05)}
.buscador .lupa{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--petroleo);position:relative;flex:0 0 26px}
.buscador .lupa::after{content:'';position:absolute;right:-8px;bottom:-4px;width:11px;height:2.5px;background:var(--petroleo);transform:rotate(45deg)}
.fichas{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}
.ficha{border:1px solid var(--filete);border-radius:999px;padding:10px 18px;font-size:16px;color:var(--tinta-2);background:#fff}

.medicos{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.medico{display:flex;align-items:center;gap:20px;border:1.5px solid var(--filete-2);border-radius:16px;padding:18px 22px;background:#fff}
.medico .foto{width:62px;height:62px;border-radius:50%;background:linear-gradient(140deg,var(--menta),var(--aguamarina));display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:21px;color:var(--petroleo-p);flex:0 0 62px}

/* ---------- solicitudes del medico ---------- */
.sol{display:flex;align-items:center;gap:22px;border:1.5px solid var(--filete-2);border-radius:16px;padding:20px 24px;background:#fff;margin-bottom:14px}
.sol .foto{width:54px;height:54px;border-radius:50%;background:var(--inset);border:1px solid var(--filete-2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--petroleo);flex:0 0 54px}
.sol .dat{flex:1}
.sol .dat b{display:block;font-size:20px;font-weight:600;color:var(--tinta)}

window.__render = t => {
  for (const k of PISTAS){
    if (t < k.t0) continue;
    const p = k.t1 > k.t0 ? Math.min(1, (t - k.t0) / (k.t1 - k.t0)) : 1;
    k.fn(k.e(p), t);
  }
};
window.__seek = t => window.__render(t);
window.__render(0);
if (location.search.includes('play')){
  const t0 = performance.now();
  const bucle = () => {
    const t = ((performance.now() - t0)/1000) % DURACION;

    requestAnimationFrame(bucle);
  };
  requestAnimationFrame(bucle);
}
