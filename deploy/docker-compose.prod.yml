# Despliegue de referencia: frontend + reverse proxy, con la API detrás del
# MISMO dominio.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Es una **referencia funcional**, no la única forma de desplegar. Lo que
# importa reproducir, sea cual sea la plataforma:
#
#   1. Algo delante enruta los seis prefijos a la API y el resto al SSR.
#   2. `PUBLIC_API_BASE_URL` queda **vacía** — es la decisión tomada.
#   3. TLS termina en el proxy (o en el balanceador que esté delante de él).
#
# ⚠️  La API **no** está definida acá: vive en `mantra-core-health-redesa-api`.
#     Este compose asume que un servicio llamado `api` es alcanzable en la misma
#     red. Con la API en otro compose, hay que unir las redes o apuntar el
#     `upstream api` de `nginx.conf` a donde de verdad esté.

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # VACÍA, y no es un descuido: es la decisión de arquitectura. Rutas
        # relativas, un solo origen para el navegador, sin CORS que negociar y
        # con `connect-src 'self'` en la política de seguridad.
        #
        # Ponerle un valor acá exigiría CORS en la API, abrir `connect-src`, y
        # una imagen distinta por entorno.
        PUBLIC_API_BASE_URL: ''
    environment:
      PORT: 4000
      # El servidor lee esta variable para armar `connect-src`. Vacía = 'self'.
      # Tiene que coincidir con el `ARG` del build: son las dos mitades de la
      # misma decisión.
      PUBLIC_API_BASE_URL: ''
    expose:
      - '4000'
    restart: unless-stopped
    # El `HEALTHCHECK` viene en la imagen: pide `/auth`, que verifica que el
    # proceso responde Y que el artefacto del navegador está donde el servidor
    # lo busca.

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # `nginx.conf` incluye estos dos. Sin montarlos, nginx no arranca: muere con
      # `open() "/etc/nginx/api-locations.conf" failed` y el contenedor entra en bucle.
      - ./api-locations.conf:/etc/nginx/api-locations.conf:ro
      - ./api-proxy.conf:/etc/nginx/api-proxy.conf:ro
    restart: unless-stopped

# La red por defecto alcanza mientras la API viva en este mismo compose. Si vive
# en otro, declararla externa acá y unirla desde allá:
#
# networks:
#   default:
#     name: alovida
#     external: true
