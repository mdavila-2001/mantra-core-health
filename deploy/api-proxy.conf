# Reglas comunes de los seis prefijos que van a la API.
#
# Viven aparte para que las seis `location` no repitan siete líneas cada una:
# repetidas, un cambio se aplica a cinco y se olvida en la sexta, y el síntoma
# aparece en el módulo que nadie probó.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";

# TX-14: el id de correlación nace acá, no en la API. `$request_id` es la
# variable interna de nginx (hexadecimal, única por conexión); la API lo toma
# como propio SOLO porque llega detrás de este proxy de confianza
# (`TRUST_PROXY_HOPS`), lo repite en el log, en `correlationId` y lo hace eco
# en la respuesta. Sin esta línea, un 502 que nginx nunca llega a mandar a la
# API no tenía ningún id que la pantalla pudiera mostrar.
proxy_set_header X-Request-Id      $request_id;

# `Authorization` y `X-Tenant-Id` pasan solos: nginx reenvía las cabeceras de la
# petición salvo que se las quite. No hay que declararlas, y **no hay que tocar
# CORS**: para el navegador esto es el mismo origen.

# La API responde rápido o no responde. Un timeout generoso convierte una API
# caída en una pestaña colgada, cuando el frontend ya sabe mostrar el estado S8
# —«sin conexión», con botón de reintentar— si la petición falla pronto.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Sin buffering: una descarga grande no debe pasar por disco en el proxy.
proxy_buffering off;
