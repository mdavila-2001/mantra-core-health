# =========================================================================
# Log de acceso sin el token del enlace compartido de receta (S-6).
#
# El token es la credencial del enlace: quien lo lee en el log abre la receta.
# Viaja en la ruta de la página (`/rx/<token>`, también colgada de otra ruta,
# como la de la farmacia), en las tres rutas de la API que lo reciben, y en la
# query cuando el login vuelve a la receta (`/auth?returnUrl=%2Frx%2F<token>`).
# El `Referer` lo repite en cada petición que sale de esas páginas.
#
# `$request` (la línea cruda) y `$http_referer` no se escriben: el formato
# arma la línea con las versiones redactadas. `/verify/rx/<id>` lleva el id
# de la receta, que no es credencial, y queda como está.
#
# Se incluye en el contexto `http` (desde `conf.d/default.conf`) y cada
# `server` lo activa con `access_log … alovida_redacted`: declararlo a nivel
# `http` sumaría una segunda línea con el formato `main`, que sí lleva el token.
# =========================================================================

# 1 · El token en la ruta.
map $request_uri $alovida_uri_path_redacted {
    default $request_uri;
    "~^(?<pre>(?:/[^?#]*?)?(?<!/verify)/rx/+)[^/?#]+(?<post>.*)$" "${pre}[token]${post}";
    "~^(?<pre>/+(?:public|pharmacy)/+prescription-shares/+)[^/?#]+(?<post>.*)$" "${pre}[token]${post}";
    "~^(?<pre>/+clinical/+prescription-shares/+by-token/+)[^/?#]+(?<post>.*)$" "${pre}[token]${post}";
}

# 2 · El token en la query, con la ruta codificada o no.
map $alovida_uri_path_redacted $alovida_uri_redacted {
    default $alovida_uri_path_redacted;
    "~*^(?<pre>[^?#]*[?#].*?(?<!verify)(?:/|%2F|%252F)(?:rx|prescription-shares|by-token)(?:/|%2F|%252F)+)[A-Za-z0-9_-]{20,}(?<post>.*)$" "${pre}[token]${post}";
}

# 3 · Lo mismo en el `Referer`.
map $http_referer $alovida_referer_path_redacted {
    default $http_referer;
    "~^(?<pre>[a-z]+://[^/]+(?:/[^?#]*?)?(?<!/verify)/rx/+)[^/?#]+(?<post>.*)$" "${pre}[token]${post}";
}

map $alovida_referer_path_redacted $alovida_referer_redacted {
    default $alovida_referer_path_redacted;
    "~*^(?<pre>[^?#]*[?#].*?(?<!verify)(?:/|%2F|%252F)(?:rx|prescription-shares|by-token)(?:/|%2F|%252F)+)[A-Za-z0-9_-]{20,}(?<post>.*)$" "${pre}[token]${post}";
}

# El formato `combined` de nginx, con la ruta y el `Referer` redactados.
log_format alovida_redacted '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $alovida_uri_redacted $server_protocol" '
                            '$status $body_bytes_sent "$alovida_referer_redacted" '
                            '"$http_user_agent"';
