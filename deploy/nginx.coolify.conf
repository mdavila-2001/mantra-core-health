# =========================================================================
# Reverse proxy del despliegue en Coolify.
#
# Es el MISMO enrutado que `nginx.conf` —de hecho incluye el mismo
# `api-locations.conf`— y se diferencia en dos cosas, las dos por tener el
# Traefik de Coolify delante:
#
#   1. NO valida el `Host`. `nginx.conf` devuelve 421 a los dominios que no
#      reconoce porque puede estar expuesto directo; aquí, en cambio, lo único
#      que llega a este contenedor es lo que Traefik ya enrutó al dominio
#      configurado en Coolify. Repetir la lista de dominios en este archivo
#      significaría tener que editarlo y redesplegar cada vez que cambia el
#      dominio, para una comprobación que ya hizo el salto anterior.
#
#   2. NO termina TLS. Lo hace Traefik, con el certificado que Coolify
#      gestiona. Aquí solo se escucha en el 80 de la red interna, que no está
#      publicado en el host.
#
# Lo que sí es idéntico y no es negociable: los prefijos de la API van a la
# API, `/otel` va al servidor de renderizado, y todo lo demás también. La lista
# vive en un solo archivo justamente para que estos dos proxies no puedan
# divergir.
# =========================================================================

upstream api {
    # Nombre del servicio de la API en la red `alovida`, compartida con el
    # stack de `mantra-core-health-api`. El alias está declarado explícito en
    # aquel compose porque Coolify renombra los contenedores.
    server api:3000;
    keepalive 32;
}

upstream frontend {
    # El servidor SSR de este repositorio (`dist/…/server/server.mjs`).
    server web:4000;
    keepalive 32;
}

# Límite de tasa de la telemetría del navegador, por dirección de origen. Un
# navegador exporta un lote cada cinco segundos: 12 por minuto y por pestaña.
limit_req_zone $binary_remote_addr zone=otel:10m rate=60r/m;

server {
    listen 80 default_server;

    # `_` y no una lista de dominios: ver el punto 1 de la cabecera.
    server_name _;

    # Un documento clínico puede pesar. El límite real lo pone la API; éste
    # solo evita que una subida absurda llegue hasta ella.
    client_max_body_size 12M;

    # Ni una versión de nginx en las respuestas: es superficie de ataque
    # gratuita en un servidor público.
    server_tokens off;

    # ─── 1 · La API ─────────────────────────────────────────────────────────
    #
    # El mismo archivo que incluye `nginx.conf`. Incluye también `/socket.io/`,
    # el gateway de mensajería en tiempo real.
    include /etc/nginx/api-locations.conf;

    # ─── 2 · Las trazas del navegador ───────────────────────────────────────
    #
    # Van al servidor de renderizado, NO a la API: `otel-gateway.ts` las
    # reenvía al colector. Existe aparte del `location /` de abajo por los tres
    # controles que aplica, que son lo único que protege un endpoint que no
    # puede autenticarse — cualquier credencial que usara el navegador viajaría
    # en el paquete que descarga todo el mundo.
    location ^~ /otel/ {
        limit_except POST { deny all; }
        limit_req zone=otel burst=20 nodelay;
        client_max_body_size 512k;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 10s;
    }

    # ─── 3 · Todo lo demás: el servidor SSR ─────────────────────────────────
    #
    # Los estáticos incluidos: `src/server.ts` ya los sirve con `maxAge: 1y` y
    # **emite las cabeceras de seguridad**. Servirlos desde nginx las perdería,
    # salvo repitiéndolas aquí — y dos fuentes para la misma política es cómo
    # se separan.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # `$scheme` aquí siempre es `http`, porque TLS terminó en Traefik. Se
        # toma el valor que Traefik ya escribió, o el esquema local si no vino
        # ninguno: sin esto la aplicación construiría URL absolutas con `http`
        # detrás de un dominio con certificado.
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_read_timeout 30s;
    }
}

# `$proxy_x_forwarded_proto`: el valor que llegó de Traefik, con `$scheme` como
# respaldo cuando nadie lo puso (una petición directa dentro de la red).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
