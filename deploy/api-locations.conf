location ^~ /admin/catalog           { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /admin/analytics         { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /admin/qa                { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /admin/ops               { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# Tablero de siniestralidad (subtarea 3.1, v4.2.14), portabilidad de póliza y
# siniestralidad a 1 clic (subtarea 3.3) y las mutaciones de la consola de
# planes que quedaron sin prefijo desde la 2.1: ninguna ruta del router de
# Angular empieza con `/insurance-plans`, `/insurance-products`,
# `/insurance/analytics` ni `/insurance/portability`.
location ^~ /insurance-plans         { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance-products      { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance/analytics     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance/portability   { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# La billetera de puntos (módulo de promociones) y las reseñas del paciente
# (H3.S1, 2026-09-26): faltaban en las tres declaraciones y caían en el
# `location /` de abajo — el SSR contestaba HTML con 200 donde el cliente
# esperaba JSON. **Sin barra final en `/patients/me/reviews`**: el cliente
# (`community.client.ts:802`) llama exactamente esa ruta pelada —
# `POST /patients/me/reviews`—, y con barra final nginx no la matchea y cae
# al SSR igual (verificado: daba 301 a la versión con barra, nunca al API).
# El prefijo de tres segmentos ya es inequívoco frente al router de Angular,
# igual que `/admin/tenants`: no hace falta la barra para eso.
location ^~ /loyalty/                { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /patients/me/reviews     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# El triage por IA (H3.S2, D-C sin resolver: docs/progress/DECISIONS.md). El
# servicio manda **texto clínico sin autenticar** a una IP pública escrita en
# el repo — regla 90.2.4, PHI nunca a un tercero no acordado—, así que hasta
# que el propietario elija quién lo atiende y con qué base legal, la Opción C
# del prompt de enrutado es la única segura: **sin destino**, JSON explícito
# y nunca el `index.html` del SSR. `default_type` + `return` no necesitan
# `api-proxy.conf` (no hay upstream al que reenviar nada).
location ^~ /ai/ {
    default_type application/json;
    return 503 '{"statusCode":503,"code":"DEPENDENCY_UNAVAILABLE","message":"El triage por IA no está disponible en este despliegue.","error":"Service Unavailable"}';
}

# ─── El socket de mensajería ─────────────────────────────────────────────────
#
# `CommunityMessagingGateway` (socket.io sobre el mismo puerto 3000 de la API).
# Estaba declarado en `proxy.conf.json` desde que existe el módulo y NO estaba
# aquí: en desarrollo el chat conectaba y en producción el navegador se quedaba
# reintentando el handshake para siempre, sin ningún error del lado del
# servidor. `scripts/check-api-prefixes.mjs` ya lo denunciaba —«deploy/nginx.conf
# no declara «/socket.io»»— pero el aviso convivía con el repositorio.
#
# No incluye `api-proxy.conf`, y no es un olvido: ese archivo fija
# `Connection ""` para reutilizar conexiones keep-alive contra la API, y el
# upgrade a WebSocket necesita exactamente lo contrario — `Connection
# "upgrade"`. Incluirlo mataría el upgrade en silencio, que es el mismo fallo
# con otra causa.
location ^~ /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;

    # Las dos cabeceras del upgrade. Sin ellas nginx responde 200 al handshake y
    # el socket nunca llega a abrirse.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un socket abierto está callado la mayor parte del tiempo: con los 30 s de
    # `api-proxy.conf` nginx lo cerraría cada medio minuto y el cliente
    # reconectaría en bucle. socket.io hace ping cada 25 s por defecto, así que
    # el plazo tiene que quedar cómodamente por encima.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
}
