# =========================================================================
# Los prefijos que van a la API, y NADA MÁS.
#
# Vive aparte de `nginx.conf` porque hay DOS servidores que tienen que
# enrutarlos igual: el reverse proxy de referencia (`nginx.conf`) y el del
# despliegue en Coolify (`nginx.coolify.conf`), que solo se diferencian en el
# `server_name` y en la validación del `Host`. Duplicada, la lista se actualiza
# en uno de los dos y el otro empieza a devolver el `index.html` de Angular
# donde el cliente espera JSON — un 200 con HTML, que sale como «error
# inesperado» y manda a buscar el fallo a cualquier sitio menos al proxy.
#
# Es también el archivo que lee `scripts/check-api-prefixes.mjs` para comprobar
# que esta lista y los `proxy.conf*.json` del desarrollo dicen lo mismo.
#
# Se incluye DENTRO de un bloque `server`.
# =========================================================================

# ─── 1 · La API ─────────────────────────────────────────────────────────
#
# `^~` corta la búsqueda: estos prefijos van a la API y no compiten con las
# reglas de expresión regular de más abajo.
location ^~ /iam/          { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /public/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /terminology/  { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /profiles/     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /identity/     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /common/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /scheduling/   { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /charts/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /forms/        { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /clinical/     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /authz/        { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /consent/      { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# Sin barra final los dos a los que el cliente hace POST en la ruta pelada
# (`POST /practitioner-delegates`): `^~ /x/` no matchea `/x` y la petición
# caería al SSR. `/org` sí la lleva: sin barra se tragaría cualquier ruta
# futura de Angular que empiece con `org`.
location ^~ /practitioner-delegates    { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /access-requests/          { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /delegated-access/         { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /delegated-permission-sets { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /org/                      { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /auth-providers/           { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# Dos segmentos a propósito, y es el caso que el comentario de arriba cuenta:
# `/admin` a secas capturaría `/administracion/*`, que es una ruta de la
# aplicación. Sin barra final por lo mismo que `/practitioner-delegates`: la
# colección es `/admin/tenants` pelado y `^~ /admin/tenants/` no la alcanza.
location ^~ /admin/tenants             { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# La cara de organización de M04: `/tenants/{id}`, y colgando de ella sus
# sucursales, su plantilla y sus sub-organizaciones. **Con barra final** a
# propósito: `^~ /tenants` pelado se comería `/tenants-…` de cualquier ruta
# futura de Angular, y la API no recibe nada en `/tenants` a secas —el
# listado de plataforma es `/admin/tenants`, que ya está declarado arriba.
location ^~ /tenants/                  { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# M44 y M13. **Con barra final**, y acá no es indiferente: ninguna de las
# dos APIs recibe nada en la ruta pelada —todo cuelga de `/health-context/…`
# y `/geo/…`—, mientras que `^~ /geo` sin barra capturaría cualquier ruta
# futura de Angular que empiece con `geo`, `geolocation` la primera.
# M14 y M16, la cara contable. Sin barra final las dos: la API sirve
# `/practices` pelado (el listado) y `/accounting/...` cuelga siempre de un
# segundo segmento, pero se declara igual para que un futuro `/accounting`
# a secas no caiga en el index.html de Angular sin que nadie se entere.
location ^~ /practices                 { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /accounting                { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# M35, la bandeja de la campana (carril P1). **Con barra final**: la ruta
# del centro de notificaciones en Angular es `/notification-center`, que no
# empieza por `/notifications/` y por eso no cae acá — pero el prefijo sin
# barra sí se la comería, y el centro dejaría de existir en producción sin
# que ninguna prueba lo denunciara. Es exactamente el modo de fallo que el
# comentario de `/geo/` describe.
location ^~ /notifications/            { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /health-context/           { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /geo/                      { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# M53, el histórico de procedimientos de la ficha. Sin barra final las dos:
# la API sirve `/procedure-cases` y `/dental-procedures` pelados (los
# listados) además de sus subrutas. Ninguna ruta de `APP_SECTIONS` empieza
# así —las de la aplicación están en castellano— así que el prefijo de un
# solo segmento es inequívoco, a diferencia de lo que pasó con `/admin`.
location ^~ /procedure-cases           { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /dental-procedures         { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /diagnostic-units          { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# La consola de laboratorio escribe además en estas tres: la API cuelga el
# precio del tarifario y el cierre de la cosa misma, no de la unidad. Sin
# barra final: `/study-prices/:id/close` y el DELETE de una oferta son
# subrutas, pero el prefijo de un solo segmento en inglés no choca con
# ninguna ruta de `APP_SECTIONS`.
location ^~ /diagnostic-study-offerings { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /price-schedules           { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /study-prices              { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# Prefijos que el proxy de desarrollo ya reenviaba y acá faltaban: en
# producción caían en el `location /` de abajo y devolvían el index.html de
# Angular en vez de la respuesta de la API — un 200 con HTML donde el cliente
# espera JSON, que es el modo de fallo más difícil de diagnosticar.
#
# Ninguno choca con una ruta de `APP_SECTIONS`: las pantallas del carril 17
# viven en `administration/pharma-lab`, `lab-visits` y `my-visits`, con otro
# prefijo justamente por esto, y las de encuestas en `questionnaires`.
location ^~ /practitioners             { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /surveys                   { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /diagnostic-results        { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /pharma-labs               { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
# M24 y M25, el directorio de farmacias y su disponibilidad (carril E3).
# **Con barra final las dos**: ninguna API recibe nada en la ruta pelada
# —todo cuelga de `/pharmacy/…` y `/pharmacy-inventory/…`— y `^~ /pharmacy`
# sin barra se comería cualquier pantalla futura de Angular que empiece
# así, además de capturar él solo a `/pharmacy-inventory`, que merece su
# declaración explícita como en los proxies de desarrollo.
location ^~ /pharmacy/                 { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /pharmacy-inventory/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /visit-agenda              { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /visit-requests            { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /visit-records             { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /visit-surveys             { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

location ^~ /community               { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /system-context          { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance-carriers      { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance-brokers       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /insurance-claims        { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /cds                     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /billing/service-catalog { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /diagnostics/patients    { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
location ^~ /diagnostics/work-orders { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

# Contable propio del profesional, favoritos de receta, catálogo de aseguradoras
# y paquetes de contenido. Ninguno choca con una ruta del router —lo verifica
# `scripts/check-route-prefixes.mjs`—; `/admin/content-packs` lleva dos segmentos
