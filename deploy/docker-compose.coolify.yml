# =========================================================================
# Mantra Core Technologies · ALOVIDA — rama `test` en Coolify
# -------------------------------------------------------------------------
# DOS SERVICIOS Y NINGÚN BIND MOUNT: el servidor de renderizado (`web`) y el
# reverse proxy que reparte los prefijos de la API (`proxy`).
#
# Es la aplicación REAL, no la maqueta: las peticiones salen del navegador y
# tienen que llegar a la API. Por eso hace falta el proxy, y por eso este
# archivo se separó del de `mockup`, donde el backend simulado vive dentro del
# propio paquete y ningún servicio más hace falta.
#
# ─── Las tres cosas que rompieron esto antes, y cómo se resuelven ─────────
#
#  1. `context: ..` — el despliegue del 14/09 murió con «failed to read
#     dockerfile: open Dockerfile: no such file or directory». Compose resuelve
#     los contextos relativos contra el DIRECTORIO DE PROYECTO, y Coolify lo
#     fija en la raíz del repositorio (`--project-directory /artifacts/<uuid>`),
#     no en `deploy/`. El `..` apuntaba, por tanto, al padre de la raíz.
#     Acá el contexto es `.` = la raíz, y los `dockerfile:` llevan el prefijo
#     `deploy/` cuando viven en esta carpeta.
#
#     ⚠️  El precio: a mano hay que invocarlo con el mismo directorio de
#     proyecto, o compose tomará `deploy/` como raíz y volverá a fallar:
#         docker compose -f deploy/docker-compose.coolify.yml \
#                        --project-directory . up --build
#
#  2. La configuración de nginx MONTADA. Coolify clona el repositorio dentro de
#     un contenedor auxiliar y habla con el demonio del host: cualquier ruta
#     relativa del repositorio llega vacía o directamente no existe. La
#     configuración viaja ahora DENTRO de la imagen del proxy; ver
#     `deploy/Dockerfile.proxy`.
#
#  3. El puerto 4000 publicado en el host. Esta máquina ya tiene el despliegue
#     de `dev` ocupando `127.0.0.1:4000` (contenedor `alovida-web`, fuera de
#     Coolify). Publicar aquí el mismo puerto daría «port is already
#     allocated». Ninguno de los dos servicios publica nada: Traefik alcanza al
#     `proxy` por la red interna, que es todo lo que necesita.
#
# ─── En Coolify ───────────────────────────────────────────────────────────
#
#   Recurso `alovida-web` → Docker Compose → este repositorio, rama `test`
#   Compose file: deploy/docker-compose.coolify.yml
#   Dominio: asignado al servicio `proxy`, puerto 80
#   Variable: APP_DOMAIN = ese dominio, SIN `https://`
#
# La API tiene que estar en pie: este stack toma la red `alovida` como externa
# y la crea el stack de `mantra-core-health-api`. Si la API no está desplegada,
# este despliegue falla al arrancar con «network alovida not found», y eso es
# lo correcto: un frontend sin API no sirve de nada.
# =========================================================================

services:
  web:
    build:
      # La RAÍZ del repositorio: el Dockerfile copia `package.json`, `src/` y
      # `.git` (de donde sale el commit que se estampa en el paquete).
      context: .
      dockerfile: Dockerfile
      args:
        # VACÍA a propósito, y es la decisión de arquitectura de todo el
        # montaje: la API vive detrás del MISMO dominio que el frontend, así
        # que las peticiones salen relativas. Sin CORS que negociar y con la
        # CSP en `connect-src 'self'`. Quien hace que eso sea verdad es el
        # `proxy` de abajo.
        PUBLIC_API_BASE_URL: ''
        # Sin esto el Dockerfile construye `production`, que es la maqueta
        # (`mockBackend: true`): el front de `test` salía sin una sola llamada
        # a la API aunque el proxy la tuviera en pie.
        BUILD_CONFIGURATION: production-api
    restart: always
    environment:
      PORT: '4000'
      NODE_ENV: production
      PUBLIC_API_BASE_URL: ''
      # El montón de V8 por debajo del techo del contenedor (768M abajo),
      # mismo criterio que ya usa el Dockerfile para las dos etapas de build
      # (`NODE_OPTIONS=--max-old-space-size=…`, ver ahí el porqué completo).
      # Sin esto, V8 puede autoajustar su techo por encima de lo que el
      # `deploy.resources.limits.memory` del compose permite: el recolector
      # nunca llega a actuar y el kernel mata el proceso por OOM en vez de que
      # el propio Node libere memoria. Hallazgo del carril M1 (2026-09-26):
      # el contenedor entraba en `restarting`/`running:unhealthy` en ciclo tras
      # el primer despliegue de esta rama, sin acceso a `docker logs` para
      # confirmar la causa exacta — éste es el mismo patrón ya documentado y
      # corregido en el propio Dockerfile para el build, aplicado acá al
      # proceso en ejecución, que hasta ahora quedaba sin acotar.
      NODE_OPTIONS: '--max-old-space-size=512'
      # EL DOMINIO PÚBLICO, Y ES OBLIGATORIO.
      #
      # `AngularNodeAppEngine` compara el `Host` de cada petición contra su
      # lista de hosts permitidos y responde **400 a todo lo que no esté**:
      # «Header "host" with value "…" is not allowed». La lista horneada en el
      # artefacto (`angular.json`, `security.allowedHosts`) sólo conoce lo que
      # se sabía al compilar —`localhost`, `127.0.0.1`, `frontend`—, y el
      # dominio público no es una de esas cosas.
      #
      # El proxy reenvía el `Host` original (`proxy_set_header Host $host`), así
      # que lo que llega aquí es el dominio de Coolify, no `proxy`.
      #
      # Sin esta variable el despliegue arranca sano —contenedores en pie,
      # healthcheck en verde, porque pide `localhost`— y devuelve 400 en CADA
      # página al primer visitante real.
      SSR_ALLOWED_HOSTS: '${APP_DOMAIN}'
    expose:
      - '4000'
    networks:
      alovida:
        # Coolify renombra los contenedores (`web-<uuid>-<fecha>`), así que el
        # `upstream frontend { server web:4000; }` del nginx no resolvería. El
        # alias explícito es lo que lo mantiene en pie, igual que hace el stack
        # de la API con el suyo.
        aliases:
          - web
    deploy:
      resources:
        limits:
          # El renderizado en servidor se mide en ~400 MB en marcha; 768 MB deja
          # aire para picos sin que una fuga se coma la máquina.
          memory: 768M

  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.proxy
    restart: always
    # Que el proxy no acepte tráfico antes de que haya algo detrás. El
    # healthcheck del `web` pide `/auth`, o sea que comprueba el artefacto del
    # navegador además del proceso.
    depends_on:
      web:
        condition: service_healthy
    expose:
      - '80'
    networks:
      alovida:
        aliases:
          - alovida-front-test
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  # La declara el stack de la API (`mantra-core-health-api`), que es quien tiene
  # dentro al `api:3000`. Aquí se toma como externa: si la creara este stack,
  # Docker se negaría a que dos proyectos reclamaran la misma red con etiquetas
  # distintas.
  alovida:
    external: true
    name: ${ALOVIDA_NETWORK:-alovida}
