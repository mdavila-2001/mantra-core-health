# =========================================================================
# Mantra Core Technologies · ALOVIDA — rama `mockup` en Coolify
# -------------------------------------------------------------------------
# UN SOLO CONTENEDOR. Sin nginx, sin red compartida y SIN NINGÚN BIND MOUNT.
#
# ─── Por qué en esta rama no hay proxy ────────────────────────────────────
#
# En `dev` este archivo levanta dos servicios: el servidor de renderizado y un
# nginx que reparte los prefijos de la API hacia el stack de la API por la red
# `alovida`. Eso existe porque allí la API y el frontend comparten dominio.
#
# En `mockup` no hay API. La rama trae un backend simulado dentro del propio
# frontend (`src/app/core/mock`) y **ninguna petición sale del navegador**: las
# contesta el interceptor. Un nginx acá no repartiría nada — resolvería el
# upstream `api`, no lo encontraría y ni siquiera arrancaría.
#
# ─── Y por qué se quitó, además de ser inútil ─────────────────────────────
#
# Porque rompía el despliegue. El servicio `proxy` montaba tres archivos de
# configuración por bind (`../deploy/nginx.coolify.conf` y compañía). Coolify
# reescribe esas rutas relativas contra el directorio persistente de la
# aplicación, y el `..` acababa produciendo una ruta pegada:
#
#   /data/coolify/applications/<uuid>./deploy/nginx.coolify.conf
#                                    ^ el punto, pegado al uuid
#
# Esa ruta no existe, así que Docker la creaba como directorio vacío y runc se
# negaba: «not a directory: Are you trying to mount a directory onto a file?».
# El `web` llegaba a `Healthy` y el despliegue moría igual, en el `proxy`.
#
# Un archivo de configuración montado por bind no sobrevive a un desplegador
# que no tiene el repositorio en el disco. Acá se resuelve quitando la pieza
# que no hacía falta; en `dev`, donde el proxy sí hace falta, esa configuración
# tendría que viajar DENTRO de una imagen y no montada.
#
# ─── En Coolify ───────────────────────────────────────────────────────────
#
#   Nuevo recurso → Docker Compose → este repositorio, rama `mockup`
#   Compose file: deploy/docker-compose.coolify.yml  (o el de la raíz: los dos
#                 levantan exactamente lo mismo en esta rama)
#   Dominio: asignarlo al servicio `web`, puerto 4000
#   Variable: APP_DOMAIN = ese dominio, SIN `https://`
#
# ─── Cuentas ──────────────────────────────────────────────────────────────
#
#   medica@alovida.mock · paciente@alovida.mock · admin@alovida.mock
#   superadmin@alovida.mock · visitador@alovida.mock — cualquier contraseña.
#
# Los datos viven en memoria del navegador: lo que se crea dura lo que dura la
# pestaña, y cada visitante ve el mismo punto de partida.
# =========================================================================

services:
  web:
    build:
      # El contexto es la RAÍZ del repositorio, no `deploy/`: el Dockerfile
      # copia `package.json`, `src/` y el resto desde ahí.
      context: ..
      dockerfile: Dockerfile
      args:
        # VACÍA, y no es un descuido: es la decisión de arquitectura de la
        # cabecera. Tiene que coincidir con la variable de entorno de abajo —
        # son las dos mitades de lo mismo, una para el paquete del navegador y
        # otra para la `connect-src` que emite el servidor.
        PUBLIC_API_BASE_URL: ''
    restart: always
    environment:
      PORT: '4000'
      NODE_ENV: production
      PUBLIC_API_BASE_URL: ''
      # EL DOMINIO PÚBLICO, Y ES OBLIGATORIO.
      #
      # `AngularNodeAppEngine` compara el `Host` de cada petición contra su
      # lista de hosts permitidos y responde **400 a todo lo que no esté**:
      # «Header "host" with value "…" is not allowed». La lista horneada en el
      # artefacto (`angular.json`, `security.allowedHosts`) solo conoce lo que
      # se sabía al compilar —`localhost`, `127.0.0.1`, `frontend`—, y el
      # dominio público no es una de esas cosas.
      #
      # Sin esta variable el despliegue arranca sano —los contenedores en pie,
      # el healthcheck en verde, porque pide `localhost`— y devuelve 400 en
      # CADA página al primer visitante real. Es la comprobación que ningún
      # health check puede hacer por uno.
      #
      # Varios dominios van separados por coma. `*` se rechaza a propósito.
      SSR_ALLOWED_HOSTS: ${APP_DOMAIN}
    expose:
      - '4000'
    deploy:
      resources:
        limits:
          # El renderizado en servidor de esta aplicación se mide en ~400 MB en
          # marcha; 768 MB deja aire para picos sin permitir que una fuga se
          # coma el VPS entero.
          memory: 768M
    # El `HEALTHCHECK` viene en la imagen: pide `/auth`, que comprueba que el
    # proceso responde Y que el artefacto del navegador está donde el servidor
    # lo busca.
