# Reverse proxy de producción: la API detrás del MISMO dominio que el frontend.
#
# Es la decisión de arquitectura tomada, y la que hace que:
#
#   · `PUBLIC_API_BASE_URL` quede **vacía** — las peticiones salen relativas;
#   · **no haga falta CORS**, porque el navegador ve un solo origen;
#   · la CSP se quede en `connect-src 'self'` y no cambie nunca.
#
# Este archivo es una **referencia funcional**, no una imposición: si el
# despliegue usa un Ingress de Kubernetes, un ALB o Caddy, lo que hay que
# reproducir son las dos reglas de abajo. Lo que no es negociable es que los
# seis prefijos lleguen a la API y todo lo demás al servidor de renderizado.
#
# ─── Los seis prefijos ───────────────────────────────────────────────────────
#
# Salen de `proxy.conf.json`, que es lo que usa el desarrollo. **Las dos listas
# tienen que decir lo mismo**: un módulo nuevo de la API que se agregue en un
# lado y no en el otro funciona en desarrollo y falla en producción — o al
# revés, que es peor porque nadie lo prueba.
#
#   /iam  /public  /terminology  /profiles  /identity  /common

upstream api {
    # El servicio de la API. En Docker Compose es el nombre del servicio.
    server api:3000;
    keepalive 32;
}

upstream frontend {
    # El servidor SSR de este repositorio (`dist/…/server/server.mjs`).
    server web:4000;
    keepalive 32;
}

# ─── Validación del `Host` ───────────────────────────────────────────────────
#
# Está acá y no en Angular por una razón concreta y comprobada: la opción
# `security.allowedHosts` del build **se hornea en el artefacto**, así que
# enumerar el dominio ahí significaría una imagen distinta por dominio, y
# cambiar de dominio obligaría a reconstruir.
#
# Peor todavía: el valor que traía el proyecto era `["localhost"]`, y eso hacía
# que el servidor de producción **rechazara con 400 cualquier petición de un
# dominio real**. Lo detectaron las pruebas de extremo a extremo corriendo
# contra el artefacto construido; no se veía de ninguna otra forma.
#
# El control se pierde poco al moverlo: la protección existe contra un `Host`
# manipulado que lleve al servidor a pedirle algo a un host interno, y **este
# servidor SSR no hace ninguna petición saliente** — no habla con la API.
#
# Acá, en cambio, es configuración en caliente: se cambia el dominio y se
# recarga nginx.
server {
    listen 80 default_server;
    server_name _;

    # Un `Host` que no reconocemos ni siquiera llega al servidor de
    # renderizado. 421 es el código correcto: «esta petición no es para este
    # servidor».
    return 421;
}

server {
    listen 80;

    # ⚠️  CONFIGURACIÓN: acá va el dominio real. Mientras diga `localhost`, solo
    #     responde en local. Es lo único de este archivo que hay que tocar.
    server_name localhost mantra-core-health.local;

    # Un documento clínico puede pesar. El límite real lo pone la API; éste solo
    # evita que una subida absurda llegue hasta ella.
    client_max_body_size 12M;

    # ─── 1 · La API ─────────────────────────────────────────────────────────
    #
    # `^~` corta la búsqueda: estos prefijos van a la API y no compiten con las
    # reglas de expresión regular de más abajo.
    location ^~ /iam/          { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
    location ^~ /public/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
    location ^~ /terminology/  { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
    location ^~ /profiles/     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
    location ^~ /identity/     { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }
    location ^~ /common/       { proxy_pass http://api; include /etc/nginx/api-proxy.conf; }

    # ─── 2 · Todo lo demás: el servidor SSR ─────────────────────────────────
    #
    # Incluidos los estáticos: `src/server.ts` ya los sirve con `maxAge: 1y`, y
    # **emite las cabeceras de seguridad**. Servirlos desde nginx directamente
    # las perdería, salvo que se repitan acá — y dos fuentes para la misma
    # política es cómo se separan.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # El prerenderizado responde rápido; el resto también. Un timeout largo
        # solo esconde un problema.
        proxy_read_timeout 30s;
    }
}
