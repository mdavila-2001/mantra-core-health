# Batería completa en cada push y cada pull request.
#
# El orden es de coste creciente: falla primero lo barato. Un lint roto no
# debería costar una compilación entera para enterarse.
#
# Ninguna etapa añade dependencias al proyecto: las seis verificaciones
# documentales son scripts propios de Node, sin paquetes.

name: CI

# Desde el 18/08 corre en un runner propio (ver los jobs), que es una máquina
# del equipo y no una flota elástica. Hasta el 24/08 el disparo se acotaba a
# `pull_request` para no duplicar cada corrida con el `push` que sigue al merge.
#
# Ese ahorro salió caro: sin disparo por `push`, **nadie construía `dev`**. El
# paquete inicial creció de 982 kB (21/08) a 1,04 MB (23/08), cruzó el techo de
# 1 MB con el #212 y la rama principal quedó seis días sin compilar sin que nada
# avisara. La última corrida sobre `dev` era del 18/08.
#
# El `push` sobre `dev` es el único que reconstruye la rama principal después de
# cada merge: no impide que entre algo roto —eso lo hace el gancho `pre-push` de
# `.githooks/`, que corre antes y en la máquina de quien empuja— pero baja el
# tiempo de descubrimiento de seis días a un par de minutos.
#
# O1-3 (31/10/2026): `pull_request` acotado a las ramas que reciben PR (`dev` y
# `mockup`; `test` está dada de baja desde el 30/10). `push` sigue sobre `dev`.
on:
  pull_request:
    branches: [dev, mockup]
  push:
    branches: [dev]
  # Para lanzar a mano la regresión completa de extremo a extremo antes de un despliegue,
  # sin esperar a que algo llegue a `master`.
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela el anterior: la respuesta que
# importa es la del último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # O1-3 (31/10/2026): de vuelta en `ubuntu-latest`. El runner self-hosted
    # `[self-hosted, linux, x64]` que se pedía desde el 18/08 no existe: los
    # jobs quedaban en cola 24 h y GitHub los cancelaba, así que ningún check
    # llegaba a correr. Historia: mantra-core-health-api/docs/operations/ci-runner-self-hosted.md
    runs-on: ubuntu-latest
    # La batería completa (lint, tipos, ~5 000 pruebas con cobertura, build y
    # los controles propios) tarda bastante más que los 20 min de antes en una
    # máquina de 4 núcleos.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # El generador de entorno estampa el commit en el paquete leyéndolo de
          # Git. Con el clon superficial por defecto alcanza para `rev-parse`.
          fetch-depth: 1

      # La prueba de fichas del simulador compara el fixture con los JSON que
      # siembra la API. Se fija el snapshot correspondiente a cada base para
      # que los PR sean reproducibles y no dependan de un checkout vecino.
      - name: Catálogo clínico de la API
        uses: actions/checkout@v4
        with:
          repository: mdavila-2001/mantra-core-health-api
          # `test` depende del API #638; otras bases usan el snapshot de API dev.
          ref: ${{ github.event.pull_request.base.ref == 'test' && '6d7ce6c76a871d2a36e6b7a5ad0447e05eb5b27b' || '594e64e5ad1e9e9f057d17500dbe3e783d8090a2' }}
          path: api-catalog

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Corepack instala la versión de Yarn que fija `packageManager`.
      - run: corepack enable

      # `.yarnrc.yml` declara `nodeLinker: node-modules` y Yarn 4 guarda los
      # paquetes en su caché GLOBAL (no en `.yarn/cache`): se cachea esa carpeta,
      # la que diga `yarn config get cacheFolder`.
      - name: Carpeta de caché de Yarn
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # `--immutable` falla si el lockfile no cuadra con el manifiesto.
      - name: Instalación reproducible
        run: yarn install --immutable

      # `src/environments/env.generated.ts` está en `.gitignore` —es lo que
      # impide versionar la configuración de una máquina— así que en un clon
      # limpio **no existe**, y los cuatro archivos que lo importan no compilan.
      #
      # En local no se nota: `start`, `build`, `watch` y `test` lo generan
      # encadenado. Pero `lint` y `tsc` se invocan directos, sin pasar por esos
      # scripts, y por eso la etapa de Tipos venía fallando en cada ejecución
      # desde que existe este workflow —también en `dev`—.
      - name: Entorno público
        run: yarn env:generate

      - name: Lint
        run: yarn lint

      - name: Tipos
        run: yarn tsc -p tsconfig.app.json --noEmit

      # Los umbrales de cobertura son por área y bloquean: si un cambio los baja,
      # esta etapa falla en vez de avisar.
      - name: Pruebas y cobertura
        env:
          CLINICAL_FORMS_DIR: ${{ github.workspace }}/api-catalog/src/common/seed/data/clinical-forms
        run: yarn test:coverage

      - name: Build de producción
        run: yarn build


      # Falla solo por encima del umbral de ERROR. El aviso de presupuesto no
      # bloquea: es deuda conocida y gobernada, no una regresión nueva.
      - name: Presupuesto de bundle
        run: node scripts/check-bundle-budget.mjs

      # Ciclos, dirección de las capas y superficie de red confinada a
      # `core/data-access/`.
      - name: Arquitectura
        run: node scripts/check-architecture.mjs

      # Los diecinueve prefijos de la API dicen lo mismo en desarrollo, en el
      # contenedor y en el reverse proxy de producción.
      - name: Prefijos de la API
        run: node scripts/check-api-prefixes.mjs

      # Y ninguna ruta del router empieza con uno de esos prefijos: el proxy
      # compara por inicio de ruta, así que una que lo hiciera se iría a la API
      # y dejaría la pantalla en blanco (ya pasó con `/admin`).
      - name: Rutas contra prefijos
        run: node scripts/check-route-prefixes.mjs

      # Cada llamada de los clientes del portal de administración (admin-portal,
      # audit, authz-admin) existe en el contrato OpenAPI de la API, versionado en
      # scripts/contracts/. Una ruta o un método que la API no expone se ve acá y no
      # como un 404 en la pantalla. Se refresca con yarn contract:refresh.
      - name: Clientes del portal contra el contrato
        run: yarn check:admin-portal-contract


      # Un formulario de este sistema se sirve de a una página, con un tope de
      # cuatro campos. La regla vive en `MAX_CAMPOS_POR_PAGINA` y la hace cumplir
      # este script; sin esta etapa era un guardarraíl que sólo corría cuando
      # alguien se acordaba de correrlo a mano, que es no correr.
      - name: Formularios paginados
        run: node scripts/check-form-pages.mjs

      # El catálogo tipado y `styles.css` declaran lo mismo, en ambos sentidos.
      - name: Tokens del sistema de diseño
        run: node scripts/check-tokens.mjs

      # Y ningún `var(--x)` apunta a un token que no existe. Es el fallo
      # gemelo del anterior y el que más caro sale: un token inexistente no
      # rompe la compilación —la declaración se descarta y la propiedad hereda—
      # así que la pantalla se ve mal y las pruebas pasan igual. Se encontraron
      # 41 así, con 172 usos, todos mirando capturas y ninguno ejecutando
      # código: esquinas cuadradas por `--radius-md` (el real es `--r-md`),
      # leyendas del tamaño del cuerpo por `--fs-sm`, y el peor, `--st-*-border`
      # en vez de `--st-*-bd`, que dejaba las vistas de agenda SIN NINGÚN color
      # de borde por estado — media regla de accesibilidad, porque «no depender
      # sólo del color» exige que el estado se distinga de alguna otra forma.
      - name: Tokens usados pero nunca declarados
        run: node scripts/check-css-tokens.mjs

      # Contraste WCAG de las DOS hojas: `styles.css` (banco de componentes) y
      # `styles/alovida.css` (la hoja de la bóveda, que pinta el armazón de todas
      # las pantallas y las 141 portadas).
      #
      # El script existía y se documentaba como si corriera acá —`styles.css`
      # dice literalmente «lo detectó check-contrast.mjs, que mide estas
      # combinaciones en cada CI»— pero nunca estuvo en el workflow. Por eso un
      # par que el proyecto YA había corregido en v1.0 (ámbar-700 sobre
      # ámbar-50, 4,46:1) volvió a aparecer en la hoja de la bóveda y sobrevivió
      # sin que nada avisara. Un guardarraíl que no corre no guarda nada.
      - name: Contraste del sistema de diseño
        run: node scripts/check-contrast.mjs

      # Ningún color literal nuevo fuera de las hojas de tokens, ni archivo nuevo
      # por encima del tope de líneas (ratchets sobre scripts/baselines/*.json).
      - name: Colores sueltos fuera de tokens
        run: node scripts/check-colores-sueltos.mjs

      # Techo de 600 líneas. Los archivos que ya lo superaban están en una lista
      # de excepciones con vencimiento (2027-01-15, O4-5) en
      # scripts/baselines/max-lines.json: falla un archivo nuevo sobre el techo,
      # una excepción que crece o una vencida.
      - name: Tamaño máximo de archivo
        run: node scripts/check-max-lines.mjs

      # Regla 29 (transversal a los 36 carriles): toda ruta, identificador,
      # variable, clase y archivo NUEVO o TOCADO va en inglés. El checkout de
      # arriba es superficial (`fetch-depth: 1`): sólo trae el commit de la
      # punta, así que hace falta un fetch acotado del commit base antes de
      # poder diffear contra él.
      - name: Fetch de la base para el diff de identificadores
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=50 origin "$BASE_SHA" || true
            echo "CHECK_ENGLISH_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          fi

      - name: Identificadores nuevos en inglés
        run: node scripts/check-english-identifiers.mjs

      # Inventarios al día, enlaces, cobertura documental y deriva de contrato.
      - name: Documentación
        run: node scripts/generate-doc-report.mjs

  # Los journeys que jsdom no puede cubrir: hacen falta un router real, un `F5`
  # de verdad y un navegador que ejecute la hidratación.
  #
  # Va en un job aparte y no como una etapa más de `verificar` por dos razones:
  # corre en paralelo en vez de alargar la cadena, y necesita un navegador —lo
  # caro de esta etapa— que al resto no le sirve de nada.
  #
  # No depende de `verificar`: si el lint falla, esto igual dice si los journeys
  # siguen en pie, y las dos respuestas llegan juntas.
  #
  # ## Por qué una sola suite y no dos
  #
  # Antes convivían Playwright y Selenium. Cubrían cosas distintas, sí, pero la
  # regresión visual que justificaba tener las dos **nunca se implementó**
  # (`toHaveScreenshot` no aparecía en ninguna prueba, solo en la configuración),
  # así que la diferencia real era el corredor, no la cobertura. Está todo en
  # Cypress ahora, en un solo job.
  #
  # ## Por qué sigue en self-hosted y detrás de una variable (O1-3)
  #
  # Necesita Chrome y la suite pesa; se deja en el runner propio. Pero ese
  # runner hoy no existe, y un job que pide una etiqueta sin máquina queda en
  # cola 24 h: la corrida entera no termina y el PR muestra un check colgado.
  # Por eso sólo se encola si el repositorio declara la variable
  # `E2E_SELF_HOSTED=true` (Settings → Secrets and variables → Actions →
  # Variables) o si se lanza a mano. No bloquea a `verificar` ni a
  # `dependencias`: ninguno depende de este.
  e2e:
    if: github.event_name == 'workflow_dispatch' || vars.E2E_SELF_HOSTED == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - name: Carpeta de caché de Yarn
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # El binario de Cypress vive fuera de `node_modules` y pesa 200 MB: sin
      # cachearlo, cada corrida lo vuelve a bajar.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: cypress-${{ runner.os }}-

      - run: yarn install --immutable

      - name: Binario de Cypress
        run: yarn cypress install

      # El generador escribe `src/environments/env.generated.ts`, que está en
      # `.gitignore` y que la construcción del artefacto necesita.
      - name: Entorno público
        run: yarn env:generate

      # Los tipos de la suite se revisan aparte de los de la aplicación: un Page
      # Object que apunta a un método que ya no existe tiene que fallar acá, en
      # segundos, y no a mitad de una corrida con navegador.
      - name: Tipos de la suite
        run: yarn tsc -p cypress/tsconfig.json --noEmit

      # No se instala ningún driver: Cypress conduce el Chrome que el agente ya
      # trae, y `ubuntu-latest` lo trae.
      - name: Versión de Chrome
        run: google-chrome --version

      # Humo primero, y aparte: si la aplicación no arranca, los fallos de la
      # suite crítica no significan nada y leerlos es perder el tiempo.
      #
      # El artefacto lo construye el arnés (`cypress/harness/servidor.ts`) con
      # `PUBLIC_API_BASE_URL` vacío, para que la aplicación pida al mismo origen
      # y la API simulada la atienda. Con la URL de un `.env` cualquiera, el
      # paquete le hablaría a un backend real y toda la suite fallaría sin decir
      # por qué.
      - name: Humo
        run: yarn test:e2e:smoke

      # Reutiliza el artefacto que acaba de construir el humo: reconstruirlo
      # costaría un minuto largo para producir exactamente lo mismo. El arnés
      # comprueba que ese `dist/` sea suyo antes de reutilizarlo.
      - name: Suite crítica
        run: yarn test:e2e:critical
        env:
          E2E_SKIP_BUILD: 'true'

      # Accesibilidad en cada pull request hacia `test` o `mockup`: los
      # problemas `serious`/`critical` de axe sobre el login, el panel y el
      # registro bloquean el merge. Es una sola spec de la regresión, con la
      # misma API simulada del arnés y el artefacto que ya construyó el humo:
      # no levanta nada nuevo. En `master` y a mano no se repite: ahí ya la
      # corre la regresión completa de abajo.
      - name: Accesibilidad
        if: github.event_name == 'pull_request' && contains(fromJSON('["test", "mockup"]'), github.base_ref)
        run: yarn test:e2e:a11y
        env:
          E2E_SKIP_BUILD: 'true'

      # La regresión completa solo en la rama principal y a mano: cubre casos de
      # borde y responsive, que son valiosos y no bloquean un pull request.
      - name: Regresión completa
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: yarn test:e2e
        env:
          E2E_SKIP_BUILD: 'true'

      # Siempre, no solo al fallar: las capturas y los videos son lo único que
      # permite entender en local algo que solo pasó en CI.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-artifacts
          path: artifacts/cypress/
          retention-days: 7

  dependencias:
    # O1-3: `ubuntu-latest`, igual que `verificar` (el self-hosted no existe).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Carpeta de caché de Yarn
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable

      # No bloquea a propósito. La única vulnerabilidad conocida es moderada,
      # transitiva de `@angular/cli` y NO llega al navegador; hacer fallar el
      # pipeline por deuda preexistente entrena a ignorar el pipeline.
      # Lo que sí interesa es enterarse de una alta o crítica nueva.
      - name: Auditoría de dependencias
        run: yarn npm audit --recursive --severity high
        continue-on-error: true
