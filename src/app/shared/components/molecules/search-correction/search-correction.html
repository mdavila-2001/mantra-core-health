<svg
  class="search-correction__icono"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  <circle cx="11" cy="11" r="7"></circle>
  <path d="m20 20-3.5-3.5"></path>
</svg>
<p class="search-correction__texto" data-testid="search-correction">
  Mostrando resultados para <strong>«{{ corrected() }}»</strong>. No encontramos nada para «{{
    original()
  }}».
  <button
    app-button
    variant="ghost"
    size="sm"
    type="button"
    data-testid="search-correction-literal"
    (clicked)="literalRequested.emit(original())"
  >
    Buscar «{{ original() }}» tal cual
  </button>
</p>
