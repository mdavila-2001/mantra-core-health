<!-- El botón y el selector comparten un contenedor para que el puntero pueda
     pasar del uno al otro sin que se cierre. El panel se dibuja encima del
     botón, dentro del recuadro de la tarjeta. -->
<div class="reaccion">
  <button
    #principal
    type="button"
    class="reaccion__principal"
    data-testid="post-action-like"
    [class.reaccion__principal--activa]="presionado()"
    [attr.aria-pressed]="actual() === undefined ? null : presionado()"
    [attr.aria-disabled]="ocupado() ? 'true' : null"
    [attr.aria-haspopup]="'true'"
    (click)="alPrincipal()"
    (pointerdown)="alPulsar($event)"
    (pointerup)="alSoltar()"
    (pointercancel)="alSoltar()"
    (keydown.arrowup)="alPulsarFlecha($event)"
  >
    @if (propia(); as reaccion) {
      <span class="reaccion__emoji" aria-hidden="true">{{ reaccion.emoji }}</span>
      <span data-testid="post-action-like-label">{{ reaccion.rotulo }}</span>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 10v11H3V10z"/><path d="M7 10l4.5-7a2.2 2.2 0 0 1 3.8 1.9L14.4 9H20a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.6 21H7"/></svg>
      <span data-testid="post-action-like-label">Recomendar</span>
    }
  </button>

  <button
    type="button"
    class="reaccion__mas"
    data-testid="reaction-picker-toggle"
    aria-label="Elegir otra reacción"
    [attr.aria-expanded]="abierto()"
    (click)="alAlternar()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  @if (abierto()) {
    <div class="reaccion__panel" role="group" aria-label="Reacciones" data-testid="reaction-picker">
      @for (reaccion of reacciones; track reaccion.tipo; let i = $index) {
        <button
          #opcion
          type="button"
          class="reaccion__opcion"
          [class.reaccion__opcion--elegida]="actual() === reaccion.tipo"
          [attr.data-testid]="'reaction-' + reaccion.tipo"
          [attr.aria-pressed]="actual() === reaccion.tipo"
          (click)="elegir(reaccion.tipo)"
          (keydown.arrowleft)="alMoverEnElSelector($event, i, -1)"
          (keydown.arrowright)="alMoverEnElSelector($event, i, 1)"
        >
          <span class="reaccion__opcion-emoji" aria-hidden="true">{{ reaccion.emoji }}</span>
          <span class="reaccion__opcion-rotulo">{{ reaccion.rotulo }}</span>
        </button>
      }
    </div>
  }
</div>
