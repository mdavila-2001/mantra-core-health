<ol class="stepper" [attr.aria-label]="summary() || null">
  @for (step of steps(); track step.label; let i = $index; let last = $last) {
    <li
      class="stepper__step stepper__step--{{ step.status }}"
      [attr.aria-current]="step.status === 'current' ? 'step' : null"
    >
      <span class="stepper__marker" aria-hidden="true">
        @if (step.status === 'complete') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        } @else {
          {{ i + 1 }}
        }
      </span>

      <span class="stepper__body">
        <span class="stepper__label">{{ step.label }}</span>
        <span class="sr-only">— {{ estadoTexto(step) }}</span>
      </span>

      @if (!last) {
        <span class="stepper__connector" aria-hidden="true"></span>
      }
    </li>
  }
</ol>
