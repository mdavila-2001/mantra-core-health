@switch (estado()) {
  @case ('listo') {
    <img class="file-preview-image" [src]="url()" [alt]="altText()" width="120" height="120" />
  }
  @case ('carga') {
    <span class="file-preview-image file-preview-image--carga app-skeleton" aria-hidden="true"></span>
  }
  @case ('error') {
    <span class="file-preview-image file-preview-image--error" role="img" [attr.aria-label]="altText() || 'Adjunto no disponible'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <circle cx="9" cy="9" r="2" />
        <path d="m21 15-5-5L5 21" />
      </svg>
    </span>
  }
}
