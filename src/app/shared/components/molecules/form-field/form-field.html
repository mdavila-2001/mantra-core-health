<div class="form-field-container">
  @if (label()) {
    <label
      [id]="labelId()"
      [attr.for]="controlLabelable() ? controlId() : null"
      class="form-field-label"
    >
      {{ label() }}
      @if (required()) {
        <span class="required-asterisk" aria-hidden="true">*</span>
        <span class="sr-only">(obligatorio)</span>
      }
    </label>
  }

  <div class="form-field-body" [class.form-field-body--con-icono]="icon()">
    <!-- `aria-hidden` desde el átomo: el ícono no es el nombre accesible del
         control —eso es el label— sino una ayuda de reconocimiento. -->
    @if (iconoNombre(); as nombre) {
      <span class="form-field-icon">
        <app-nav-icon [name]="nombre" />
      </span>
    }

    <div class="form-field-control">
      <ng-content />

    <!-- La explicación al apuntar o al enfocar. Sale del flujo —posición
         absoluta— para que aparecer no empuje el formulario hacia abajo, y no
         se saca del DOM al ocultarse: el `aria-describedby` del control apunta
         acá, y un nodo que no existe no describe nada. -->
      @if (description()) {
        <p [id]="descriptionId()" class="form-field-description">{{ description() }}</p>
      }
    </div>
  </div>

  @if (errorMessage()) {
    <p [id]="errorId()" class="form-field-error" role="alert">
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
      <span>{{ errorMessage() }}</span>
    </p>
  } @else if (hint()) {
    <p [id]="hintId()" class="form-field-hint">
      {{ hint() }}
    </p>
  }
</div>
