@if (src() && !failure()) {
  <img class="logo-consultorio__imagen" [src]="src()" [alt]="alt()" (error)="toFail()" />
} @else {
  <!-- El marcador anuncia lo que falta; el icono es decoración. -->
  <span class="logo-consultorio__vacio" data-testid="logo-consultorio-vacio">
    <svg
      class="logo-consultorio__icono"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 21h18" />
      <path d="M5 21V7l7-4 7 4v14" />
      <path d="M9 21v-6h6v6" />
      <path d="M12 9v3M10.5 10.5h3" />
    </svg>
    Sin logo
  </span>
}
