<!-- En modo ícono el texto se va al nombre accesible y al tooltip: la flecha
     sola no dice a dónde se vuelve. -->
<!-- Excepción ADR-0012 §3 (D-05, 23/09): volver, con aria-label y globo; sólo si la pantalla la enciende. -->
<a
  app-button
  variant="secondary"
  data-testid="volver"
  [iconOnly]="iconOnly()"
  [attr.aria-label]="iconOnly() ? label() : null"
  [appTooltip]="iconOnly() ? label() : ''"
  [href]="href()"
  (click)="handleClick($event)"
>
  <app-nav-icon name="arrow-left" />
  @if (!iconOnly()) {
    {{ label() }}
  }
</a>
