<div [class]="wrapperClasses()">
  <!-- El glifo del campo, cuando quien monta el control lo proyecta. Va DENTRO
       del marco —no al lado del rótulo— para compartir borde, foco y estado de
       error con el desplegable, igual que en `app-input`. Sin ícono proyectado
       no queda ningún hueco: no hay envoltorio. -->
  <ng-content select="[slot=icon-start]" />

  <!-- La selección se marca en cada `<option>` con `[selected]`, y NO con un
       `[value]` sobre el `<select>`.

       El motivo es de orden de renderizado: en el primer pase, Angular aplica
       las propiedades del elemento **antes** de crear los `<option>` del `@for`.
       Escribir `select.value = "1"` cuando esa opción todavía no existe no hace
       nada, y el navegador se queda en la primera —el placeholder oculto—. El
       síntoma es un desplegable que dice «Seleccionar opción» aunque tenga
       valor, y sólo aparece cuando el control **nace** con selección; con un
       formulario, que la escribe después, no se veía. Lo encontró el recorrido
       con usuarios reales, en el selector de recurso de la agenda. -->
  <select
    class="native-select"
    [id]="controlId()"
    [disabled]="isDisabled()"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-required]="required() || null"
    [attr.aria-describedby]="describedBy()"
    (change)="handleChange($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)"
  >
    <!-- `hidden` y no `disabled`: el navegador se niega a seleccionar una
         opción deshabilitada, así que con `disabled` el placeholder nunca
         llegaba a mostrarse y el select saltaba a la primera opción real. -->
    @if (placeholder()) {
      <option value="" hidden>{{ placeholder() }}</option>
    }
    @for (option of options(); track $index) {
      <option
        [value]="$index"
        [selected]="selectedIndex() === $index"
        [disabled]="option.disabled ?? false"
      >
        {{ option.label }}
      </option>
    }
  </select>

  <!-- Flecha del spec: la nativa se apaga con `appearance: none` en el CSS -->
  <span class="select-arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </span>
</div>
