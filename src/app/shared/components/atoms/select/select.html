<div [class]="wrapperClasses()">
  <!-- El glifo del campo, cuando quien monta el control lo proyecta. Va DENTRO
       del marco —no al lado del rótulo— para compartir borde, foco y estado de
       error con el desplegable, igual que en `app-input`. Sin ícono proyectado
       no queda ningún hueco: no hay envoltorio. -->
  <ng-content select="[slot=icon-start]" />

  @if (isSearchable()) {
    <button
      type="button"
      class="searchable-display"
      [class.has-value]="selectedIndex() >= 0"
      [class.is-placeholder]="selectedIndex() < 0"
      [disabled]="isDisabled()"
      [attr.aria-expanded]="isSearchOpen()"
      [attr.aria-label]="accessibleLabel()"
      (click)="toggleSearch($event)"
    >
      {{ selectedOptionLabel() || placeholder() }}
    </button>
  }

  <!-- La selección se marca en cada `<option>` con `[selected]`, y NO con un
       `[value]` sobre el `<select>`. -->
  <select
    class="native-select"
    [class.native-select--hidden]="isSearchable()"
    [id]="controlId()"
    [disabled]="isDisabled()"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-required]="required() || null"
    [attr.aria-describedby]="describedBy()"
    (change)="handleChange($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)"
  >
    @if (placeholder()) {
      <option value="" hidden>{{ placeholder() }}</option>
    }
    @for (option of options(); track $index) {
      <option
        [value]="$index"
        [selected]="selectedIndex() === $index"
        [disabled]="option.disabled ?? false"
      >
        {{ option.label }}
      </option>
    }
  </select>

  <!-- Flecha del spec: la nativa se apaga con `appearance: none` en el CSS -->
  <span class="select-arrow" aria-hidden="true" [class.is-open]="isSearchOpen()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </span>

  @if (isSearchable() && isSearchOpen()) {
    <div class="select-search-panel">
      <div class="select-search-header">
        <input
          #searchInput
          type="search"
          class="select-search-input"
          [placeholder]="searchPlaceholder()"
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
          (keydown)="onSearchKeydown($event)"
        />
      </div>
      <ul class="select-search-list" role="listbox">
        @for (opt of filteredOptions(); track opt.value; let idx = $index) {
          <li
            role="option"
            tabindex="0"
            class="select-search-item"
            [attr.aria-selected]="opt.value === value()"
            [class.is-selected]="opt.value === value()"
            [class.is-active]="idx === activeSearchIndex()"
            [class.is-disabled]="opt.disabled"
            (click)="chooseOption(opt)"
            (keydown.enter)="chooseOption(opt)"
            (keydown.space)="chooseOption(opt)"
          >
            {{ opt.label }}
          </li>
        }
        @if (filteredOptions().length === 0) {
          <li class="select-search-empty">No se encontraron opciones</li>
        }
      </ul>
    </div>
  }
</div>
