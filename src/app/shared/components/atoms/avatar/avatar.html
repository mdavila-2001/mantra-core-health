@if (showImage()) {
  <img class="avatar__image" [src]="src()" [alt]="alt()" (error)="handleImageError()" />
} @else if (showInitials()) {
  <span class="avatar__initials" aria-hidden="true">{{ computedInitials() }}</span>
} @else {
  <svg
    class="avatar__silhouette"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
    <circle cx="12" cy="7" r="4" />
  </svg>
}

@if (status() !== 'none') {
  <!-- El estado también viaja en el aria-label del host: un punto de color no
       comunica presencia por sí solo. -->
  <span
    class="avatar__status"
    [class.avatar__status--online]="status() === 'online'"
    [class.avatar__status--offline]="status() === 'offline'"
    aria-hidden="true"
  ></span>
}
