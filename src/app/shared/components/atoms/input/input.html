<div [class]="wrapperClasses()">
  <!-- Ícono inicial: la lupa la pone el propio control; el resto se proyecta.
       Van proyectados y NO por [innerHTML]: el sanitizador de Angular descarta
       los SVG, así que un ícono pasado como string nunca llegaría a pintarse. -->
  @if (type() === 'search') {
    <span class="input-icon icon-left" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.2" y2="16.2" />
      </svg>
    </span>
  }
  <ng-content select="[slot=icon-start]" />

  <input
    class="native-input"
    [id]="controlId()"
    [type]="effectiveType()"
    [value]="value() ?? ''"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-required]="required() || null"
    [attr.aria-describedby]="describedBy()"
    [attr.data-testid]="testId()"
    [attr.role]="comboboxAria() ? 'combobox' : null"
    [attr.aria-expanded]="comboboxAria()?.expanded ?? null"
    [attr.aria-controls]="comboboxAria()?.controls ?? null"
    [attr.aria-activedescendant]="comboboxAria()?.activeDescendant ?? null"
    [attr.aria-autocomplete]="comboboxAria() ? (comboboxAria()!.autocomplete ?? 'list') : null"
    (input)="handleInput($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)"
  />

  @if (type() === 'search' && value()) {
    <button
      type="button"
      class="input-action-btn"
      (click)="clearSearch()"
      [disabled]="isDisabled()"
      aria-label="Limpiar búsqueda"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  }

  @if (type() === 'password') {
    <button
      type="button"
      class="input-action-btn"
      (click)="togglePasswordVisibility()"
      [disabled]="isDisabled()"
      [attr.aria-pressed]="passwordVisible()"
      [attr.aria-label]="passwordVisible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    >
      @if (passwordVisible()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
          <line x1="1" y1="1" x2="23" y2="23" />
        </svg>
      }
    </button>
  }

  <ng-content select="[slot=icon-end]" />
</div>
