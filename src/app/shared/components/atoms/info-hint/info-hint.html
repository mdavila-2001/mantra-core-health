<button
  type="button"
  class="info-hint"
  [attr.aria-label]="ariaLabel()"
  [appTooltip]="text()"
  [appTooltipPosition]="position()"
  [appTooltipShift]="true"
  [appTooltipHoverable]="true"
>
  <svg
    class="info-hint__icon"
    viewBox="0 0 24 24"
    width="16"
    height="16"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <circle cx="12" cy="12" r="9.25" />
    <path d="M12 11v5.25" />
    <circle cx="12" cy="7.75" r="0.6" fill="currentColor" stroke="none" />
  </svg>
</button>
