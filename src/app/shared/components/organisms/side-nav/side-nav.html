<!-- El velo solo existe en modo cajón: cierra al tocar fuera del panel. -->
@if (isDrawerOpen()) {
  <div class="side-nav__overlay" (click)="handleOverlayClick()" aria-hidden="true"></div>
}

<nav class="side-nav__panel" aria-label="Navegación principal">
  @for (section of sections(); track section.label) {
    <div class="side-nav__section">
      <!-- Colapsado el rótulo se oculta a la vista, pero sigue nombrando al
           grupo para el lector de pantalla. -->
      <p class="side-nav__section-label" [class.sr-only]="isCollapsed()">{{ section.label }}</p>

      <ul class="side-nav__list">
        @for (item of section.items; track item.route) {
          <li>
            @if (isEnabled(item)) {
              <a
                #navLink
                class="side-nav__link"
                data-testid="nav-enlace"
                [attr.data-route]="item.route"
                [routerLink]="item.route"
                [class.is-active]="rutaActiva() === item.route"
                [attr.aria-current]="rutaActiva() === item.route ? 'page' : null"
                [attr.aria-label]="isCollapsed() ? item.label : null"
                [appTooltip]="isCollapsed() ? item.label : ''"
                appTooltipPosition="right"
                (click)="handleNavigate()"
              >
                <span class="side-nav__icon" aria-hidden="true">
                  <app-nav-icon [name]="item.icon" />
                </span>

                <span class="side-nav__label">{{ item.label }}</span>

                @if (item.badge) {
                  <app-badge
                    class="side-nav__badge"
                    variant="primary"
                    size="sm"
                    [value]="item.badge"
                    [label]="'pendientes en ' + item.label"
                  />
                }
              </a>
            } @else {
              <!-- Deshabilitado: ni ancla ni foco. Sigue anunciándose como tal. -->
              <span class="side-nav__link is-disabled" aria-disabled="true">
                <span class="side-nav__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <line x1="5.6" y1="5.6" x2="18.4" y2="18.4" />
                  </svg>
                </span>
                <span class="side-nav__label">{{ item.label }}</span>
              </span>
            }
          </li>
        }
      </ul>
    </div>
  }
</nav>
