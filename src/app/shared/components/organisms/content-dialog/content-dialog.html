<!-- El clic es el atajo de ratón para cerrar por el fondo. El equivalente de
     teclado no falta: `Escape` lo maneja el navegador sobre el `<dialog>` y
     llega por `(cancel)`. Añadir un keydown acá duplicaría ese camino. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #nativeDialog
  class="content-dialog"
  data-testid="content-dialog"
  [attr.data-size]="size()"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="description() === null ? null : descriptionId"
  (cancel)="handleNativeCancel($event)"
  (click)="handleBackdropClick($event)"
>
  <div class="content-dialog__panel">
    <header class="content-dialog__encabezado">
      <div class="content-dialog__texto">
        <h2 class="content-dialog__titulo" [id]="headingId" data-testid="content-dialog-title">
          {{ heading() }}
        </h2>
        @if (description(); as bajada) {
          <p class="content-dialog__bajada" [id]="descriptionId">{{ bajada }}</p>
        }
      </div>

      <!-- `autofocus` acá y no en el contenido: el foco inicial tiene que caer
           adentro del modal, y el primer control es el que cierra.

           Lleva la cruz Y su texto. Sólo la cruz habría sido más limpia, pero
           `closeLabel` no siempre dice «Cerrar» —hay modales que cierran con
           «Entendido»— y esconder esa palabra detrás de un glifo le cambiaría
           el sentido al botón. -->
      <button
        app-button
        type="button"
        variant="ghost"
        size="sm"
        autofocus
        class="content-dialog__cerrar"
        data-testid="content-dialog-close"
        (clicked)="solicitarCierre()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m7 7 10 10M17 7 7 17" />
        </svg>
        {{ closeLabel() }}
      </button>
    </header>

    <!-- El cuerpo se recorre adentro y avisa que sigue: las sombras de los
         bordes aparecen sólo cuando hay algo más arriba o más abajo, con el
         truco de los fondos fijos (`background-attachment: local`). Sin eso,
         un formulario largo cortado a media pantalla se lee como uno que
         termina ahí. -->
    <div class="content-dialog__cuerpo">
      <ng-content />
    </div>

    <!-- El pie va fuera del cuerpo con scroll —mismo reparto que `card`—: las
         acciones de la operación no se buscan al final del recorrido. Si nadie
         proyecta nada, el `:empty` del CSS lo deja sin dibujar. -->
    <footer class="content-dialog__pie" data-testid="content-dialog-actions">
      <ng-content select="[dialog-actions]" />
    </footer>
  </div>
</dialog>
