@if (error(); as mensaje) {
  <app-alert tone="error" title="No pudimos adjuntar el archivo">{{ mensaje }}</app-alert>
}

@if (rechazados().length) {
  <app-alert tone="warning" title="Estos archivos no se pudieron usar">
    <ul class="adjuntar__rechazados">
      @for (motivo of rechazados(); track motivo) {
        <li>{{ motivo }}</li>
      }
    </ul>
  </app-alert>
}

<app-form-field
  [label]="maxFiles() === 1 ? 'Archivo' : 'Archivos'"
  [hint]="hint()"
  [required]="true"
>
  <app-file-input
    [(files)]="seleccionados"
    [maxSizeBytes]="maxBytes"
    [maxFiles]="maxFiles()"
    [multiple]="maxFiles() > 1"
    [disabled]="enviando()"
    (rejected)="alRechazar($event)"
  />
</app-form-field>

<!-- La categoría se deduce del tipo del archivo: era una pregunta cuya
     respuesta ya estaba en lo que se acababa de elegir. La sensibilidad sí se
     pregunta —eso no lo dice el archivo—. -->

<app-form-field
  label="Sensibilidad"
  hint="PHI es dato clínico protegido: sólo lo ve quien tiene permiso."
  [required]="true"
>
  <app-radio-group [(value)]="sensibilidad" [disabled]="enviando()">
    <app-radio value="NORMAL" label="Normal" />
    <app-radio value="PHI" label="PHI" />
  </app-radio-group>
</app-form-field>

<button
  app-button
  variant="primary"
  data-testid="adjuntar-enviar"
  [isLoading]="enviando()"
  [disabled]="!puedeSubir()"
  (clicked)="subir()"
>
  {{ seleccionados().length > 1 ? 'Adjuntar los ' + seleccionados().length : 'Adjuntar' }}
</button>

<!-- En qué va la tanda. Una espera de siete subidas sin nada que la explique se
     lee como que la pantalla se colgó. -->
@if (progreso(); as texto) {
  <p class="adjuntar__progreso" role="status" data-testid="adjuntar-progreso">{{ texto }}</p>
}
