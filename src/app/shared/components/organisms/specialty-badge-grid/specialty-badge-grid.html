<ul class="specialty-badge-grid__lista" [attr.aria-label]="etiqueta()">
  @for (especialidad of especialidades(); track especialidad.id) {
    <li class="specialty-badge-grid__item">
      <app-specialty-badge
        [especialidad]="especialidad.nombre"
        [estado]="especialidad.estado"
        [sello]="especialidad.sello"
      />
    </li>
  }
</ul>
