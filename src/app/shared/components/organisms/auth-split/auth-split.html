<div class="auth-split">
  <!-- Columna de marca. `aria-hidden` porque es decorativa: lo que importa está
       en el formulario, y anunciarla duplicaría el mensaje.
       El diseño original lleva una fotografía; usamos un degradado de marca
       porque el archivo no está aprobado todavía y así no dependemos de él. -->
  <aside class="auth-split__brand" aria-hidden="true">
    <!-- Lienzo vivo: red de nodos + masas orgánicas, ver auth-split.css. Solo
         escritorio (el propio `.auth-split__brand` está oculto antes de eso),
         así que no anima nada en mobile. -->
    <svg class="auth-split__pulse" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" focusable="false">
      <circle class="auth-split__blob auth-split__blob--1" cx="300" cy="90" r="150" />
      <circle class="auth-split__blob auth-split__blob--2" cx="70" cy="170" r="110" />
      <circle class="auth-split__blob auth-split__blob--3" cx="330" cy="270" r="95" />

      <circle class="auth-split__ring auth-split__ring--1" cx="288" cy="132" r="6" />
      <circle class="auth-split__ring auth-split__ring--2" cx="288" cy="132" r="6" />
      <circle class="auth-split__ring auth-split__ring--3" cx="288" cy="132" r="6" />

      <g class="auth-split__network">
        <line class="auth-split__edge" x1="288" y1="132" x2="205" y2="66" />
        <line class="auth-split__edge" x1="288" y1="132" x2="356" y2="196" />
        <line class="auth-split__edge" x1="288" y1="132" x2="226" y2="214" />
        <line class="auth-split__edge" x1="205" y1="66" x2="124" y2="104" />
        <line class="auth-split__edge" x1="356" y1="196" x2="326" y2="284" />
        <line class="auth-split__edge" x1="226" y1="214" x2="152" y2="252" />

        <circle class="auth-split__node" cx="288" cy="132" r="5" />
        <circle class="auth-split__node" cx="205" cy="66" r="3.5" />
        <circle class="auth-split__node" cx="356" cy="196" r="4" />
        <circle class="auth-split__node" cx="226" cy="214" r="3.5" />
        <circle class="auth-split__node" cx="124" cy="104" r="3" />
        <circle class="auth-split__node" cx="326" cy="284" r="3" />
        <circle class="auth-split__node" cx="152" cy="252" r="3" />
      </g>
    </svg>

    <!-- `@for … track` sobre el propio texto: al cambiar de paciente a
         profesional el nodo se rehace y la animación de entrada vuelve a
         correr, en vez de que el titular se reemplace de golpe. -->
    <div class="auth-split__brand-content">
      <p class="auth-split__wordmark">REDSAT</p>
      @for (texto of claimKeyed(); track texto) {
        <h2 class="auth-split__claim">{{ texto }}</h2>
      }
      @for (texto of taglineKeyed(); track texto) {
        <p class="auth-split__tagline">{{ texto }}</p>
      }
    </div>
  </aside>

  <main class="auth-split__panel">
    <!-- El selector de tema va fuera del formulario: es chrome, no contenido.
         Solo íconos: tres palabras sueltas arriba de una pantalla de acceso se
         leían como texto perdido en vez de como un control. El nombre va en
         `aria-label` —que es lo que anuncia un lector— y en `title` para quien
         pase el puntero. `aria-pressed` dice cuál está activo sin depender del
         color, que es lo único que distinguía al elegido. -->
    <div class="auth-split__theme" role="group" aria-label="Tema de la interfaz">
      @for (option of themeOptions; track option.mode) {
        <button
          app-button
          size="sm"
          iconOnly
          [variant]="theme() === option.mode ? 'secondary' : 'ghost'"
          [attr.aria-pressed]="theme() === option.mode"
          [attr.aria-label]="option.label"
          [attr.title]="option.label"
          (clicked)="setTheme(option.mode)"
        >
          @switch (option.mode) {
            @case ('light') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="4" />
                <path
                  stroke-linecap="round"
                  d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              </svg>
            }
            @case ('dark') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                />
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
                <rect x="2.5" y="4" width="19" height="12.5" rx="2" />
                <path stroke-linecap="round" d="M9 20h6m-3-3.5V20" />
              </svg>
            }
          }
        </button>
      }
    </div>

    <div class="auth-split__content">
      <ng-content />
    </div>
  </main>
</div>
