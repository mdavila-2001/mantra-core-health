<app-specialty-icon class="specialty-badge__icono" [especialidad]="especialidad()" />

<span class="specialty-badge__nombre">{{ especialidad() }}</span>

@if (certificada()) {
  <!-- Forma, no color: el glifo distingue sin depender del tono, y el texto
       lo dice para quien no ve la pantalla. -->
  <span class="specialty-badge__certificada">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
    <span class="sr-only">Certificada</span>
  </span>
}

@if (muestraSello()) {
  <app-status-seal
    class="specialty-badge__sello"
    [variant]="sello()!"
    [label]="estado()"
  />
}
