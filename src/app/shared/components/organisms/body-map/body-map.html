<!-- Sin zonas no hay silueta: las formas están, pero sin `id` no hay nada que
     elegir, y un dibujo que no se puede pulsar es peor que su ausencia. -->
@if (dibujables().length > 0) {
  <div class="body-map">
    <svg
      class="body-map__lienzo"
      [attr.viewBox]="viewBox"
      role="group"
      [attr.aria-label]="etiqueta()"
      focusable="false"
    >
      @for (zona of dibujables(); track zona.id) {
        <g class="body-map__zona" [class.body-map__zona--elegida]="zona.id === value()">
          <!-- El `role="button"` y el `tabindex` son lo que convierte un dibujo
               en un control: sin ellos la silueta sería un adorno que sólo
               funciona con el dedo. El nombre accesible es el completo
               («Pecho y respiración»); dentro de la forma no entra texto a
               375 px, así que la palabra va en la línea de abajo. -->
          <path
            class="body-map__forma"
            role="button"
            tabindex="0"
            [attr.d]="zona.d"
            [attr.aria-pressed]="zona.id === value()"
            [attr.aria-label]="zona.nombre"
            [attr.data-testid]="testId() + '-' + zona.id"
            (click)="elegir(zona.id)"
            (keydown.enter)="elegir(zona.id)"
            (keydown.space)="elegirConBarra($event, zona.id)"
          />
        </g>
      }
    </svg>

    <!-- La tercera señal de lo elegido, además del relleno y del trazo: en
         palabras. Es la que sirve cuando no se distinguen los colores y la que
         un lector de pantalla anuncia al cambiar. -->
    <p class="body-map__elegida" aria-live="polite" [attr.data-testid]="testId() + '-elegida'">
      @if (nombreElegido(); as nombre) {
        Zona elegida: <strong>{{ nombre }}</strong>
      } @else {
        Tocá una parte del cuerpo.
      }
    </p>
  </div>
}
