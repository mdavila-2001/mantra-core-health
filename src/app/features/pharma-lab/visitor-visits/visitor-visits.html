<app-page-header
  title="Mis visitas médicas"
  subtitle="Solicitudes enviadas a médicos, su estado y su horario confirmado."
/>

<app-view-state-host [state]="state()" (retry)="retry()">
  @if (data(); as panel) {
    <label class="visits__reason" for="motivo-cancelacion">
      Motivo de la cancelación
      <input
        id="motivo-cancelacion"
        class="visits__reason-input"
        type="text"
        data-testid="cancel-reason"
        placeholder="Ej.: imprevisto de agenda"
        [value]="motivo()"
        (input)="escribirMotivo($event)"
      />
    </label>

    @if (aviso(); as texto) {
      <p class="visits__notice" role="status" data-testid="visit-notice">{{ texto }}</p>
    }

    @if (panel.requests.length === 0) {
      <p class="visits__empty" data-testid="visits-empty">
        Todavía no solicitaste ninguna visita.
      </p>
    } @else {
      <app-data-table
        data-testid="visits-table"
        [state]="filas()"
        [columns]="columnas()"
        [trackBy]="porId"
        [rowLabel]="nombreDeFila"
        caption="Solicitudes de visita enviadas"
        (retry)="retry()"
      />
    }
  }
</app-view-state-host>

<ng-template #celdaAccion let-fila>
  <button
    app-button
    variant="neutral"
    size="sm"
    [attr.data-testid]="'cancel-' + fila.id"
    [attr.aria-label]="'Cancelar: la visita del ' + fila.fecha"
    (click)="cancelar(fila.request)"
  >
    Cancelar
  </button>
</ng-template>
