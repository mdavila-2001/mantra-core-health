<app-page-header
  title="Nueva agenda de recolección"
  subtitle="Programa qué agente vuelve a mirar qué país, y cada cuánto."
  [breadcrumbs]="breadcrumbs()"
/>

@if (created(); as agenda) {
  <div class="m44__seccion">
    <h2 appAnuncio [asertivo]="false" class="m44__titulo">La agenda quedó programada</h2>

    <dl class="m44__datos">
      <div>
        <dt>Agenda</dt>
        <dd><code>{{ agenda.id }}</code></dd>
      </div>
      <div>
        <dt>Agente</dt>
        <dd><code>{{ agenda.agentId }}</code></dd>
      </div>
      @if (agenda.nextRunAt; as proxima) {
        <div>
          <dt>Próxima corrida</dt>
          <dd>
            <time [attr.datetime]="proxima.toISOString()">{{ proxima.toLocaleString() }}</time>
          </dd>
        </div>
      }
    </dl>

    <button app-button variant="primary" (clicked)="otraAgenda()">Programar otra</button>
  </div>
} @else {
  @if (errorMessage(); as mensaje) {
    <app-alert appAnuncio tone="error" class="m44__alert">{{ mensaje }}</app-alert>
  }

  <app-paginated-form
  [paginas]="paginas"
  [form]="form"
  label="Nueva agenda de recolección"
  submitLabel="Programar agenda"
  [pending]="isSubmitting()"
  (enviado)="submit()"
/>
}
