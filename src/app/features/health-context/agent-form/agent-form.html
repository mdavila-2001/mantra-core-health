<app-page-header
  title="Nuevo agente"
  subtitle="Registra quién recolecta: un servicio, un scraper o una persona con nombre y código propios."
  [breadcrumbs]="breadcrumbs()"
/>

@if (created(); as agente) {
  <div class="m44__seccion">
    <h2 appAnuncio [asertivo]="false" class="m44__titulo">El agente quedó registrado</h2>

    <dl class="m44__datos">
      <div>
        <dt>Agente</dt>
        <dd><code>{{ agente.id }}</code></dd>
      </div>
      <div>
        <dt>Código</dt>
        <dd><code>{{ agente.code }}</code></dd>
      </div>
    </dl>

    <p class="m44__texto">
      Guardá el identificador: lo piden la programación de recolecciones y el
      arranque manual de una corrida.
    </p>

    <button app-button variant="primary" (clicked)="otraAlta()">Registrar otro</button>
  </div>
} @else {
  @if (errorMessage(); as mensaje) {
    <app-alert appAnuncio tone="error" class="m44__alert">{{ mensaje }}</app-alert>
  }

  <app-paginated-form
  [paginas]="paginas"
  [form]="form"
  label="Nuevo agente"
  submitLabel="Registrar agente"
  [pending]="isSubmitting()"
  (enviado)="submit()"
/>
}
