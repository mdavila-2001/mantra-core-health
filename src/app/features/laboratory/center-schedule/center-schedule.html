<app-page-header
  title="Horarios y equipos"
  subtitle="Cuándo atiende cada equipo de su centro: cada uno es una línea de producción, y de su suma salen los turnos que ven los pacientes."
/>

<app-view-state-host [state]="state()" (retry)="load()">
  @if (center(); as c) {
    <app-card class="center" padding="lg" data-testid="centro-horarios">
      <p class="center__name">{{ c.unitName }}</p>

      <app-tabs [(selectedIndex)]="tab">
        <app-tab label="Horarios">
          <app-schedule-tab [center]="c" (viewChange)="apply($event)" />
        </app-tab>
        <app-tab label="Equipos">
          <app-equipment-tab [center]="c" [linkGlossary]="linkGlossary()" (viewChange)="apply($event)" />
        </app-tab>
        <app-tab label="Ocupación">
          <app-occupancy-tab [center]="c" />
        </app-tab>
      </app-tabs>
    </app-card>
  }
</app-view-state-host>
