<section class="own" aria-labelledby="own-title">
  <h2 id="own-title" class="own__title">Registre la orden que llegó en papel</h2>
  <p class="own__help">Busque al paciente por su documento y elija el estudio. Nace en «Borrador».</p>

  <app-form-field label="Documento del paciente" hint="Coincidencia exacta con su documento de identidad." [required]="true" [errorMessage]="errors().patient">
    @if (patient(); as p) {
      <div class="own__patient" data-testid="lab-new-order-patient">
        <strong>{{ p.displayName }}</strong>
        @if (p.patientCode) {
          <span class="own__code">{{ p.patientCode }}</span>
        }
        <button app-button type="button" variant="ghost" size="sm" (clicked)="changePatient()">Cambiar</button>
      </div>
    } @else {
      <div class="own__lookup">
        <app-input ariaLabel="Documento del paciente" inputMode="numeric" [(value)]="nationalId" [hasError]="!!errors().patient" testId="lab-new-order-national-id" />
        <button app-button type="button" variant="secondary" [disabled]="busy() || nationalId().trim() === ''" (clicked)="lookupPatient()" data-testid="lab-new-order-lookup">
          Buscar
        </button>
      </div>
    }
  </app-form-field>

  <app-form-field label="Estudio" [required]="true" [errorMessage]="errors().study">
    <app-concept-select [target]="targetStudy" [(value)]="study" [clearable]="false" placeholder="Elija un estudio" />
  </app-form-field>

  @if (askCategory()) {
    <app-form-field label="¿Es de laboratorio o de imagenología?" [required]="true">
      <app-radio-group [value]="manualCategory()" (valueChange)="manualCategory.set($event === 'LAB' || $event === 'IMAGING' ? $event : null)" name="own-order-category">
        <app-radio value="LAB" label="Laboratorio" />
        <app-radio value="IMAGING" label="Imagenología" />
      </app-radio-group>
    </app-form-field>
  }

  <app-form-field label="Prioridad" hint="Opcional.">
    <app-concept-select [target]="targetPriority" [(value)]="priority" placeholder="Sin especificar" />
  </app-form-field>

  <div class="own__row">
    <app-form-field label="Quién firmó la orden" hint="Opcional. Médico que la emitió en papel.">
      <app-input ariaLabel="Quién firmó la orden" [(value)]="requesterName" testId="lab-new-order-requester" />
    </app-form-field>
    <app-form-field label="Matrícula" hint="Opcional.">
      <app-input ariaLabel="Matrícula de quien firmó" [(value)]="requesterLicense" />
    </app-form-field>
  </div>

  @if (error(); as message) {
    <app-alert tone="error" dismissible data-testid="lab-new-order-error" (dismissed)="error.set(null)">{{ message }}</app-alert>
  }
  <div>
    <button app-button type="button" variant="primary" [disabled]="busy()" [isLoading]="busy()" (clicked)="submit()" data-testid="lab-new-order-submit">
      Crear la orden
    </button>
  </div>
</section>
