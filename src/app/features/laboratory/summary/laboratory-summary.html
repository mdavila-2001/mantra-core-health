<!-- Diagnostic-center home: the greeting band, then the day in four blocks.
     One centered, full-width piece; each block resolves its own state. -->
<div class="lab-home" data-testid="lab-home">
  <section class="welcome" aria-labelledby="lab-home-title">
    @if (today(); as date) {
      <p class="welcome__date">
        <app-nav-icon name="calendar" aria-hidden="true" />
        <span>{{ date | date: "EEEE d 'de' MMMM" }}</span>
      </p>
    }
    <h1 class="welcome__title" id="lab-home-title">
      {{ greeting() }}, <span class="welcome__name" data-testid="lab-home-name">{{ centerName() }}</span>
    </h1>
    <p class="welcome__lead">
      Las órdenes que le derivaron, los resultados por subir y los turnos de hoy, a un clic.
    </p>
  </section>

  <div class="lab-home__grid">
    <app-lab-orders-today
      class="lab-home__wide"
      [state]="ordersState()"
      (retry)="loadOrders()"
    />
    <app-lab-pending-results
      [state]="pendingState()"
      [summary]="summary()"
      (retry)="loadOrders()"
    />
    <app-lab-day-bookings [state]="bookingsState()" (retry)="loadBookings()" />
    <app-lab-catalog-overview [state]="catalogState()" (retry)="loadSummary()" />
  </div>
</div>
