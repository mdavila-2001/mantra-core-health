@if (!embebido()) {
  <app-page-header title="Buzón de solicitudes" [subtitle]="copy().subtitle" [breadcrumbs]="breadcrumbs()" />
}

<div class="inbox">
  <!-- Loading, empty with its next action, forbidden, offline and error with
       its request id: the nine states of the system, not hand-made ones. -->
  <app-view-state-host [state]="state()" (retry)="retry()">
    @if (specialtiesError(); as message) {
      <app-alert tone="error" data-testid="access-requests-specialties-error">
        {{ message }}
        <button alert-actions app-button type="button" variant="outline" size="sm" (clicked)="loadSpecialties()">
          Volver a intentar
        </button>
      </app-alert>
    }

    <app-card class="inbox__card">
      <app-tabs appearance="browser" [(selectedIndex)]="activeTab">
        @for (section of sections(); track section.key) {
          <app-tab [label]="section.label">
            @if (section.items.length === 0) {
              <app-empty-state [title]="section.none" />
            } @else {
              <ul class="inbox__list" [attr.data-testid]="'access-requests-' + section.key">
                @for (item of section.items; track item.id) {
                  <li>
                    <app-access-request-card
                      [item]="item"
                      [role]="role()"
                      [specialtyNames]="specialtyNames()"
                      [busy]="busyId() === item.id"
                      (decided)="decide(item, $event)"
                      (revoked)="revoke(item)"
                    />
                  </li>
                }
              </ul>
            }
          </app-tab>
        }
      </app-tabs>
    </app-card>
  </app-view-state-host>
</div>
