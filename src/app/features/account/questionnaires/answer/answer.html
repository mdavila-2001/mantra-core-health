@if (vista(); as estado) {
  <app-page-header
    [title]="estado.status === 'ready' ? estado.data.title : 'Cuestionario'"
    subtitle="Tus respuestas son privadas: solo las ve el profesional que te atendió."
    [breadcrumbs]="breadcrumbs()"
  >
    <app-back-link
      page-actions
      [fallback]="rutaDeMisCuestionarios"
      label="Volver a mis cuestionarios"
    />
  </app-page-header>
}

<app-view-state-host [state]="vista()" (retry)="cargar()">
  <div vsh-skeleton><app-skeleton variant="text" [lines]="6" /></div>

  @if (vista(); as estado) {
    @if (estado.status === 'ready') {
      @if (estado.data.description) {
        <p class="responder__consigna">{{ estado.data.description }}</p>
      }

      @if (avisoFaltantes()) {
        <app-alert tone="error" class="responder__aviso" data-testid="responder-faltantes">
          {{ avisoFaltantes() }}
        </app-alert>
      }

      <!-- Sin `FormGroup` no hay `NgForm`: el `submit` nativo se corta acá y el envío —click o
           Enter— entra por el mismo camino, sin recargar la página. -->
      <form
        class="responder__form"
        (submit)="$event.preventDefault(); enviar()"
        data-testid="responder-form"
      >
        <!-- El render lo pone `app-survey-form`, el MISMO organismo que la vista
             previa de quien autora la encuesta. Copiarlo acá dejaría una previa
             que miente en cuanto una de las dos cambie. -->
        <app-survey-form
          [preguntas]="estado.data.questions"
          [respuestas]="respuestas()"
          (respuestasChange)="respuestas.set($event)"
          [faltantes]="faltantes()"
          (respondido)="despejar($event)"
        />

        <div class="responder__acciones">
          <button
            app-button
            type="submit"
            variant="primary"
            [isLoading]="enviando()"
            data-testid="responder-enviar"
          >
            Enviar respuestas
          </button>
        </div>
      </form>
    }
  }
</app-view-state-host>
