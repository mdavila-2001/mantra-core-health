<app-content-dialog
  heading="Registrar dependiente"
  description="Escribí su CI. Si tiene una cuenta registrada, le vamos a enviar una notificación para que acepte ser tu dependiente."
  [dismissible]="!saving()"
  (closed)="closed.emit()"
>
  @if (errorMessage(); as mensaje) {
    <app-alert appAnuncio tone="error">{{ mensaje }}</app-alert>
  }

  <form class="dependents-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field label="CI" [required]="true" [errorMessage]="mensajeDelCampo()">
      <app-input
        formControlName="nationalId"
        autocomplete="off"
        [hasError]="mensajeDelCampo() !== ''"
        testId="dependent-national-id"
      />
    </app-form-field>

    <div class="dependents-form__acciones">
      <button
        app-button
        type="button"
        variant="secondary"
        [disabled]="saving()"
        (click)="dialog().close()"
      >
        Cancelar
      </button>
      <button
        app-button
        type="submit"
        variant="primary"
        [isLoading]="saving()"
        data-testid="dependent-submit"
      >
        Enviar solicitud
      </button>
    </div>
  </form>
</app-content-dialog>
