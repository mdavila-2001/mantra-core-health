<app-page-header
  title="Cómo me ven"
  subtitle="Tu ficha pública, tal como la ve quien te busca. Se configura desde tu perfil."
  [breadcrumbs]="breadcrumbs()"
/>

<app-view-state-host [state]="perfil()" (retry)="recargar()">
  <div class="previa">
    @if (ficha(); as ficha) {
      <app-public-profile-card [perfil]="ficha" [preview]="true" />
      @if (enlace(); as enlace) {
        <p class="previa__enlace" data-testid="previa-enlace">{{ enlace }}</p>
      }
    } @else {
      <!-- Sin vitrina no hay nada que previsualizar. No se ofrece un formulario
           acá: ALV-004 — un solo lugar para configurar el perfil. -->
      <app-alert tone="info" title="Todavía no tenés una ficha pública">
        Se arma desde tu perfil, en la sección «Lo que ven los demás».
      </app-alert>
    }

    <p class="previa__acciones">
      <a app-button variant="primary" routerLink="/my-account/edit" data-testid="previa-configurar">
        Configurar mi perfil
      </a>
    </p>
  </div>
</app-view-state-host>
