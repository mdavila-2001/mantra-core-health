<!-- El host de estados envuelve el perfil entero: sin la lectura no hay
     trayectoria que dibujar, y media trayectoria no se distingue de una
     trayectoria corta. El dibujo vive en practitioner-profile-view — la misma
     vista que usa la guía de profesionales para el perfil de otro doctor. -->
<app-view-state-host [state]="perfil()" (retry)="recargar()">
  @if (visible(); as perfil) {
    <app-practitioner-profile-view
      [perfil]="perfil"
      [esPropio]="true"
      (trayectoriaCambio)="recargar()"
    />
  }
</app-view-state-host>
