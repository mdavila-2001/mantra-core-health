<figure class="grafico">
  <figcaption class="grafico__titulo">
    Consultas mes a mes
    <span class="grafico__resumen">
      {{ total() }} en {{ puntos().length }} meses
      @if (conDesglose()) {
        · {{ totalConSeguro() }} con seguro · {{ totalSinSeguro() }} sin seguro
      }
      · {{ promedio() }} por mes en promedio
      @if (mejorMes(); as mejor) {
        · mejor mes {{ mejor.etiquetaLarga }}
      }
    </span>
  </figcaption>

  @if (conDesglose()) {
    <ul class="grafico__leyenda" data-testid="leyenda-seguro">
      <li class="grafico__leyenda-item">
        <span class="grafico__muestra grafico__muestra--con" aria-hidden="true"></span>
        Con seguro
      </li>
      <li class="grafico__leyenda-item">
        <span class="grafico__muestra grafico__muestra--sin" aria-hidden="true"></span>
        Sin seguro
      </li>
    </ul>
  }

  <!-- Las barras son decoración del dato: lo que se lee está en la tabla. -->
  <div class="grafico__barras" aria-hidden="true">
    @for (barra of barras(); track barra.clave) {
      <div class="grafico__columna">
        @if (conDesglose()) {
          <div class="grafico__pista grafico__pista--par">
            <div class="grafico__celda">
              @if (barra.destacado) {
                <span class="grafico__cifra grafico__cifra--par">{{ barra.conSeguro }}</span>
              }
              <div
                class="grafico__barra grafico__barra--con"
                [style.height.%]="barra.altoConSeguro"
              ></div>
            </div>
            <div class="grafico__celda">
              @if (barra.destacado) {
                <span class="grafico__cifra grafico__cifra--par">{{ barra.sinSeguro }}</span>
              }
              <div
                class="grafico__barra grafico__barra--sin"
                [style.height.%]="barra.altoSinSeguro"
              ></div>
            </div>
          </div>
        } @else {
          <div class="grafico__pista">
            @if (barra.destacado) {
              <span class="grafico__cifra">{{ barra.valor }}</span>
            }
            <div
              class="grafico__barra"
              [class.is-alta]="barra.destacado"
              [style.height.%]="barra.alto"
            ></div>
          </div>
        }
        <span class="grafico__mes">{{ barra.etiqueta }}</span>
      </div>
    }
  </div>

  <table class="solo-lectores">
    <caption>
      Consultas atendidas por mes
    </caption>
    <thead>
      <tr>
        <th scope="col">Mes</th>
        @if (conDesglose()) {
          <th scope="col">Con seguro</th>
          <th scope="col">Sin seguro</th>
        }
        <th scope="col">{{ conDesglose() ? 'Total' : 'Consultas' }}</th>
      </tr>
    </thead>
    <tbody>
      @for (punto of puntos(); track punto.clave) {
        <tr>
          <th scope="row">{{ punto.etiquetaLarga }}</th>
          @if (conDesglose()) {
            <td>{{ punto.conSeguro }}</td>
            <td>{{ punto.sinSeguro }}</td>
          }
          <td>{{ punto.valor }}</td>
        </tr>
      }
    </tbody>
  </table>
</figure>
