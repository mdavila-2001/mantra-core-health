<app-content-dialog
  [heading]="titulo()"
  description="La imagen que sus pacientes escanean para pagarle cuando le atienden acá."
  size="sm"
  closeLabel="Cerrar"
  (closed)="cerrar()"
>
  <div class="qr-sede">
    @if (error(); as mensaje) {
      <app-alert tone="error" data-testid="sede-qr-error">{{ mensaje }}</app-alert>
    }

    @if (fileId() === null) {
      @if (subiendo()) {
        <!-- La zona de soltar desaparece mientras sube: dejarla disponible
             invita a soltar un segundo archivo sobre una subida en curso, y el
             que gana sería el que termine último. -->
        <p class="qr-sede__subiendo" data-testid="sede-qr-subiendo">
          <app-spinner size="sm" decorative />
          Subiendo su QR…
        </p>
      } @else {
        <app-file-input
          testId="sede-qr-archivo"
          label="Elegir la imagen"
          accessibleLabel="Imagen del QR bancario"
          [accept]="accept"
          [maxSizeBytes]="maxSizeBytes"
          [showList]="false"
          [showFeedback]="false"
          [files]="elegidos()"
          (filesChange)="subir($event)"
          (rejected)="rechazar($event)"
        />
      }
    } @else {
      <figure class="qr-sede__figura">
        @if (bajandoImagen()) {
          <p class="qr-sede__cargando"><app-spinner size="sm" label="Cargando el QR" /></p>
        } @else if (imagen(); as fuente) {
          <img
            class="qr-sede__imagen"
            data-testid="sede-qr-imagen"
            [src]="fuente"
            [alt]="'QR bancario de ' + site().name"
          />
        } @else {
          <!-- El QR está configurado y no se pudo dibujar. Se dice así, y no
               como «no tenés ninguno»: son dos cosas distintas y la segunda
               llevaría a cargar otro encima del que ya está. -->
          <p class="qr-sede__sin-imagen" data-testid="sede-qr-sin-imagen">
            No pudimos mostrar la imagen guardada. Puede cargar otra con «Cambiar el QR».
          </p>
        }

        <!-- Mientras sube, el QR vigente sigue a la vista: hasta que la sede
             confirme el nuevo, el que vale es éste. -->
        @if (subiendo()) {
          <figcaption class="qr-sede__subiendo" data-testid="sede-qr-subiendo">
            <app-spinner size="sm" decorative />
            Subiendo su QR…
          </figcaption>
        }
      </figure>
    }
  </div>

  @if (fileId() !== null) {
    <!-- Cambiar es una acción del modal y va en su pie, no encima de la
         imagen: ahí tapaba el QR y se leía como parte de él. El botón abre el
         selector del sistema directamente —no una segunda pantalla—, y si se
         cancela no pasa nada: el QR guardado sigue siendo el que vale. -->
    <div dialog-actions class="qr-sede__acciones">
      <input
        #entradaDeReemplazo
        type="file"
        class="solo-lectores"
        tabindex="-1"
        aria-hidden="true"
        data-testid="sede-qr-entrada"
        [attr.accept]="accept"
        [disabled]="subiendo()"
        (change)="alElegirReemplazo($event)"
      />
      <button
        app-button
        variant="neutral"
        size="sm"
        type="button"
        data-testid="sede-qr-reemplazar"
        [isLoading]="subiendo()"
        [attr.aria-label]="'Cambiar el QR bancario de ' + site().name"
        (clicked)="reemplazar()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M4 20h4l10-10a2.83 2.83 0 0 0-4-4L4 16v4Z" />
          <path d="m13.5 6.5 4 4" />
        </svg>
        Cambiar el QR
      </button>
    </div>
  }
</app-content-dialog>
