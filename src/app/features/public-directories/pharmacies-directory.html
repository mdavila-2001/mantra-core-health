<!-- La anatomía es la de los otros tres directorios y la pone
     `app-directory-page` (A7 del plan de UX). -->
<app-directory-page
  [embebido]="embebido()"
  titulo="Directorio de farmacias"
  subtitulo="Farmacias de la red con ficha pública."
  etiquetaBusqueda="Buscar por nombre de la farmacia"
  [filtros]="filtros()"
  [estado]="estado()"
  [grupos]="tramos()"
  [sustantivo]="sustantivo"
  [aviso]="aviso()"
  [textoSinCoincidencias]="sinCoincidencias()"
  rotuloDeGrupos="Ciudad"
  [facetaDeGrupos]="false"
  (filtrosCambiaron)="filtrar($event)"
  (reintentar)="cargar()"
>
</app-directory-page>
