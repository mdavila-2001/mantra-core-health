<!-- La anatomía es la de los otros directorios y la pone
     `app-directory-page` (A7 del plan de UX). -->
<app-directory-page
  [embebido]="embebido()"
  titulo="Directorio de aseguradoras"
  subtitulo="Seguros de salud con ficha pública. Abra una para ver sus productos, lo que cubre cada plan y lo que no, y hablar con su broker."
  etiquetaBusqueda="Buscar por nombre de la aseguradora"
  [filtros]="filtros()"
  [estado]="estado()"
  [grupos]="tramos()"
  [sustantivo]="sustantivo"
  [aviso]="aviso()"
  [textoSinCoincidencias]="sinCoincidencias()"
  (filtrosCambiaron)="filtrar($event)"
  (reintentar)="cargar()"
>
  <div slot="antes-de-filtros">
    <!-- ─── El mapa de Bolivia como filtro ─────────────────────────────────────
       El departamento es lo primero que acota una búsqueda de lugares: a nadie
       le sirve una aseguradora sin oficina en tu departamento. Los chips de ciudad
       siguen estando —acotan más fino— y el mapa es el corte de arriba.

       Se dibuja el país entero, con los nueve departamentos, y no sólo los que
       tienen algo: ver el porqué en `departamentos` del listado compartido.
       Cada departamento dice cuántos tiene en la línea de abajo. -->
    @if (catalogoGeoCaido()) {
      <p class="mapa-directorio__caido" role="status">
        No pudimos leer el catálogo de departamentos, así que el mapa no está. El resto del
        directorio funciona igual.
        <button app-button variant="ghost" size="sm" type="button" (click)="reintentarGeo()">
          Reintentar
        </button>
      </p>
    } @else if (departamentos().length > 0) {
      <section class="mapa-directorio" aria-label="Filtrar por departamento">
        <app-department-map
          testId="aseguradoras-mapa"
          [municipio]="ciudad()"
          [departamentos]="departamentos()"
          [value]="departamentoElegido()"
          (valueChange)="elegirDepartamento($event)"
          etiqueta="Mapa de Bolivia: elija el departamento donde busca"
        />
        @if (resumenDelMapa(); as resumen) {
          <p class="mapa-directorio__resumen" data-testid="aseguradoras-mapa-resumen">
            {{ resumen }}
          </p>
        }
      </section>
    }
  </div>
</app-directory-page>
