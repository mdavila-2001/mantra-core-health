<app-page-header title="Agenda de quirófanos" subtitle="Bloques y casos del día, con la preparación y la limpieza reservadas." [breadcrumbs]="breadcrumbs()">
  <div page-actions class="or-schedule__actions">
    <a app-button size="sm" [routerLink]="scheduleRoute" [queryParams]="{ day: day() }" data-testid="or-schedule-schedule">Programar caso</a>
  </div>
</app-page-header>

<app-card class="or-schedule" padding="lg" data-testid="or-schedule">
  <app-site-switch class="or-schedule__site" />
  <div class="or-schedule__toolbar" role="group" aria-label="Día de la agenda">
    <button app-button variant="ghost" size="sm" (clicked)="move(-1)" aria-label="Día anterior">‹ Anterior</button>
    <app-input type="date" [value]="day()" ariaLabel="Día" testId="or-schedule-day" (valueChange)="setDay($any($event) ?? '')" />
    <button app-button variant="ghost" size="sm" (clicked)="move(1)" aria-label="Día siguiente">Siguiente ›</button>
    <button app-button variant="outline" size="sm" (clicked)="today()">Hoy</button>
  </div>

  <app-view-state-host [state]="state()" (retry)="reload()" (refresh)="reload()">
    @if (agenda(); as a) {
      <p class="or-schedule__as-of" data-testid="or-schedule-as-of">
        Datos de las {{ timeOf(a.asOf) }} ({{ ageOf(a.asOf) }}).
        <button app-button variant="ghost" size="sm" (clicked)="reload()">Actualizar</button>
      </p>
      <ul class="or-schedule__legend" aria-label="Referencias">
        <li><span class="or-schedule__swatch or-schedule__swatch--band"></span>Bloque asignado</li>
        <li><span class="or-schedule__swatch or-schedule__swatch--released"></span>Bloque liberado</li>
        <li><span class="or-schedule__swatch or-schedule__swatch--case"></span>Caso</li>
        <li><span class="or-schedule__swatch or-schedule__swatch--reserve"></span>Preparación y limpieza</li>
      </ul>
      <app-resource-timeline [rows]="rows()" [segments]="segments()" [day]="day()" label="Quirófanos del día" />
      @if (!hasCases()) {
        <app-alert tone="info" title="Día sin casos" data-testid="or-schedule-no-cases">
          No hay intervenciones programadas para este día.
          <a [routerLink]="scheduleRoute" [queryParams]="{ day: day() }">Programar un caso</a>
        </app-alert>
      }
    }
  </app-view-state-host>
</app-card>
