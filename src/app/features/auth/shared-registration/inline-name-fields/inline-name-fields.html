<div class="nombres" [formGroup]="grupo()">
  <app-form-field
    class="nombres__campo nombres__campo--mitad"
    label="Primer nombre"
    [required]="obligatorio()"
    [errorMessage]="errorOf('name')"
  >
    <app-input
      type="text"
      fieldKind="personName"
      formControlName="name"
      placeholder="Ana"
      autocomplete="given-name"
      [hasError]="errorOf('name') !== ''"
      [testId]="prefijoTestId() + '-nombre'"
    />
  </app-form-field>

  <app-form-field class="nombres__campo nombres__campo--mitad" label="Segundo nombre (opcional)"
    [errorMessage]="errorOfExtra(grupo().controls.middleName)">
    <app-input
      type="text"
      fieldKind="personName"
      formControlName="middleName"
      [hasError]="errorOfExtra(grupo().controls.middleName) !== ''"
      placeholder="Lucía"
      autocomplete="additional-name"
      [testId]="prefijoTestId() + '-segundo-nombre'"
    />
  </app-form-field>

  <app-form-field class="nombres__campo nombres__campo--mitad" label="Tercer nombre (opcional)"
    [errorMessage]="errorOfExtra(grupo().controls.thirdName)">
    <app-input
      type="text"
      fieldKind="personName"
      formControlName="thirdName"
      [hasError]="errorOfExtra(grupo().controls.thirdName) !== ''"
      placeholder="María"
      [testId]="prefijoTestId() + '-tercer-nombre'"
    />
  </app-form-field>

  @for (extra of extra(); track extra; let i = $index) {
    <app-form-field class="nombres__campo nombres__campo--mitad" [label]="'Nombre ' + (i + 4)"
      [errorMessage]="errorOfExtra(extra)">
      <div class="nombres__extra">
        <app-input
          type="text"
          fieldKind="personName"
          placeholder="Otro nombre"
          [formControl]="extra"
          [hasError]="extra.invalid && (extra.dirty || extra.touched)"
          [testId]="prefijoTestId() + '-nombre-extra-' + i"
        />
        <button
          app-button
          type="button"
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          [attr.aria-label]="'Quitar el nombre ' + (i + 4)"
          [appTooltip]="'Quitar el nombre ' + (i + 4)"
          [attr.data-testid]="prefijoTestId() + '-quitar-nombre-' + i"
          (clicked)="removeName(i)"
        >
          <app-nav-icon name="remove" />
        </button>
      </div>
    </app-form-field>
  }

  <div class="nombres__agregar">
    <button
      app-button
      type="button"
      variant="ghost"
      size="sm"
      [attr.data-testid]="prefijoTestId() + '-agregar-nombre'"
      (clicked)="addName()"
    >
      + Agregar otro nombre
    </button>
  </div>

  <app-form-field
    class="nombres__campo nombres__campo--mitad"
    label="Apellido paterno"
    [required]="obligatorio()"
    [errorMessage]="errorOf('lastName')"
  >
    <app-input
      type="text"
      fieldKind="personName"
      formControlName="lastName"
      placeholder="Rojas"
      autocomplete="family-name"
      [hasError]="errorOf('lastName') !== ''"
      [testId]="prefijoTestId() + '-apellido-paterno'"
    />
  </app-form-field>

  <app-form-field class="nombres__campo nombres__campo--mitad" label="Apellido materno (opcional)"
    [errorMessage]="errorOfExtra(grupo().controls.motherLastName)">
    <app-input
      type="text"
      fieldKind="personName"
      formControlName="motherLastName"
      [hasError]="errorOfExtra(grupo().controls.motherLastName) !== ''"
      placeholder="Paz"
      [testId]="prefijoTestId() + '-apellido-materno'"
    />
  </app-form-field>
</div>
