<app-auth-split
  scene="stage"
  claim="Tu salud, conectada"
  tagline="Entrá y encontrá tu historia clínica, tus turnos y tus estudios en un solo lugar."
>
  <!-- `appPointerScene` acá además del de la escena: la tarjeta necesita la
       posición del puntero medida contra SU rectángulo, no contra la pantalla,
       o el reflejo aparece corrido media ventana. Las variables se heredan, así
       que basta con volver a publicarlas en este nodo. -->
  <div class="login" appPointerScene>
    <!-- Sin sello de marca. La columna de al lado ya lleva el logo a tamaño de
         marca y la barra superior lleva la píldora: un tercer AloVida encima
         del título era la marca pidiendo turno en su propia pantalla, y lo que
         la persona vino a hacer acá es entrar. El título es el ancla. -->
    <div class="login__header">
      <h1 class="login__title">Iniciar sesión</h1>
      <p class="login__subtitle">Ingresá con tu correo o tu documento de identidad.</p>
    </div>

    @if (errorMessage(); as mensaje) {
      <app-alert appAnuncio tone="error" class="login__alert" data-testid="login-error">{{ mensaje }}</app-alert>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate data-testid="login-form">
      <app-form-field
        label="Correo o documento"
        [required]="true"
        [errorMessage]="
          form.controls.identifier.touched && form.controls.identifier.invalid
            ? 'Ingresá tu correo o tu documento.'
            : ''
        "
      >
        <!-- `username` sirve para correo y para documento: es el campo con el
             que se entra, sea cual sea su forma. -->
        <app-input
          formControlName="identifier"
          type="text"
          autocomplete="username"
          placeholder="correo@ejemplo.com o 1234567"
          testId="login-identifier"
        >
          <!-- El glifo va dentro del campo, no al lado del rótulo: así se lee
               como parte del control —se ilumina cuando el campo toma el foco—
               y no como un adorno pegado al texto. -->
          <app-nav-icon slot="icon-start" name="mail" />
        </app-input>
      </app-form-field>

      <app-form-field
        label="Contraseña"
        [required]="true"
        [errorMessage]="
          form.controls.password.touched && form.controls.password.invalid
            ? 'Ingresá tu contraseña.'
            : ''
        "
      >
        <app-input
          formControlName="password"
          type="password"
          autocomplete="current-password"
          placeholder="Tu contraseña"
          testId="login-password"
        >
          <!-- Candado y no llave: la llave es el acceso que se presta. -->
          <app-nav-icon slot="icon-start" name="lock" />
        </app-input>
      </app-form-field>

      <!-- El código de segundo factor se pide sólo cuando la API lo exige
           (`MFA_REQUIRED`): tres de cada tres personas no tienen uno, y un campo
           que no te toca es el que te hace dudar de los otros dos. -->
      @if (mfaRequired()) {
        <app-form-field
          label="Código de verificación"
          [required]="true"
          hint="Los seis dígitos que muestra tu aplicación de autenticación."
        >
          <app-input
            formControlName="mfaCode"
            type="text"
            autocomplete="one-time-code"
            placeholder="123456"
            testId="login-mfa-code"
          />
        </app-form-field>
      }

      <button
        app-button
        type="submit"
        variant="primary"
        size="lg"
        class="login__submit"
        data-testid="login-submit"
        [isLoading]="isSubmitting()"
      >
        Entrar
      </button>
    </form>

    <div class="login__footer">
      <p class="login__pie">
        <a app-link routerLink="/auth/forgot-password" data-testid="login-recuperar">¿Olvidaste tu contraseña?</a>
      </p>

      <!-- Los dos accesos de alta van con su glifo: son dos caminos distintos y
           el ícono es lo que los distingue de un vistazo, antes de leerlos. -->
      <a class="login__anexo" routerLink="/auth/register" data-testid="login-registro">
        <app-nav-icon name="patients" class="login__anexo-icono" />
        <span class="login__anexo-texto">
          <span class="login__anexo-titulo">Creá tu cuenta</span>
          <span class="login__anexo-detalle">Paciente o profesional</span>
        </span>
        <svg
          class="login__anexo-flecha"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>

      <a
        class="login__anexo"
        routerLink="/auth/register/organization"
        data-testid="login-registro-organizacion"
      >
        <app-nav-icon name="umbrella" class="login__anexo-icono" />
        <span class="login__anexo-texto">
          <span class="login__anexo-titulo">Registrá tu organización</span>
          <span class="login__anexo-detalle">Aseguradoras</span>
        </span>
        <svg
          class="login__anexo-flecha"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m9 5 7 7-7 7" />
        </svg>
      </a>
    </div>
  </div>
</app-auth-split>
