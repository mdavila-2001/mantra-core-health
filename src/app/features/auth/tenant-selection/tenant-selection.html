<main class="tenant">
  <div class="tenant__card">
    <h1 class="tenant__title">Elegí tu organización</h1>
    <p class="tenant__subtitle">
      Tu cuenta pertenece a más de una. La que elijas define qué información vas a ver.
    </p>

    <ul class="tenant__list">
      @for (tenantId of tenants(); track tenantId) {
        <li>
          <button app-button variant="secondary" size="lg" (clicked)="choose(tenantId)">
            {{ nombre(tenantId) }}
          </button>
        </li>
      } @empty {
        <!-- Sin sesión, o con un token que no declara organizaciones. Antes
             quedaba una lista vacía sin mensaje ni salida: quien llegara acá
             directamente no tenía forma de saber qué había pasado. -->
        <li appAnuncio [asertivo]="false" class="tenant__vacio">
          <p class="tenant__text">
            No encontramos organizaciones para tu cuenta. Puede que tu sesión haya vencido.
          </p>
          <p class="tenant__pie">
            <a app-link routerLink="/auth">Volver a iniciar sesión</a>
          </p>
        </li>
      }
    </ul>
  </div>
</main>
