<main class="tenant">
  <div class="tenant__card">
    <div class="tenant__header">
      <h1 class="tenant__title">Elija su organización</h1>
      <p class="tenant__subtitle">
        Su cuenta pertenece a más de una. La que elija define qué información va a ver.
      </p>
    </div>

    <ul class="tenant__list">
      @for (tenantId of tenants(); track tenantId) {
        <li>
          <button
            type="button"
            class="tenant__option"
            data-testid="tenant-opcion"
            [attr.data-tenant]="tenantId"
            (click)="choose(tenantId)"
          >
            {{ nombre(tenantId) }}
          </button>
        </li>
      } @empty {
        <!-- Sin sesión, o con un token que no declara organizaciones. Antes
             quedaba una lista vacía sin mensaje ni salida: quien llegara acá
             directamente no tenía forma de saber qué había pasado. -->
        <li appAnuncio [asertivo]="false" class="tenant__vacio" data-testid="tenant-vacio">
          <p class="tenant__text">
            No encontramos organizaciones para su cuenta. Puede que su sesión haya vencido.
          </p>
          <p class="tenant__pie">
            <a app-link routerLink="/auth">Volver a iniciar sesión</a>
          </p>
        </li>
      }
    </ul>
  </div>
</main>
