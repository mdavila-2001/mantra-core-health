<app-auth-layout
  title="Recuperá tu acceso"
  subtitle="Te enviamos un enlace para elegir una contraseña nueva."
>
  @if (sentMessage(); as mensaje) {
    <!-- Éxito: el formulario desaparece. Dejarlo en pantalla invita a reenviar, y son 5 por
         minuto. El mensaje es el de la API, sin agregados: es neutro a propósito. -->
    <app-alert tone="success" title="Solicitud enviada">
      {{ mensaje }}
    </app-alert>

    <p class="recuperar__volver">
      <a app-link [routerLink]="loginPath">Volver a ingresar</a>
    </p>
  } @else {
    <form class="recuperar__form" novalidate [formGroup]="form" (ngSubmit)="submit()">
      @if (failureMessages().length > 0) {
        <app-alert tone="error" title="No se pudo enviar la solicitud">
          <ul class="recuperar__issues">
            @for (message of failureMessages(); track message) {
              <li>{{ message }}</li>
            }
          </ul>
        </app-alert>
      }

      <app-form-field
        label="Correo o documento de identidad"
        hint="El mismo con el que entrás a la aplicación."
        [required]="true"
      >
        <!-- `type="text"` y no `email`: acá también entra un número de documento. -->
        <app-input formControlName="identifier" type="text" placeholder="nombre@organizacion.bo" />
      </app-form-field>

      <button
        app-button
        type="submit"
        variant="primary"
        size="lg"
        class="recuperar__submit"
        [isLoading]="isSubmitting()"
      >
        Enviarme el enlace
      </button>
    </form>
  }

  <nav auth-footer class="recuperar__footer" aria-label="Volver">
    @if (!sentMessage()) {
      <a app-link [routerLink]="loginPath">Volver a ingresar</a>
    }
  </nav>
</app-auth-layout>
