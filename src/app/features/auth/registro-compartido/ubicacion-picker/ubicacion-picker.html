@if (punto(); as coordenadas) {
  <div class="registro__ubicacion">
    <!-- El mapa reemplazó al par de coordenadas. Un «-17,7833, -63,1821» no le
         dice a nadie si el punto cayó en su casa; el pin sobre el plano se lee
         de un vistazo, que es justo lo que hay que confirmar. -->
    <app-map
      class="registro__mapa"
      [attr.data-testid]="ids().mapa"
      [pines]="pines()"
      [centro]="coordenadas"
      [zoom]="17"
      [etiqueta]="etiquetaMapa()"
    />

    @if (confirmada()) {
      <p appAnuncio class="registro__ubicacion-estado" [attr.data-testid]="ids().confirmada">
        Listo, guardamos esta dirección.
      </p>
      <!-- AC-03-9: el punto se guarda, pero el nombre de la calle no se
           resuelve. Se dice acá, al lado del mapa, y el alta sigue. Nunca se
           rellena la dirección con un texto inventado. -->
      <p class="registro__ubicacion-aviso" [attr.data-testid]="ids().avisoGeocodificacion">
        {{ avisoSinGeocodificacion }}
      </p>
      <div class="registro__ubicacion-acciones">
        <button
          app-button
          variant="ghost"
          size="sm"
          [isLoading]="pidiendo()"
          (clicked)="usarMiUbicacion()"
        >
          Volver a ubicarme
        </button>
        <button
          app-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          [attr.aria-label]="etiquetaQuitar()"
          [appTooltip]="etiquetaQuitar()"
          [attr.data-testid]="ids().quitar"
          (clicked)="quitarUbicacion()"
        >
          <app-nav-icon name="remove" />
        </button>
      </div>
    } @else {
      <p class="registro__ubicacion-estado">{{ pregunta() }}</p>
      <!-- El punto capturado y no confirmado NO viaja en el alta, y hasta que
           existió este aviso eso pasaba en silencio: se avanzaba de página
           creyendo que ya estaba guardado. No confirma nada ni frena el envío. -->
      <p class="registro__ubicacion-aviso" [attr.data-testid]="ids().sinConfirmar">
        {{ avisoUbicacionSinConfirmar }}
      </p>
      <div class="registro__ubicacion-acciones">
        <button
          app-button
          variant="primary"
          size="sm"
          [attr.data-testid]="ids().confirmar"
          (clicked)="confirmarDireccionActual()"
        >
          Confirmar dirección actual
        </button>
        <button
          app-button
          variant="ghost"
          size="sm"
          [isLoading]="pidiendo()"
          (clicked)="usarMiUbicacion()"
        >
          Volver a ubicarme
        </button>
      </div>
    }
  </div>
} @else {
  <p class="registro__ubicacion">
    <button
      app-button
      variant="secondary"
      size="sm"
      [attr.data-testid]="ids().usarUbicacion"
      [isLoading]="pidiendo()"
      (clicked)="usarMiUbicacion()"
    >
      {{ etiquetaPedir() }}
    </button>
    @if (rechazado()) {
      <span class="registro__ubicacion-aviso">
        No pudimos obtener tu ubicación. Podés seguir sin esto.
      </span>
    }
  </p>
}
