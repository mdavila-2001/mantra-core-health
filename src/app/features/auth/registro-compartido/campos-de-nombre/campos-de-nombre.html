<div class="nombres">
  <app-paginated-form
    [form]="grupo()"
    [paginas]="namePages()"
    label="Nombre de la persona"
    [embedded]="true"
  >
    <ng-template appCampoPersonalizado="name">
<app-form-field
    class="nombres__campo nombres__campo--tercio"
    label="Primer nombre"
    [required]="obligatorio()"
    [errorMessage]="errorDe('name')"
  >
    <app-input
      type="text"
      [formControl]="grupo().controls.name"
      autocomplete="given-name"
      [hasError]="errorDe('name') !== ''"
      [testId]="prefijoTestId() + '-nombre'"
    />
  </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="middleName">
<app-form-field class="nombres__campo nombres__campo--tercio" label="Segundo nombre (opcional)">
    <app-input
      type="text"
      [formControl]="grupo().controls.middleName"
      autocomplete="additional-name"
      [testId]="prefijoTestId() + '-segundo-nombre'"
    />
  </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="thirdName">
<app-form-field class="nombres__campo nombres__campo--tercio" label="Tercer nombre (opcional)">
    <app-input
      type="text"
      [formControl]="grupo().controls.thirdName"
      [testId]="prefijoTestId() + '-tercer-nombre'"
    />
  </app-form-field>
    </ng-template>
    @for (extra of extras(); track extra; let i = $index) {
      <ng-template [appCampoPersonalizado]="'extraNames.' + i">
<app-form-field class="nombres__campo nombres__campo--tercio" [label]="'Nombre ' + (i + 4)">
      <div class="nombres__extra">
        <app-input
          type="text"
          placeholder="Otro nombre"
          [formControl]="extra"
          [testId]="prefijoTestId() + '-nombre-extra-' + i"
        />
        <button
          app-button
          type="button"
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          [attr.aria-label]="'Quitar el nombre ' + (i + 4)"
          [appTooltip]="'Quitar el nombre ' + (i + 4)"
          [attr.data-testid]="prefijoTestId() + '-quitar-nombre-' + i"
          (clicked)="quitarNombre(i)"
        >
          <app-nav-icon name="remove" />
        </button>
      </div>
    </app-form-field>
      </ng-template>
    }
    <ng-template appCampoPersonalizado="lastName">
<app-form-field
    class="nombres__campo nombres__campo--mitad"
    label="Apellido paterno"
    [required]="obligatorio()"
    [errorMessage]="errorDe('lastName')"
  >
    <app-input
      type="text"
      [formControl]="grupo().controls.lastName"
      autocomplete="family-name"
      [hasError]="errorDe('lastName') !== ''"
      [testId]="prefijoTestId() + '-apellido-paterno'"
    />
  </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="motherLastName">
<app-form-field class="nombres__campo nombres__campo--mitad" label="Apellido materno (opcional)">
    <app-input
      type="text"
      [formControl]="grupo().controls.motherLastName"
      [testId]="prefijoTestId() + '-apellido-materno'"
    />
  </app-form-field>
    </ng-template>
  </app-paginated-form>
  <div class="nombres__agregar">
    <button
      app-button
      type="button"
      variant="ghost"
      size="sm"
      [attr.data-testid]="prefijoTestId() + '-agregar-nombre'"
      (clicked)="agregarNombre()"
    >
      + Agregar otro nombre
    </button>
  </div>

</div>
