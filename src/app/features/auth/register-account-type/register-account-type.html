<app-auth-split
  scene="stage"
  [claim]="catalogo.claim"
  [tagline]="catalogo.tagline"
  contentWidth="wide"
  [plainSurface]="true"
>
  <div class="tipos">
    <div class="tipos__header">
      <h1 class="tipos__title">{{ catalogo.titulo }}</h1>
      <p class="tipos__subtitle">{{ catalogo.subtitulo }}</p>
    </div>

    <!-- Una lista, y no un montón de enlaces sueltos: son opciones de lo
         mismo, y el lector de pantalla anuncia «lista de N elementos» antes de
         leerlas — que es justo el dato que hace falta para decidir. -->
    <ul class="tipos__grid">
      @for (tipo of catalogo.tipos; track tipo.ruta) {
        <li class="tipos__item">
          <a class="tipos__card" [routerLink]="tipo.ruta" [attr.data-testid]="tipo.testId">
            <span class="tipos__icon" aria-hidden="true">
              <app-account-icon [name]="tipo.icono" />
            </span>
            <span class="tipos__card-title">{{ tipo.titulo }}</span>
            <span class="tipos__card-detail">{{ tipo.detalle }}</span>
          </a>
        </li>
      }
    </ul>

    <p class="tipos__footer">
      ¿Ya tiene cuenta?
      <a app-link routerLink="/auth" data-testid="tipos-ir-login">Inicie sesión</a>
    </p>
  </div>
</app-auth-split>
