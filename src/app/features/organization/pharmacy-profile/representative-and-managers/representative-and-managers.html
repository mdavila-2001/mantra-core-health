<app-view-state-host [state]="state()" (retry)="retry.emit()">
  <div vsh-skeleton><app-skeleton variant="text" [lines]="6" /></div>

  @if (gente(); as datos) {
    <section class="gente" aria-labelledby="ficha-gente-titulo">
      <div class="gente__encabezado">
        <h2 id="ficha-gente-titulo" class="gente__titulo">Quién responde por la empresa</h2>
        <!-- Sobre la maqueta nada de esto sale de la API: se dice, no se disimula. -->
        @if (!readOnly()) {
          <app-chip variant="neutral" size="sm">{{ notaDeEjemplo }}</app-chip>
        }
      </div>

      <div class="gente__bloques">
        <app-contact-sheet
          data-testid="ficha-representante"
          [contacto]="datos.representante"
        >
          <!-- El poder no se copia acá: se va a buscar donde está. De lectura
               la carpeta son las licencias, y el poder no está entre ellas. -->
          @if (!readOnly()) {
            <button
              app-button
              variant="ghost"
              size="sm"
              type="button"
              data-testid="ficha-ver-poder"
              (clicked)="poderPedido.emit()"
            >
              Ver el poder en Documentos
            </button>
          }
        </app-contact-sheet>

        <!-- Por correo y no por cargo: el cargo es texto del dato y nada lo
             hace único. Dos «Gerente Comercial» —un interinato, dos sucursales—
             y la clave repetida deja la lista entera sin dibujar. -->
        @for (gerente of datos.gerentes; track gerente.correo ?? gerente.cargo) {
          <app-contact-sheet [contacto]="gerente" />
        }
      </div>
    </section>
  }
</app-view-state-host>
