<app-page-header
  title="Configurar centro médico"
  subtitle="Abra la práctica de su organización con su primera sede. Después podrá publicar sus procedimientos y afiliar a sus médicos."
/>

<app-card class="setup" padding="lg" data-testid="centro-medico-setup-card">
  @if (created(); as done) {
    <div class="setup__done" data-testid="centro-medico-setup-exito">
      <h2 class="setup__done-title">Su centro médico quedó configurado</h2>
      <p class="setup__done-text">
        La sede «{{ form.controls.siteName.value.trim() }}» ya tiene su dirección y su punto en el mapa.
      </p>
      <dl class="setup__ids">
        <div>
          <dt>Práctica</dt>
          <dd data-testid="centro-medico-setup-practice-id">{{ done.practiceId }}</dd>
        </div>
        <div>
          <dt>Sede</dt>
          <dd data-testid="centro-medico-setup-site-id">{{ done.practiceSiteId }}</dd>
        </div>
      </dl>
    </div>
  } @else {
    @if (errorMessage(); as message) {
      <app-alert tone="error" data-testid="centro-medico-setup-error">{{ message }}</app-alert>
    }

    <app-paginated-form
      [paginas]="pages"
      [form]="form"
      label="Configurar centro médico"
      submitLabel="Guardar centro médico"
      [pending]="saving()"
      (enviado)="save()"
      data-testid="centro-medico-setup-form"
    >
      <ng-template appCampoPersonalizado="point">
        <app-ubicacion-picker
          pinId="centro-medico-sede"
          etiquetaConfirmada="Sede del centro médico"
          etiquetaQuitar="Quitar la ubicación de la sede"
          etiquetaMapa="La sede en el mapa"
          indicacionMarcar="Toque el mapa en el lugar exacto de la sede."
          [ids]="pointIds"
          [inicial]="form.controls.point.value"
          (confirmado)="setPoint($event)"
        />
      </ng-template>
    </app-paginated-form>
  }
</app-card>
