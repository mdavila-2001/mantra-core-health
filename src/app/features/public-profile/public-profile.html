<!-- La ficha pública. Las clases son las de `alovida.css` §25 y las de la
     maqueta V65-07: el marcado se reusa, los datos son los de la API. Lo que la
     maqueta dibuja y la API todavía no sirve no se pinta con valores de
     relleno — ver la nota de la clase. -->

@if (perfil(); as p) {
  <div class="app-page-header" app-page-header>
    <span class="app-page-header__icono" aria-hidden="true">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </span>
    <div class="app-page-header__texto">
      <p style="margin-bottom: var(--e2)">
        <a app-link routerLink="/search">
          <svg class="icono icono--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"></path></svg>
          Volver a los resultados
        </a>
      </p>
      <p class="overline">{{ rotuloTipo() }}</p>
    </div>
  </div>

  <!-- El cuerpo de la ficha lo dibuja `app-public-profile-card`, que es el
       MISMO componente que usa la vista previa de «Tu perfil público» (B1 del
       plan de UX del 22/08/2026). Que las dos pantallas se vean igual dejó de
       ser una promesa y pasó a ser algo que no se puede romper. -->
  <app-public-profile-card [perfil]="p" (escribir)="escribirle(p.slug)" />

  <!-- Las opiniones van en su propio componente y en su propia llamada: se
       paginan, y la tarjeta de arriba la comparte la vista previa de «Tu
       perfil público», que no tiene por qué hacer ese viaje. -->
  <section class="app-card">
    <app-public-profile-reviews
      [kind]="p.kind"
      [slug]="p.slug"
      [professionalName]="p.displayName"
    />
  </section>
} @else {
  <!-- Un slug inexistente y uno despublicado caen los dos acá, con el mismo
       texto. Distinguirlos —«este perfil es privado»— confirmaría que existe, y
       es justo lo que el 404 idéntico del servidor evita. -->
  <div class="app-page-header" app-page-header>
    <div class="app-page-header__texto">
      <div class="app-page-header__titulo"><h1>Ese perfil no está disponible</h1></div>
      <p class="caption">
        El enlace puede estar mal escrito, o quien lo publicó puede haberlo quitado del
        directorio.
      </p>
    </div>
  </div>
  <section class="app-card">
    <p>
      <a app-link routerLink="/search">Volver al buscador</a>
    </p>
  </section>
}
