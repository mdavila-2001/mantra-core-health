<app-content-dialog
  heading="No aprobar este ítem"
  [description]="itemName()"
  (closed)="closed.emit()"
>
  <form class="deny-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field
      label="Cláusula del contrato"
      [required]="true"
      hint="La que excluye este ítem. El paciente la va a ver como motivo."
      [errorMessage]="
        form.controls.policyClauseReference.touched && form.controls.policyClauseReference.invalid
          ? 'Indicá la cláusula del contrato (hasta ' + clauseMax + ' caracteres).'
          : ''
      "
    >
      <app-input
        formControlName="policyClauseReference"
        placeholder="Ej.: Cláusula 12.3 — medicamento fuera del vademécum"
        testId="deny-clause"
        [hasError]="
          form.controls.policyClauseReference.touched && form.controls.policyClauseReference.invalid
        "
      />
    </app-form-field>

    <app-form-field
      label="Justificación (opcional)"
      hint="Por ejemplo, la exclusión o enfermedad preexistente de la póliza."
      [errorMessage]="
        form.controls.denialRationale.invalid ? 'Hasta ' + rationaleMax + ' caracteres.' : ''
      "
    >
      <app-textarea
        formControlName="denialRationale"
        data-testid="deny-rationale"
        [rows]="3"
        [maxLength]="rationaleMax"
      />
    </app-form-field>
  </form>

  <button dialog-actions app-button type="button" variant="ghost" (clicked)="dialog().close()">
    Cancelar
  </button>
  <button
    dialog-actions
    app-button
    type="button"
    variant="danger"
    data-testid="deny-confirm"
    (clicked)="submit()"
  >
    No aprobar
  </button>
</app-content-dialog>
