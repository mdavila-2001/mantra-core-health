<app-content-dialog
  heading="Nuevo plan"
  [description]="'Producto: ' + productName()"
  [dismissible]="!saving()"
  (closed)="closed.emit()"
>
  @if (errorMessage(); as message) {
    <app-alert appAnuncio tone="error">{{ message }}</app-alert>
  }
  <form class="insurance-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field
      label="Código del plan"
      [required]="true"
      [errorMessage]="
        form.controls.planCode.touched && form.controls.planCode.invalid
          ? 'Escribí un código de hasta 60 caracteres.'
          : ''
      "
    >
      <app-input formControlName="planCode" autocomplete="off" testId="plan-code" />
    </app-form-field>
    <app-form-field
      label="Nombre"
      [required]="true"
      [errorMessage]="
        form.controls.name.touched && form.controls.name.invalid
          ? 'Escribí un nombre de hasta 200 caracteres.'
          : ''
      "
    >
      <app-input formControlName="name" autocomplete="off" testId="plan-name" />
    </app-form-field>
    <div class="insurance-form__columns">
      <app-form-field label="Vigente desde">
        <app-input formControlName="effectiveFrom" type="date" testId="plan-effective-from" />
      </app-form-field>
      <app-form-field
        label="Vigente hasta"
        [errorMessage]="
          form.hasError('dateRange') && form.controls.effectiveTo.touched
            ? 'La fecha final no puede ser anterior a la inicial.'
            : ''
        "
      >
        <app-input formControlName="effectiveTo" type="date" testId="plan-effective-to" />
      </app-form-field>
    </div>
    <app-form-field label="Moneda" hint="Moneda de copagos, deducibles y topes del plan.">
      <app-concept-select
        target="insurance.insurance_plans.currency_concept_id"
        [(value)]="currencyConceptId"
        placeholder="Seleccioná una moneda"
      />
    </app-form-field>
  </form>

  <button
    dialog-actions
    app-button
    type="button"
    variant="ghost"
    [disabled]="saving()"
    (clicked)="dialog().close()"
  >
    Cancelar
  </button>
  <button
    dialog-actions
    app-button
    type="button"
    [isLoading]="saving()"
    [disabled]="saving()"
    (clicked)="submit()"
  >
    Crear plan
  </button>
</app-content-dialog>
