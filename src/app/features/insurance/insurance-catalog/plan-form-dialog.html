<app-content-dialog
  [heading]="mode() === 'create' ? 'Añadir producto seguro' : 'Editar datos del producto seguro'"
  [description]="'Ramo: ' + productName()"
  [dismissible]="!saving()"
  (closed)="closed.emit()"
>
  @if (errorMessage(); as message) {
    <app-alert appAnuncio tone="error">{{ message }}</app-alert>
  }
  <app-paginated-form
    [form]="form"
    [paginas]="planPages()"
    label="Producto seguro"
    [submitLabel]="mode() === 'create' ? 'Añadir producto seguro' : 'Guardar cambios'"
    cancelLabel="Cancelar"
    [pending]="saving()"
    (cancelado)="dialog().close()"
    (enviado)="submit()"
  >
    <ng-template appCampoPersonalizado="planCode">
<app-form-field
      label="Código del producto seguro"
      [required]="true"
      [errorMessage]="
        form.controls.planCode.touched && form.controls.planCode.invalid
          ? 'Escribí un código de hasta 60 caracteres.'
          : ''
      "
    >
      <app-input [formControl]="form.controls.planCode" autocomplete="off" testId="plan-code" />
    </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="name">
<app-form-field
      label="Nombre"
      [required]="true"
      [errorMessage]="
        form.controls.name.touched && form.controls.name.invalid
          ? 'Escribí un nombre de hasta 200 caracteres.'
          : ''
      "
    >
      <app-input [formControl]="form.controls.name" autocomplete="off" testId="plan-name" />
    </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="effectiveFrom">
<app-form-field label="Vigente desde">
        <app-input [formControl]="form.controls.effectiveFrom" type="date" testId="plan-effective-from" />
      </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="effectiveTo">
<app-form-field
        label="Vigente hasta"
        [errorMessage]="
          form.hasError('dateRange') && form.controls.effectiveTo.touched
            ? 'La fecha final no puede ser anterior a la inicial.'
            : ''
        "
      >
        <app-input [formControl]="form.controls.effectiveTo" type="date" testId="plan-effective-to" />
      </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="currencyConceptId">
<app-form-field label="Moneda" hint="Moneda de copagos, deducibles y topes del plan.">
        <app-concept-select
          target="insurance.insurance_plans.currency_concept_id"
          [(value)]="currencyConceptId"
          placeholder="Seleccioná una moneda"
        />
      </app-form-field>
    </ng-template>
    <ng-template appCampoPersonalizado="monthlyPremiumAmount">
<app-form-field
        label="Prima mensual"
        hint="Prima de lista mensual, en la moneda del plan. Es el denominador del loss ratio del tablero de siniestralidad."
        [errorMessage]="
          form.controls.monthlyPremiumAmount.touched && form.controls.monthlyPremiumAmount.invalid
            ? 'Ingresá un importe no negativo con hasta dos decimales.'
            : ''
        "
      >
        <app-input
          [formControl]="form.controls.monthlyPremiumAmount"
          inputMode="decimal"
          testId="plan-monthly-premium"
        />
      </app-form-field>
    </ng-template>
  </app-paginated-form>
</app-content-dialog>
