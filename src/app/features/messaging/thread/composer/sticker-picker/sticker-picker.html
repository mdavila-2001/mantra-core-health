<div class="stickers">
  <div class="stickers__rejilla" role="list">
    @for (sticker of stickers; track sticker.id) {
      <button
        class="stickers__sticker"
        type="button"
        role="listitem"
        data-testid="composer-sticker"
        [attr.aria-label]="'Enviar sticker: ' + sticker.nombre"
        (click)="elegido.emit(sticker)"
      >
        <!-- `loading="lazy"`: son veinticuatro imágenes y el panel se abre
             adentro de una conversación que ya está pintada. -->
        <img [src]="sticker.url" [alt]="sticker.nombre" width="72" height="72" loading="lazy" />
      </button>
    }
  </div>

  <p class="stickers__creditos">
    Ilustraciones de
    <a href="https://openmoji.org" target="_blank" rel="noopener noreferrer">OpenMoji</a>,
    CC BY-SA 4.0
  </p>
</div>
