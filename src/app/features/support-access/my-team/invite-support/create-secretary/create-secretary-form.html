<form class="crear-secretaria" (submit)="$event.preventDefault(); submit()" novalidate>
  <div class="crear-secretaria__grid">
    <app-form-field label="Documento de identidad (CI)" [required]="true">
      <app-input
        [value]="nationalId()"
        (valueChange)="nationalId.set($event)"
        [disabled]="submitting()"
        placeholder="Ej. 1234567"
      />
    </app-form-field>

    <app-form-field label="Nombre" [required]="true">
      <app-input
        [value]="name()"
        (valueChange)="name.set($event)"
        [disabled]="submitting()"
        placeholder="Nombre de la secretaria"
      />
    </app-form-field>

    <app-form-field label="Apellidos" [required]="true">
      <app-input
        [value]="lastName()"
        (valueChange)="lastName.set($event)"
        [disabled]="submitting()"
        placeholder="Apellidos"
      />
    </app-form-field>

    <app-form-field label="Correo electrónico" [required]="true">
      <app-input
        type="email"
        [value]="email()"
        (valueChange)="email.set($event)"
        [disabled]="submitting()"
        placeholder="secretaria@ejemplo.com"
      />
    </app-form-field>

    <app-form-field label="Teléfono / Celular" [required]="true">
      <app-input
        type="tel"
        [value]="phone()"
        (valueChange)="phone.set($event)"
        [disabled]="submitting()"
        placeholder="+591 70000000"
      />
    </app-form-field>

    <app-form-field label="Fecha de nacimiento" [required]="true" hint="Formato AAAA-MM-DD">
      <app-input
        type="date"
        [value]="birthDate()"
        (valueChange)="birthDate.set($event)"
        [disabled]="submitting()"
      />
    </app-form-field>
  </div>

  @if (errorMessage(); as error) {
    <app-alert tone="error" [title]="error" class="crear-secretaria__error" />
  }

  <div class="crear-secretaria__acciones">
    <button
      app-button
      type="submit"
      variant="primary"
      [disabled]="!isValid() || submitting()"
    >
      {{ submitting() ? 'Creando y vinculando...' : 'Crear y vincular secretaria' }}
    </button>
    <button
      app-button
      type="button"
      variant="ghost"
      (clicked)="cancel()"
      [disabled]="submitting()"
    >
      Cancelar
    </button>
  </div>
</form>
