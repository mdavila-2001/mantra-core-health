<div class="carrusel" [class.carrusel--inicio]="alInicio()" [class.carrusel--final]="alFinal()">
  <div class="carrusel__barra">
    <h3 class="carrusel__titulo" id="sintomas-recomendaciones-titulo">Conviene que vea a</h3>
    @if (recomendaciones().length > 1) {
      <div class="carrusel__controles">
        <span class="carrusel__contador" aria-live="polite" data-testid="sintomas-carrusel-contador">
          {{ visible() }} de {{ recomendaciones().length }}
        </span>
        <button
          type="button"
          class="carrusel__flecha"
          aria-label="Ver la especialidad anterior"
          data-testid="sintomas-carrusel-anterior"
          [disabled]="alInicio()"
          (click)="mover(-1)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <button
          type="button"
          class="carrusel__flecha"
          aria-label="Ver la especialidad siguiente"
          data-testid="sintomas-carrusel-siguiente"
          [disabled]="alFinal()"
          (click)="mover(1)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
    }
  </div>

  <ul
    #pista
    class="rejilla carrusel__pista"
    data-testid="sintomas-recomendaciones"
    aria-labelledby="sintomas-recomendaciones-titulo"
    (scroll)="medir()"
  >
    @for (recomendacion of recomendaciones(); track recomendacion.nombre; let primera = $first) {
      <li class="carrusel__item">
        <button
          type="button"
          class="rejilla__tarjeta carrusel__tarjeta"
          [class.carrusel__tarjeta--primera]="primera"
          [attr.data-testid]="'sintomas-especialidad-' + $index"
          [attr.aria-label]="'Ver quién atiende ' + recomendacion.nombre + '. ' + explicacionDe(recomendacion)"
          (click)="elegir.emit(recomendacion.nombre)"
        >
          <img class="rejilla__foto" [src]="fotoDe(recomendacion.nombre)" alt="" loading="lazy" />
          <span class="carrusel__cabeza">
            <app-specialty-icon class="rejilla__icono" aria-hidden="true" [especialidad]="recomendacion.nombre" />
            @if (primera && recomendaciones().length > 1) {
              <app-badge variant="primary">Empiece por acá</app-badge>
            }
          </span>
          <span class="rejilla__nombre">{{ recomendacion.nombre }}</span>
          <span class="rejilla__resumen">{{ explicacionDe(recomendacion) }}</span>
          <span class="carrusel__accion" aria-hidden="true">Ver quién atiende →</span>
        </button>
      </li>
    }
  </ul>
</div>
