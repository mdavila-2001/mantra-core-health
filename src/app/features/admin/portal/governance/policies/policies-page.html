<app-page-header
  title="Políticas de gobierno"
  subtitle="Escritura, retención, anonimización y residencia de los datos, en una sola lista. Cada código abre su ficha con lo que controla, a qué se aplica y cómo cambió."
  [breadcrumbs]="breadcrumbs()"
/>

<div class="policies">
  <app-card class="policies__card" variant="outlined" padding="md" data-testid="portal-policies">
    <div class="policies__section">
      <app-governance-filter-form
        [fields]="fields"
        [values]="values()"
        (applied)="apply($event)"
        (cleared)="clear()"
      />
      <app-data-table
        data-testid="portal-policies-table"
        caption="Políticas de gobierno de datos"
        [state]="list.state()"
        [columns]="columns()"
        [trackBy]="byId"
        [rowLabel]="rowName"
        [cursor]="list.cursor()"
        stackedOnMobile
        fitContainer
        (cursorChanged)="list.move($event)"
        (retry)="list.reload()"
      />
    </div>
  </app-card>
</div>

<ng-template #codeCell let-row>
  <div class="policies__cell">
    <a
      app-link
      class="policies__code"
      [routerLink]="detailUrl(row)"
      [queryParams]="detailQuery(row)"
      data-testid="portal-policy-link"
      >{{ row.code }}</a
    >
    @if (row.name) {
      <span class="policies__name">{{ row.name }}</span>
    }
    <span class="policies__badges">
      <app-badge size="sm" [variant]="type(row.policyType).tone">{{
        type(row.policyType).label
      }}</app-badge>
    </span>
  </div>
</ng-template>

<ng-template #stateCell let-row>
  <div class="policies__cell">
    <app-badge size="sm" [variant]="state(row.state).tone">{{ state(row.state).label }}</app-badge>
    <span class="policies__secondary">
      Versión {{ row.version }} ·
      {{ row.updatedAt ? 'Cambió ' + when(row.updatedAt) : 'Sin fecha de cambio' }}
    </span>
  </div>
</ng-template>
