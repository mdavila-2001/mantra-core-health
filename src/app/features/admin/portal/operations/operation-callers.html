<section class="callers" aria-label="Quién la llama desde el frontend" data-testid="portal-operation-callers">
  <h3 class="callers__title">Quién la llama desde el frontend</h3>
  <app-view-state-host [state]="callers()" (retry)="load()">
    @if (callers(); as state) {
      @if (state.status === 'ready') {
        <ul class="callers__list" data-testid="portal-operation-callers-list">
          @for (client of state.data; track client) {
            <li><app-badge variant="secondary">{{ client }}</app-badge></li>
          }
        </ul>
      }
    }
  </app-view-state-host>
</section>
