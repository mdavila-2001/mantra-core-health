<app-page-header
  title="Nueva sub-organización"
  subtitle="Una unidad con identidad propia dentro de esta organización. Puede ser de otro tipo que su madre."
  [breadcrumbs]="breadcrumbs()"
>
  <app-back-link page-actions [fallback]="rutaVolver()" label="Volver a la organización" />
</app-page-header>

@if (errorMessage(); as mensaje) {
  <app-alert appAnuncio tone="error" class="alta__alert" data-testid="alta-filial-error">{{
    mensaje
  }}</app-alert>
}

<app-paginated-form
  [paginas]="paginas()"
  [form]="form"
  label="Nueva sub-organización"
  submitLabel="Crear sub-organización"
  cancelLabel="Cancelar"
  [pending]="enviando()"
  (enviado)="submit()"
  (cancelado)="cancelar()"
  data-testid="alta-filial-form"
>
  <ng-template appCampoPersonalizado="pais">
    <app-reference-combobox
      [selected]="pais()"
      [options]="candidatosPais()"
      [loading]="buscandoPais()"
      placeholder="Nombre del país"
      emptyMessage="Ningún concepto coincide"
      (searched)="buscarPais($event)"
      (selectionChange)="form.controls.pais.setValue($event)"
    />
  </ng-template>

  <ng-template appCampoPersonalizado="jurisdiccion">
    <app-reference-combobox
      [selected]="jurisdiccion()"
      [options]="candidatosJurisdiccion()"
      [loading]="buscandoJurisdiccion()"
      placeholder="Nombre de la jurisdicción"
      emptyMessage="Ningún concepto coincide"
      (searched)="buscarJurisdiccion($event)"
      (selectionChange)="form.controls.jurisdiccion.setValue($event)"
    />
  </ng-template>

  <ng-template appCampoPersonalizado="administrador">
    <app-reference-combobox
      [selected]="administrador()"
      [options]="administradores.candidatos()"
      [loading]="administradores.buscando()"
      placeholder="Nombre o correo"
      emptyMessage="Ninguna cuenta coincide"
      (searched)="administradores.buscar($event)"
      (selectionChange)="form.controls.administrador.setValue($event)"
    />
    <!-- Un fallo de la búsqueda no es «ninguna cuenta coincide»: se dice. -->
    @if (administradores.error(); as fallo) {
      <app-alert tone="error" class="busqueda-fallida" data-testid="alta-suborganizacion-admin-error">{{ fallo }}</app-alert>
    }
  </ng-template>
</app-paginated-form>
