<app-page-header
  title="Nueva sucursal"
  subtitle="Sin al menos una sede la organización no tiene dónde agendar ni a qué sucursal asignar a su gente."
  [breadcrumbs]="breadcrumbs()"
/>

@if (errorMessage(); as mensaje) {
  <app-alert appAnuncio tone="error" class="alta__alert" data-testid="alta-sucursal-error">{{
    mensaje
  }}</app-alert>
}

<app-paginated-form
  [paginas]="paginas()"
  [form]="form"
  label="Nueva sucursal"
  submitLabel="Abrir sede"
  cancelLabel="Cancelar"
  [pending]="enviando()"
  (enviado)="submit()"
  (cancelado)="cancelar()"
  data-testid="alta-sucursal-form"
/>
