<app-page-header
  title="Nueva organización"
  subtitle="Se crea la organización con su tipo y su owner en una sola operación."
  [breadcrumbs]="breadcrumbs()"
/>

@if (errorMessage(); as mensaje) {
  <app-alert appAnuncio tone="error" class="alta__alert" data-testid="alta-organizacion-error">{{
    mensaje
  }}</app-alert>
}

<app-paginated-form
  [paginas]="paginas()"
  [form]="form"
  label="Nueva organización"
  submitLabel="Registrar organización"
  cancelLabel="Cancelar"
  [pending]="enviando()"
  (enviado)="submit()"
  (cancelado)="cancelar()"
  data-testid="alta-organizacion-form"
>
  <ng-template appCampoPersonalizado="pais">
    <app-reference-combobox
      [selected]="pais()"
      [options]="candidatosPais()"
      [loading]="buscandoPais()"
      placeholder="Nombre del país"
      emptyMessage="Ningún concepto coincide"
      (searched)="buscarPais($event)"
      (selectionChange)="pais.set($event)"
    />
  </ng-template>

  <ng-template appCampoPersonalizado="jurisdiccion">
    <app-reference-combobox
      [selected]="jurisdiccion()"
      [options]="candidatosJurisdiccion()"
      [loading]="buscandoJurisdiccion()"
      placeholder="Nombre de la jurisdicción"
      emptyMessage="Ningún concepto coincide"
      (searched)="buscarJurisdiccion($event)"
      (selectionChange)="jurisdiccion.set($event)"
    />
  </ng-template>

  <ng-template appCampoPersonalizado="owner">
    <app-reference-combobox
      [selected]="owner()"
      [options]="candidatosOwner()"
      [loading]="buscandoOwner()"
      placeholder="Nombre o correo"
      emptyMessage="Ningún usuario coincide"
      (searched)="buscarOwner($event)"
      (selectionChange)="owner.set($event)"
    />
  </ng-template>
</app-paginated-form>
