@if (!esPropio()) {
  <button
    type="button"
    class="seguir"
    [class.seguir--ficha]="variante() === 'ficha'"
    [class.seguir--pastilla]="variante() === 'pastilla'"
    [class.seguir--siguiendo]="sigue()"
    data-testid="follow-button"
    [attr.aria-pressed]="sigue()"
    [attr.aria-label]="nombreAccesible()"
    [attr.aria-disabled]="!listo() || ocupado() || pendiente() ? 'true' : null"
    [attr.aria-busy]="pendiente() || ocupado() ? 'true' : null"
    (click)="alternar()"
  >
    @if (sigue()) {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      <span class="seguir__texto">Siguiendo</span>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
      <span class="seguir__texto">Seguir</span>
    }
  </button>
}
