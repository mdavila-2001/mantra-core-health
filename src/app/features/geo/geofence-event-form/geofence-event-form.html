<app-page-header
  title="Registrar cruce de geocerca"
  subtitle="Anota que un sujeto entró o salió de un área. Dos cruces iguales seguidos se rechazan."
  [breadcrumbs]="breadcrumbs()"
/>

@if (created(); as evento) {
  <div class="m13__seccion">
    <h2 appAnuncio [asertivo]="false" class="m13__titulo">El cruce quedó registrado</h2>

    <dl class="m13__datos">
      <div>
        <dt>Evento</dt>
        <dd><code>{{ evento.id }}</code></dd>
      </div>
      <div>
        <dt>Geocerca</dt>
        <dd><code>{{ evento.geofenceId }}</code></dd>
      </div>
      <div>
        <dt>Sujeto</dt>
        <dd><code>{{ evento.trackedSubjectId }}</code></dd>
      </div>
    </dl>

    <button app-button variant="primary" (clicked)="otroCruce()">Registrar otro</button>
  </div>
} @else {
  @if (errorMessage(); as mensaje) {
    <app-alert appAnuncio tone="error" class="m13__alert">{{ mensaje }}</app-alert>
  }

  <app-paginated-form
  [paginas]="paginas"
  [form]="form"
  label="Registrar cruce de geocerca"
  submitLabel="Registrar cruce"
  [pending]="isSubmitting()"
  (enviado)="submit()"
/>
}
