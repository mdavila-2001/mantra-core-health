<app-page-header
  title="Nueva geocerca"
  subtitle="Define un área con nombre propio: un círculo con radio y centro, o un polígono con su geometría."
  [breadcrumbs]="breadcrumbs()"
/>

@if (created(); as geocerca) {
  <div class="m13__seccion">
    <h2 appAnuncio [asertivo]="false" class="m13__titulo">La geocerca quedó creada</h2>

    <dl class="m13__datos">
      <div>
        <dt>Geocerca</dt>
        <dd><code>{{ geocerca.id }}</code></dd>
      </div>
      <div>
        <dt>Nombre</dt>
        <dd>{{ geocerca.name }}</dd>
      </div>
    </dl>

    <p class="m13__texto">
      Guardá el identificador: es el que piden los cruces de entrada y salida.
    </p>

    <button app-button variant="primary" (clicked)="otraGeocerca()">Crear otra</button>
  </div>
} @else {
  @if (errorMessage(); as mensaje) {
    <app-alert appAnuncio tone="error" class="m13__alert">{{ mensaje }}</app-alert>
  }

  <app-paginated-form
    [paginas]="paginas()"
    [form]="form"
    label="Nueva geocerca"
    submitLabel="Crear geocerca"
    [pending]="isSubmitting()"
    (enviado)="submit()"
  />
}
