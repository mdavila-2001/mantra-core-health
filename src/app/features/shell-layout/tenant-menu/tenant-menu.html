@if (visible()) {
<div class="menu-anclaje">
  <button
    class="app-tenant-switcher"
    appTutorialTarget="shell-selector-organizacion"
    type="button"
    app-tenant-switcher
    data-testid="header-organization"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="menu-organizaciones"
    [attr.aria-label]="'Organización activa: ' + label()"
  >
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"></path><path d="M14 10h4a2 2 0 0 1 2 2v8"></path><path d="M3 20h18"></path><path d="M8 8h2M8 12h2M8 16h2"></path></svg>
    <span>{{ label() }}</span>
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <div class="app-menu" id="menu-organizaciones" role="menu" hidden>
    @if (platformScope()) {
      <button
        class="app-menu-item"
        type="button"
        role="menuitem"
        data-testid="header-organization-platform"
        [attr.aria-current]="activeTenantId() === null ? 'true' : null"
        (click)="platformChosen.emit()"
      >
        Toda la plataforma
      </button>
    }
    @for (organizacion of tenants(); track organizacion.id) {
      <button
        class="app-menu-item"
        type="button"
        role="menuitem"
        [attr.aria-current]="organizacion.id === activeTenantId() ? 'true' : null"
        (click)="tenantChanged.emit(organizacion.id)"
      >
        {{ organizacion.name }}
      </button>
    }
  </div>
</div>
}
