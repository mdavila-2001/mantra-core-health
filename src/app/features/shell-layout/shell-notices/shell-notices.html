<!-- Solo si se entró desde un dispositivo nuevo y la organización lo avisa (`NewDeviceAlert`). -->
<app-new-device-banner />
<!-- Las organizaciones que niegan ahora a la persona (`deniedTenants` del token): aviso, no bloqueo. -->
<app-denied-tenants-banner />
<!-- Aviso de una sola vez sobre la medición de uso (consentimiento de los mapas de calor). En el flujo,
     solo en el área autenticada: nunca sobre rutas públicas ni de acceso. -->
<app-ux-consent-notice />
<!-- One-time push offer; waits while any notice above is showing. Lazy chunk loaded right
     after the shell renders: `on idle` starved on busy pages and the offer never came. -->
@defer (on immediate) {
  <app-web-push-offer [held]="pushHeld()" />
}
