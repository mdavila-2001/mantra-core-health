@if (!embedded()) {
  <app-page-header
    title="Encuestas"
    subtitle="Lo que respondieron sus pacientes y qué encuesta recibe cada servicio."
    [breadcrumbs]="breadcrumbs()"
  />
}

<!-- Sub-tabs inside the hub's «Encuestas» panel (segmented: a second level,
     subordinate to the hub's tabs). Each panel mounts only when open, so
     «Encuestas por servicio» requests nothing while the Buzón is shown. -->
<app-tabs
  class="encuestas__subpestanas"
  data-testid="surveys-subtabs"
  [selectedIndex]="selectedIndex()"
  appearance="segmented"
  (selectedIndexChange)="select($event)"
>
  <app-tab label="Buzón">
    @if (selectedIndex() === 0) {
      <app-surveys-inbox (goToServices)="select(1)" />
    }
  </app-tab>
  <app-tab label="Encuestas por servicio">
    @if (selectedIndex() === 1) {
      <app-service-surveys />
    }
  </app-tab>
</app-tabs>
