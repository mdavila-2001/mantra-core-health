@if (!embedded()) {
  <app-page-header
    title="Encuestas"
    subtitle="Lo que respondieron sus pacientes y qué encuesta recibe cada servicio."
    [breadcrumbs]="breadcrumbs()"
  />
}

<!-- Sub-tabs inside the hub's «Encuestas» panel, full width (composition-rules
     §5). No card of its own: the Buzón already draws each survey as a card.
     Each panel mounts only when open, so «Encuestas por servicio» requests
     nothing while the Buzón is shown. -->
<app-tabs
  class="encuestas__subpestanas"
  data-testid="surveys-subtabs"
  [selectedIndex]="index()"
  (selectedIndexChange)="elegir($event)"
>
  <app-tab label="Buzón">
    @if (index() === 0) {
      <app-surveys-inbox (goToServices)="elegir(1)" />
    }
  </app-tab>
  <app-tab label="Encuestas por servicio">
    @if (index() === 1) {
      <app-service-surveys />
    }
  </app-tab>
</app-tabs>
