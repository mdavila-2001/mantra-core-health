<app-page-header
  title="Archivo clínico"
  subtitle="Elegí a la persona cuyo expediente querés consultar."
  [breadcrumbs]="breadcrumbs()"
/>

<div class="archivo">
  <!-- El campo se nombra solo (publica su propio contexto de control): no va
       dentro de un app-form-field, o quedarían dos nombres accesibles. -->
  <app-search-field
    class="archivo__buscador"
    label="Buscar por nombre o código"
    placeholder="Nombre o código de paciente"
    [value]="busqueda()"
    [loading]="cargando()"
    (searched)="buscar($event)"
  />

  <!-- ─── Buscar por documento ──────────────────────────────────────────────
       AC-07-1 / AC-07-2: encontrar a alguien por su carnet aunque su nombre
       o su código no contengan el texto buscado. El departamento es opcional
       y sólo desempata: dos personas pueden compartir el mismo número
       expedido en departamentos distintos. -->
  <form
    class="archivo__documento"
    aria-label="Buscar por documento de identidad"
    (submit)="$event.preventDefault(); buscarPorDocumento()"
  >
    <app-form-field label="Documento de identidad" class="archivo__documento-campo">
      <app-input
        type="text"
        testId="clinical-record-national-id"
        placeholder="Número de carnet"
        [value]="documentoTecleado()"
        (valueChange)="fijarDocumento($event)"
      />
    </app-form-field>

    <app-form-field
      label="Departamento de expedición"
      hint="Opcional. Desempata cuando el número se repite en otro departamento."
      class="archivo__documento-campo"
    >
      <app-select
        [(value)]="departamentoElegido"
        [options]="opcionesDeDepartamento()"
        placeholder="Cualquier departamento"
      />
    </app-form-field>

    <button
      app-button
      type="submit"
      variant="secondary"
      data-testid="clinical-record-search-by-document"
    >
      Buscar por documento
    </button>
  </form>

  <!-- Los 9 estados del M34 —incluido «forbidden», para un rol inesperado—
       los resuelve app-data-table por su cuenta: no se reimplementan acá. -->
  <app-data-table
    [state]="resultados()"
    [columns]="columnas()"
    [trackBy]="porPaciente"
    [rowLabel]="nombreDePaciente"
    caption="Pacientes"
    (retry)="recargar()"
  />
</div>

<!-- Plantillas de celda: el organismo las recibe por `ColumnDef.cell`. -->
<ng-template #celdaPaciente let-paciente>
  <span class="archivo__nombre">{{ paciente.displayName ?? 'Sin nombre registrado' }}</span>
  <span class="archivo__id">{{ paciente.profileId }}</span>
</ng-template>

<ng-template #celdaAccion let-paciente>
  <a app-link [routerLink]="rutaDe(paciente.profileId)">Ver expediente</a>
  <!-- FT-07-R05: sin turno confirmado hoy, "Ver expediente" da 403 — este es
       el camino para pedirle el vínculo al paciente. -->
  <a app-link [routerLink]="rutaSolicitarAcceso(paciente.profileId)">Solicitar vinculación</a>
</ng-template>
