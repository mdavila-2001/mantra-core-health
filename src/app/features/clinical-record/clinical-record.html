<app-page-header
  title="Archivo clínico"
  subtitle="Elegí a la persona cuyo expediente querés consultar."
  [breadcrumbs]="breadcrumbs()"
/>

<div class="archivo">
  <!-- ─── Cómo encontrar a la persona ───────────────────────────────────────
       Los dos campos responden UNA pregunta —«¿a quién buscás?»— y por eso
       van en una sola rejilla, con el ícono de cada uno a su izquierda. Antes
       el buscador flotaba solo sobre una fila suelta de dos campos y un botón
       descolgado contra el borde derecho: bloques sin relación visible para
       una sola pregunta.

       El nombre filtra al teclear (AC del M34); el documento se ENVÍA, porque
       un carnet a medio escribir no debe buscar (AC-07-1). Por eso el bloque
       es un `<form>` y el Enter del buscador no lo envía. -->
  <form
    class="archivo__filtros"
    aria-label="Buscar a la persona"
    (submit)="$event.preventDefault(); buscarPorDocumento()"
  >
    <div class="app-form-grid">
      <!-- El Enter de este campo ya buscó por nombre —lo emite `app-search-field`
           al instante—; dejarlo además enviar el formulario buscaría por
           documento y borraría la `q` recién escrita. -->
      <app-form-field
        icon="patients"
        label="Nombre o código"
        hint="Filtra la lista mientras escribís."
        (keydown.enter)="$event.preventDefault()"
      >
        <app-search-field
          placeholder="Nombre o código de paciente"
          [value]="busqueda()"
          [loading]="cargando()"
          (searched)="buscar($event)"
        />
      </app-form-field>

      <!-- AC-07-1: encontrar a alguien por su carnet aunque su nombre o su
           código no contengan el texto buscado. -->
      <app-form-field
        icon="labels"
        label="Documento de identidad"
        hint="El número exacto del carnet."
      >
        <app-input
          type="text"
          testId="clinical-record-national-id"
          placeholder="Número de carnet"
          [value]="documentoTecleado()"
          (valueChange)="fijarDocumento($event)"
        />
      </app-form-field>
    </div>

    <!-- El botón, en su propio renglón y fuera de la rejilla.

         Fuera, y no como un hijo suyo a lo ancho, porque un hijo que ocupa
         todas las columnas le impide a `auto-fit` plegar la que sobra. Y en
         su propio renglón porque, como una columna más de la fila, había
         que empujarle un margen superior calculado a mano para que su borde
         cuadrara con el de los controles. -->
    <div class="archivo__acciones">
      <button
        app-button
        type="submit"
        variant="secondary"
        data-testid="clinical-record-search-by-document"
      >
        Buscar por documento
      </button>
    </div>
  </form>

  <!-- Los 9 estados del M34 —incluido «forbidden», para un rol inesperado—
       los resuelve app-data-table por su cuenta: no se reimplementan acá. -->
  <app-data-table
    [state]="resultados()"
    [columns]="columnas()"
    [trackBy]="porPaciente"
    [rowLabel]="nombreDePaciente"
    caption="Pacientes"
    (retry)="recargar()"
  />
</div>

<!-- Plantillas de celda: el organismo las recibe por `ColumnDef.cell`. -->
<ng-template #celdaPaciente let-paciente>
  <span class="archivo__nombre">{{ paciente.displayName ?? 'Sin nombre registrado' }}</span>
</ng-template>

<!-- El documento y el teléfono, en lugar del código interno y del uuid del
     perfil (propietario, 19/09/2026). Cuando el dato falta se dice con
     palabras: un guion suelto se lee como si el dato fuera ese. -->
<ng-template #celdaDocumento let-paciente>
  @if (paciente.nationalId) {
    <span class="archivo__dato">{{ paciente.nationalId }}</span>
  } @else {
    <span class="archivo__sin-dato">Sin documento registrado</span>
  }
</ng-template>

<ng-template #celdaTelefono let-paciente>
  @if (paciente.phone; as telefono) {
    <!-- Enlace `tel:`: en el teléfono del médico, tocarlo llama. -->
    <a class="archivo__dato" [href]="'tel:' + telefono">{{ telefono }}</a>
  } @else {
    <span class="archivo__sin-dato">Sin teléfono registrado</span>
  }
</ng-template>

<!-- Las dos acciones de la fila, cada una con SU color y su globo.
     Eran dos enlaces de texto pegados —«Ver expedienteSolicitar
     vinculación»— sin separación ni jerarquía: no se veía que fueran dos.

     Son anclas y no botones porque navegan: así siguen valiendo el clic con
     la rueda, «abrir en pestaña nueva» y el destino en la barra de estado.
     El nombre accesible va en el host y nombra a la persona, que es lo que
     un lector de pantalla necesita para no leer «Ver expediente» veinte
     veces seguidas. -->
<ng-template #celdaAccion let-paciente>
  <div class="archivo__fila-acciones">
    <a
      app-button
      variant="primary"
      size="sm"
      [iconOnly]="true"
      data-testid="paciente-ver-expediente"
      [routerLink]="rutaDe(paciente.profileId)"
      [attr.aria-label]="'Ver el expediente de ' + nombreDe(paciente)"
      appTooltip="Ver expediente"
    >
      <app-nav-icon name="folder" />
    </a>

    <!-- FT-07-R05: sin turno confirmado hoy, «Ver expediente» da 403 — este es
         el camino para pedirle el vínculo al paciente. Va en secundario: es la
         salida cuando la primera no está disponible, no la acción de todos los
         días. -->
    <a
      app-button
      variant="secondary"
      size="sm"
      [iconOnly]="true"
      data-testid="paciente-solicitar-vinculacion"
      [routerLink]="rutaSolicitarAcceso(paciente.profileId)"
      [attr.aria-label]="'Solicitar la vinculación con ' + nombreDe(paciente)"
      appTooltip="Solicitar vinculación"
    >
      <app-nav-icon name="link" />
    </a>
  </div>
</ng-template>
