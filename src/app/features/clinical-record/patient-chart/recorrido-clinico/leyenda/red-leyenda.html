@for (hito of hitos(); track hito.muestra) {
  <li class="red__leyenda-item" [attr.data-hito]="hito.muestra">
    <span [class]="'red__muestra-hito red__hito--' + hito.muestra" aria-hidden="true"></span> {{ hito.nombre }}
  </li>
}
@for (item of items(); track item.familia) {
  <li class="red__leyenda-item" [attr.data-familia]="item.familia" [attr.title]="item.motivos">
    <svg class="red__muestra" viewBox="0 0 28 8" aria-hidden="true" focusable="false">
      <path
        class="red__arista"
        [class.red__arista--tronco]="item.familia === 'tronco'"
        [class.red__arista--enlace]="item.familia === 'enlace'"
        [class.red__arista--inferido]="item.familia === 'inferido'"
        [attr.d]="item.familia === 'tronco' ? 'M 1 4 H 27' : 'M 1 4 H 22'"
      />
      @if (item.familia !== 'tronco') {
        <path
          [class]="item.familia === 'inferido' ? 'red__punta red__punta--inferido' : 'red__punta'"
          d="M 21 1 L 27 4 L 21 7 Z"
        />
      }
    </svg>
    {{ item.nombre }}<span class="sr-only">: {{ item.motivos }}</span>
  </li>
}
