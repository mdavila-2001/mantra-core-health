<app-card variant="outlined" padding="lg" class="cierre" data-testid="cierre-del-formulario">
  <h3 class="cierre__titulo">Cierre del formulario</h3>
  <p class="cierre__intro">
    Al completar «{{ nombreDeFicha() }}» puede dejar registrado un diagnóstico tentativo y pedir
    una orden. Los dos son opcionales: la ficha se completa igual.
  </p>

  <!-- ─── Lo que se registra al completar ──────────────────────────────────── -->
  <div class="cierre__eleccion">
    <app-form-field
      label="Diagnóstico tentativo"
      hint="Opcional. Nace presuntivo: se confirma o rechaza en la casilla «Diagnóstico»."
    >
      <app-concept-select
        [target]="targetDiagnostico"
        [value]="diagnostico()"
        (valueChange)="elegirDiagnostico($event)"
        placeholder="Sin diagnóstico tentativo"
      />
    </app-form-field>

    <app-form-field
      label="Categoría de la orden"
      hint="Opcional. Laboratorio, imagenología u otro."
    >
      <app-select
        [options]="categorias"
        [value]="categoriaDeOrden()"
        (valueChange)="elegirCategoria($event)"
        ariaLabel="Categoría de la orden de análisis"
      />
    </app-form-field>

    <app-form-field
      label="Orden de análisis"
      hint="Opcional. Se pide al completar la ficha, dentro de esta consulta."
    >
      <app-concept-select
        [target]="targetEstudio"
        [value]="estudio()"
        (valueChange)="elegirEstudio($event)"
        placeholder="Sin orden de análisis"
      />
    </app-form-field>

    @if (ordenIncompleta()) {
      <p class="cierre__aviso" role="status" data-testid="cierre-orden-incompleta">
        Elija la categoría para que la orden se pida al completar.
      </p>
    }
  </div>
</app-card>
