<svg class="sc__svg" [attr.viewBox]="'0 0 ' + width() + ' ' + height()" [attr.width]="width()" [attr.height]="height()" role="img" [attr.aria-label]="ariaLabel() + '. ' + verdict()">
  @for (t of yTicks(); track t) {
    <line class="sc__grid" [attr.x1]="margin.left" [attr.x2]="width() - margin.right" [attr.y1]="py(t)" [attr.y2]="py(t)" />
    <text class="sc__tick" [attr.x]="margin.left - 8" [attr.y]="py(t)" text-anchor="end" dominant-baseline="middle">{{ axisY(t) }}</text>
  }
  @for (t of xTicks(); track t) {
    <text class="sc__tick" [attr.x]="px(t)" [attr.y]="height() - 24" text-anchor="middle">{{ axisX(t) }}</text>
  }
  <text class="sc__axis" [attr.x]="(margin.left + width() - margin.right) / 2" [attr.y]="height() - 6" text-anchor="middle">{{ xLabel() }}</text>
  <text class="sc__axis" x="12" y="12" text-anchor="start">{{ yLabel() }}</text>

  @if (trend(); as t) {
    <line class="sc__trend" [attr.x1]="t.x1" [attr.y1]="t.y1" [attr.x2]="t.x2" [attr.y2]="t.y2" />
  }

  @for (d of dots(); track d.id) {
    <circle
      class="sc__dot"
      [class.sc__dot--hover]="hover() === d.id"
      [attr.cx]="d.cx"
      [attr.cy]="d.cy"
      r="5"
      [style.fill]="sv((d.color ?? 1))"
      tabindex="0"
      role="img"
      [attr.aria-label]="d.tip"
      (pointerenter)="hover.set(d.id)"
      (pointerleave)="hover.set(null)"
      (focus)="hover.set(d.id)"
      (blur)="hover.set(null)"
    >
      <title>{{ d.tip }}</title>
    </circle>
  }

  @if (hovered(); as h) {
    <text class="sc__hint" [attr.x]="h.cx" [attr.y]="h.cy - 10" text-anchor="middle">{{ h.label }}</text>
  }
</svg>
<p class="sc__verdict">{{ verdict() }}</p>
