<div class="ms">
  <span class="ms__label" [id]="'ms-l-' + label()">{{ label() }}</span>
  <button type="button" class="ms__btn" aria-haspopup="true" [attr.aria-expanded]="isOpen()" [attr.aria-labelledby]="'ms-l-' + label()" (click)="isOpen.set(!isOpen())">
    <span class="ms__value">{{ summary() }}</span>
    <svg class="ms__caret" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9" /></svg>
  </button>
  @if (isOpen()) {
    <div class="ms__panel" role="group" [attr.aria-label]="label()">
      @for (o of options(); track o.value) {
        <app-checkbox [label]="o.label" [checked]="isChecked(o.value)" (checkedChange)="toggle(o.value, $event)" />
        @if (o.hint) {
          <span class="ms__hint">{{ o.hint }}</span>
        }
      }
      <button type="button" class="ms__all" (click)="selectAll()">Seleccionar todas</button>
    </div>
  }
</div>
