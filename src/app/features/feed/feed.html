<app-page-header
  title="Muro profesional"
  subtitle="Lo que publican los perfiles que seguís."
/>

@if (error(); as mensaje) {
  <app-alert tone="error" class="muro__alerta">{{ mensaje }}</app-alert>
}

@if (!perfilResuelto()) {
  <p class="muro__cargando" role="status">Cargando tu muro…</p>
} @else if (perfil() === null) {
  <!-- Una puerta, no un error: el muro necesita un perfil público, que es una
       entidad aparte del perfil de paciente que trae la sesión. -->
  <app-empty-state
    title="Todavía no tenés perfil público"
    description="El muro muestra lo que publican los perfiles que seguís, y para eso hace falta tener el tuyo. Se crea desde «Mi perfil»."
    variant="empty"
  />
} @else if (vacio()) {
  <app-empty-state
    title="Tu muro está vacío"
    description="Cuando sigas a otros profesionales, sus publicaciones van a aparecer acá."
    variant="empty"
  />
} @else {
  <div class="muro__lista">
    @for (entrada of entradas(); track entrada.id) {
      <app-post-card [post]="entrada.post!" [actorProfileId]="perfil()" />
    }
  </div>

  @if (hayMas()) {
    <div class="muro__mas">
      <!-- «Ver más» y no «página 3 de 47»: el contrato del M34 no da totales,
           así que decir un número de páginas sería inventarlo. -->
      <button app-button variant="outline" [isLoading]="cargando()" (clicked)="verMas()">
        Ver más publicaciones
      </button>
    </div>
  }
}
