<app-page-header
  [title]="title()"
  [subtitle]="category()"
  [breadcrumbs]="[
    { label: 'Directorio de laboratorios', routerLink: '/laboratory-directory' },
    { label: title() },
  ]"
/>

<app-view-state-host [state]="state()" (retry)="retry()">
  @if (detail(); as unit) {
    <div class="ficha">
      <!-- El resumen NO es una `app-fact-section`: no es «lo mismo repetido»,
           es un solo grupo de cuatro campos. Buscarlo, filtrarlo o paginarlo no
           tendría sentido, y la sección los habría dibujado igual. -->
      <app-card variant="outlined" padding="lg" class="ficha__card ficha__card--ancha">
        <app-section-heading card-header icono="flask" titulo="Identificación" />
        <app-fact-list disposicion="columnas" [hechos]="identificacion(unit)" />

        @if (modalidades(unit).length > 0) {
          <ul class="ficha__modalidades" aria-label="Modalidades de atención">
            @for (modalidad of modalidades(unit); track modalidad) {
              <li>{{ modalidad }}</li>
            }
          </ul>
        }
      </app-card>

      @if (sedes().length > 0) {
        <app-fact-section
          class="ficha__card ficha__card--ancha"
          icono="building"
          titulo="Sedes"
          [bloques]="sedes()"
          [columnas]="2"
        />
      }

      @if (equipos().length > 0) {
        <app-fact-section
          class="ficha__card ficha__card--ancha"
          icono="scan"
          titulo="Equipos"
          [bloques]="equipos()"
          [columnas]="2"
        />
      }

      @if (estudios().length > 0) {
        <app-fact-section
          class="ficha__card ficha__card--ancha"
          icono="results"
          titulo="Estudios y servicios"
          [bloques]="estudios()"
          [columnas]="2"
        />
      }

      @if (acreditaciones().length > 0) {
        <app-fact-section
          class="ficha__card ficha__card--ancha"
          icono="shield"
          titulo="Acreditaciones vigentes"
          [bloques]="acreditaciones()"
          [columnas]="2"
        />
      }
    </div>
  }
</app-view-state-host>
