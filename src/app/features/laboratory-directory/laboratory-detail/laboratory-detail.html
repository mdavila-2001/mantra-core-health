<app-page-header
  [title]="title()"
  [subtitle]="category()"
  [breadcrumbs]="[
    { label: 'Directorio de laboratorios', routerLink: '/laboratory-directory' },
    { label: title() },
  ]"
>
  <!-- One root node per @if: a block with several roots is not projected. -->
  @if (accredited()) {
    <p page-meta class="ficha-lab__trust" data-testid="unit-trust">
      <app-badge variant="success" value="Centro acreditado" />
    </p>
  }

  <!-- Booking starts from the order a doctor issued, so this leads to the
       patient's orders; it does not promise a slot at this centre. -->
  @if (detail() && canBook()) {
    <a app-button page-actions class="ficha-lab__book" variant="primary" [routerLink]="ordersRoute" data-testid="unit-book">
      <app-nav-icon name="calendar" />
      Reservar desde mis órdenes
    </a>
  }
</app-page-header>

<!-- ONE `app-card` with tabs, centred and full width (`composition-rules.md` §5).
     The summary stays on top in every tab; the open tab lives in `?tab=` and
     defaults to Studies, where the `#estudios` anchor lands. -->
<div class="ficha-publica">
  <app-view-state-host [state]="state()" (retry)="retry()">
    <app-lab-sheet-skeleton vsh-skeleton />
    @if (detail(); as unit) {
      <app-card variant="outlined" padding="lg" class="ficha-lab__card" data-testid="unit-card">
        <app-lab-unit-summary [unit]="unit" [icon]="iconoDelCentro()" />

        <app-tabs
          class="ficha-lab__tabs"
          appearance="browser"
          [selectedIndex]="seleccionada()"
          (selectedIndexChange)="seleccionar($event)"
          data-testid="unit-tabs"
        >
          <app-tab [label]="'Estudios (' + unit.studies.length + ')'">
            <app-lab-studies-panel [studies]="unit.studies" [(term)]="terminoDeEstudio" [(area)]="selectedArea" />
          </app-tab>
          @if (unit.equipment.length > 0) {
            <app-tab [label]="'Equipos (' + unit.equipment.length + ')'">
              <app-lab-facility-grid kind="equipment" [unit]="unit" />
            </app-tab>
          }
          @if (unit.sites.length > 0) {
            <app-tab [label]="'Sedes (' + unit.sites.length + ')'">
              <app-lab-facility-grid kind="sites" [unit]="unit" />
            </app-tab>
          }
          @if (unit.accreditations.length > 0) {
            <app-tab [label]="'Acreditaciones (' + unit.accreditations.length + ')'">
              <app-lab-facility-grid kind="accreditations" [unit]="unit" />
            </app-tab>
          }
        </app-tabs>
      </app-card>
    }
  </app-view-state-host>
</div>
