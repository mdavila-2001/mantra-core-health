<!-- Toda la anatomía —encabezado, chips, contador y grilla— la pone
     `app-directory-page`, que es el patrón común de los cuatro directorios
     (A7 del plan de UX). Acá sólo queda lo que de verdad es propio de los
     laboratorios: sus filtros y su mapeo. -->
<app-directory-page
  titulo="Directorio de laboratorios"
  subtitulo="Centros verificados de laboratorio clínico e imagenología, de toda la red. Tocá un chip para acotar."
  etiquetaBusqueda="Buscar por nombre o código del centro"
  [filtros]="filtros"
  [estado]="state()"
  [grupos]="groups()"
  [sustantivo]="sustantivo"
  (filtrosCambiaron)="filtrar($event)"
  (reintentar)="retry()"
/>
