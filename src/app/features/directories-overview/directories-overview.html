<!-- La misma barra de búsqueda que los directorios (pedido del cliente,
     19/09/2026): en todos los niveles, no sólo en la lista del último. Sin
     nada escrito se ven las puertas; con un término, lo que coincide en cada
     directorio, agrupado por directorio. -->
<app-directory-page
  titulo="Directorios"
  subtitulo="Elija dónde buscar o escriba un nombre. Cada directorio tiene sus filtros a la izquierda."
  [filtros]="filtros()"
  [etiquetaBusqueda]="etiquetaBusqueda()"
  [searchPlaceholder]="etiquetaBusqueda()"
  [estado]="estado()"
  [grupos]="grupos()"
  [sustantivo]="sustantivo"
  [portada]="enPortada()"
  rotuloDeGrupos="Directorio"
  iconoDeGrupos="directory"
  (reintentar)="reintentar()"
>
  <!-- Las puertas. La primera —la tarea principal de la sesión, en el orden
       del menú— va a lo ancho; las demás, en una fila pareja. Cada tarjeta
       muestra sólo lo que su sección declara: nombre, descripción y a dónde
       lleva. Nada de cifras ni calificaciones que no salgan de los datos. -->
  <div slot="portada" class="directories">
    <ul class="directories__grid" [attr.data-count]="nodosVisibles().length">
      @for (nodo of nodosVisibles(); track nodo.path; let first = $first) {
        <li
          class="directories__item"
          [class.directories__item--featured]="first"
          [attr.data-path]="nodo.path"
        >
          <a
            class="directories__card"
            [routerLink]="routeOf(nodo)"
            [attr.aria-label]="nodo.label + '. ' + nodo.summary"
          >
            <img
              class="directories__photo"
              [src]="fotoDe(nodo.path)"
              alt=""
              width="640"
              height="360"
              [attr.loading]="first ? 'eager' : 'lazy'"
            />
            <div class="directories__body">
              <div class="directories__heading">
                <span class="directories__icon" aria-hidden="true">
                  <app-nav-icon [name]="nodo.icon" />
                </span>
                <h2 class="directories__name">{{ shortName(nodo) }}</h2>
              </div>
              <p class="directories__summary">{{ nodo.summary }}</p>
              <span class="directories__action" aria-hidden="true">
                {{ actionLabel(nodo) }}
                <svg viewBox="0 0 20 20" width="16" height="16" focusable="false">
                  <path d="M4 10h11m-4-4 4 4-4 4" />
                </svg>
              </span>
            </div>
          </a>
        </li>
      }
    </ul>
  </div>
</app-directory-page>
