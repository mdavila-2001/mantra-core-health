<div [formGroup]="form">
  <app-form-field
    label="Identificador de la clave"
    [required]="true"
    hint="El `kid` con el que el proveedor la publica en su JWKS."
    [errorMessage]="
      form.controls.keyId.touched && form.controls.keyId.invalid
        ? 'Ingresá el identificador (hasta 200 caracteres).'
        : ''
    "
  >
    <app-input formControlName="keyId" type="text" />
  </app-form-field>

  <app-form-field
    label="Algoritmo de firma"
    [required]="true"
    hint="Por ejemplo RS256 o ES256."
    [errorMessage]="
      form.controls.algorithm.touched && form.controls.algorithm.invalid
        ? 'Ingresá el algoritmo (hasta 50 caracteres).'
        : ''
    "
  >
    <app-input formControlName="algorithm" type="text" />
  </app-form-field>

  <app-form-field
    label="Clave pública"
    [required]="true"
    hint="En formato PEM o JWK, tal como la publica el proveedor."
    [errorMessage]="
      form.controls.publicKey.touched && form.controls.publicKey.invalid
        ? 'Pegá la clave pública.'
        : ''
    "
  >
    <app-textarea formControlName="publicKey" [rows]="4" [autoResize]="true" />
  </app-form-field>

  <app-form-field label="Certificado asociado" hint="Opcional.">
    <app-textarea formControlName="certificate" [rows]="3" [autoResize]="true" />
  </app-form-field>

  <app-form-field label="Válida desde" hint="Sin fecha, rige desde ahora.">
    <app-date-picker mode="date-time" [(value)]="validFrom" [disabled]="disabled()" />
  </app-form-field>

  <app-form-field label="Vigente hasta" hint="Sin fecha, no vence sola.">
    <app-date-picker mode="date-time" [(value)]="validTo" [disabled]="disabled()" />
  </app-form-field>
</div>
