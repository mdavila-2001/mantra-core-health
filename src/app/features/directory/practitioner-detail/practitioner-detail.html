<app-page-header
  [title]="titulo()"
  subtitle="Perfil profesional"
  [breadcrumbs]="[
    { label: 'Directorio de médicos', routerLink: '/directory' },
    { label: titulo() },
  ]"
/>

<!-- El dibujo es `practitioner-profile-view`, el mismo con el que un doctor ve
     su propio perfil (carril R2-4). `esPropio` en false: es la ficha de un
     colega, así que no hay acciones de dueño ni se tutea. -->
<app-view-state-host [state]="estado()" (retry)="recargar()">
  @if (visible(); as perfil) {
    <app-practitioner-profile-view [perfil]="perfil" [esPropio]="false">
      <!-- Con qué seguros trabaja: carga por su cuenta, así que si falla la
           ficha sigue en pie y sólo esa tarjeta ofrece reintentar. -->
      <app-practitioner-insurers profileInsurers [practitionerProfileId]="profileIdVisible()" />
    </app-practitioner-profile-view>

    <!-- TP-4: los horarios, donde se toma la decisión.
         La ficha decía en qué sedes atiende, pero para saber CUÁNDO había que
         salir de acá, entrar a la reserva y elegirlo de una lista. Quien
         compara dos profesionales hacía ese viaje dos veces. -->
    <!-- `id` para que «Revisar disponibilidad» del directorio caiga acá y no
         arriba de todo: es el contrato con `ANCLA_HORARIOS`. -->
    <section class="ficha__horarios" id="horarios">
      <h2 class="ficha__horarios-titulo">Sedes y horarios</h2>
      <app-practitioner-availability
        [practitionerProfileId]="profileIdVisible()"
        [tenantId]="tenantId()"
      />
    </section>
  }
</app-view-state-host>
