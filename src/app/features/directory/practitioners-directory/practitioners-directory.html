<!-- La guía de médicos, en filas (propietario, 04/10/2026): primero los
     médicos, no un grid de especialidades. La especialidad es un filtro de la
     barra y viaja en la URL, así que «la guía, cardiología» sigue siendo un
     enlace que se puede compartir y el chequeo de síntomas puede mandar directo. -->
<app-directory-page
  titulo="Directorio de médicos"
  [subtitulo]="
    'Buscá por nombre o elegí una especialidad. ' +
    totalDeProfesionales() +
    ' profesionales en la red.'
  "
  etiquetaBusqueda="Buscar por nombre o especialidad"
  [filtros]="filtros()"
  [estado]="estado()"
  [grupos]="tramos()"
  [sustantivo]="sustantivo"
  [aviso]="aviso()"
  [textoSinCoincidencias]="sinCoincidencias()"
  [preventDuplicateNavigation]="true"
  vistaPorDefecto="lista"
  claveDeVista="alovida.directorio.vista.medicos"
  (filtrosCambiaron)="filtrar($event)"
  (reintentar)="recargar()"
/>
