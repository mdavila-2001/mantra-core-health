<span class="bed-status" [attr.data-pattern]="estado().glyph">
  <svg class="bed-status__glifo" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    @switch (estado().glyph) {
      @case ('free') { <circle cx="8" cy="8" r="6" /><path d="M5.2 8.2l2 2 3.6-4" /> }
      @case ('occupied') { <circle cx="8" cy="5.2" r="2.4" /><path d="M3.2 13c.5-2.6 2.3-4 4.8-4s4.3 1.4 4.8 4" /> }
      @case ('reserved') { <circle cx="8" cy="8" r="6" /><path d="M8 4.6V8l2.4 1.6" /> }
      @case ('housekeeping') { <path d="M3 5.5c1.3-1 2.4-1 3.7 0s2.4 1 3.7 0 1.4-.8 2.6-.4M3 9c1.3-1 2.4-1 3.7 0s2.4 1 3.7 0 1.4-.8 2.6-.4M3 12.5c1.3-1 2.4-1 3.7 0s2.4 1 3.7 0" /> }
      @case ('contaminated') { <path d="M8 2.2l6 10.6H2z" /><path d="M8 6.6v3M8 11.4v.2" /> }
      @case ('isolated') { <path d="M8 1.8l5.4 2v4.2c0 3-2.3 5.2-5.4 6.2-3.1-1-5.4-3.2-5.4-6.2V3.8z" /><path d="M5.8 8h4.4" /> }
      @default { <circle cx="8" cy="8" r="6" /><path d="M3.8 12.2l8.4-8.4" /> }
    }
  </svg>
  <span class="bed-status__texto">{{ estado().label }}</span>
</span>
