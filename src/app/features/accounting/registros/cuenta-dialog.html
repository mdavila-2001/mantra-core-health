<app-content-dialog
  [heading]="titulo()"
  description="Las cuentas son también los tipos de sus gastos, activos y deudas."
  size="sm"
  [dismissible]="!guardando()"
  data-testid="cuenta-dialog"
  (closed)="closed.emit()"
>
  @if (error(); as mensaje) {
    <app-alert appAnuncio tone="error">{{ mensaje }}</app-alert>
  }
  <form class="registros-form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <app-form-field
      label="Nombre"
      [required]="true"
      [errorMessage]="
        form.controls.name.touched && form.controls.name.invalid
          ? 'Escriba un nombre de hasta 80 caracteres.'
          : ''
      "
    >
      <app-input
        formControlName="name"
        autocomplete="off"
        placeholder="Laboratorio de referencia"
        testId="cuenta-nombre"
      />
    </app-form-field>
    <app-form-field
      label="Clase"
      [required]="true"
      [hint]="
        cuenta()?.seeded
          ? 'Es una cuenta general: se puede renombrar, no cambiar de clase.'
          : 'Gasto, activo, deuda, ingreso o capital.'
      "
    >
      <app-select
        formControlName="accountClass"
        [options]="opcionesDeClase"
        ariaLabel="Clase de la cuenta"
        data-testid="cuenta-clase"
      />
    </app-form-field>
  </form>

  <button
    dialog-actions
    app-button
    type="button"
    variant="ghost"
    [disabled]="guardando()"
    (clicked)="dialog().close()"
  >
    Cancelar
  </button>
  <button
    dialog-actions
    app-button
    type="button"
    [isLoading]="guardando()"
    [disabled]="guardando()"
    data-testid="cuenta-guardar"
    (clicked)="guardar()"
  >
    Guardar cuenta
  </button>
</app-content-dialog>
