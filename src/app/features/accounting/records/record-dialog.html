<app-content-dialog
  [heading]="titulo()"
  size="md"
  [dismissible]="!guardando()"
  data-testid="registro-dialog"
  (closed)="closed.emit()"
>
  @if (error(); as mensaje) {
    <app-alert appAnuncio tone="error">{{ mensaje }}</app-alert>
  }
  <form class="registros-form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <div class="registros-form__tipo">
      <app-form-field
        [label]="textos().tipo"
        [required]="true"
        [errorMessage]="
          form.controls.accountId.touched && form.controls.accountId.invalid ? 'Elija el tipo.' : ''
        "
      >
        <app-select
          formControlName="accountId"
          [options]="opcionesDeTipo()"
          placeholder="Elija el tipo"
          [ariaLabel]="textos().tipo"
          data-testid="registro-tipo"
        />
      </app-form-field>
      <!-- La cuenta que falta se crea acá mismo, sin salir del formulario. -->
      <button
        app-button
        type="button"
        variant="ghost"
        size="sm"
        class="registros-form__nueva-cuenta"
        data-testid="registro-nueva-cuenta"
        [disabled]="guardando()"
        (clicked)="creandoCuenta.set(true)"
      >
        Nueva cuenta
      </button>
    </div>

    <app-form-field
      [label]="textos().descripcion"
      [required]="true"
      [errorMessage]="
        form.controls.description.touched && form.controls.description.invalid
          ? 'Escriba una descripción de hasta 160 caracteres.'
          : ''
      "
    >
      <app-input
        formControlName="description"
        autocomplete="off"
        [placeholder]="textos().ejemploDescripcion"
        testId="registro-descripcion"
      />
    </app-form-field>

    <div class="registros-form__par">
      <app-form-field
        label="Fecha"
        [required]="true"
        [errorMessage]="fechaTocada() && fecha() === null ? 'Elija la fecha.' : ''"
      >
        <app-date-picker
          [value]="fecha()"
          (valueChange)="fecha.set($event)"
          data-testid="registro-fecha"
        />
      </app-form-field>
      <app-form-field
        [label]="textos().monto"
        [required]="true"
        hint="En bolivianos."
        [errorMessage]="
          montoInvalido() ? 'Escriba un monto mayor a cero, con hasta dos decimales.' : ''
        "
      >
        <app-input
          formControlName="amount"
          inputMode="decimal"
          placeholder="1250,00"
          testId="registro-monto"
        />
      </app-form-field>
    </div>
  </form>

  <button
    dialog-actions
    app-button
    type="button"
    variant="ghost"
    [disabled]="guardando()"
    (clicked)="dialog().close()"
  >
    Cancelar
  </button>
  <button
    dialog-actions
    app-button
    type="button"
    [isLoading]="guardando()"
    [disabled]="guardando()"
    data-testid="registro-guardar"
    (clicked)="guardar()"
  >
    Guardar
  </button>
</app-content-dialog>

@if (creandoCuenta()) {
  <app-account-dialog
    [practiceId]="practiceId()"
    [claseFija]="clase()"
    (saved)="alCrearCuenta($event)"
    (closed)="creandoCuenta.set(false)"
  />
}
