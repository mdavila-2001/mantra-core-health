<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Oftalmología</title>
  <desc id="d">A la izquierda, un corte del ojo con la córnea, el iris, el cristalino, el vítreo, la retina y el nervio óptico. A la derecha, las enfermedades que atiende la oftalmología, como defectos de refracción, catarata, glaucoma, retinopatía, degeneración macular y estrabismo, y sus herramientas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">El ojo por dentro</text>
  <circle cx="230" cy="230" r="120" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="M230 110 A120 120 0 0 1 230 350" fill="none" stroke="var(--vessel)" stroke-width="6" opacity=".7"/>
  <path d="M126 170 C96 200 96 260 126 290" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M128 186 V206 M128 254 V274" fill="none" stroke="var(--nerve)" stroke-width="8"/>
  <ellipse cx="148" cy="230" rx="16" ry="34" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M346 220 H400 M346 240 H400" fill="none" stroke="var(--nerve)" stroke-width="6"/>
  <text x="80" y="160" text-anchor="middle" class="small">Córnea</text>
  <text x="150" y="300" text-anchor="middle" class="small">Iris</text>
  <text x="150" y="330" text-anchor="middle" class="small">Cristalino</text>
  <path d="M150 318 L150 266" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="300" y="100" class="small" style="fill:var(--vessel)">Retina</text>
  <text x="370" y="268" text-anchor="middle" class="small">Nervio</text>
  <text x="370" y="284" text-anchor="middle" class="small">óptico</text>
  <text x="230" y="236" text-anchor="middle" class="small muted">Vítreo</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <rect x="452" y="66" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="528.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Miopía y otros</text>
  <rect x="612" y="66" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="688.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Catarata</text>
  <rect x="452" y="110" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="528.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Glaucoma</text>
  <rect x="612" y="110" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="688.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Retinopatía</text>
  <rect x="452" y="154" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="528.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Degeneración</text>
  <rect x="612" y="154" width="152" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="688.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Estrabismo</text>
  <text x="456" y="226" class="step">Herramientas</text>
  <text x="460" y="252" class="lab">• Agudeza visual</text>
  <text x="460" y="276" class="lab">• Lámpara de hendidura</text>
  <text x="460" y="300" class="lab">• Fondo de ojo y presión ocular</text>
  <text x="460" y="324" class="lab">• Tomografía de la retina</text>
  <text x="460" y="348" class="lab">• Cirugía y láser</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
