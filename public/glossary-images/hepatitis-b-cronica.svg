<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hepatitis B crónica</title>
  <desc id="d">A la izquierda, el virus de la hepatitis B, sus vías de transmisión por sangre, relaciones sexuales y de madre a bebé, lo que no lo transmite y las medidas de prevención con la vacuna. A la derecha, la evolución posible de la infección a la forma crónica, la fibrosis y, en una parte de los casos, cirrosis o cáncer, y el control con análisis, ecografía y antivirales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Virus y transmisión</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Evolución y control</text>
<circle cx="120" cy="130" r="44" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2"/>
<circle cx="120" cy="130" r="22" fill="var(--purple)"/>
<circle cx="170.0" cy="130.0" r="5" fill="var(--purple)"/>
<circle cx="163.3" cy="155.0" r="5" fill="var(--purple)"/>
<circle cx="145.0" cy="173.3" r="5" fill="var(--purple)"/>
<circle cx="120.0" cy="180.0" r="5" fill="var(--purple)"/>
<circle cx="95.0" cy="173.3" r="5" fill="var(--purple)"/>
<circle cx="76.7" cy="155.0" r="5" fill="var(--purple)"/>
<circle cx="70.0" cy="130.0" r="5" fill="var(--purple)"/>
<circle cx="76.7" cy="105.0" r="5" fill="var(--purple)"/>
<circle cx="95.0" cy="86.7" r="5" fill="var(--purple)"/>
<circle cx="120.0" cy="80.0" r="5" fill="var(--purple)"/>
<circle cx="145.0" cy="86.7" r="5" fill="var(--purple)"/>
<circle cx="163.3" cy="105.0" r="5" fill="var(--purple)"/>
<text x="120" y="200" text-anchor="middle" class="small" style="fill:var(--purple)">Virus de la hepatitis B</text>
<text x="196" y="96" class="h">Se transmite por</text>
<text x="196" y="122" class="small">• Sangre</text>
<text x="196" y="144" class="small">• Relaciones sexuales</text>
<text x="196" y="166" class="small">• De madre a bebé</text>
<text x="207" y="188" class="small">en el parto</text>
<text x="40" y="246" class="h" style="fill:var(--ok)">No se transmite por</text>
<text x="40" y="270" class="lab">abrazos, besos, cubiertos ni comida.</text>
<rect x="40" y="300" width="320" height="120" rx="10" fill="var(--ok-l)"/>
<text x="56" y="326" class="h" style="fill:var(--ok)">Prevención</text>
<text x="56" y="352" class="lab">• Vacuna (desde el nacimiento)</text>
<text x="56" y="374" class="lab">• Preservativo</text>
<text x="56" y="396" class="lab">• No compartir agujas ni cuchillas</text>
<rect x="416" y="70" width="150" height="44" rx="8" fill="var(--accent)"/>
<text x="491.0" y="96.3" text-anchor="middle" class="small" style="fill:var(--on)">Infección</text>
<text x="580" y="97" class="small" style="fill:var(--muted)">el virus entra</text>
<line x1="491" y1="116" x2="491" y2="134" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="136" width="150" height="44" rx="8" fill="var(--purple)"/>
<text x="491.0" y="162.3" text-anchor="middle" class="small" style="fill:var(--on)">Crónica</text>
<text x="580" y="163" class="small" style="fill:var(--muted)">persiste más de 6 meses</text>
<line x1="491" y1="182" x2="491" y2="200" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="202" width="150" height="44" rx="8" fill="var(--warn)"/>
<text x="491.0" y="228.3" text-anchor="middle" class="small" style="fill:var(--on)">Fibrosis</text>
<text x="580" y="229" class="small" style="fill:var(--muted)">cicatriz lenta</text>
<line x1="491" y1="248" x2="491" y2="266" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="268" width="150" height="44" rx="8" fill="var(--bad)"/>
<text x="491.0" y="294.3" text-anchor="middle" class="small" style="fill:var(--on)">Cirrosis o cáncer</text>
<text x="580" y="295" class="small" style="fill:var(--muted)">en una parte de casos</text>
<text x="416" y="350" class="h">Control</text>
<text x="416" y="374" class="small">Análisis y ecografía periódicos; antivirales</text>
<text x="416" y="392" class="small">que frenan el virus cuando están indicados.</text>
<text x="416" y="418" class="small" style="fill:var(--muted)">Muchas personas no tienen síntomas.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
