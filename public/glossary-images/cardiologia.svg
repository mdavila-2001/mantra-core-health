<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cardiología</title>
  <desc id="d">En el centro, un corazón con sus grandes vasos y las arterias coronarias. A su alrededor, cuatro recuadros: qué trata la cardiología (infarto, insuficiencia cardíaca, arritmias, válvulas, hipertensión), pruebas que usa (electrocardiograma, ecocardiograma, prueba de esfuerzo, Holter, cateterismo), tratamientos y prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Cardiología: el corazón y los vasos</text>
  <path d="M400 330 C330 280 290 240 300 190 C310 145 370 140 400 185 C430 140 490 145 500 190 C510 240 470 280 400 330 Z" fill="var(--vessel)" opacity=".8"/>
  <path d="M380 165 C378 120 390 100 420 96 M425 175 C430 130 450 115 470 118" fill="none" stroke="var(--vessel)" stroke-width="12" stroke-linecap="round"/>
  <path d="M330 220 C360 240 380 260 390 300" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <text x="400" y="360" text-anchor="middle" class="small muted">Arterias coronarias en amarillo</text>
  <rect x="40" y="80" width="200" height="180" rx="12" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="140" y="106" text-anchor="middle" class="step">Qué trata</text>
  <text x="56" y="134" class="small">• Infarto y angina</text>
  <text x="56" y="158" class="small">• Insuficiencia cardíaca</text>
  <text x="56" y="182" class="small">• Arritmias</text>
  <text x="56" y="206" class="small">• Válvulas</text>
  <text x="56" y="230" class="small">• Hipertensión</text>
  <rect x="560" y="80" width="200" height="180" rx="12" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="660" y="106" text-anchor="middle" class="step">Pruebas</text>
  <text x="576" y="134" class="small">• Electrocardiograma</text>
  <text x="576" y="158" class="small">• Ecocardiograma</text>
  <text x="576" y="182" class="small">• Prueba de esfuerzo</text>
  <text x="576" y="206" class="small">• Holter</text>
  <text x="576" y="230" class="small">• Cateterismo</text>
  <rect x="40" y="290" width="200" height="140" rx="12" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="140" y="316" text-anchor="middle" class="step">Tratamientos</text>
  <text x="56" y="344" class="small">• Medicamentos</text>
  <text x="56" y="368" class="small">• Stent coronario</text>
  <text x="56" y="392" class="small">• Marcapasos</text>
  <rect x="560" y="290" width="200" height="140" rx="12" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="660" y="316" text-anchor="middle" class="step">Prevención</text>
  <text x="576" y="344" class="small">• Tensión y colesterol</text>
  <text x="576" y="368" class="small">• No fumar</text>
  <text x="576" y="392" class="small">• Actividad física</text>
  <path d="M300 200 L246 180" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M500 200 L554 180" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M330 280 L246 330" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M470 280 L554 330" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="410" text-anchor="middle" class="small">Si hace falta operar, colabora</text>
  <text x="400" y="428" text-anchor="middle" class="small">con la cirugía cardíaca</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
