  <text x="630" y="84" text-anchor="middle" class="step">Prueba de Adams</text>
  <text x="630" y="104" text-anchor="middle" class="small">al inclinarse aparece una giba</text>
  <text x="568" y="198" text-anchor="middle" class="small" style="fill:var(--bad)">Giba</text>
  <text x="500" y="290" class="small">• Un omóplato sobresale</text>
  <text x="500" y="314" class="small">• Cintura asimétrica</text>
  <text x="500" y="338" class="small">• Radiografía: mide el ángulo</text>
  <text x="500" y="362" class="small">• Control en el crecimiento</text>
  <text x="630" y="404" text-anchor="middle" class="small muted">Tratamiento según la curva:</text>
  <text x="630" y="422" text-anchor="middle" class="small muted">vigilancia, corsé o cirugía</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
