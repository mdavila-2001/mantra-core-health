  <text x="330" y="420" text-anchor="middle" class="step">Escoliosis</text>
  <text x="330" y="70" text-anchor="middle" class="small">Hombros desnivelados</text>
  <text x="388" y="374" text-anchor="end" class="small">Cadera</text>
