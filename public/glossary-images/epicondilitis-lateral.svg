<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Epicondilitis lateral</title>
  <desc id="d">A la izquierda, un codo de perfil con el húmero, el antebrazo y el epicóndilo lateral, donde se insertan los tendones extensores dañados por sobrecarga. A la derecha, causas, síntomas y tratamiento.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Codo visto de lado</text>
  <path d="M40 120 L230 150 C260 150 270 170 266 196 L250 210 L60 190 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" class="small" style="fill:var(--muted)">Húmero</text>
  <path d="M248 196 L380 380 L360 394 L226 214 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="330" y="400" text-anchor="end" class="small" style="fill:var(--muted)">Antebrazo</text>
  <circle cx="262" cy="176" r="14" fill="var(--warn)" stroke="none" stroke-width="2" opacity=".9"/>
  <path d="M262 176 C280 220 310 270 340 330" fill="none" stroke="var(--organ-d)" stroke-width="10" opacity=".7" stroke-linecap="round"/>
  <path d="M270 196 C286 230 300 250 316 280" fill="none" stroke="var(--vessel)" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="262" y="112" text-anchor="middle" class="small" style="fill:var(--warn)">Epicóndilo lateral</text>
  <line x1="262" y1="118" x2="262" y2="160" stroke="var(--warn)" stroke-width="1"/>
  <text x="150" y="280" text-anchor="middle" class="small" style="fill:var(--organ-d)">Tendón de los</text>
  <text x="150" y="296" text-anchor="middle" class="small" style="fill:var(--organ-d)">extensores</text>
  <line x1="190" y1="284" x2="288" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="150" y="330" text-anchor="middle" class="small" style="fill:var(--vessel)">Microlesiones</text>
  <text x="150" y="346" text-anchor="middle" class="small" style="fill:var(--vessel)">por sobrecarga</text>
  <text x="220" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">También llamada codo de tenista</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Qué la causa y qué ayuda</text>
  <text x="456" y="80" class="small">• Agarrar, girar o levantar a repetición</text>
  <text x="456" y="104" class="small">• Raqueta, herramientas o ratón</text>
  <text x="456" y="128" class="small">• Más frecuente entre 35 y 55 años</text>
  <text x="456" y="172" class="step">Síntomas</text>
  <text x="464" y="196" class="small">• Dolor en la cara externa del codo</text>
  <text x="464" y="218" class="small">• Empeora al agarrar o estrechar la mano</text>
  <text x="464" y="240" class="small">• Pérdida de fuerza de agarre</text>
  <rect x="456" y="280" width="304" height="142" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="306" class="step">Tratamiento</text>
  <text x="480" y="330" class="small">• Reducir la actividad que duele</text>
  <text x="480" y="348" class="small">• Ejercicios de fisioterapia</text>
  <text x="480" y="366" class="small">• Hielo y analgésicos</text>
  <text x="480" y="384" class="small">• Cincha en el antebrazo</text>
  <text x="480" y="402" class="small">• Suele mejorar en meses</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
