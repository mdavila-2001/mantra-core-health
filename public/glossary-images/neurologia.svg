<text x="40" y="166" class="lab">espinal</text>
<line x1="96" y1="156" x2="194" y2="170" stroke="var(--muted)" stroke-width="1.5"/>
<text x="318" y="226" class="lab">Nervios</text>
<line x1="316" y1="222" x2="284" y2="232" stroke="var(--muted)" stroke-width="1.5"/>
<text x="300" y="350" class="lab">Músculos</text>
<line x1="298" y1="346" x2="272" y2="330" stroke="var(--muted)" stroke-width="1.5"/>
<rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="598.0" y="50" text-anchor="middle" class="title">Enfermedades frecuentes</text>
<rect x="436" y="58" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="514.0" y="79.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Ictus</text>
<rect x="602" y="58" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="680.0" y="79.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Epilepsia</text>
<rect x="436" y="102" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="514.0" y="123.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Migraña</text>
<rect x="602" y="102" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="680.0" y="123.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Párkinson</text>
<rect x="436" y="146" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="514.0" y="167.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Demencias</text>
<rect x="602" y="146" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="680.0" y="167.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Esclerosis múltiple</text>
<rect x="436" y="190" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="514.0" y="211.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Neuropatías</text>
<rect x="602" y="190" width="156" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="680.0" y="211.6" text-anchor="middle" class="lab" style="fill:var(--ink)">ELA y miopatías</text>
<rect x="436" y="250" width="324" height="122" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="448" y="272" class="step">Herramientas</text>
<text x="448" y="296" class="lab">• Exploración neurológica</text>
<text x="448" y="318" class="lab">• Resonancia o TAC</text>
<text x="448" y="340" class="lab">• Electroencefalograma (EEG)</text>
<text x="448" y="362" class="lab">• Electromiograma (EMG)</text>
<text x="436" y="416" class="small" style="fill:var(--muted)">Si requiere cirugía: neurocirugía.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
