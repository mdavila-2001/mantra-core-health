<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Onicomicosis: hongos en las uñas</title>
  <desc id="d">A la izquierda, la punta de un dedo con una uña sana y otra con hongos, amarillenta, engrosada y despegada desde el borde libre. A la derecha, los factores que la favorecen, la confirmación con una muestra de uña y las opciones de tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Uña sana y uña con hongos</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Factores y tratamiento</text>
<path d="M70 340 L70 140 C70 90 170 90 170 140 L170 340 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M84 220 L84 140 C84 106 156 106 156 140 L156 220 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="120" y="370" text-anchor="middle" class="step" style="fill:var(--ok)">Sana</text>
<path d="M230 340 L230 140 C230 90 330 90 330 140 L330 340 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M244 220 L244 140 C244 106 316 106 316 140 L316 220 Z" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M250 130 C270 150 290 128 310 140 L312 160 C290 170 270 150 248 166 Z" fill="var(--yellow)" stroke="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>
<line x1="260" y1="190" x2="270" y2="198" stroke="var(--warn)" stroke-width="2"/>
<line x1="290" y1="180" x2="300" y2="188" stroke="var(--warn)" stroke-width="2"/>
<line x1="274" y1="204" x2="284" y2="212" stroke="var(--warn)" stroke-width="2"/>
<text x="280" y="370" text-anchor="middle" class="step" style="fill:var(--warn)">Con hongos</text>
<text x="200" y="400" text-anchor="middle" class="small">Uña engrosada, amarilla, frágil y que se</text>
<text x="200" y="416" text-anchor="middle" class="small">despega; suele empezar por el borde libre.</text>
<text x="416" y="76" class="h">Más frecuente con</text>
<text x="416" y="102" class="lab">• Pies húmedos y calzado cerrado</text>
<text x="416" y="126" class="lab">• Duchas y piscinas comunes</text>
<text x="416" y="150" class="lab">• Edad avanzada, diabetes</text>
<text x="416" y="174" class="lab">• Pie de atleta previo</text>
<text x="416" y="214" class="h">Diagnóstico</text>
<text x="416" y="238" class="lab">Se confirma con una muestra de uña</text>
<text x="416" y="256" class="lab">analizada en el laboratorio.</text>
<text x="416" y="296" class="h">Tratamiento</text>
<text x="416" y="322" class="lab">• Lacas o soluciones antifúngicas</text>
<text x="416" y="346" class="lab">• Pastillas en casos extensos</text>
<text x="416" y="370" class="lab">• Paciencia: la uña tarda meses</text>
<text x="416" y="410" class="small" style="fill:var(--muted)">Secar bien los pies previene recaídas.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
