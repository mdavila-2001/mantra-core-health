<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">De la infección por tuberculosis a la enfermedad</title>
  <desc id="d">Diagrama de flujo. Una persona respira gotitas con el bacilo de la tuberculosis. La mayoría queda con infección latente, sin síntomas y sin contagiar. Entre el 5 y el 10 por ciento desarrolla la enfermedad, con tos prolongada, fiebre, sudores nocturnos y pérdida de peso, y puede contagiar. El tratamiento diario de cuatro a seis meses la cura; interrumpirlo favorece la resistencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --ok:#1f8a5b; --ok-l:#d7f0e4; --warn:#b7791f; --warn-l:#f7e4bf; --bad:#c0392b; --bad-l:#f6d5cf; --blue:#1f6fb2; --blue-l:#d6e6f5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --ok:#4cc38a; --ok-l:#1f4033; --warn:#e0b25a; --warn-l:#4a3b1f; --bad:#ef7467; --bad-l:#4a2a27; --blue:#6aa7e8; --blue-l:#1f3347; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Infección no es lo mismo que enfermedad</text>

  <rect x="50" y="170" width="170" height="96" rx="10" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/>
  <text x="135" y="200" text-anchor="middle" class="hd" style="fill:var(--blue)">Contagio</text>
  <text x="135" y="222" text-anchor="middle" class="lab">Se respiran gotitas</text>
  <text x="135" y="240" text-anchor="middle" class="lab">con el bacilo</text>

  <path d="M220 200 L 300 130" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M220 236 L 300 306" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="256" y="152" class="small muted" text-anchor="middle">La mayoría</text>
  <text x="262" y="322" class="small muted" text-anchor="middle">5 a 10 %</text>

  <rect x="305" y="86" width="200" height="104" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="405" y="114" text-anchor="middle" class="hd" style="fill:var(--ok)">Infección latente</text>
  <text x="405" y="136" text-anchor="middle" class="lab">Sin síntomas</text>
  <text x="405" y="154" text-anchor="middle" class="lab">No contagia</text>
  <text x="405" y="174" text-anchor="middle" class="small muted">Se puede dar tratamiento preventivo</text>

  <rect x="305" y="260" width="200" height="124" rx="10" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
  <text x="405" y="288" text-anchor="middle" class="hd" style="fill:var(--bad)">Enfermedad activa</text>
  <text x="405" y="310" text-anchor="middle" class="lab">Tos de semanas, fiebre,</text>
  <text x="405" y="328" text-anchor="middle" class="lab">sudores nocturnos,</text>
  <text x="405" y="346" text-anchor="middle" class="lab">pérdida de peso</text>
  <text x="405" y="370" text-anchor="middle" class="small muted">Puede contagiar</text>

  <path d="M505 322 L 570 322" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="575" y="260" width="180" height="124" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="665" y="288" text-anchor="middle" class="hd" style="fill:var(--warn)">Tratamiento</text>
  <text x="665" y="310" text-anchor="middle" class="lab">Antibióticos todos</text>
  <text x="665" y="328" text-anchor="middle" class="lab">los días, 4 a 6 meses</text>
  <text x="665" y="352" text-anchor="middle" class="small muted">No interrumpir: favorece</text>
  <text x="665" y="368" text-anchor="middle" class="small muted">la resistencia</text>
</svg>
