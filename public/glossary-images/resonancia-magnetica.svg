<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Resonancia magnética</title>
  <desc id="d">A la izquierda, un equipo de resonancia con el imán en forma de túnel, la camilla con el paciente y las ondas de radio, junto a lo que conviene saber y lo que hay que avisar antes, como marcapasos o metal. A la derecha, un corte esquemático del cerebro y las partes del cuerpo que mejor muestra.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="470" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="255.0" y="50" text-anchor="middle" class="title">El equipo</text>
  <rect x="160" y="70" width="200" height="220" rx="60" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="260" cy="180" r="62" fill="var(--panel)" stroke="var(--accent)" stroke-width="3"/>
  <rect x="40" y="220" width="420" height="22" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="80" y="240" width="360" height="14" rx="4" fill="var(--muted)"/>
  <circle cx="100" cy="206" r="14" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
  <rect x="114" y="198" width="210" height="20" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="260" y="108" text-anchor="middle" class="step">Imán potente</text>
  <text x="70" y="300" class="small">Camilla que entra en el túnel</text>
  <path d="M392 140 a12 12 0 0 1 0 40" fill="none" stroke="var(--purple)" stroke-width="2"/>
  <path d="M402 140 a22 22 0 0 1 0 40" fill="none" stroke="var(--purple)" stroke-width="2"/>
  <text x="420" y="200" text-anchor="middle" class="small" style="fill:var(--purple)">Ondas</text>
  <text x="420" y="216" text-anchor="middle" class="small" style="fill:var(--purple)">de radio</text>
  <text x="44" y="336" class="small">• Sin radiación ionizante</text>
  <text x="44" y="360" class="small">• Ruidoso: se usan tapones</text>
  <text x="44" y="384" class="small">• Hay que estar quieto</text>
  <text x="44" y="408" class="small">• A veces con contraste</text>
  <rect x="250" y="330" width="222" height="96" rx="10" fill="var(--warn-l)"/>
  <text x="266" y="352" class="step" style="fill:var(--warn)">Avisar antes si lleva</text>
  <text x="270" y="376" class="small">• Marcapasos o implantes</text>
  <text x="270" y="394" class="small">• Metal en el cuerpo</text>
  <text x="270" y="412" class="small">• Claustrofobia o embarazo</text>
  <rect x="506" y="20" width="274" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="643.0" y="50" text-anchor="middle" class="title">Lo que muestra</text>
  <rect x="526" y="66" width="234" height="150" rx="10" fill="var(--ink)" opacity=".9"/>
  <ellipse cx="643" cy="141" rx="70" ry="60" fill="var(--muted)"/>
  <ellipse cx="643" cy="141" rx="58" ry="48" fill="var(--bone)" opacity=".8"/>
  <path d="M600 140 q20 -20 40 0 q20 20 40 0" fill="none" stroke="var(--muted)" stroke-width="3"/>
  <text x="643" y="236" text-anchor="middle" class="small muted">Corte del cerebro</text>
  <text x="526" y="272" class="lab">• Cerebro y médula</text>
  <text x="526" y="296" class="lab">• Articulaciones</text>
  <text x="526" y="320" class="lab">• Músculos y ligamentos</text>
  <text x="526" y="344" class="lab">• Órganos del abdomen</text>
  <text x="643" y="410" text-anchor="middle" class="small muted">Gran detalle en tejidos blandos</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
