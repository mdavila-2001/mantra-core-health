<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Serología de dengue IgG e IgM</title>
  <desc id="d">Gráfica temporal desde el inicio de la fiebre: primero se detectan el virus y la proteína NS1, luego sube la IgM, que indica infección reciente, y después la IgG, que persiste. Abajo, la muestra de sangre y claves de interpretación.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Qué anticuerpo aparece y cuándo</text>
  <line x1="70" y1="230" x2="740" y2="230" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="70" y1="230" x2="70" y2="70" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="76" y="76" class="small" style="fill:var(--muted)">Nivel</text>
  <line x1="110" y1="230" x2="110" y2="236" stroke="var(--ink)" stroke-width="1"/>
  <text x="110" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">Inicio</text>
  <line x1="300" y1="230" x2="300" y2="236" stroke="var(--ink)" stroke-width="1"/>
  <text x="300" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">1.ª semana</text>
  <line x1="500" y1="230" x2="500" y2="236" stroke="var(--ink)" stroke-width="1"/>
  <text x="500" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">2.ª semana</text>
  <line x1="700" y1="230" x2="700" y2="236" stroke="var(--ink)" stroke-width="1"/>
  <text x="700" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">Semanas después</text>
  <path d="M80 220 C110 100 180 90 230 200 C250 220 260 222 300 222" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <path d="M150 220 C220 210 260 80 340 80 C420 82 480 170 640 200 L740 206" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M260 220 C330 200 400 110 480 104 C580 98 660 100 740 100" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="160" y="92" text-anchor="middle" class="lab" style="fill:var(--ok)">NS1 y virus</text>
  <text x="340" y="72" text-anchor="middle" class="lab" style="fill:var(--warn)">IgM: infección reciente</text>
  <text x="610" y="92" text-anchor="middle" class="lab" style="fill:var(--accent)">IgG: infección pasada o actual</text>
  <rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">La muestra</text>
  <rect x="50" y="324" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M53 338 V394 a12 12 0 0 0 24 0 V338" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M55 364 V394 a10 10 0 0 0 20 0 V364 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="110" y="350" class="lab">Análisis de sangre (serología)</text>
  <text x="110" y="372" class="lab">Detecta anticuerpos contra</text>
  <text x="110" y="394" class="lab">el virus del dengue</text>
  <rect x="410" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="316" text-anchor="middle" class="title">Cómo se interpreta</text>
  <text x="430" y="346" class="small">• IgM positiva: infección reciente</text>
  <text x="430" y="368" class="small">• IgG sola: contacto previo</text>
  <text x="430" y="390" class="small">• IgG muy alta temprana: reinfección</text>
  <text x="430" y="412" class="small">• Al inicio puede salir negativa</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
