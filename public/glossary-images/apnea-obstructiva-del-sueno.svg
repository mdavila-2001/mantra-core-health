<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Apnea obstructiva del sueño</title>
  <desc id="d">A la izquierda, dos cortes de la garganta: despierto el aire pasa libre y durante una apnea la lengua y los tejidos blandos colapsan y cierran la vía aérea. A la derecha, señales nocturnas y diurnas, consecuencias si no se trata y opciones de tratamiento como la CPAP.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Vía aérea durante el sueño</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Señales y consecuencias</text>
<text x="110" y="76" text-anchor="middle" class="step" style="fill:var(--ok)">Despierto</text>
<text x="290" y="76" text-anchor="middle" class="step" style="fill:var(--bad)">Durante una apnea</text>
<rect x="40" y="90" width="150" height="220" rx="10" fill="var(--tissue)"/>
<rect x="210" y="90" width="150" height="220" rx="10" fill="var(--tissue)"/>
<rect x="144" y="100" width="36" height="200" rx="6" fill="var(--skin)" stroke="var(--line)"/>
<ellipse cx="86" cy="210" rx="38" ry="56" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<text x="86" y="214" text-anchor="middle" class="small">Lengua</text>
<path d="M54 118 C90 112 120 118 132 150" fill="none" stroke="var(--organ)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="134" y1="112" x2="134" y2="290" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="314" y="100" width="36" height="200" rx="6" fill="var(--skin)" stroke="var(--line)"/>
<ellipse cx="276" cy="210" rx="38" ry="56" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<text x="276" y="214" text-anchor="middle" class="small">Lengua</text>
<path d="M224 118 C260 112 290 118 302 168" fill="none" stroke="var(--organ)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M302 196 l12 12 M314 196 l-12 12" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="115" y="332" text-anchor="middle" class="small" style="fill:var(--muted)">Aire pasa libre</text>
<text x="285" y="332" text-anchor="middle" class="small" style="fill:var(--muted)">Garganta colapsada</text>
<text x="200" y="372" text-anchor="middle" class="lab">Pausas repetidas de la respiración:</text>
<text x="200" y="392" text-anchor="middle" class="lab">baja el oxígeno y el cerebro despierta</text>
<text x="200" y="412" text-anchor="middle" class="lab">a medias para reabrir la vía.</text>
<text x="416" y="76" class="h">Por la noche</text>
<text x="416" y="102" class="lab">• Ronquido fuerte</text>
<text x="416" y="126" class="lab">• Pausas que otros observan</text>
<text x="416" y="150" class="lab">• Despertares con ahogo</text>
<text x="416" y="186" class="h">De día</text>
<text x="416" y="212" class="lab">• Somnolencia y cansancio</text>
<text x="416" y="236" class="lab">• Cefalea matinal</text>
<text x="416" y="260" class="lab">• Falta de concentración</text>
<text x="416" y="296" class="h" style="fill:var(--bad)">Si no se trata</text>
<text x="416" y="322" class="lab">• Hipertensión</text>
<text x="416" y="346" class="lab">• Arritmias</text>
<text x="416" y="370" class="lab">• Accidentes</text>
<rect x="606" y="292" width="154" height="104" rx="10" fill="var(--accent-l)"/>
<text x="683" y="318" text-anchor="middle" class="step">Tratamiento</text>
<text x="683" y="342" text-anchor="middle" class="small">CPAP, bajar de peso,</text>
<text x="683" y="360" text-anchor="middle" class="small">dispositivo bucal</text>
<text x="683" y="378" text-anchor="middle" class="small">o cirugía</text>
<text x="416" y="424" class="small" style="fill:var(--muted)">Se diagnostica con un estudio del sueño.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
