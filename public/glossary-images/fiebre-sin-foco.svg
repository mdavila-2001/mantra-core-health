<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Fiebre sin foco</title>
  <desc id="d">Diagrama de decisión: una fiebre sin causa evidente tras la historia y la exploración lleva a valorar la edad, el aspecto, las vacunas y el riesgo. Si el niño tiene buen aspecto y bajo riesgo, suele ser un virus leve que se vigila; si es un lactante pequeño o tiene mal aspecto, se buscan infecciones bacterianas con pruebas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Fiebre sin foco: el razonamiento</text>
  <rect x="270" y="70" width="260" height="60" rx="12" fill="var(--warn)"/>
  <text x="400" y="96" text-anchor="middle" class="big" style="fill:var(--on)">Fiebre</text>
  <text x="400" y="118" text-anchor="middle" class="small" style="fill:var(--on)">sin causa tras historia y examen</text>
  <line x1="400" y1="132" x2="400" y2="160" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="250" y="162" width="300" height="46" rx="10" fill="var(--accent-l)"/>
  <text x="400" y="190" text-anchor="middle" class="lab">¿Edad, aspecto, vacunas y riesgo?</text>
  <line x1="330" y1="210" x2="200" y2="246" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="470" y1="210" x2="600" y2="246" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="50" y="250" width="320" height="150" rx="12" fill="var(--ok-l)"/>
  <text x="210" y="278" text-anchor="middle" class="step" style="fill:var(--ok)">Buen aspecto, bajo riesgo</text>
  <text x="70" y="306" class="lab">• Casi siempre un virus leve</text>
  <text x="70" y="328" class="lab">• Vigilar y controlar la fiebre</text>
  <text x="70" y="350" class="lab">• Pruebas solo si se indican</text>
  <text x="70" y="372" class="lab">• Revisar si no mejora</text>
  <rect x="430" y="250" width="320" height="150" rx="12" fill="var(--warn-l)"/>
  <text x="590" y="278" text-anchor="middle" class="step" style="fill:var(--warn)">Lactante pequeño o mal aspecto</text>
  <text x="450" y="306" class="lab">• Buscar infección bacteriana</text>
  <text x="450" y="328" class="lab">• Orina, sangre y otras pruebas</text>
  <text x="450" y="350" class="lab">• A veces ingreso y antibiótico</text>
  <text x="450" y="372" class="lab">• Decaído, piel moteada: urgente</text>
  <text x="400" y="428" text-anchor="middle" class="small muted">La edad del niño cambia mucho el riesgo: los menores de 3 meses se valoran siempre</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
