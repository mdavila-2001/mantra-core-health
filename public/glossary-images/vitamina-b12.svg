<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Vitamina B12</title>
  <desc id="d">A la izquierda, el recorrido de la vitamina B12: llega con los alimentos de origen animal, en el estómago se une al factor intrínseco y se absorbe en el íleon, el tramo final del intestino delgado, para pasar a la sangre; sirve para fabricar glóbulos rojos, proteger los nervios y formar ADN. A la derecha, las causas del déficit y sus síntomas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="500" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270.0" y="50" text-anchor="middle" class="title">Cómo se absorbe la vitamina B12</text>
  <rect x="40" y="64" width="130" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="105" y="88" text-anchor="middle" class="step">Alimentos</text>
  <text x="105" y="106" text-anchor="middle" class="small">de origen animal</text>
  <path d="M172 92 L214 92" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M220 70 C300 50 360 80 350 130 C340 180 280 190 240 170 C210 150 210 100 220 70 Z" fill="var(--organ)" opacity=".7"/>
  <text x="285" y="112" text-anchor="middle" class="step">Estómago</text>
  <text x="285" y="210" text-anchor="middle" class="small">Se une al factor intrínseco</text>
  <path d="M300 186 C320 220 340 250 340 290 C340 330 280 340 240 330 C200 320 180 360 220 390 C260 410 340 400 380 380" fill="none" stroke="var(--organ)" stroke-width="22" stroke-linecap="round" opacity=".55"/>
  <circle cx="380" cy="380" r="16" fill="var(--purple)" opacity=".7"/>
  <circle cx="380" cy="380" r="3" fill="var(--ink)"/>
  <path d="M380 380 L420 330" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="424" y="334" class="lab">Íleon</text>
  <path d="M396 380 L470 380" stroke="var(--vessel)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="452" y="410" text-anchor="middle" class="small">A la sangre</text>
  <text x="60" y="250" class="step">Sirve para</text>
  <text x="60" y="274" class="small">• Fabricar glóbulos rojos</text>
  <text x="60" y="296" class="small">• Proteger los nervios</text>
  <text x="60" y="318" class="small">• Formar ADN</text>
  <rect x="540" y="20" width="240" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="660.0" y="50" text-anchor="middle" class="title">Déficit</text>
  <text x="560" y="74" class="step">Causas</text>
  <text x="560" y="98" class="small">• Dieta vegana sin</text>
  <text x="560" y="120" class="small">• suplementos</text>
  <text x="560" y="142" class="small">• Anemia perniciosa</text>
  <text x="560" y="164" class="small">• Cirugía de estómago</text>
  <text x="560" y="186" class="small">• Algunos fármacos</text>
  <text x="560" y="208" class="small">• Edad avanzada</text>
  <text x="560" y="256" class="step">Síntomas</text>
  <rect x="560" y="270" width="200" height="34" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="660.0" y="292.0" text-anchor="middle" class="small">Cansancio, palidez</text>
  <rect x="560" y="312" width="200" height="34" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="660.0" y="334.0" text-anchor="middle" class="small">Hormigueo en pies</text>
  <rect x="560" y="354" width="200" height="34" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="660.0" y="376.0" text-anchor="middle" class="small">Memoria, ánimo</text>
  <rect x="560" y="396" width="200" height="34" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="660.0" y="418.0" text-anchor="middle" class="small">Lengua lisa y roja</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
