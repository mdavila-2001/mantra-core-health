<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Resonancia de columna lumbar</title>
  <desc id="d">A la izquierda, el equipo de resonancia con su túnel y la camilla, y una imagen de corte lateral de la columna lumbar con vértebras, discos, un disco alterado y los nervios. A la derecha, cuándo se indica, qué avisar antes y cómo es la prueba.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">El equipo y la imagen</text>
  <rect x="60" y="70" width="160" height="160" rx="30" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="140" cy="150" r="46" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="40" y="176" width="210" height="16" rx="4" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <ellipse cx="150" cy="168" rx="50" ry="10" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
  <text x="140" y="256" text-anchor="middle" class="small">Imán con túnel</text>
  <rect x="270" y="70" width="150" height="300" rx="8" fill="var(--ink)" stroke="none" stroke-width="2" opacity=".92"/>
  <rect x="300" y="90" width="60" height="38" rx="6" fill="var(--bone)" stroke="none" stroke-width="2"/>
  <rect x="302" y="128" width="56" height="14" rx="4" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="300" y="144" width="60" height="38" rx="6" fill="var(--bone)" stroke="none" stroke-width="2"/>
  <rect x="302" y="182" width="56" height="14" rx="4" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="300" y="198" width="60" height="38" rx="6" fill="var(--bone)" stroke="none" stroke-width="2"/>
  <rect x="302" y="236" width="56" height="14" rx="4" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="300" y="252" width="60" height="38" rx="6" fill="var(--bone)" stroke="none" stroke-width="2"/>
  <rect x="302" y="290" width="56" height="14" rx="4" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <rect x="300" y="306" width="60" height="38" rx="6" fill="var(--bone)" stroke="none" stroke-width="2"/>
  <rect x="302" y="344" width="56" height="14" rx="4" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <path d="M368 80 C372 200 372 280 368 360" fill="none" stroke="var(--nerve)" stroke-width="6"/>
  <path d="M358 262 C370 264 372 278 360 280 Z" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="345" y="390" text-anchor="middle" class="small" style="fill:var(--muted)">Corte lateral</text>
  <text x="262" y="246" text-anchor="end" class="small" style="fill:var(--muted)">Vértebra</text>
  <text x="262" y="300" text-anchor="end" class="small" style="fill:var(--violet)">Disco</text>
  <text x="140" y="300" text-anchor="middle" class="lab">Sin radiación:</text>
  <text x="140" y="318" text-anchor="middle" class="small">usa imán y ondas</text>
  <text x="140" y="336" text-anchor="middle" class="small">de radio</text>
  <text x="230" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Muestra discos, nervios y médula</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Antes y durante</text>
  <text x="476" y="74" class="step">Se indica si hay</text>
  <text x="484" y="98" class="small">• Ciática que no mejora</text>
  <text x="484" y="120" class="small">• Debilidad o signos de alarma</text>
  <text x="484" y="142" class="small">• Sospecha de infección o tumor</text>
  <text x="484" y="164" class="small">• Planificar una cirugía</text>
  <rect x="476" y="200" width="284" height="104" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="492" y="226" class="step" style="fill:var(--warn)">Avisar antes si tiene</text>
  <text x="500" y="250" class="small">• Marcapasos o implantes</text>
  <text x="500" y="268" class="small">• Metal en el cuerpo</text>
  <text x="500" y="286" class="small">• Claustrofobia o embarazo</text>
  <text x="476" y="336" class="small">• Dura unos 20 a 40 minutos</text>
  <text x="476" y="358" class="small">• Ruido fuerte: dan tapones</text>
  <text x="476" y="380" class="small">• Hay que quedarse quieto</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
