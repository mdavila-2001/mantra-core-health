<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Transmisión del dengue y señales de alarma</title>
  <desc id="d">A la izquierda, el ciclo de transmisión: un mosquito Aedes pica a una persona con el virus y luego contagia a una persona sana, con medidas de prevención. A la derecha, las fases febril, crítica y de recuperación, y las señales de alarma que requieren acudir a urgencias.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Dengue: transmisión y señales de alarma</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="90" text-anchor="middle" class="title">Ciclo de transmisión</text>
  <ellipse cx="210" cy="130" rx="22" ry="7" fill="var(--ink)" stroke="none"/>
  <circle cx="186" cy="130" r="6" fill="var(--ink)" stroke="none"/>
  <ellipse cx="208" cy="116" rx="14" ry="6" fill="var(--accent-l)" stroke="var(--muted)" transform="rotate(-25 208 116)"/>
  <path d="M200 135 l-6 16 M200 135 l6 16" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <path d="M210 135 l-6 16 M210 135 l6 16" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <path d="M220 135 l-6 16 M220 135 l6 16" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <line x1="204" y1="128" x2="208" y2="132" stroke="var(--panel)" stroke-width="2"/>
  <line x1="216" y1="128" x2="220" y2="132" stroke="var(--panel)" stroke-width="2"/>
  <line x1="228" y1="128" x2="232" y2="132" stroke="var(--panel)" stroke-width="2"/>
  <text x="210" y="172" text-anchor="middle" class="small b">Mosquito Aedes</text>
  <rect x="40" y="220" width="140" height="60" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="110.0" y="247.0" text-anchor="middle" class="lab b">Persona</text>
  <text x="110.0" y="264.0" text-anchor="middle" class="small muted">con el virus</text>
  <rect x="240" y="220" width="140" height="60" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="310.0" y="247.0" text-anchor="middle" class="lab b">Persona</text>
  <text x="310.0" y="264.0" text-anchor="middle" class="small muted">sana</text>
  <path d="M110 216 C110 160 150 135 176 132" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M246 132 C280 135 310 160 310 214" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="84" y="150" class="small">Pica</text>
  <text x="320" y="160" class="small">Pica y</text>
  <text x="320" y="176" class="small">contagia</text>
  <text x="210" y="316" text-anchor="middle" class="small">No pasa directo de persona a persona</text>
  <text x="40" y="360" class="lab b">Prevención</text>
  <text x="40" y="384" class="small">• Eliminar agua estancada</text>
  <text x="40" y="406" class="small">• Repelente, mosquiteros y ropa larga</text>
  <rect x="416" y="60" width="364" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="90" text-anchor="middle" class="title">Fases de la enfermedad</text>
  <rect x="430" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="483.0" y="133.0" text-anchor="middle" class="lab b">Febril</text>
  <text x="483.0" y="150.0" text-anchor="middle" class="small muted">fiebre alta</text>
  <line x1="538" y1="136.0" x2="546" y2="136.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="548" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="601.0" y="133.0" text-anchor="middle" class="lab b">Crítica</text>
  <text x="601.0" y="150.0" text-anchor="middle" class="small muted">al bajar fiebre</text>
  <line x1="656" y1="136.0" x2="664" y2="136.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="666" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="719.0" y="141.0" text-anchor="middle" class="lab">Recuperación</text>
  <text x="598" y="200" text-anchor="middle" class="small">El riesgo es mayor cuando cede la fiebre</text>
  <rect x="416" y="236" width="364" height="204" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="430" y="260" class="lab b" style="fill:var(--red)">Señales de alarma: urgencias</text>
  <text x="430" y="284" class="small">• Dolor abdominal intenso</text>
  <text x="430" y="306" class="small">• Vómitos persistentes</text>
  <text x="430" y="328" class="small">• Sangrado de encías o nariz</text>
  <text x="430" y="350" class="small">• Somnolencia o irritabilidad</text>
  <text x="430" y="372" class="small">• Manos frías, poca orina</text>
  <text x="430" y="394" class="small">• Dificultad para respirar</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
