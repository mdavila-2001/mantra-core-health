<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Perinatología (medicina materno-fetal)</title>
  <desc id="d">Arriba, una línea de tiempo con el periodo que abarca la perinatología: antes del embarazo, los tres trimestres, el parto y las primeras semanas después. Abajo a la izquierda, embarazos de mayor riesgo, como los de mujeres con diabetes o hipertensión, la preeclampsia, el embarazo múltiple o las alteraciones del feto. Abajo a la derecha, herramientas como la ecografía detallada, el Doppler y la monitorización.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="180" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">El periodo que abarca</text>
  <rect x="36" y="66" width="136" height="110" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="104" y="96" text-anchor="middle" class="step">Antes</text>
  <text x="104" y="126" text-anchor="middle" class="small">Planificar si hay</text>
  <text x="104" y="144" text-anchor="middle" class="small">enfermedad previa</text>
  <path d="M173 121 L183 121" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="184" y="66" width="136" height="110" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="252" y="96" text-anchor="middle" class="step">1.er trimestre</text>
  <text x="252" y="126" text-anchor="middle" class="small">Cribado y</text>
  <text x="252" y="144" text-anchor="middle" class="small">ecografía</text>
  <path d="M321 121 L331 121" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="332" y="66" width="136" height="110" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="400" y="96" text-anchor="middle" class="step">2.º trimestre</text>
  <text x="400" y="126" text-anchor="middle" class="small">Ecografía</text>
  <text x="400" y="144" text-anchor="middle" class="small">morfológica</text>
  <path d="M469 121 L479 121" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="480" y="66" width="136" height="110" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="548" y="96" text-anchor="middle" class="step">3.er trimestre</text>
  <text x="548" y="126" text-anchor="middle" class="small">Crecimiento y</text>
  <text x="548" y="144" text-anchor="middle" class="small">bienestar fetal</text>
  <path d="M617 121 L627 121" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="628" y="66" width="136" height="110" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="696" y="96" text-anchor="middle" class="step">Parto y después</text>
  <text x="696" y="126" text-anchor="middle" class="small">Primeras</text>
  <text x="696" y="144" text-anchor="middle" class="small">semanas</text>
  <rect x="20" y="214" width="370" height="236" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="244" text-anchor="middle" class="title">Embarazos de mayor riesgo</text>
  <rect x="40" y="252" width="330" height="30" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="205.0" y="272.0" text-anchor="middle" class="small">Diabetes o hipertensión materna</text>
  <rect x="40" y="290" width="330" height="30" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="205.0" y="310.0" text-anchor="middle" class="small">Preeclampsia</text>
  <rect x="40" y="328" width="330" height="30" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="205.0" y="348.0" text-anchor="middle" class="small">Embarazo múltiple</text>
  <rect x="40" y="366" width="330" height="30" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="205.0" y="386.0" text-anchor="middle" class="small">Alteraciones del feto</text>
  <rect x="40" y="404" width="330" height="30" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="205.0" y="424.0" text-anchor="middle" class="small">Parto prematuro previo</text>
  <rect x="410" y="214" width="370" height="236" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="244" text-anchor="middle" class="title">Herramientas</text>
  <path d="M440 330 Q520 260 600 330" fill="none" stroke="var(--accent)" stroke-width="4"/>
  <path d="M440 330 L520 400 L600 330" fill="var(--ink)" opacity=".8"/>
  <ellipse cx="520" cy="360" rx="18" ry="12" fill="var(--bone)"/>
  <text x="520" y="272" text-anchor="middle" class="small">Ecografía detallada</text>
  <text x="620" y="270" class="small">• Doppler</text>
  <text x="620" y="296" class="small">• Monitorización</text>
  <text x="620" y="322" class="small">• Pruebas del feto</text>
  <text x="620" y="348" class="small">• Plan de parto</text>
  <text x="595" y="436" text-anchor="middle" class="small muted">Trabaja con neonatología y obstetricia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
