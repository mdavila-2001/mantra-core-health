<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trasplante de pulmón</title>
  <desc id="d">A la izquierda, dos esquemas de pulmones: trasplante unipulmonar, en el que se cambia un solo pulmón, y bipulmonar, en el que se cambian los dos por pulmones donados. A la derecha, los pasos del proceso, desde la evaluación y la lista de espera hasta la inmunosupresión de por vida, y los signos de alarma.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Tipos de trasplante</text>
  <path d="M110 80 V120" fill="none" stroke="var(--muted)" stroke-width="8" stroke-linecap="round"/>
  <path d="M102 130 C70 110 40 160 40 210 C40 250 80 260 98 240 Z" fill="var(--muted)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M118 130 C150 110 180 160 180 210 C180 250 140 260 122 240 Z" fill="var(--ok)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M110 120 L96 134 M110 120 L124 134" fill="none" stroke="var(--muted)" stroke-width="6"/>
  <text x="110" y="290" text-anchor="middle" class="step">Unipulmonar</text>
  <path d="M290 80 V120" fill="none" stroke="var(--muted)" stroke-width="8" stroke-linecap="round"/>
  <path d="M282 130 C250 110 220 160 220 210 C220 250 260 260 278 240 Z" fill="var(--ok)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M298 130 C330 110 360 160 360 210 C360 250 320 260 302 240 Z" fill="var(--ok)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M290 120 L276 134 M290 120 L304 134" fill="none" stroke="var(--muted)" stroke-width="6"/>
  <text x="290" y="290" text-anchor="middle" class="step">Bipulmonar</text>
  <text x="110" y="310" text-anchor="middle" class="small muted">se cambia un pulmón</text>
  <text x="290" y="310" text-anchor="middle" class="small muted">se cambian los dos</text>
  <rect x="60" y="340" width="22" height="22" rx="8" fill="var(--ok)"/>
  <text x="71.0" y="355.68" text-anchor="middle" class="lab" style="fill:var(--on)"></text>
  <text x="92" y="356" class="small">Pulmón donado</text>
  <rect x="220" y="340" width="22" height="22" rx="8" fill="var(--muted)"/>
  <text x="231.0" y="355.68" text-anchor="middle" class="lab" style="fill:var(--on)"></text>
  <text x="252" y="356" class="small">Propio</text>
  <text x="200" y="404" text-anchor="middle" class="lab">Para enfermedad pulmonar grave</text>
  <text x="200" y="422" text-anchor="middle" class="small muted">que ya no responde a tratamientos</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">El camino</text>
  <circle cx="449" cy="80" r="13" fill="var(--accent)"/>
  <text x="449" y="85" text-anchor="middle" class="step" style="fill:var(--on)">1</text>
  <text x="470" y="85" class="lab">Evaluación y lista de espera</text>
  <circle cx="449" cy="126" r="13" fill="var(--accent)"/>
  <text x="449" y="131" text-anchor="middle" class="step" style="fill:var(--on)">2</text>
  <text x="470" y="131" class="lab">Cirugía con el pulmón donado</text>
  <circle cx="449" cy="172" r="13" fill="var(--accent)"/>
  <text x="449" y="177" text-anchor="middle" class="step" style="fill:var(--on)">3</text>
  <text x="470" y="177" class="lab">Ingreso y rehabilitación</text>
  <circle cx="449" cy="218" r="13" fill="var(--accent)"/>
  <text x="449" y="223" text-anchor="middle" class="step" style="fill:var(--on)">4</text>
  <text x="470" y="223" class="lab">Inmunosupresión de por vida</text>
  <rect x="436" y="276" width="324" height="144" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="300" class="step" style="fill:var(--warn)">Vigilar y avisar si hay</text>
  <text x="456" y="326" class="small">• Fiebre o tos nueva</text>
  <text x="456" y="348" class="small">• Más falta de aire</text>
  <text x="456" y="370" class="small">• Caída en la espirometría casera</text>
  <text x="456" y="392" class="small">• Signos de infección</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
