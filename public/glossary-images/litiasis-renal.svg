<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Litiasis renal (cálculos en el riñón)</title>
  <desc id="d">A la izquierda, el aparato urinario con los dos riñones, los uréteres y la vejiga; un cálculo formado en el riñón desciende por el uréter y produce un dolor que va del costado a la ingle. A la derecha, los síntomas, los signos de urgencia como la fiebre, las pruebas diagnósticas y la prevención bebiendo agua y tomando menos sal.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Recorrido del cálculo</text>
  <path d="M120 90 C80 100 80 200 120 210 C140 210 150 190 140 150 C150 110 140 90 120 90 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M340 90 C380 100 380 200 340 210 C320 210 310 190 320 150 C310 110 320 90 340 90 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M142 160 C170 220 200 290 214 350 M318 160 C290 220 260 290 246 350" fill="none" stroke="var(--beam)" stroke-width="7"/>
  <path d="M180 350 Q230 330 280 350 Q290 400 230 410 Q170 400 180 350 Z" fill="var(--beam)" opacity=".7" stroke="var(--line)"/>
  <path d="M180 248 l8 -10 l10 4 l2 12 l-10 6 l-10 -4 Z" fill="var(--ink)"/>
  <circle cx="122" cy="150" r="5" fill="var(--ink)"/><circle cx="130" cy="170" r="3" fill="var(--ink)"/>
  <text x="110" y="234" text-anchor="middle" class="small">Riñón</text>
  <text x="350" y="234" text-anchor="middle" class="small">Riñón</text>
  <circle cx="194" cy="248" r="3" fill="var(--ink)"/>
  <path d="M194 248 L252 250" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="256" y="254" class="lab">Cálculo en el uréter</text>
  <text x="230" y="430" text-anchor="middle" class="small">Vejiga</text>
  <text x="60" y="74" class="small muted">Se forma en el riñón</text>
  <path d="M60 270 C80 300 120 330 150 380" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="30" y="300" class="small">Dolor del</text>
  <text x="30" y="316" class="small">costado a</text>
  <text x="30" y="332" class="small">la ingle</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="500" y="62" class="step">Síntomas</text>
  <text x="500" y="88" class="small">• Cólico muy intenso</text>
  <text x="500" y="110" class="small">• Sangre en la orina</text>
  <text x="500" y="132" class="small">• Náuseas, inquietud</text>
  <rect x="500" y="160" width="260" height="56" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="630" y="184" text-anchor="middle" class="step">Urgencia si hay fiebre</text>
  <text x="630" y="202" text-anchor="middle" class="small">o no se puede orinar</text>
  <text x="500" y="246" class="step">Diagnóstico</text>
  <text x="500" y="272" class="small">• Ecografía o TAC</text>
  <text x="500" y="294" class="small">• Análisis de orina</text>
  <text x="500" y="332" class="step">Prevención</text>
  <text x="500" y="358" class="small">• Beber agua a diario</text>
  <text x="500" y="380" class="small">• Menos sal</text>
  <text x="500" y="402" class="small">• Analizar el cálculo</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
