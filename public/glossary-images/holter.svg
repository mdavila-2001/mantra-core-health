<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Holter: registro continuo del electrocardiograma</title>
  <desc id="d">A la izquierda, un torso con cinco electrodos adhesivos conectados a una pequeña grabadora que la persona lleva en casa durante uno o varios días. A la derecha, un trazado de electrocardiograma continuo, un diario de síntomas y los motivos por los que se pide.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">El equipo</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué registra</text>
<path d="M110.0 80 Q200 66 290.0 80 Q310.0 90 310.0 120 L300.0 380 L100.0 380 L90.0 120 Q90.0 90 110.0 80 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 76 Q200 110 250 76" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="150" y1="130" x2="200" y2="360" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="250" y1="130" x2="200" y2="360" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="170" y1="210" x2="200" y2="360" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="230" y1="210" x2="200" y2="360" stroke="var(--accent)" stroke-width="1.5"/>
<line x1="200" y1="300" x2="200" y2="360" stroke="var(--accent)" stroke-width="1.5"/>
<circle cx="150" cy="130" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="250" cy="130" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="170" cy="210" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="230" cy="210" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="200" cy="300" r="10" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
<rect x="160" y="340" width="80" height="50" rx="8" fill="var(--accent)"/>
<text x="200" y="370" text-anchor="middle" class="small" style="fill:var(--on)">Grabadora</text>
<text x="40" y="124" class="lab">Electrodos</text>
<text x="40" y="140" class="lab">adhesivos</text>
<text x="200" y="418" text-anchor="middle" class="small" style="fill:var(--muted)">Se lleva puesto en casa, de 24 h a varios días</text>
<text x="416" y="76" class="h">Registro continuo del ritmo</text>
<path d="M416 140 H432 L436 132 L440 140 H446 L450 104 L454 156 L458 140 H466 Q470 130 474 140 H490 L494 132 L498 140 H504 L508 104 L512 156 L516 140 H524 Q528 130 532 140 H548 L552 132 L556 140 H562 L566 104 L570 156 L574 140 H582 Q586 130 590 140 H606 L610 132 L614 140 H620 L624 104 L628 156 L632 140 H640 Q644 130 648 140 H664 L668 132 L672 140 H678 L682 104 L686 156 L690 140 H698 Q702 130 706 140 H722 L726 132 L730 140 H736 L740 104 L744 156 L748 140 H756 Q760 130 764 140" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="416" y="186" class="lab">Se compara con lo que la persona anota</text>
<text x="416" y="204" class="lab">en un diario de síntomas y actividades.</text>
<rect x="416" y="222" width="344" height="50" rx="8" fill="var(--tissue)" stroke="var(--line)"/>
<text x="430" y="244" class="small">Diario: 15:20 palpitaciones al subir</text>
<text x="430" y="262" class="small">escaleras · 23:00 me acuesto</text>
<text x="416" y="306" class="h">Se pide por</text>
<text x="416" y="332" class="lab">• Palpitaciones</text>
<text x="416" y="356" class="lab">• Mareos o desmayos</text>
<text x="416" y="380" class="lab">• Pausas o arritmias</text>
<text x="427" y="404" class="lab">intermitentes</text>
<text x="600" y="332" class="lab">• Control de</text>
<text x="611" y="356" class="lab">tratamientos</text>
<text x="600" y="380" class="lab">• Dolor torácico</text>
<text x="611" y="404" class="lab">ocasional</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
