<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El hígado: situación, partes y funciones</title>
  <desc id="d">A la izquierda, el hígado bajo el diafragma, en la parte superior derecha del abdomen, con sus lóbulos derecho e izquierdo, la vesícula biliar, la vena porta, la arteria hepática y el conducto biliar. A la derecha, una lista de sus funciones principales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="440" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240" y="50" text-anchor="middle" class="title">Anatomía básica</text>
  <path d="M50 120 Q240 60 430 120" fill="none" stroke="var(--muted)" stroke-width="4"/>
  <text x="400" y="100" text-anchor="end" class="small muted">Diafragma</text>
  <path d="M60 140 Q120 105 260 112 Q380 118 420 150 Q380 190 300 205 Q230 245 170 290 Q90 300 64 240 Q50 190 60 140 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M262 114 Q250 170 232 232" fill="none" stroke="var(--panel)" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="140" y="190" text-anchor="middle" class="step" style="fill:var(--on)">Lóbulo</text>
  <text x="140" y="210" text-anchor="middle" class="step" style="fill:var(--on)">derecho</text>
  <text x="330" y="155" text-anchor="middle" class="lab" style="fill:var(--on)">Lóbulo izquierdo</text>
  <ellipse cx="200" cy="282" rx="18" ry="28" fill="var(--ok)" transform="rotate(-25 200 282)"/>
  <text x="120" y="340" class="lab" style="fill:var(--ok)">Vesícula biliar</text>
  <path d="M240 240 C250 300 260 340 265 400" stroke="var(--blue)" stroke-width="9" fill="none"/>
  <path d="M258 236 C272 290 285 330 300 400" stroke="var(--red)" stroke-width="4" fill="none"/>
  <path d="M222 244 C226 300 224 340 215 400" stroke="var(--ok)" stroke-width="4" fill="none"/>
  <text x="272" y="386" class="small" style="fill:var(--blue)">Vena porta</text>
  <text x="306" y="358" class="small" style="fill:var(--red)">Arteria hepática</text>
  <text x="150" y="386" class="small" style="fill:var(--ok)">Vía biliar</text>
  <text x="240" y="424" text-anchor="middle" class="small muted">Vista frontal · derecha del paciente a la izquierda</text>

  <rect x="476" y="20" width="304" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628" y="50" text-anchor="middle" class="title">Qué hace</text>
  <text x="496" y="86" class="lab">• Fabrica bilis para digerir grasas</text>
  <text x="496" y="118" class="lab">• Guarda y libera glucosa</text>
  <text x="496" y="150" class="lab">• Produce albúmina y factores</text>
  <text x="508" y="168" class="lab">de la coagulación</text>
  <text x="496" y="200" class="lab">• Elimina tóxicos y transforma</text>
  <text x="508" y="218" class="lab">medicamentos y alcohol</text>
  <text x="496" y="250" class="lab">• Convierte el amoníaco en urea</text>
  <text x="496" y="282" class="lab">• Almacena vitaminas y hierro</text>
  <text x="496" y="314" class="lab">• Filtra la sangre del intestino</text>
  <rect x="496" y="340" width="264" height="80" rx="10" fill="var(--accent-l)"/>
  <text x="510" y="366" class="step">Se regenera</text>
  <text x="510" y="388" class="small">pero el daño repetido deja</text>
  <text x="510" y="406" class="small">cicatriz (fibrosis y cirrosis)</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
