<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ostomía</title>
  <desc id="d">A la izquierda, un abdomen visto de frente con el intestino grueso y la posición habitual de una ileostomía, una colostomía y una urostomía. A la derecha, un estoma en la pared abdominal con una bolsa adherida y claves sobre su cuidado.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Dónde se sitúa el estoma</text>
  <path d="M80 70 H360 C370 200 360 330 330 420 H110 C80 330 70 200 80 70 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="220" cy="230" r="4" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <text x="220" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">Ombligo</text>
  <path d="M130 330 C120 260 120 150 150 130 H290 C320 150 320 260 300 330 C290 360 250 370 240 380" fill="none" stroke="var(--organ)" stroke-width="20" opacity=".8" stroke-linecap="round"/>
  <circle cx="120" cy="300" r="13" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="2"/>
  <circle cx="320" cy="300" r="13" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="2"/>
  <circle cx="300" cy="210" r="11" fill="var(--fluid)" stroke="var(--warn)" stroke-width="2"/>
  <text x="100" y="340" text-anchor="middle" class="small" style="fill:var(--vessel)">Ileostomía</text>
  <text x="100" y="356" text-anchor="middle" class="small" style="fill:var(--muted)">intestino delgado</text>
  <text x="334" y="344" text-anchor="middle" class="small" style="fill:var(--vessel)">Colostomía</text>
  <text x="334" y="360" text-anchor="middle" class="small" style="fill:var(--muted)">intestino grueso</text>
  <text x="330" y="186" text-anchor="end" class="small" style="fill:var(--warn)">Urostomía</text>
  <text x="220" y="112" text-anchor="middle" class="small" style="fill:var(--organ-d)">Colon</text>
  <text x="220" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">Abdomen visto de frente</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Estoma y bolsa</text>
  <rect x="456" y="70" width="120" height="150" rx="0" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
  <path d="M520 70 V220" fill="none" stroke="var(--line)" stroke-width="1"/>
  <path d="M500 145 C500 120 540 120 540 145 C540 170 500 170 500 145 Z" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M560 100 H640 C680 100 690 130 690 170 C690 230 650 250 620 250 C590 250 572 230 572 200 V100 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2" opacity=".9"/>
  <rect x="560" y="120" width="14" height="60" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="520" y="238" text-anchor="middle" class="small" style="fill:var(--vessel)">Estoma</text>
  <text x="660" y="270" text-anchor="middle" class="small" style="fill:var(--accent)">Bolsa adherida</text>
  <text x="456" y="300" class="small">• Rosado y húmedo, no duele al tacto</text>
  <text x="456" y="324" class="small">• La bolsa recoge heces u orina</text>
  <text x="456" y="348" class="small">• Puede ser temporal o permanente</text>
  <text x="456" y="372" class="small">• Enfermería de ostomías enseña su cuidado</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
