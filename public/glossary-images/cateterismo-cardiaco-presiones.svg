  <path d="M521 150 L534 150" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="536" y="60" width="240" height="180" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="550" y="84" text-anchor="start" class="h" style="fill:var(--vein)">3 · Arteria pulmonar</text>
  <line x1="556" y1="100" x2="556" y2="202" stroke="var(--line)"/><line x1="556" y1="202" x2="762" y2="202" stroke="var(--line)"/>
