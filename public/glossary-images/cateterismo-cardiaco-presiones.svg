  <text x="38" y="280" text-anchor="start" class="h" style="fill:var(--vein)">4 · Posición de cuña</text>
  <line x1="44" y1="296" x2="44" y2="398" stroke="var(--line)"/><line x1="44" y1="398" x2="250" y2="398" stroke="var(--line)"/>
  <path d="M48 391 L52 390 L55 386 L59 382 L62 383 L66 388 L69 390 L73 391 L76 390 L80 388 L83 387 L87 389 L90 391 L94 391 L98 391 L101 391 L105 390 L108 389 L112 386 L115 384 L119 384 L122 386 L126 389 L129 390 L133 391 L136 391 L140 391 L143 391 L147 391 L151 390 L154 386 L158 382 L161 383 L165 388 L168 390 L172 391 L175 390 L179 388 L182 387 L186 389 L189 391 L193 391 L196 391 L200 391 L204 390 L207 389 L211 386 L214 384 L218 384 L221 386 L225 389 L228 390 L232 391 L235 391 L239 391 L242 391 L246 391" fill="none" stroke="var(--vein)" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="144" y="420" text-anchor="middle" class="small muted">Refleja la aurícula izquierda (a y v)</text>
  <path d="M265 346 L278 346" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="280" y="256" width="240" height="180" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="294" y="280" text-anchor="start" class="h" style="fill:var(--art)">5 · Ventrículo izquierdo</text>
  <line x1="300" y1="296" x2="300" y2="398" stroke="var(--line)"/><line x1="300" y1="398" x2="506" y2="398" stroke="var(--line)"/>
  <path d="M304 394 L308 394 L311 394 L315 394 L318 393 L322 370 L325 344 L329 323 L332 308 L336 303 L339 306 L343 319 L346 338 L350 364 L354 392 L357 392 L361 392 L364 392 L368 391 L371 391 L375 391 L378 391 L382 391 L385 391 L389 391 L392 390 L396 390 L399 390 L403 394 L407 394 L410 394 L414 394 L417 393 L421 370 L424 344 L428 323 L431 308 L435 303 L438 306 L442 319 L445 338 L449 364 L452 392 L456 392 L460 392 L463 392 L467 391 L470 391 L474 391 L477 391 L481 391 L484 391 L488 391 L491 390 L495 390 L498 390 L502 394" fill="none" stroke="var(--art)" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="400" y="420" text-anchor="middle" class="small muted">Pico sistólico alto, diástole baja</text>
  <path d="M521 346 L534 346" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="536" y="256" width="240" height="180" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="550" y="280" text-anchor="start" class="h" style="fill:var(--art)">6 · Aorta</text>
  <line x1="556" y1="296" x2="556" y2="398" stroke="var(--line)"/><line x1="556" y1="398" x2="762" y2="398" stroke="var(--line)"/>
  <path d="M560 341 L564 342 L567 343 L571 344 L574 345 L578 342 L581 331 L585 320 L588 312 L592 307 L595 306 L599 309 L602 315 L606 324 L610 335 L613 334 L617 333 L620 338 L624 339 L627 339 L631 340 L634 340 L638 340 L641 340 L645 341 L648 341 L652 341 L655 341 L659 341 L663 342 L666 343 L670 344 L673 345 L677 342 L680 331 L684 320 L687 312 L691 307 L694 306 L698 309 L701 315 L705 324 L708 335 L712 334 L716 333 L719 338 L723 339 L726 339 L730 340 L733 340 L737 340 L740 340 L744 341 L747 341 L751 341 L754 341 L758 341" fill="none" stroke="var(--art)" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="656" y="420" text-anchor="middle" class="small muted">Muesca dícrota, diastólica elevada</text>
  <text x="400" y="448" text-anchor="middle" class="tiny muted">Misma escala vertical en los seis trazados: las cavidades izquierdas soportan presiones mayores. Sin valores numéricos.</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
