<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ondas de presión del cateterismo cardíaco</title>
  <desc id="d">Seis trazados esquemáticos en secuencia: aurícula derecha, ventrículo derecho, arteria pulmonar, posición de cuña, ventrículo izquierdo y aorta, con la forma característica de cada onda y sin valores numéricos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f7; --art:#c0392b; --art-l:#f6dcd8; --vein:#2f6fbf; --vein-l:#d6e4f6; --ok:#1f8a5b; --ok-l:#d7efe3; --warn:#c77d12; --warn-l:#f8ead2; --purple:#7a4fb5; --purple-l:#e8def5; --nerve:#d9a514; --tissue:#f1e4dc; --bone:#e3dccf; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --art:#ef7467; --art-l:#4a2a2a; --vein:#78a9e6; --vein-l:#22364f; --ok:#4cc38a; --ok-l:#1d3a2e; --warn:#e6a54a; --warn-l:#3f3220; --purple:#b393e3; --purple-l:#352a47; --nerve:#e8c04a; --tissue:#3a302c; --bone:#4f4a40; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .on { fill: var(--on); }
    .b { font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--art)"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--vein)"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="42" text-anchor="middle" class="title">Ondas de presión a lo largo del recorrido</text>
  <rect x="24" y="60" width="240" height="180" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="38" y="84" text-anchor="start" class="h" style="fill:var(--vein)">1 · Aurícula derecha</text>
  <line x1="44" y1="100" x2="44" y2="202" stroke="var(--line)"/><line x1="44" y1="202" x2="250" y2="202" stroke="var(--line)"/>
  <path d="M48 195 L52 194 L55 191 L59 188 L62 189 L66 192 L69 194 L73 195 L76 194 L80 193 L83 192 L87 194 L90 195 L94 195 L98 195 L101 195 L105 195 L108 193 L112 191 L115 189 L119 189 L122 191 L126 193 L129 194 L133 195 L136 195 L140 195 L143 195 L147 195 L151 194 L154 191 L158 188 L161 189 L165 192 L168 194 L172 195 L175 194 L179 193 L182 192 L186 194 L189 195 L193 195 L196 195 L200 195 L204 195 L207 193 L211 191 L214 189 L218 189 L221 191 L225 193 L228 194 L232 195 L235 195 L239 195 L242 195 L246 195" fill="none" stroke="var(--vein)" stroke-width="2.5" stroke-linejoin="round"/>
