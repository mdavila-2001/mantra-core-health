<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Los tres grados de deshidratación en una diarrea</title>
  <desc id="d">Tres columnas según la clasificación de la OMS. Sin deshidratación: no hay signos suficientes, se continúa con líquidos y alimentos. Alguna deshidratación: inquietud o irritabilidad, ojos hundidos, sed con bebida ansiosa; se rehidrata con suero oral. Deshidratación grave: letargo o pérdida de conciencia, ojos hundidos, no puede beber o bebe mal, el pliegue de la piel vuelve muy lentamente; requiere atención de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --ok:#1f8a5b; --ok-l:#d7f0e4; --warn:#b7791f; --warn-l:#f7e4bf; --bad:#c0392b; --bad-l:#f6d5cf; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --ok:#4cc38a; --ok-l:#1f4033; --warn:#e0b25a; --warn-l:#4a3b1f; --bad:#ef7467; --bad-l:#4a2a27; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Diarrea: cómo se mide la deshidratación</text>

  <rect x="40" y="76" width="226" height="320" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="153" y="106" text-anchor="middle" class="hd" style="fill:var(--ok)">Sin deshidratación</text>
  <text x="153" y="140" text-anchor="middle" class="lab">No hay signos suficientes</text>
  <text x="153" y="158" text-anchor="middle" class="lab">para clasificar como</text>
  <text x="153" y="176" text-anchor="middle" class="lab">alguna o grave</text>
  <text x="153" y="232" text-anchor="middle" class="small muted">Qué hacer</text>
  <text x="153" y="256" text-anchor="middle" class="lab">Seguir con líquidos</text>
  <text x="153" y="274" text-anchor="middle" class="lab">y con alimentos</text>
  <text x="153" y="292" text-anchor="middle" class="lab">(leche materna incluida)</text>
  <text x="153" y="372" text-anchor="middle" class="small muted">Vigilar si cambia</text>

  <rect x="287" y="76" width="226" height="320" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="400" y="106" text-anchor="middle" class="hd" style="fill:var(--warn)">Alguna deshidratación</text>
  <text x="400" y="132" text-anchor="middle" class="small muted">Dos o más de estos signos</text>
  <text x="400" y="158" text-anchor="middle" class="lab">Inquietud o irritabilidad</text>
  <text x="400" y="178" text-anchor="middle" class="lab">Ojos hundidos</text>
  <text x="400" y="198" text-anchor="middle" class="lab">Sed: bebe con ansiedad</text>
  <text x="400" y="232" text-anchor="middle" class="small muted">Qué hacer</text>
  <text x="400" y="256" text-anchor="middle" class="lab">Suero de rehidratación oral</text>
  <text x="400" y="274" text-anchor="middle" class="lab">y consultar</text>
  <text x="400" y="372" text-anchor="middle" class="small muted">Agua limpia, azúcar y sal</text>

  <rect x="534" y="76" width="226" height="320" rx="10" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
  <text x="647" y="106" text-anchor="middle" class="hd" style="fill:var(--bad)">Deshidratación grave</text>
  <text x="647" y="132" text-anchor="middle" class="small muted">Al menos dos de estos signos</text>
  <text x="647" y="158" text-anchor="middle" class="lab">Letargo o pérdida de conciencia</text>
  <text x="647" y="178" text-anchor="middle" class="lab">Ojos hundidos</text>
  <text x="647" y="198" text-anchor="middle" class="lab">No puede beber o bebe mal</text>
  <text x="647" y="218" text-anchor="middle" class="lab">La piel pellizcada vuelve</text>
  <text x="647" y="236" text-anchor="middle" class="lab">muy lento (2 s o más)</text>
  <text x="647" y="284" text-anchor="middle" class="small muted">Qué hacer</text>
  <text x="647" y="308" text-anchor="middle" class="lab">Urgencia: puede necesitar</text>
  <text x="647" y="326" text-anchor="middle" class="lab">líquidos por vena</text>
</svg>
