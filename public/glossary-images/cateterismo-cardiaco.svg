<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Recorrido del catéter en el cateterismo cardíaco</title>
  <desc id="d">Esquema de un corazón con cuatro cámaras. Una ruta azul entra por una vena y pasa por la aurícula derecha, el ventrículo derecho y la arteria pulmonar hasta la posición de cuña. Una ruta roja entra por una arteria, asciende por la aorta y cruza la válvula aórtica hasta el ventrículo izquierdo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f7; --art:#c0392b; --art-l:#f6dcd8; --vein:#2f6fbf; --vein-l:#d6e4f6; --ok:#1f8a5b; --ok-l:#d7efe3; --warn:#c77d12; --warn-l:#f8ead2; --purple:#7a4fb5; --purple-l:#e8def5; --nerve:#d9a514; --tissue:#f1e4dc; --bone:#e3dccf; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --art:#ef7467; --art-l:#4a2a2a; --vein:#78a9e6; --vein-l:#22364f; --ok:#4cc38a; --ok-l:#1d3a2e; --warn:#e6a54a; --warn-l:#3f3220; --purple:#b393e3; --purple-l:#352a47; --nerve:#e8c04a; --tissue:#3a302c; --bone:#4f4a40; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .on { fill: var(--on); }
    .b { font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--art)"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--vein)"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="428" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="50" text-anchor="middle" class="title">Recorrido del catéter en el corazón</text>
  <path d="M250 150 C210 170 200 260 230 330 C270 410 360 440 420 440 C500 440 590 380 600 300 C610 220 590 160 540 145 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <rect x="236" y="168" width="110" height="100" rx="30" fill="var(--vein-l)" stroke="var(--vein)"/>
  <path d="M246 280 H390 V330 C390 380 350 420 300 410 C260 400 246 340 246 300 Z" fill="var(--vein-l)" stroke="var(--vein)"/>
  <rect x="430" y="168" width="140" height="92" rx="30" fill="var(--art-l)" stroke="var(--art)"/>
  <path d="M402 274 H584 C590 330 560 410 470 424 C430 428 402 380 402 330 Z" fill="var(--art-l)" stroke="var(--art)"/>
  <text x="291" y="212" text-anchor="middle" class="small">Aurícula</text>
  <text x="291" y="227" text-anchor="middle" class="small">derecha</text>
  <text x="318" y="330" text-anchor="middle" class="small">Ventrículo</text>
  <text x="318" y="345" text-anchor="middle" class="small">derecho</text>
  <text x="520" y="196" text-anchor="middle" class="small">Aurícula</text>
  <text x="520" y="211" text-anchor="middle" class="small">izquierda</text>
  <text x="510" y="340" text-anchor="middle" class="small">Ventrículo</text>
  <text x="510" y="355" text-anchor="middle" class="small">izquierdo</text>
  <path d="M360 280 C360 220 360 160 340 120 L300 92" fill="none" stroke="var(--vein)" stroke-width="16" stroke-linecap="round" opacity=".35"/>
  <path d="M450 280 C440 200 430 130 470 100 C520 70 600 80 640 130 L660 420" fill="none" stroke="var(--art)" stroke-width="20" stroke-linecap="round" opacity=".3"/>
  <text x="668" y="250" text-anchor="start" class="small">Aorta</text>
  <text x="250" y="80" text-anchor="middle" class="small">Arteria pulmonar</text>
  <path d="M60 430 C120 420 170 390 210 330 C230 300 250 280 270 240 C290 220 300 260 300 300 C300 360 340 360 356 300 C362 240 356 170 336 124 L302 98" fill="none" stroke="var(--vein)" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 5" marker-end="url(#arb)"/>
  <circle cx="296" cy="94" r="7" fill="var(--vein)"/>
  <text x="150" y="112" text-anchor="middle" class="small b">Posición de cuña</text>
  <path d="M210 108 L286 96" stroke="var(--muted)" stroke-width="1"/>
  <text x="44" y="410" text-anchor="start" class="small b" style="fill:var(--vein)">Entrada por vena</text>
  <text x="44" y="425" text-anchor="start" class="tiny muted">(femoral, yugular o braquial)</text>
  <path d="M740 430 C700 430 676 410 672 380 L652 140 C630 96 560 80 510 92 C462 106 450 160 456 230 C460 270 470 300 490 330" fill="none" stroke="var(--art)" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="756" y="410" text-anchor="end" class="small b" style="fill:var(--art)">Entrada por arteria</text>
  <text x="756" y="425" text-anchor="end" class="tiny muted">(radial o femoral)</text>
  <rect x="436" y="262" width="34" height="8" rx="3" fill="var(--ink)" opacity=".55"/>
  <text x="388" y="266" text-anchor="end" class="tiny">Válvula</text>
  <text x="388" y="278" text-anchor="end" class="tiny">aórtica</text>
  <path d="M392 268 L432 266" stroke="var(--muted)" stroke-width="1"/>
  <line x1="44" y1="150" x2="80" y2="150" stroke="var(--vein)" stroke-width="4" stroke-dasharray="9 5"/>  <text x="88" y="154" class="small">Cateterismo derecho</text>
  <line x1="44" y1="174" x2="80" y2="174" stroke="var(--art)" stroke-width="4"/>  <text x="88" y="178" class="small">Cateterismo izquierdo</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
