<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Campo de la cirugía vascular</title>
  <desc id="d">Silueta humana con las arterias en rojo y las venas en azul, y zonas señaladas como las carótidas, un aneurisma de aorta, las arterias de las piernas y las venas. A la derecha, las enfermedades que atiende y las dos formas de tratamiento: cirugía abierta y técnicas endovasculares.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Cirugía vascular: arterias, venas y linfáticos</text>
  <rect x="20" y="60" width="340" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="190.0" y="88" text-anchor="middle" class="h">Territorio de la especialidad</text>
  <circle cx="190" cy="112" r="22" fill="var(--skin)" stroke="var(--muted)"/>
  <path d="M150 140 L230 140 L246 280 L226 286 L220 430 L196 430 L190 300 L184 430 L160 430 L154 286 L134 280 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M186 140 L186 280 L172 420 M186 280 L206 420 M186 160 L176 120 M186 160 L200 120" fill="none" stroke="var(--red)" stroke-width="3"/>
  <path d="M196 150 L196 280 M196 290 L214 420" fill="none" stroke="var(--accent)" stroke-width="3" opacity=".8"/>
  <path d="M186 214 C176 210 176 226 186 226" fill="var(--red)" stroke="var(--red)" stroke-width="2"/>
  <line x1="178" y1="218" x2="90" y2="200" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="196" class="small b">Aneurisma</text>
  <text x="40" y="212" class="small">de aorta</text>
  <line x1="180" y1="130" x2="90" y2="130" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="134" class="small b">Carótidas</text>
  <line x1="176" y1="360" x2="90" y2="340" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="344" class="small b">Arterias</text>
  <text x="40" y="360" class="small">de piernas</text>
  <line x1="214" y1="380" x2="270" y2="360" stroke="var(--muted)" stroke-width="1"/>
  <text x="270" y="350" class="small b">Venas</text>
  <text x="296" y="196" text-anchor="middle" class="small" style="fill:var(--red)">Arteria</text>
  <text x="296" y="214" text-anchor="middle" class="small" style="fill:var(--accent)">Vena</text>
  <rect x="376" y="60" width="404" height="186" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="578.0" y="88" text-anchor="middle" class="title">Qué atiende</text>
  <text x="394" y="108" class="small">• Aneurismas de aorta</text>
  <text x="394" y="132" class="small">• Estrechez de carótidas</text>
  <text x="394" y="156" class="small">• Arteriopatía de las piernas</text>
  <text x="394" y="180" class="small">• Pie diabético isquémico</text>
  <text x="594" y="108" class="small">• Várices</text>
  <text x="594" y="132" class="small">• Trombosis venosa</text>
  <text x="594" y="156" class="small">• Accesos para diálisis</text>
  <text x="594" y="180" class="small">• Linfedema</text>
  <rect x="376" y="262" width="404" height="178" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="578.0" y="290" text-anchor="middle" class="title">Dos formas de tratar</text>
  <rect x="394" y="304" width="176" height="70" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="482.0" y="336.0" text-anchor="middle" class="lab b">Cirugía abierta</text>
  <text x="482.0" y="353.0" text-anchor="middle" class="small muted">bypass, endarterectomía</text>
  <rect x="586" y="304" width="176" height="70" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="674.0" y="336.0" text-anchor="middle" class="lab b">Endovascular</text>
  <text x="674.0" y="353.0" text-anchor="middle" class="small muted">catéter, balón, stent</text>
  <text x="578" y="410" text-anchor="middle" class="small muted">Más ecografía Doppler para el diagnóstico</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
