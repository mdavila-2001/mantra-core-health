<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Hepatitis B: del contagio a la infección crónica</title>
  <desc id="d">Diagrama de flujo. Tras el contagio con el virus de la hepatitis B, la infección se vuelve crónica en alrededor del 95 por ciento de los casos si ocurre en la infancia temprana y en menos del 5 por ciento si ocurre en la edad adulta. La infección crónica puede no dar síntomas durante décadas y en algunas personas evoluciona a cirrosis y cáncer de hígado. La vacuna desde el nacimiento previene la infección y el tratamiento antiviral puede frenar el daño.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --ok:#1f8a5b; --ok-l:#d7f0e4; --warn:#b7791f; --warn-l:#f7e4bf; --bad:#c0392b; --bad-l:#f6d5cf; --blue:#1f6fb2; --blue-l:#d6e6f5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --ok:#4cc38a; --ok-l:#1f4033; --warn:#e0b25a; --warn-l:#4a3b1f; --bad:#ef7467; --bad-l:#4a2a27; --blue:#6aa7e8; --blue-l:#1f3347; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">La edad del contagio decide si la infección se vuelve crónica</text>

  <rect x="40" y="150" width="150" height="90" rx="10" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/>
  <text x="115" y="188" text-anchor="middle" class="hd" style="fill:var(--blue)">Contagio</text>
  <text x="115" y="210" text-anchor="middle" class="lab">con el virus de</text>
  <text x="115" y="226" text-anchor="middle" class="lab">la hepatitis B</text>

  <path d="M190 180 L 250 120" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M190 212 L 250 272" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <rect x="255" y="76" width="230" height="86" rx="10" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
  <text x="370" y="104" text-anchor="middle" class="hd" style="fill:var(--bad)">En la primera infancia</text>
  <text x="370" y="134" text-anchor="middle" class="big" style="fill:var(--bad)">≈ 95 %</text>
  <text x="370" y="153" text-anchor="middle" class="small muted">se vuelve crónica</text>

  <rect x="255" y="230" width="230" height="86" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="370" y="258" text-anchor="middle" class="hd" style="fill:var(--ok)">En la edad adulta</text>
  <text x="370" y="288" text-anchor="middle" class="big" style="fill:var(--ok)">&lt; 5 %</text>
  <text x="370" y="307" text-anchor="middle" class="small muted">se vuelve crónica</text>

  <path d="M485 119 L 545 150" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M485 273 L 545 255" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <rect x="550" y="100" width="210" height="170" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="655" y="126" text-anchor="middle" class="hd" style="fill:var(--warn)">Infección crónica</text>
  <text x="655" y="152" text-anchor="middle" class="lab">Puede no dar síntomas</text>
  <text x="655" y="170" text-anchor="middle" class="lab">durante décadas</text>
  <text x="655" y="198" text-anchor="middle" class="lab">En algunas personas:</text>
  <text x="655" y="216" text-anchor="middle" class="lab">cirrosis y cáncer de hígado</text>
  <text x="655" y="250" text-anchor="middle" class="small muted">Antivirales: frenan el daño</text>

  <rect x="40" y="340" width="720" height="52" rx="10" fill="var(--panel)" stroke="var(--ok)" stroke-width="2"/>
  <text x="400" y="362" text-anchor="middle" class="hd" style="fill:var(--ok)">Prevención: vacuna a todo recién nacido en las primeras 24 horas</text>
  <text x="400" y="381" text-anchor="middle" class="small muted">Seguida de 2 o 3 dosis más, con al menos 4 semanas entre ellas</text>
</svg>
