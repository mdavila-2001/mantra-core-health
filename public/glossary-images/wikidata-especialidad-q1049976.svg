<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El camino de un trasplante</title>
  <desc id="d">Cinco pasos en fila: evaluación del candidato, lista de espera, donante y compatibilidad, cirugía e inmunosupresión con seguimiento. Abajo, los órganos y tejidos que se trasplantan y los retos principales de la especialidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">El camino de un trasplante</text>
<rect x="40" y="66" width="124" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="102.0" y="95.7" text-anchor="middle" class="small" style="fill:var(--on)">Evaluación</text>
<text x="102.0" y="110.7" text-anchor="middle" class="small" style="fill:var(--on)">del candidato</text>
<line x1="165" y1="99.0" x2="186" y2="99.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="189" y="66" width="124" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="251.0" y="95.7" text-anchor="middle" class="small" style="fill:var(--on)">Lista de</text>
<text x="251.0" y="110.7" text-anchor="middle" class="small" style="fill:var(--on)">espera</text>
<line x1="314" y1="99.0" x2="335" y2="99.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="338" y="66" width="124" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="400.0" y="95.7" text-anchor="middle" class="small" style="fill:var(--on)">Donante y</text>
<text x="400.0" y="110.7" text-anchor="middle" class="small" style="fill:var(--on)">compatibilidad</text>
<line x1="463" y1="99.0" x2="484" y2="99.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="487" y="66" width="124" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="549.0" y="95.7" text-anchor="middle" class="small" style="fill:var(--on)">Cirugía del</text>
<text x="549.0" y="110.7" text-anchor="middle" class="small" style="fill:var(--on)">trasplante</text>
<line x1="612" y1="99.0" x2="633" y2="99.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="636" y="66" width="124" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="698.0" y="95.7" text-anchor="middle" class="small" style="fill:var(--on)">Inmunosupresión</text>
<text x="698.0" y="110.7" text-anchor="middle" class="small" style="fill:var(--on)">y seguimiento</text>
<text x="102" y="156" text-anchor="middle" class="small" style="fill:var(--muted)">pruebas, otras</text>
<text x="102" y="172" text-anchor="middle" class="small" style="fill:var(--muted)">enfermedades</text>
<text x="251" y="156" text-anchor="middle" class="small" style="fill:var(--muted)">criterios justos</text>
<text x="400" y="156" text-anchor="middle" class="small" style="fill:var(--muted)">grupo, HLA,</text>
<text x="400" y="172" text-anchor="middle" class="small" style="fill:var(--muted)">prueba cruzada</text>
<text x="549" y="156" text-anchor="middle" class="small" style="fill:var(--muted)">extracción e</text>
<text x="549" y="172" text-anchor="middle" class="small" style="fill:var(--muted)">implante</text>
<text x="698" y="156" text-anchor="middle" class="small" style="fill:var(--muted)">de por vida</text>
<text x="400" y="232" text-anchor="middle" class="lab">Trabajo de un equipo: cirujanos, clínicos, inmunólogos, coordinadores y enfermería.</text>
<rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="316" text-anchor="middle" class="title">Qué se trasplanta</text>
<text x="36" y="344" class="lab">• Riñón, hígado, corazón, pulmón</text>
<text x="36" y="368" class="lab">• Páncreas e intestino</text>
<text x="36" y="392" class="lab">• Médula ósea (progenitores)</text>
<text x="36" y="416" class="lab">• Córnea, piel, hueso, válvulas</text>
<rect x="406" y="286" width="374" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="316" text-anchor="middle" class="title">Retos principales</text>
<text x="422" y="344" class="lab">• Rechazo del injerto</text>
<text x="422" y="368" class="lab">• Infecciones por inmunosupresión</text>
<text x="422" y="392" class="lab">• Escasez de órganos donados</text>
<text x="422" y="416" class="lab">• Ética y consentimiento</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
