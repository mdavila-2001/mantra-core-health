<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía cardíaca</title>
  <desc id="d">A la izquierda, un corazón con una arteria coronaria obstruida y un injerto de bypass que lleva la sangre por encima del bloqueo. A la derecha, el circuito de circulación extracorpórea, con una bomba y un oxigenador que hacen el trabajo del corazón y los pulmones durante la operación, y las principales cirugías de la especialidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Bypass coronario</text>
  <path d="M200 352.0 C46.0 242.0 68.0 109.99999999999999 156.0 118.8 C191.2 123.19999999999999 200 154.0 200 162.8 C200 154.0 208.8 123.19999999999999 244.0 118.8 C332.0 109.99999999999999 354.0 242.0 200 352.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M150 170 C160 230 190 270 200 320" fill="none" stroke="var(--vessel)" stroke-width="4"/>
  <circle cx="168" cy="232" r="8" fill="var(--nerve)"/>
  <path d="M200 100 C120 110 110 160 160 236" fill="none" stroke="var(--ok)" stroke-width="5"/>
  <text x="214" y="92" class="step" style="fill:var(--ok)">Injerto</text>
  <text x="214" y="110" class="small muted">(vena o arteria)</text>
  <text x="250" y="290" class="small">Arteria coronaria</text>
  <text x="250" y="306" class="small">con obstrucción</text>
  <path d="M246 296 L176 234" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="412" text-anchor="middle" class="lab">La sangre rodea el bloqueo</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Circulación extracorpórea</text>
  <circle cx="500" cy="130" r="34" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <text x="500" y="135" text-anchor="middle" class="small">Paciente</text>
  <rect x="620" y="90" width="120" height="34" rx="8" fill="var(--accent)"/>
  <text x="680" y="112" text-anchor="middle" class="small" style="fill:var(--on)">Bomba</text>
  <rect x="620" y="140" width="120" height="34" rx="8" fill="var(--purple)"/>
  <text x="680" y="162" text-anchor="middle" class="small" style="fill:var(--on)">Oxigenador</text>
  <path d="M534 120 H618" fill="none" stroke="var(--vein)" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M620 157 H536" fill="none" stroke="var(--vessel)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="598" y="200" text-anchor="middle" class="small">Hace el trabajo del corazón y los pulmones</text>
  <text x="436" y="248" class="step">Qué opera</text>
  <text x="440" y="274" class="lab">• Coronarias obstruidas (bypass)</text>
  <text x="440" y="300" class="lab">• Válvulas: reparar o sustituir</text>
  <text x="440" y="326" class="lab">• Aorta torácica</text>
  <text x="440" y="352" class="lab">• Cardiopatías congénitas</text>
  <text x="440" y="378" class="lab">• Trasplante cardíaco</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
