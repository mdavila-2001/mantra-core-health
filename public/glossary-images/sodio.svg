<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Sodio en sangre</title>
  <desc id="d">A la izquierda, tres células rodeadas de líquido con distinta cantidad de sodio: con poco sodio la célula se hincha y con mucho se encoge, y los riñones y la hormona antidiurética que lo regulan. A la derecha, el análisis y las causas de sodio bajo y alto.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Agua y sodio en equilibrio</text>
  <text x="220" y="70" text-anchor="middle" class="small" style="fill:var(--muted)">El sodio retiene el agua fuera de las células</text>
  <rect x="32" y="96" width="116" height="140" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <circle cx="90" cy="166" r="40" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <circle cx="42" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="66" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="90" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="90" y="258" text-anchor="middle" class="lab">Sodio bajo</text>
  <rect x="162" y="96" width="116" height="140" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <circle cx="220" cy="166" r="32" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <circle cx="172" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="196" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="220" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="244" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="268" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="172" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="220" y="258" text-anchor="middle" class="lab">Equilibrio</text>
  <rect x="292" y="96" width="116" height="140" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <circle cx="350" cy="166" r="22" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <circle cx="302" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="326" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="350" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="374" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="398" cy="110" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="302" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="326" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="350" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="374" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="398" cy="222" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="350" y="258" text-anchor="middle" class="lab">Sodio alto</text>
  <text x="90" y="276" text-anchor="middle" class="small" style="fill:var(--muted)">La célula se hincha</text>
  <text x="350" y="276" text-anchor="middle" class="small" style="fill:var(--muted)">La célula se encoge</text>
  <circle cx="60" cy="312" r="4" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="70" y="316" class="small">= sodio</text>
  <rect x="60" y="340" width="140" height="64" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="130.0" y="368.5" text-anchor="middle" class="small">Riñones</text>
  <text x="130.0" y="385.5" text-anchor="middle" class="small">regulan la eliminación</text>
  <rect x="220" y="340" width="160" height="64" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="300.0" y="368.5" text-anchor="middle" class="small">Hormona antidiurética</text>
  <text x="300.0" y="385.5" text-anchor="middle" class="small">y sed regulan el agua</text>
  <text x="220" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">El cerebro es muy sensible a estos cambios</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">El análisis</text>
  <rect x="460" y="70" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M463 84 V140 a12 12 0 0 0 24 0 V84" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M465 110 V140 a10 10 0 0 0 20 0 V110 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="504" y="104" class="small">Sangre (electrolitos)</text>
  <text x="504" y="122" class="small" style="fill:var(--muted)">a veces también orina</text>
  <rect x="456" y="180" width="304" height="110" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="472" y="204" class="step">Bajo (hiponatremia)</text>
  <text x="480" y="226" class="small">• Diuréticos, vómitos, diarrea</text>
  <text x="480" y="244" class="small">• Exceso de agua, insuficiencia</text>
  <text x="480" y="262" class="small">• cardíaca, hepática o renal</text>
  <rect x="456" y="302" width="304" height="120" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="472" y="326" class="step" style="fill:var(--warn)">Alto (hipernatremia)</text>
  <text x="480" y="348" class="small">• Deshidratación, poca ingesta</text>
  <text x="480" y="366" class="small">• de agua, fiebre o sudor</text>
  <text x="480" y="384" class="small">• Síntomas: confusión, debilidad,</text>
  <text x="480" y="402" class="small">• convulsiones en casos graves</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
