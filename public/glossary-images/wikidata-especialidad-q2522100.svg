<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina de la discapacidad intelectual</title>
  <desc id="d">Arriba, una línea de vida con cuatro etapas, infancia, adolescencia, adultez y envejecimiento, que muestra la atención continuada. Abajo, los problemas de salud que vigila el especialista y su forma de trabajar con comunicación adaptada.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Atención a lo largo de toda la vida</text>
  <line x1="60" y1="140" x2="740" y2="140" stroke="var(--line)" stroke-width="6"/>
  <circle cx="120" cy="108.4" r="7.199999999999999" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <path d="M109 136 C109 120 131 120 131 136 Z" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="120" cy="140" r="7" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="120" y="168" text-anchor="middle" class="lab">Infancia</text>
  <circle cx="306" cy="99.2" r="9.600000000000001" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <path d="M292 136 C292 115 320 115 320 136 Z" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="306" cy="140" r="7" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="306" y="168" text-anchor="middle" class="lab">Adolescencia</text>
  <circle cx="492" cy="90.0" r="12.0" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <path d="M474 136 C474 110 510 110 510 136 Z" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="492" cy="140" r="7" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="492" y="168" text-anchor="middle" class="lab">Adultez</text>
  <circle cx="678" cy="92.3" r="11.399999999999999" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <path d="M661 136 C661 111 695 111 695 136 Z" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="678" cy="140" r="7" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="678" y="168" text-anchor="middle" class="lab">Envejecimiento</text>
  <text x="400" y="206" text-anchor="middle" class="small" style="fill:var(--muted)">Transición coordinada de la pediatría a la medicina de adultos</text>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="286" text-anchor="middle" class="title">Problemas que vigila</text>
  <text x="40" y="312" class="small">• Epilepsia y problemas de sueño</text>
  <text x="40" y="336" class="small">• Dolor que no se expresa con palabras</text>
  <text x="40" y="360" class="small">• Visión, audición y salud dental</text>
  <text x="40" y="384" class="small">• Salud mental y conducta</text>
  <text x="40" y="408" class="small">• Efectos de la medicación</text>
  <rect x="410" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="286" text-anchor="middle" class="title">Cómo trabaja</text>
  <text x="430" y="312" class="small">• Comunicación adaptada y tiempo</text>
  <text x="430" y="336" class="small">• Información en lectura fácil</text>
  <text x="430" y="360" class="small">• Escucha a la persona y a sus apoyos</text>
  <text x="430" y="384" class="small">• Equipo con otros especialistas</text>
  <text x="430" y="408" class="small">• Respeta la autonomía y las decisiones</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
