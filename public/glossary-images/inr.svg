<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">INR</title>
  <desc id="d">A la izquierda, un tubo de sangre con citrato al que se añade un reactivo y se cronometra el tiempo hasta formar un coágulo, que se compara con una referencia para obtener el INR. A la derecha, sus usos y una balanza entre riesgo de sangrado y de trombos.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Cómo se obtiene</text>
  <rect x="60" y="72" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M63 86 V162 a12 12 0 0 0 24 0 V86" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M65 112 V162 a10 10 0 0 0 20 0 V112 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <rect x="60" y="72" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="75" y="196" text-anchor="middle" class="small" style="fill:var(--muted)">Tapón azul</text>
  <text x="75" y="212" text-anchor="middle" class="small" style="fill:var(--muted)">(citrato)</text>
  <line x1="110" y1="120" x2="150" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="156" y="90" width="110" height="60" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="211.0" y="116.5" text-anchor="middle" class="lab">Se añade</text>
  <text x="211.0" y="133.5" text-anchor="middle" class="lab">reactivo</text>
  <line x1="266" y1="120" x2="290" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="340" cy="120" r="36" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
  <line x1="340" y1="120" x2="340" y2="92" stroke="var(--ink)" stroke-width="2"/>
  <line x1="340" y1="120" x2="362" y2="128" stroke="var(--ink)" stroke-width="2"/>
  <text x="340" y="176" text-anchor="middle" class="small">Segundos hasta</text>
  <text x="340" y="192" text-anchor="middle" class="small">formar coágulo</text>
  <rect x="60" y="244" width="300" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="210.0" y="270.5" text-anchor="middle" class="lab">Tiempo de protrombina comparado</text>
  <text x="210.0" y="287.5" text-anchor="middle" class="lab">con un valor de referencia = INR</text>
  <line x1="210" y1="214" x2="210" y2="240" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <text x="210" y="340" text-anchor="middle" class="small">Un número estandarizado que permite</text>
  <text x="210" y="358" text-anchor="middle" class="small">comparar resultados entre laboratorios</text>
  <text x="210" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">Muestra: sangre (vena o punción en el dedo)</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Para qué se usa</text>
  <text x="456" y="80" class="small">• Controlar anticoagulantes orales</text>
  <text x="456" y="102" class="small">• como la warfarina o el acenocumarol</text>
  <text x="456" y="124" class="small">• Valorar la función del hígado</text>
  <text x="456" y="146" class="small">• Antes de algunas cirugías</text>
  <text x="608" y="198" text-anchor="middle" class="step">Equilibrio que se busca</text>
  <path d="M608 230 L520 250 M608 230 L696 250" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M600 300 L608 230 L616 300 Z" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <rect x="456" y="254" width="130" height="50" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="521.0" y="275.5" text-anchor="middle" class="small">INR alto</text>
  <text x="521.0" y="292.5" text-anchor="middle" class="small">riesgo de sangrado</text>
  <rect x="630" y="254" width="130" height="50" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="695.0" y="275.5" text-anchor="middle" class="small">INR bajo</text>
  <text x="695.0" y="292.5" text-anchor="middle" class="small">riesgo de trombos</text>
  <rect x="456" y="330" width="304" height="92" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="608" y="356" text-anchor="middle" class="small">El médico fija el rango objetivo</text>
  <text x="608" y="376" text-anchor="middle" class="small">de cada persona y ajusta el tratamiento</text>
  <text x="608" y="396" text-anchor="middle" class="small">según el resultado.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
