<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Papanicolaou: citología del cuello uterino</title>
  <desc id="d">A la izquierda, el útero, el cuello uterino y la vagina, con un cepillo que toma células del cuello. A la derecha, células normales con núcleo pequeño y células alteradas con núcleo grande e irregular, y para qué sirve la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Dónde se toma</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué se observa</text>
<path d="M120 80 C120 60 280 60 280 80 C280 120 250 160 225 190 L225 230 L175 230 L175 190 C150 160 120 120 120 80 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M140 84 C150 76 250 76 260 84" fill="none" stroke="var(--organ)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="120" text-anchor="middle" class="lab">Útero</text>
<rect x="178" y="230" width="44" height="18" rx="6" fill="var(--organ)"/>
<text x="236" y="244" class="lab">Cuello uterino</text>
<path d="M170 248 L160 380 L240 380 L230 248" fill="var(--skin)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="360" text-anchor="middle" class="small" style="fill:var(--muted)">Vagina</text>
<line x1="300" y1="400" x2="214" y2="254" stroke="var(--accent)" stroke-width="4"/>
<path d="M206 250 l8 -6 l8 6 l-8 8 Z" fill="var(--accent)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="290" y="420" text-anchor="middle" class="small" style="fill:var(--accent)">Cepillo o espátula</text>
<text x="40" y="300" class="small" style="fill:var(--muted)">Espéculo</text>
<text x="40" y="316" class="small" style="fill:var(--muted)">para ver el</text>
<text x="40" y="332" class="small" style="fill:var(--muted)">cuello</text>
<text x="416" y="76" class="h">Las células van al laboratorio</text>
<ellipse cx="470" cy="140" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="470" cy="140" r="6" fill="var(--accent)"/>
<ellipse cx="530" cy="126" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="530" cy="126" r="5" fill="var(--accent)"/>
<ellipse cx="500" cy="180" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="500" cy="180" r="6" fill="var(--accent)"/>
<text x="500" y="226" text-anchor="middle" class="step" style="fill:var(--ok)">Normales</text>
<text x="500" y="244" text-anchor="middle" class="small" style="fill:var(--muted)">núcleo pequeño</text>
<ellipse cx="640" cy="136" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="640" cy="136" r="14" fill="var(--purple)"/>
<ellipse cx="700" cy="168" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="700" cy="168" r="16" fill="var(--purple)"/>
<ellipse cx="650" cy="186" rx="30" ry="22" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="650" cy="186" r="13" fill="var(--purple)"/>
<text x="670" y="226" text-anchor="middle" class="step" style="fill:var(--bad)">Alteradas</text>
<text x="670" y="244" text-anchor="middle" class="small" style="fill:var(--muted)">núcleo grande e irregular</text>
<text x="416" y="290" class="h">Para qué sirve</text>
<text x="416" y="316" class="lab">• Detecta cambios antes del cáncer</text>
<text x="416" y="338" class="lab">• Se combina o reemplaza por la</text>
<text x="427" y="360" class="lab">prueba del virus del papiloma</text>
<text x="416" y="382" class="lab">• Un resultado alterado lleva a</text>
<text x="427" y="404" class="lab">colposcopia, no es diagnóstico</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
