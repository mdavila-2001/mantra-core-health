<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Logopedia: órganos de la comunicación</title>
  <desc id="d">Perfil de cabeza con el cerebro, el oído, la lengua y los labios, la laringe y la vía de la deglución señalados. A la derecha, las áreas que atiende la logopedia: lenguaje, habla, voz, deglución, audición y lectoescritura.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">Órganos de la comunicación</text>
<path d="M260,90 Q200,50 140,80 Q108,100 106,140 L98,160 L84,182 L100,188 Q96,200 102,208 Q98,220 108,230 Q126,246 150,242 L156,320 L240,320 L240,240 Q290,190 260,90 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="140" cy="152" r="5" fill="var(--ink)" stroke="none" stroke-width="1"/>
<path d="M190,72 Q240,60 250,110 Q250,150 210,150 Q170,140 190,72 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
<path d="M110,206 Q130,214 150,200" fill="none" stroke="var(--vessel)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="176" y="240" width="22" height="30" rx="4" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="1"/>
<path d="M156,190 Q176,196 186,236 L186,300" fill="none" stroke="var(--organ-d)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
<circle cx="240" cy="160" r="8" fill="var(--beam)" stroke="var(--warn)" stroke-width="2"/>
<text x="300" y="96" class="small">Lenguaje (cerebro)</text>
<line x1="296" y1="92" x2="244" y2="104" stroke="var(--muted)" stroke-width="1"/>
<text x="300" y="164" class="small">Audición (oído)</text>
<line x1="296" y1="160" x2="248" y2="160" stroke="var(--muted)" stroke-width="1"/>
<text x="40" y="250" class="small">Habla (lengua</text>
<line x1="128.24" y1="246" x2="128" y2="208" stroke="var(--muted)" stroke-width="1"/>
<text x="40" y="266" class="small">y labios)</text>
<text x="260" y="262" class="small">Voz (laringe)</text>
<line x1="256" y1="258" x2="198" y2="254" stroke="var(--muted)" stroke-width="1"/>
<text x="260" y="312" class="small">Deglución</text>
<line x1="256" y1="308" x2="188" y2="296" stroke="var(--muted)" stroke-width="1"/>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
<rect x="476" y="56" width="284" height="46" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="75" class="step">Lenguaje</text>
<text x="490" y="93" class="small">retraso, afasia tras ictus</text>
<rect x="476" y="112" width="284" height="46" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="490" y="131" class="step">Habla</text>
<text x="490" y="149" class="small">dislalias, tartamudez</text>
<rect x="476" y="168" width="284" height="46" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="187" class="step">Voz</text>
<text x="490" y="205" class="small">disfonía, nódulos</text>
<rect x="476" y="224" width="284" height="46" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="490" y="243" class="step">Deglución</text>
<text x="490" y="261" class="small">disfagia, riesgo de atragantarse</text>
<rect x="476" y="280" width="284" height="46" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="299" class="step">Audición</text>
<text x="490" y="317" class="small">rehabilitación con implantes</text>
<rect x="476" y="336" width="284" height="46" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="490" y="355" class="step">Lectoescritura</text>
<text x="490" y="373" class="small">dislexia</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
