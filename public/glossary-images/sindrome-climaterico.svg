<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Etapas del climaterio y sus síntomas</title>
  <desc id="d">Línea de tiempo con la curva de estrógenos que baja desde la etapa fértil, pasa por la perimenopausia y la menopausia, marcada como última regla, hasta la posmenopausia. Abajo, los síntomas frecuentes como sofocos o sequedad vaginal y las medidas que ayudan.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Síndrome climatérico: la transición a la menopausia</text>
  <rect x="20" y="60" width="760" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="90" text-anchor="middle" class="title">Los estrógenos bajan con el tiempo</text>
  <path d="M60 210 L740 210" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M60 110 C200 110 280 112 340 130 C400 150 420 200 480 196 C560 192 640 198 740 200" fill="none" stroke="var(--pur)" stroke-width="3"/>
  <path d="M440 120 L440 210" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="440" y="114" text-anchor="middle" class="small b" style="fill:var(--red)">Menopausia: última regla</text>
  <text x="160" y="236" text-anchor="middle" class="small">Etapa fértil</text>
  <text x="360" y="236" text-anchor="middle" class="small">Perimenopausia</text>
  <text x="600" y="236" text-anchor="middle" class="small">Posmenopausia</text>
  <text x="130" y="136" text-anchor="middle" class="small muted">Estrógenos</text>
  <rect x="20" y="276" width="372" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="206.0" y="306" text-anchor="middle" class="title">Síntomas frecuentes</text>
  <text x="38" y="324" class="small">• Sofocos y sudores</text>
  <text x="38" y="350" class="small">• Sueño alterado</text>
  <text x="38" y="376" class="small">• Cambios de ánimo</text>
  <text x="214" y="324" class="small">• Sequedad vaginal</text>
  <text x="214" y="350" class="small">• Reglas irregulares</text>
  <text x="214" y="376" class="small">• Pérdida de hueso</text>
  <rect x="408" y="276" width="372" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="594.0" y="306" text-anchor="middle" class="title">Qué ayuda</text>
  <text x="426" y="324" class="small">• Ejercicio, sueño y alimentación</text>
  <text x="426" y="348" class="small">• Ropa en capas; evitar desencadenantes</text>
  <text x="426" y="372" class="small">• Tratamiento hormonal u otros</text>
  <text x="437" y="396" class="small">si los síntomas pesan</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
