<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Accidente cerebrovascular: tipos y señales</title>
  <desc id="d">A la izquierda, dos cerebros esquemáticos: en el ictus isquémico un coágulo bloquea una arteria y la zona que esta irriga queda sin sangre; en el ictus hemorrágico una arteria se rompe y la sangre sale al tejido. A la derecha, cuatro pasos para reconocerlo: cara, brazo, habla y tiempo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#e3eef9; --brain:#f1dfe3; --brain-s:#d9b8c0; --vessel:#c0392b; --clot:#5a2a1f; --isch:#9fb0c1; --warn:#c0392b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#1f3047; --brain:#3a2d33; --brain-s:#5c4650; --vessel:#ef7467; --clot:#f2c46d; --isch:#56677a; --warn:#ef7467; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .k { font-size: 22px; font-weight: 800; fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <defs>
    <path id="br" d="M-110 20 C-120 -50 -60 -95 0 -95 C70 -95 120 -55 115 0 C112 40 80 70 30 70 L10 90 L-10 70 C-70 72 -105 55 -110 20 Z" fill="var(--brain)" stroke="var(--brain-s)" stroke-width="3"/>
  </defs>
  <rect x="20" y="20" width="440" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>

  <text x="240" y="50" text-anchor="middle" class="h">Isquémico (el más frecuente)</text>
  <g transform="translate(240 150)">
    <use href="#br"/>
    <ellipse cx="45" cy="-30" rx="50" ry="32" fill="var(--isch)" opacity=".7"/>
    <path d="M0 85 C0 40 -10 10 10 -20 C25 -40 50 -40 80 -30" fill="none" stroke="var(--vessel)" stroke-width="5"/>
    <circle cx="10" cy="-20" r="8" fill="var(--clot)"/>
  </g>
  <text x="120" y="250" class="small">Un coágulo tapa la arteria;</text>
  <text x="120" y="266" class="small muted">la zona gris se queda sin sangre</text>

  <text x="240" y="300" text-anchor="middle" class="h">Hemorrágico</text>
  <g transform="translate(240 390) scale(.72)">
    <use href="#br"/>
    <path d="M0 85 C0 40 -10 10 10 -20 C25 -40 50 -40 80 -30" fill="none" stroke="var(--vessel)" stroke-width="6"/>
    <circle cx="20" cy="-30" r="26" fill="var(--vessel)" opacity=".55"/>
  </g>
  <text x="330" y="380" class="small">Una arteria</text>
  <text x="330" y="396" class="small">se rompe y</text>
  <text x="330" y="412" class="small muted">sangra</text>

  <rect x="476" y="20" width="304" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628" y="50" text-anchor="middle" class="title">Reconózcalo rápido</text>
  <g>
    <rect x="496" y="72" width="44" height="44" rx="10" fill="var(--accent)"/><text x="518" y="102" text-anchor="middle" class="k">C</text>
    <text x="552" y="90" class="h">Cara</text><text x="552" y="108" class="small muted">¿Se cae un lado al sonreír?</text>
    <rect x="496" y="136" width="44" height="44" rx="10" fill="var(--accent)"/><text x="518" y="166" text-anchor="middle" class="k">B</text>
    <text x="552" y="154" class="h">Brazo</text><text x="552" y="172" class="small muted">¿Uno cae al levantar ambos?</text>
    <rect x="496" y="200" width="44" height="44" rx="10" fill="var(--accent)"/><text x="518" y="230" text-anchor="middle" class="k">H</text>
    <text x="552" y="218" class="h">Habla</text><text x="552" y="236" class="small muted">¿Habla raro o no se entiende?</text>
    <rect x="496" y="264" width="44" height="44" rx="10" fill="var(--warn)"/><text x="518" y="294" text-anchor="middle" class="k">T</text>
    <text x="552" y="282" class="h" style="fill:var(--warn)">Tiempo</text><text x="552" y="300" class="small muted">Llame a emergencias ya</text>
  </g>
  <rect x="496" y="330" width="264" height="110" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="628" y="356" text-anchor="middle" class="lab" style="font-weight:700">«El tiempo es cerebro»</text>
  <text x="628" y="380" text-anchor="middle" class="small">Anote la hora de inicio.</text>
  <text x="628" y="400" text-anchor="middle" class="small">No dé comida ni bebida.</text>
  <text x="628" y="420" text-anchor="middle" class="small">Si los síntomas se pasan, consulte igual.</text>
</svg>
