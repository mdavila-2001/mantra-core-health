<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hernia de disco lumbar</title>
  <desc id="d">A la izquierda, una vista lateral de las vértebras L3 a L5 con un disco sano y otro herniado que presiona la raíz nerviosa que baja hacia la pierna. A la derecha, el núcleo que sale por una grieta del anillo, los síntomas, los signos de urgencia y la evolución habitual.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Disco que presiona un nervio</text>
  <rect x="90" y="70" width="130" height="74" rx="10" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M220 90 L290 80 L300 110 L220 124 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="70" y="112" text-anchor="end" class="small" style="fill:var(--muted)">L3</text>
  <rect x="90" y="170" width="130" height="74" rx="10" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M220 190 L290 180 L300 210 L220 224 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="70" y="212" text-anchor="end" class="small" style="fill:var(--muted)">L4</text>
  <rect x="90" y="270" width="130" height="74" rx="10" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M220 290 L290 280 L300 310 L220 324 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="70" y="312" text-anchor="end" class="small" style="fill:var(--muted)">L5</text>
  <rect x="92" y="146" width="126" height="22" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="92" y="246" width="126" height="22" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M200 248 C240 244 252 262 230 268 Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="1"/>
  <path d="M240 60 C236 150 236 230 244 400" fill="none" stroke="var(--nerve)" stroke-width="10" opacity=".8"/>
  <path d="M242 266 C270 300 290 340 300 400" fill="none" stroke="var(--nerve)" stroke-width="5"/>
  <circle cx="236" cy="258" r="14" fill="var(--vessel)" stroke="none" stroke-width="2" opacity=".35"/>
  <text x="110" y="194" class="small" style="fill:var(--accent)">Disco sano</text>
  <text x="380" y="236" text-anchor="end" class="small" style="fill:var(--vessel)">Hernia</text>
  <line x1="330" y1="240" x2="250" y2="256" stroke="var(--vessel)" stroke-width="1"/>
  <text x="380" y="120" text-anchor="end" class="small" style="fill:var(--nerve)">Saco</text>
  <text x="380" y="136" text-anchor="end" class="small" style="fill:var(--nerve)">nervioso</text>
  <text x="380" y="380" text-anchor="end" class="small" style="fill:var(--nerve)">Raíz</text>
  <text x="380" y="396" text-anchor="end" class="small" style="fill:var(--nerve)">nerviosa</text>
  <text x="200" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">Vista lateral de la columna lumbar</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Síntomas y alarma</text>
  <circle cx="500" cy="102" r="34" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <circle cx="500" cy="102" r="16" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <path d="M512 92 C534 80 540 94 530 104 Z" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="560" y="92" class="small">El núcleo blando sale</text>
  <text x="560" y="110" class="small">por una grieta del anillo</text>
  <text x="456" y="168" class="small">• Dolor lumbar que baja por la pierna</text>
  <text x="456" y="190" class="small">• Hormigueo o adormecimiento</text>
  <text x="456" y="212" class="small">• Empeora al sentarse o toser</text>
  <rect x="456" y="238" width="304" height="106" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="472" y="262" class="step" style="fill:var(--warn)">Urgencia si aparece</text>
  <text x="480" y="286" class="small">• Pérdida de control de orina o heces</text>
  <text x="480" y="306" class="small">• Adormecimiento en la zona genital</text>
  <text x="480" y="326" class="small">• Debilidad que avanza en las piernas</text>
  <text x="456" y="374" class="step" style="fill:var(--ok)">La mayoría mejora en semanas</text>
  <text x="456" y="396" class="small">con actividad, analgesia y fisioterapia.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
