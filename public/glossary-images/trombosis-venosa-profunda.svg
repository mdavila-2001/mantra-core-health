<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trombosis venosa profunda</title>
  <desc id="d">Pierna con una vena profunda y un coágulo en su interior, la zona hinchada y una flecha hacia el pulmón por el riesgo de embolia. A la derecha, la tríada de Virchow, los factores de riesgo y los signos de embolia pulmonar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Coágulo en una vena profunda</text>
<path d="M140,60 L130,250 Q126,300 140,360 L150,400 L230,400 L222,360 Q232,300 230,250 L250,60 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196,60 L190,250 Q186,300 196,380" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="190" cy="280" rx="8" ry="34" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="2"/>
<ellipse cx="210" cy="300" rx="52" ry="70" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="300" y="256" class="step" style="fill:var(--vessel)">Trombo</text>
<line x1="296" y1="252" x2="202" y2="276" stroke="var(--vessel)" stroke-width="1.5"/>
<text x="300" y="300" class="small">Pierna hinchada,</text>
<text x="300" y="316" class="small">dolor, calor</text>
<text x="300" y="332" class="small">y enrojecimiento</text>
<text x="270" y="90" class="small">Vena</text>
<text x="270" y="106" class="small">profunda</text>
<line x1="266" y1="96" x2="204" y2="110" stroke="var(--muted)" stroke-width="1.5"/>
<text x="220" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">Riesgo: que se suelte y llegue al pulmón</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Tríada de Virchow</text>
<path d="M608,100 L520,174 L700,174 Z" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="552" y="54" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="608.0" y="74.7" text-anchor="middle" class="small" style="fill:var(--on)">Sangre</text>
<text x="608.0" y="89.7" text-anchor="middle" class="small" style="fill:var(--on)">estancada</text>
<rect x="444" y="166" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="500.0" y="186.7" text-anchor="middle" class="small" style="fill:var(--on)">Daño de</text>
<text x="500.0" y="201.7" text-anchor="middle" class="small" style="fill:var(--on)">la vena</text>
<rect x="660" y="166" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="716.0" y="186.7" text-anchor="middle" class="small" style="fill:var(--on)">Más</text>
<text x="716.0" y="201.7" text-anchor="middle" class="small" style="fill:var(--on)">coagulable</text>
<text x="456" y="248" class="small">Inmovilidad, cirugía, cáncer, embarazo,</text>
<text x="456" y="266" class="small">anticonceptivos, viajes largos.</text>
<rect x="456" y="284" width="304" height="106" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="468" y="306" class="step" style="fill:var(--warn)">Urgencias (embolia pulmonar):</text>
<text x="468" y="330" class="lab">• Falta de aire repentina</text>
<text x="468" y="354" class="lab">• Dolor en el pecho al respirar</text>
<text x="468" y="378" class="lab">• Tos con sangre o desmayo</text>
<text x="456" y="416" class="step">Tratamiento: anticoagulantes.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
