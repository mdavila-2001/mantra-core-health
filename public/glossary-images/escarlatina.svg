<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Escarlatina</title>
  <desc id="d">A la izquierda, la cara de un niño con mejillas enrojecidas, palidez alrededor de la boca y lengua de fresa, y la nota de una erupción áspera en el tronco. A la derecha, el estreptococo del grupo A y su toxina como causa, el contagio y el tratamiento antibiótico.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Signos característicos</text>
  <ellipse cx="200" cy="200" rx="92" ry="118" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="104" cy="204" rx="12" ry="26" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="296" cy="204" rx="12" ry="26" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="166" cy="190" rx="12" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <ellipse cx="234" cy="190" rx="12" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M200 196 L190 236 H210" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M176 262 Q200 274 224 262" fill="none" stroke="var(--organ-d)" stroke-width="2"/>
  <ellipse cx="200" cy="268" rx="18" ry="10" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <circle cx="194" cy="266" r="1.6" fill="var(--on)" stroke="none" stroke-width="2"/>
  <circle cx="204" cy="270" r="1.6" fill="var(--on)" stroke="none" stroke-width="2"/>
  <circle cx="198" cy="272" r="1.6" fill="var(--on)" stroke="none" stroke-width="2"/>
  <ellipse cx="152" cy="230" rx="22" ry="14" fill="var(--vessel)" stroke="none" stroke-width="2" opacity=".35"/>
  <ellipse cx="248" cy="230" rx="22" ry="14" fill="var(--vessel)" stroke="none" stroke-width="2" opacity=".35"/>
  <path d="M200 252 m-14 0 a14 8 0 0 0 28 0" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="60" y="120" class="small">Mejillas rojas</text>
  <line x1="110" y1="126" x2="150" y2="220" stroke="var(--muted)" stroke-width="1"/>
  <text x="60" y="340" class="small">Lengua</text>
  <text x="60" y="356" class="small">de fresa</text>
  <line x1="110" y1="344" x2="186" y2="272" stroke="var(--muted)" stroke-width="1"/>
  <text x="340" y="120" text-anchor="end" class="small">Palidez</text>
  <text x="340" y="136" text-anchor="end" class="small">alrededor</text>
  <text x="340" y="152" text-anchor="end" class="small">de la boca</text>
  <line x1="300" y1="150" x2="226" y2="252" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="394" text-anchor="middle" class="small">Erupción áspera como papel de lija</text>
  <text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">en cuello, tronco y pliegues</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Cómo se produce</text>
  <rect x="436" y="66" width="150" height="56" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="511.0" y="90.5" text-anchor="middle" class="lab">Estreptococo</text>
  <text x="511.0" y="107.5" text-anchor="middle" class="lab">del grupo A</text>
  <rect x="610" y="66" width="150" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="685.0" y="90.5" text-anchor="middle" class="lab">Toxina que causa</text>
  <text x="685.0" y="107.5" text-anchor="middle" class="lab">la erupción</text>
  <line x1="586" y1="94" x2="608" y2="94" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <text x="436" y="152" class="small" style="fill:var(--muted)">Contagio por gotitas al toser o hablar</text>
  <text x="444" y="184" class="small">• Fiebre y dolor de garganta</text>
  <text x="444" y="208" class="small">• Sobre todo en niños de 5 a 15 años</text>
  <text x="444" y="232" class="small">• Se confirma con prueba de garganta</text>
  <rect x="436" y="270" width="324" height="152" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="452" y="296" class="step">Tratamiento</text>
  <text x="460" y="320" class="small">• Antibiótico indicado por el médico</text>
  <text x="460" y="338" class="small">• Completar todo el tratamiento</text>
  <text x="460" y="356" class="small">• Evita complicaciones como la</text>
  <text x="460" y="374" class="small">• fiebre reumática</text>
  <text x="460" y="392" class="small">• Volver a clase tras 12 a 24 h de antibiótico</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
