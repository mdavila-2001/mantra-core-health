<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trastorno bipolar: episodios del ánimo</title>
  <desc id="d">Una línea ondulada recorre el tiempo alrededor de una línea de ánimo estable, con un pico de manía, un valle de depresión y un pico menor de hipomanía. Debajo, tres recuadros describen la manía, la depresión y el tratamiento con estabilizadores del ánimo, psicoterapia y rutinas de sueño.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Trastorno bipolar: cambios del estado de ánimo</text>
<line x1="60" y1="200" x2="740" y2="200" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="64" y="192" class="small" style="fill:var(--muted)">Ánimo estable</text>
<path d="M60 200 C110 200 130 90 180 90 C230 90 240 200 290 200 C330 200 340 300 390 300 C440 300 450 200 500 200 C540 200 560 130 600 130 C640 130 650 200 700 200 L740 200" fill="none" stroke="var(--purple)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="180" y="76" text-anchor="middle" class="step" style="fill:var(--warn)">Manía</text>
<text x="390" y="326" text-anchor="middle" class="step" style="fill:var(--accent)">Depresión</text>
<text x="600" y="116" text-anchor="middle" class="step" style="fill:var(--warn)">Hipomanía</text>
<rect x="40" y="348" width="230" height="78" rx="10" fill="var(--warn-l)"/>
<text x="56" y="370" class="step" style="fill:var(--warn)">Manía</text>
<text x="56" y="390" class="small">Euforia o irritabilidad, poco</text>
<text x="56" y="406" class="small">sueño, ideas aceleradas, riesgos</text>
<rect x="285" y="348" width="230" height="78" rx="10" fill="var(--accent-l)"/>
<text x="301" y="370" class="step" style="fill:var(--accent)">Depresión</text>
<text x="301" y="390" class="small">Tristeza, desinterés, cansancio,</text>
<text x="301" y="406" class="small">ideas de muerte</text>
<rect x="530" y="348" width="230" height="78" rx="10" fill="var(--ok-l)"/>
<text x="546" y="370" class="step" style="fill:var(--ok)">Tratamiento</text>
<text x="546" y="390" class="small">Estabilizadores del ánimo,</text>
<text x="546" y="406" class="small">psicoterapia, rutinas de sueño</text>
<text x="740" y="240" text-anchor="end" class="small" style="fill:var(--muted)">Tiempo</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
