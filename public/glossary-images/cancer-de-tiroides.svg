<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cáncer de tiroides</title>
  <desc id="d">A la izquierda, el cuello con la tráquea y la glándula tiroides en forma de mariposa delante de ella, con un nódulo en un lóbulo. A la derecha, barras sin escala de los tipos principales, del papilar, el más frecuente, al anaplásico, raro; el estudio del nódulo con ecografía, punción y citología; y los tratamientos habituales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Dónde está</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Tipos y cómo se estudia</text>
<path d="M150 70 C150 60 250 60 250 70 L262 330 L138 330 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="186" y="80" width="28" height="250" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
<text x="250" y="96" class="small" style="fill:var(--accent)">Tráquea</text>
<path d="M200 210 C190 196 160 160 140 170 C116 182 120 250 150 262 C176 270 190 240 200 236 C210 240 224 270 250 262 C280 250 284 182 260 170 C240 160 210 196 200 210 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="254" cy="222" r="14" fill="var(--purple)" stroke="var(--panel)" stroke-width="2"/>
<text x="40" y="226" class="small">Lóbulo</text>
<text x="40" y="242" class="small">derecho</text>
<text x="290" y="210" class="small" style="fill:var(--purple)">Nódulo</text>
<line x1="288" y1="214" x2="270" y2="220" stroke="var(--purple)" stroke-width="1.5"/>
<text x="200" y="360" text-anchor="middle" class="lab">Glándula en forma de mariposa</text>
<text x="200" y="378" text-anchor="middle" class="lab">delante de la tráquea</text>
<text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">Suele notarse como un bulto en el cuello.</text>
<text x="416" y="76" class="h">Tipos principales</text>
<text x="416" y="106" class="small">Papilar</text>
<rect x="500" y="92" width="126.0" height="18" rx="4" fill="var(--purple)" opacity="0.90"/>
<text x="636.0" y="106" class="small" style="fill:var(--muted)">el más frecuente</text>
<text x="416" y="136" class="small">Folicular</text>
<rect x="500" y="122" width="43.5" height="18" rx="4" fill="var(--purple)" opacity="0.75"/>
<text x="416" y="166" class="small">Medular</text>
<rect x="500" y="152" width="21.0" height="18" rx="4" fill="var(--purple)" opacity="0.60"/>
<text x="416" y="196" class="small">Anaplásico</text>
<rect x="500" y="182" width="13.5" height="18" rx="4" fill="var(--purple)" opacity="0.45"/>
<text x="523.5" y="196" class="small" style="fill:var(--muted)">raro y agresivo</text>
<text x="416" y="230" class="h">Cómo se estudia un nódulo</text>
<rect x="416" y="246" width="104" height="36" rx="8" fill="var(--accent)"/>
<text x="468.0" y="268.7" text-anchor="middle" class="lab" style="fill:var(--on)">Ecografía</text>
<line x1="520" y1="264" x2="532" y2="264" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="534" y="246" width="104" height="36" rx="8" fill="var(--purple)"/>
<text x="586.0" y="268.7" text-anchor="middle" class="lab" style="fill:var(--on)">Punción</text>
<line x1="638" y1="264" x2="650" y2="264" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="652" y="246" width="104" height="36" rx="8" fill="var(--ok)"/>
<text x="704.0" y="268.7" text-anchor="middle" class="lab" style="fill:var(--on)">Citología</text>
<text x="416" y="318" class="h">Tratamiento habitual</text>
<text x="416" y="344" class="lab">• Cirugía de la tiroides</text>
<text x="416" y="368" class="lab">• Yodo radiactivo en algunos casos</text>
<text x="416" y="392" class="lab">• Hormona tiroidea de reemplazo</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
