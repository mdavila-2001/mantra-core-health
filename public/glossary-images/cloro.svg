<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de cloruro (cloro) en sangre</title>
  <desc id="d">A la izquierda, un recuadro de líquido extracelular con iones de cloruro y de sodio mezclados, y tres funciones relacionadas: agua, equilibrio ácido y riñón. A la derecha, un tubo de sangre y las situaciones en las que cambia el cloruro, como vómitos, diarrea, deshidratación, trastornos ácido-base o enfermedad renal.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">El cloruro en la sangre</text>
  <rect x="44" y="64" width="332" height="200" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="60" y="86" class="small muted">Líquido extracelular</text>
  <circle cx="80" cy="120" r="15" fill="var(--accent)"/>
  <text x="80" y="125" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <circle cx="150" cy="110" r="15" fill="var(--warn)"/>
  <text x="150" y="115" text-anchor="middle" class="small" style="fill:var(--on)">Na⁺</text>
  <circle cx="230" cy="125" r="15" fill="var(--accent)"/>
  <text x="230" y="130" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <circle cx="310" cy="115" r="15" fill="var(--warn)"/>
  <text x="310" y="120" text-anchor="middle" class="small" style="fill:var(--on)">Na⁺</text>
  <circle cx="100" cy="180" r="15" fill="var(--accent)"/>
  <text x="100" y="185" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <circle cx="190" cy="170" r="15" fill="var(--warn)"/>
  <text x="190" y="175" text-anchor="middle" class="small" style="fill:var(--on)">Na⁺</text>
  <circle cx="270" cy="185" r="15" fill="var(--accent)"/>
  <text x="270" y="190" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <circle cx="340" cy="170" r="15" fill="var(--warn)"/>
  <text x="340" y="175" text-anchor="middle" class="small" style="fill:var(--on)">Na⁺</text>
  <circle cx="130" cy="235" r="15" fill="var(--accent)"/>
  <text x="130" y="240" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <circle cx="220" cy="232" r="15" fill="var(--warn)"/>
  <text x="220" y="237" text-anchor="middle" class="small" style="fill:var(--on)">Na⁺</text>
  <circle cx="300" cy="238" r="15" fill="var(--accent)"/>
  <text x="300" y="243" text-anchor="middle" class="small" style="fill:var(--on)">Cl⁻</text>
  <text x="210" y="290" text-anchor="middle" class="lab">El cloruro (Cl⁻) acompaña al sodio (Na⁺)</text>
  <text x="210" y="312" text-anchor="middle" class="small muted">y es el principal ion negativo fuera de las células</text>
  <rect x="44" y="336" width="100" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="94.0" y="357.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Agua</text>
  <rect x="160" y="336" width="100" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="210.0" y="357.32" text-anchor="middle" class="small" style="fill:var(--ink)">Equilibrio ácido</text>
  <rect x="276" y="336" width="100" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="326.0" y="357.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Riñón</text>
  <text x="210" y="400" text-anchor="middle" class="small muted">Su nivel sigue al agua, al sodio y al bicarbonato</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué ayuda a valorar</text>
  <rect x="438" y="66" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M440 82 V146 a15 15 0 0 0 30 0 V82 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M442 112 V146 a13 13 0 0 0 26 0 V112 Z" fill="var(--vessel)"/>
  <text x="486" y="96" class="lab">Suero o plasma</text>
  <text x="486" y="118" class="small muted">Forma parte de los electrolitos</text>
  <text x="486" y="136" class="small muted">y del panel metabólico</text>
  <text x="436" y="210" class="step">Cambia, por ejemplo, con</text>
  <text x="440" y="238" class="lab">• Vómitos o diarrea intensos</text>
  <text x="440" y="264" class="lab">• Deshidratación o exceso de líquidos</text>
  <text x="440" y="290" class="lab">• Alteraciones ácido-base</text>
  <text x="440" y="316" class="lab">• Enfermedades del riñón</text>
  <text x="440" y="342" class="lab">• Algunos medicamentos (diuréticos)</text>
  <text x="598" y="404" text-anchor="middle" class="small muted">Se interpreta junto al sodio</text>
  <text x="598" y="422" text-anchor="middle" class="small muted">y al bicarbonato (CO₂)</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
