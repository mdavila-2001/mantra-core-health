<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo actúa el ácaro de la sarna</title>
  <desc id="d">Corte de la piel con un túnel en la epidermis excavado por la hembra del ácaro, que deja huevos a lo largo del recorrido. Abajo, las zonas del cuerpo donde suele aparecer, como entre los dedos o las muñecas. A la derecha, el contagio y las claves del tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Escabiosis (sarna): un ácaro que excava la piel</text>
  <rect x="20" y="60" width="420" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="90" text-anchor="middle" class="title">El túnel en la piel</text>
  <rect x="40" y="110" width="380" height="60" rx="2" fill="var(--skin)" stroke="var(--muted)"/>
  <rect x="40" y="170" width="380" height="90" rx="2" fill="var(--organ)" stroke="none" opacity=".4"/>
  <path d="M120 116 C140 140 200 150 260 140 C300 132 330 140 350 150" fill="none" stroke="var(--warn)" stroke-width="8" opacity=".55" stroke-linecap="round"/>
  <ellipse cx="130" cy="142" rx="5" ry="4" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="170" cy="142" rx="5" ry="4" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="210" cy="142" rx="5" ry="4" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="250" cy="142" rx="5" ry="4" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="290" cy="140" rx="5" ry="4" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="358" cy="152" rx="14" ry="10" fill="var(--ink)" stroke="none"/>
  <path d="M346 160 l-6 8 M352 162 l-2 9 M364 162 l2 9 M370 160 l6 8" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="56" y="130" class="small">Epidermis</text>
  <text x="56" y="196" class="small">Dermis</text>
  <line x1="360" y1="165" x2="360" y2="216" stroke="var(--muted)" stroke-width="1"/>
  <text x="340" y="232" text-anchor="middle" class="small b">Hembra del ácaro</text>
  <text x="190" y="232" text-anchor="middle" class="small">Huevos en el túnel</text>
  <line x1="190" y1="218" x2="200" y2="150" stroke="var(--muted)" stroke-width="1"/>
  <text x="230" y="262" text-anchor="middle" class="small muted">La reacción alérgica da el picor</text>
  <rect x="20" y="296" width="420" height="144" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="326" text-anchor="middle" class="title">Dónde suele aparecer</text>
  <text x="38" y="354" class="lab">• Entre los dedos</text>
  <text x="38" y="380" class="lab">• Muñecas y codos</text>
  <text x="38" y="406" class="lab">• Axilas y cintura</text>
  <text x="238" y="354" class="lab">• Genitales</text>
  <text x="238" y="380" class="lab">• Alrededor del pezón</text>
  <text x="238" y="406" class="lab">• Bebés: palmas y plantas</text>
  <rect x="456" y="60" width="324" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="90" text-anchor="middle" class="title">Claves</text>
  <text x="474" y="110" class="small">• Picor intenso, peor de noche</text>
  <text x="474" y="136" class="small">• Contagio por contacto</text>
  <text x="485" y="162" class="small">piel con piel prolongado</text>
  <text x="474" y="188" class="small">• Puede haber varios</text>
  <text x="485" y="214" class="small">casos en casa</text>
  <text x="474" y="262" class="lab b">Tratamiento</text>
  <text x="474" y="288" class="small">• Tratar a todos los</text>
  <text x="485" y="312" class="small">convivientes a la vez</text>
  <text x="474" y="336" class="small">• Lavar ropa y sábanas</text>
  <text x="485" y="360" class="small">en caliente</text>
  <text x="474" y="384" class="small">• El picor puede durar</text>
  <text x="485" y="408" class="small">semanas tras curar</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
