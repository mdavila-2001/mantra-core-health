<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Emetología</title>
  <desc id="d">A la izquierda, el centro del vómito en el tronco del encéfalo recibe señales de cuatro fuentes: estómago e intestino por el nervio vago, la zona gatillo sensible a fármacos y toxinas, el oído interno en el mareo y la corteza cerebral con olores o ansiedad, y desencadena náuseas y vómito. A la derecha, las situaciones que abarca, cómo actúan los antieméticos y los signos de alarma.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="520" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="280.0" y="50" text-anchor="middle" class="title">Cómo se desencadena el vómito</text>
  <rect x="200" y="190" width="140" height="70" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="270" y="218" text-anchor="middle" class="step">Centro del vómito</text>
  <text x="270" y="238" text-anchor="middle" class="small">tronco del encéfalo</text>
  <rect x="40" y="70" width="160" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="120" y="94" text-anchor="middle" class="step">Estómago e intestino</text>
  <text x="120" y="114" text-anchor="middle" class="small">irritación, nervio vago</text>
  <rect x="360" y="70" width="160" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="440" y="94" text-anchor="middle" class="step">Zona gatillo</text>
  <text x="440" y="114" text-anchor="middle" class="small">fármacos, toxinas</text>
  <rect x="40" y="330" width="160" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="120" y="354" text-anchor="middle" class="step">Oído interno</text>
  <text x="120" y="374" text-anchor="middle" class="small">mareo por movimiento</text>
  <rect x="360" y="330" width="160" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="440" y="354" text-anchor="middle" class="step">Corteza cerebral</text>
  <text x="440" y="374" text-anchor="middle" class="small">olores, ansiedad</text>
  <path d="M160 132 L220 186" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M380 132 L320 186" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M160 328 L220 264" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M380 328 L320 264" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M342 225 L388 225" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="456" y="220" text-anchor="middle" class="small">Náuseas</text>
  <text x="456" y="236" text-anchor="middle" class="small">y vómito</text>
  <rect x="560" y="20" width="220" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="670.0" y="50" text-anchor="middle" class="title">Qué abarca</text>
  <text x="576" y="74" class="small">• Mareo y cinetosis</text>
  <text x="576" y="98" class="small">• Embarazo</text>
  <text x="576" y="122" class="small">• Quimioterapia</text>
  <text x="576" y="146" class="small">• Tras la anestesia</text>
  <text x="576" y="170" class="small">• Infecciones</text>
  <text x="576" y="222" class="step">Antieméticos</text>
  <text x="576" y="244" class="small">Bloquean receptores</text>
  <text x="576" y="262" class="small">en esas vías</text>
  <text x="576" y="306" text-anchor="fill:var(--bad)" class="step">Vigilar</text>
  <text x="576" y="330" class="small">• Deshidratación</text>
  <text x="576" y="352" class="small">• Sangre en el vómito</text>
  <text x="576" y="374" class="small">• Dolor intenso</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
