<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Zonas del cuerpo con más riesgo según la postura</title>
  <desc id="d">Dos siluetas laterales esquemáticas, una en decúbito supino y otra sentada, con puntos rojos en las zonas de apoyo donde se concentran las lesiones: occipucio, escápulas, sacro y talones en decúbito supino; isquiones, sacro y cóccix y talones sentado. Una franja inferior enumera las zonas de riesgo en decúbito lateral y prono y las lesiones por dispositivos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#2f6fb3; --a-l:#dbe8f6; --b:#1f8a5b; --b-l:#d9f0e5; --c:#a86a0f; --c-l:#f8ebd0; --d:#c0392b; --d-l:#f7dcd8; --skin:#f0c9b0; --fat:#f4e3a8; --mus:#d98a7c; --bone:#e9e4d6; --p:#7b3b6e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#7fb3ea; --a-l:#243a52; --b:#4cc38a; --b-l:#1f3b30; --c:#e3b04f; --c-l:#42361b; --d:#ef7467; --d-l:#47241f; --skin:#a8745e; --fat:#8a7a3a; --mus:#a65a4e; --bone:#8d8a7c; --p:#b77ab0; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .m { fill: var(--muted); }
    .t { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 14px; }
    .n { font-size: 13px; }
    .k { font-size: 24px; font-weight: 800; }
    .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="34" text-anchor="middle" class="t">Dónde se concentra la presión</text>
  <rect x="24" y="52" width="372" height="312" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="404" y="52" width="372" height="312" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210" y="80" text-anchor="middle" class="h">Acostado boca arriba (decúbito supino)</text>
  <text x="590" y="80" text-anchor="middle" class="h">Sentado</text>
  <!-- supino -->
  <g transform="translate(0 40)">
    <rect x="40" y="152" width="340" height="14" rx="4" fill="var(--bg)" stroke="var(--line)"/>
    <circle cx="74" cy="124" r="24" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="98" y="104" width="142" height="48" rx="22" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="228" y="108" width="130" height="44" rx="18" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="344" y="132" width="30" height="20" rx="8" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <g fill="var(--d)" stroke="var(--panel)" stroke-width="2">
      <circle cx="68" cy="147" r="8"/>
      <circle cx="132" cy="151" r="8"/>
      <circle cx="238" cy="151" r="8"/>
      <circle cx="354" cy="151" r="8"/>
    </g>
    <g class="ln" stroke-width="1.5">
      <path d="M68 156 V196"/><path d="M132 160 V176"/><path d="M238 160 V196"/><path d="M354 160 V176"/>
    </g>
    <text x="68" y="212" text-anchor="middle" class="n">Occipucio</text>
    <text x="132" y="192" text-anchor="middle" class="n">Escápulas</text>
    <text x="238" y="212" text-anchor="middle" class="n">Sacro</text>
    <text x="350" y="192" text-anchor="middle" class="n">Talones</text>
  </g>
  <text x="210" y="320" text-anchor="middle" class="n m">El sacro y los talones son sitios muy frecuentes</text>
  <text x="210" y="338" text-anchor="middle" class="n m">en personas encamadas.</text>
  <!-- sentado -->
  <g transform="translate(0 -12)">
    <rect x="470" y="262" width="180" height="10" rx="3" fill="var(--bg)" stroke="var(--line)"/>
    <rect x="620" y="330" width="70" height="12" rx="4" fill="var(--bg)" stroke="var(--line)"/>
    <circle cx="520" cy="130" r="22" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="496" y="156" width="50" height="104" rx="20" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="496" y="226" width="150" height="34" rx="16" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="618" y="246" width="30" height="86" rx="12" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <rect x="618" y="318" width="64" height="16" rx="8" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
    <g fill="var(--d)" stroke="var(--panel)" stroke-width="2">
      <circle cx="514" cy="258" r="8"/>
      <circle cx="498" cy="238" r="8"/>
      <circle cx="622" cy="330" r="8"/>
    </g>
    <g class="ln" stroke-width="1.5">
      <path d="M514 266 V296"/><path d="M490 240 L466 226"/><path d="M622 338 V352"/>
    </g>
    <text x="514" y="312" text-anchor="middle" class="n">Isquiones</text>
    <text x="446" y="206" text-anchor="middle" class="n">Sacro y</text>
    <text x="446" y="223" text-anchor="middle" class="n">cóccix</text>
    <text x="622" y="356" text-anchor="middle" class="n">Talones</text>
  </g>
  <rect x="24" y="376" width="752" height="74" rx="12" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="40" y="398" class="n"><tspan class="h">De lado:</tspan> trocánter, maléolo externo, hombro, oreja, rodilla, crestas ilíacas.</text>
  <text x="40" y="418" class="n"><tspan class="h">Boca abajo:</tspan> mejillas, orejas, hombros, crestas ilíacas, rodillas, dedos de los pies.</text>
  <text x="40" y="438" class="n"><tspan class="h">En cualquier postura:</tspan> piel bajo mascarillas, sondas, férulas y otros dispositivos.</text>
  <text x="400" y="470" text-anchor="middle" class="n m">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
