<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Fibromialgia</title>
  <desc id="d">A la izquierda, una silueta humana con zonas de dolor repartidas por ambos lados del cuerpo, por encima y por debajo de la cintura. A la derecha, los síntomas que se combinan: dolor persistente, cansancio, sueño poco reparador y niebla mental, y las medidas que ayudan: ejercicio gradual, higiene del sueño, terapia psicológica y fármacos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dolor generalizado</text>
  <g transform="translate(210 64) scale(1.05)" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5">
    <circle cx="0" cy="26" r="24"/>
    <rect x="-9" y="48" width="18" height="12"/>
    <path d="M-52 62 Q0 52 52 62 L56 200 Q0 214 -56 200 Z"/>
    <path d="M-52 64 Q-70 70 -74 120 L-80 200 Q-82 210 -72 210 L-64 130 L-56 100 Z"/>
    <path d="M52 64 Q70 70 74 120 L80 200 Q82 210 72 210 L64 130 L56 100 Z"/>
    <path d="M-54 198 L-50 320 Q-48 330 -36 330 L-28 330 L-6 214 Z"/>
    <path d="M54 198 L50 320 Q48 330 36 330 L28 330 L6 214 Z"/>
  </g>
  <circle cx="178.5" cy="127.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="241.5" cy="127.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="151.2" cy="148.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="268.8" cy="148.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="189.0" cy="190.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="231.0" cy="190.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="134.4" cy="211.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="285.6" cy="211.0" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="174.3" cy="284.5" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="245.7" cy="284.5" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="168.0" cy="347.5" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="252.0" cy="347.5" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="210.0" cy="133.3" r="12" fill="var(--bad)" opacity=".35"/>
  <circle cx="210.0" cy="253.0" r="12" fill="var(--bad)" opacity=".35"/>
  <text x="210" y="428" text-anchor="middle" class="small muted">Ambos lados del cuerpo, arriba y abajo</text>
  <rect x="420" y="20" width="360" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="600.0" y="50" text-anchor="middle" class="title">Síntomas que se combinan</text>
  <rect x="440" y="58" width="320" height="50" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="456" y="79" class="step">Dolor</text>
  <text x="456" y="98" class="small">Persistente, en muchas zonas</text>
  <rect x="440" y="120" width="320" height="50" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="456" y="141" class="step">Cansancio</text>
  <text x="456" y="160" class="small">Fatiga que no mejora</text>
  <rect x="440" y="182" width="320" height="50" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="456" y="203" class="step">Sueño</text>
  <text x="456" y="222" class="small">Poco reparador</text>
  <rect x="440" y="244" width="320" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="456" y="265" class="step">Niebla mental</text>
  <text x="456" y="284" class="small">Memoria y concentración</text>
  <text x="440" y="330" class="step">Qué ayuda</text>
  <rect x="440" y="342" width="156" height="36" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="518.0" y="365.0" text-anchor="middle" class="small">Ejercicio gradual</text>
  <rect x="604" y="342" width="156" height="36" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="682.0" y="365.0" text-anchor="middle" class="small">Higiene del sueño</text>
  <rect x="440" y="388" width="156" height="36" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="518.0" y="411.0" text-anchor="middle" class="small">Terapia psicológica</text>
  <rect x="604" y="388" width="156" height="36" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="682.0" y="411.0" text-anchor="middle" class="small">Fármacos si hace falta</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
