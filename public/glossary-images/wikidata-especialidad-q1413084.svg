<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Coloproctología</title>
  <desc id="d">A la izquierda, el intestino grueso con el ciego, el colon ascendente, transverso y descendente, el sigma, el recto y el ano, con un pólipo y divertículos marcados. A la derecha, lo que trata la coloproctología, como hemorroides, fístulas, pólipos y cáncer, diverticulitis y enfermedad inflamatoria, y sus herramientas: colonoscopia, rectoscopia, laparoscopia y ecografía anal.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="460" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="50" text-anchor="middle" class="title">Colon, recto y ano</text>
  <path d="M130 360 V140 Q130 100 170 100 H330 Q370 100 370 140 V290 Q370 330 330 330 Q290 330 270 350 L262 380 L262 420" fill="none" stroke="var(--organ)" stroke-width="40" stroke-linecap="round" opacity=".7"/>
  <circle cx="130" cy="372" r="18" fill="var(--organ)" opacity=".9"/>
  <text x="250" y="92" text-anchor="middle" class="small">Colon transverso</text>
  <text x="78" y="240" text-anchor="middle" class="small">Ascendente</text>
  <text x="420" y="220" text-anchor="middle" class="small">Descend.</text>
  <text x="330" y="370" class="small">Sigma</text>
  <text x="300" y="410" class="small">Recto</text>
  <text x="276" y="440" class="small">Ano</text>
  <text x="80" y="400" text-anchor="middle" class="small">Ciego</text>
  <circle cx="362" cy="250" r="6" fill="var(--purple)"/><circle cx="346" cy="290" r="5" fill="var(--purple)"/>
  <text x="250" y="260" text-anchor="middle" class="small" style="fill:var(--purple)">Divertículos</text>
  <circle cx="200" cy="100" r="9" fill="var(--bad)"/>
  <text x="200" y="140" text-anchor="middle" class="small" style="fill:var(--bad)">Pólipo</text>
  <rect x="500" y="20" width="280" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="50" text-anchor="middle" class="title">Qué trata</text>
  <rect x="516" y="58" width="248" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="80.0" text-anchor="middle" class="small">Hemorroides y fisuras</text>
  <rect x="516" y="102" width="248" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="124.0" text-anchor="middle" class="small">Fístulas y abscesos</text>
  <rect x="516" y="146" width="248" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="168.0" text-anchor="middle" class="small">Pólipos y cáncer</text>
  <rect x="516" y="190" width="248" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="212.0" text-anchor="middle" class="small">Diverticulitis</text>
  <rect x="516" y="234" width="248" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="256.0" text-anchor="middle" class="small">Enfermedad inflamatoria</text>
  <text x="516" y="300" class="step">Herramientas</text>
  <rect x="516" y="314" width="120" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="576.0" y="336.0" text-anchor="middle" class="small">Colonoscopia</text>
  <rect x="644" y="314" width="120" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="704.0" y="336.0" text-anchor="middle" class="small">Rectoscopia</text>
  <rect x="516" y="358" width="120" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="576.0" y="380.0" text-anchor="middle" class="small">Laparoscopia</text>
  <rect x="644" y="358" width="120" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="704.0" y="380.0" text-anchor="middle" class="small">Ecografía anal</text>
  <text x="640" y="428" text-anchor="middle" class="small muted">Une consulta, endoscopia y cirugía</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
