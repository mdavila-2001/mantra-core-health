<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Várices de las piernas</title>
  <desc id="d">A la izquierda, una pierna con una vena superficial dilatada y tortuosa. A la derecha, comparación entre una vena con la válvula sana, en la que la sangre sube hacia el corazón, y otra con la válvula dañada, en la que la sangre retrocede y se acumula; debajo, síntomas, medidas útiles y cuándo consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Venas de la pierna</text>
  <path d="M130 72 C120 160 130 260 140 360 L150 420 H210 L220 360 C240 260 250 160 240 72 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M200 80 C196 120 210 150 196 190 C182 230 214 250 200 290 C186 330 214 350 196 400" fill="none" stroke="var(--vein)" stroke-width="7" stroke-linecap="round"/>
  <path d="M170 220 c-10 10 10 20 0 30 c-10 10 10 20 0 30" fill="none" stroke="var(--vein)" stroke-width="4"/>
  <text x="260" y="220" class="small">Vena dilatada</text>
  <text x="260" y="236" class="small">y tortuosa</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Válvulas que fallan</text>
  <rect x="480" y="70" width="60" height="200" rx="12" fill="var(--accent-l)" stroke="var(--vein)" stroke-width="2"/>
  <path d="M480 160 L510 140 L540 160" fill="none" stroke="var(--vein)" stroke-width="3"/>
  <line x1="510" y1="250" x2="510" y2="180" stroke="var(--ok)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="510" y="292" text-anchor="middle" class="step" style="fill:var(--ok)">Válvula sana</text>
  <path d="M650 70 V130 C624 170 624 210 650 250 V270 H710 V250 C736 210 736 170 710 130 V70 Z" fill="var(--accent-l)" stroke="var(--vein)" stroke-width="2"/>
  <path d="M650 160 L668 152 M710 160 L692 152" fill="none" stroke="var(--vein)" stroke-width="3"/>
  <line x1="680" y1="140" x2="680" y2="230" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="680" y="292" text-anchor="middle" class="step" style="fill:var(--warn)">Válvula dañada</text>
  <text x="510" y="312" text-anchor="middle" class="small muted">sangre sube</text>
  <text x="680" y="312" text-anchor="middle" class="small muted">sangre se acumula</text>
  <text x="436" y="344" class="small">• Pesadez, hinchazón, calambres</text>
  <text x="436" y="366" class="small">• Ayudan: caminar, piernas en alto, medias</text>
  <text x="436" y="400" class="small" style="fill:var(--warn)">Consultar si hay dolor, calor o úlcera</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
