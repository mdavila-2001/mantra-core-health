<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El duelo como proceso que oscila</title>
  <desc id="d">Dos recuadros, mirar la pérdida y reconstruir la vida, y una línea ondulada que va y viene entre ellos a lo largo del tiempo, con olas que se suavizan. A la derecha, las reacciones comunes del duelo y las situaciones en las que conviene pedir ayuda.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Duelo: un proceso que oscila</text>
  <rect x="20" y="60" width="480" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="260.0" y="88" text-anchor="middle" class="title">Ir y venir entre dos tareas</text>
  <rect x="40" y="104" width="200" height="70" rx="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="140.0" y="136.0" text-anchor="middle" class="lab b">Mirar la pérdida</text>
  <text x="140.0" y="153.0" text-anchor="middle" class="small muted">llorar, recordar, extrañar</text>
  <rect x="280" y="104" width="200" height="70" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="380.0" y="136.0" text-anchor="middle" class="lab b">Reconstruir la vida</text>
  <text x="380.0" y="153.0" text-anchor="middle" class="small muted">rutinas, nuevos roles</text>
  <polyline points="60,260.0 64,268.4 68,276.4 72,284.0 76,290.8 80,296.9 84,302.0 88,306.0 92,308.9 96,310.6 100,311.0 104,310.3 108,308.4 112,305.4 116,301.3 120,296.4 124,290.6 128,284.3 132,277.4 136,270.3 140,263.0 144,255.8 148,248.8 152,242.2 156,236.2 160,230.7 164,226.1 168,222.4 172,219.6 176,217.8 180,217.0 184,217.2 188,218.5 192,220.7 196,223.8 200,227.7 204,232.3 208,237.5 212,243.0 216,248.9 220,254.9 224,261.0 228,266.8 232,272.4 236,277.6 240,282.3 244,286.3 248,289.7 252,292.2 256,294.0 260,294.9 264,295.0 268,294.2 272,292.7 276,290.4 280,287.4 284,283.9 288,279.9 292,275.5 296,270.8 300,266.1 304,261.2 308,256.5 312,252.0 316,247.8 320,244.0 324,240.6 328,237.8 332,235.7 336,234.1 340,233.2 344,233.0 348,233.4 352,234.4 356,236.0 360,238.1 364,240.7 368,243.7 372,246.9 376,250.4 380,254.0 384,257.6 388,261.1 392,264.5 396,267.7 400,270.6 404,273.1 408,275.2 412,276.9 416,278.1 420,278.8 424,279.1 428,278.9 432,278.2 436,277.1 440,275.7 444,273.9 448,271.9 452,269.7 456,267.4 460,265.0" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M60 330 L470 330" fill="none" stroke="var(--line)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="260" y="352" text-anchor="middle" class="small muted">Tiempo</text>
  <text x="260" y="384" text-anchor="middle" class="small">Las olas de dolor suelen espaciarse y suavizarse</text>
  <text x="260" y="404" text-anchor="middle" class="small muted">No hay etapas fijas ni un plazo correcto</text>
  <rect x="516" y="60" width="264" height="196" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="648.0" y="88" text-anchor="middle" class="h">Reacciones comunes</text>
  <text x="532" y="110" class="small">• Tristeza, enojo, culpa</text>
  <text x="532" y="136" class="small">• Cambios de sueño</text>
  <text x="543" y="162" class="small">y apetito</text>
  <text x="532" y="188" class="small">• Cansancio</text>
  <text x="532" y="214" class="small">• Pensar en la persona</text>
  <rect x="516" y="272" width="264" height="168" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="530" y="296" class="lab b" style="fill:var(--red)">Pedir ayuda si hay</text>
  <text x="530" y="320" class="small">• Ideas de morir o de</text>
  <text x="541" y="342" class="small">hacerse daño</text>
  <text x="530" y="364" class="small">• Pena intensa que no cede</text>
  <text x="541" y="386" class="small">tras muchos meses</text>
  <text x="530" y="408" class="small">• No poder hacer la vida diaria</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
