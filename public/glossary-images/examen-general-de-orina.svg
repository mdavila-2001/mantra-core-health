<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Examen general de orina</title>
  <desc id="d">Tres paneles: la recogida de orina de chorro medio, el análisis físico del color y la transparencia, y el análisis químico con tira reactiva más la observación al microscopio de células, cilindros, cristales y bacterias.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="240" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="140.0" y="50" text-anchor="middle" class="title">La muestra</text>
  <path d="M110 90 L118 170 H162 L170 90 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M114 124 L118 170 H162 L166 124 Z" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="106" y="78" width="68" height="12" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="140" y="218" text-anchor="middle" class="lab">Primera orina</text>
  <text x="140" y="236" text-anchor="middle" class="lab">de la mañana</text>
  <text x="40" y="290" class="small">• Lavar la zona genital</text>
  <text x="40" y="316" class="small">• Desechar el primer chorro</text>
  <text x="40" y="342" class="small">• Recoger el chorro medio</text>
  <text x="40" y="368" class="small">• Llevarla pronto al laboratorio</text>
  <rect x="276" y="20" width="248" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">1 · Físico</text>
  <path d="M370 70 L378 150 H422 L430 70 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M374 104 L378 150 H422 L426 104 Z" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="366" y="58" width="68" height="12" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="300" y="194" width="200" height="20" rx="4" fill="var(--fluid)" stroke="none" stroke-width="0"/>
  <rect x="300" y="220" width="50" height="16" rx="0" fill="var(--fluid)" stroke="none" stroke-width="0" opacity=".75"/>
  <rect x="350" y="220" width="50" height="16" rx="0" fill="var(--beam)" stroke="none" stroke-width="0" opacity=".75"/>
  <rect x="400" y="220" width="50" height="16" rx="0" fill="var(--warn)" stroke="none" stroke-width="0" opacity=".75"/>
  <rect x="450" y="220" width="50" height="16" rx="0" fill="var(--vessel)" stroke="none" stroke-width="0" opacity=".75"/>
  <text x="400" y="256" text-anchor="middle" class="small" style="fill:var(--muted)">Color y transparencia</text>
  <text x="296" y="296" class="small">• Color</text>
  <text x="296" y="320" class="small">• Turbidez</text>
  <text x="296" y="344" class="small">• Olor</text>
  <text x="296" y="368" class="small">• Densidad</text>
  <text x="400" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">Concentración y aspecto</text>
  <rect x="540" y="20" width="240" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="660" y="50" text-anchor="middle" class="title">2 · Químico</text>
  <rect x="646" y="66" width="28" height="150" rx="3" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="650" y="74" width="20" height="16" rx="2" fill="var(--ok)" stroke="none" stroke-width="0"/>
  <rect x="650" y="97" width="20" height="16" rx="2" fill="var(--beam)" stroke="none" stroke-width="0"/>
  <rect x="650" y="120" width="20" height="16" rx="2" fill="var(--violet)" stroke="none" stroke-width="0"/>
  <rect x="650" y="143" width="20" height="16" rx="2" fill="var(--warn)" stroke="none" stroke-width="0"/>
  <rect x="650" y="166" width="20" height="16" rx="2" fill="var(--accent)" stroke="none" stroke-width="0"/>
  <rect x="650" y="189" width="20" height="16" rx="2" fill="var(--vessel)" stroke="none" stroke-width="0"/>
  <text x="660" y="238" text-anchor="middle" class="small" style="fill:var(--muted)">Tira reactiva</text>
  <text x="560" y="268" class="small">• pH y proteínas</text>
  <text x="560" y="290" class="small">• Glucosa y cetonas</text>
  <text x="560" y="312" class="small">• Sangre</text>
  <text x="560" y="334" class="small">• Leucocitos y nitritos</text>
  <text x="660" y="370" text-anchor="middle" class="step">3 · Microscopio</text>
  <text x="560" y="394" class="small">Células, cilindros,</text>
  <text x="560" y="412" class="small">cristales y bacterias</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
