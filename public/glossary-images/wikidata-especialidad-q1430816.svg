<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía pediátrica: la cirugía del niño</title>
  <desc id="d">A la izquierda, la silueta de un niño con los problemas quirúrgicos frecuentes señalados: malformaciones congénitas, estenosis pilórica, apendicitis, hernia inguinal y testículo no descendido. A la derecha, el principio de que el niño no es un adulto pequeño, el equipo con el que trabaja el cirujano pediátrico y sus técnicas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Problemas quirúrgicos</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Cómo trabaja</text>
<circle cx="200" cy="100" r="34" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<path d="M160 140 C150 150 148 170 150 200 L156 280 L180 280 L190 360 L210 360 L220 280 L244 280 L250 200 C252 170 250 150 240 140 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M160 150 L126 230 L140 234 L164 180 M240 150 L274 230 L260 234 L236 180" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="178" r="6" fill="var(--bad)" opacity=".7"/>
<line x1="268" y1="146" x2="210" y2="178" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="270" y="150" class="small">Estenosis pilórica</text>
<circle cx="186" cy="240" r="6" fill="var(--bad)" opacity=".7"/>
<line x1="114.6" y1="232" x2="186" y2="240" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="236" class="small">Apendicitis</text>
<circle cx="218" cy="270" r="6" fill="var(--bad)" opacity=".7"/>
<line x1="268" y1="286" x2="218" y2="270" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="270" y="290" class="small">Hernia inguinal</text>
<circle cx="200" cy="290" r="6" fill="var(--bad)" opacity=".7"/>
<line x1="193.8" y1="326" x2="200" y2="290" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="330" class="small">Testículo no descendido</text>
<text x="40" y="96" class="small">Malformaciones</text>
<text x="40" y="112" class="small">congénitas</text>
<text x="200" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Desde el feto y el recién nacido</text>
<text x="200" y="416" text-anchor="middle" class="small" style="fill:var(--muted)">hasta el final de la adolescencia.</text>
<rect x="416" y="66" width="344" height="76" rx="10" fill="var(--accent-l)"/>
<text x="588" y="96" text-anchor="middle" class="step">El niño no es un adulto pequeño</text>
<text x="588" y="118" text-anchor="middle" class="small">Órganos en crecimiento, otro metabolismo</text>
<text x="588" y="134" text-anchor="middle" class="small">y necesidades emocionales propias.</text>
<text x="416" y="176" class="h">Equipo</text>
<rect x="416" y="190" width="166" height="36" rx="8" fill="var(--ok)"/>
<text x="499.0" y="212.3" text-anchor="middle" class="small" style="fill:var(--on)">Neonatología</text>
<rect x="592" y="190" width="166" height="36" rx="8" fill="var(--purple)"/>
<text x="675.0" y="212.3" text-anchor="middle" class="small" style="fill:var(--on)">Anestesia infantil</text>
<rect x="416" y="236" width="166" height="36" rx="8" fill="var(--accent)"/>
<text x="499.0" y="258.3" text-anchor="middle" class="small" style="fill:var(--on)">Imagen</text>
<rect x="592" y="236" width="166" height="36" rx="8" fill="var(--warn)"/>
<text x="675.0" y="258.3" text-anchor="middle" class="small" style="fill:var(--on)">Enfermería</text>
<text x="416" y="312" class="h">Técnicas</text>
<text x="416" y="338" class="lab">• Cirugía mínimamente invasiva</text>
<text x="427" y="360" class="lab">con instrumental pequeño</text>
<text x="416" y="382" class="lab">• Cirugía fetal en centros especializados</text>
<text x="416" y="418" class="small" style="fill:var(--muted)">La familia participa en las decisiones.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
