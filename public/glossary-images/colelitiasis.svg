<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cálculos en la vesícula y sus complicaciones</title>
  <desc id="d">Hígado, vesícula biliar con varios cálculos, conducto colédoco, páncreas y duodeno. A la derecha, las posibles consecuencias: ausencia de síntomas, cólico biliar, colecistitis, coledocolitiasis y pancreatitis.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Cálculos en la vesícula</text>
<path d="M40,90 Q60,70 200,74 Q330,80 360,110 Q330,150 260,170 Q160,200 70,190 Q40,170 40,90 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
<text x="150" y="120" text-anchor="middle" class="step" style="fill:var(--on)">Hígado</text>
<path d="M150,240 Q120,300 160,320 Q200,330 210,280 Q205,240 180,215 Z" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160" cy="290" r="9" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="178" cy="302" r="7" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="185" cy="282" r="6" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="168" cy="270" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
<path d="M185,214 Q200,195 230,195" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M240,170 L230,195 L240,330" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300,330 Q280,350 240,345 L232,330" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M220,330 Q180,360 200,410 L280,410 Q320,380 300,330 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
<path d="M300,300 Q360,290 380,320 Q370,350 300,345 Z" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
<circle cx="240" cy="262" r="6" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="60" y="350" class="lab">Vesícula</text>
<text x="60" y="366" class="lab">con cálculos</text>
<line x1="118" y1="345" x2="150" y2="310" stroke="var(--muted)" stroke-width="1.5"/>
<text x="250" y="232" class="small">Colédoco</text>
<text x="330" y="286" text-anchor="middle" class="small">Páncreas</text>
<text x="260" y="428" text-anchor="middle" class="small">Duodeno</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Qué puede causar</text>
<rect x="456" y="60" width="130" height="40" rx="8" fill="var(--ok-l)" stroke-width="1"/>
<text x="521.0" y="84.2" text-anchor="middle" class="small" style="fill:var(--ink)">Sin síntomas</text>
<text x="596" y="78" class="small">la mayoría; hallazgo en ecografía</text>
<rect x="456" y="112" width="130" height="40" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="521.0" y="136.2" text-anchor="middle" class="small" style="fill:var(--ink)">Cólico biliar</text>
<text x="596" y="130" class="small">dolor tras comidas grasas</text>
<rect x="456" y="164" width="130" height="40" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="521.0" y="188.2" text-anchor="middle" class="small" style="fill:var(--ink)">Colecistitis</text>
<text x="596" y="182" class="small">vesícula inflamada, fiebre</text>
<rect x="456" y="216" width="130" height="40" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="521.0" y="240.2" text-anchor="middle" class="small" style="fill:var(--ink)">Coledocolitiasis</text>
<text x="596" y="234" class="small">cálculo en colédoco</text>
<text x="596" y="250" class="small">ictericia</text>
<rect x="456" y="268" width="130" height="40" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="521.0" y="292.2" text-anchor="middle" class="small" style="fill:var(--ink)">Pancreatitis</text>
<text x="596" y="286" class="small">dolor intenso hacia la espalda</text>
<text x="456" y="346" class="lab">Factores: sexo femenino, embarazo,</text>
<text x="456" y="366" class="lab">obesidad o pérdida rápida de peso.</text>
<text x="456" y="400" class="step">Diagnóstico: ecografía abdominal.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
