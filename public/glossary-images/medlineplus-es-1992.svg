<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo es el trasplante de riñón</title>
  <desc id="d">Silueta del abdomen con los riñones propios en su sitio y el riñón nuevo colocado en la parte baja, unido a la arteria y la vena ilíacas y con su uréter conectado a la vejiga. A la derecha, el proceso: donante, estudio de compatibilidad, cirugía e inmunosupresores.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Trasplante de riñón: dónde se coloca el injerto</text>
  <rect x="20" y="60" width="400" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M120 90 C110 160 100 250 120 330 C130 380 170 420 220 420 C270 420 310 380 320 330 C340 250 330 160 320 90 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M220 100 L220 330" fill="none" stroke="var(--red)" stroke-width="6"/>
  <ellipse cx="160" cy="160" rx="18" ry="30" fill="var(--bone)" stroke="var(--muted)"/>
  <ellipse cx="280" cy="160" rx="18" ry="30" fill="var(--bone)" stroke="var(--muted)"/>
  <text x="160" y="212" text-anchor="middle" class="small muted">Riñones</text>
  <text x="160" y="228" text-anchor="middle" class="small muted">propios</text>
  <path d="M220 330 L180 380 M220 330 L260 380" fill="none" stroke="var(--red)" stroke-width="5"/>
  <path d="M282 312 C300 300 316 320 312 345 C308 372 284 378 274 360 C266 344 268 320 282 312 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M268 345 L256 368" fill="none" stroke="var(--red)" stroke-width="3"/>
  <path d="M290 372 C290 392 250 400 235 395" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <ellipse cx="220" cy="400" rx="26" ry="14" fill="var(--accent-l)" stroke="var(--accent)"/>
  <line x1="312" y1="330" x2="350" y2="300" stroke="var(--muted)" stroke-width="1"/>
  <text x="338" y="290" class="lab b">Riñón</text>
  <text x="338" y="306" class="lab b">nuevo</text>
  <text x="150" y="410" text-anchor="end" class="small">Vejiga</text>
  <line x1="152" y1="406" x2="194" y2="400" stroke="var(--muted)" stroke-width="1"/>
  <text x="360" y="380" class="small">Uréter</text>
  <line x1="358" y1="376" x2="292" y2="382" stroke="var(--muted)" stroke-width="1"/>
  <text x="130" y="250" class="small">Arteria y vena</text>
  <text x="130" y="266" class="small">ilíacas</text>
  <line x1="160" y1="272" x2="186" y2="372" stroke="var(--muted)" stroke-width="1"/>
  <rect x="436" y="60" width="344" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="90" text-anchor="middle" class="title">El proceso</text>
  <rect x="460" y="100" width="296" height="50" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="608.0" y="130.0" text-anchor="middle" class="lab">Donante vivo o fallecido</text>
  <line x1="608.0" y1="152" x2="608.0" y2="164" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="166" width="296" height="50" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="608.0" y="188.0" text-anchor="middle" class="lab b">Estudio de compatibilidad</text>
  <text x="608.0" y="205.0" text-anchor="middle" class="small muted">grupo sanguíneo y HLA</text>
  <line x1="608.0" y1="218" x2="608.0" y2="230" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="232" width="296" height="50" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="608.0" y="254.0" text-anchor="middle" class="lab b">Cirugía</text>
  <text x="608.0" y="271.0" text-anchor="middle" class="small muted">unas 3 a 4 horas</text>
  <line x1="608.0" y1="284" x2="608.0" y2="296" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="460" y="298" width="296" height="50" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="608.0" y="320.0" text-anchor="middle" class="lab b">Inmunosupresores</text>
  <text x="608.0" y="337.0" text-anchor="middle" class="small muted">de por vida, evitan el rechazo</text>
  <text x="608" y="380" text-anchor="middle" class="small">El injerto filtra la sangre y produce orina</text>
  <text x="608" y="400" text-anchor="middle" class="small muted">Los riñones propios suelen quedarse</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
