<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ecografía de tiroides</title>
  <desc id="d">A la izquierda, una persona con la glándula tiroides en forma de mariposa en el cuello y una sonda de ecografía apoyada sobre ella. A la derecha, una imagen ecográfica esquemática de los dos lóbulos con un quiste oscuro lleno de líquido y un nódulo sólido, y la lista de lo que permite estudiar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">La exploración</text>
  <circle cx="200" cy="110" r="46" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M160 150 L150 260 H250 L240 150" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M120 270 C160 250 240 250 280 270 L300 420 H100 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="186.0" cy="220" rx="11.0" ry="19.0" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="214.0" cy="220" rx="11.0" ry="19.0" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="192.0" y="222.0" width="16.0" height="8.0" rx="3.0" fill="var(--organ)"/>
  <g transform="rotate(50 248 214)">
  <rect x="234" y="164" width="28" height="46" rx="8" fill="var(--accent)"/>
  <rect x="228" y="208" width="40" height="12" rx="4" fill="var(--ink)"/>
  </g>
  <text x="70" y="210" class="small">Tiroides</text>
  <path d="M118 206 L178 216" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="310" text-anchor="middle" class="small">Tumbado, con el cuello</text>
  <text x="200" y="326" text-anchor="middle" class="small">un poco estirado</text>
  <text x="200" y="400" text-anchor="middle" class="small muted">Ultrasonidos: sin radiación</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Lo que puede distinguir</text>
  <rect x="416" y="66" width="344" height="130" rx="10" fill="var(--ink)" opacity=".88"/>
  <ellipse cx="520" cy="130" rx="70" ry="44" fill="var(--muted)"/>
  <ellipse cx="660" cy="130" rx="70" ry="44" fill="var(--muted)"/>
  <circle cx="510" cy="124" r="16" fill="var(--ink)"/>
  <circle cx="670" cy="134" r="18" fill="var(--bone)"/>
  <text x="510" y="186" text-anchor="middle" class="small" style="fill:var(--on)">Quiste</text>
  <text x="670" y="186" text-anchor="middle" class="small" style="fill:var(--on)">Nódulo sólido</text>
  <text x="440" y="236" class="lab">• Tamaño y forma de la glándula</text>
  <text x="440" y="262" class="lab">• Nódulos: líquidos o sólidos</text>
  <text x="440" y="288" class="lab">• Rasgos que orientan el riesgo</text>
  <text x="440" y="314" class="lab">• Ganglios del cuello</text>
  <text x="440" y="340" class="lab">• Guía para una punción (PAAF)</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
