<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Gastroenteritis infecciosa</title>
  <desc id="d">Tramo de intestino con microbios en su interior y flechas que muestran la salida de agua y sales que causa la diarrea. Debajo, las vías de contagio; a la derecha, la rehidratación oral y los signos de deshidratación.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="210.0" y="50" text-anchor="middle" class="title">Qué pasa en el intestino</text>
<rect x="50" y="90" width="320" height="140" rx="60" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<rect x="70" y="112" width="280" height="96" rx="48" fill="var(--vessel-l)" stroke-width="1"/>
<circle cx="110" cy="140" r="7" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M117,140 l8,-4" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="160" cy="170" r="7" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M167,170 l8,-4" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="230" cy="138" r="7" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M237,138 l8,-4" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="290" cy="172" r="7" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M297,172 l8,-4" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="160" r="7" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M207,160 l8,-4" fill="none" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="120" y1="232" x2="120" y2="270" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<line x1="200" y1="232" x2="200" y2="270" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<line x1="280" y1="232" x2="280" y2="270" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
<text x="200" y="290" text-anchor="middle" class="lab" style="fill:var(--accent)">Salen agua y sales: diarrea</text>
<text x="80" y="80" class="small">Virus, bacterias o parásitos</text>
<rect x="40" y="312" width="340" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="52" y="334" class="step">Contagio fecal-oral</text>
<text x="52" y="358" class="lab">• Agua o alimentos contaminados</text>
<text x="52" y="380" class="lab">• Manos sucias, contacto con enfermos</text>
<text x="52" y="402" class="lab">• Norovirus y rotavirus: los más comunes</text>
<rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="598.0" y="50" text-anchor="middle" class="title">Lo esencial</text>
<rect x="436" y="58" width="324" height="60" rx="8" fill="var(--ok)" stroke-width="1"/>
<text x="598.0" y="84.5" text-anchor="middle" class="lab" style="fill:var(--on)">Rehidratar: sales de rehidratación</text>
<text x="598.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">oral en sorbos frecuentes</text>
<text x="436" y="148" class="lab">• Seguir comiendo según tolerancia</text>
<text x="436" y="172" class="lab">• Lavado de manos con agua y jabón</text>
<text x="436" y="196" class="lab">• Antibióticos solo en casos concretos</text>
<rect x="436" y="236" width="324" height="164" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="448" y="258" class="step" style="fill:var(--warn)">Signos de deshidratación o alarma:</text>
<text x="448" y="284" class="lab">• Boca seca, orina escasa, sin lágrimas</text>
<text x="448" y="310" class="lab">• Somnolencia o mareo intenso</text>
<text x="448" y="336" class="lab">• Sangre en heces o fiebre alta</text>
<text x="448" y="362" class="lab">• Vómitos que impiden beber</text>
<text x="448" y="388" class="lab">• Bebés y personas mayores frágiles</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
