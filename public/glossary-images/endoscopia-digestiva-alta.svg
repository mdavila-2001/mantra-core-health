<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Endoscopia digestiva alta</title>
  <desc id="d">Perfil de una cabeza y un tubo flexible que entra por la boca, baja por el esófago y llega al estómago y el duodeno, con la imagen en un monitor. A la derecha, para qué sirve la prueba y cómo se prepara.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">Recorrido del endoscopio</text>
<path d="M230,80 Q170,40 110,70 Q78,90 76,130 L68,150 L54,172 L70,178 Q66,190 72,198 Q68,210 78,220 Q96,236 120,232 L126,310 L210,310 L210,230 Q260,180 230,80 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="110" cy="142" r="5" fill="var(--ink)" stroke="none" stroke-width="1"/>
<path d="M258,272 L250,200" fill="none" stroke="var(--organ-d)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M258,272 L250,200" fill="none" stroke="var(--organ)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265,270 C330,250 355,330 325,390 C295,445 205,435 175,392 L155,388 L155,364 L178,366 C220,384 268,372 278,332 C282,302 268,284 252,276 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M76,198 Q110,200 140,230 L146,300 Q160,330 250,272 Q300,290 290,340 Q270,380 170,390" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170" cy="390" r="6" fill="var(--beam)" stroke="var(--warn)" stroke-width="2"/>
<text x="70" y="236" text-anchor="end" class="small">Boca</text>
<text x="120" y="330" text-anchor="end" class="small">Esófago</text>
<text x="348" y="300" class="small">Estómago</text>
<text x="120" y="404" class="small">Duodeno</text>
<rect x="300" y="70" width="120" height="80" rx="8" fill="var(--ink)" stroke-width="1"/>
<rect x="308" y="78" width="104" height="64" rx="4" fill="var(--organ)" stroke-width="1"/>
<circle cx="360" cy="110" r="16" fill="var(--organ-d)" stroke="none" stroke-width="1"/>
<text x="360" y="170" text-anchor="middle" class="small">Imagen en monitor</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Para qué sirve</text>
<rect x="476" y="62" width="284" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="618.0" y="86.5" text-anchor="middle" class="lab" style="fill:var(--on)">Ver la mucosa en directo</text>
<line x1="618.0" y1="103" x2="618.0" y2="117" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="476" y="120" width="284" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="618.0" y="144.6" text-anchor="middle" class="lab" style="fill:var(--on)">Tomar biopsias</text>
<line x1="618.0" y1="161" x2="618.0" y2="175" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="476" y="178" width="284" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="618.0" y="202.6" text-anchor="middle" class="lab" style="fill:var(--on)">Tratar: hemorragias, pólipos</text>
<rect x="476" y="246" width="284" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="488" y="268" class="step">Preparación</text>
<text x="488" y="292" class="lab">• Ayuno de varias horas</text>
<text x="488" y="314" class="lab">• Anestesia en la garganta o sedación</text>
<text x="488" y="336" class="lab">• Dura pocos minutos</text>
<text x="476" y="388" class="small">Después: no conducir si hubo sedación.</text>
<text x="476" y="410" class="small">Avisar si hay dolor fuerte o fiebre.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
