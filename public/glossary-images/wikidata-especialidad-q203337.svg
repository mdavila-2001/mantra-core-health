<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Campo de la neumología</title>
  <desc id="d">Aparato respiratorio con la tráquea, los bronquios, los dos pulmones, la pleura y el diafragma. A la derecha, las enfermedades que atiende la neumología, como asma, EPOC, neumonía o apnea del sueño, y sus pruebas, como la espirometría y la broncoscopia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Neumología: el aparato respiratorio</text>
  <rect x="20" y="60" width="400" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="88" text-anchor="middle" class="title">Estructuras que estudia</text>
  <path d="M210 100 L210 190 M210 190 L170 220 L150 260 M210 190 L250 220 L270 260 M170 220 L140 230 M250 220 L280 230" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"/>
  <path d="M190 170 C120 160 80 220 80 300 C80 360 120 380 190 370 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2" opacity=".55"/>
  <path d="M230 170 C300 160 340 220 340 300 C340 360 300 380 230 370 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2" opacity=".55"/>
  <path d="M70 390 C140 360 280 360 350 390" fill="none" stroke="var(--warn)" stroke-width="5"/>
  <path d="M196 168 C120 150 66 220 66 300 C66 370 120 392 196 382" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="240" y="112" class="small b">Tráquea</text>
  <text x="150" y="300" text-anchor="middle" class="small b">Pulmón</text>
  <text x="290" y="300" text-anchor="middle" class="small b">Pulmón</text>
  <text x="130" y="196" text-anchor="middle" class="small">Bronquios</text>
  <text x="210" y="414" text-anchor="middle" class="small b">Diafragma</text>
  <text x="40" y="160" class="small b">Pleura</text>
  <line x1="66" y1="166" x2="76" y2="230" stroke="var(--muted)" stroke-width="1"/>
  <rect x="436" y="60" width="344" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="88" text-anchor="middle" class="h">Qué atiende</text>
  <text x="454" y="108" class="small">• Asma y EPOC</text>
  <text x="454" y="132" class="small">• Neumonía y tuberculosis</text>
  <text x="454" y="156" class="small">• Apnea del sueño</text>
  <text x="454" y="180" class="small">• Fibrosis pulmonar</text>
  <text x="454" y="204" class="small">• Cáncer de pulmón</text>
  <text x="454" y="228" class="small">• Males de altura</text>
  <rect x="436" y="276" width="344" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="304" text-anchor="middle" class="h">Pruebas y herramientas</text>
  <text x="454" y="322" class="small">• Espirometría</text>
  <text x="454" y="348" class="small">• Oximetría y gases en sangre</text>
  <text x="454" y="374" class="small">• Broncoscopia</text>
  <text x="454" y="400" class="small">• Polisomnografía</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
