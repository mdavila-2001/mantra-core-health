<path d="M91 195.0 l8 6 l8 -8 l8 6" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="105" y="308" text-anchor="middle" class="small" style="fill:var(--muted)">el hueso se rompe</text>
<rect x="186" y="66" width="130" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="251" y="92" text-anchor="middle" class="step" style="fill:var(--accent)">Yeso o férula</text>
<ellipse cx="251" cy="124" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="251" cy="274" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<rect x="240" y="124" width="22" height="69.0" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
