<path d="M237 195.0 l8 6 l8 -8 l8 6" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="227" y="150" width="48" height="100" rx="10" fill="var(--accent-l)" stroke="var(--accent)" opacity=".7"/>
<text x="251" y="308" text-anchor="middle" class="small" style="fill:var(--muted)">inmoviliza</text>
<rect x="332" y="66" width="130" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="397" y="92" text-anchor="middle" class="lab" style="fill:var(--purple)">Placa y tornillos</text>
<ellipse cx="397" cy="124" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="397" cy="274" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<rect x="386" y="124" width="22" height="69.0" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
<rect x="386" y="205.0" width="22" height="69.0" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
<path d="M383 195.0 l8 6 l8 -8 l8 6" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="409" y="160" width="8" height="80" rx="2" fill="var(--purple)"/>
<line x1="417" y1="170" x2="389" y2="170" stroke="var(--purple)" stroke-width="3"/>
<line x1="417" y1="190" x2="389" y2="190" stroke="var(--purple)" stroke-width="3"/>
<line x1="417" y1="210" x2="389" y2="210" stroke="var(--purple)" stroke-width="3"/>
<line x1="417" y1="230" x2="389" y2="230" stroke="var(--purple)" stroke-width="3"/>
<text x="397" y="308" text-anchor="middle" class="small" style="fill:var(--muted)">fija los fragmentos</text>
<rect x="478" y="66" width="130" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="543" y="92" text-anchor="middle" class="step" style="fill:var(--warn)">Clavo</text>
<ellipse cx="543" cy="124" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="543" cy="274" rx="22" ry="14" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<rect x="532" y="124" width="22" height="69.0" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
<rect x="532" y="205.0" width="22" height="69.0" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
<path d="M529 195.0 l8 6 l8 -8 l8 6" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="540" y="116" width="6" height="166" rx="3" fill="var(--warn)"/>
<text x="543" y="308" text-anchor="middle" class="small" style="fill:var(--muted)">dentro del hueso</text>
<rect x="624" y="66" width="130" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="689" y="92" text-anchor="middle" class="step" style="fill:var(--ok)">Prótesis</text>
<ellipse cx="689" cy="130" rx="26" ry="22" fill="var(--xbone)" stroke="var(--muted)" stroke-width="1.5"/>
<rect x="678" y="130" width="22" height="140" rx="4" fill="var(--xbone)" stroke="var(--muted)"/>
<circle cx="689" cy="126" r="16" fill="var(--ok)" opacity=".8"/>
<rect x="685" y="134" width="8" height="70" rx="3" fill="var(--ok)" opacity=".8"/>
<text x="689" y="308" text-anchor="middle" class="small" style="fill:var(--muted)">articulación nueva</text>
<text x="40" y="360" class="h">También atiende</text>
<text x="40" y="386" class="lab">Esguinces · luxaciones · lesiones de ligamentos y tendones · lesiones deportivas</text>
<text x="40" y="410" class="lab">Artrosis · deformidades de la columna · problemas de los nervios periféricos</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
