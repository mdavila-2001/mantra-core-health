<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Colonoscopia</title>
  <desc id="d">A la izquierda, el intestino grueso con el colonoscopio entrando por el recto y avanzando por el colon descendente, transverso y ascendente hasta el ciego, con un pólipo visible. A la derecha, los seis pasos del procedimiento.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Recorrido del colonoscopio</text>
  <path d="M150 380 C150 360 140 350 120 340 C80 320 80 300 80 280 L80 120 C80 90 100 80 130 80 L290 80 C320 80 340 90 340 120 L340 300 C340 330 320 340 300 340 L240 340 C220 340 210 360 210 390" fill="none" stroke="var(--organ)" stroke-width="36" stroke-linecap="round"/>
  <path d="M150 380 C150 360 140 350 120 340 C80 320 80 300 80 280 L80 120 C80 90 100 80 130 80 L290 80 C320 80 340 90 340 120 L340 300 C340 330 320 340 300 340 L240 340 C220 340 210 360 210 390" fill="none" stroke="var(--organ-d)" stroke-width="2" stroke-dasharray="1 0" opacity=".5"/>
  <path d="M210 420 L210 390 C210 360 220 340 240 340 L300 340 C320 340 340 330 340 300 L340 120 C340 90 320 80 290 80 L130 80 C100 80 80 90 80 120 L80 250" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="80" cy="254" r="6" fill="var(--beam)" stroke="var(--ink)" stroke-width="1.5"/>
  <circle cx="250" cy="84" r="6" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <text x="250" y="140" text-anchor="middle" class="small" style="fill:var(--violet)">Pólipo</text>
  <line x1="250" y1="128" x2="250" y2="92" stroke="var(--violet)" stroke-width="1"/>
  <text x="122" y="166" class="small">Colon</text>
  <text x="122" y="182" class="small">ascendente</text>
  <text x="210" y="118" text-anchor="middle" class="small">Colon transverso</text>
  <text x="298" y="200" text-anchor="end" class="small">Colon</text>
  <text x="298" y="216" text-anchor="end" class="small">descendente</text>
  <text x="150" y="424" text-anchor="middle" class="small">Ciego</text>
  <text x="222" y="414" class="small">Recto</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Paso a paso</text>
  <circle cx="468" cy="74" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="79" text-anchor="middle" class="step on">1</text>
  <text x="492" y="79" class="small">Dieta y laxante para limpiar el colon</text>
  <circle cx="468" cy="124" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="129" text-anchor="middle" class="step on">2</text>
  <text x="492" y="129" class="small">Sedación para estar cómodo</text>
  <circle cx="468" cy="174" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="179" text-anchor="middle" class="step on">3</text>
  <text x="492" y="179" class="small">Tubo flexible con cámara por el ano</text>
  <circle cx="468" cy="224" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="229" text-anchor="middle" class="step on">4</text>
  <text x="492" y="229" class="small">Se infla aire para ver la pared</text>
  <circle cx="468" cy="274" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="279" text-anchor="middle" class="step on">5</text>
  <text x="492" y="279" class="small">Se toman biopsias o se quitan pólipos</text>
  <circle cx="468" cy="324" r="14" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="468" y="329" text-anchor="middle" class="step on">6</text>
  <text x="492" y="329" class="small">Reposo breve y vuelta a casa</text>
  <rect x="456" y="366" width="304" height="56" rx="10" fill="var(--ok-l)" stroke="none" stroke-width="2"/>
  <text x="608" y="390" text-anchor="middle" class="small">Detecta y retira lesiones antes</text>
  <text x="608" y="408" text-anchor="middle" class="small">de que se conviertan en cáncer.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
