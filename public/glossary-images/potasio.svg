<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Potasio: equilibrio entre la célula y la sangre</title>
  <desc id="d">A la izquierda, una célula con mucho potasio en su interior y sodio fuera, mantenidos por una bomba de membrana, y un trazado de electrocardiograma que recuerda su papel en el ritmo cardíaco. A la derecha, un tubo de sangre, la advertencia sobre la hemólisis de la muestra y causas de potasio bajo y alto.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Potasio: dentro de la célula</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué altera el valor</text>
<ellipse cx="200" cy="150" rx="140" ry="80" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
<text x="200" y="98" text-anchor="middle" class="lab" style="fill:var(--ok)">Célula</text>
<text x="120" y="140" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="160" y="170" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="200" y="130" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="240" y="165" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="270" y="138" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="180" y="196" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="230" y="112" text-anchor="middle" class="step" style="fill:var(--accent)">K⁺</text>
<text x="52" y="90" text-anchor="middle" class="step" style="fill:var(--warn)">Na⁺</text>
<text x="350" y="92" text-anchor="middle" class="step" style="fill:var(--warn)">Na⁺</text>
<text x="44" y="226" text-anchor="middle" class="step" style="fill:var(--warn)">Na⁺</text>
<text x="356" y="222" text-anchor="middle" class="step" style="fill:var(--warn)">Na⁺</text>
<rect x="330" y="140" width="24" height="24" rx="6" fill="var(--purple)"/>
<text x="342" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Bomba</text>
<text x="200" y="258" text-anchor="middle" class="lab">Mucho dentro, poco en la sangre</text>
<text x="40" y="296" class="h">Su equilibrio mantiene</text>
<path d="M40 350 H90 L100 340 L110 350 H130 L140 300 L152 384 L162 350 H200 C210 330 230 330 240 350 H360" fill="none" stroke="var(--vessel)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40" y="404" class="lab">el ritmo del corazón y la fuerza muscular.</text>
<text x="40" y="422" class="small" style="fill:var(--muted)">El riñón regula cuánto se elimina.</text>
<rect x="418" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M420 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M421.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="433" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<text x="470" y="92" class="lab">Se mide en el suero, a menudo</text>
<text x="470" y="110" class="lab">con sodio y cloro (ionograma).</text>
<text x="470" y="138" class="small" style="fill:var(--warn)">Si la muestra se hemoliza,</text>
<text x="470" y="154" class="small" style="fill:var(--warn)">puede salir falsamente alto.</text>
<text x="416" y="214" class="h" style="fill:var(--accent)">Bajo</text>
<text x="606" y="214" class="h" style="fill:var(--bad)">Alto</text>
<text x="416" y="242" class="lab">• Vómitos o diarrea</text>
<text x="416" y="266" class="lab">• Diuréticos</text>
<text x="416" y="290" class="lab">• Laxantes</text>
<text x="416" y="314" class="lab">• Poca ingesta</text>
<text x="606" y="242" class="lab">• Enfermedad renal</text>
<text x="606" y="266" class="lab">• Algunos fármacos</text>
<text x="617" y="290" class="lab">para la presión</text>
<text x="606" y="314" class="lab">• Acidosis</text>
<rect x="416" y="352" width="344" height="66" rx="10" fill="var(--bad-l)"/>
<text x="432" y="376" class="lab">Ambos extremos pueden causar debilidad</text>
<text x="432" y="396" class="lab">y arritmias: se corrigen con control médico.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
