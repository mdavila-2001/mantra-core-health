<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ecografía abdominal</title>
  <desc id="d">A la izquierda, vista frontal simplificada del abdomen con el hígado, la vesícula, el bazo, el páncreas, los riñones y la aorta, que son los órganos que explora la prueba. A la derecha, una sonda que emite ultrasonidos y los pasos: ayuno previo, aplicación de gel, imagen en tiempo real y ausencia de radiación.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Órganos que explora</text>
  <rect x="60" y="80" width="360" height="300" rx="60" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <path d="M90 130 C120 100 230 100 250 130 C250 170 180 200 100 190 C80 170 82 150 90 130 Z" fill="var(--organ)"/>
  <text x="150" y="150" text-anchor="middle" class="lab">Hígado</text>
  <ellipse cx="200" cy="200" rx="14" ry="20" fill="var(--ok)" opacity=".7"/>
  <circle cx="200" cy="210" r="3" fill="var(--ink)"/>
  <path d="M200 210 L120 240" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="116" y="244" text-anchor="end" class="lab">Vesícula</text>
  <path d="M330 120 C380 120 400 160 380 190 C350 190 320 160 330 120 Z" fill="var(--purple)" opacity=".5"/>
  <text x="380" y="108" text-anchor="middle" class="small">Bazo</text>
  <path d="M220 230 C260 215 300 220 330 232 C310 246 260 248 220 244 Z" fill="var(--warn)" opacity=".7"/>
  <text x="300" y="266" text-anchor="middle" class="small">Páncreas</text>
  <ellipse cx="150" cy="300" rx="20" ry="32" fill="var(--vessel)" opacity=".55"/><ellipse cx="330" cy="300" rx="20" ry="32" fill="var(--vessel)" opacity=".55"/>
  <text x="240" y="330" text-anchor="middle" class="small">Riñones</text>
  <path d="M240 110 V370" stroke="var(--vessel)" stroke-width="8" opacity=".8"/>
  <text x="252" y="360" class="small">Aorta</text>
  <text x="240" y="410" text-anchor="middle" class="small muted">Vista frontal simplificada</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Cómo se hace</text>
  <path d="M580 110 L620 70 L660 110 L640 130 L600 130 Z" fill="var(--accent)"/>
  <rect x="610" y="40" width="20" height="40" rx="6" fill="var(--accent)"/>
  <path d="M600 146.0 Q620 170 640 146.0" fill="none" stroke="var(--beam)" stroke-width="3"/>
  <path d="M584 150.8 Q620 186 656 150.8" fill="none" stroke="var(--beam)" stroke-width="3"/>
  <path d="M568 155.6 Q620 202 672 155.6" fill="none" stroke="var(--beam)" stroke-width="3"/>
  <text x="630" y="212" text-anchor="middle" class="small">Sonda que emite ultrasonidos</text>
  <rect x="500" y="232" width="260" height="44" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="516" y="251" class="step">Ayuno previo</text>
  <text x="516" y="268" class="small">Según indicación</text>
  <rect x="500" y="284" width="260" height="44" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="516" y="303" class="step">Gel</text>
  <text x="516" y="320" class="small">Mejora el contacto</text>
  <rect x="500" y="336" width="260" height="44" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="516" y="355" class="step">Imagen en vivo</text>
  <text x="516" y="372" class="small">Se mueve la sonda</text>
  <rect x="500" y="388" width="260" height="44" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="516" y="407" class="step">Sin radiación</text>
  <text x="516" y="424" class="small">Indolora y segura</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
