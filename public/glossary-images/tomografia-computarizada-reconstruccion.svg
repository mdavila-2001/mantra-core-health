<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">De las proyecciones a la imagen en tomografía computarizada</title>
  <desc id="d">Cuatro pasos. Primero un objeto con dos estructuras densas. Segundo, las proyecciones medidas desde distintos ángulos. Tercero, la retroproyección simple, que produce una imagen borrosa con estelas. Cuarto, la imagen final nítida tras el filtrado o la reconstrucción iterativa.</desc>
