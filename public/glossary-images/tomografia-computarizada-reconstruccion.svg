  <circle cx="708.0" cy="220" r="10" fill="var(--dense)" opacity="0.85"/>
  <text x="108.0" y="322" text-anchor="middle" class="small">Un corte del cuerpo con</text>
  <text x="108.0" y="340" text-anchor="middle" class="small">dos estructuras más</text>
  <text x="108.0" y="358" text-anchor="middle" class="small">densas (los círculos).</text>
  <text x="300.0" y="322" text-anchor="middle" class="small">El escáner mide cuánta</text>
  <text x="300.0" y="340" text-anchor="middle" class="small">radiación atraviesa el</text>
  <text x="300.0" y="358" text-anchor="middle" class="small">objeto por miles de</text>
  <text x="300.0" y="376" text-anchor="middle" class="small">líneas y ángulos (en</text>
  <text x="300.0" y="394" text-anchor="middle" class="small">verde, el perfil medido).</text>
  <text x="492.0" y="322" text-anchor="middle" class="small">Cada medida se reparte</text>
  <text x="492.0" y="340" text-anchor="middle" class="small">de vuelta por su línea:</text>
  <text x="492.0" y="358" text-anchor="middle" class="small">sale la forma, pero</text>
  <text x="492.0" y="376" text-anchor="middle" class="small">borrosa y con estelas.</text>
  <text x="684.0" y="322" text-anchor="middle" class="small">El filtro o la</text>
  <text x="684.0" y="340" text-anchor="middle" class="small">reconstrucción iterativa</text>
  <text x="684.0" y="358" text-anchor="middle" class="small">quitan las estelas y</text>
  <text x="684.0" y="376" text-anchor="middle" class="small">dan una imagen nítida.</text>
  <text x="400" y="452" text-anchor="middle" class="small muted">Esquema conceptual simplificado (dos estructuras en un corte). Ilustración original de AloVida.</text>
  </svg>