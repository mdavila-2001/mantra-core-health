<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Insuficiencia renal aguda (lesión renal aguda)</title>
  <desc id="d">Tres riñones muestran los orígenes de la lesión renal aguda: antes del riñón, cuando llega poca sangre por deshidratación o hemorragia; en el riñón, por daño del tejido debido a fármacos o infección; y después del riñón, cuando la orina no sale por una próstata grande o cálculos. Debajo, los síntomas y cómo se detecta.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Tres orígenes de la lesión renal aguda</text>
  <text x="150" y="76" text-anchor="middle" class="step">Antes del riñón</text>
  <text x="150" y="96" text-anchor="middle" class="small muted">Llega poca sangre</text>
  <rect x="38" y="206" width="224" height="30" rx="8" fill="var(--tissue)"/>
  <text x="150.0" y="225.32" text-anchor="middle" class="small" style="fill:var(--ink)">Deshidratación · Hemorragia, shock</text>
  <text x="400" y="76" text-anchor="middle" class="step">En el riñón</text>
  <text x="400" y="96" text-anchor="middle" class="small muted">Daño del tejido</text>
  <rect x="288" y="206" width="224" height="30" rx="8" fill="var(--tissue)"/>
  <text x="400.0" y="225.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fármacos tóxicos · Infección grave</text>
  <text x="650" y="76" text-anchor="middle" class="step">Después del riñón</text>
  <text x="650" y="96" text-anchor="middle" class="small muted">La orina no sale</text>
  <rect x="538" y="206" width="224" height="30" rx="8" fill="var(--tissue)"/>
  <text x="650.0" y="225.32" text-anchor="middle" class="small" style="fill:var(--ink)">Próstata grande · Cálculos</text>
  <path d="M70 150 H120" fill="none" stroke="var(--vessel)" stroke-width="6"/>
  <path d="M150 118.0 C177.0 115.0 180.0 181.0 150 178.0 C139.5 176.5 138.0 158.5 145.5 148 C138.0 137.5 139.5 119.5 150 118.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M60 140 L80 160 M80 140 L60 160" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <path d="M400 118.0 C427.0 115.0 430.0 181.0 400 178.0 C389.5 176.5 388.0 158.5 395.5 148 C388.0 137.5 389.5 119.5 400 118.0 Z" fill="var(--warn)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M380 130 l10 12 l-8 6 l10 12" fill="none" stroke="var(--panel)" stroke-width="2"/>
  <path d="M630 118.0 C657.0 115.0 660.0 181.0 630 178.0 C619.5 176.5 618.0 158.5 625.5 148 C618.0 137.5 619.5 119.5 630 118.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M650 150 C680 150 690 170 690 186" fill="none" stroke="var(--nerve)" stroke-width="4"/>
  <circle cx="690" cy="190" r="7" fill="var(--warn)"/>
  <rect x="20" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">Qué se nota</text>
  <text x="40" y="340" class="lab">• Orina mucho menos</text>
  <text x="40" y="366" class="lab">• Hinchazón de piernas o cara</text>
  <text x="40" y="392" class="lab">• Cansancio, náuseas, confusión</text>
  <rect x="410" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="316" text-anchor="middle" class="title">Cómo se detecta</text>
  <text x="430" y="340" class="lab">• Subida rápida de la creatinina</text>
  <text x="430" y="366" class="lab">• Caída de la cantidad de orina</text>
  <text x="430" y="392" class="lab">• Análisis de orina y ecografía</text>
  <text x="430" y="418" class="lab">• Reversible si se trata a tiempo</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
