<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Hipotiroidismo: qué cambia cuando la tiroides produce poca hormona</title>
  <desc id="d">Dos paneles. A la izquierda, una tiroides que produce suficiente hormona: el cuerpo funciona a su ritmo. A la derecha, una tiroides que no produce suficiente: las funciones se enlentecen, con fatiga, aumento de peso, intolerancia al frío, estreñimiento, piel seca y cabello fino. Abajo, el tratamiento: un medicamento que reemplaza la hormona, con análisis de sangre de control a las seis a ocho semanas, tras cada ajuste y luego una vez al año.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --ok:#1f8a5b; --ok-l:#d7f0e4; --warn:#b7791f; --warn-l:#f7e4bf; --thy:#c9748a; --blue:#1f6fb2; --blue-l:#d6e6f5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --ok:#4cc38a; --ok-l:#1f4033; --warn:#e0b25a; --warn-l:#4a3b1f; --thy:#d98aa0; --blue:#6aa7e8; --blue-l:#1f3347; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">La tiroides y el ritmo del cuerpo</text>

  <rect x="40" y="76" width="350" height="230" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="215" y="102" text-anchor="middle" class="hd" style="fill:var(--ok)">Tiroides con hormona suficiente</text>
  <path d="M215 150 C 180 120, 150 150, 170 180 C 190 205, 205 185, 215 175 C 225 185, 240 205, 260 180 C 280 150, 250 120, 215 150 Z" fill="var(--thy)"/>
  <text x="215" y="228" text-anchor="middle" class="lab">Controla cómo el cuerpo usa la energía</text>
  <text x="215" y="248" text-anchor="middle" class="lab">Respiración, ritmo del corazón,</text>
  <text x="215" y="266" text-anchor="middle" class="lab">peso, digestión y ánimo</text>
  <text x="215" y="292" text-anchor="middle" class="small muted">Funciones a su ritmo</text>

  <rect x="410" y="76" width="350" height="230" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="585" y="102" text-anchor="middle" class="hd" style="fill:var(--warn)">Tiroides con poca hormona</text>
  <path d="M585 135 C 560 118, 540 135, 552 155 C 564 172, 575 160, 585 154 C 595 160, 606 172, 618 155 C 630 135, 610 118, 585 135 Z" fill="var(--thy)" opacity="0.6"/>
  <text x="585" y="198" text-anchor="middle" class="lab">Muchas funciones se enlentecen</text>
  <text x="585" y="222" text-anchor="middle" class="small">Fatiga · aumento de peso · intolerancia al frío</text>
  <text x="585" y="240" text-anchor="middle" class="small">Estreñimiento · piel seca · cabello fino</text>
  <text x="585" y="258" text-anchor="middle" class="small">Cara hinchada · depresión · pulso lento</text>
  <text x="585" y="288" text-anchor="middle" class="small muted">Se desarrolla despacio: puede pasar meses sin notarse</text>

  <rect x="40" y="326" width="720" height="70" rx="10" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/>
  <text x="400" y="352" text-anchor="middle" class="hd" style="fill:var(--blue)">Tratamiento: un medicamento que reemplaza la hormona</text>
  <text x="400" y="376" text-anchor="middle" class="lab">Análisis a las 6–8 semanas, tras cada ajuste de dosis y luego una vez al año</text>
</svg>
