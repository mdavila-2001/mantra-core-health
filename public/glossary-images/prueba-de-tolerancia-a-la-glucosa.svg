<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de tolerancia a la glucosa</title>
  <desc id="d">Arriba, cuatro pasos: extracción en ayunas, toma de una bebida de glucosa, reposo sentado y nuevas extracciones a tiempos fijados. Abajo a la izquierda, dos curvas de glucosa en sangre durante la prueba: una sube y vuelve a bajar, lo que indica buena regulación, y otra sigue alta. Abajo a la derecha, para qué sirve: diabetes gestacional, diabetes tipo 2 y prediabetes.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="180" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Cómo se hace la prueba</text>
  <rect x="40" y="66" width="168" height="114" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="124" y="150" text-anchor="middle" class="step">En ayunas</text>
  <text x="124" y="168" text-anchor="middle" class="small">Primera extracción</text>
  <path d="M210 123 L224 123" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="226" y="66" width="168" height="114" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="310" y="150" text-anchor="middle" class="step">Bebida de glucosa</text>
  <text x="310" y="168" text-anchor="middle" class="small">En pocos minutos</text>
  <path d="M396 123 L410 123" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="412" y="66" width="168" height="114" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="496" y="150" text-anchor="middle" class="step">Reposo</text>
  <text x="496" y="168" text-anchor="middle" class="small">Sentado, sin comer</text>
  <path d="M582 123 L596 123" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="598" y="66" width="168" height="114" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="682" y="150" text-anchor="middle" class="step">Nuevas extracciones</text>
  <text x="682" y="168" text-anchor="middle" class="small">A tiempos fijados</text>
  <rect x="111" y="76" width="26" height="70" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="114" y="102" width="20" height="41" rx="9" fill="var(--vessel)"/>
  <rect x="108" y="68" width="32" height="14" rx="4" fill="var(--accent)"/>
  <rect x="670" y="76" width="26" height="70" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="673" y="102" width="20" height="41" rx="9" fill="var(--vessel)"/>
  <rect x="667" y="68" width="32" height="14" rx="4" fill="var(--accent)"/>
  <path d="M290 84 L330 84 L326 132 L294 132 Z" fill="var(--warn-l)" stroke="var(--muted)" stroke-width="1.5"/>
  <circle cx="498" cy="104" r="26" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M498 104 V86 M498 104 L512 112" stroke="var(--ink)" stroke-width="2"/>
  <rect x="20" y="214" width="460" height="236" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="244" text-anchor="middle" class="title">Glucosa en sangre durante la prueba</text>
  <path d="M70 410 H450 M70 410 V250" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M70 360 C120 340 150 270 200 280 C260 290 300 350 450 362" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <path d="M70 330 C120 300 170 250 230 256 C300 262 360 280 450 290" fill="none" stroke="var(--bad)" stroke-width="3"/>
  <text x="450" y="354" text-anchor="end" class="small" style="fill:var(--ok)">Regula bien</text>
  <text x="450" y="282" text-anchor="end" class="small" style="fill:var(--bad)">Glucosa sigue alta</text>
  <text x="260" y="434" text-anchor="middle" class="small muted">Tiempo desde que bebe la glucosa</text>
  <rect x="500" y="214" width="280" height="236" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="244" text-anchor="middle" class="title">Para qué sirve</text>
  <text x="516" y="258" class="lab">• Diabetes gestacional</text>
  <text x="516" y="286" class="lab">• Diabetes tipo 2</text>
  <text x="516" y="314" class="lab">• Prediabetes</text>
  <text x="516" y="342" class="lab">• Tolerancia alterada</text>
  <text x="640" y="396" text-anchor="middle" class="small muted">Requiere preparación y</text>
  <text x="640" y="414" text-anchor="middle" class="small muted">unas horas en el centro</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
