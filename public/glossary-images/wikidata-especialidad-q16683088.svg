<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Oncourología</title>
  <desc id="d">A la izquierda, el aparato urinario y genital masculino con los riñones, los uréteres, la vejiga, la próstata y un testículo, órganos de los que se ocupa la especialidad. A la derecha, los cánceres que atiende, los signos para consultar y los tratamientos.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Órganos que abarca</text>
  <path d="M150 90 C120 90 110 150 130 170 C112 186 120 220 150 220 C180 220 186 190 172 170 C186 150 180 90 150 90 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1" opacity=".9"/>
  <path d="M290 90 C320 90 330 150 310 170 C328 186 320 220 290 220 C260 220 254 190 268 170 C254 150 260 90 290 90 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1" opacity=".9"/>
  <path d="M160 210 C170 260 190 290 200 310 M280 210 C270 260 250 290 240 310" fill="none" stroke="var(--fluid)" stroke-width="4"/>
  <path d="M170 300 C170 280 270 280 270 300 C270 340 250 356 220 356 C190 356 170 340 170 300 Z" fill="var(--fluid)" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="220" cy="372" r="18" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <line x1="220" y1="390" x2="220" y2="420" stroke="var(--warn)" stroke-width="4"/>
  <text x="100" y="150" text-anchor="end" class="small">Riñón</text>
  <text x="340" y="150" class="small">Riñón</text>
  <text x="130" y="262" text-anchor="end" class="small" style="fill:var(--warn)">Uréter</text>
  <text x="290" y="326" class="small" style="fill:var(--warn)">Vejiga</text>
  <text x="256" y="380" class="small" style="fill:var(--violet)">Próstata</text>
  <circle cx="320" cy="410" r="12" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <text x="340" y="414" class="small">Testículo</text>
  <text x="220" y="72" text-anchor="middle" class="small" style="fill:var(--muted)">También pene y glándulas suprarrenales</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende y cómo</text>
  <text x="476" y="80" class="small">• Cáncer de próstata</text>
  <text x="476" y="102" class="small">• Cáncer de vejiga</text>
  <text x="476" y="124" class="small">• Cáncer de riñón</text>
  <text x="476" y="146" class="small">• Cáncer de testículo</text>
  <text x="476" y="168" class="small">• Tumores de las vías urinarias</text>
  <rect x="476" y="200" width="284" height="72" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="618" y="226" text-anchor="middle" class="small">Consultar si hay sangre en la</text>
  <text x="618" y="246" text-anchor="middle" class="small">orina o un bulto en el testículo</text>
  <text x="476" y="304" class="step">Tratamientos</text>
  <text x="484" y="328" class="small">• Vigilancia activa</text>
  <text x="484" y="350" class="small">• Cirugía abierta, laparoscópica o robótica</text>
  <text x="484" y="372" class="small">• Radioterapia y tratamientos sistémicos</text>
  <text x="484" y="394" class="small">• Decisión en comité multidisciplinar</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
