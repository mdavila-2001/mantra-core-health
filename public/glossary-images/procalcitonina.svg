  <text x="300" y="256" text-anchor="middle" class="small">El interferón</text>
  <text x="300" y="274" text-anchor="middle" class="small">frena su subida</text>
  <circle cx="300" cy="316" r="9" fill="var(--purple)"/>
  <text x="120" y="384" text-anchor="middle" class="step" style="fill:var(--ok)">PCT alta</text>
  <text x="300" y="384" text-anchor="middle" class="step" style="fill:var(--warn)">PCT poco elevada</text>
  <text x="210" y="416" text-anchor="middle" class="small muted">PCT = procalcitonina</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Para qué se usa</text>
