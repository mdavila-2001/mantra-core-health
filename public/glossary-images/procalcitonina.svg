  <path d="M442 110 V144 a13 13 0 0 0 26 0 V110 Z" fill="var(--vessel)"/>
  <text x="486" y="92" class="lab">Suero o plasma</text>
  <text x="486" y="114" class="small muted">Suele pedirse en el hospital</text>
  <text x="436" y="210" class="lab">• Orientar si una infección es bacteriana</text>
  <text x="436" y="238" class="lab">• Valorar la gravedad de una sepsis</text>
  <text x="436" y="266" class="lab">• Decidir cuándo suspender antibióticos</text>
  <text x="436" y="294" class="lab">• Seguir la evolución día a día</text>
  <rect x="436" y="340" width="324" height="80" rx="10" fill="var(--accent-l)"/>
  <text x="452" y="366" class="lab">Nunca decide sola: se interpreta</text>
  <text x="452" y="386" class="lab">con la exploración y otras pruebas.</text>
  <text x="452" y="406" class="small">Cirugía o traumatismo también la suben.</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
