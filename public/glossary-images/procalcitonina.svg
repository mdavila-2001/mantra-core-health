<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Procalcitonina en sangre</title>
  <desc id="d">A la izquierda, comparación entre una infección bacteriana, en la que muchos tejidos liberan procalcitonina y su nivel sube mucho, y una infección por virus, en la que apenas se eleva. A la derecha, un tubo de sangre y los usos de la prueba: orientar el origen bacteriano, valorar la sepsis y decidir la duración de los antibióticos.</desc>
