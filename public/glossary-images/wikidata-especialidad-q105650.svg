<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Órganos y problemas que atiende la urología</title>
  <desc id="d">Esquema del aparato urinario con los dos riñones, los uréteres, la vejiga, la próstata y la uretra. A la derecha, los problemas frecuentes que atiende la urología, como cálculos o crecimiento de la próstata, y sus herramientas de diagnóstico y tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Urología: aparato urinario y aparato reproductor masculino</text>
  <rect x="20" y="60" width="400" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="88" text-anchor="middle" class="title">Órganos que atiende</text>
  <path d="M130 140 C100 140 96 200 120 220 C140 236 160 210 156 180 C152 156 146 140 130 140 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M310 140 C340 140 344 200 320 220 C300 236 280 210 284 180 C288 156 294 140 310 140 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M150 210 C170 260 190 300 205 330 M290 210 C270 260 250 300 235 330" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M190 320 C190 300 250 300 250 320 C252 350 236 370 220 370 C204 370 188 350 190 320 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <ellipse cx="220" cy="384" rx="16" ry="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <path d="M220 394 L220 430" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text x="80" y="128" text-anchor="middle" class="small b">Riñón</text>
  <text x="360" y="128" text-anchor="middle" class="small b">Riñón</text>
  <text x="130" y="280" text-anchor="middle" class="small">Uréter</text>
  <text x="220" y="344" text-anchor="middle" class="small b">Vejiga</text>
  <line x1="236" y1="386" x2="300" y2="396" stroke="var(--muted)" stroke-width="1"/>
  <text x="304" y="400" class="small">Próstata</text>
  <text x="244" y="426" class="small">Uretra</text>
  <rect x="436" y="60" width="344" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="88" text-anchor="middle" class="h">Problemas frecuentes</text>
  <text x="454" y="108" class="small">• Cálculos renales</text>
  <text x="454" y="132" class="small">• Infecciones urinarias</text>
  <text x="454" y="156" class="small">• Crecimiento de la próstata</text>
  <text x="454" y="180" class="small">• Incontinencia</text>
  <text x="454" y="204" class="small">• Cáncer de próstata, vejiga, riñón</text>
  <text x="454" y="228" class="small">• Infertilidad y disfunción eréctil</text>
  <rect x="436" y="276" width="344" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="304" text-anchor="middle" class="h">Herramientas</text>
  <text x="454" y="322" class="small">• Análisis de orina y PSA</text>
  <text x="454" y="348" class="small">• Ecografía y tomografía</text>
  <text x="454" y="374" class="small">• Cistoscopia (cámara)</text>
  <text x="454" y="400" class="small">• Cirugía endoscópica y robótica</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
