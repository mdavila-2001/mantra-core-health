<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía craneofacial</title>
  <desc id="d">A la izquierda, un cráneo de bebé visto desde arriba con la fontanela y las suturas sagital, coronal y lambdoidea, cuyo cierre antes de tiempo deforma el cráneo. A la derecha, lo que trata la cirugía craneofacial: craneosinostosis, hendiduras de labio y paladar, asimetrías faciales, traumatismos y tumores, y el equipo multidisciplinar que participa.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Cráneo visto desde arriba</text>
  <ellipse cx="230" cy="230" rx="130" ry="160" fill="var(--bone)" stroke="var(--line)" stroke-width="2"/>
  <path d="M230 70 V390" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M104 190 Q230 150 356 190" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M118 320 Q230 350 342 320" fill="none" stroke="var(--muted)" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M215 150 Q230 140 245 150 Q240 168 230 172 Q220 168 215 150 Z" fill="var(--panel)" stroke="var(--muted)"/>
  <text x="430" y="84" text-anchor="end" class="small muted">Cara hacia arriba</text>
  <circle cx="230" cy="260" r="3" fill="var(--ink)"/>
  <path d="M230 260 L300 260" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="304" y="264" class="lab">Sutura sagital</text>
  <circle cx="300" cy="172" r="3" fill="var(--ink)"/>
  <path d="M300 172 L330 120" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="124" class="lab">Coronal</text>
  <circle cx="300" cy="336" r="3" fill="var(--ink)"/>
  <path d="M300 336 L320 410" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="324" y="414" class="lab">Lambdoidea</text>
  <circle cx="230" cy="158" r="3" fill="var(--ink)"/>
  <path d="M230 158 L110 110" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="106" y="114" text-anchor="end" class="lab">Fontanela</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Qué trata</text>
  <rect x="476" y="58" width="288" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="492" y="79" class="step">Craneosinostosis</text>
  <text x="492" y="97" class="small">Cierre precoz de suturas</text>
  <rect x="476" y="120" width="288" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="492" y="141" class="step">Hendiduras</text>
  <text x="492" y="159" class="small">Labio y paladar fisurados</text>
  <rect x="476" y="182" width="288" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="492" y="203" class="step">Asimetrías faciales</text>
  <text x="492" y="221" class="small">Maxilares y órbitas</text>
  <rect x="476" y="244" width="288" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="492" y="265" class="step">Traumatismos</text>
  <text x="492" y="283" class="small">Fracturas de la cara</text>
  <rect x="476" y="306" width="288" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="492" y="327" class="step">Tumores</text>
  <text x="492" y="345" class="small">Base del cráneo y cara</text>
  <text x="620" y="384" text-anchor="middle" class="small">Equipo: cirugía plástica,</text>
  <text x="620" y="402" text-anchor="middle" class="small">neurocirugía, maxilofacial,</text>
  <text x="620" y="420" text-anchor="middle" class="small">ortodoncia y logopedia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
