<line x1="50" y1="174" x2="176" y2="199.2" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="176" y1="199.2" x2="324" y2="209.1" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="50" y1="210" x2="176" y2="210.0" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="176" y1="210.0" x2="324" y2="210.0" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="50" y1="246" x2="176" y2="220.8" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="176" y1="220.8" x2="324" y2="210.9" stroke="var(--yellow)" stroke-width="2.5"/>
<text x="176" y="140" text-anchor="middle" class="small">Cristalino</text>
<text x="332" y="280" text-anchor="end" class="small" style="fill:var(--organ)">Retina</text>
<circle cx="596" cy="210" r="110" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<path d="M516 132 C486 170 486 250 516 288" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M534 150 L534 188 M534 232 L534 270" fill="none" stroke="var(--purple)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="552" cy="210" rx="16" ry="34" fill="var(--warn)" stroke="var(--muted)" stroke-width="1.5" opacity=".85"/>
<path d="M696 170 C710 200 710 220 696 250" fill="none" stroke="var(--organ)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="426" y1="174" x2="544" y2="199.2" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="426" y1="210" x2="544" y2="210.0" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="426" y1="246" x2="544" y2="220.8" stroke="var(--yellow)" stroke-width="2.5"/>
<line x1="566" y1="204" x2="626" y2="170" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="3 4"/>
<line x1="566" y1="216" x2="626" y2="250" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="552" y="140" text-anchor="middle" class="small">Cristalino</text>
<text x="708" y="280" text-anchor="end" class="small" style="fill:var(--organ)">Retina</text>
<text x="200" y="360" text-anchor="middle" class="lab">Lente transparente: la luz se</text>
<text x="200" y="378" text-anchor="middle" class="lab">enfoca nítida en la retina.</text>
<text x="588" y="360" text-anchor="middle" class="lab">Lente opaca: visión borrosa,</text>
<text x="588" y="378" text-anchor="middle" class="lab">colores apagados y deslumbramiento.</text>
<text x="200" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Causa principal: el envejecimiento</text>
<text x="588" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Tratamiento: cirugía con lente artificial</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
