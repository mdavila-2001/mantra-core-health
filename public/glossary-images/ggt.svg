<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué mide la gamma glutamil transferasa</title>
  <desc id="d">A la izquierda, el hígado con la vesícula y la vía biliar, donde abunda la enzima GGT, que pasa a la sangre cuando la bilis se estanca o el hígado se irrita. A la derecha, un tubo de suero y la lista de situaciones que la prueba ayuda a evaluar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">GGT: una enzima del hígado y las vías biliares</text>
  <rect x="20" y="60" width="420" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="88" text-anchor="middle" class="title">Dónde está la enzima</text>
  <path d="M60 180 C80 120 260 100 380 130 C420 145 410 200 360 230 C300 270 200 290 120 280 C70 270 50 230 60 180 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <text x="170" y="175" text-anchor="middle" class="h">Hígado</text>
  <path d="M200 210 C230 230 250 250 260 300 M300 200 C290 240 270 260 260 300 M260 300 L260 360" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round"/>
  <path d="M296 312 C280 312 266 318 261 330" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <ellipse cx="320" cy="310" rx="26" ry="16" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="352" y="314" class="small">Vesícula</text>
  <text x="268" y="376" class="small">Vía biliar</text>
  <text x="230" y="410" text-anchor="middle" class="small muted">Si la bilis se estanca o el hígado se irrita,</text>
  <text x="230" y="426" text-anchor="middle" class="small muted">la GGT pasa a la sangre en mayor cantidad</text>
  <rect x="456" y="60" width="324" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="88" text-anchor="middle" class="h">Qué ayuda a evaluar</text>
  <rect x="486" y="110" width="26" height="80" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="488" y="140" width="22" height="48" rx="10" fill="var(--warn)" opacity=".85"/>
  <rect x="483" y="102" width="32" height="12" rx="3" fill="var(--accent)"/>
  <text x="499" y="210" text-anchor="middle" class="small muted">Suero</text>
  <text x="530" y="140" class="small">Se interpreta junto</text>
  <text x="530" y="156" class="small">con la fosfatasa</text>
  <text x="530" y="172" class="small">alcalina y las transaminasas</text>
  <text x="474" y="250" class="lab">• Obstrucción de la vía biliar</text>
  <text x="474" y="278" class="lab">• Daño hepático</text>
  <text x="474" y="306" class="lab">• Consumo de alcohol</text>
  <text x="474" y="334" class="lab">• Efecto de algunos fármacos</text>
  <text x="474" y="362" class="lab">• Origen hepático de una</text>
  <text x="485" y="390" class="lab">fosfatasa alcalina alta</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
