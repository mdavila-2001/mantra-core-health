<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Obesidad</title>
  <desc id="d">A la izquierda, un círculo central de exceso de grasa corporal al que llegan flechas de seis factores: genética, alimentación, sedentarismo, sueño y estrés, fármacos y entorno. A la derecha, las enfermedades cuyo riesgo aumenta, cómo se valora con el IMC y la cintura, y las opciones de tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Muchos factores a la vez</text>
  <circle cx="200" cy="230" r="62" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="200" y="226" text-anchor="middle" class="lab">Exceso de</text>
  <text x="200" y="246" text-anchor="middle" class="step">grasa corporal</text>
  <line x1="200.0" y1="124.4" x2="200.0" y2="179.84" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="291.2" y1="174.0" x2="243.32" y2="203.4" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="291.2" y1="286.0" x2="243.32" y2="256.6" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="200.0" y1="335.6" x2="200.0" y2="280.15999999999997" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="108.8" y1="286.0" x2="156.68" y2="256.6" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="108.8" y1="174.0" x2="156.68" y2="203.4" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="144" y="82" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="200.0" y="102.32" text-anchor="middle" class="small" style="fill:var(--on)">Genética</text>
  <rect x="258" y="144" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="314.0" y="164.32" text-anchor="middle" class="small" style="fill:var(--on)">Alimentación</text>
  <rect x="258" y="284" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="314.0" y="304.32" text-anchor="middle" class="small" style="fill:var(--on)">Sedentarismo</text>
  <rect x="144" y="346" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="200.0" y="366.32" text-anchor="middle" class="small" style="fill:var(--on)">Sueño y estrés</text>
  <rect x="30" y="284" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="86.0" y="304.32" text-anchor="middle" class="small" style="fill:var(--on)">Fármacos</text>
  <rect x="30" y="144" width="112" height="32" rx="8" fill="var(--accent)"/>
  <text x="86.0" y="164.32" text-anchor="middle" class="small" style="fill:var(--on)">Entorno</text>
  <text x="200" y="418" text-anchor="middle" class="small muted">Es una enfermedad crónica</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Por qué importa</text>
  <text x="436" y="76" class="step">Aumenta el riesgo de</text>
  <rect x="436" y="90" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="111.32" text-anchor="middle" class="small" style="fill:var(--ink)">Diabetes tipo 2</text>
  <rect x="602" y="90" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="111.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hipertensión</text>
  <rect x="436" y="134" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="155.32" text-anchor="middle" class="small" style="fill:var(--ink)">Infarto e ictus</text>
  <rect x="602" y="134" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="155.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hígado graso</text>
  <rect x="436" y="178" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="199.32" text-anchor="middle" class="small" style="fill:var(--ink)">Apnea del sueño</text>
  <rect x="602" y="178" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="199.32" text-anchor="middle" class="small" style="fill:var(--ink)">Artrosis</text>
  <text x="436" y="252" class="step">Cómo se valora</text>
  <text x="440" y="278" class="lab">• Índice de masa corporal (IMC)</text>
  <text x="440" y="302" class="lab">• Perímetro de la cintura</text>
  <rect x="436" y="334" width="324" height="86" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="360" class="lab">Perder un poco de peso ya mejora</text>
  <text x="452" y="380" class="lab">la salud. Dieta, actividad, apoyo,</text>
  <text x="452" y="400" class="lab">fármacos o cirugía según el caso</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
