<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía ocular con láser</title>
  <desc id="d">A la izquierda, un corte del ojo en el que los rayos de luz atraviesan la córnea y el cristalino hacia la retina, y la córnea con una nueva curvatura tras el láser. A la derecha, los tres pasos del LASIK, otras técnicas y requisitos previos.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">La córnea se remodela</text>
  <circle cx="230" cy="220" r="120" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M126 160 C100 190 100 250 126 280" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <path d="M126 160 C112 190 112 250 126 280" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="170" cy="220" rx="20" ry="44" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="140" y="150" width="10" height="40" rx="3" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <rect x="140" y="250" width="10" height="40" rx="3" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="320" cy="220" r="10" fill="var(--organ-d)" stroke="none" stroke-width="2"/>
  <path d="M350 220 C352 160 330 120 300 110" fill="none" stroke="var(--nerve)" stroke-width="0"/>
  <line x1="40" y1="190" x2="166" y2="211.0" stroke="var(--beam)" stroke-width="2"/>
  <line x1="170" y1="211.0" x2="318" y2="220" stroke="var(--beam)" stroke-width="2"/>
  <line x1="40" y1="220" x2="166" y2="220.0" stroke="var(--beam)" stroke-width="2"/>
  <line x1="170" y1="220.0" x2="318" y2="220" stroke="var(--beam)" stroke-width="2"/>
  <line x1="40" y1="250" x2="166" y2="229.0" stroke="var(--beam)" stroke-width="2"/>
  <line x1="170" y1="229.0" x2="318" y2="220" stroke="var(--beam)" stroke-width="2"/>
  <text x="110" y="120" text-anchor="middle" class="small" style="fill:var(--accent)">Córnea</text>
  <text x="110" y="316" text-anchor="middle" class="small" style="fill:var(--vessel)">Nueva curvatura</text>
  <text x="170" y="300" text-anchor="middle" class="small" style="fill:var(--muted)">Cristalino</text>
  <text x="330" y="260" text-anchor="middle" class="small" style="fill:var(--organ-d)">Retina</text>
  <text x="230" y="380" text-anchor="middle" class="small">La luz enfoca de nuevo sobre la retina</text>
  <text x="230" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Corrige miopía, hipermetropía y astigmatismo</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Técnicas habituales</text>
  <text x="456" y="74" class="step">LASIK</text>
  <rect x="456" y="86" width="92" height="50" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="502.0" y="107.5" text-anchor="middle" class="small">1 Se crea</text>
  <text x="502.0" y="124.5" text-anchor="middle" class="small">un colgajo</text>
  <rect x="562" y="86" width="92" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="608.0" y="107.5" text-anchor="middle" class="small">2 El láser</text>
  <text x="608.0" y="124.5" text-anchor="middle" class="small">talla la córnea</text>
  <rect x="668" y="86" width="92" height="50" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="714.0" y="107.5" text-anchor="middle" class="small">3 Se repone</text>
  <text x="714.0" y="124.5" text-anchor="middle" class="small">el colgajo</text>
  <text x="456" y="172" class="step">PRK y SMILE</text>
  <text x="464" y="196" class="small">• PRK: láser sobre la superficie</text>
  <text x="464" y="216" class="small">• SMILE: extrae una lámina por una</text>
  <text x="464" y="236" class="small">• pequeña incisión</text>
  <rect x="456" y="268" width="304" height="154" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="472" y="294" class="step" style="fill:var(--warn)">Antes de decidir</text>
  <text x="480" y="318" class="small">• Graduación estable</text>
  <text x="480" y="340" class="small">• Córnea con grosor suficiente</text>
  <text x="480" y="362" class="small">• Revisar ojo seco y otras enfermedades</text>
  <text x="480" y="384" class="small">• No evita la vista cansada con la edad</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
