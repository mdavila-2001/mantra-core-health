<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Creatina cinasa total</title>
  <desc id="d">A la izquierda, el músculo esquelético y el corazón liberan creatina cinasa a la sangre cuando sus fibras se dañan, y un tubo de sangre recoge la muestra. A la derecha, las situaciones que ayuda a valorar.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">De dónde sale la CK</text>
  <path d="M60 90 C60 70 160 70 160 90 L160 140 C160 160 60 160 60 140 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="80" y1="80" x2="80" y2="150" stroke="var(--organ-d)" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="150" stroke="var(--organ-d)" stroke-width="1"/>
  <line x1="120" y1="80" x2="120" y2="150" stroke="var(--organ-d)" stroke-width="1"/>
  <line x1="140" y1="80" x2="140" y2="150" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="110" y="180" text-anchor="middle" class="small">Músculo esquelético</text>
  <path d="M290 150 C250 120 240 80 270 72 C285 68 290 80 290 88 C290 80 295 68 310 72 C340 80 330 120 290 150 Z" fill="var(--vessel)" stroke="var(--vessel)" stroke-width="1"/>
  <text x="290" y="180" text-anchor="middle" class="small">Corazón</text>
  <rect x="60" y="216" width="280" height="50" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="200.0" y="237.5" text-anchor="middle" class="lab">Si las fibras musculares se dañan,</text>
  <text x="200.0" y="254.5" text-anchor="middle" class="lab">la CK pasa a la sangre</text>
  <line x1="110" y1="186" x2="140" y2="212" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="290" y1="186" x2="260" y2="212" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="200" y1="270" x2="200" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="185" y="304" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M188 318 V374 a12 12 0 0 0 24 0 V318" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M190 344 V374 a10 10 0 0 0 20 0 V344 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="200" y="425" text-anchor="middle" class="lab">Muestra: sangre</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Qué ayuda a valorar</text>
  <rect x="416" y="60" width="344" height="46" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="432" y="80" class="lab">Ejercicio intenso</text>
  <text x="432" y="97" class="small" style="fill:var(--muted)">sube de forma transitoria</text>
  <rect x="416" y="114" width="344" height="46" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="432" y="134" class="lab">Lesión o golpe muscular</text>
  <text x="432" y="151" class="small" style="fill:var(--muted)">traumatismos, inyecciones</text>
  <rect x="416" y="168" width="344" height="46" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="432" y="188" class="lab">Rabdomiólisis</text>
  <text x="432" y="205" class="small" style="fill:var(--muted)">rotura muscular extensa</text>
  <rect x="416" y="222" width="344" height="46" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="432" y="242" class="lab">Miopatías y miositis</text>
  <text x="432" y="259" class="small" style="fill:var(--muted)">enfermedad del músculo</text>
  <rect x="416" y="276" width="344" height="46" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="432" y="296" class="lab">Efectos de algunos fármacos</text>
  <text x="432" y="313" class="small" style="fill:var(--muted)">como las estatinas</text>
  <text x="588" y="352" text-anchor="middle" class="small">Para el corazón se usan hoy pruebas</text>
  <text x="588" y="370" text-anchor="middle" class="small">más específicas, como la troponina.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
