<circle cx="86" cy="275" r="3.5" fill="var(--purple)"/>
<circle cx="135" cy="277" r="3.5" fill="var(--purple)"/>
<circle cx="124" cy="269" r="3.5" fill="var(--purple)"/>
<circle cx="122" cy="275" r="3.5" fill="var(--purple)"/>
<circle cx="127" cy="270" r="3.5" fill="var(--purple)"/>
<circle cx="124" cy="270" r="3.5" fill="var(--purple)"/>
<circle cx="129" cy="275" r="3.5" fill="var(--purple)"/>
<circle cx="97" cy="328" r="3.5" fill="var(--purple)"/>
<circle cx="106" cy="316" r="3.5" fill="var(--purple)"/>
<circle cx="100" cy="325" r="3.5" fill="var(--purple)"/>
<circle cx="107" cy="324" r="3.5" fill="var(--purple)"/>
<circle cx="97" cy="324" r="3.5" fill="var(--purple)"/>
<circle cx="106" cy="321" r="3.5" fill="var(--purple)"/>
<circle cx="131" cy="314" r="3.5" fill="var(--purple)"/>
<circle cx="131" cy="319" r="3.5" fill="var(--purple)"/>
<circle cx="144" cy="313" r="3.5" fill="var(--purple)"/>
<circle cx="135" cy="317" r="3.5" fill="var(--purple)"/>
<circle cx="133" cy="319" r="3.5" fill="var(--purple)"/>
<circle cx="132" cy="320" r="3.5" fill="var(--purple)"/>
<text x="110" y="390" text-anchor="middle" class="step" style="fill:var(--bad)">Reactivo</text>
<text x="110" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">grumos visibles</text>
<circle cx="290" cy="300" r="62" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
<circle cx="275" cy="307" r="2.5" fill="var(--purple)"/>
<circle cx="294" cy="276" r="2.5" fill="var(--purple)"/>
<circle cx="270" cy="265" r="2.5" fill="var(--purple)"/>
<circle cx="256" cy="277" r="2.5" fill="var(--purple)"/>
<circle cx="277" cy="324" r="2.5" fill="var(--purple)"/>
<circle cx="272" cy="311" r="2.5" fill="var(--purple)"/>
<circle cx="328" cy="263" r="2.5" fill="var(--purple)"/>
<circle cx="304" cy="322" r="2.5" fill="var(--purple)"/>
<circle cx="304" cy="309" r="2.5" fill="var(--purple)"/>
<circle cx="309" cy="333" r="2.5" fill="var(--purple)"/>
<circle cx="270" cy="311" r="2.5" fill="var(--purple)"/>
<circle cx="257" cy="322" r="2.5" fill="var(--purple)"/>
<circle cx="275" cy="262" r="2.5" fill="var(--purple)"/>
<circle cx="280" cy="326" r="2.5" fill="var(--purple)"/>
<circle cx="298" cy="320" r="2.5" fill="var(--purple)"/>
<circle cx="294" cy="274" r="2.5" fill="var(--purple)"/>
<circle cx="330" cy="293" r="2.5" fill="var(--purple)"/>
<circle cx="258" cy="268" r="2.5" fill="var(--purple)"/>
<circle cx="295" cy="339" r="2.5" fill="var(--purple)"/>
<circle cx="294" cy="273" r="2.5" fill="var(--purple)"/>
<circle cx="330" cy="267" r="2.5" fill="var(--purple)"/>
<circle cx="289" cy="290" r="2.5" fill="var(--purple)"/>
<circle cx="334" cy="271" r="2.5" fill="var(--purple)"/>
<circle cx="309" cy="326" r="2.5" fill="var(--purple)"/>
<circle cx="272" cy="334" r="2.5" fill="var(--purple)"/>
<circle cx="264" cy="337" r="2.5" fill="var(--purple)"/>
<text x="290" y="390" text-anchor="middle" class="step" style="fill:var(--ok)">No reactivo</text>
<text x="290" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">partículas sueltas</text>
<text x="416" y="76" class="h">Prueba no treponémica</text>
<text x="416" y="98" class="lab">Detecta anticuerpos que aparecen en</text>
<text x="416" y="116" class="lab">la sífilis, no la bacteria en sí.</text>
<rect x="416" y="140" width="104" height="36" rx="8" fill="var(--accent)"/>
<text x="468.0" y="162.7" text-anchor="middle" class="lab" style="fill:var(--on)">Cribado</text>
<line x1="520" y1="158" x2="532" y2="158" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="534" y="140" width="104" height="36" rx="8" fill="var(--purple)"/>
<text x="586.0" y="162.7" text-anchor="middle" class="lab" style="fill:var(--on)">Confirmación</text>
<line x1="638" y1="158" x2="650" y2="158" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="652" y="140" width="104" height="36" rx="8" fill="var(--ok)"/>
<text x="704.0" y="162.7" text-anchor="middle" class="lab" style="fill:var(--on)">Seguimiento</text>
<text x="416" y="202" class="small" style="fill:var(--muted)">Un resultado reactivo se confirma con</text>
<text x="416" y="218" class="small" style="fill:var(--muted)">una prueba treponémica.</text>
<text x="416" y="256" class="h">Títulos (diluciones)</text>
<rect x="416" y="270" width="44" height="44" rx="6" fill="var(--purple)" opacity="1.00"/>
<rect x="476" y="270" width="44" height="44" rx="6" fill="var(--purple)" opacity="0.75"/>
<rect x="536" y="270" width="44" height="44" rx="6" fill="var(--purple)" opacity="0.50"/>
<rect x="596" y="270" width="44" height="44" rx="6" fill="var(--purple)" opacity="0.25"/>
<text x="416" y="334" class="small" style="fill:var(--muted)">Si el tratamiento funciona, el título baja.</text>
<text x="416" y="368" class="h">Falsos positivos posibles</text>
<text x="416" y="392" class="lab">Embarazo, enfermedades autoinmunes,</text>
<text x="416" y="410" class="lab">otras infecciones.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
