<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">VDRL: prueba de floculación para la sífilis</title>
  <desc id="d">A la izquierda, el suero o el líquido cefalorraquídeo se mezcla con antígeno de cardiolipina y se observa al microscopio: una muestra reactiva forma grumos y una no reactiva deja partículas sueltas. A la derecha, el uso de la prueba en cribado, confirmación y seguimiento, los títulos que bajan con el tratamiento y las causas de falsos positivos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se hace</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Cómo se interpreta</text>
<rect x="48" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M50 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M51.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="63" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Suero</text>
<text x="90" y="96" class="small" style="fill:var(--muted)">o líquido</text>
<text x="90" y="112" class="small" style="fill:var(--muted)">cefalorraquídeo</text>
<text x="210" y="90" text-anchor="middle" class="title">+</text>
<rect x="240" y="70" width="110" height="50" rx="8" fill="var(--purple-l)" stroke="var(--purple)"/>
<text x="295" y="92" text-anchor="middle" class="small">Antígeno de</text>
<text x="295" y="108" text-anchor="middle" class="small">cardiolipina</text>
<line x1="200" y1="150" x2="200" y2="186" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<text x="200" y="210" text-anchor="middle" class="lab">Se mezcla y se mira al microscopio</text>
<circle cx="110" cy="300" r="62" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
<circle cx="82" cy="277" r="3.5" fill="var(--purple)"/>
<circle cx="83" cy="285" r="3.5" fill="var(--purple)"/>
<circle cx="77" cy="276" r="3.5" fill="var(--purple)"/>
<circle cx="90" cy="283" r="3.5" fill="var(--purple)"/>
