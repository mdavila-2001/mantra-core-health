<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina reproductiva</title>
  <desc id="d">A la izquierda, el útero, las trompas y los ovarios con los tres pasos en los que puede fallar la fertilidad: ovulación, fecundación en la trompa e implantación en el útero, además del factor masculino. A la derecha, los tratamientos: inducción de la ovulación, inseminación, fecundación in vitro, ICSI y preservación de la fertilidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="480" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="260.0" y="50" text-anchor="middle" class="title">Dónde puede fallar la fertilidad</text>
  <path d="M220 200 C220 160 300 160 300 200 L290 300 C286 330 276 340 272 360 L248 360 C244 340 234 330 230 300 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M224 192 C180 180 140 150 100 170 M296 192 C340 180 380 150 420 170" fill="none" stroke="var(--organ)" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="100" cy="214" rx="26" ry="18" fill="var(--warn)" opacity=".7"/><ellipse cx="420" cy="214" rx="26" ry="18" fill="var(--warn)" opacity=".7"/>
  <circle cx="404" cy="196" r="6" fill="var(--panel)" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="340" cy="180" r="7" fill="var(--panel)" stroke="var(--purple)" stroke-width="2"/>
  <circle cx="262" cy="250" r="8" fill="var(--purple)" opacity=".7"/>
  <circle cx="430" cy="262" r="11" fill="var(--accent)"/>
  <text x="430" y="267" text-anchor="middle" class="small on">1</text>
  <text x="446" y="267" class="small">Ovulación</text>
  <circle cx="340" cy="130" r="11" fill="var(--accent)"/>
  <text x="340" y="135" text-anchor="middle" class="small on">2</text>
  <text x="356" y="135" class="small">Fecundación en trompa</text>
  <circle cx="150" cy="300" r="11" fill="var(--accent)"/>
  <text x="150" y="305" text-anchor="middle" class="small on">3</text>
  <text x="134" y="305" text-anchor="end" class="small">Implantación</text>
  <text x="260" y="400" text-anchor="middle" class="small">Factor masculino: cantidad y calidad</text>
  <text x="260" y="418" text-anchor="middle" class="small">de los espermatozoides</text>
  <rect x="520" y="20" width="260" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="650.0" y="50" text-anchor="middle" class="title">Tratamientos</text>
  <rect x="536" y="58" width="228" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650" y="83" text-anchor="middle" class="step">Inducción</text>
  <text x="650" y="102" text-anchor="middle" class="small">de la ovulación</text>
  <rect x="536" y="132" width="228" height="60" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="650" y="157" text-anchor="middle" class="step">Inseminación</text>
  <text x="650" y="176" text-anchor="middle" class="small">en el útero</text>
  <rect x="536" y="206" width="228" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650" y="231" text-anchor="middle" class="step">FIV</text>
  <text x="650" y="250" text-anchor="middle" class="small">fecundar en laboratorio</text>
  <rect x="536" y="280" width="228" height="60" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="650" y="305" text-anchor="middle" class="step">ICSI</text>
  <text x="650" y="324" text-anchor="middle" class="small">un espermatozoide al óvulo</text>
  <rect x="536" y="354" width="228" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650" y="379" text-anchor="middle" class="step">Preservación</text>
  <text x="650" y="398" text-anchor="middle" class="small">congelar óvulos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
