<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo actúa la radioterapia</title>
  <desc id="d">A la izquierda, un corte del cuerpo con un tumor en el que se cruzan varios haces de radiación procedentes de distintos ángulos. A la derecha, el mecanismo: la radiación daña el ADN de la célula tumoral, que muere, y las modalidades externa y braquiterapia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Radioterapia: radiación dirigida al tumor</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="90" text-anchor="middle" class="title">Haces desde varios ángulos</text>
  <ellipse cx="210" cy="260" rx="140" ry="90" fill="var(--skin)" stroke="var(--muted)"/>
  <circle cx="230" cy="255" r="22" fill="var(--pur)" stroke="var(--panel)" stroke-width="2"/>
  <line x1="60" y1="150" x2="230" y2="255" stroke="var(--warn)" stroke-width="6" opacity=".55"/>
  <rect x="46" y="140" width="28" height="20" rx="4" fill="var(--accent)" stroke="none"/>
  <line x1="210" y1="120" x2="230" y2="255" stroke="var(--warn)" stroke-width="6" opacity=".55"/>
  <rect x="196" y="110" width="28" height="20" rx="4" fill="var(--accent)" stroke="none"/>
  <line x1="360" y1="150" x2="230" y2="255" stroke="var(--warn)" stroke-width="6" opacity=".55"/>
  <rect x="346" y="140" width="28" height="20" rx="4" fill="var(--accent)" stroke="none"/>
  <line x1="370" y1="380" x2="230" y2="255" stroke="var(--warn)" stroke-width="6" opacity=".55"/>
  <rect x="356" y="370" width="28" height="20" rx="4" fill="var(--accent)" stroke="none"/>
  <line x1="60" y1="390" x2="230" y2="255" stroke="var(--warn)" stroke-width="6" opacity=".55"/>
  <rect x="46" y="380" width="28" height="20" rx="4" fill="var(--accent)" stroke="none"/>
  <text x="268" y="300" class="lab b">Tumor</text>
  <text x="210" y="420" text-anchor="middle" class="small">Dosis máxima donde se cruzan los haces</text>
  <rect x="416" y="60" width="364" height="236" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="90" text-anchor="middle" class="title">Cómo actúa</text>
  <rect x="436" y="108" width="100" height="70" rx="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="486.0" y="148.0" text-anchor="middle" class="lab">Radiación</text>
  <line x1="538" y1="143.0" x2="550" y2="143.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="552" y="108" width="100" height="70" rx="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="602.0" y="148.0" text-anchor="middle" class="lab">Daña el ADN</text>
  <line x1="654" y1="143.0" x2="666" y2="143.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="668" y="108" width="100" height="70" rx="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="718.0" y="148.0" text-anchor="middle" class="lab">Célula muere</text>
  <text x="598" y="220" text-anchor="middle" class="small">Las células sanas reparan mejor el daño:</text>
  <text x="598" y="238" text-anchor="middle" class="small">por eso la dosis se divide en sesiones</text>
  <text x="598" y="266" text-anchor="middle" class="small muted">El efecto aparece en días o semanas</text>
  <rect x="416" y="312" width="364" height="128" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="342" text-anchor="middle" class="title">Modalidades</text>
  <rect x="436" y="350" width="156" height="70" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="514.0" y="382.0" text-anchor="middle" class="lab b">Externa</text>
  <text x="514.0" y="399.0" text-anchor="middle" class="small muted">acelerador lineal</text>
  <rect x="604" y="350" width="156" height="70" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="682.0" y="382.0" text-anchor="middle" class="lab b">Braquiterapia</text>
  <text x="682.0" y="399.0" text-anchor="middle" class="small muted">fuente interna</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
