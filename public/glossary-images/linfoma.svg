<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dónde se origina el linfoma</title>
  <desc id="d">Silueta humana con el sistema linfático y los ganglios del cuello, las axilas y las ingles, además del bazo. A la derecha, un ganglio ampliado en el que un linfocito anormal se multiplica sin control, los dos grandes tipos de linfoma y los síntomas que justifican consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Linfoma: cáncer de los linfocitos</text>
  <rect x="20" y="60" width="340" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="190.0" y="90" text-anchor="middle" class="title">Sistema linfático</text>
  <circle cx="190" cy="120" r="26" fill="var(--skin)" stroke="var(--muted)"/>
  <path d="M150 150 L230 150 L250 290 L230 300 L222 420 L196 420 L190 320 L184 420 L158 420 L150 300 L130 290 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M190 150 L190 300 M160 180 L120 280 M220 180 L260 280 M190 300 L170 400 M190 300 L210 400" fill="none" stroke="var(--ok)" stroke-width="1.5" opacity=".8"/>
  <circle cx="176" cy="154" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="204" cy="154" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="160" cy="176" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="220" cy="176" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="172" cy="296" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="208" cy="296" r="7" fill="var(--ok)" stroke="none"/>
  <circle cx="190" cy="230" r="7" fill="var(--ok)" stroke="none"/>
  <ellipse cx="222" cy="230" rx="14" ry="9" fill="var(--pur)" stroke="none" opacity=".7"/>
  <line x1="166" y1="154" x2="90" y2="140" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="136" class="small">Cuello</text>
  <line x1="156" y1="178" x2="90" y2="190" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="194" class="small">Axilas</text>
  <line x1="168" y1="298" x2="90" y2="310" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="314" class="small">Ingles</text>
  <line x1="236" y1="230" x2="280" y2="230" stroke="var(--muted)" stroke-width="1"/>
  <text x="284" y="234" class="small">Bazo</text>
  <text x="190" y="436" text-anchor="middle" class="small muted">Ganglios hinchados sin dolor</text>
  <rect x="376" y="60" width="404" height="180" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="578.0" y="90" text-anchor="middle" class="title">Qué ocurre en el ganglio</text>
  <circle cx="470" cy="160" r="46" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="454" cy="146" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="480" cy="140" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="462" cy="172" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="488" cy="168" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="470" cy="158" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="496" cy="152" r="7" fill="var(--pur)" stroke="none"/>
  <circle cx="448" cy="164" r="7" fill="var(--pur)" stroke="none"/>
  <text x="540" y="136" class="small">Un linfocito anormal se</text>
  <text x="540" y="154" class="small">multiplica sin control</text>
  <text x="540" y="172" class="small">y agranda el ganglio</text>
  <text x="578" y="224" text-anchor="middle" class="small b">Grandes tipos: Hodgkin y no Hodgkin</text>
  <rect x="376" y="256" width="404" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="578.0" y="286" text-anchor="middle" class="title">Síntomas para consultar</text>
  <text x="394" y="304" class="small">• Ganglio que crece y no baja</text>
  <text x="405" y="326" class="small">en semanas</text>
  <text x="394" y="348" class="small">• Fiebre sin causa</text>
  <text x="394" y="370" class="small">• Sudores nocturnos intensos</text>
  <text x="394" y="392" class="small">• Pérdida de peso sin buscarla</text>
  <text x="394" y="414" class="small">• Picor o cansancio persistentes</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
