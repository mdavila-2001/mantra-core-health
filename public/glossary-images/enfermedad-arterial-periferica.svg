<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad arterial periférica en la pierna</title>
  <desc id="d">Pierna con la arteria principal y una placa marcada en el muslo, y un corte de arteria en el que la placa de aterosclerosis estrecha la luz y reduce el flujo. Abajo, la claudicación, que es dolor al caminar que cede al detenerse, y los signos de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Enfermedad arterial periférica: arterias de las piernas estrechas</text>
  <rect x="20" y="60" width="300" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="170.0" y="88" text-anchor="middle" class="h">Dónde ocurre</text>
  <path d="M120 100 L200 100 L196 250 L186 400 L150 400 L140 250 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M150 410 L190 410 L210 430 L140 430 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M168 104 L166 200 L164 260 L160 340 L156 404" fill="none" stroke="var(--red)" stroke-width="5"/>
  <circle cx="166" cy="210" r="14" fill="none" stroke="var(--warn)" stroke-width="3"/>
  <line x1="180" y1="210" x2="230" y2="200" stroke="var(--muted)" stroke-width="1"/>
  <text x="234" y="196" class="small b">Placa</text>
  <text x="234" y="212" class="small">en la arteria</text>
  <text x="234" y="156" class="small muted">Muslo</text>
  <text x="234" y="330" class="small muted">Pantorrilla:</text>
  <text x="234" y="346" class="small muted">dolor al andar</text>
  <rect x="336" y="60" width="444" height="180" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="558.0" y="88" text-anchor="middle" class="title">Arteria por dentro</text>
  <rect x="360" y="110" width="396" height="70" rx="30" fill="var(--red-l)" stroke="var(--red)"/>
  <path d="M480 110 C520 150 580 150 620 110 Z M500 180 C540 155 570 155 600 180 Z" fill="var(--warn)" stroke="none" stroke-width="0" opacity=".8"/>
  <path d="M370 145 L470 145" fill="none" stroke="var(--red)" stroke-width="4" marker-end="url(#ar)"/>
  <path d="M630 145 L690 145" fill="none" stroke="var(--red)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="556" y="206" text-anchor="middle" class="small">La placa de aterosclerosis reduce el flujo</text>
  <text x="556" y="224" text-anchor="middle" class="small">y el músculo recibe menos sangre</text>
  <rect x="336" y="256" width="214" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="443.0" y="284" text-anchor="middle" class="h">Claudicación</text>
  <text x="352" y="304" class="small">• Dolor al caminar</text>
  <text x="352" y="328" class="small">• Cede al detenerse</text>
  <text x="352" y="352" class="small">• Factores: tabaco,</text>
  <text x="363" y="376" class="small">diabetes, colesterol</text>
  <rect x="566" y="256" width="214" height="184" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="580" y="280" class="lab b" style="fill:var(--red)">Urgente si hay</text>
  <text x="580" y="304" class="small">• Dolor en reposo</text>
  <text x="580" y="326" class="small">• Herida que no cura</text>
  <text x="580" y="348" class="small">• Pie frío, pálido</text>
  <text x="591" y="370" class="small">o muy oscuro</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
