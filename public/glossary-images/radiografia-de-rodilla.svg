<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué muestra la radiografía de rodilla</title>
  <desc id="d">Rodilla vista de frente con fémur, tibia, peroné y rótula, y el espacio articular que indica el grosor del cartílago. A la derecha, las proyecciones frontal, lateral y axial y los hallazgos que puede mostrar, como fracturas o artrosis.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Radiografía de rodilla: los huesos de la articulación</text>
  <rect x="20" y="60" width="360" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="90" text-anchor="middle" class="title">Vista de frente</text>
  <path d="M150 104 L230 104 L232 230 C250 240 262 255 258 272 L122 272 C118 255 130 240 148 230 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M128 290 L252 290 C258 302 250 312 236 316 L230 420 L160 420 L154 316 C140 312 122 302 128 290 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M262 312 L282 312 L280 420 L266 420 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <ellipse cx="190" cy="225" rx="26" ry="20" fill="var(--bone)" stroke="var(--muted)" opacity=".8" stroke-dasharray="4 3"/>
  <text x="190" y="150" text-anchor="middle" class="lab b">Fémur</text>
  <text x="195" y="370" text-anchor="middle" class="lab b">Tibia</text>
  <text x="300" y="400" class="small">Peroné</text>
  <line x1="216" y1="225" x2="290" y2="200" stroke="var(--muted)" stroke-width="1"/>
  <text x="294" y="204" class="small">Rótula</text>
  <line x1="256" y1="281" x2="296" y2="268" stroke="var(--muted)" stroke-width="1"/>
  <text x="300" y="272" class="small">Espacio</text>
  <text x="300" y="288" class="small">articular</text>
  <text x="60" y="120" class="small muted">El cartílago</text>
  <text x="60" y="136" class="small muted">no se ve:</text>
  <text x="60" y="152" class="small muted">se deduce por</text>
  <text x="60" y="168" class="small muted">el espacio</text>
  <rect x="396" y="60" width="384" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="90" text-anchor="middle" class="title">Proyecciones y hallazgos</text>
  <rect x="414" y="100" width="110" height="64" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="469.0" y="137.0" text-anchor="middle" class="lab">Frontal</text>
  <text x="469" y="182" text-anchor="middle" class="small muted">de pie</text>
  <text x="469" y="198" text-anchor="middle" class="small muted">si se busca artrosis</text>
  <rect x="534" y="100" width="110" height="64" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="589.0" y="137.0" text-anchor="middle" class="lab">Lateral</text>
  <text x="589" y="182" text-anchor="middle" class="small muted">rótula y</text>
  <text x="589" y="198" text-anchor="middle" class="small muted">derrame</text>
  <rect x="654" y="100" width="110" height="64" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="709.0" y="137.0" text-anchor="middle" class="lab">Axial</text>
  <text x="709" y="182" text-anchor="middle" class="small muted">cómo encaja</text>
  <text x="709" y="198" text-anchor="middle" class="small muted">la rótula</text>
  <text x="414" y="240" class="h">Qué puede mostrar</text>
  <text x="414" y="268" class="lab">• Fracturas y luxaciones</text>
  <text x="414" y="294" class="lab">• Artrosis: espacio estrecho</text>
  <text x="425" y="320" class="lab">y osteofitos (picos óseos)</text>
  <text x="414" y="346" class="lab">• Calcificaciones</text>
  <text x="414" y="372" class="lab">• Tumores óseos</text>
  <text x="414" y="408" class="small muted">Meniscos y ligamentos: resonancia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
