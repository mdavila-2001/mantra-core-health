<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Obstetricia</title>
  <desc id="d">Línea de tiempo de la obstetricia con el embarazo dividido en tres trimestres, en los que el útero y el feto crecen, seguido del parto y del puerperio con la madre y el recién nacido. Debajo, los controles prenatales habituales y los signos que obligan a acudir de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Obstetricia: del embarazo al puerperio</text>
  <path d="M60 120 H750" fill="none" stroke="var(--line)" stroke-width="4"/>
  <rect x="60" y="106" width="470" height="28" rx="14" fill="var(--accent)" opacity=".55"/>
  <rect x="570" y="106" width="60" height="28" rx="14" fill="var(--purple)"/>
  <rect x="650" y="106" width="100" height="28" rx="14" fill="var(--ok)" opacity=".7"/>
  <text x="295" y="98" text-anchor="middle" class="step">Embarazo</text>
  <text x="140" y="154" text-anchor="middle" class="small muted">1.er trimestre</text>
  <text x="295" y="154" text-anchor="middle" class="small muted">2.º trimestre</text>
  <text x="450" y="154" text-anchor="middle" class="small muted">3.er trimestre</text>
  <text x="600" y="98" text-anchor="middle" class="step">Parto</text>
  <text x="700" y="98" text-anchor="middle" class="step">Puerperio</text>
  <ellipse cx="140" cy="208" rx="22" ry="30" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="140" cy="210" r="9.799999999999999" fill="var(--skin)"/>
  <ellipse cx="295" cy="208" rx="32" ry="40" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="295" cy="210" r="16.799999999999997" fill="var(--skin)"/>
  <ellipse cx="450" cy="208" rx="42" ry="50" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="450" cy="210" r="23.799999999999997" fill="var(--skin)"/>
  <circle cx="700" cy="208" r="18" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
  <circle cx="686" cy="226" r="10" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
  <rect x="20" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">Controles prenatales</text>
  <text x="40" y="340" class="lab">• Presión arterial y peso</text>
  <text x="40" y="364" class="lab">• Análisis de sangre y orina</text>
  <text x="40" y="388" class="lab">• Ecografías</text>
  <text x="40" y="412" class="lab">• Vacunas y suplementos</text>
  <rect x="410" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="316" text-anchor="middle" class="title">Urgencia si</text>
  <text x="430" y="340" class="lab">• Sangrado o pérdida de líquido</text>
  <text x="430" y="364" class="lab">• Dolor intenso o fiebre</text>
  <text x="430" y="388" class="lab">• Menos movimientos del bebé</text>
  <text x="430" y="412" class="lab">• Dolor de cabeza fuerte, visión borrosa</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
