<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo es una resonancia magnética de cerebro</title>
  <desc id="d">A la izquierda, el equipo de resonancia visto de frente, con el imán en forma de anillo y la mesa que entra al túnel con la cabeza del paciente. A la derecha, un corte lateral del encéfalo con cerebro, cerebelo y tronco, y las enfermedades que permite detectar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Resonancia magnética de cerebro</text>
  <rect x="20" y="60" width="360" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="88" text-anchor="middle" class="h">El equipo</text>
  <circle cx="200" cy="230" r="120" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="200" cy="230" r="58" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="40" y="236" width="320" height="18" rx="4" fill="var(--muted)" stroke="none"/>
  <circle cx="200" cy="226" r="20" fill="var(--skin)" stroke="var(--muted)"/>
  <text x="200" y="134" text-anchor="middle" class="lab">Imán potente</text>
  <text x="200" y="390" text-anchor="middle" class="lab">Mesa que entra al túnel</text>
  <text x="200" y="414" text-anchor="middle" class="small muted">Sin rayos X; hace ruido; 20 a 60 min</text>
  <rect x="396" y="60" width="384" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="88" text-anchor="middle" class="h">Qué se ve</text>
  <g transform="translate(132 60) scale(.8)">
  <path d="M430 260 C420 170 490 110 580 112 C670 114 720 170 712 240 C706 280 680 296 640 296 L600 296 C590 300 580 320 586 360 L560 360 C556 330 548 306 520 300 C470 300 436 290 430 260 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <ellipse cx="650" cy="300" rx="46" ry="26" fill="var(--pur-l)" stroke="var(--pur)"/>
  </g>
  <text x="580" y="222" text-anchor="middle" class="h">Cerebro</text>
  <text x="652" y="304" text-anchor="middle" class="small">Cerebelo</text>
  <text x="608" y="340" class="small">Tronco</text>
  <text x="414" y="414" class="small">Detecta tumores, ictus, esclerosis múltiple,</text>
  <text x="414" y="430" class="small">malformaciones y lesiones de la sustancia blanca</text>
  <rect x="414" y="100" width="150" height="32" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="489.0" y="121.0" text-anchor="middle" class="small">Contraste: gadolinio</text>
  <rect x="612" y="100" width="150" height="32" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="687.0" y="121.0" text-anchor="middle" class="small">Revisar metales</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
