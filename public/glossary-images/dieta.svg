<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El plato saludable</title>
  <desc id="d">Un plato dividido: la mitad con verduras y frutas, un cuarto con cereales integrales y un cuarto con proteínas saludables como legumbres, pescado, huevos o aves. Al lado, un vaso de agua, un recordatorio de usar aceite de oliva y una lista de alimentos que conviene limitar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="470" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="255" y="50" text-anchor="middle" class="title">Proporciones orientativas</text>
  <circle cx="230" cy="245" r="165" fill="var(--tissue)" stroke="var(--line)" stroke-width="3"/>
  <path d="M230 245 L230 95 A150 150 0 0 0 230 395 Z" fill="var(--ok)" opacity=".85"/>
  <path d="M230 245 L230 95 A150 150 0 0 1 380 245 Z" fill="var(--warn)" opacity=".85"/>
  <path d="M230 245 L380 245 A150 150 0 0 1 230 395 Z" fill="var(--accent)" opacity=".85"/>
  <text x="160" y="238" text-anchor="middle" class="step" style="fill:var(--on)">Verduras</text>
  <text x="160" y="258" text-anchor="middle" class="step" style="fill:var(--on)">y frutas</text>
  <text x="160" y="278" text-anchor="middle" class="small" style="fill:var(--on)">la mitad</text>
  <text x="290" y="180" text-anchor="middle" class="lab" style="fill:var(--on)">Cereales</text>
  <text x="290" y="198" text-anchor="middle" class="lab" style="fill:var(--on)">integrales</text>
  <text x="290" y="300" text-anchor="middle" class="lab" style="fill:var(--on)">Proteínas</text>
  <text x="290" y="318" text-anchor="middle" class="lab" style="fill:var(--on)">saludables</text>
  <path d="M415 150 h40 l-6 90 h-28 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="435" y="262" text-anchor="middle" class="lab">Agua</text>
  <path d="M425 300 h20 v10 q12 10 12 30 v40 h-44 v-40 q0 -20 12 -30 Z" fill="var(--plasma)" stroke="var(--warn)" stroke-width="2"/>
  <text x="435" y="402" text-anchor="middle" class="small">Aceite</text>
  <text x="435" y="418" text-anchor="middle" class="small">de oliva</text>

  <rect x="506" y="20" width="274" height="200" rx="14" fill="var(--panel)" stroke="var(--ok)" stroke-width="2"/>
  <text x="643" y="50" text-anchor="middle" class="title" style="fill:var(--ok)">Más a menudo</text>
  <text x="524" y="82" class="lab">• Verduras y frutas variadas</text>
  <text x="524" y="106" class="lab">• Legumbres y frutos secos</text>
  <text x="524" y="130" class="lab">• Pan, arroz y pasta integrales</text>
  <text x="524" y="154" class="lab">• Pescado, huevos, aves</text>
  <text x="524" y="178" class="lab">• Agua como bebida principal</text>
  <text x="524" y="202" class="lab">• Cocinar en casa</text>

  <rect x="506" y="236" width="274" height="204" rx="14" fill="var(--panel)" stroke="var(--red)" stroke-width="2"/>
  <text x="643" y="266" text-anchor="middle" class="title" style="fill:var(--red)">Limitar</text>
  <text x="524" y="298" class="lab">• Bebidas azucaradas</text>
  <text x="524" y="322" class="lab">• Sal y alimentos muy salados</text>
  <text x="524" y="346" class="lab">• Embutidos y carnes procesadas</text>
  <text x="524" y="370" class="lab">• Bollería y ultraprocesados</text>
  <text x="524" y="394" class="lab">• Alcohol</text>
  <text x="643" y="424" text-anchor="middle" class="small muted">Adapte el plan con su profesional</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
