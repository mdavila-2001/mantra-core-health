<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pasos y tipos de biopsia</title>
  <desc id="d">Arriba, cinco pasos en fila: toma de tejido, fijación en formol, corte fino, tinción y lectura al microscopio con informe. Abajo, cuatro formas de obtener la muestra: con aguja, endoscópica, quirúrgica y superficial de piel.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="200" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">De la muestra al diagnóstico</text>
<rect x="40" y="72" width="124" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="102.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">1 · Toma</text>
<text x="102.0" y="116.5" text-anchor="middle" class="lab" style="fill:var(--on)">de tejido</text>
<line x1="165" y1="104.0" x2="185" y2="104.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="188" y="72" width="124" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="250.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">2 · Fijación</text>
<text x="250.0" y="116.5" text-anchor="middle" class="lab" style="fill:var(--on)">en formol</text>
<line x1="313" y1="104.0" x2="333" y2="104.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="336" y="72" width="124" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="398.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">3 · Corte</text>
<text x="398.0" y="116.5" text-anchor="middle" class="lab" style="fill:var(--on)">muy fino</text>
<line x1="461" y1="104.0" x2="481" y2="104.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="484" y="72" width="124" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="546.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">4 · Tinción</text>
<text x="546.0" y="116.5" text-anchor="middle" class="lab" style="fill:var(--on)">en lámina</text>
<line x1="609" y1="104.0" x2="629" y2="104.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="632" y="72" width="124" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="694.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">5 · Microscopio</text>
<text x="694.0" y="116.5" text-anchor="middle" class="lab" style="fill:var(--on)">y informe</text>
<text x="400" y="176" text-anchor="middle" class="lab" style="fill:var(--muted)">El patólogo describe las células y emite el diagnóstico.</text>
<rect x="20" y="236" width="760" height="204" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400" y="264" text-anchor="middle" class="title">Formas de obtener la muestra</text>
<rect x="40" y="284" width="170" height="138" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="125" y="310" text-anchor="middle" class="step">Con aguja</text>
<text x="125" y="388" text-anchor="middle" class="small">punción a través de la piel,</text>
<text x="125" y="406" text-anchor="middle" class="small">a veces guiada por ecografía</text>
<rect x="226" y="284" width="170" height="138" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="311" y="310" text-anchor="middle" class="step">Endoscópica</text>
<text x="311" y="388" text-anchor="middle" class="small">con pinza, durante una</text>
<text x="311" y="406" text-anchor="middle" class="small">endoscopia o colonoscopia</text>
<rect x="412" y="284" width="170" height="138" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="497" y="310" text-anchor="middle" class="step">Quirúrgica</text>
<text x="497" y="388" text-anchor="middle" class="small">incisional (parte) o</text>
<text x="497" y="406" text-anchor="middle" class="small">excisional (toda la lesión)</text>
<rect x="598" y="284" width="170" height="138" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="683" y="310" text-anchor="middle" class="step">Superficial</text>
<text x="683" y="388" text-anchor="middle" class="small">piel: punch o afeitado,</text>
<text x="683" y="406" text-anchor="middle" class="small">con anestesia local</text>
<path d="M80,350 L190,350" fill="none" stroke="var(--muted)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="190" y="344" width="20" height="12" rx="3" fill="var(--accent)" stroke-width="1"/>
<ellipse cx="110" cy="350" rx="10" ry="6" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<path d="M270,330 Q300,330 320,350 L340,350" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M340,344 L356,350 L340,356" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="484" cy="350" rx="40" ry="22" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<path d="M468,350 Q484,320 500,350" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/>
<rect x="640" y="340" width="90" height="14" rx="3" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<circle cx="685" cy="340" r="8" fill="none" stroke="var(--ink)" stroke-width="2"/>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
