<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué mide la hemoglobina glicosilada</title>
  <desc id="d">A la izquierda, un glóbulo rojo contiene moléculas de hemoglobina; algunas llevan glucosa unida. A la derecha, una línea de tiempo muestra que los glóbulos rojos viven unos tres meses, por lo que el análisis refleja la glucosa media de ese período. Abajo, comparación entre poca y mucha glucosa en sangre.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --rbc:#e57368; --rbc-l:#f6c9c3; --hb:#9b2c2c; --glu:#e0a526; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --rbc:#c4584e; --rbc-l:#4a2c2a; --hb:#f08a80; --glu:#f2c46d; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <defs>
    <g id="hb"><circle r="11" fill="var(--hb)"/></g>
    <g id="hbg"><circle r="11" fill="var(--hb)"/><rect x="6" y="-16" width="11" height="11" rx="2" fill="var(--glu)" transform="rotate(20 11 -10)"/></g>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="360" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200" y="50" text-anchor="middle" class="title">Dentro del glóbulo rojo</text>
  <ellipse cx="200" cy="200" rx="140" ry="110" fill="var(--rbc)"/>
  <ellipse cx="200" cy="200" rx="90" ry="62" fill="var(--rbc-l)"/>
  <use href="#hb" x="150" y="180"/>
  <use href="#hbg" x="195" y="165"/>
  <use href="#hb" x="240" y="190"/>
  <use href="#hbg" x="170" y="225"/>
  <use href="#hb" x="225" y="230"/>
  <use href="#hb" x="130" y="215"/>
  <circle cx="60" cy="350" r="11" fill="var(--hb)"/>
  <text x="80" y="355" class="lab">Hemoglobina (lleva oxígeno)</text>
  <rect x="54" y="378" width="12" height="12" rx="2" fill="var(--glu)"/>
  <text x="80" y="389" class="lab">Glucosa que se une a ella</text>
  <text x="200" y="430" text-anchor="middle" class="small muted">La HbA1c es la parte de hemoglobina con glucosa</text>

  <rect x="396" y="20" width="384" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588" y="50" text-anchor="middle" class="title">Una media de unos 3 meses</text>
  <line x1="426" y1="130" x2="750" y2="130" stroke="var(--ink)" stroke-width="2"/>
  <polygon points="750,124 762,130 750,136" fill="var(--ink)"/>
  <circle cx="436" cy="130" r="6" fill="var(--accent)"/><text x="436" y="112" text-anchor="middle" class="small">Mes 1</text>
  <circle cx="546" cy="130" r="6" fill="var(--accent)"/><text x="546" y="112" text-anchor="middle" class="small">Mes 2</text>
  <circle cx="656" cy="130" r="6" fill="var(--accent)"/><text x="656" y="112" text-anchor="middle" class="small">Mes 3</text>
  <rect x="716" y="140" width="40" height="22" rx="6" fill="var(--ok)"/><text x="736" y="156" text-anchor="middle" class="small" style="fill:var(--on)">Hoy</text>
  <text x="588" y="186" text-anchor="middle" class="small muted">Los glóbulos rojos guardan el «registro» de la glucosa</text>

  <text x="500" y="230" text-anchor="middle" class="lab">Poca glucosa</text>
  <ellipse cx="500" cy="300" rx="70" ry="52" fill="var(--rbc)"/>
  <use href="#hb" x="475" y="290"/><use href="#hb" x="505" y="315"/><use href="#hbg" x="520" y="285"/>
  <text x="500" y="378" text-anchor="middle" class="small muted">Menos hemoglobina</text>
  <text x="500" y="393" text-anchor="middle" class="small muted">glicada</text>

  <text x="680" y="230" text-anchor="middle" class="lab">Mucha glucosa</text>
  <ellipse cx="680" cy="300" rx="70" ry="52" fill="var(--rbc)"/>
  <use href="#hbg" x="650" y="290"/><use href="#hbg" x="685" y="318"/><use href="#hbg" x="702" y="282"/>
  <text x="680" y="378" text-anchor="middle" class="small muted">Más hemoglobina</text>
  <text x="680" y="393" text-anchor="middle" class="small muted">glicada</text>
  <text x="588" y="438" text-anchor="middle" class="small muted">El resultado lo interpreta su médico</text>
</svg>
