<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Flujo de decisión del consentimiento ante una intervención</title>
  <desc id="d">Diagrama de flujo. Ante una intervención propuesta se pregunta si hay riesgo vital inmediato y es imposible consultar: en ese caso se actúa en beneficio de la persona y se documenta. Si no, se pregunta si la persona tiene capacidad: si no la tiene, se busca la directiva anticipada o al representante; si la tiene, se informa, se comprueba la comprensión y se asegura la voluntariedad antes de que acepte, rechace o pida tiempo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#2f6fb3; --a-l:#dbe8f6; --b:#1f8a5b; --b-l:#d9f0e5; --c:#a86a0f; --c-l:#f8ebd0; --d:#c0392b; --d-l:#f7dcd8; --skin:#f0c9b0; --fat:#f4e3a8; --mus:#d98a7c; --bone:#e9e4d6; --p:#7b3b6e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#7fb3ea; --a-l:#243a52; --b:#4cc38a; --b-l:#1f3b30; --c:#e3b04f; --c-l:#42361b; --d:#ef7467; --d-l:#47241f; --skin:#a8745e; --fat:#8a7a3a; --mus:#a65a4e; --bone:#8d8a7c; --p:#b77ab0; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .m { fill: var(--muted); }
    .t { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 14px; }
    .n { font-size: 13px; }
    .k { font-size: 24px; font-weight: 800; }
    .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="250" y="20" width="300" height="46" rx="12" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" class="h">Se propone una intervención</text>
  <path d="M400 68 V88" class="ln" marker-end="url(#ar)"/>
  <polygon points="400,90 580,140 400,190 220,140" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="400" y="136" text-anchor="middle" class="n">¿Riesgo vital inmediato y</text>
  <text x="400" y="154" text-anchor="middle" class="n">imposible consultar antes?</text>
  <path d="M582 140 H618" class="ln" marker-end="url(#ar)"/>
  <text x="600" y="130" text-anchor="middle" class="n" style="fill:var(--d)">Sí</text>
  <rect x="620" y="86" width="156" height="108" rx="12" fill="var(--d-l)" stroke="var(--d)" stroke-width="2"/>
  <text x="698" y="112" text-anchor="middle" class="n">Se actúa en beneficio</text><text x="698" y="130" text-anchor="middle" class="n">de la persona, se</text><text x="698" y="148" text-anchor="middle" class="n">documenta y se informa</text><text x="698" y="166" text-anchor="middle" class="n">en cuanto sea posible</text>
  <path d="M400 192 V214" class="ln" marker-end="url(#ar)"/>
  <text x="414" y="208" class="n m">No</text>
  <polygon points="400,216 580,266 400,316 230,266" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="400" y="262" text-anchor="middle" class="n">¿Tiene capacidad para</text>
  <text x="400" y="280" text-anchor="middle" class="n">esta decisión concreta?</text>
  <path d="M230 266 H198" class="ln" marker-end="url(#ar)"/>
  <text x="214" y="256" text-anchor="middle" class="n" style="fill:var(--d)">No</text>
  <rect x="24" y="212" width="172" height="108" rx="12" fill="var(--panel)" stroke="var(--d)" stroke-width="2"/>
  <text x="110" y="238" text-anchor="middle" class="n">Se busca la directiva</text><text x="110" y="256" text-anchor="middle" class="n">anticipada o al</text><text x="110" y="274" text-anchor="middle" class="n">representante; la persona</text><text x="110" y="292" text-anchor="middle" class="n">participa en lo que pueda</text>
  <path d="M400 318 V342" class="ln" marker-end="url(#ar)"/>
  <text x="414" y="336" class="n" style="fill:var(--b)">Sí</text>
  <rect x="170" y="344" width="460" height="64" rx="12" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="400" y="372" text-anchor="middle" class="n">Informar, comprobar que entendió y asegurar que decide sin presión:</text>
  <text x="400" y="392" text-anchor="middle" class="n">acepta, rechaza o pide tiempo, y queda registrado</text>
  <text x="400" y="440" text-anchor="middle" class="n m">Los criterios exactos dependen de la ley y de las políticas de cada lugar.</text>
  <text x="400" y="464" text-anchor="middle" class="n m">Esquema ilustrativo. Ilustración original de AloVida.</text>
</svg>
