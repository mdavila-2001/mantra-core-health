<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Principio de la ecografía Doppler</title>
  <desc id="d">Una sonda sobre la piel emite ultrasonidos hacia un vaso sanguíneo. Los glóbulos rojos que se acercan devuelven ecos de mayor frecuencia y los que se alejan, de menor. A la derecha, la pantalla muestra el flujo en color y una curva de velocidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220" y="50" text-anchor="middle" class="title">Efecto Doppler en la sangre</text>
  <rect x="40" y="130" width="360" height="270" rx="10" fill="var(--tissue)"/>
  <text x="50" y="148" class="small muted">Piel</text>
  <rect x="170" y="74" width="80" height="50" rx="10" fill="var(--accent)"/>
  <rect x="180" y="118" width="60" height="14" rx="4" fill="var(--ink)"/>
  <text x="210" y="104" text-anchor="middle" class="lab" style="fill:var(--on)">Sonda</text>
  <path d="M185 140 Q210 150 235 140" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M180 160 Q210 172 240 160" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M175 180 Q210 194 245 180" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <path d="M170 200 Q210 216 250 200" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="262" y="180" class="small">Ultrasonidos</text>
  <rect x="40" y="250" width="360" height="70" fill="var(--red-l)"/>
  <line x1="40" y1="250" x2="400" y2="250" stroke="var(--red)" stroke-width="3"/>
  <line x1="40" y1="320" x2="400" y2="320" stroke="var(--red)" stroke-width="3"/>
  <ellipse cx="110" cy="285" rx="14" ry="8" fill="var(--red)"/>
  <ellipse cx="170" cy="275" rx="14" ry="8" fill="var(--red)"/>
  <ellipse cx="250" cy="295" rx="14" ry="8" fill="var(--red)"/>
  <ellipse cx="320" cy="280" rx="14" ry="8" fill="var(--red)"/>
  <path d="M120 340 H300" stroke="var(--ink)" stroke-width="2.5"/>
  <polygon points="300,334 314,340 300,346" fill="var(--ink)"/>
  <text x="220" y="362" text-anchor="middle" class="lab">Dirección del flujo de sangre</text>
  <text x="220" y="388" text-anchor="middle" class="small muted">El eco cambia de frecuencia según la velocidad</text>
  <text x="220" y="425" text-anchor="middle" class="small muted">Se acerca: eco más agudo · se aleja: más grave</text>

  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608" y="50" text-anchor="middle" class="title">Lo que muestra la pantalla</text>
  <text x="456" y="82" class="step">Doppler color</text>
  <rect x="456" y="94" width="304" height="110" rx="8" fill="var(--tissue)" stroke="var(--line)"/>
  <path d="M466 130 C540 120 600 150 750 132 V162 C600 180 540 150 466 160 Z" fill="var(--red)" opacity=".85"/>
  <path d="M466 176 C560 170 650 190 750 178 V196 C650 206 560 188 466 192 Z" fill="var(--blue)" opacity=".85"/>
  <text x="470" y="122" class="small">Rojo: hacia la sonda</text>
  <text x="560" y="218" class="small muted">Azul: se aleja de la sonda</text>
  <text x="456" y="250" class="step">Curva de velocidad</text>
  <rect x="456" y="262" width="304" height="120" rx="8" fill="var(--tissue)" stroke="var(--line)"/>
  <line x1="466" y1="350" x2="750" y2="350" stroke="var(--muted)"/>
  <path d="M466 350 L486 290 L500 335 L520 345 L545 350 L565 290 L579 335 L599 345 L624 350 L644 290 L658 335 L678 345 L703 350 L723 290 L737 335 L750 345" fill="none" stroke="var(--ok)" stroke-width="2.5"/>
  <text x="608" y="372" text-anchor="middle" class="small muted">Cada pico corresponde a un latido</text>
  <text x="608" y="420" text-anchor="middle" class="small muted">Sin radiación ionizante · indolora</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
