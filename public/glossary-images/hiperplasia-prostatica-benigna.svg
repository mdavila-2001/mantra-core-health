<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hiperplasia prostática benigna</title>
  <desc id="d">A la izquierda, comparación de una próstata normal y una agrandada bajo la vejiga: el crecimiento estrecha la uretra y el chorro de orina se vuelve débil. A la derecha, los síntomas urinarios típicos, la aclaración de que no es cáncer y los signos que obligan a consultar pronto.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">La próstata rodea la uretra</text>
  <ellipse cx="110" cy="140" rx="64" ry="50" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="110" y="136" text-anchor="middle" class="small">Vejiga</text>
  <ellipse cx="110" cy="206" rx="34" ry="28.9" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M110 186 V340" fill="none" stroke="var(--nerve)" stroke-width="8"/>
  <text x="110" y="84" text-anchor="middle" class="step" style="fill:var(--ok)">Normal</text>
  <path d="M104 360 Q110 400 116 360" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <ellipse cx="290" cy="140" rx="64" ry="50" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="290" y="136" text-anchor="middle" class="small">Vejiga</text>
  <ellipse cx="290" cy="214" rx="54" ry="45.9" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M290 186 V340" fill="none" stroke="var(--nerve)" stroke-width="3"/>
  <text x="290" y="84" text-anchor="middle" class="step" style="fill:var(--warn)">Hiperplasia</text>
  <path d="M284 360 Q290 380 296 360" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="102" y="300" text-anchor="end" class="small">Uretra libre</text>
  <text x="282" y="300" text-anchor="end" class="small">Uretra estrechada</text>
  <text x="110" y="420" text-anchor="middle" class="small muted">Chorro normal</text>
  <text x="290" y="420" text-anchor="middle" class="small muted">Chorro débil</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Lo que se nota</text>
  <text x="436" y="80" class="lab">• Chorro débil o entrecortado</text>
  <text x="436" y="106" class="lab">• Cuesta empezar a orinar</text>
  <text x="436" y="132" class="lab">• Sensación de no vaciar del todo</text>
  <text x="436" y="158" class="lab">• Levantarse de noche a orinar</text>
  <text x="436" y="184" class="lab">• Urgencia para orinar</text>
  <rect x="436" y="226" width="324" height="70" rx="10" fill="var(--accent-l)"/>
  <text x="452" y="252" class="lab">Es benigna: no es cáncer ni</text>
  <text x="452" y="272" class="lab">aumenta su riesgo. Común con la edad.</text>
  <rect x="436" y="312" width="324" height="108" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="336" class="step" style="fill:var(--warn)">Consultar pronto si</text>
  <text x="456" y="362" class="small">• No puede orinar en absoluto</text>
  <text x="456" y="384" class="small">• Sangre en la orina o fiebre</text>
  <text x="456" y="406" class="small">• Dolor en la zona de los riñones</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
