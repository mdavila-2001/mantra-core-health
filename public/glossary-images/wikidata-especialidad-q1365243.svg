<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina tropical</title>
  <desc id="d">Mapa esquemático con la franja tropical y cuatro vías de transmisión: mosquitos, chinches y moscas, agua y suelo, y alimentos, con ejemplos de enfermedades. Abajo, qué abarca la especialidad y consejos antes y después de viajar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Regiones tropicales y transmisión</text>
<ellipse cx="170" cy="130" rx="120" ry="80" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<rect x="50" y="108" width="240" height="44" rx="0" fill="var(--beam)" stroke-width="1" opacity=".7"/>
<path d="M110,90 Q140,80 160,100 Q150,120 120,118 Z M190,130 Q230,120 250,140 Q230,170 200,160 Z M90,140 Q110,150 100,170 Q80,160 90,140 Z" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170" y="234" class="small"></text>
<text x="170" y="230" text-anchor="middle" class="small" style="fill:var(--warn)">Franja tropical y subtropical</text>
<rect x="330" y="60" width="214" height="66" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="342" y="86" class="step">Mosquitos</text>
<text x="342" y="108" class="small">malaria, dengue, zika</text>
<rect x="556" y="60" width="214" height="66" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="568" y="86" class="step">Chinches y moscas</text>
<text x="568" y="108" class="small">Chagas, leishmaniasis</text>
<rect x="330" y="140" width="214" height="66" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="342" y="166" class="step">Agua y suelo</text>
<text x="342" y="188" class="small">esquistosomiasis, helmintos</text>
<rect x="556" y="140" width="214" height="66" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="568" y="166" class="step">Alimentos</text>
<text x="568" y="188" class="small">cólera, fiebre tifoidea</text>
<rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="286" text-anchor="middle" class="title">Qué abarca</text>
<text x="36" y="314" class="lab">• Enfermedades infecciosas y parasitarias</text>
<text x="36" y="340" class="lab">• Salud del viajero y del migrante</text>
<text x="36" y="366" class="lab">• Enfermedades tropicales desatendidas</text>
<text x="36" y="392" class="lab">• Control de vectores y salud pública</text>
<rect x="406" y="256" width="374" height="184" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="286" text-anchor="middle" class="title">Antes y después de viajar</text>
<text x="422" y="314" class="lab">• Vacunas recomendadas según destino</text>
<text x="422" y="338" class="lab">• Profilaxis de malaria si procede</text>
<text x="422" y="362" class="lab">• Repelente, mosquiteras, agua segura</text>
<text x="422" y="386" class="lab">• Fiebre al volver: consultar y contar el viaje</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
