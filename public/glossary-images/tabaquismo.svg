<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tabaquismo: daños y beneficios de dejarlo</title>
  <desc id="d">A la izquierda, una silueta con marcas rojas en los órganos que daña el tabaco: cerebro, boca y garganta, pulmones, corazón, arterias, vejiga y embarazo. A la derecha, una línea de tiempo con los beneficios de dejar de fumar, desde los primeros minutos hasta los años, y las ayudas disponibles.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Daños del tabaco en el cuerpo</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Beneficios de dejarlo</text>
<circle cx="200" cy="102.0" r="22.0" fill="var(--skin)" stroke="var(--line)"/>
<path d="M188.0 122.0 L150.0 136.0 C140.0 140.0 138.0 150.0 137.0 160.0 L128.0 250.0 L142.0 252.0 L154.0 172.0 L156.0 240.0 L154.0 380.0 L186.0 380.0 L196.0 260.0 L204.0 260.0 L214.0 380.0 L246.0 380.0 L244.0 240.0 L246.0 172.0 L258.0 252.0 L272.0 250.0 L263.0 160.0 C262.0 150.0 260.0 140.0 250.0 136.0 L212.0 122.0 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="200" cy="92" r="5" fill="var(--bad)"/>
<line x1="200" y1="92" x2="137.8" y2="80" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="84" class="small">Cerebro: ictus</text>
<circle cx="200" cy="130" r="5" fill="var(--bad)"/>
<line x1="200" y1="130" x2="144.5" y2="124" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="128" class="small">Boca y garganta</text>
<circle cx="182" cy="160" r="5" fill="var(--bad)"/>
<line x1="182" y1="160" x2="137.8" y2="168" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="172" class="small">Pulmones: EPOC</text>
<circle cx="216" cy="168" r="5" fill="var(--bad)"/>
<line x1="216" y1="168" x2="262" y2="116" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="266" y="120" class="small">Cáncer de pulmón</text>
<circle cx="210" cy="152" r="5" fill="var(--bad)"/>
<line x1="210" y1="152" x2="262" y2="156" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="266" y="160" class="small">Corazón: infarto</text>
<circle cx="240" cy="230" r="5" fill="var(--bad)"/>
<line x1="240" y1="230" x2="262" y2="236" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="266" y="240" class="small">Arterias</text>
<circle cx="200" cy="240" r="5" fill="var(--bad)"/>
<line x1="200" y1="240" x2="137.8" y2="248" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="252" class="small">Vejiga y riñón</text>
<circle cx="190" cy="260" r="5" fill="var(--bad)"/>
<line x1="190" y1="260" x2="97.6" y2="292" stroke="var(--bad)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="40" y="296" class="small">Embarazo</text>
<text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">El humo contiene miles de sustancias</text>
<text x="200" y="428" text-anchor="middle" class="small" style="fill:var(--muted)">tóxicas; la nicotina crea la adicción.</text>
<line x1="436" y1="80" x2="436" y2="340" stroke="var(--ok)" stroke-width="3"/>
<circle cx="436" cy="84" r="9" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="456" y="89" class="step" style="fill:var(--ok)">Minutos</text>
<text x="540" y="89" class="small">bajan pulso y presión</text>
<circle cx="436" cy="146" r="9" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="456" y="151" class="step" style="fill:var(--ok)">Días</text>
<text x="540" y="151" class="small">mejoran olfato y gusto</text>
<circle cx="436" cy="208" r="9" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="456" y="213" class="step" style="fill:var(--ok)">Meses</text>
<text x="540" y="213" class="small">respira mejor, menos tos</text>
<circle cx="436" cy="270" r="9" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="456" y="275" class="step" style="fill:var(--ok)">1 año</text>
<text x="540" y="275" class="small">cae el riesgo de infarto</text>
<circle cx="436" cy="332" r="9" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="456" y="337" class="step" style="fill:var(--ok)">Años</text>
<text x="540" y="337" class="small">baja el riesgo de cáncer</text>
<rect x="416" y="360" width="344" height="60" rx="10" fill="var(--accent-l)"/>
<text x="432" y="384" class="small">Ayuda: consejo médico, apoyo psicológico</text>
<text x="432" y="402" class="small">y fármacos para dejar de fumar.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
