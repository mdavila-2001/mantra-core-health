<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Perfil hepático: tres grupos de pruebas</title>
  <desc id="d">A la izquierda, un hígado con la vesícula y la vía biliar y un tubo de sangre. A la derecha, tres recuadros agrupan las pruebas: las que reflejan daño de las células (ALT y AST), las del flujo de la bilis (fosfatasa alcalina, GGT y bilirrubina) y las de la capacidad de fabricar (albúmina y tiempo de protrombina).</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Qué mide el perfil hepático</text>
<path d="M50 150 C50 100 130 80 220 86 C290 90 330 110 330 140 C330 180 290 210 230 236 C180 256 110 262 80 240 C56 222 50 190 50 150 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="170" y="140" text-anchor="middle" class="big">Hígado</text>
<ellipse cx="250" cy="250" rx="26" ry="18" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
<text x="250" y="290" text-anchor="middle" class="small" style="fill:var(--muted)">Vesícula</text>
<path d="M226 228 C220 270 200 300 190 340" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="160" y="362" text-anchor="middle" class="small" style="fill:var(--muted)">Vía biliar</text>
<rect x="68" y="270" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M70 284 V350 a13 13 0 0 0 26 0 V284 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M71.5 310 V350 a11.5 11.5 0 0 0 23 0 V310 Z" fill="var(--vessel)"/>
<text x="83" y="386" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<rect x="390" y="70" width="370" height="104" rx="10" fill="var(--bad-l)" stroke="var(--bad)"/>
<text x="406" y="96" class="h" style="fill:var(--bad)">Daño de las células</text>
<text x="406" y="122" class="lab">• ALT (TGP)</text>
<text x="406" y="144" class="lab">• AST (TGO)</text>
<rect x="390" y="190" width="370" height="104" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
<text x="406" y="216" class="h" style="fill:var(--ok)">Flujo de la bilis</text>
<text x="406" y="242" class="lab">• Fosfatasa alcalina</text>
<text x="406" y="264" class="lab">• GGT</text>
<text x="406" y="286" class="lab">• Bilirrubina</text>
<rect x="390" y="310" width="370" height="104" rx="10" fill="var(--accent-l)" stroke="var(--accent)"/>
<text x="406" y="336" class="h" style="fill:var(--accent)">Capacidad de fabricar</text>
<text x="406" y="362" class="lab">• Albúmina</text>
<text x="406" y="384" class="lab">• Tiempo de protrombina</text>
<line x1="330" y1="140" x2="390" y2="122" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="212" y1="330" x2="390" y2="242" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="300" y1="200" x2="390" y2="362" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="40" y="424" class="small" style="fill:var(--muted)">Ningún valor aislado da el diagnóstico: importa el patrón.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
