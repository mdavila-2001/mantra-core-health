<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tisiología</title>
  <desc id="d">A la izquierda, el contagio de la tuberculosis: una persona con enfermedad activa expulsa gotitas al toser que otra inhala; la infección puede quedar latente, sin síntomas, o pasar a enfermedad activa con tos, fiebre y pérdida de peso; se muestra un pulmón con una lesión. A la derecha, lo que hace la tisiología: diagnóstico, tratamiento con varios antibióticos durante meses y control comunitario.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Tuberculosis: contagio y evolución</text>
  <circle cx="90" cy="110" r="26" fill="var(--skin)" stroke="var(--line)"/>
  <circle cx="370" cy="110" r="26" fill="var(--skin)" stroke="var(--line)"/>
  <circle cx="140" cy="100" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="170" cy="116" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="200" cy="96" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="230" cy="120" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="260" cy="104" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="300" cy="112" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="160" cy="90" r="4" fill="var(--purple)" opacity=".7"/>
  <circle cx="250" cy="124" r="4" fill="var(--purple)" opacity=".7"/>
  <path d="M124 110 L330 110" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/>
  <text x="90" y="160" text-anchor="middle" class="small">Persona con</text>
  <text x="90" y="176" text-anchor="middle" class="small">TB activa</text>
  <text x="370" y="160" text-anchor="middle" class="small">Inhala las</text>
  <text x="370" y="176" text-anchor="middle" class="small">gotitas</text>
  <text x="230" y="86" text-anchor="middle" class="small">Al toser o hablar</text>
  <path d="M370 186 L370 214" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="220" y="216" width="220" height="60" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="330" y="240" text-anchor="middle" class="step">Infección latente</text>
  <text x="330" y="258" text-anchor="middle" class="small">sin síntomas, no contagia</text>
  <path d="M330 278 L330 306" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="220" y="308" width="220" height="60" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="330" y="332" text-anchor="middle" class="step">Enfermedad activa</text>
  <text x="330" y="350" text-anchor="middle" class="small">tos, fiebre, peso, sudor</text>
  <path d="M90 230 C60 260 60 360 90 390 Q130 400 160 390 L160 240 C150 224 120 220 90 230 Z" fill="var(--accent-l)" stroke="var(--accent)"/>
  <circle cx="122" cy="270" r="14" fill="var(--purple)" opacity=".55"/>
  <text x="122" y="420" text-anchor="middle" class="small">Lesión en el pulmón</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Qué hace la tisiología</text>
  <text x="500" y="74" class="step">Diagnóstico</text>
  <rect x="500" y="88" width="126" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="563.0" y="110.0" text-anchor="middle" class="small">Esputo y PCR</text>
  <rect x="634" y="88" width="126" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="697.0" y="110.0" text-anchor="middle" class="small">Radiografía</text>
  <rect x="500" y="132" width="126" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="563.0" y="154.0" text-anchor="middle" class="small">Tuberculina</text>
  <rect x="634" y="132" width="126" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="697.0" y="154.0" text-anchor="middle" class="small">IGRA en sangre</text>
  <text x="500" y="218" class="step">Tratamiento</text>
  <text x="500" y="242" class="small">• Varios antibióticos juntos</text>
  <text x="500" y="264" class="small">• durante meses</text>
  <text x="500" y="286" class="small">• Tratamiento observado</text>
  <text x="500" y="308" class="small">• No abandonarlo</text>
  <text x="500" y="346" class="step">Control comunitario</text>
  <text x="500" y="370" class="small">• Estudio de contactos</text>
  <text x="500" y="392" class="small">• Vacuna BCG</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
