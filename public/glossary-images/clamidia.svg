<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Clamidia</title>
  <desc id="d">A la izquierda, el útero con las trompas y los ovarios, con bacterias de clamidia en el cuello uterino y flechas que muestran cómo la infección puede ascender hacia las trompas si no se trata. A la derecha, claves: suele no dar síntomas, zonas que puede afectar, complicaciones y diagnóstico con prueba de orina o hisopado y tratamiento antibiótico.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Infección que puede ascender</text>
  <path d="M180 170 C180 130 260 130 260 170 L250 260 C245 290 235 300 230 330 L210 330 C205 300 195 290 190 260 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M184 160 C150 150 120 130 90 150 M256 160 C290 150 320 130 350 150" fill="none" stroke="var(--organ)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="80" cy="170" rx="20" ry="14" fill="var(--organ)" opacity=".7"/><ellipse cx="360" cy="170" rx="20" ry="14" fill="var(--organ)" opacity=".7"/>
  <rect x="205" y="330" width="30" height="70" rx="8" fill="var(--organ)" opacity=".6"/>
  <circle cx="220" cy="340" r="4" fill="var(--purple)"/>
  <circle cx="214" cy="355" r="4" fill="var(--purple)"/>
  <circle cx="226" cy="370" r="4" fill="var(--purple)"/>
  <circle cx="220" cy="300" r="4" fill="var(--purple)"/>
  <circle cx="212" cy="250" r="4" fill="var(--purple)"/>
  <circle cx="228" cy="220" r="4" fill="var(--purple)"/>
  <path d="M250 330 L250 200" stroke="var(--purple)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M260 170 L320 140" stroke="var(--purple)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <circle cx="220" cy="320" r="3" fill="var(--ink)"/>
  <path d="M220 320 L300 320" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="304" y="324" class="lab">Cuello uterino</text>
  <circle cx="100" cy="150" r="3" fill="var(--ink)"/>
  <path d="M100 150 L60 100" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="104" class="lab">Trompa</text>
  <text x="220" y="420" text-anchor="middle" class="small muted">Vagina</text>
  <text x="310" y="220" class="small">Asciende</text>
  <text x="310" y="236" class="small">sin tratar</text>
  <circle cx="60" cy="400" r="5" fill="var(--purple)"/>
  <text x="72" y="405" class="small">Chlamydia trachomatis</text>
  <rect x="440" y="20" width="340" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="50" text-anchor="middle" class="title">Claves</text>
  <rect x="460" y="60" width="300" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="610" y="84" text-anchor="middle" class="step">A menudo no da síntomas</text>
  <text x="610" y="102" text-anchor="middle" class="small">por eso se recomienda el cribado</text>
  <text x="460" y="146" class="step">Puede afectar</text>
  <text x="460" y="170" class="small">• Cuello uterino y uretra</text>
  <text x="460" y="192" class="small">• Recto, garganta y ojos</text>
  <text x="460" y="232" class="step">Complicaciones si no se trata</text>
  <text x="460" y="256" class="small">• Enfermedad pélvica inflamatoria</text>
  <text x="460" y="278" class="small">• Infertilidad y embarazo ectópico</text>
  <text x="460" y="300" class="small">• Epididimitis en hombres</text>
  <rect x="460" y="340" width="300" height="90" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="610" y="364" text-anchor="middle" class="step">Diagnóstico y tratamiento</text>
  <text x="610" y="386" text-anchor="middle" class="small">Prueba en orina o hisopado</text>
  <text x="610" y="404" text-anchor="middle" class="small">Antibiótico para la persona</text>
  <text x="610" y="420" text-anchor="middle" class="small">y sus parejas sexuales</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
