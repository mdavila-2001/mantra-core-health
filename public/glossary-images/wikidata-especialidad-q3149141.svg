<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Inmunología clínica</title>
  <desc id="d">Una balanza en el centro representa el equilibrio del sistema inmunitario. En un platillo, la defensa insuficiente de las inmunodeficiencias, con infecciones repetidas; en el otro, la respuesta excesiva o mal dirigida de la autoinmunidad y las alergias graves. Debajo, las herramientas de la especialidad: análisis inmunológicos e inmunoterapia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Inmunología clínica: cuando el sistema inmunitario falla</text>
  <path d="M400 110 V300" stroke="var(--muted)" stroke-width="5"/>
  <path d="M360 300 H440 L420 320 H380 Z" fill="var(--muted)"/>
  <path d="M230 140 H570" stroke="var(--muted)" stroke-width="5"/>
  <circle cx="400" cy="110" r="9" fill="var(--muted)"/>
  <path d="M230 140 L190 220 H270 Z M570 140 L530 220 H610 Z" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M180 220 Q230 250 280 220 Z" fill="var(--accent-l)" stroke="var(--accent)"/>
  <path d="M520 220 Q570 250 620 220 Z" fill="var(--bad-l)" stroke="var(--bad)"/>
  <text x="230" y="276" text-anchor="middle" class="step" style="fill:var(--accent)">Defensa insuficiente</text>
  <text x="570" y="276" text-anchor="middle" class="step" style="fill:var(--bad)">Respuesta excesiva</text>
  <text x="570" y="294" text-anchor="middle" class="small">o mal dirigida</text>
  <text x="400" y="346" text-anchor="middle" class="small muted">Equilibrio normal</text>
  <rect x="40" y="310" width="240" height="128" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="160" y="334" text-anchor="middle" class="step">Inmunodeficiencias</text>
  <text x="56" y="360" class="small">• Infecciones repetidas</text>
  <text x="56" y="382" class="small">• Defectos congénitos</text>
  <text x="56" y="404" class="small">• o adquiridos</text>
  <rect x="520" y="310" width="240" height="128" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="640" y="334" text-anchor="middle" class="step">Autoinmunidad y alergia</text>
  <text x="536" y="360" class="small">• Ataque a tejidos propios</text>
  <text x="536" y="382" class="small">• Lupus, vasculitis</text>
  <text x="536" y="404" class="small">• Alergias graves</text>
  <rect x="300" y="370" width="200" height="68" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="400" y="394" text-anchor="middle" class="step">Herramientas</text>
  <text x="400" y="414" text-anchor="middle" class="small">Análisis inmunológicos,</text>
  <text x="400" y="430" text-anchor="middle" class="small">inmunoterapia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
