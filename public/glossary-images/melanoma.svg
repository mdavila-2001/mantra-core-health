<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Melanoma: regla ABCDE</title>
  <desc id="d">Cinco columnas comparan un lunar habitual, pequeño, redondo y de un solo color, con lunares sospechosos según la regla ABCDE: asimetría, bordes irregulares, varios colores, diámetro grande y evolución con el tiempo. Debajo, el origen del melanoma en los melanocitos y sus factores de riesgo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Regla ABCDE para revisar lunares</text>
<rect x="40" y="64" width="130" height="290" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="105" y="98" text-anchor="middle" class="title" style="fill:var(--bad)">A</text>
<text x="105" y="124" text-anchor="middle" class="step">Asimetría</text>
<text x="105" y="142" text-anchor="middle" class="small" style="fill:var(--muted)">una mitad distinta</text>
<circle cx="105" cy="186" r="16" fill="var(--warn)" opacity=".85"/>
<text x="105" y="220" text-anchor="middle" class="small" style="fill:var(--ok)">Habitual</text>
<path d="M85 280 C85 254 109 256 111 274 C135 270 133 296 105 298 C87 300 85 290 85 280 Z" fill="var(--warn)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="105" y="334" text-anchor="middle" class="small" style="fill:var(--bad)">Revisar</text>
<rect x="186" y="64" width="130" height="290" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="251" y="98" text-anchor="middle" class="title" style="fill:var(--bad)">B</text>
<text x="251" y="124" text-anchor="middle" class="step">Bordes</text>
<text x="251" y="142" text-anchor="middle" class="small" style="fill:var(--muted)">irregulares</text>
<circle cx="251" cy="186" r="16" fill="var(--warn)" opacity=".85"/>
<text x="251" y="220" text-anchor="middle" class="small" style="fill:var(--ok)">Habitual</text>
<path d="M229 280 l6 -14 l10 4 l6 -12 l10 8 l8 -2 l2 12 l-4 8 l6 10 l-12 8 l-6 -6 l-10 8 l-8 -6 l-10 0 Z" fill="var(--warn)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="251" y="334" text-anchor="middle" class="small" style="fill:var(--bad)">Revisar</text>
<rect x="332" y="64" width="130" height="290" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="397" y="98" text-anchor="middle" class="title" style="fill:var(--bad)">C</text>
<text x="397" y="124" text-anchor="middle" class="step">Color</text>
<text x="397" y="142" text-anchor="middle" class="small" style="fill:var(--muted)">varios tonos</text>
<circle cx="397" cy="186" r="16" fill="var(--warn)" opacity=".85"/>
<text x="397" y="220" text-anchor="middle" class="small" style="fill:var(--ok)">Habitual</text>
<circle cx="397" cy="280" r="22" fill="var(--warn)"/>
<circle cx="389" cy="276" r="10" fill="var(--xray)"/>
<circle cx="407" cy="286" r="7" fill="var(--bad)"/>
<text x="397" y="334" text-anchor="middle" class="small" style="fill:var(--bad)">Revisar</text>
<rect x="478" y="64" width="130" height="290" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="543" y="98" text-anchor="middle" class="title" style="fill:var(--bad)">D</text>
<text x="543" y="124" text-anchor="middle" class="step">Diámetro</text>
<text x="543" y="142" text-anchor="middle" class="small" style="fill:var(--muted)">tamaño grande</text>
<circle cx="543" cy="186" r="16" fill="var(--warn)" opacity=".85"/>
<text x="543" y="220" text-anchor="middle" class="small" style="fill:var(--ok)">Habitual</text>
<circle cx="543" cy="280" r="28" fill="var(--warn)"/>
<text x="543" y="334" text-anchor="middle" class="small" style="fill:var(--bad)">Revisar</text>
<rect x="624" y="64" width="130" height="290" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="689" y="98" text-anchor="middle" class="title" style="fill:var(--bad)">E</text>
<text x="689" y="124" text-anchor="middle" class="step">Evolución</text>
<text x="689" y="142" text-anchor="middle" class="small" style="fill:var(--muted)">va cambiando</text>
<circle cx="689" cy="186" r="16" fill="var(--warn)" opacity=".85"/>
<text x="689" y="220" text-anchor="middle" class="small" style="fill:var(--ok)">Habitual</text>
<circle cx="663" cy="280" r="9" fill="var(--warn)"/>
<line x1="675" y1="280" x2="691" y2="280" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="713" cy="280" r="18" fill="var(--warn)"/>
<circle cx="717" cy="276" r="6" fill="var(--xray)"/>
<text x="689" y="334" text-anchor="middle" class="small" style="fill:var(--bad)">Revisar</text>
<rect x="40" y="370" width="720" height="56" rx="10" fill="var(--bad-l)"/>
<text x="56" y="394" class="lab">El melanoma nace de los melanocitos, las células del pigmento.</text>
<text x="56" y="414" class="small">Factores: sol y quemaduras, muchos lunares, piel clara. Consultar ante cambios.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
