<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Accidente isquémico transitorio</title>
  <desc id="d">A la izquierda, un cerebro con una arteria bloqueada por un coágulo pasajero y la zona que se queda sin riego; debajo, la secuencia: se bloquea, aparecen síntomas breves y la arteria se reabre. A la derecha, las señales de alarma: cara caída, debilidad de un brazo, habla alterada, pérdida de visión y mareo, con el aviso de llamar a emergencias.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Qué ocurre en el cerebro</text>
  <path d="M120 230 C100 150 170 95 240 100 C320 95 380 140 370 210 C380 260 330 300 270 295 C230 315 170 305 150 280 C120 275 110 255 120 230 Z" fill="var(--organ)" opacity=".55" stroke="var(--line)" stroke-width="2"/>
  <path d="M170 150 C190 170 180 190 205 200 M250 120 C240 150 265 165 255 190 M300 150 C290 175 320 190 310 220 M180 250 C210 240 230 262 260 250" fill="none" stroke="var(--line)" stroke-width="2"/>
  <path d="M240 330 C240 290 230 260 260 230 C280 210 300 200 320 170" fill="none" stroke="var(--vessel)" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="280" cy="214" rx="11" ry="8" fill="var(--ink)"/>
  <circle cx="320" cy="180" r="30" fill="var(--warn)" opacity=".25"/>
  <circle cx="280" cy="214" r="3" fill="var(--ink)"/>
  <path d="M280 214 L330 262" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="266" class="lab">Coágulo pasajero</text>
  <circle cx="320" cy="170" r="3" fill="var(--ink)"/>
  <path d="M320 170 L300 92" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="304" y="96" class="lab">Zona sin riego</text>
  <text x="230" y="350" text-anchor="middle" class="small muted">Arteria cerebral</text>
  <rect x="40" y="370" width="118" height="40" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="99.0" y="395.0" text-anchor="middle" class="lab">Se bloquea</text>
  <path d="M160 390 L170 390" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="172" y="370" width="118" height="40" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="231.0" y="395.0" text-anchor="middle" class="lab">Síntomas breves</text>
  <path d="M292 390 L302 390" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="304" y="370" width="118" height="40" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="363.0" y="395.0" text-anchor="middle" class="lab">Se reabre</text>
  <text x="230" y="434" text-anchor="middle" class="small muted">Suele durar minutos y no deja lesión visible</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Señales de alarma</text>
  <rect x="480" y="64" width="100" height="38" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="530.0" y="88.0" text-anchor="middle" class="lab">Cara</text>
  <text x="594" y="88" class="lab">Un lado caído</text>
  <rect x="480" y="114" width="100" height="38" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="530.0" y="138.0" text-anchor="middle" class="lab">Brazo</text>
  <text x="594" y="138" class="lab">Debilidad de un lado</text>
  <rect x="480" y="164" width="100" height="38" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="530.0" y="188.0" text-anchor="middle" class="lab">Habla</text>
  <text x="594" y="188" class="lab">Torpe o confusa</text>
  <rect x="480" y="214" width="100" height="38" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="530.0" y="238.0" text-anchor="middle" class="lab">Visión</text>
  <text x="594" y="238" class="lab">Pérdida brusca</text>
  <rect x="480" y="264" width="100" height="38" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="530.0" y="288.0" text-anchor="middle" class="lab">Equilibrio</text>
  <text x="594" y="288" class="lab">Mareo, inestabilidad</text>
  <rect x="480" y="320" width="280" height="52" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="620" y="342" text-anchor="middle" class="step">Llamar a emergencias aunque</text>
  <text x="620" y="362" text-anchor="middle" class="step">los síntomas ya se hayan ido</text>
  <text x="620" y="400" text-anchor="middle" class="lab">Es un aviso: aumenta el riesgo</text>
  <text x="620" y="420" text-anchor="middle" class="lab">de ictus en los días siguientes</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
