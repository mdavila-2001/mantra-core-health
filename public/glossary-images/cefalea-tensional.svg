<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Características de la cefalea tensional</title>
  <desc id="d">Rostro con una banda de presión alrededor de la frente y los lados de la cabeza. A la derecha, desencadenantes frecuentes como el estrés o la mala postura y los signos de alarma que requieren urgencias.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Dolor en banda o casco</text>
<ellipse cx="200" cy="220" rx="70.2" ry="90" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<ellipse cx="173.0" cy="211.0" rx="7" ry="5" fill="var(--ink)" stroke="none" stroke-width="1"/>
<ellipse cx="227.0" cy="211.0" rx="7" ry="5" fill="var(--ink)" stroke="none" stroke-width="1"/>
<path d="M200,218.2 L194,247.0 L204,248.8" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M180.2,269.5 Q200,275.8 219.8,269.5" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120,170 Q200,130 280,170" fill="none" stroke="var(--vessel)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
<path d="M118,170 Q100,230 130,290 M282,170 Q300,230 270,290" fill="none" stroke="var(--vessel)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
<text x="200" y="120" text-anchor="middle" class="lab">Presión en ambos lados</text>
<text x="200" y="350" text-anchor="middle" class="small" style="fill:var(--muted)">Sin náuseas intensas</text>
<text x="200" y="368" text-anchor="middle" class="small" style="fill:var(--muted)">Sin empeorar con la actividad</text>
<text x="200" y="398" text-anchor="middle" class="step">Leve o moderada, opresiva</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Desencadenantes y alarmas</text>
<rect x="416" y="56" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="469.0" y="77.2" text-anchor="middle" class="small" style="fill:var(--ink)">Estrés</text>
<rect x="532" y="56" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="585.0" y="77.2" text-anchor="middle" class="small" style="fill:var(--ink)">Mala postura</text>
<rect x="648" y="56" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="701.0" y="77.2" text-anchor="middle" class="small" style="fill:var(--ink)">Poco sueño</text>
<rect x="416" y="100" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="469.0" y="121.2" text-anchor="middle" class="small" style="fill:var(--ink)">Pantallas</text>
<rect x="532" y="100" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="585.0" y="121.2" text-anchor="middle" class="small" style="fill:var(--ink)">Saltar comidas</text>
<rect x="648" y="100" width="106" height="34" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="701.0" y="121.2" text-anchor="middle" class="small" style="fill:var(--ink)">Cuello tenso</text>
<text x="416" y="166" class="lab">Ayuda: descanso, ejercicio, analgésico ocasional.</text>
<text x="416" y="186" class="small" style="fill:var(--muted)">Abusar de analgésicos puede cronificarla.</text>
<rect x="416" y="206" width="344" height="178" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="428" y="228" class="step" style="fill:var(--warn)">Urgencias si aparece:</text>
<text x="428" y="252" class="lab">• Dolor súbito, el peor de la vida</text>
<text x="428" y="276" class="lab">• Fiebre y rigidez de nuca</text>
<text x="428" y="300" class="lab">• Debilidad, habla o visión alterada</text>
<text x="428" y="324" class="lab">• Tras un golpe en la cabeza</text>
<text x="428" y="348" class="lab">• Dolor nuevo después de los 50 años</text>
<text x="428" y="372" class="lab">• Despierta por la noche y empeora</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
