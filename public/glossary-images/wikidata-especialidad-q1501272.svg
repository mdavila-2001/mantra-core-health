<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Foniatría</title>
  <desc id="d">A la izquierda, un perfil de cabeza y cuello con los órganos de la comunicación señalados: cerebro, oído, lengua y labios, laringe con cuerdas vocales y faringe para tragar. A la derecha, las cinco áreas que atiende: voz, habla, lenguaje, audición y deglución.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Órganos de la comunicación</text>
  <path d="M80 120 C80 60 220 50 260 90 C290 120 300 150 290 180 L300 200 L280 210 L290 240 L270 250 C276 270 260 290 230 290 L200 300 L200 420 H90 L90 300 C70 240 70 170 80 120 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="130" cy="150" r="30" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <text x="130" y="155" text-anchor="middle" class="small">Oído</text>
  <path d="M210 220 C240 214 270 218 286 226" fill="none" stroke="var(--vessel)" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <text x="330" y="200" class="small" style="fill:var(--vessel)">Lengua y labios</text>
  <line x1="326" y1="198" x2="280" y2="220" stroke="var(--vessel)" stroke-width="1"/>
  <rect x="160" y="300" width="30" height="110" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="162" y1="330" x2="188" y2="330" stroke="var(--violet)" stroke-width="4"/>
  <text x="330" y="330" class="small" style="fill:var(--violet)">Laringe y</text>
  <text x="330" y="346" class="small" style="fill:var(--violet)">cuerdas vocales</text>
  <line x1="326" y1="334" x2="192" y2="330" stroke="var(--violet)" stroke-width="1"/>
  <rect x="110" y="300" width="22" height="110" rx="6" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1" opacity=".5"/>
  <text x="330" y="390" class="small" style="fill:var(--organ-d)">Faringe y</text>
  <text x="330" y="406" class="small" style="fill:var(--organ-d)">esófago: tragar</text>
  <line x1="326" y1="394" x2="134" y2="370" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="170" cy="96" r="26" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="1.5"/>
  <text x="170" y="100" text-anchor="middle" class="small" style="fill:var(--violet)">Cerebro</text>
  <text x="230" y="434" class="small"></text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <rect x="476" y="66" width="284" height="50" rx="8" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="87" class="lab">Voz</text>
  <text x="492" y="105" class="small" style="fill:var(--muted)">ronquera, nódulos</text>
  <rect x="476" y="124" width="284" height="50" rx="8" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="145" class="lab">Habla</text>
  <text x="492" y="163" class="small" style="fill:var(--muted)">articulación, tartamudez</text>
  <rect x="476" y="182" width="284" height="50" rx="8" fill="var(--ok-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="203" class="lab">Lenguaje</text>
  <text x="492" y="221" class="small" style="fill:var(--muted)">retrasos, afasia</text>
  <rect x="476" y="240" width="284" height="50" rx="8" fill="var(--warn-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="261" class="lab">Audición</text>
  <text x="492" y="279" class="small" style="fill:var(--muted)">su efecto en la comunicación</text>
  <rect x="476" y="298" width="284" height="50" rx="8" fill="var(--organ)" stroke="none" stroke-width="2"/>
  <text x="492" y="319" class="lab">Deglución</text>
  <text x="492" y="337" class="small" style="fill:var(--muted)">dificultad para tragar</text>
  <text x="618" y="380" text-anchor="middle" class="small">Trabaja con logopedas,</text>
  <text x="618" y="398" text-anchor="middle" class="small">otorrinos y neurólogos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
