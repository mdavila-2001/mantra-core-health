<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué analiza un hemograma</title>
  <desc id="d">Un tubo de sangre con anticoagulante separado en plasma, una capa fina de glóbulos blancos y plaquetas, y glóbulos rojos. A la derecha, tres tarjetas describen la serie roja, la serie blanca y la serie plaquetaria con sus parámetros principales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="250" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="145" y="50" text-anchor="middle" class="title">Muestra de sangre</text>
  <rect x="110" y="70" width="70" height="22" rx="5" fill="var(--accent)"/>
  <text x="145" y="86" text-anchor="middle" class="small" style="fill:var(--on)">Tapón lila</text>
  <path d="M112 92 V360 a33 33 0 0 0 66 0 V92 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <path d="M114 150 V215 H176 V150 Z" fill="var(--plasma)"/>
  <rect x="114" y="215" width="62" height="10" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M114 225 V360 a31 31 0 0 0 62 0 V225 Z" fill="var(--red)"/>
  <line x1="180" y1="182" x2="200" y2="182" stroke="var(--muted)"/>
  <text x="204" y="186" class="small">Plasma</text>
  <line x1="180" y1="220" x2="200" y2="220" stroke="var(--muted)"/>
  <text x="204" y="216" class="small">Blancos y</text>
  <text x="204" y="230" class="small">plaquetas</text>
  <line x1="180" y1="300" x2="200" y2="300" stroke="var(--muted)"/>
  <text x="204" y="296" class="small">Glóbulos</text>
  <text x="204" y="310" class="small">rojos</text>
  <text x="145" y="418" text-anchor="middle" class="small muted">Capas al reposar o centrifugar</text>

  <rect x="290" y="20" width="490" height="130" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <ellipse cx="335" cy="85" rx="24" ry="24" fill="var(--red)"/>
  <ellipse cx="335" cy="85" rx="10" ry="10" fill="var(--red-l)"/>
  <text x="378" y="52" class="step">Serie roja · transporta oxígeno</text>
  <text x="378" y="78" class="lab">• Glóbulos rojos, hemoglobina, hematocrito</text>
  <text x="378" y="100" class="lab">• Tamaño (VCM) y contenido de hemoglobina</text>
  <text x="378" y="122" class="lab">• Ayuda a detectar y clasificar anemias</text>

  <rect x="290" y="165" width="490" height="150" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="335" cy="235" r="24" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M325 228 q6 -10 14 -2 q8 8 0 14 q-8 6 -14 -2" fill="var(--accent)"/>
  <text x="378" y="197" class="step">Serie blanca · defensas</text>
  <text x="378" y="223" class="lab">• Recuento total de glóbulos blancos</text>
  <text x="378" y="245" class="lab">• Fórmula: neutrófilos, linfocitos, monocitos,</text>
  <text x="390" y="265" class="lab">eosinófilos y basófilos</text>
  <text x="378" y="289" class="lab">• Cambia con infecciones e inflamación</text>

  <rect x="290" y="330" width="490" height="110" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <ellipse cx="327" cy="385" rx="9" ry="6" fill="var(--warn)"/>
  <ellipse cx="344" cy="375" rx="7" ry="5" fill="var(--warn)"/>
  <ellipse cx="342" cy="395" rx="8" ry="5" fill="var(--warn)"/>
  <text x="378" y="362" class="step">Plaquetas · coagulación</text>
  <text x="378" y="388" class="lab">• Número de plaquetas y su volumen medio</text>
  <text x="378" y="412" class="lab">• Forman el primer tapón cuando hay una herida</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
