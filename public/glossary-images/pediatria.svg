  <rect x="224" y="340" width="172" height="44" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="310.0" y="367.0" text-anchor="middle" class="small">Vacunas</text>
  <rect x="408" y="340" width="172" height="44" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="494.0" y="367.0" text-anchor="middle" class="small">Crecimiento y desarrollo</text>
  <rect x="592" y="340" width="172" height="44" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="678.0" y="367.0" text-anchor="middle" class="small">Enfermedades agudas</text>
  <text x="400" y="414" text-anchor="middle" class="small">Incluye subespecialidades como neonatología,</text>
  <text x="400" y="432" text-anchor="middle" class="small">cardiología o neurología pediátrica</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
