<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad por reflujo gastroesofágico</title>
  <desc id="d">A la izquierda, el esófago, el diafragma y el estómago, con el esfínter esofágico inferior debilitado y una flecha que muestra el ácido subiendo del estómago al esófago. A la derecha, los síntomas típicos, las medidas que ayudan y los signos de alarma.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">El ácido sube al esófago</text>
  <path d="M170 78 V230" fill="none" stroke="var(--organ)" stroke-width="30"/>
  <path d="M170 230 C170 260 120 270 120 320 C120 390 200 410 260 390 C320 370 340 300 300 260 C270 230 220 240 190 236" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M150 236 H190" fill="none" stroke="var(--ink)" stroke-width="6"/>
  <path d="M170 330 C170 300 170 260 170 120" fill="none" stroke="var(--warn)" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <path d="M130 330 C160 344 220 344 300 320 L304 360 C240 390 160 390 130 360 Z" fill="var(--warn)" opacity=".35"/>
  <text x="200" y="100" class="lab">Esófago</text>
  <text x="196" y="230" class="step" style="fill:var(--ink)">Esfínter débil</text>
  <text x="60" y="230" class="small muted">Diafragma</text>
  <path d="M40 244 H140 M200 244 H380" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="240" y="330" text-anchor="middle" class="lab">Estómago</text>
  <text x="240" y="372" text-anchor="middle" class="small" style="fill:var(--warn)">Ácido</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síntomas y medidas</text>
  <text x="436" y="76" class="step">Síntomas típicos</text>
  <text x="440" y="102" class="lab">• Ardor detrás del esternón (pirosis)</text>
  <text x="440" y="126" class="lab">• Regurgitación ácida a la boca</text>
  <text x="440" y="150" class="lab">• Peor al acostarse o tras comer</text>
  <text x="436" y="192" class="step" style="fill:var(--ok)">Medidas que ayudan</text>
  <text x="440" y="218" class="lab">• Cenar 2 a 3 horas antes de dormir</text>
  <text x="440" y="242" class="lab">• Elevar la cabecera de la cama</text>
  <text x="440" y="266" class="lab">• Bajar de peso si sobra</text>
  <text x="440" y="290" class="lab">• Evitar tabaco y alcohol</text>
  <rect x="436" y="324" width="324" height="96" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="348" class="step" style="fill:var(--warn)">Consultar si hay</text>
  <text x="456" y="372" class="small">• Dificultad o dolor al tragar</text>
  <text x="456" y="390" class="small">• Vómitos con sangre, heces negras</text>
  <text x="456" y="408" class="small">• Pérdida de peso sin motivo</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
