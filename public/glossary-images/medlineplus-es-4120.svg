<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugías de corazón</title>
  <desc id="d">A la izquierda, un corazón visto de frente con las zonas sobre las que se opera: la aorta, un injerto de bypass que salva una arteria coronaria, una válvula y el sistema eléctrico del ritmo. A la derecha, los tipos de cirugía, como el bypass coronario, la cirugía de válvulas o el trasplante, y las formas de acceso: abierta, mínimamente invasiva y con o sin máquina corazón-pulmón.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="480" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="260.0" y="50" text-anchor="middle" class="title">Sobre qué se opera</text>
  <path d="M260 410 C170 350 120 290 130 220 C140 160 210 150 250 200 C290 150 360 160 370 220 C380 290 330 350 260 410 Z" fill="var(--vessel)" opacity=".75"/>
  <path d="M240 190 C236 130 250 100 290 96 C320 94 330 110 330 130" fill="none" stroke="var(--vessel)" stroke-width="14" stroke-linecap="round"/>
  <path d="M290 100 C300 160 320 220 300 300" fill="none" stroke="var(--ok)" stroke-width="5" stroke-dasharray="1 0"/>
  <circle cx="230" cy="270" r="14" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
  <path d="M220 270 h20 M230 260 v20" stroke="var(--ink)" stroke-width="2"/>
  <path d="M170 240 C200 260 210 300 240 330" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <path d="M330 300 l10 -10 l8 8 l10 -12" fill="none" stroke="var(--purple)" stroke-width="3"/>
  <circle cx="296" cy="100" r="3" fill="var(--ink)"/>
  <path d="M296 100 L400 80" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="404" y="84" class="lab">Aorta</text>
  <circle cx="305" cy="200" r="3" fill="var(--ink)"/>
  <path d="M305 200 L400 180" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="404" y="184" class="lab">Bypass</text>
  <circle cx="230" cy="270" r="3" fill="var(--ink)"/>
  <path d="M230 270 L60 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="304" class="lab">Válvula</text>
  <circle cx="180" cy="248" r="3" fill="var(--ink)"/>
  <path d="M180 248 L60 200" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="204" class="lab">Coronaria</text>
  <circle cx="352" cy="286" r="3" fill="var(--ink)"/>
  <path d="M352 286 L400 330" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="404" y="334" class="lab">Ritmo</text>
  <text x="260" y="436" text-anchor="middle" class="small muted">Corazón visto de frente, simplificado</text>
  <rect x="520" y="20" width="260" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="650.0" y="50" text-anchor="middle" class="title">Tipos de cirugía</text>
  <rect x="536" y="58" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="80.0" text-anchor="middle" class="small">Bypass coronario</text>
  <rect x="536" y="100" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="122.0" text-anchor="middle" class="small">Reparar o cambiar válvulas</text>
  <rect x="536" y="142" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="164.0" text-anchor="middle" class="small">Aneurisma de aorta</text>
  <rect x="536" y="184" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="206.0" text-anchor="middle" class="small">Arritmias y marcapasos</text>
  <rect x="536" y="226" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="248.0" text-anchor="middle" class="small">Cardiopatías congénitas</text>
  <rect x="536" y="268" width="228" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="650.0" y="290.0" text-anchor="middle" class="small">Trasplante de corazón</text>
  <text x="540" y="326" class="step">Cómo se accede</text>
  <text x="540" y="350" class="small">• Abierta (esternón)</text>
  <text x="540" y="372" class="small">• Mínimamente invasiva</text>
  <text x="540" y="394" class="small">• Con o sin máquina</text>
  <text x="540" y="416" class="small">• corazón-pulmón</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
