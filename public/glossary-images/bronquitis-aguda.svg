<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Bronquitis aguda</title>
  <desc id="d">A la izquierda, los pulmones con la tráquea y los bronquios resaltados por la inflamación, sin afectar a los alvéolos. A la derecha, el corte de un bronquio normal y otro inflamado con moco, las características de la enfermedad y los signos que obligan a consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Bronquios inflamados</text>
  <path d="M200 108.49999999999999 V176.0" fill="none" stroke="var(--muted)" stroke-width="13.5" stroke-linecap="round"/>
  <path d="M200 176.0 L159.5 216.5 M200 176.0 L240.5 216.5" fill="none" stroke="var(--muted)" stroke-width="9.450000000000001" stroke-linecap="round"/>
  <path d="M181.1 149.0 C119.0 122.0 65.0 203.0 65.0 297.5 C65.0 351.5 146.0 351.5 175.7 324.5 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <path d="M218.9 149.0 C281.0 122.0 335.0 203.0 335.0 297.5 C335.0 351.5 254.0 351.5 224.3 324.5 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <path d="M200 120 V176 M200 176 L150 216 L120 270 M150 216 L170 290 M200 176 L250 216 L280 270 M250 216 L232 296" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linecap="round"/>
  <text x="200" y="72" text-anchor="middle" class="small muted">Tráquea</text>
  <text x="300" y="330" class="lab" style="fill:var(--warn)">Bronquios</text>
  <text x="200" y="410" text-anchor="middle" class="small muted">Los alvéolos no se afectan (no es neumonía)</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Qué la caracteriza</text>
  <rect x="416" y="60" width="344" height="110" rx="10" fill="var(--tissue)"/>
  <text x="432" y="84" class="small muted">Corte de un bronquio</text>
  <circle cx="500" cy="120" r="34" fill="var(--organ)"/>
  <circle cx="500" cy="120" r="18" fill="var(--panel)"/>
  <circle cx="660" cy="120" r="36" fill="var(--warn)"/>
  <circle cx="660" cy="120" r="9" fill="var(--panel)"/>
  <text x="560" y="126" text-anchor="middle" class="op">→</text>
  <text x="500" y="164" text-anchor="middle" class="small">Normal</text>
  <text x="660" y="164" text-anchor="middle" class="small">Inflamado, con moco</text>
  <text x="420" y="206" class="lab">• Tos, con o sin flema, a veces semanas</text>
  <text x="420" y="232" class="lab">• Casi siempre la causa un virus</text>
  <text x="420" y="258" class="lab">• Puede haber pitos y molestia en el pecho</text>
  <text x="420" y="284" class="lab">• Suele curar sola: reposo y líquidos</text>
  <text x="420" y="310" class="lab">• Los antibióticos casi nunca hacen falta</text>
  <rect x="416" y="350" width="344" height="74" rx="10" fill="var(--warn-l)"/>
  <text x="432" y="374" class="lab">Consultar si hay fiebre alta, falta de aire,</text>
  <text x="432" y="394" class="lab">sangre al toser o más de 3 semanas</text>
  <text x="432" y="414" class="lab">de tos</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
