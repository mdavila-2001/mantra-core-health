<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Química clínica</title>
  <desc id="d">Arriba, el recorrido de una muestra en el laboratorio: extracción de sangre u orina, centrifugado para separar el suero, medición en un analizador, control de calidad e informe al médico. Abajo, lo que mide y cómo prepararse para un análisis.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Del tubo al informe</text>
  <rect x="40" y="150" width="128" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="104.0" y="174.5" text-anchor="middle" class="small">Extracción</text>
  <text x="104.0" y="191.5" text-anchor="middle" class="small">sangre u orina</text>
  <line x1="170" y1="178" x2="186" y2="178" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="188" y="150" width="128" height="56" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="252.0" y="174.5" text-anchor="middle" class="small">Centrífuga</text>
  <text x="252.0" y="191.5" text-anchor="middle" class="small">separa el suero</text>
  <line x1="318" y1="178" x2="334" y2="178" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="336" y="150" width="128" height="56" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="400.0" y="174.5" text-anchor="middle" class="small">Analizador</text>
  <text x="400.0" y="191.5" text-anchor="middle" class="small">mide sustancias</text>
  <line x1="466" y1="178" x2="482" y2="178" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="484" y="150" width="128" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="548.0" y="174.5" text-anchor="middle" class="small">Control</text>
  <text x="548.0" y="191.5" text-anchor="middle" class="small">de calidad</text>
  <line x1="614" y1="178" x2="630" y2="178" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="632" y="150" width="128" height="56" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="696.0" y="174.5" text-anchor="middle" class="small">Informe</text>
  <text x="696.0" y="191.5" text-anchor="middle" class="small">al médico</text>
  <rect x="89" y="66" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M92 80 V116 a12 12 0 0 0 24 0 V80" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M94 106 V116 a10 10 0 0 0 20 0 V106 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <path d="M260 70 l10 0 0 60 a5 5 0 0 1 -10 0 Z" fill="var(--fluid)" stroke="var(--muted)" stroke-width="1"/>
  <rect x="260" y="108" width="10" height="26" rx="4" fill="var(--vessel)" stroke="none" stroke-width="0"/>
  <circle cx="253" cy="100" r="0" fill="none" stroke="none" stroke-width="2"/>
  <rect x="400" y="76" width="80" height="56" rx="8" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <rect x="410" y="86" width="60" height="20" rx="3" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <path d="M560 80 h40 l-6 30 h-28 Z" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <rect x="670" y="74" width="50" height="64" rx="4" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M680 92 h30 M680 104 h30 M680 116 h20" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="286" text-anchor="middle" class="title">Qué mide</text>
  <text x="40" y="312" class="small">• Glucosa y lípidos</text>
  <text x="40" y="336" class="small">• Función renal y hepática</text>
  <text x="40" y="360" class="small">• Electrolitos</text>
  <text x="40" y="384" class="small">• Enzimas, hormonas y proteínas</text>
  <text x="40" y="408" class="small">• Niveles de fármacos</text>
  <rect x="410" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="286" text-anchor="middle" class="title">Cómo prepararse</text>
  <text x="430" y="312" class="small">• Seguir las indicaciones de ayuno</text>
  <text x="430" y="336" class="small">• Avisar de medicamentos y suplementos</text>
  <text x="430" y="360" class="small">• Recoger la orina como se indique</text>
  <text x="430" y="384" class="small">• Cada resultado se interpreta</text>
  <text x="430" y="408" class="small">• con los rangos de cada laboratorio</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
