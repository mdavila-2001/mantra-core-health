<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tomografía de abdomen y pelvis</title>
  <desc id="d">Anillo del tomógrafo con el tubo de rayos X y los detectores que giran alrededor de una persona tumbada en la camilla. A la derecha, la imagen en cortes transversales, los tipos de contraste y los órganos que se estudian.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">El equipo de TAC</text>
<circle cx="230" cy="190" r="110" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="3"/>
<circle cx="230" cy="190" r="62" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
<rect x="40" y="214" width="380" height="22" rx="6" fill="var(--muted)" stroke-width="1"/>
<text x="80" y="256" class="small">Camilla que avanza</text>
<ellipse cx="230" cy="200" rx="74" ry="26" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<rect x="212" y="82" width="36" height="22" rx="4" fill="var(--accent)" stroke-width="1"/>
<rect x="212" y="276" width="36" height="18" rx="4" fill="var(--ink)" stroke-width="1"/>
<path d="M230,104 L200,276 M230,104 L260,276" fill="none" stroke="var(--beam)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330,120 A110,110 0 0 1 340,250" fill="none" stroke="var(--warn)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="240" y="76" class="small">Tubo de rayos X</text>
<text x="260" y="310" class="small">Detectores</text>
<text x="346" y="120" class="small" style="fill:var(--warn)">Gira</text>
<text x="230" y="348" text-anchor="middle" class="lab">Obtiene cortes finos del abdomen</text>
<text x="230" y="368" text-anchor="middle" class="lab">y la pelvis en pocos segundos.</text>
<text x="230" y="404" text-anchor="middle" class="small" style="fill:var(--muted)">Hay que contener la respiración unos segundos.</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Cortes y contraste</text>
<ellipse cx="530" cy="90" rx="50" ry="12" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="530" cy="108" rx="50" ry="12" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="530" cy="126" rx="50" ry="12" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="530" cy="144" rx="50" ry="12" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="530" cy="162" rx="50" ry="12" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="600" y="120" class="small">Cortes</text>
<text x="600" y="136" class="small">transversales</text>
<rect x="476" y="190" width="284" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="488" y="212" class="step">Contraste</text>
<text x="488" y="236" class="lab">• Oral: marca el intestino</text>
<text x="488" y="258" class="lab">• Intravenoso: realza vasos y órganos</text>
<text x="488" y="280" class="lab">• Preguntar por alergias y riñón</text>
<text x="476" y="316" class="lab">Ve: hígado, páncreas, riñones,</text>
<text x="476" y="336" class="lab">intestino, vejiga, ganglios y vasos.</text>
<text x="476" y="372" class="small" style="fill:var(--muted)">Usa radiación: informar si hay</text>
<text x="476" y="390" class="small" style="fill:var(--muted)">posibilidad de embarazo.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
