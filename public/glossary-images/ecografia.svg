<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona una ecografía</title>
  <desc id="d">A la izquierda, un transductor apoyado con gel sobre la piel del abdomen emite ondas de ultrasonido hacia un órgano; los ecos rebotan y vuelven al transductor. A la derecha, la pantalla del ecógrafo muestra la imagen en escala de grises: los líquidos se ven negros, los tejidos sólidos grises y un cálculo blanco con sombra.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f1dccb; --organ:#c98a7a; --wave:#2b6cb0; --echo:#1f8a5b; --gel:#9fd3e6; --screen:#0f1720; --gray1:#6b7480; --gray2:#a9b1ba; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4a40; --organ:#8f5a4e; --wave:#6aa7e8; --echo:#4cc38a; --gel:#2f6a80; --screen:#05080c; --gray1:#5d6670; --gray2:#9aa3ad; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <!-- Panel izquierdo -->
  <rect x="20" y="20" width="390" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="215" y="50" text-anchor="middle" class="title">Ondas que van y ecos que vuelven</text>

  <!-- transductor -->
  <rect x="180" y="70" width="60" height="70" rx="12" fill="var(--accent)"/>
  <path d="M170 140 H250 L244 160 H176 Z" fill="var(--accent)"/>
  <path d="M210 70 C210 55 230 50 250 60" fill="none" stroke="var(--muted)" stroke-width="4"/>
  <text x="260" y="100" class="lab">Transductor</text>
  <text x="260" y="116" class="small muted">emite y escucha</text>
  <!-- gel -->
  <rect x="170" y="160" width="80" height="8" rx="4" fill="var(--gel)"/>
  <text x="260" y="168" class="small muted">Gel (quita el aire)</text>

  <!-- piel y abdomen -->
  <path d="M40 168 H390 V410 H40 Z" fill="var(--skin)" opacity=".55"/>
  <line x1="40" y1="168" x2="390" y2="168" stroke="var(--line)" stroke-width="2"/>
  <text x="48" y="188" class="small muted">Piel</text>

  <!-- órgano -->
  <ellipse cx="210" cy="330" rx="120" ry="58" fill="var(--organ)" opacity=".8"/>
  <ellipse cx="175" cy="330" rx="26" ry="18" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210" y="402" text-anchor="middle" class="lab">Órgano</text>
  <text x="120" y="304" class="small">Quiste</text>

  <!-- ondas emitidas -->
  <path d="M185 190 Q210 200 235 190" fill="none" stroke="var(--wave)" stroke-width="3"/>
  <path d="M178 215 Q210 228 242 215" fill="none" stroke="var(--wave)" stroke-width="3"/>
  <path d="M171 240 Q210 256 249 240" fill="none" stroke="var(--wave)" stroke-width="3"/>
  <path d="M164 265 Q210 284 256 265" fill="none" stroke="var(--wave)" stroke-width="3"/>
  <text x="72" y="236" class="lab" style="fill:var(--wave)">Ultrasonido</text>
  <!-- ecos -->
  <path d="M300 268 C320 230 300 190 262 170" fill="none" stroke="var(--echo)" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="262,170 276,170 270,180" fill="var(--echo)"/>
  <text x="312" y="240" class="lab" style="fill:var(--echo)">Eco</text>

  <!-- Panel derecho -->
  <rect x="426" y="20" width="354" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="603" y="50" text-anchor="middle" class="title">Imagen en la pantalla</text>
  <path d="M446 70 H760 V290 H446 Z" fill="var(--screen)"/>
  <path d="M603 80 L748 280 H458 Z" fill="var(--gray1)"/>
  <ellipse cx="560" cy="200" rx="30" ry="22" fill="var(--screen)"/>
  <ellipse cx="660" cy="220" rx="12" ry="9" fill="#ffffff"/>
  <path d="M650 229 L672 229 L690 280 L632 280 Z" fill="var(--screen)" opacity=".85"/>
  <ellipse cx="620" cy="150" rx="40" ry="10" fill="var(--gray2)" opacity=".7"/>

  <rect x="446" y="306" width="314" height="116" rx="10" fill="none" stroke="var(--line)"/>
  <rect x="460" y="320" width="16" height="16" fill="var(--screen)" stroke="var(--line)"/>
  <text x="484" y="333" class="lab">Negro: líquido (quiste, vejiga)</text>
  <rect x="460" y="346" width="16" height="16" fill="var(--gray1)"/>
  <text x="484" y="359" class="lab">Gris: tejido sólido del órgano</text>
  <rect x="460" y="372" width="16" height="16" fill="#ffffff" stroke="var(--line)"/>
  <text x="484" y="385" class="lab">Blanco: refleja mucho (cálculo)</text>
  <text x="460" y="410" class="small muted">Detrás del cálculo queda una sombra oscura.</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
