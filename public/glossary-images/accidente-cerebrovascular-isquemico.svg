<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Accidente cerebrovascular isquémico</title>
  <desc id="d">A la izquierda, un cerebro de perfil con una arteria tapada por un coágulo, una zona central sin riego y una penumbra alrededor que aún puede salvarse. A la derecha, las seis señales de alarma BE-FAST y el mensaje de que el tiempo es cerebro.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Arteria cerebral obstruida</text>
  <path d="M80 250 C70 170 120 100 200 95 C280 90 340 140 335 215 C332 260 310 300 270 310 C250 340 200 345 170 320 C120 330 85 300 80 250 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M120 200 C150 190 170 210 200 200 M150 260 C180 250 210 270 250 255 M230 150 C250 170 280 160 300 180" fill="none" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M110 380 C140 350 170 330 190 300 C205 275 220 250 250 230" fill="none" stroke="var(--vessel)" stroke-width="8"/>
  <path d="M190 300 C170 285 150 270 130 270" fill="none" stroke="var(--vessel)" stroke-width="5"/>
  <ellipse cx="250" cy="228" rx="34" ry="26" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5" opacity=".9"/>
  <ellipse cx="262" cy="220" rx="18" ry="14" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <circle cx="236" cy="236" r="7" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <text x="236" y="395" text-anchor="middle" class="small">Coágulo que tapa la arteria</text>
  <line x1="236" y1="380" x2="236" y2="246" stroke="var(--ink)" stroke-width="1"/>
  <text x="290" y="180" class="small">Núcleo</text>
  <text x="290" y="196" class="small" style="fill:var(--muted)">(sin riego)</text>
  <text x="300" y="255" class="small" style="fill:var(--warn)">Penumbra</text>
  <text x="300" y="271" class="small" style="fill:var(--muted)">(rescatable)</text>
  <text x="200" y="425" text-anchor="middle" class="small" style="fill:var(--muted)">Sin sangre, las neuronas mueren en minutos</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Señales de alarma: BE-FAST</text>
  <circle cx="436" cy="78" r="16" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="436" y="83" text-anchor="middle" class="step on">B</text>
  <text x="464" y="83" class="lab">Balance: pérdida brusca del equilibrio</text>
  <circle cx="436" cy="122" r="16" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="436" y="127" text-anchor="middle" class="step on">E</text>
  <text x="464" y="127" class="lab">Eyes: pérdida súbita de visión</text>
  <circle cx="436" cy="166" r="16" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="436" y="171" text-anchor="middle" class="step on">F</text>
  <text x="464" y="171" class="lab">Face: boca torcida</text>
  <circle cx="436" cy="210" r="16" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="436" y="215" text-anchor="middle" class="step on">A</text>
  <text x="464" y="215" class="lab">Arm: brazo débil o caído</text>
  <circle cx="436" cy="254" r="16" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="436" y="259" text-anchor="middle" class="step on">S</text>
  <text x="464" y="259" class="lab">Speech: habla rara o confusa</text>
  <circle cx="436" cy="298" r="16" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="436" y="303" text-anchor="middle" class="step on">T</text>
  <text x="464" y="303" class="lab">Time: hora de inicio, llamar ya</text>
  <rect x="416" y="340" width="344" height="84" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="588" y="370" text-anchor="middle" class="big">Tiempo es cerebro</text>
  <text x="588" y="394" text-anchor="middle" class="small">Ante un solo signo, llamar a emergencias:</text>
  <text x="588" y="412" text-anchor="middle" class="small">algunos tratamientos solo sirven en las primeras horas.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
