<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trastorno de adaptación</title>
  <desc id="d">Secuencia de tres recuadros: un estresor identificable como una pérdida o un despido, una respuesta emocional excesiva con tristeza, ansiedad o irritabilidad, y su repercusión en el trabajo, las relaciones y el sueño. Debajo, una línea de tiempo orientativa, las formas de ayuda y cuándo pedir ayuda urgente.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Trastorno de adaptación</text>
  <rect x="50" y="80" width="180" height="110" rx="12" fill="var(--warn-l)"/>
  <text x="140" y="110" text-anchor="middle" class="step" style="fill:var(--warn)">Estresor claro</text>
  <text x="66" y="136" class="small">• Pérdida o ruptura</text>
  <text x="66" y="156" class="small">• Despido, mudanza</text>
  <text x="66" y="176" class="small">• Enfermedad</text>
  <line x1="232" y1="135" x2="300" y2="135" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="304" y="80" width="200" height="110" rx="12" fill="var(--accent-l)"/>
  <text x="404" y="110" text-anchor="middle" class="step">Respuesta excesiva</text>
  <text x="320" y="136" class="small">• Tristeza, ansiedad</text>
  <text x="320" y="156" class="small">• Irritabilidad</text>
  <text x="320" y="176" class="small">• Cambios de conducta</text>
  <line x1="506" y1="135" x2="570" y2="135" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="574" y="80" width="180" height="110" rx="12" fill="var(--tissue)"/>
  <text x="664" y="110" text-anchor="middle" class="step">Afecta la vida</text>
  <text x="590" y="136" class="small">• Trabajo, estudios</text>
  <text x="590" y="156" class="small">• Relaciones</text>
  <text x="590" y="176" class="small">• Sueño</text>
  <text x="400" y="240" text-anchor="middle" class="step">Tiempos orientativos</text>
  <path d="M80 290 H720" fill="none" stroke="var(--line)" stroke-width="4"/>
  <circle cx="100" cy="290" r="10" fill="var(--warn)"/>
  <text x="100" y="320" text-anchor="middle" class="small">Estresor</text>
  <rect x="100" y="278" width="220" height="24" rx="12" fill="var(--accent)" opacity=".6"/>
  <text x="210" y="270" text-anchor="middle" class="small">Empieza en los 3 meses siguientes</text>
  <rect x="420" y="278" width="280" height="24" rx="12" fill="var(--ok)" opacity=".5"/>
  <text x="560" y="270" text-anchor="middle" class="small">Suele ceder en 6 meses</text>
  <text x="560" y="320" text-anchor="middle" class="small muted">cuando el estresor termina</text>
  <rect x="50" y="350" width="340" height="70" rx="10" fill="var(--ok-l)"/>
  <text x="220" y="376" text-anchor="middle" class="lab">Ayuda: psicoterapia breve,</text>
  <text x="220" y="396" text-anchor="middle" class="lab">apoyo y resolver problemas</text>
  <rect x="410" y="350" width="340" height="70" rx="10" fill="var(--warn-l)"/>
  <text x="580" y="376" text-anchor="middle" class="lab">Pedir ayuda urgente si hay</text>
  <text x="580" y="396" text-anchor="middle" class="lab">ideas de hacerse daño</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
