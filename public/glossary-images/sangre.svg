<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Componentes de la sangre</title>
  <desc id="d">Un tubo de sangre separado en plasma, una capa fina de glóbulos blancos y plaquetas, y glóbulos rojos. Al lado, dibujos de cada componente con su función: el plasma transporta, los glóbulos rojos llevan oxígeno, los blancos defienden y las plaquetas ayudan a coagular.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="230" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="135" y="50" text-anchor="middle" class="title">Al centrifugar</text>
  <path d="M100 80 V360 a35 35 0 0 0 70 0 V80 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <path d="M102 100 V215 H168 V100 Z" fill="var(--plasma)"/>
  <rect x="102" y="215" width="66" height="10" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M102 225 V360 a33 33 0 0 0 66 0 V225 Z" fill="var(--red)"/>
  <text x="135" y="160" text-anchor="middle" class="lab">Plasma</text>
  <text x="135" y="300" text-anchor="middle" class="lab" style="fill:var(--on)">Rojos</text>
  <text x="135" y="420" text-anchor="middle" class="small muted">Capa fina: blancos y plaquetas</text>

  <rect x="266" y="20" width="514" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="523" y="50" text-anchor="middle" class="title">Qué hace cada parte</text>
  <rect x="286" y="70" width="60" height="60" rx="10" fill="var(--plasma)"/>
  <text x="362" y="94" class="step">Plasma</text>
  <text x="362" y="116" class="lab">Agua, proteínas, sales, nutrientes y hormonas</text>
  <ellipse cx="316" cy="190" rx="28" ry="26" fill="var(--red)"/>
  <ellipse cx="316" cy="190" rx="11" ry="10" fill="var(--red-l)"/>
  <text x="362" y="182" class="step">Glóbulos rojos</text>
  <text x="362" y="204" class="lab">Hemoglobina: llevan oxígeno y traen CO₂</text>
  <circle cx="316" cy="276" r="26" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M304 268 q8 -12 18 -2 q10 10 0 18 q-10 8 -18 -2" fill="var(--accent)"/>
  <text x="362" y="268" class="step">Glóbulos blancos</text>
  <text x="362" y="290" class="lab">Defensa frente a infecciones</text>
  <ellipse cx="306" cy="360" rx="10" ry="6" fill="var(--warn)"/>
  <ellipse cx="326" cy="350" rx="8" ry="5" fill="var(--warn)"/>
  <ellipse cx="324" cy="372" rx="9" ry="5" fill="var(--warn)"/>
  <text x="362" y="354" class="step">Plaquetas</text>
  <text x="362" y="376" class="lab">Taponan heridas y ayudan a coagular</text>
  <text x="523" y="420" text-anchor="middle" class="small muted">Todas las células se fabrican en la médula ósea</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
