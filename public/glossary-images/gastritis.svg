<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Gastritis: inflamación de la mucosa gástrica</title>
  <desc id="d">A la izquierda, el estómago con zonas rojas de mucosa inflamada y la explicación de que se rompe el equilibrio entre el ácido y la capa protectora. A la derecha, las causas frecuentes, como Helicobacter pylori, antiinflamatorios, alcohol y estrés intenso, los síntomas y las señales de alarma.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">La mucosa del estómago</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Causas y síntomas</text>
<path d="M190 76 C203.5 103.0 176.5 130.0 136.0 170.5 C95.5 224.5 149.5 278.5 217.0 265.0 C271.0 251.5 298.0 224.5 311.5 211.0 L325.0 224.5 L338.5 205.60000000000002 C284.5 197.5 257.5 170.5 244.0 116.5 C238.6 89.5 230.5 76 222.4 67.9 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M190 76 L196 58" fill="none" stroke="var(--organ)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="210" r="9" fill="var(--bad)" opacity=".45"/>
<circle cx="180" cy="240" r="9" fill="var(--bad)" opacity=".45"/>
<circle cx="215" cy="215" r="9" fill="var(--bad)" opacity=".45"/>
<circle cx="250" cy="236" r="9" fill="var(--bad)" opacity=".45"/>
<circle cx="130" cy="236" r="9" fill="var(--bad)" opacity=".45"/>
<text x="215" y="170" text-anchor="middle" class="lab">Estómago</text>
<text x="60" y="314" class="small" style="fill:var(--bad)">Mucosa</text>
<text x="60" y="330" class="small" style="fill:var(--bad)">inflamada</text>
<rect x="40" y="350" width="320" height="70" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="56" y="374" class="small">Se rompe el equilibrio entre el ácido</text>
<text x="56" y="392" class="small">y la capa que protege la pared.</text>
<text x="56" y="410" class="small" style="fill:var(--muted)">Puede ser aguda o crónica.</text>
<text x="416" y="76" class="h">Causas frecuentes</text>
<rect x="416" y="96" width="6" height="34" rx="3" fill="var(--warn)"/>
<text x="432" y="111" class="lab">Helicobacter pylori</text>
<text x="432" y="127" class="small" style="fill:var(--muted)">bacteria</text>
<rect x="416" y="140" width="6" height="34" rx="3" fill="var(--warn)"/>
<text x="432" y="155" class="lab">Antiinflamatorios</text>
<text x="432" y="171" class="small" style="fill:var(--muted)">como el ibuprofeno</text>
<rect x="416" y="184" width="6" height="34" rx="3" fill="var(--warn)"/>
<text x="432" y="199" class="lab">Alcohol</text>
<text x="432" y="215" class="small" style="fill:var(--muted)">en exceso</text>
<rect x="416" y="228" width="6" height="34" rx="3" fill="var(--warn)"/>
<text x="432" y="243" class="lab">Estrés intenso</text>
<text x="432" y="259" class="small" style="fill:var(--muted)">enfermedad grave</text>
<text x="416" y="290" class="h">Síntomas</text>
<text x="416" y="316" class="lab">• Ardor o dolor en la boca del estómago</text>
<text x="416" y="338" class="lab">• Náuseas, llenura rápida</text>
<text x="416" y="374" class="small" style="fill:var(--bad)">Urgente: vómitos con sangre o</text>
<text x="416" y="390" class="small" style="fill:var(--bad)">heces negras.</text>
<text x="416" y="418" class="small" style="fill:var(--muted)">Puede no dar síntomas.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
