<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Genética médica</title>
  <desc id="d">A la izquierda, un cromosoma con una región señalada que se amplía a la doble hélice de ADN de un gen, y los tres tipos de alteraciones: cromosómicas, monogénicas y multifactoriales. A la derecha, los pasos de la consulta y un árbol familiar con los afectados en color.</desc>
