<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Síndrome de ovario poliquístico</title>
  <desc id="d">A la izquierda, un ovario habitual con un folículo maduro junto a un ovario poliquístico con muchos folículos pequeños en la periferia, y los tres mecanismos que se combinan: exceso de andrógenos, ovulación irregular y resistencia a la insulina. A la derecha, señales, diagnóstico y abordaje.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Ovario normal y poliquístico</text>
  <ellipse cx="120" cy="170" rx="74" ry="54" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <circle cx="140" cy="166" r="20" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="90" cy="180" r="8" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="110" cy="150" r="7" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="120" y="252" text-anchor="middle" class="small">Ovario habitual</text>
  <ellipse cx="310" cy="170" rx="74" ry="54" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <circle cx="364.0" cy="170.0" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="358.7" cy="185.6" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="343.7" cy="198.1" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="322.0" cy="205.1" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="298.0" cy="205.1" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="276.3" cy="198.1" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="261.3" cy="185.6" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="256.0" cy="170.0" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="261.3" cy="154.4" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="276.3" cy="141.9" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="298.0" cy="134.9" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="322.0" cy="134.9" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="343.7" cy="141.9" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <circle cx="358.7" cy="154.4" r="9" fill="var(--panel)" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="310" y="252" text-anchor="middle" class="small">Muchos folículos</text>
  <text x="140" y="112" text-anchor="middle" class="small" style="fill:var(--muted)">Folículo maduro</text>
  <text x="220" y="300" text-anchor="middle" class="step">Se combinan</text>
  <rect x="40" y="316" width="116" height="54" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="98.0" y="339.5" text-anchor="middle" class="small">Exceso</text>
  <text x="98.0" y="356.5" text-anchor="middle" class="small">de andrógenos</text>
  <rect x="164" y="316" width="116" height="54" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="222.0" y="339.5" text-anchor="middle" class="small">Ovulación</text>
  <text x="222.0" y="356.5" text-anchor="middle" class="small">irregular</text>
  <rect x="288" y="316" width="116" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="346.0" y="339.5" text-anchor="middle" class="small">Resistencia</text>
  <text x="346.0" y="356.5" text-anchor="middle" class="small">a la insulina</text>
  <text x="220" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">Se diagnostica con dos de tres criterios</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Señales y abordaje</text>
  <text x="456" y="80" class="small">• Reglas irregulares o ausentes</text>
  <text x="456" y="104" class="small">• Exceso de vello o acné</text>
  <text x="456" y="128" class="small">• Caída del cabello</text>
  <text x="456" y="152" class="small">• Aumento de peso</text>
  <text x="456" y="176" class="small">• Dificultad para quedar embarazada</text>
  <text x="456" y="214" class="step">Diagnóstico</text>
  <text x="456" y="236" class="small">Historia, análisis hormonales y ecografía</text>
  <rect x="456" y="260" width="304" height="162" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="286" class="step">Qué ayuda</text>
  <text x="480" y="310" class="small">• Ejercicio y alimentación sana</text>
  <text x="480" y="330" class="small">• Tratamiento hormonal para el ciclo</text>
  <text x="480" y="350" class="small">• Fármacos para la insulina</text>
  <text x="480" y="370" class="small">• Tratamientos de fertilidad</text>
  <text x="480" y="390" class="small">• Vigilar glucosa y colesterol</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
