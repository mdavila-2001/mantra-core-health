<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina del trabajo: riesgos y prevención</title>
  <desc id="d">A la izquierda, los cinco tipos de riesgo laboral: físicos, químicos, biológicos, ergonómicos y psicosociales, con ejemplos. A la derecha, una pirámide invertida de la jerarquía de la prevención: eliminar el peligro, sustituirlo, controles técnicos, normas y formación y, por último, equipos de protección individual.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Riesgos en el trabajo</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Jerarquía de la prevención</text>
<circle cx="64" cy="90" r="18" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<text x="64" y="95" text-anchor="middle" class="step" style="fill:var(--accent)">F</text>
<text x="94" y="86" class="step">Físicos</text>
<text x="94" y="106" class="small" style="fill:var(--muted)">ruido, calor, radiación</text>
<circle cx="64" cy="152" r="18" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<text x="64" y="157" text-anchor="middle" class="step" style="fill:var(--warn)">Q</text>
<text x="94" y="148" class="step">Químicos</text>
<text x="94" y="168" class="small" style="fill:var(--muted)">polvos, solventes</text>
<circle cx="64" cy="214" r="18" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
<text x="64" y="219" text-anchor="middle" class="step" style="fill:var(--ok)">B</text>
<text x="94" y="210" class="step">Biológicos</text>
<text x="94" y="230" class="small" style="fill:var(--muted)">virus, bacterias</text>
<circle cx="64" cy="276" r="18" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2"/>
<text x="64" y="281" text-anchor="middle" class="step" style="fill:var(--purple)">E</text>
<text x="94" y="272" class="step">Ergonómicos</text>
<text x="94" y="292" class="small" style="fill:var(--muted)">posturas, cargas</text>
<circle cx="64" cy="338" r="18" fill="var(--bad-l)" stroke="var(--vessel)" stroke-width="2"/>
<text x="64" y="343" text-anchor="middle" class="step" style="fill:var(--vessel)">P</text>
<text x="94" y="334" class="step">Psicosociales</text>
<text x="94" y="354" class="small" style="fill:var(--muted)">estrés, turnos, acoso</text>
<text x="40" y="396" class="small">Exámenes de salud, adaptación del puesto</text>
<text x="40" y="412" class="small">y vuelta al trabajo tras una enfermedad.</text>
<rect x="418.0" y="70" width="340" height="48" rx="8" fill="var(--ok)" opacity="1.00"/>
<text x="588" y="99" text-anchor="middle" class="small" style="fill:var(--on)">Eliminar el peligro</text>
<rect x="443.0" y="128" width="290" height="48" rx="8" fill="var(--ok)" opacity="0.92"/>
<text x="588" y="157" text-anchor="middle" class="small" style="fill:var(--on)">Sustituir</text>
<rect x="468.0" y="186" width="240" height="48" rx="8" fill="var(--accent)" opacity="0.84"/>
<text x="588" y="215" text-anchor="middle" class="small" style="fill:var(--on)">Controles técnicos</text>
<rect x="493.0" y="244" width="190" height="48" rx="8" fill="var(--warn)" opacity="0.76"/>
<text x="588" y="273" text-anchor="middle" class="small" style="fill:var(--on)">Normas y formación</text>
<rect x="518.0" y="302" width="140" height="48" rx="8" fill="var(--bad)" opacity="0.68"/>
<text x="588" y="331" text-anchor="middle" class="small" style="fill:var(--on)">Equipos de protección</text>
<text x="588" y="376" text-anchor="middle" class="small" style="fill:var(--muted)">Arriba: lo más eficaz</text>
<text x="588" y="400" text-anchor="middle" class="small">Primero se cambia el entorno; el equipo</text>
<text x="588" y="416" text-anchor="middle" class="small">de protección es la última barrera.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
