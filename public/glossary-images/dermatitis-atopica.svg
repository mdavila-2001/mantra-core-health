<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dermatitis atópica: barrera cutánea alterada</title>
  <desc id="d">A la izquierda, la capa externa de la piel sana como un muro de ladrillos unidos y la piel atópica con huecos por donde entran alérgenos e irritantes y se pierde agua, lo que alimenta el ciclo de picor y rascado. A la derecha, una silueta con las zonas típicas, como los pliegues de codos y rodillas, la cara y las manos, y los cuidados básicos.</desc>
