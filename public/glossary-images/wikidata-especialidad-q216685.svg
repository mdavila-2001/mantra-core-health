<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ortopedia</title>
  <desc id="d">A la izquierda, un esquema del brazo y el codo con las partes del aparato locomotor: hueso, músculo, tendón, ligamento, articulación y nervio. A la derecha, lo que atiende la ortopedia: lesiones como fracturas y esguinces, desgaste como la artrosis, deformidades y lesiones deportivas, y sus tratamientos: inmovilización, fisioterapia, infiltraciones y cirugía.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">El aparato locomotor</text>
  <rect x="80" y="80" width="34" height="170" rx="14" fill="var(--bone)" stroke="var(--line)"/>
  <path d="M97 260 C110 300 170 330 230 336 L400 340" fill="none" stroke="var(--bone)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="102" cy="270" r="26" fill="var(--bone)" stroke="var(--line)"/>
  <circle cx="102" cy="270" r="30" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="6 4"/>
  <path d="M120 100 C160 120 180 200 150 250" fill="none" stroke="var(--bad)" stroke-width="24" stroke-linecap="round" opacity=".55"/>
  <path d="M150 250 L176 300" stroke="var(--warn)" stroke-width="5"/>
  <path d="M78 250 L120 292" stroke="var(--ok)" stroke-width="5"/>
  <path d="M60 100 C50 200 60 260 90 320 L200 360" fill="none" stroke="var(--purple)" stroke-width="2.5"/>
  <circle cx="97" cy="150" r="3" fill="var(--ink)"/>
  <path d="M97 150 L200 74" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="204" y="78" class="lab">Hueso</text>
  <circle cx="160" cy="180" r="3" fill="var(--ink)"/>
  <path d="M160 180 L260 140" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="264" y="144" class="lab">Músculo</text>
  <circle cx="166" cy="282" r="3" fill="var(--ink)"/>
  <path d="M166 282 L280 240" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="284" y="244" class="lab">Tendón</text>
  <circle cx="112" cy="292" r="3" fill="var(--ink)"/>
  <path d="M112 292 L200 400" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="204" y="404" class="lab">Ligamento</text>
  <circle cx="132" cy="270" r="3" fill="var(--ink)"/>
  <path d="M132 270 L300 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="304" y="304" class="lab">Articulación</text>
  <circle cx="60" cy="180" r="3" fill="var(--ink)"/>
  <path d="M60 180 L40 420" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="44" y="424" class="lab">Nervio</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <rect x="496" y="58" width="268" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="512" y="79" class="step">Lesiones</text>
  <text x="512" y="97" class="small">Fracturas, esguinces</text>
  <rect x="496" y="120" width="268" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="512" y="141" class="step">Desgaste</text>
  <text x="512" y="159" class="small">Artrosis, columna</text>
  <rect x="496" y="182" width="268" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="512" y="203" class="step">Deformidades</text>
  <text x="512" y="221" class="small">Pie plano, escoliosis</text>
  <rect x="496" y="244" width="268" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="512" y="265" class="step">Deporte</text>
  <text x="512" y="283" class="small">Tendinitis, roturas</text>
  <text x="500" y="326" class="step">Tratamientos</text>
  <rect x="496" y="340" width="130" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="561.0" y="362.0" text-anchor="middle" class="small">Inmovilizar</text>
  <rect x="634" y="340" width="130" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="699.0" y="362.0" text-anchor="middle" class="small">Fisioterapia</text>
  <rect x="496" y="384" width="130" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="561.0" y="406.0" text-anchor="middle" class="small">Infiltraciones</text>
  <rect x="634" y="384" width="130" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="699.0" y="406.0" text-anchor="middle" class="small">Cirugía</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
