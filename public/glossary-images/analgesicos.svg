<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dónde actúan los analgésicos en el camino del dolor</title>
  <desc id="d">La señal de dolor nace en una zona lesionada e inflamada, viaja por un nervio hasta la médula espinal y sube al cerebro. Los antiinflamatorios actúan sobre todo en el lugar de la lesión; el paracetamol y los opioides, en la médula y el cerebro; los coadyuvantes, en los nervios. Abajo, un recordatorio de uso seguro.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#e3eef9; --pain:#d9534f; --nerve:#d68910; --brain:#f1dfe3; --brain-s:#d9b8c0; --skin:#e9edf2; --a1:#1f8a5b; --a2:#7b4fb0; --a3:#2b6cb0; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#1f3047; --pain:#ef7467; --nerve:#f0b04a; --brain:#3a2d33; --brain-s:#5c4650; --skin:#2a3541; --a1:#4cc38a; --a2:#b493e0; --a3:#6aa7e8; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .pill { font-size: 12px; font-weight: 700; fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="350" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="50" text-anchor="middle" class="title">El camino del dolor</text>

  <!-- lesion -->
  <rect x="50" y="230" width="160" height="70" rx="10" fill="var(--skin)" stroke="var(--line)"/>
  <circle cx="110" cy="262" r="22" fill="var(--pain)" opacity=".55"/>
  <text x="130" y="320" text-anchor="middle" class="lab">1 · Lesión e inflamación</text>
  <!-- nervio -->
  <path d="M135 260 C230 260 260 200 330 200 C390 200 400 230 450 230" fill="none" stroke="var(--nerve)" stroke-width="5"/>
  <text x="300" y="186" text-anchor="middle" class="lab">2 · Nervio</text>
  <!-- medula -->
  <rect x="450" y="150" width="36" height="170" rx="16" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="468" y="340" text-anchor="middle" class="lab">3 · Médula</text>
  <path d="M468 150 V110 C468 96 520 90 560 96" fill="none" stroke="var(--nerve)" stroke-width="5"/>
  <!-- cerebro -->
  <path d="M560 120 C540 70 600 50 650 52 C710 54 750 90 735 130 C725 158 690 165 650 160 C610 166 570 155 560 120 Z" fill="var(--brain)" stroke="var(--brain-s)" stroke-width="3"/>
  <text x="650" y="186" text-anchor="middle" class="lab">4 · Cerebro: se siente</text>

  <!-- etiquetas analgésicos -->
  <rect x="44" y="70" width="196" height="54" rx="27" fill="var(--a1)"/>
  <text x="142" y="93" text-anchor="middle" class="pill">Antiinflamatorios (AINE)</text>
  <text x="142" y="110" text-anchor="middle" class="pill">frenan las prostaglandinas</text>
  <path d="M120 124 L112 236" stroke="var(--a1)" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="250" y="228" width="160" height="54" rx="27" fill="var(--a3)"/>
  <text x="330" y="251" text-anchor="middle" class="pill">Coadyuvantes</text>
  <text x="330" y="268" text-anchor="middle" class="pill">dolor de los nervios</text>

  <rect x="520" y="210" width="236" height="54" rx="27" fill="var(--a2)"/>
  <text x="638" y="233" text-anchor="middle" class="pill">Paracetamol y opioides</text>
  <text x="638" y="250" text-anchor="middle" class="pill">actúan en médula y cerebro</text>
  <path d="M560 210 L490 200" stroke="var(--a2)" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M640 210 L645 165" stroke="var(--a2)" stroke-width="2" stroke-dasharray="4 3"/>

  <rect x="20" y="384" width="760" height="76" rx="14" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="400" y="410" text-anchor="middle" class="h">Uso seguro</text>
  <text x="400" y="432" text-anchor="middle" class="small">Siga el prospecto y a su médico o farmacéutico · Revise que no repite el mismo principio activo</text>
  <text x="400" y="450" text-anchor="middle" class="small">Consulte si el dolor dura varios días o si tiene enfermedades del estómago, hígado, riñón o corazón</text>
</svg>
