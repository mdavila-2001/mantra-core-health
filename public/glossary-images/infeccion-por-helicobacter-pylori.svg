<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Infección por Helicobacter pylori</title>
  <desc id="d">A la izquierda, un estómago y una ampliación de su pared en la que la bacteria Helicobacter pylori, con forma espiral, vive en la capa de moco y neutraliza el ácido con la ureasa. A la derecha, lo que puede causar, gastritis, úlcera y más riesgo de cáncer gástrico, y cómo se diagnostica y trata.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dónde vive la bacteria</text>
  <path d="M150 70 C150 115.0 135.0 145.0 90.0 175.0 C30.0 220.0 45.0 325.0 150 340.0 C240.0 349.0 315.0 310.0 345.0 250.0 L375.0 256.0 L375.0 220.0 C315.0 235.0 255.0 280.0 180.0 265.0 C120.0 250.0 135.0 205.0 180.0 160.0 C195.0 130.0 195.0 100.0 189.0 70 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="186" y="300" text-anchor="middle" class="step">Estómago</text>
  <rect x="220" y="316" width="160" height="104" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <circle cx="214" cy="220" r="18" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M232 226 L232 316" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M230 390 H370" fill="none" stroke="var(--organ)" stroke-width="14"/>
  <path d="M230 372 H370" fill="none" stroke="var(--nerve)" stroke-width="12" opacity=".5"/>
  <path d="M250 372 q6 -8 12 0 t12 0" fill="none" stroke="var(--ok)" stroke-width="4"/>
  <path d="M290 372 q6 -8 12 0 t12 0" fill="none" stroke="var(--ok)" stroke-width="4"/>
  <path d="M330 372 q6 -8 12 0 t12 0" fill="none" stroke="var(--ok)" stroke-width="4"/>
  <text x="300" y="340" text-anchor="middle" class="small">Capa de moco</text>
  <text x="40" y="400" class="small">Su ureasa neutraliza</text>
  <text x="40" y="418" class="small">el ácido a su alrededor</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué puede causar</text>
  <rect x="436" y="72" width="324" height="34" rx="8" fill="var(--accent)"/>
  <text x="598.0" y="93.68" text-anchor="middle" class="lab" style="fill:var(--on)">Gastritis crónica</text>
  <rect x="436" y="114" width="324" height="34" rx="8" fill="var(--purple)"/>
  <text x="598.0" y="135.68" text-anchor="middle" class="lab" style="fill:var(--on)">Úlcera de estómago o duodeno</text>
  <rect x="436" y="156" width="324" height="34" rx="8" fill="var(--warn)"/>
  <text x="598.0" y="177.68" text-anchor="middle" class="lab" style="fill:var(--on)">Más riesgo de cáncer gástrico</text>
  <text x="436" y="216" class="small muted">Muchas personas no tienen síntomas</text>
  <text x="436" y="252" class="step">Cómo se diagnostica</text>
  <text x="440" y="278" class="lab">• Prueba del aliento con urea</text>
  <text x="440" y="302" class="lab">• Antígeno en heces</text>
  <text x="440" y="326" class="lab">• Biopsia en una endoscopia</text>
  <rect x="436" y="352" width="324" height="68" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="378" class="lab">Se trata con varios antibióticos</text>
  <text x="452" y="398" class="lab">y un protector de estómago</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
