<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Microalbuminuria y daño renal precoz</title>
  <desc id="d">Glomérulo del riñón que deja escapar pequeñas cantidades de albúmina hacia la orina, recogida en un frasco. A la derecha, qué se mide, a quién se controla y por qué hay que confirmar el resultado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">El filtro del riñón</text>
<circle cx="170" cy="170" r="90" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="2"/>
<path d="M80,120 Q130,90 150,140 Q170,190 210,150 Q240,120 230,180 Q220,230 160,220 Q110,210 120,170" fill="none" stroke="var(--vessel)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170" y="290" text-anchor="middle" class="step">Glomérulo</text>
<path d="M260,170 Q320,170 330,220 L330,320" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300" cy="168" r="6" fill="var(--accent)" stroke="none" stroke-width="1"/>
<circle cx="318" cy="184" r="6" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="350" y="140" text-anchor="middle" class="small" style="fill:var(--accent)">Albúmina</text>
<text x="350" y="156" text-anchor="middle" class="small" style="fill:var(--accent)">que se escapa</text>
<path d="M300,328 L306,402 Q330,410 354,402 L360,328 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M303,358 L306,400 Q330,407 354,400 L357,358 Z" fill="var(--beam)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="296" y="312" width="68" height="16" rx="4" fill="var(--accent)" stroke-width="1"/>
<text x="40" y="330" class="lab">Sano: casi no deja</text>
<text x="40" y="348" class="lab">pasar albúmina.</text>
<text x="40" y="378" class="lab">Daño inicial: pasa en</text>
<text x="40" y="396" class="lab">pequeña cantidad.</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Qué se mide</text>
<rect x="476" y="58" width="284" height="60" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="618.0" y="84.5" text-anchor="middle" class="lab" style="fill:var(--on)">Cociente albúmina/creatinina</text>
<text x="618.0" y="100.5" text-anchor="middle" class="lab" style="fill:var(--on)">en orina (mejor la primera)</text>
<rect x="476" y="134" width="284" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="488" y="156" class="step">A quién se le controla</text>
<text x="488" y="180" class="lab">• Diabetes</text>
<text x="488" y="202" class="lab">• Hipertensión arterial</text>
<text x="488" y="224" class="lab">• Enfermedad renal crónica</text>
<text x="476" y="262" class="lab">Detecta daño renal temprano,</text>
<text x="476" y="282" class="lab">cuando aún se puede frenar.</text>
<rect x="476" y="300" width="284" height="110" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1"/>
<text x="490" y="324" class="step" style="fill:var(--warn)">Se confirma repitiendo</text>
<text x="490" y="348" class="lab">El ejercicio, la fiebre o una infección</text>
<text x="490" y="368" class="lab">urinaria pueden elevarla de forma</text>
<text x="490" y="388" class="lab">pasajera</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
