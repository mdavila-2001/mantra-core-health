<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Nutriología: valoración y soporte nutricional</title>
  <desc id="d">A la izquierda, un plato orientativo con verduras y frutas, cereales integrales y proteínas, y los elementos de la valoración nutricional: historia alimentaria, medidas del cuerpo, análisis y cribado de desnutrición. A la derecha, las tres vías de soporte nutricional: oral, enteral por sonda y parenteral por vena.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Valoración nutricional</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Formas de soporte nutricional</text>
<circle cx="200" cy="170" r="96" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
<path d="M200 170 L200.0 82.0 A88 88 0 0 1 200.0 258.0 Z" fill="var(--ok-l)" stroke="var(--panel)" stroke-width="3"/>
<text x="250.0" y="170.0" text-anchor="middle" class="small">Verduras</text>
<text x="250.0" y="185.0" text-anchor="middle" class="small">y frutas</text>
<path d="M200 170 L200.0 258.0 A88 88 0 0 1 112.0 170.0 Z" fill="var(--warn-l)" stroke="var(--panel)" stroke-width="3"/>
<text x="164.6" y="205.4" text-anchor="middle" class="small">Cereales</text>
<text x="164.6" y="220.4" text-anchor="middle" class="small">integrales</text>
<path d="M200 170 L112.0 170.0 A88 88 0 0 1 200.0 82.0 Z" fill="var(--bad-l)" stroke="var(--panel)" stroke-width="3"/>
<text x="164.6" y="134.6" text-anchor="middle" class="small">Proteínas</text>
<text x="200" y="290" text-anchor="middle" class="small" style="fill:var(--muted)">Plato orientativo</text>
<text x="40" y="326" class="small">• Historia y encuestas de alimentación</text>
<text x="40" y="350" class="small">• Peso, talla, composición corporal</text>
<text x="40" y="374" class="small">• Análisis de sangre</text>
<text x="40" y="398" class="small">• Cribado de riesgo de desnutrición</text>
<rect x="416" y="70" width="344" height="82" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="416" y="70" width="10" height="82" rx="4" fill="var(--ok)"/>
<text x="440" y="100" class="h" style="fill:var(--ok)">1 · Oral</text>
<text x="440" y="124" class="lab">dieta adaptada y suplementos</text>
<path d="M700 92 h40 l-6 34 h-28 Z" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="416" y="166" width="344" height="82" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="416" y="166" width="10" height="82" rx="4" fill="var(--warn)"/>
<text x="440" y="196" class="h" style="fill:var(--warn)">2 · Enteral</text>
<text x="440" y="220" class="lab">sonda al estómago o intestino</text>
<path d="M690 186 C720 186 730 206 720 230" fill="none" stroke="var(--warn)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="416" y="262" width="344" height="82" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="416" y="262" width="10" height="82" rx="4" fill="var(--purple)"/>
<text x="440" y="292" class="h" style="fill:var(--purple)">3 · Parenteral</text>
<text x="440" y="316" class="lab">nutrientes por una vena</text>
<rect x="706" y="276" width="26" height="40" rx="4" fill="var(--purple-l)" stroke="var(--purple)"/>
<line x1="719" y1="316" x2="719" y2="334" stroke="var(--purple)" stroke-width="2"/>
<text x="416" y="372" class="lab">Se elige la vía más natural posible.</text>
<text x="416" y="398" class="small" style="fill:var(--muted)">Trabaja con dietistas, enfermería y</text>
<text x="416" y="414" class="small" style="fill:var(--muted)">farmacia en equipos de soporte nutricional.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
