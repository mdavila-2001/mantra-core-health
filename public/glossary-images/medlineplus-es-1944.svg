<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trasplante de corazón</title>
  <desc id="d">A la izquierda, un corazón enfermo con insuficiencia avanzada que se sustituye por el corazón sano de un donante fallecido, y los pasos de la cirugía con circulación extracorpórea. A la derecha, el tratamiento inmunosupresor de por vida para evitar el rechazo, la vigilancia posterior y los signos por los que avisar al equipo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Sustituir, no reparar</text>
  <path d="M100 210 C30 160 40 100 80 104 C96 106 100 120 100 124 C100 120 104 106 120 104 C160 100 170 160 100 210 Z" fill="var(--muted)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="100" y="236" text-anchor="middle" class="small">Corazón enfermo</text>
  <text x="100" y="254" text-anchor="middle" class="small muted">insuficiencia avanzada</text>
  <path d="M300 210 C230 160 240 100 280 104 C296 106 300 120 300 124 C300 120 304 106 320 104 C360 100 370 160 300 210 Z" fill="var(--vessel)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="300" y="236" text-anchor="middle" class="small">Corazón donado</text>
  <text x="300" y="254" text-anchor="middle" class="small muted">de un donante fallecido</text>
  <line x1="160" y1="150" x2="236" y2="150" stroke="var(--ok)" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="40" y="286" width="340" height="136" rx="10" fill="var(--tissue)"/>
  <text x="56" y="310" class="step">En el quirófano</text>
  <text x="60" y="336" class="small">• Máquina de circulación extracorpórea</text>
  <text x="60" y="360" class="small">• Se retira el corazón enfermo</text>
  <text x="60" y="384" class="small">• Se sutura el corazón nuevo</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">De por vida</text>
  <rect x="436" y="70" width="324" height="40" rx="8" fill="var(--accent)"/>
  <text x="598.0" y="94.68" text-anchor="middle" class="lab" style="fill:var(--on)">Inmunosupresores todos los días</text>
  <text x="598" y="132" text-anchor="middle" class="small muted">Evitan que el cuerpo rechace el órgano</text>
  <text x="436" y="176" class="step">Vigilancia</text>
  <text x="440" y="202" class="lab">• Biopsias y controles de rechazo</text>
  <text x="440" y="226" class="lab">• Prevención de infecciones</text>
  <text x="440" y="250" class="lab">• Rehabilitación cardíaca</text>
  <rect x="436" y="290" width="324" height="130" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="314" class="step" style="fill:var(--warn)">Avisar al equipo si hay</text>
  <text x="456" y="340" class="small">• Fiebre o signos de infección</text>
  <text x="456" y="362" class="small">• Falta de aire o hinchazón</text>
  <text x="456" y="384" class="small">• Cansancio nuevo o palpitaciones</text>
  <text x="456" y="406" class="small">• Olvido de la medicación</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
