<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">De la presión alta en el embarazo a la preeclampsia</title>
  <desc id="d">Esquema en escalera con cuatro peldaños. Hipertensión gestacional: presión alta que aparece después de las 20 semanas, casi siempre sin síntomas. Preeclampsia: presión alta nueva después de las 20 semanas con signos de daño de órganos, como proteína en la orina. Síndrome HELLP: afecta hígado y sangre. Eclampsia: convulsiones o coma. A la derecha, signos de alarma que obligan a consultar de inmediato: dolor de cabeza que no se va, visión borrosa o manchas, dolor en la parte superior derecha del abdomen, falta de aire, hinchazón de cara y manos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#1f8a5b; --a-l:#d7f0e4; --b:#b7791f; --b-l:#f7e4bf; --c:#c0392b; --c-l:#f6d5cf; --d:#8e2a20; --d-l:#eab7ae; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#4cc38a; --a-l:#1f4033; --b:#e0b25a; --b-l:#4a3b1f; --c:#ef7467; --c-l:#4a2a27; --d:#ff9d90; --d-l:#5e312c; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Presión alta en el embarazo: de menos a más grave</text>

  <rect x="40" y="76" width="470" height="68" rx="8" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="56" y="100" class="hd" style="fill:var(--a)">Hipertensión gestacional</text>
  <text x="56" y="120" class="small">Presión alta que aparece después de las 20 semanas,</text>
  <text x="56" y="136" class="small">casi siempre sin otros síntomas</text>

  <rect x="60" y="154" width="450" height="68" rx="8" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="76" y="178" class="hd" style="fill:var(--b)">Preeclampsia</text>
  <text x="76" y="198" class="small">Presión alta nueva tras las 20 semanas, con signos de daño</text>
  <text x="76" y="214" class="small">de órganos (por ejemplo, proteína en la orina). Puede ser grave</text>

  <rect x="80" y="232" width="430" height="68" rx="8" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="96" y="256" class="hd" style="fill:var(--c)">Síndrome HELLP</text>
  <text x="96" y="276" class="small">Daño del hígado y de las células de la sangre</text>
  <text x="96" y="292" class="small">Raro, pero muy grave</text>

  <rect x="100" y="310" width="410" height="68" rx="8" fill="var(--d-l)" stroke="var(--d)" stroke-width="2"/>
  <text x="116" y="334" class="hd" style="fill:var(--d)">Eclampsia</text>
  <text x="116" y="354" class="small">Convulsiones o coma. Emergencia que pone en peligro la vida</text>
  <text x="116" y="370" class="small">Puede aparecer también después del parto</text>

  <rect x="545" y="86" width="215" height="304" rx="10" fill="var(--panel)" stroke="var(--c)" stroke-width="2"/>
  <text x="652" y="112" text-anchor="middle" class="hd" style="fill:var(--c)">Consulte de inmediato si</text>
  <text x="652" y="146" text-anchor="middle" class="lab">Dolor de cabeza que no se va</text>
  <text x="652" y="174" text-anchor="middle" class="lab">Visión borrosa o manchas</text>
  <text x="652" y="202" text-anchor="middle" class="lab">Dolor arriba a la derecha</text>
  <text x="652" y="220" text-anchor="middle" class="lab">del abdomen</text>
  <text x="652" y="248" text-anchor="middle" class="lab">Falta de aire</text>
  <text x="652" y="276" text-anchor="middle" class="lab">Hinchazón de cara y manos</text>
  <text x="652" y="304" text-anchor="middle" class="lab">Convulsiones</text>
  <text x="652" y="350" text-anchor="middle" class="small muted">La presión alta suele no dar</text>
  <text x="652" y="366" text-anchor="middle" class="small muted">síntomas: se mide en cada control</text>
</svg>
