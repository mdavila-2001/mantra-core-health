<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía plástica</title>
  <desc id="d">A la izquierda, la escalera reconstructiva, con cinco peldaños de menor a mayor complejidad: cierre directo, injerto de piel, colgajo local, colgajo a distancia y microcirugía. A la derecha, las dos vertientes de la especialidad: la reconstructiva, que trata quemaduras, secuelas de cáncer, malformaciones y heridas, y la estética.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">La escalera reconstructiva</text>
  <rect x="40" y="380" width="250" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="54" y="402" class="step">Cierre directo</text>
  <text x="54" y="420" class="small">Sutura de la herida</text>
  <rect x="70" y="314" width="250" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="84" y="336" class="step">Injerto de piel</text>
  <text x="84" y="354" class="small">Piel de otra zona</text>
  <rect x="100" y="248" width="250" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="114" y="270" class="step">Colgajo local</text>
  <text x="114" y="288" class="small">Tejido vecino con su riego</text>
  <rect x="130" y="182" width="250" height="54" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="144" y="204" class="step">Colgajo a distancia</text>
  <text x="144" y="222" class="small">Tejido de otra región</text>
  <rect x="160" y="116" width="250" height="54" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="174" y="138" class="step">Microcirugía</text>
  <text x="174" y="156" class="small">Une vasos de milímetros</text>
  <path d="M400 420 V80" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="392" y="100" text-anchor="end" class="small">Más</text>
  <text x="392" y="116" text-anchor="end" class="small">complejo</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Dos vertientes</text>
  <rect x="476" y="60" width="288" height="170" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="620" y="86" text-anchor="middle" class="big">Reconstructiva</text>
  <text x="492" y="114" class="small">• Quemaduras</text>
  <text x="492" y="136" class="small">• Tras cáncer de mama o piel</text>
  <text x="492" y="158" class="small">• Malformaciones congénitas</text>
  <text x="492" y="180" class="small">• Heridas y traumatismos</text>
  <text x="492" y="202" class="small">• Cirugía de la mano</text>
  <rect x="476" y="246" width="288" height="130" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="620" y="272" text-anchor="middle" class="big">Estética</text>
  <text x="492" y="300" class="small">• Mejorar el aspecto</text>
  <text x="492" y="322" class="small">• Rejuvenecimiento</text>
  <text x="492" y="344" class="small">• Contorno corporal</text>
  <text x="620" y="404" text-anchor="middle" class="small muted">Busca restaurar forma y función</text>
  <text x="620" y="422" text-anchor="middle" class="small muted">trasladando y moldeando tejidos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
