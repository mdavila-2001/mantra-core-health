<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía ortopédica y traumatología</title>
  <desc id="d">Tres recuadros con intervenciones frecuentes de la cirugía ortopédica: osteosíntesis de una fractura con placa y tornillos, prótesis que sustituye las superficies de una articulación como la rodilla, y artroscopia con una cámara y pinzas finas dentro de la articulación. Debajo, las estructuras y enfermedades que trata y la importancia de la rehabilitación.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="320" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Tres intervenciones frecuentes</text>
  <rect x="40" y="62" width="230" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="135" y="80" width="40" height="200" rx="16" fill="var(--bone)" stroke="var(--line)"/>
  <path d="M132 176 L178 168" stroke="var(--bad)" stroke-width="3"/>
  <rect x="172" y="110" width="12" height="130" rx="4" fill="var(--accent)"/>
  <path d="M140 124 H184" stroke="var(--muted)" stroke-width="4"/>
  <path d="M140 148 H184" stroke="var(--muted)" stroke-width="4"/>
  <path d="M140 196 H184" stroke="var(--muted)" stroke-width="4"/>
  <path d="M140 220 H184" stroke="var(--muted)" stroke-width="4"/>
  <text x="155" y="294" text-anchor="middle" class="step">Osteosíntesis</text>
  <text x="155" y="312" text-anchor="middle" class="small">placa y tornillos</text>
  <rect x="285" y="62" width="230" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="380" y="76" width="40" height="90" rx="14" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="380" y="188" width="40" height="94" rx="14" fill="var(--bone)" stroke="var(--line)"/>
  <path d="M366 150 Q400 186 434 150 L434 166 Q400 196 366 166 Z" fill="var(--accent)"/>
  <rect x="368" y="176" width="64" height="14" rx="4" fill="var(--accent)"/><rect x="372" y="190" width="56" height="8" fill="var(--ok)"/>
  <text x="400" y="294" text-anchor="middle" class="step">Prótesis</text>
  <text x="400" y="312" text-anchor="middle" class="small">rodilla o cadera</text>
  <rect x="530" y="62" width="230" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <ellipse cx="645" cy="180" rx="70" ry="60" fill="var(--skin)" stroke="var(--line)"/>
  <path d="M560 110 L630 170" stroke="var(--ink)" stroke-width="5"/>
  <circle cx="556" cy="106" r="8" fill="var(--accent)"/>
  <path d="M730 110 L664 168" stroke="var(--muted)" stroke-width="4"/>
  <text x="645" y="294" text-anchor="middle" class="step">Artroscopia</text>
  <text x="645" y="312" text-anchor="middle" class="small">cámara y pinzas finas</text>
  <rect x="20" y="354" width="760" height="96" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="40" y="388" class="lab">Trata huesos, articulaciones, ligamentos, tendones y músculos</text>
  <text x="40" y="414" class="small muted">Antes y después de operar: fisioterapia y rehabilitación</text>
  <text x="760" y="388" text-anchor="end" class="small">Fracturas, artrosis, deformidades</text>
  <text x="760" y="414" text-anchor="end" class="small">tumores óseos, lesiones deportivas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
