<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Psiquiatría forense</title>
  <desc id="d">Arriba, un puente entre la salud mental, representada por una cabeza, y el derecho, representado por una balanza, que une el peritaje y el tratamiento. Abajo, las tareas periciales y asistenciales de la especialidad.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Puente entre la salud mental y la ley</text>
  <circle cx="160" cy="140" r="60" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <path d="M134 120 C134 96 186 96 186 120 C196 126 196 150 186 156 C180 170 140 170 134 156 C124 150 124 126 134 120 Z" fill="var(--panel)" stroke="var(--violet)" stroke-width="1.5"/>
  <text x="160" y="222" text-anchor="middle" class="step" style="fill:var(--violet)">Salud mental</text>
  <line x1="640" y1="90" x2="640" y2="180" stroke="var(--ink)" stroke-width="3"/>
  <line x1="590" y1="100" x2="690" y2="100" stroke="var(--ink)" stroke-width="3"/>
  <path d="M590 100 L570 140 H610 Z M690 100 L670 140 H710 Z" fill="var(--accent-l)" stroke="var(--ink)" stroke-width="1.5"/>
  <rect x="616" y="180" width="48" height="10" rx="0" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <text x="640" y="222" text-anchor="middle" class="step" style="fill:var(--accent)">Derecho</text>
  <path d="M240 140 H560" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="400" y="124" text-anchor="middle" class="lab">Peritaje y tratamiento</text>
  <text x="400" y="162" text-anchor="middle" class="small" style="fill:var(--muted)">El perito responde a una pregunta</text>
  <text x="400" y="180" text-anchor="middle" class="small" style="fill:var(--muted)">concreta de un juez o tribunal</text>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="286" text-anchor="middle" class="title">Tarea pericial</text>
  <text x="40" y="300" class="small">• Capacidad para decidir o testar</text>
  <text x="40" y="326" class="small">• Responsabilidad penal</text>
  <text x="40" y="352" class="small">• Incapacidad laboral o daño psíquico</text>
  <text x="40" y="378" class="small">• Riesgo de violencia</text>
  <rect x="410" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="286" text-anchor="middle" class="title">Tarea asistencial</text>
  <text x="430" y="300" class="small">• Atención en prisiones</text>
  <text x="430" y="326" class="small">• Unidades psiquiátricas forenses</text>
  <text x="430" y="352" class="small">• Tratamientos ordenados por un juez</text>
  <text x="430" y="378" class="small">• Ética: imparcialidad y confidencialidad</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
