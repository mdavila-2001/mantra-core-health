<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo se regula la presión arterial</title>
  <desc id="d">Diagrama de flujo. La presión arterial es el producto del gasto cardíaco por la resistencia vascular periférica. El riñón regula el volumen de sangre mediante el sodio, el sistema renina-angiotensina-aldosterona aumenta tanto el volumen como la contracción de los vasos, y el sistema nervioso simpático acelera el corazón y contrae las arterias. Cuando estos sistemas se desajustan, la presión sube.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#c2cddb; --ink:#1c2733; --muted:#5a6878; --a:#dbe8f7; --a-d:#2a6db0; --b:#fbe3dd; --b-d:#c0503f; --c:#e3f1e6; --c-d:#2f8a58; --d:#f3ead2; --d-d:#a6791c; --bad:#c0392b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#425364; --ink:#e8eef5; --muted:#9fb0c1; --a:#1f3550; --a-d:#7db4ec; --b:#4a2a26; --b-d:#f0958a; --c:#1f3d2d; --c-d:#6fd09b; --d:#463a1d; --d-d:#e6bb62; --bad:#ef7467; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 14px; }
    .xs { font-size: 13px; }
    .arrow { stroke: var(--muted); stroke-width: 2.5; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="30" text-anchor="middle" class="title">¿De qué depende la presión arterial?</text>

  <!-- ecuación central -->
  <rect x="210" y="46" width="380" height="50" rx="12" fill="var(--panel)" stroke="var(--bad)" stroke-width="2.5"/>
  <text x="400" y="68" text-anchor="middle" class="h">Presión arterial =</text>
  <text x="400" y="87" text-anchor="middle" class="s">gasto cardíaco × resistencia vascular</text>

  <!-- determinantes -->
  <rect x="60" y="130" width="320" height="86" rx="12" fill="var(--a)" stroke="var(--a-d)" stroke-width="2"/>
  <text x="220" y="156" text-anchor="middle" class="h">Gasto cardíaco</text>
  <text x="220" y="177" text-anchor="middle" class="s">frecuencia cardíaca × volumen por latido</text>
  <text x="220" y="197" text-anchor="middle" class="xs muted">el volumen depende del sodio y el agua del cuerpo</text>

  <rect x="420" y="130" width="320" height="86" rx="12" fill="var(--b)" stroke="var(--b-d)" stroke-width="2"/>
  <text x="580" y="156" text-anchor="middle" class="h">Resistencia vascular</text>
  <text x="580" y="177" text-anchor="middle" class="s">contracción de las arteriolas</text>
  <text x="580" y="197" text-anchor="middle" class="xs muted">y rigidez o engrosamiento de las arterias</text>

  <path class="arrow" d="M250 128 L330 100"/>
  <path class="arrow" d="M550 128 L470 100"/>

  <!-- reguladores -->
  <rect x="40" y="268" width="224" height="150" rx="12" fill="var(--c)" stroke="var(--c-d)" stroke-width="2"/>
  <text x="152" y="294" text-anchor="middle" class="h">Riñón</text>
  <text x="152" y="316" text-anchor="middle" class="s">Elimina sodio y agua</text>
  <text x="152" y="336" text-anchor="middle" class="s">cuando la presión sube</text>
  <text x="152" y="364" text-anchor="middle" class="xs muted">Si no lo logra con facilidad,</text>
  <text x="152" y="382" text-anchor="middle" class="xs muted">retiene volumen y la presión</text>
  <text x="152" y="400" text-anchor="middle" class="xs muted">necesaria para eliminarlo sube</text>

  <rect x="288" y="268" width="224" height="150" rx="12" fill="var(--d)" stroke="var(--d-d)" stroke-width="2"/>
  <text x="400" y="294" text-anchor="middle" class="h">Renina-angiotensina</text>
  <text x="400" y="312" text-anchor="middle" class="h">aldosterona</text>
  <text x="400" y="338" text-anchor="middle" class="s">Renina → angiotensina II</text>
  <text x="400" y="358" text-anchor="middle" class="s">contrae los vasos</text>
  <text x="400" y="378" text-anchor="middle" class="s">y retiene sodio y agua</text>
  <text x="400" y="403" text-anchor="middle" class="xs muted">IECA, ARA-II y espironolactona</text>

  <rect x="536" y="268" width="224" height="150" rx="12" fill="var(--a)" stroke="var(--a-d)" stroke-width="2"/>
  <text x="648" y="294" text-anchor="middle" class="h">Sistema simpático</text>
  <text x="648" y="316" text-anchor="middle" class="s">Acelera el corazón</text>
  <text x="648" y="336" text-anchor="middle" class="s">y contrae las arterias</text>
  <text x="648" y="364" text-anchor="middle" class="xs muted">Más activo con obesidad,</text>
  <text x="648" y="382" text-anchor="middle" class="xs muted">apnea del sueño</text>
  <text x="648" y="400" text-anchor="middle" class="xs muted">y estrés sostenido</text>

  <!-- flechas reguladores hacia determinantes -->
  <path class="arrow" d="M152 266 L190 220"/>
  <path class="arrow" d="M360 266 L270 220"/>
  <path class="arrow" d="M440 266 L540 220"/>
  <path class="arrow" d="M690 266 L630 220"/>
  <path class="arrow" d="M572 266 L330 220" opacity="0.0"/>

  <text x="400" y="446" text-anchor="middle" class="s">Sal en exceso, sobrepeso, edad y herencia desplazan el equilibrio hacia una presión mayor.</text>
  <text x="400" y="468" text-anchor="middle" class="xs muted">Esquema simplificado. Ilustración original de AloVida.</text>
</svg>
