<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina general</title>
  <desc id="d">Flujo de atención: una persona con un problema de salud nuevo acude al médico general, que resuelve la mayoría de las consultas, hace el seguimiento a lo largo del tiempo y deriva al especialista cuando hace falta. Debajo, su enfoque en la persona entera, la prevención y las enfermedades crónicas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Medicina general: la puerta de entrada</text>
  <circle cx="100" cy="135.6" r="14.399999999999999" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <path d="M74.8 157.2 Q100 150.0 125.2 157.2 L128.8 222.0 L118.0 225.6 L118.0 300.0 L103.6 300.0 L100 234.0 L96.4 300.0 L82.0 300.0 L82.0 225.6 L71.2 222.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M74.8 158.4 L60.4 222.0 L67.6 223.2 L77.2 180.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M125.2 158.4 L139.6 222.0 L132.4 223.2 L122.8 180.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="100" y="320" text-anchor="middle" class="small">Problema de salud</text>
  <text x="100" y="336" text-anchor="middle" class="small">nuevo</text>
  <line x1="150" y1="210" x2="250" y2="210" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="330" cy="210" r="74" fill="var(--accent)"/>
  <text x="330" y="206" text-anchor="middle" class="step" style="fill:var(--on)">Médico</text>
  <text x="330" y="226" text-anchor="middle" class="step" style="fill:var(--on)">general</text>
  <line x1="406" y1="170" x2="520" y2="110" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="406" y1="210" x2="520" y2="210" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="406" y1="250" x2="520" y2="310" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="524" y="86" width="230" height="48" rx="8" fill="var(--ok)"/>
  <text x="639.0" y="115.04" text-anchor="middle" class="step" style="fill:var(--on)">Resuelve la mayoría</text>
  <rect x="524" y="186" width="230" height="48" rx="8" fill="var(--accent-l)"/>
  <text x="639.0" y="214.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Seguimiento en el tiempo</text>
  <rect x="524" y="286" width="230" height="48" rx="8" fill="var(--purple)"/>
  <text x="639.0" y="314.68" text-anchor="middle" class="lab" style="fill:var(--on)">Deriva al especialista</text>
  <rect x="40" y="370" width="720" height="56" rx="10" fill="var(--tissue)"/>
  <text x="400" y="394" text-anchor="middle" class="lab">Atiende a la persona entera, de cualquier edad, y coordina con el hospital</text>
  <text x="400" y="414" text-anchor="middle" class="small muted">Prevención, vacunas, enfermedades crónicas, consultas frecuentes</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
