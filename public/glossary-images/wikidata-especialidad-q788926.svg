<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Infectología</title>
  <desc id="d">A la izquierda, cuatro recuadros con los agentes que estudia la infectología: bacterias, virus, hongos y parásitos. A la derecha, cómo trabaja el infectólogo, con cultivos, pruebas moleculares y elección del antimicrobiano, la importancia del uso prudente de antibióticos frente a la resistencia y la prevención con vacunas e higiene.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Agentes que estudia</text>
  <rect x="40" y="66" width="170" height="150" rx="12" fill="var(--ok-l)"/>
  <rect x="86" y="114" width="28" height="12" rx="6" fill="var(--ok)" transform="rotate(20 100 120)"/>
  <rect x="126" y="104" width="28" height="12" rx="6" fill="var(--ok)" transform="rotate(-30 140 110)"/>
  <rect x="106" y="144" width="28" height="12" rx="6" fill="var(--ok)" transform="rotate(60 120 150)"/>
  <text x="125" y="196" text-anchor="middle" class="step" style="fill:var(--ok)">Bacterias</text>
  <rect x="230" y="66" width="170" height="150" rx="12" fill="var(--warn-l)"/>
  <line x1="300.0" y1="120.0" x2="305.0" y2="120.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="297.0710678118655" y1="127.07106781186548" x2="300.6066017177982" y2="130.6066017177982" stroke="var(--warn)" stroke-width="2"/>
  <line x1="290.0" y1="130.0" x2="290.0" y2="135.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="282.9289321881345" y1="127.07106781186548" x2="279.3933982822018" y2="130.6066017177982" stroke="var(--warn)" stroke-width="2"/>
  <line x1="280.0" y1="120.0" x2="275.0" y2="120.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="282.9289321881345" y1="112.92893218813452" x2="279.39339828220176" y2="109.39339828220179" stroke="var(--warn)" stroke-width="2"/>
  <line x1="290.0" y1="110.0" x2="290.0" y2="105.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="297.0710678118655" y1="112.92893218813452" x2="300.6066017177982" y2="109.39339828220179" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="290" cy="120" r="10" fill="var(--warn)"/>
  <line x1="352.0" y1="140.0" x2="357.0" y2="140.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="348.4852813742386" y1="148.48528137423858" x2="352.0208152801713" y2="152.02081528017132" stroke="var(--warn)" stroke-width="2"/>
  <line x1="340.0" y1="152.0" x2="340.0" y2="157.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="331.5147186257614" y1="148.48528137423858" x2="327.9791847198287" y2="152.02081528017132" stroke="var(--warn)" stroke-width="2"/>
  <line x1="328.0" y1="140.0" x2="323.0" y2="140.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="331.5147186257614" y1="131.51471862576142" x2="327.9791847198287" y2="127.9791847198287" stroke="var(--warn)" stroke-width="2"/>
  <line x1="340.0" y1="128.0" x2="340.0" y2="123.0" stroke="var(--warn)" stroke-width="2"/>
  <line x1="348.4852813742386" y1="131.51471862576142" x2="352.0208152801713" y2="127.9791847198287" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="340" cy="140" r="12" fill="var(--warn)"/>
  <text x="315" y="196" text-anchor="middle" class="step" style="fill:var(--warn)">Virus</text>
  <rect x="40" y="230" width="170" height="150" rx="12" fill="var(--accent-l)"/>
  <circle cx="110" cy="290" r="14" fill="var(--accent)"/>
  <circle cx="130" cy="278" r="10" fill="var(--accent)"/>
  <path d="M124 300 V330 M110 304 L96 330" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <text x="125" y="360" text-anchor="middle" class="step" style="fill:var(--accent)">Hongos</text>
  <rect x="230" y="230" width="170" height="150" rx="12" fill="var(--tissue)"/>
  <path d="M280 300 C300 270 330 330 350 290" fill="none" stroke="var(--purple)" stroke-width="6" stroke-linecap="round"/>
  <text x="315" y="360" text-anchor="middle" class="step" style="fill:var(--purple)">Parásitos</text>
  <text x="220" y="412" text-anchor="middle" class="small muted">Una infección puede afectar a cualquier órgano</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Cómo trabaja</text>
  <text x="456" y="80" class="lab">• Cultivos y antibiograma</text>
  <text x="456" y="106" class="lab">• Pruebas moleculares (PCR)</text>
  <text x="456" y="132" class="lab">• Elige el antimicrobiano</text>
  <text x="456" y="158" class="lab">• Infecciones en hospital</text>
  <text x="456" y="184" class="lab">• VIH, tuberculosis, viajeros</text>
  <rect x="456" y="226" width="304" height="90" rx="10" fill="var(--warn-l)"/>
  <text x="472" y="252" class="step" style="fill:var(--warn)">Uso prudente de antibióticos</text>
  <text x="472" y="274" class="lab">para frenar la resistencia</text>
  <text x="472" y="294" class="lab">de los microbios</text>
  <rect x="456" y="332" width="304" height="88" rx="10" fill="var(--ok-l)"/>
  <text x="472" y="358" class="step" style="fill:var(--ok)">Prevención</text>
  <text x="472" y="380" class="lab">Vacunas, higiene de manos</text>
  <text x="472" y="400" class="lab">y control de brotes</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
