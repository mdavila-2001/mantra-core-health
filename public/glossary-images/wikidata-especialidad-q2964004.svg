<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía torácica</title>
  <desc id="d">A la izquierda, un tórax con las costillas, la tráquea, los bronquios, los dos pulmones, un nódulo pulmonar, la pleura y el mediastino. A la derecha, las enfermedades que trata, las vías de acceso abierta y mínimamente invasiva, y la preparación previa.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Órganos del tórax</text>
  <path d="M70 400 L70 140 C70 80 140 60 220 60 C300 60 370 80 370 140 L370 400 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M80 120 C140 100 300 100 360 120" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <path d="M80 160 C140 140 300 140 360 160" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <path d="M80 200 C140 180 300 180 360 200" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <path d="M80 240 C140 220 300 220 360 240" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <path d="M80 280 C140 260 300 260 360 280" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <path d="M80 320 C140 300 300 300 360 320" fill="none" stroke="var(--bone)" stroke-width="4" opacity=".6"/>
  <rect x="210" y="70" width="20" height="90" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M220 160 L170 190 M220 160 L270 190" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 180 C140 160 100 220 100 300 C100 360 140 380 190 370 C200 320 200 240 200 180 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5" opacity=".85"/>
  <path d="M240 180 C300 160 340 220 340 300 C340 360 300 380 250 370 C240 320 240 240 240 180 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5" opacity=".85"/>
  <path d="M96 300 C96 370 140 390 190 380" fill="none" stroke="var(--violet)" stroke-width="3"/>
  <circle cx="300" cy="250" r="12" fill="var(--warn)" stroke="var(--warn)" stroke-width="1"/>
  <text x="260" y="88" class="small" style="fill:var(--accent)">Tráquea</text>
  <text x="150" y="270" text-anchor="middle" class="small">Pulmón</text>
  <text x="300" y="300" text-anchor="middle" class="small" style="fill:var(--warn)">Nódulo</text>
  <text x="110" y="420" class="small" style="fill:var(--violet)">Pleura</text>
  <text x="220" y="420" class="small" style="fill:var(--muted)">Mediastino al centro</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué trata y cómo</text>
  <text x="476" y="80" class="small">• Cáncer de pulmón</text>
  <text x="476" y="102" class="small">• Neumotórax y derrame pleural</text>
  <text x="476" y="124" class="small">• Tumores del mediastino</text>
  <text x="476" y="146" class="small">• Traumatismos torácicos</text>
  <text x="476" y="168" class="small">• Problemas de tráquea y pared</text>
  <text x="476" y="208" class="step">Vías de acceso</text>
  <rect x="476" y="222" width="136" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="544.0" y="246.5" text-anchor="middle" class="small">Toracotomía</text>
  <text x="544.0" y="263.5" text-anchor="middle" class="small">abierta</text>
  <rect x="624" y="222" width="136" height="56" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="692.0" y="246.5" text-anchor="middle" class="small">Videotoracoscopia</text>
  <text x="692.0" y="263.5" text-anchor="middle" class="small">o robótica</text>
  <rect x="476" y="300" width="284" height="122" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="492" y="326" class="step">Antes de operar</text>
  <text x="500" y="350" class="small">• Pruebas de función pulmonar</text>
  <text x="500" y="372" class="small">• Dejar de fumar</text>
  <text x="500" y="394" class="small">• Fisioterapia respiratoria</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
