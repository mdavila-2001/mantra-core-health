<circle cx="62.8" cy="194.0" r="30" fill="var(--hl2)" opacity=".18" stroke="var(--hl2)" stroke-width="2" stroke-dasharray="5 4"/></g>
  <text x="208" y="352" text-anchor="middle" class="key" style="fill:var(--hl2)">Hidroximetilo: no es sustrato de la COMT</text>
  <text x="208" y="376" text-anchor="middle" class="key" style="fill:var(--hl)">tert-butilo voluminoso: selectividad β2</text>
  <text x="596" y="352" text-anchor="middle" class="key" style="fill:var(--hl2)">Catecol: la COMT lo inactiva con rapidez</text>
  <text x="596" y="376" text-anchor="middle" class="key" style="fill:var(--hl)">Isopropilo: activa también receptores β1</text>
  <text x="400" y="430" text-anchor="middle" class="sub muted">Fórmulas simplificadas; se omiten los hidrógenos del esqueleto.</text>
  <text x="400" y="456" text-anchor="middle" class="sub muted">Esquema ilustrativo. Ilustración original de AloVida.</text>
</svg>
