<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Salbutamol frente a isoprenalina: dos cambios en la estructura</title>
  <desc id="d">Fórmulas estructurales de salbutamol e isoprenalina. En el salbutamol el grupo hidroxilo del anillo está sustituido por un hidroximetilo, y el sustituyente del nitrógeno es un tert-butilo voluminoso en lugar de un isopropilo. Esos dos cambios dan resistencia a la enzima COMT y selectividad por el receptor beta 2.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --hl:#2a6fb0; --hl2:#c26a1b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --hl:#6fb0ee; --hl2:#f0a15a; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 14px; }
    .atom { font-size: 17px; font-weight: 600; }
    .small { font-size: 13px; }
    .hot { fill: var(--hl); }
    .key { font-size: 14px; font-weight: 600; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="16" y="16" width="384" height="380" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="408" y="16" width="376" height="380" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="208" y="50" text-anchor="middle" class="title">Salbutamol</text>
  <text x="208" y="72" text-anchor="middle" class="sub muted">Agonista β2 selectivo, de acción corta</text>
  <text x="596" y="50" text-anchor="middle" class="title">Isoprenalina</text>
  <text x="596" y="72" text-anchor="middle" class="sub muted">Agonista β no selectivo (catecolamina)</text>
<g transform="translate(2,6) scale(.9)"><polygon points="150.0,202.0 191.6,226.0 191.6,274.0 150.0,298.0 108.4,274.0 108.4,226.0" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
