<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Radiografía de columna cervical</title>
  <desc id="d">A la izquierda, perfil del cuello en proyección lateral con las siete vértebras cervicales, de C1 a C7, bajo el cráneo. A la derecha, el tubo de rayos X, la persona y el detector; las proyecciones habituales lateral, frontal y con la boca abierta, y lo que puede mostrar, como fracturas, artrosis o cambios en la alineación.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Proyección lateral del cuello</text>
  <path d="M150 70 C120 80 110 150 130 190 C140 220 150 300 140 400 L330 400 C320 330 300 280 310 220 C330 160 300 80 250 70 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <rect x="194" y="150" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M234 162 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="184.5" y="167" text-anchor="end" class="small">C1</text>
  <rect x="202" y="184" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M242 196 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="192.0" y="201" text-anchor="end" class="small">C2</text>
  <rect x="206" y="218" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M246 230 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="196.5" y="235" text-anchor="end" class="small">C3</text>
  <rect x="208" y="252" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M248 264 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="198.0" y="269" text-anchor="end" class="small">C4</text>
  <rect x="206" y="286" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M246 298 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="196.5" y="303" text-anchor="end" class="small">C5</text>
  <rect x="202" y="320" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M242 332 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="192.0" y="337" text-anchor="end" class="small">C6</text>
  <rect x="194" y="354" width="40" height="24" rx="5" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M234 366 l26 4" stroke="var(--bone)" stroke-width="8" stroke-linecap="round"/>
  <text x="184.5" y="371" text-anchor="end" class="small">C7</text>
  <path d="M140 90 C170 70 250 70 280 110 C300 140 280 150 240 146 L170 146 Z" fill="var(--bone)" opacity=".7"/>
  <text x="210" y="124" text-anchor="middle" class="small">Cráneo</text>
  <text x="230" y="428" text-anchor="middle" class="small muted">Las siete vértebras cervicales</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Cómo se hace</text>
  <rect x="490" y="80" width="70" height="40" rx="8" fill="var(--accent)"/>
  <text x="525" y="105" text-anchor="middle" class="small" style="fill:var(--on)">Tubo</text>
  <polygon points="560,88 560,112 700,70 700,130" fill="var(--beam)" opacity=".45"/>
  <circle cx="630" cy="100" r="16" fill="var(--skin)" stroke="var(--line)"/>
  <rect x="702" y="60" width="14" height="80" rx="4" fill="var(--accent)"/>
  <text x="710" y="158" text-anchor="middle" class="small">Detector</text>
  <text x="480" y="192" class="step">Proyecciones habituales</text>
  <rect x="480" y="204" width="90" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="525.0" y="226.0" text-anchor="middle" class="small">Lateral</text>
  <rect x="576" y="204" width="90" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="621.0" y="226.0" text-anchor="middle" class="small">Frontal</text>
  <rect x="672" y="204" width="90" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="717.0" y="226.0" text-anchor="middle" class="small">Boca abierta</text>
  <text x="480" y="274" class="step">Qué puede mostrar</text>
  <text x="480" y="300" class="small">• Fracturas tras un golpe</text>
  <text x="480" y="324" class="small">• Artrosis y discos estrechos</text>
  <text x="480" y="348" class="small">• Alineación de la columna</text>
  <text x="480" y="372" class="small">• Rectificación de la curva</text>
  <text x="620" y="416" text-anchor="middle" class="small muted">Los nervios y discos se ven</text>
  <text x="620" y="434" text-anchor="middle" class="small muted">mejor con resonancia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
