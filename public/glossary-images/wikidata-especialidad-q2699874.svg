<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Neuropsiquiatría: entre neurología y psiquiatría</title>
  <desc id="d">Dos círculos superpuestos: a la izquierda la neurología, con ictus, epilepsia, esclerosis múltiple y migraña; a la derecha la psiquiatría, con depresión, psicosis, ansiedad y trastornos del ánimo; y en la zona común la neuropsiquiatría, con demencias, Parkinson con depresión, traumatismo craneal, epilepsia con psicosis y catatonia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Neuropsiquiatría: la frontera entre cerebro y conducta</text>
<circle cx="325" cy="222" r="150" fill="var(--accent)" opacity=".16" stroke="var(--accent)" stroke-width="2"/>
<circle cx="475" cy="222" r="150" fill="var(--purple)" opacity=".16" stroke="var(--purple)" stroke-width="2"/>
<text x="250" y="120" text-anchor="middle" class="h" style="fill:var(--accent)">Neurología</text>
<text x="195" y="156" class="small">• Ictus</text>
<text x="195" y="180" class="small">• Epilepsia</text>
<text x="195" y="204" class="small">• Esclerosis</text>
<text x="206" y="228" class="small">múltiple</text>
<text x="195" y="252" class="small">• Migraña</text>
<text x="550" y="120" text-anchor="middle" class="h" style="fill:var(--purple)">Psiquiatría</text>
<text x="500" y="156" class="small">• Depresión</text>
<text x="500" y="180" class="small">• Psicosis</text>
<text x="500" y="204" class="small">• Ansiedad</text>
<text x="500" y="228" class="small">• Trastornos</text>
<text x="511" y="252" class="small">del ánimo</text>
<text x="400" y="120" text-anchor="middle" class="h">Zona común</text>
<text x="352" y="156" class="small">• Demencias</text>
<text x="352" y="180" class="small">• Parkinson con</text>
<text x="363" y="204" class="small">depresión</text>
<text x="352" y="228" class="small">• Traumatismo</text>
<text x="363" y="252" class="small">craneal</text>
<text x="352" y="276" class="small">• Epilepsia con</text>
<text x="363" y="300" class="small">psicosis</text>
<text x="352" y="324" class="small">• Catatonia</text>
<rect x="40" y="384" width="720" height="44" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="400" y="411" text-anchor="middle" class="lab">Idea central: la mente es el resultado del funcionamiento del cerebro.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
