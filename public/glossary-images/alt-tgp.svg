<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">ALT (TGP): una enzima del interior del hígado</title>
  <desc id="d">A la izquierda, un hígado con hepatocitos que contienen la enzima ALT; cuando la célula se daña, la ALT pasa a la sangre. A la derecha, un tubo de sangre, las causas frecuentes de aumento y las pruebas con las que se compara.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Dónde está la ALT</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Cuándo sube y qué orienta</text>
<path d="M60 150 C60 100 140 80 230 86 C300 90 350 110 350 140 C350 180 300 210 240 236 C190 256 120 262 90 240 C66 222 60 190 60 150 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="120" text-anchor="middle" class="big">Hígado</text>
<polygon points="120,146 133,153 133,167 120,174 107,167 107,153" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="120" cy="160" r="3" fill="var(--accent)"/>
<polygon points="170,161 183,168 183,182 170,189 157,182 157,168" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="170" cy="175" r="3" fill="var(--accent)"/>
<polygon points="220,151 233,158 233,172 220,179 207,172 207,158" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="220" cy="165" r="3" fill="var(--accent)"/>
<polygon points="270,136 283,143 283,157 270,164 257,157 257,143" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="270" cy="150" r="3" fill="var(--accent)"/>
<polygon points="150,191 163,198 163,212 150,219 137,212 137,198" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="150" cy="205" r="3" fill="var(--accent)"/>
<polygon points="205,196 218,203 218,217 205,224 192,217 192,203" fill="var(--panel)" stroke="var(--organ)" stroke-width="1.5"/>
<circle cx="205" cy="210" r="3" fill="var(--accent)"/>
<text x="200" y="280" text-anchor="middle" class="lab">Hepatocitos con ALT en su interior</text>
<rect x="60" y="310" width="120" height="40" rx="8" fill="var(--ok)"/>
<text x="120.0" y="334.7" text-anchor="middle" class="lab" style="fill:var(--on)">Célula sana</text>
<rect x="220" y="310" width="120" height="40" rx="8" fill="var(--bad)"/>
<text x="280.0" y="334.7" text-anchor="middle" class="lab" style="fill:var(--on)">Célula dañada</text>
<line x1="280" y1="352" x2="280" y2="384" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<text x="280" y="404" text-anchor="middle" class="small" style="fill:var(--muted)">La ALT pasa a la sangre</text>
<text x="120" y="374" text-anchor="middle" class="small" style="fill:var(--muted)">ALT queda dentro</text>
<rect x="418" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M420 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M421.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="433" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<text x="470" y="92" class="lab">Se mide la actividad de la</text>
<text x="470" y="110" class="lab">enzima ALT (antes TGP) en el</text>
<text x="470" y="128" class="lab">suero, junto con otras pruebas.</text>
<text x="416" y="214" class="h">Causas de aumento</text>
<text x="416" y="242" class="lab">• Hígado graso</text>
<text x="416" y="266" class="lab">• Hepatitis por virus</text>
<text x="416" y="290" class="lab">• Alcohol</text>
<text x="416" y="314" class="lab">• Algunos medicamentos</text>
<text x="416" y="338" class="lab">• Obstrucción de la vía biliar</text>
<text x="626" y="214" class="h">Se compara con</text>
<text x="626" y="242" class="lab">• AST (TGO)</text>
<text x="626" y="266" class="lab">• Fosfatasa alcalina</text>
<text x="626" y="290" class="lab">• GGT</text>
<text x="626" y="314" class="lab">• Bilirrubina</text>
<text x="416" y="400" class="small" style="fill:var(--muted)">Su elevación indica daño de la célula hepática,</text>
<text x="416" y="418" class="small" style="fill:var(--muted)">no siempre cuánto funciona el hígado.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
