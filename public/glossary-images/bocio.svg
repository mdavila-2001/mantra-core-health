<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Bocio</title>
  <desc id="d">A la izquierda, un cuello visto de frente con la tiroides en forma de mariposa delante de la tráquea y, en línea discontinua, su contorno agrandado en el bocio. A la derecha, los tipos difuso y nodular, las causas frecuentes y los signos para consultar.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Tiroides agrandada en el cuello</text>
  <path d="M140 70 H260 V230 C310 240 350 270 356 330 L356 420 H44 L44 330 C50 270 90 240 140 230 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="188" y="150" width="24" height="150" rx="8" fill="var(--tissue)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="200" y="322" text-anchor="middle" class="small" style="fill:var(--muted)">Tráquea</text>
  <path d="M200 226 C176 210 150 204 148 230 C146 258 170 272 192 252 Z M200 226 C224 210 250 204 252 230 C254 258 230 272 208 252 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" opacity=".9"/>
  <path d="M200 226 C160 186 100 190 102 236 C104 296 172 298 196 262 Z M200 226 C240 186 300 190 298 236 C296 296 228 298 204 262 Z" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="200" y="112" text-anchor="middle" class="small" style="fill:var(--organ-d)">Tiroides normal</text>
  <line x1="200" y1="118" x2="168" y2="214" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="300" y="176" text-anchor="middle" class="small" style="fill:var(--vessel)">Bocio</text>
  <text x="200" y="370" text-anchor="middle" class="small">Bulto en la parte delantera del cuello</text>
  <text x="200" y="388" text-anchor="middle" class="small">que sube y baja al tragar</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Tipos y causas</text>
  <rect x="416" y="70" width="166" height="66" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="499.0" y="99.5" text-anchor="middle" class="lab">Difuso</text>
  <text x="499.0" y="116.5" text-anchor="middle" class="lab">toda la glándula</text>
  <rect x="594" y="70" width="166" height="66" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="677.0" y="99.5" text-anchor="middle" class="lab">Nodular</text>
  <text x="677.0" y="116.5" text-anchor="middle" class="lab">uno o varios nódulos</text>
  <text x="416" y="170" class="step">Causas frecuentes</text>
  <text x="424" y="196" class="lab">• Falta de yodo en la dieta</text>
  <text x="424" y="220" class="lab">• Enfermedad de Graves (exceso de hormona)</text>
  <text x="424" y="244" class="lab">• Tiroiditis de Hashimoto (falta de hormona)</text>
  <text x="424" y="268" class="lab">• Nódulos tiroideos</text>
  <text x="416" y="306" class="step" style="fill:var(--warn)">Cuándo consultar pronto</text>
  <text x="424" y="332" class="lab">• Dificultad para tragar o respirar</text>
  <text x="424" y="356" class="lab">• Crecimiento rápido o ronquera</text>
  <text x="424" y="380" class="lab">• Palpitaciones, pérdida de peso o cansancio</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
