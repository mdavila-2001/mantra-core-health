<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Anafilaxia</title>
  <desc id="d">Tres columnas. A la izquierda, desencadenantes frecuentes: alimentos, picaduras, medicamentos y látex. En el centro, una silueta humana con los sistemas afectados: piel con ronchas, garganta hinchada, pulmones con sibilancias, corazón con presión baja y aparato digestivo con vómitos. A la derecha, qué hacer: adrenalina en el muslo, llamar a emergencias, tumbarse con las piernas elevadas y vigilar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="220" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="130.0" y="50" text-anchor="middle" class="title">Desencadenantes</text>
  <rect x="36" y="60" width="188" height="64" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="130" y="86" text-anchor="middle" class="step">Alimentos</text>
  <text x="130" y="106" text-anchor="middle" class="small">Frutos secos, marisco</text>
  <rect x="36" y="142" width="188" height="64" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="130" y="168" text-anchor="middle" class="step">Picaduras</text>
  <text x="130" y="188" text-anchor="middle" class="small">Abejas, avispas</text>
  <rect x="36" y="224" width="188" height="64" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="130" y="250" text-anchor="middle" class="step">Medicamentos</text>
  <text x="130" y="270" text-anchor="middle" class="small">Antibióticos, otros</text>
  <rect x="36" y="306" width="188" height="64" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="130" y="332" text-anchor="middle" class="step">Látex</text>
  <text x="130" y="352" text-anchor="middle" class="small">Guantes, globos</text>
  <rect x="250" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Afecta a varios sistemas</text>
  <g transform="translate(400 62) scale(0.85)" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5">
    <circle cx="0" cy="26" r="24"/>
    <rect x="-9" y="48" width="18" height="12"/>
    <path d="M-52 62 Q0 52 52 62 L56 200 Q0 214 -56 200 Z"/>
    <path d="M-52 64 Q-70 70 -74 120 L-80 200 Q-82 210 -72 210 L-64 130 L-56 100 Z"/>
    <path d="M52 64 Q70 70 74 120 L80 200 Q82 210 72 210 L64 130 L56 100 Z"/>
    <path d="M-54 198 L-50 320 Q-48 330 -36 330 L-28 330 L-6 214 Z"/>
    <path d="M54 198 L50 320 Q48 330 36 330 L28 330 L6 214 Z"/>
  </g>
  <circle cx="400.0" cy="111.3" r="10" fill="var(--bad)"/>
  <text x="400.0" y="115.3" text-anchor="middle" class="small on">1</text>
  <circle cx="381.3" cy="145.3" r="10" fill="var(--accent)"/>
  <text x="381.3" y="149.3" text-anchor="middle" class="small on">2</text>
  <circle cx="410.2" cy="157.2" r="10" fill="var(--vessel)"/>
  <text x="410.2" y="161.2" text-anchor="middle" class="small on">3</text>
  <circle cx="400.0" cy="204.8" r="10" fill="var(--warn)"/>
  <text x="400.0" y="208.8" text-anchor="middle" class="small on">4</text>
  <circle cx="343.9" cy="189.5" r="10" fill="var(--purple)"/>
  <text x="343.9" y="193.5" text-anchor="middle" class="small on">5</text>
  <text x="266" y="362" class="small">1 Garganta hinchada</text>
  <text x="266" y="386" class="small">2 Pitidos, ahogo</text>
  <text x="266" y="410" class="small">3 Presión baja</text>
  <text x="416" y="362" class="small">4 Vómitos, dolor</text>
  <text x="416" y="386" class="small">5 Ronchas en la piel</text>
  <text x="400" y="440" text-anchor="middle" class="small muted">Aparece en minutos tras la exposición</text>
  <rect x="560" y="20" width="220" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="670.0" y="50" text-anchor="middle" class="title">Qué hacer</text>
  <rect x="576" y="60" width="188" height="64" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="670" y="86" text-anchor="middle" class="step">Adrenalina</text>
  <text x="670" y="106" text-anchor="middle" class="small">en el muslo, sin esperar</text>
  <rect x="576" y="142" width="188" height="64" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="670" y="168" text-anchor="middle" class="step">Emergencias</text>
  <text x="670" y="188" text-anchor="middle" class="small">llamar de inmediato</text>
  <rect x="576" y="224" width="188" height="64" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="670" y="250" text-anchor="middle" class="step">Postura</text>
  <text x="670" y="270" text-anchor="middle" class="small">tumbado, piernas arriba</text>
  <rect x="576" y="306" width="188" height="64" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="670" y="332" text-anchor="middle" class="step">Vigilar</text>
  <text x="670" y="352" text-anchor="middle" class="small">puede volver en horas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
