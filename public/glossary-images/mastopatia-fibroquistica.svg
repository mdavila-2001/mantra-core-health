<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mastopatía fibroquística</title>
  <desc id="d">A la izquierda, una mama vista de perfil con quistes redondeados llenos de líquido y bandas de tejido fibroso más denso. A la derecha, la aclaración de que es benigna y varía con el ciclo menstrual, sus síntomas y los cambios que obligan a consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Tejido mamario con cambios</text>
  <path d="M60 100 C60 100 60 380 200 380 C340 380 340 240 300 160 C270 100 200 80 60 100 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="250" cy="300" r="10" fill="var(--organ)"/>
  <circle cx="150" cy="220" r="18" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="200" cy="260" r="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="230" cy="200" r="14" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="130" cy="300" r="10" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M110 170 C150 190 180 180 210 170 M120 250 C160 240 180 280 220 300 M170 330 C200 320 230 340 260 330" fill="none" stroke="var(--nerve)" stroke-width="3" opacity=".7"/>
  <text x="300" y="110" class="step" style="fill:var(--accent)">Quistes</text>
  <path d="M296 112 L244 196" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="410" class="step" style="fill:var(--nerve)">Fibrosis (tejido más denso)</text>
  <path d="M100 396 L130 300" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Lo que conviene saber</text>
  <rect x="436" y="70" width="324" height="66" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="96" class="step" style="fill:var(--ok)">Es benigna y muy frecuente</text>
  <text x="452" y="118" class="lab">Cambia con el ciclo menstrual</text>
  <text x="436" y="166" class="step">Síntomas</text>
  <text x="440" y="192" class="lab">• Mamas sensibles antes de la regla</text>
  <text x="440" y="216" class="lab">• Zonas nodulares o bultos</text>
  <text x="440" y="240" class="lab">• Mejora tras la menopausia</text>
  <rect x="436" y="282" width="324" height="138" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="306" class="step" style="fill:var(--warn)">Consultar si aparece</text>
  <text x="456" y="332" class="small">• Un bulto nuevo que no cambia</text>
  <text x="456" y="354" class="small">• Piel retraída o de piel de naranja</text>
  <text x="456" y="376" class="small">• Secreción con sangre por el pezón</text>
  <text x="456" y="398" class="small">• Cambios en un solo lado</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
