<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Rehabilitación pulmonar</title>
  <desc id="d">Diagrama con la persona con EPOC u otra enfermedad respiratoria crónica en el centro y seis componentes del programa alrededor: ejercicio, técnicas de respiración, educación, nutrición, apoyo emocional y adaptación de la vida diaria. Debajo, su objetivo: menos falta de aire y más actividad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Rehabilitación pulmonar: un programa en equipo</text>
  <line x1="342.5" y1="200.0" x2="280" y2="110" stroke="var(--line)" stroke-width="2"/>
  <line x1="457.5" y1="200.0" x2="520" y2="110" stroke="var(--line)" stroke-width="2"/>
  <line x1="342.5" y1="230.0" x2="280" y2="230" stroke="var(--line)" stroke-width="2"/>
  <line x1="457.5" y1="230.0" x2="520" y2="230" stroke="var(--line)" stroke-width="2"/>
  <line x1="342.5" y1="260.0" x2="280" y2="350" stroke="var(--line)" stroke-width="2"/>
  <line x1="457.5" y1="260.0" x2="520" y2="350" stroke="var(--line)" stroke-width="2"/>
  <circle cx="400" cy="230" r="82" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="400" y="218" text-anchor="middle" class="small">Persona con</text>
  <text x="400" y="236" text-anchor="middle" class="small">EPOC u otra</text>
  <text x="400" y="254" text-anchor="middle" class="small">enfermedad crónica</text>
  <rect x="60" y="80" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="170" y="106" text-anchor="middle" class="step">Ejercicio</text>
  <text x="170" y="126" text-anchor="middle" class="small muted">bicicleta, caminar, fuerza</text>
  <rect x="520" y="80" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="630" y="106" text-anchor="middle" class="step">Respiración</text>
  <text x="630" y="126" text-anchor="middle" class="small muted">labios fruncidos</text>
  <rect x="60" y="200" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="170" y="226" text-anchor="middle" class="step">Educación</text>
  <text x="170" y="246" text-anchor="middle" class="small muted">inhaladores, crisis</text>
  <rect x="520" y="200" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="630" y="226" text-anchor="middle" class="step">Nutrición</text>
  <text x="630" y="246" text-anchor="middle" class="small muted">peso adecuado</text>
  <rect x="60" y="320" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="170" y="346" text-anchor="middle" class="step">Apoyo emocional</text>
  <text x="170" y="366" text-anchor="middle" class="small muted">ansiedad, ánimo</text>
  <rect x="520" y="320" width="220" height="60" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="630" y="346" text-anchor="middle" class="step">Vida diaria</text>
  <text x="630" y="366" text-anchor="middle" class="small muted">ahorro de energía</text>
  <text x="400" y="404" text-anchor="middle" class="lab">Objetivo: menos falta de aire y más actividad, no curar la enfermedad</text>
  <text x="400" y="426" text-anchor="middle" class="small muted">Suele durar varias semanas, con evaluación al inicio y al final</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
