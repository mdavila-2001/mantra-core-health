<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Retraso del desarrollo: áreas que se valoran</title>
  <desc id="d">Un círculo central con el niño rodeado de cinco áreas del desarrollo: motor grueso, motor fino, lenguaje, social y cognitivo, cada una con ejemplos. A la derecha, qué significa el retraso, señales para consultar y la importancia de la detección y la atención temprana.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Áreas del desarrollo infantil</text>
<circle cx="210" cy="236" r="52" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
<text x="210" y="232" text-anchor="middle" class="lab">Niño o</text>
<text x="210" y="250" text-anchor="middle" class="lab">niña</text>
<line x1="210.0" y1="184.0" x2="210.0" y2="130.0" stroke="var(--accent)" stroke-width="2"/>
<rect x="148.0" y="84.0" width="124" height="44" rx="8" fill="var(--accent)"/>
<text x="210.0" y="110.3" text-anchor="middle" class="small" style="fill:var(--on)">Motor grueso</text>
<text x="210.0" y="76.0" text-anchor="middle" class="small" style="fill:var(--muted)">sentarse, caminar</text>
<line x1="259.5" y1="219.9" x2="301.3" y2="203.2" stroke="var(--ok)" stroke-width="2"/>
<rect x="281.1" y="173.8" width="124" height="44" rx="8" fill="var(--ok)"/>
<text x="343.1" y="200.1" text-anchor="middle" class="small" style="fill:var(--on)">Motor fino</text>
<text x="343.1" y="233.8" text-anchor="middle" class="small" style="fill:var(--muted)">pinza, dibujar</text>
<line x1="240.6" y1="278.1" x2="266.4" y2="321.8" stroke="var(--purple)" stroke-width="2"/>
<rect x="230.3" y="319.2" width="124" height="44" rx="8" fill="var(--purple)"/>
<text x="292.3" y="345.5" text-anchor="middle" class="small" style="fill:var(--on)">Lenguaje</text>
<text x="292.3" y="379.2" text-anchor="middle" class="small" style="fill:var(--muted)">balbuceo, palabras</text>
<line x1="179.4" y1="278.1" x2="153.6" y2="321.8" stroke="var(--warn)" stroke-width="2"/>
<rect x="65.7" y="319.2" width="124" height="44" rx="8" fill="var(--warn)"/>
<text x="127.7" y="345.5" text-anchor="middle" class="small" style="fill:var(--on)">Social</text>
<text x="127.7" y="379.2" text-anchor="middle" class="small" style="fill:var(--muted)">sonrisa, juego</text>
<line x1="160.5" y1="219.9" x2="118.7" y2="203.2" stroke="var(--vessel)" stroke-width="2"/>
<rect x="14.9" y="173.8" width="124" height="44" rx="8" fill="var(--vessel)"/>
<text x="76.9" y="200.1" text-anchor="middle" class="small" style="fill:var(--on)">Cognitivo</text>
<text x="76.9" y="233.8" text-anchor="middle" class="small" style="fill:var(--muted)">explorar, resolver</text>
<text x="450" y="80" class="h">Retraso del desarrollo</text>
<text x="450" y="104" class="lab">El niño no alcanza los hitos esperados</text>
<text x="450" y="122" class="lab">para su edad en una o varias áreas.</text>
<text x="450" y="162" class="h" style="fill:var(--bad)">Señales para consultar</text>
<text x="450" y="188" class="lab">• No sostiene la cabeza o no se sienta</text>
<text x="450" y="212" class="lab">• No balbucea ni señala</text>
<text x="450" y="236" class="lab">• Pierde habilidades que tenía</text>
<text x="450" y="260" class="lab">• Poco contacto visual o interés social</text>
<rect x="450" y="296" width="310" height="124" rx="10" fill="var(--ok-l)"/>
<text x="466" y="322" class="h" style="fill:var(--ok)">Qué ayuda</text>
<text x="466" y="348" class="lab">• Detección en controles pediátricos</text>
<text x="466" y="372" class="lab">• Evaluación del desarrollo</text>
<text x="466" y="396" class="lab">• Estimulación y terapia temprana</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
