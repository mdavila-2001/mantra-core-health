<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Alergología: la especialidad de las alergias</title>
  <desc id="d">A la izquierda, un alérgeno se une a los anticuerpos IgE de la superficie de un mastocito, que libera histamina y provoca estornudos, ronchas, asma o anafilaxia. A la derecha, las enfermedades que atiende la alergología y una prueba cutánea en el antebrazo con ronchas en los puntos donde hay sensibilidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se produce una alergia</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué atiende y cómo estudia</text>
<circle cx="70" cy="100" r="14" fill="var(--yellow)" stroke="var(--warn)" stroke-width="2"/>
<line x1="84.0" y1="100.0" x2="91.0" y2="100.0" stroke="var(--warn)" stroke-width="2"/>
<line x1="79.9" y1="109.9" x2="84.8" y2="114.8" stroke="var(--warn)" stroke-width="2"/>
<line x1="70.0" y1="114.0" x2="70.0" y2="121.0" stroke="var(--warn)" stroke-width="2"/>
<line x1="60.1" y1="109.9" x2="55.2" y2="114.8" stroke="var(--warn)" stroke-width="2"/>
<line x1="56.0" y1="100.0" x2="49.0" y2="100.0" stroke="var(--warn)" stroke-width="2"/>
<line x1="60.1" y1="90.1" x2="55.2" y2="85.2" stroke="var(--warn)" stroke-width="2"/>
<line x1="70.0" y1="86.0" x2="70.0" y2="79.0" stroke="var(--warn)" stroke-width="2"/>
<line x1="79.9" y1="90.1" x2="84.8" y2="85.2" stroke="var(--warn)" stroke-width="2"/>
<text x="100" y="96" class="small">Alérgeno: polen, ácaro,</text>
<text x="100" y="112" class="small">alimento, fármaco</text>
<line x1="110" y1="128" x2="160" y2="168" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="200" cy="210" r="50" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2"/>
<text x="200" y="214" text-anchor="middle" class="small" style="fill:var(--purple)">Mastocito</text>
<path d="M154.9 188.4 l-3.3 -7.1 M154.9 188.4 l-7.6 1.9" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M168.8 171.0 l0.2 -7.8 M168.8 171.0 l-7.7 -1.6" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M188.8 161.3 l3.5 -7.0 M188.8 161.3 l-6.2 -4.7" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M211.2 161.3 l6.2 -4.7 M211.2 161.3 l-3.5 -7.0" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M231.2 171.0 l7.7 -1.6 M231.2 171.0 l-0.2 -7.8" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M245.1 188.4 l7.6 1.9 M245.1 188.4 l3.3 -7.1" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="270" y="166" class="small" style="fill:var(--accent)">Anticuerpos IgE</text>
<circle cx="264" cy="220" r="4" fill="var(--bad)"/>
<circle cx="274" cy="240" r="4" fill="var(--bad)"/>
<circle cx="260" cy="256" r="4" fill="var(--bad)"/>
<circle cx="284" cy="262" r="4" fill="var(--bad)"/>
<text x="276" y="286" class="small" style="fill:var(--bad)">Histamina</text>
<line x1="200" y1="266" x2="200" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="306" width="320" height="40" rx="8" fill="var(--bad)"/>
<text x="200.0" y="330.3" text-anchor="middle" class="small" style="fill:var(--on)">Estornudos, ronchas, asma, anafilaxia</text>
<text x="200" y="382" text-anchor="middle" class="small">El sistema inmunitario reacciona contra</text>
<text x="200" y="398" text-anchor="middle" class="small">algo inofensivo para la mayoría.</text>
<text x="416" y="76" class="h">Enfermedades que atiende</text>
<text x="416" y="102" class="small">• Rinitis y asma alérgicos</text>
<text x="416" y="124" class="small">• Alergia a alimentos</text>
<text x="416" y="146" class="small">• Alergia a fármacos</text>
<text x="416" y="168" class="small">• Picaduras de insectos</text>
<text x="416" y="190" class="small">• Urticaria y dermatitis</text>
<text x="416" y="228" class="h">Prueba cutánea (prick)</text>
<path d="M420 250 C500 244 680 244 760 252 L760 330 C680 336 500 336 420 330 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="450" cy="290" r="5" fill="var(--tissue)" stroke="var(--muted)" stroke-width="2"/>
<text x="450" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">1</text>
<circle cx="502" cy="290" r="18" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
<text x="502" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">2</text>
<circle cx="554" cy="290" r="5" fill="var(--tissue)" stroke="var(--muted)" stroke-width="2"/>
<text x="554" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">3</text>
<circle cx="606" cy="290" r="5" fill="var(--tissue)" stroke="var(--muted)" stroke-width="2"/>
<text x="606" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">4</text>
<circle cx="658" cy="290" r="18" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
<text x="658" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">5</text>
<circle cx="710" cy="290" r="5" fill="var(--tissue)" stroke="var(--muted)" stroke-width="2"/>
<text x="710" y="318" text-anchor="middle" class="small" style="fill:var(--muted)">6</text>
<text x="416" y="356" class="small" style="fill:var(--bad)">Ronchas donde hay sensibilidad</text>
<text x="416" y="384" class="small">También: análisis de IgE, pruebas de</text>
<text x="416" y="400" class="small">provocación e inmunoterapia (vacunas).</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
