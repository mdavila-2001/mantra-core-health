<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de la educación al paciente</title>
  <desc id="d">Ciclo de cinco pasos alrededor del paciente y su familia: valorar necesidades, planificar objetivos, enseñar, evaluar y registrar. A la derecha, técnicas útiles y el método de enseñar y devolver para comprobar lo aprendido.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="440" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="240.0" y="50" text-anchor="middle" class="title">Educación dentro del cuidado</text>
<circle cx="240" cy="240" r="130" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="184" y="86" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="240.0" y="106.7" text-anchor="middle" class="small" style="fill:var(--on)">Valorar</text>
<text x="240.0" y="121.7" text-anchor="middle" class="small" style="fill:var(--on)">necesidades</text>
<rect x="308" y="176" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="364.0" y="196.7" text-anchor="middle" class="small" style="fill:var(--on)">Planificar</text>
<text x="364.0" y="211.7" text-anchor="middle" class="small" style="fill:var(--on)">objetivos</text>
<rect x="260" y="321" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="316.0" y="349.2" text-anchor="middle" class="small" style="fill:var(--on)">Enseñar</text>
<rect x="108" y="321" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="164.0" y="341.7" text-anchor="middle" class="small" style="fill:var(--on)">Evaluar</text>
<text x="164.0" y="356.7" text-anchor="middle" class="small" style="fill:var(--on)">(repetir)</text>
<rect x="60" y="176" width="112" height="48" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="116.0" y="204.2" text-anchor="middle" class="small" style="fill:var(--on)">Registrar</text>
<circle cx="240" cy="240" r="48" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
<text x="240" y="236" text-anchor="middle" class="step">Paciente</text>
<text x="240" y="254" text-anchor="middle" class="small">y familia</text>
<rect x="476" y="20" width="304" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="628.0" y="50" text-anchor="middle" class="title">Técnicas útiles</text>
<text x="492" y="72" class="lab">• Lenguaje claro, sin jerga</text>
<text x="492" y="96" class="lab">• Pocas ideas clave por vez</text>
<text x="492" y="120" class="lab">• Demostrar y practicar</text>
<text x="492" y="144" class="lab">• Material escrito o visual</text>
<text x="492" y="168" class="lab">• Adaptar a cultura y edad</text>
<rect x="492" y="212" width="272" height="110" rx="10" fill="var(--ok-l)" stroke-width="1"/>
<text x="506" y="238" class="step">Enseñar y devolver</text>
<text x="506" y="262" class="lab">La persona explica con sus</text>
<text x="506" y="282" class="lab">palabras lo que entendió;</text>
<text x="506" y="302" class="lab">así se detectan dudas.</text>
<text x="492" y="350" class="lab">Objetivo: comprender, decidir</text>
<text x="492" y="370" class="lab">y cuidarse con confianza.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
