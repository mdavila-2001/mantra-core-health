<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Recuperación de un ataque cerebral</title>
  <desc id="d">Arriba, cuatro etapas de la recuperación tras un ictus: hospital, rehabilitación intensiva, hogar y vuelta a la comunidad. Abajo a la izquierda, las capacidades que se trabajan: movimiento con fisioterapia, vida diaria con terapia ocupacional, habla y deglución con logopedia, y memoria y ánimo con neuropsicología. Abajo a la derecha, un cerebro con una zona dañada y nuevas conexiones que la rodean.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Etapas de la recuperación</text>
  <rect x="40" y="70" width="168" height="110" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="124" y="104" text-anchor="middle" class="big">Hospital</text>
  <text x="124" y="132" text-anchor="middle" class="small">Estabilizar y</text>
  <text x="124" y="150" text-anchor="middle" class="small">empezar pronto</text>
  <path d="M210 125 L224 125" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="226" y="70" width="168" height="110" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="310" y="104" text-anchor="middle" class="big">Rehabilitación</text>
  <text x="310" y="132" text-anchor="middle" class="small">Terapia intensiva</text>
  <text x="310" y="150" text-anchor="middle" class="small">de varias semanas</text>
  <path d="M396 125 L410 125" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="412" y="70" width="168" height="110" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="496" y="104" text-anchor="middle" class="big">Hogar</text>
  <text x="496" y="132" text-anchor="middle" class="small">Seguir ejercitando</text>
  <text x="496" y="150" text-anchor="middle" class="small">y adaptar la casa</text>
  <path d="M582 125 L596 125" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="598" y="70" width="168" height="110" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="682" y="104" text-anchor="middle" class="big">Comunidad</text>
  <text x="682" y="132" text-anchor="middle" class="small">Volver al trabajo,</text>
  <text x="682" y="150" text-anchor="middle" class="small">ocio y vida social</text>
  <rect x="20" y="234" width="420" height="216" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="264" text-anchor="middle" class="title">Capacidades que se trabajan</text>
  <rect x="40" y="276" width="184" height="66" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="132" y="304" text-anchor="middle" class="step">Movimiento</text>
  <text x="132" y="324" text-anchor="middle" class="small">Fisioterapia</text>
  <rect x="236" y="276" width="184" height="66" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="328" y="304" text-anchor="middle" class="step">Vida diaria</text>
  <text x="328" y="324" text-anchor="middle" class="small">Terapia ocupacional</text>
  <rect x="40" y="358" width="184" height="66" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="132" y="386" text-anchor="middle" class="step">Habla y tragar</text>
  <text x="132" y="406" text-anchor="middle" class="small">Logopedia</text>
  <rect x="236" y="358" width="184" height="66" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="328" y="386" text-anchor="middle" class="step">Memoria y ánimo</text>
  <text x="328" y="406" text-anchor="middle" class="small">Neuropsicología</text>
  <rect x="460" y="234" width="320" height="216" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="264" text-anchor="middle" class="title">El cerebro se reorganiza</text>
  <path d="M520 360 C505 300 550 270 600 272 C660 268 700 300 694 350 C696 385 660 400 630 398 C600 410 560 404 548 390 C525 388 515 375 520 360 Z" fill="var(--organ)" opacity=".55" stroke="var(--line)"/>
  <circle cx="590" cy="320" r="16" fill="var(--ink)" opacity=".35"/>
  <path d="M606 320 C630 300 650 330 670 316 M600 334 C620 360 650 350 664 372" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <text x="620" y="290" text-anchor="middle" class="small" style="fill:var(--ok)">Nuevas conexiones</text>
  <text x="620" y="428" text-anchor="middle" class="small muted">La mejoría es mayor en los primeros meses</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
