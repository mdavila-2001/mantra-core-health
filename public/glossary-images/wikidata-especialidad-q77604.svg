<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Radiología</title>
  <desc id="d">Arriba, cinco técnicas de imagen con su icono: radiografía, ecografía, tomografía, resonancia y radiología intervencionista. Abajo, las tareas del radiólogo y lo que conviene avisar antes de una prueba.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Técnicas de imagen</text>
  <rect x="40" y="66" width="132" height="184" rx="12" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <rect x="76" y="86" width="60" height="70" rx="4" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <path d="M92 96 V146 M120 96 V146 M86 110 H126 M86 124 H126" fill="none" stroke="var(--panel)" stroke-width="3"/>
  <text x="106" y="196" text-anchor="middle" class="step">Radiografía</text>
  <text x="106" y="216" text-anchor="middle" class="small" style="fill:var(--muted)">rayos X</text>
  <rect x="186" y="66" width="132" height="184" rx="12" fill="var(--ok-l)" stroke="none" stroke-width="2"/>
  <path d="M252 96 L218 156 A40 40 0 0 0 286 156 Z" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <path d="M246 92 h12 v10 h-12 Z" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="252" y="196" text-anchor="middle" class="step">Ecografía</text>
  <text x="252" y="216" text-anchor="middle" class="small" style="fill:var(--muted)">ultrasonido</text>
  <rect x="332" y="66" width="132" height="184" rx="12" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <circle cx="398" cy="120" r="34" fill="var(--panel)" stroke="var(--accent)" stroke-width="4"/>
  <circle cx="398" cy="120" r="14" fill="var(--skin)" stroke="none" stroke-width="2"/>
  <text x="398" y="196" text-anchor="middle" class="step">Tomografía</text>
  <text x="398" y="216" text-anchor="middle" class="small" style="fill:var(--muted)">rayos X en cortes</text>
  <rect x="478" y="66" width="132" height="184" rx="12" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <rect x="508" y="90" width="72" height="60" rx="14" fill="var(--panel)" stroke="var(--violet)" stroke-width="4"/>
  <circle cx="544" cy="120" r="16" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <text x="544" y="196" text-anchor="middle" class="step">Resonancia</text>
  <text x="544" y="216" text-anchor="middle" class="small" style="fill:var(--muted)">imán y ondas</text>
  <rect x="624" y="66" width="132" height="184" rx="12" fill="var(--warn-l)" stroke="none" stroke-width="2"/>
  <path d="M656 150 C680 140 690 110 720 96" fill="none" stroke="var(--vessel)" stroke-width="5"/>
  <line x1="650" y1="150" x2="700" y2="132" stroke="var(--ink)" stroke-width="2"/>
  <text x="690" y="196" text-anchor="middle" class="step">Intervencionista</text>
  <text x="690" y="216" text-anchor="middle" class="small" style="fill:var(--muted)">tratamiento guiado</text>
  <rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">Qué hace el radiólogo</text>
  <text x="40" y="342" class="small">• Elige la prueba adecuada</text>
  <text x="40" y="366" class="small">• Interpreta las imágenes</text>
  <text x="40" y="390" class="small">• Emite un informe para su médico</text>
  <text x="40" y="414" class="small">• Cuida la dosis de radiación</text>
  <rect x="410" y="286" width="370" height="154" rx="14" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="595" y="316" text-anchor="middle" class="step" style="fill:var(--warn)">Avisar antes de una prueba</text>
  <text x="430" y="344" class="small">• Posible embarazo</text>
  <text x="430" y="366" class="small">• Alergia al contraste</text>
  <text x="430" y="388" class="small">• Problemas de riñón</text>
  <text x="430" y="410" class="small">• Marcapasos o metal (resonancia)</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
