<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de vitamina D (25-hidroxi)</title>
  <desc id="d">Recorrido de la vitamina D: se forma en la piel con el sol o llega con los alimentos, el hígado la transforma en 25-hidroxivitamina D, que es lo que mide la prueba, y el riñón la convierte en la forma activa que ayuda a absorber calcio. Debajo, un tubo de sangre y las situaciones en las que se pide.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="270" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">El recorrido de la vitamina D</text>
  <circle cx="80" cy="120" r="30" fill="var(--beam)"/>
  <line x1="116.0" y1="120.0" x2="128.0" y2="120.0" stroke="var(--beam)" stroke-width="4"/>
  <line x1="105.45584412271572" y1="145.45584412271572" x2="113.94112549695429" y2="153.94112549695427" stroke="var(--beam)" stroke-width="4"/>
  <line x1="80.0" y1="156.0" x2="80.0" y2="168.0" stroke="var(--beam)" stroke-width="4"/>
  <line x1="54.54415587728429" y1="145.45584412271572" x2="46.05887450304572" y2="153.94112549695427" stroke="var(--beam)" stroke-width="4"/>
  <line x1="44.0" y1="120.0" x2="32.0" y2="120.0" stroke="var(--beam)" stroke-width="4"/>
  <line x1="54.54415587728428" y1="94.54415587728428" x2="46.058874503045715" y2="86.05887450304573" stroke="var(--beam)" stroke-width="4"/>
  <line x1="80.0" y1="84.0" x2="79.99999999999999" y2="72.0" stroke="var(--beam)" stroke-width="4"/>
  <line x1="105.4558441227157" y1="94.54415587728428" x2="113.94112549695427" y2="86.05887450304571" stroke="var(--beam)" stroke-width="4"/>
  <text x="80" y="196" text-anchor="middle" class="lab">Sol en la piel</text>
  <rect x="30" y="216" width="110" height="30" rx="8" fill="var(--tissue)"/>
  <text x="85.0" y="235.32" text-anchor="middle" class="small" style="fill:var(--ink)">o alimentos</text>
  <circle cx="260" cy="130" r="46" fill="var(--nerve)"/>
  <text x="260" y="135" text-anchor="middle" class="step" style="fill:var(--on)">Vitamina D</text>
  <text x="260" y="200" text-anchor="middle" class="lab">D2 o D3</text>
  <circle cx="450" cy="130" r="46" fill="var(--organ)"/>
  <text x="450" y="135" text-anchor="middle" class="step">Hígado</text>
  <text x="450" y="200" text-anchor="middle" class="lab">25-OH vitamina D</text>
  <circle cx="640" cy="130" r="46" fill="var(--organ)"/>
  <text x="640" y="135" text-anchor="middle" class="step">Riñón</text>
  <text x="640" y="200" text-anchor="middle" class="lab">forma activa</text>
  <line x1="130" y1="130" x2="210" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="308" y1="130" x2="400" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="498" y1="130" x2="590" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="380" y="214" width="140" height="40" rx="10" fill="var(--accent)"/>
  <text x="450" y="239" text-anchor="middle" class="step" style="fill:var(--on)">Esto se mide</text>
  <text x="640" y="238" text-anchor="middle" class="small muted">Absorbe calcio</text>
  <rect x="20" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="336" text-anchor="middle" class="title">La prueba</text>
  <rect x="42" y="336" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M44 352 V416 a15 15 0 0 0 30 0 V352 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M46 382 V416 a13 13 0 0 0 26 0 V382 Z" fill="var(--vessel)"/>
  <text x="94" y="360" class="lab">Suero o plasma</text>
  <text x="94" y="384" class="small">25-hidroxivitamina D (calcidiol)</text>
  <text x="94" y="404" class="small muted">Refleja la reserva del cuerpo</text>
  <rect x="410" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="336" text-anchor="middle" class="title">Se pide ante</text>
  <text x="430" y="362" class="lab">• Huesos frágiles u osteoporosis</text>
  <text x="430" y="386" class="lab">• Poca exposición al sol</text>
  <text x="430" y="410" class="lab">• Mala absorción o enfermedad renal</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
