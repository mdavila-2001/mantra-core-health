<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hepatitis A</title>
  <desc id="d">A la izquierda, el ciclo de contagio fecal-oral del virus de la hepatitis A: agua o alimentos contaminados, inflamación del hígado, eliminación en las heces y manos sin lavar. A la derecha, los síntomas, su evolución habitual y las medidas de prevención.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Ciclo de contagio fecal-oral</text>
  <rect x="150" y="94" width="140" height="52" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="220.0" y="116.5" text-anchor="middle" class="lab">Agua o alimentos</text>
  <text x="220.0" y="133.5" text-anchor="middle" class="lab">contaminados</text>
  <rect x="260" y="224" width="140" height="52" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="330.0" y="246.5" text-anchor="middle" class="lab">El virus llega</text>
  <text x="330.0" y="263.5" text-anchor="middle" class="lab">al hígado</text>
  <rect x="150" y="344" width="140" height="52" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="220.0" y="366.5" text-anchor="middle" class="lab">Sale en las</text>
  <text x="220.0" y="383.5" text-anchor="middle" class="lab">heces</text>
  <rect x="40" y="224" width="140" height="52" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="110.0" y="246.5" text-anchor="middle" class="lab">Manos sin lavar</text>
  <text x="110.0" y="263.5" text-anchor="middle" class="lab">o agua sucia</text>
  <path d="M290 130 C330 150 340 190 336 220" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M326 280 C320 330 300 356 294 360" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M150 372 C110 360 100 320 104 280" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M110 222 C110 170 130 130 146 124" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M181 246 C184 228 217 225 246 230 C267 234 271 243 264 252 C249 268 217 272 195 266 C182 262 179 255 181 246 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <text x="220" y="314" text-anchor="middle" class="small" style="fill:var(--organ-d)">Inflamación</text>
  <text x="220" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">Se rompe el ciclo con higiene y vacuna</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Síntomas y prevención</text>
  <text x="456" y="80" class="small">• Cansancio, fiebre y náuseas</text>
  <text x="456" y="104" class="small">• Piel y ojos amarillos (ictericia)</text>
  <text x="456" y="128" class="small">• Orina oscura y heces claras</text>
  <text x="456" y="152" class="small">• En niños pequeños puede no dar síntomas</text>
  <rect x="456" y="184" width="304" height="70" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="608" y="212" text-anchor="middle" class="step">Casi siempre se cura sola</text>
  <text x="608" y="234" text-anchor="middle" class="small">y no se vuelve crónica</text>
  <rect x="456" y="272" width="304" height="150" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="298" class="step">Cómo prevenirla</text>
  <text x="480" y="322" class="small">• Vacuna</text>
  <text x="480" y="344" class="small">• Lavarse las manos tras ir al baño</text>
  <text x="480" y="366" class="small">• Agua potable y alimentos bien lavados</text>
  <text x="480" y="388" class="small">• Cocinar mariscos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
