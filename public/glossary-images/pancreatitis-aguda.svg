<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pancreatitis aguda</title>
  <desc id="d">A la izquierda, el páncreas inflamado situado detrás del estómago, junto al duodeno y la vesícula, con un cálculo biliar que bloquea el conducto y las enzimas activándose dentro del páncreas. A la derecha, las causas principales, el dolor intenso en la parte alta del abdomen que se irradia a la espalda y el diagnóstico con lipasa en sangre y pruebas de imagen.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Páncreas inflamado</text>
  <path d="M80 120 C140 90 230 100 260 140 C230 180 150 190 90 170 Z" fill="var(--organ)" opacity=".45" stroke="var(--line)"/>
  <text x="170" y="146" text-anchor="middle" class="small">Estómago</text>
  <path d="M120 260 C200 220 300 230 380 210 C400 230 390 250 370 256 C300 270 220 290 150 300 C110 300 100 270 120 260 Z" fill="var(--warn)" opacity=".8" stroke="var(--bad)" stroke-width="3"/>
  <path d="M80 220 C90 280 100 320 140 360" fill="none" stroke="var(--organ)" stroke-width="18" opacity=".6"/>
  <text x="60" y="380" class="small">Duodeno</text>
  <path d="M130 120 C120 170 140 230 128 276" fill="none" stroke="var(--ok)" stroke-width="5"/>
  <ellipse cx="114" cy="110" rx="18" ry="24" fill="var(--ok)" opacity=".6"/>
  <text x="70" y="82" class="small">Vesícula</text>
  <circle cx="130" cy="262" r="8" fill="var(--ink)"/>
  <circle cx="130" cy="262" r="3" fill="var(--ink)"/>
  <path d="M130 262 L200 340" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="204" y="344" class="lab">Cálculo que bloquea</text>
  <path d="M370 256 C340 290 330 310 340 330" fill="none" stroke="var(--line)" stroke-width="2"/>
  <circle cx="260" cy="250" r="4" fill="var(--bad)"/>
  <circle cx="300" cy="240" r="4" fill="var(--bad)"/>
  <circle cx="330" cy="232" r="4" fill="var(--bad)"/>
  <circle cx="220" cy="262" r="4" fill="var(--bad)"/>
  <text x="300" y="206" text-anchor="middle" class="small">Las enzimas se activan</text>
  <text x="300" y="190" text-anchor="middle" class="small">dentro del páncreas</text>
  <text x="240" y="430" text-anchor="middle" class="small muted">Situado detrás del estómago</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="500" y="74" class="step">Causas principales</text>
  <text x="500" y="98" class="small">• Cálculos biliares</text>
  <text x="500" y="120" class="small">• Alcohol</text>
  <text x="500" y="142" class="small">• Triglicéridos muy altos</text>
  <text x="500" y="172" class="step">Síntomas</text>
  <rect x="500" y="186" width="260" height="52" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="630" y="208" text-anchor="middle" class="small">Dolor intenso en la parte</text>
  <text x="630" y="226" text-anchor="middle" class="small">alta, irradiado a la espalda</text>
  <text x="500" y="264" class="small">• Náuseas y vómitos</text>
  <text x="500" y="286" class="small">• Fiebre, abdomen tenso</text>
  <text x="500" y="334" class="step">Diagnóstico</text>
  <text x="500" y="360" class="small">• Lipasa en sangre</text>
  <text x="500" y="382" class="small">• Ecografía o TAC</text>
  <text x="630" y="428" text-anchor="middle" class="small muted">Requiere atención hospitalaria</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
