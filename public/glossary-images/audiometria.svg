<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Audiometría tonal</title>
  <desc id="d">A la izquierda, una persona con auriculares en una cabina silenciosa que pulsa un botón al oír cada tono. A la derecha, un audiograma con la frecuencia de grave a agudo en horizontal y el volumen en vertical; la línea de un oído muestra audición normal en los graves y pérdida en los agudos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="330" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="185.0" y="50" text-anchor="middle" class="title">Cómo se hace</text>
  <rect x="50" y="70" width="270" height="200" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="185" y="92" text-anchor="middle" class="small muted">Cabina silenciosa</text>
  <circle cx="130" cy="170" r="34" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M90 160 C90 110 170 110 170 160" fill="none" stroke="var(--ink)" stroke-width="5"/>
  <rect x="80" y="150" width="16" height="32" rx="6" fill="var(--accent)"/>
  <rect x="164" y="150" width="16" height="32" rx="6" fill="var(--accent)"/>
  <rect x="110" y="206" width="40" height="54" rx="12" fill="var(--skin)" stroke="var(--line)"/>
  <path d="M150 220 L180 200" fill="none" stroke="var(--skin)" stroke-width="8" stroke-linecap="round"/>
  <rect x="176" y="186" width="16" height="20" rx="4" fill="var(--ok)"/>
  <text x="250" y="160" text-anchor="middle" class="small">Pulsa al</text>
  <text x="250" y="176" text-anchor="middle" class="small">oír el tono</text>
  <path d="M58.0 160 a10 10 0 0 0 0 20" fill="none" stroke="var(--muted)" stroke-width="2" transform="scale(-1 1) translate(-122 0)"/>
  <path d="M56.4 152 a18 18 0 0 0 0 36" fill="none" stroke="var(--muted)" stroke-width="2" transform="scale(-1 1) translate(-122 0)"/>
  <path d="M54.8 144 a26 26 0 0 0 0 52" fill="none" stroke="var(--muted)" stroke-width="2" transform="scale(-1 1) translate(-122 0)"/>
  <text x="44" y="304" class="lab">• Tonos graves y agudos</text>
  <text x="44" y="328" class="lab">• Cada oído por separado</text>
  <text x="44" y="352" class="lab">• Se busca el sonido más débil</text>
  <text x="44" y="376" class="lab">• que se oye: el umbral</text>
  <text x="44" y="400" class="lab">• No duele</text>
  <rect x="366" y="20" width="414" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="573.0" y="50" text-anchor="middle" class="title">El audiograma</text>
  <path d="M430 90 V360 H760" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <line x1="430" y1="110" x2="760" y2="110" stroke="var(--line)" stroke-width="1"/>
  <line x1="430" y1="170" x2="760" y2="170" stroke="var(--line)" stroke-width="1"/>
  <line x1="430" y1="230" x2="760" y2="230" stroke="var(--line)" stroke-width="1"/>
  <line x1="430" y1="290" x2="760" y2="290" stroke="var(--line)" stroke-width="1"/>
  <line x1="430" y1="350" x2="760" y2="350" stroke="var(--line)" stroke-width="1"/>
  <text x="450" y="380" text-anchor="middle" class="small muted">Grave</text>
  <text x="730" y="380" text-anchor="middle" class="small muted">Agudo</text>
  <text x="595" y="400" text-anchor="middle" class="small muted">Frecuencia (tono)</text>
  <text x="420" y="112" text-anchor="end" class="small muted">Débil</text>
  <text x="420" y="352" text-anchor="end" class="small muted">Fuerte</text>
  <text x="400" y="232" text-anchor="middle" class="small muted" transform="rotate(-90 400 232)">Volumen</text>
  <path d="M450 130 L520 134 L590 140 L660 210 L730 260" fill="none" stroke="var(--vessel)" stroke-width="2.5"/>
  <circle cx="450" cy="130" r="7" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2.5"/>
  <circle cx="520" cy="134" r="7" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2.5"/>
  <circle cx="590" cy="140" r="7" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2.5"/>
  <circle cx="660" cy="210" r="7" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2.5"/>
  <circle cx="730" cy="260" r="7" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2.5"/>
  <text x="600" y="124" class="small">Audición normal en graves</text>
  <text x="700" y="300" text-anchor="middle" class="small" style="fill:var(--warn)">Pérdida en agudos</text>
  <text x="595" y="424" text-anchor="middle" class="small">Cuanto más abajo, peor se oye</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
