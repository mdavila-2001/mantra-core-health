<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hematología</title>
  <desc id="d">A la izquierda, un vaso sanguíneo con glóbulos rojos, un glóbulo blanco y plaquetas, y un hueso con la médula ósea donde se fabrican, junto a las pruebas principales: hemograma, frotis y biopsia de médula. A la derecha, las enfermedades que trata la hematología: anemias, leucemias, linfomas y mieloma, hemofilia, trombosis y transfusión y trasplante.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="460" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="50" text-anchor="middle" class="title">Lo que estudia la hematología</text>
  <path d="M40 120 H460" stroke="var(--vessel)" stroke-width="110" opacity=".15"/>
  <ellipse cx="90" cy="110" rx="24" ry="20" fill="var(--vessel)"/><ellipse cx="90" cy="110" rx="10" ry="8" fill="var(--bad)" opacity=".5"/>
  <ellipse cx="170" cy="140" rx="24" ry="20" fill="var(--vessel)"/><ellipse cx="170" cy="140" rx="10" ry="8" fill="var(--bad)" opacity=".5"/>
  <ellipse cx="250" cy="100" rx="24" ry="20" fill="var(--vessel)"/><ellipse cx="250" cy="100" rx="10" ry="8" fill="var(--bad)" opacity=".5"/>
  <ellipse cx="330" cy="130" rx="24" ry="20" fill="var(--vessel)"/><ellipse cx="330" cy="130" rx="10" ry="8" fill="var(--bad)" opacity=".5"/>
  <ellipse cx="410" cy="104" rx="24" ry="20" fill="var(--vessel)"/><ellipse cx="410" cy="104" rx="10" ry="8" fill="var(--bad)" opacity=".5"/>
  <circle cx="210" cy="96" r="20" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2"/><path d="M200 92 q10 -10 18 4 q-6 10 -16 4" fill="var(--purple)"/>
  <ellipse cx="130" cy="90" rx="7" ry="4" fill="var(--warn)"/>
  <ellipse cx="290" cy="150" rx="7" ry="4" fill="var(--warn)"/>
  <ellipse cx="370" cy="90" rx="7" ry="4" fill="var(--warn)"/>
  <ellipse cx="130" cy="150" rx="7" ry="4" fill="var(--warn)"/>
  <text x="90" y="198" text-anchor="middle" class="small">Glóbulos rojos</text>
  <text x="210" y="198" text-anchor="middle" class="small">Glóbulos blancos</text>
  <text x="330" y="198" text-anchor="middle" class="small">Plaquetas</text>
  <path d="M80 250 C80 230 180 230 180 250 V360 C180 380 80 380 80 360 Z" fill="var(--bone)" stroke="var(--line)"/>
  <path d="M100 260 H160 V350 H100 Z" fill="var(--bad)" opacity=".35"/>
  <text x="130" y="398" text-anchor="middle" class="step">Médula ósea</text>
  <text x="130" y="416" text-anchor="middle" class="small">donde se fabrican</text>
  <path d="M184 300 L230 300" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="264" class="small">También ganglios, bazo y</text>
  <text x="240" y="282" class="small">proteínas de la coagulación</text>
  <text x="240" y="330" class="step">Pruebas</text>
  <text x="240" y="354" class="small">• Hemograma</text>
  <text x="240" y="376" class="small">• Frotis de sangre</text>
  <text x="240" y="398" class="small">• Biopsia de médula</text>
  <rect x="500" y="20" width="280" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="50" text-anchor="middle" class="title">Enfermedades que trata</text>
  <rect x="520" y="60" width="240" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="85.0" text-anchor="middle" class="lab">Anemias</text>
  <rect x="520" y="112" width="240" height="40" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="640.0" y="137.0" text-anchor="middle" class="lab">Leucemias</text>
  <rect x="520" y="164" width="240" height="40" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="640.0" y="189.0" text-anchor="middle" class="lab">Linfomas y mieloma</text>
  <rect x="520" y="216" width="240" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="241.0" text-anchor="middle" class="lab">Hemofilia y sangrados</text>
  <rect x="520" y="268" width="240" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="293.0" text-anchor="middle" class="lab">Trombosis</text>
  <rect x="520" y="320" width="240" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="640.0" y="345.0" text-anchor="middle" class="lab">Transfusión y trasplante</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
