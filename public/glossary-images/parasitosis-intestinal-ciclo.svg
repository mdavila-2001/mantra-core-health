<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de las lombrices intestinales transmitidas por el suelo</title>
  <desc id="d">Esquema de cuatro pasos en círculo. Uno: las personas infectadas eliminan huevos por las heces. Dos: sin saneamiento adecuado los huevos contaminan el suelo y tardan unas tres semanas en volverse infectantes. Tres: otras personas se infectan al tragar huevos con verduras mal lavadas, agua contaminada o manos sucias; el anquilostoma entra además por la piel al caminar descalzo. Cuatro: los gusanos adultos viven en el intestino y producen miles de huevos al día.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#1f6fb2; --a-l:#d6e6f5; --b:#b7791f; --b-l:#f7e4bf; --c:#c0392b; --c-l:#f6d5cf; --d:#1f8a5b; --d-l:#d7f0e4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#6aa7e8; --a-l:#1f3347; --b:#e0b25a; --b-l:#4a3b1f; --c:#ef7467; --c-l:#4a2a27; --d:#4cc38a; --d-l:#1f4033; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Lombrices del suelo: de las heces a la boca o a la piel</text>

  <rect x="60" y="86" width="270" height="110" rx="10" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="195" y="112" text-anchor="middle" class="hd" style="fill:var(--a)">1 · Heces con huevos</text>
  <text x="195" y="138" text-anchor="middle" class="lab">Personas infectadas eliminan</text>
  <text x="195" y="156" text-anchor="middle" class="lab">huevos por las heces</text>
  <text x="195" y="180" text-anchor="middle" class="small muted">Sin baño o letrina</text>

  <rect x="470" y="86" width="270" height="110" rx="10" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="605" y="112" text-anchor="middle" class="hd" style="fill:var(--b)">2 · Suelo contaminado</text>
  <text x="605" y="138" text-anchor="middle" class="lab">Los huevos maduran en la tierra</text>
  <text x="605" y="156" text-anchor="middle" class="lab">unas 3 semanas</text>
  <text x="605" y="180" text-anchor="middle" class="small muted">No hay contagio por heces frescas</text>

  <rect x="470" y="244" width="270" height="130" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="605" y="270" text-anchor="middle" class="hd" style="fill:var(--c)">3 · Infección</text>
  <text x="605" y="296" text-anchor="middle" class="lab">Verduras mal lavadas, agua</text>
  <text x="605" y="314" text-anchor="middle" class="lab">contaminada, manos sucias</text>
  <text x="605" y="340" text-anchor="middle" class="lab">Anquilostoma: entra por la piel</text>
  <text x="605" y="358" text-anchor="middle" class="lab">al caminar descalzo</text>

  <rect x="60" y="244" width="270" height="130" rx="10" fill="var(--d-l)" stroke="var(--d)" stroke-width="2"/>
  <text x="195" y="270" text-anchor="middle" class="hd" style="fill:var(--d)">4 · Gusanos en el intestino</text>
  <text x="195" y="296" text-anchor="middle" class="lab">Viven en el intestino y</text>
  <text x="195" y="314" text-anchor="middle" class="lab">producen miles de huevos al día</text>
  <text x="195" y="340" text-anchor="middle" class="small muted">Pocos gusanos: suelen no dar síntomas</text>
  <text x="195" y="358" text-anchor="middle" class="small muted">Muchos: diarrea, anemia, desnutrición</text>

  <path d="M330 141 L 465 141" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M605 196 L 605 240" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M470 309 L 335 309" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M195 244 L 195 200" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <text x="400" y="406" text-anchor="middle" class="small muted">Se corta el ciclo con baños, agua segura, higiene, calzado y desparasitación periódica</text>
</svg>
