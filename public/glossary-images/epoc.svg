<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">EPOC: bronquitis crónica y enfisema</title>
  <desc id="d">Pulmones con bronquios y alvéolos señalados. A la derecha, un bronquio normal frente a uno inflamado con moco y alvéolos normales frente a alvéolos destruidos, más los síntomas, el diagnóstico por espirometría y el tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="340" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="190.0" y="50" text-anchor="middle" class="title">Pulmones afectados</text>
<path d="M171.8,129.0 Q99.0,116.0 73.0,272.0 Q70.4,337.0 112.0,337.0 Q164.0,324.0 166.6,272.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M208.2,129.0 Q281.0,116.0 307.0,272.0 Q309.6,337.0 268.0,337.0 Q216.0,324.0 213.4,272.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190,64.0 L190,168.0 M190,168.0 Q164.0,181.0 138.0,220 M190,168.0 Q216.0,181.0 242.0,220 M151.0,201.8 L112.0,246.0 M138.0,220 L132.8,285.0 M229.0,201.8 L268.0,246.0 M242.0,220 L247.2,285.0" fill="none" stroke="var(--accent)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="110" cy="250" r="30" fill="none" stroke="var(--purple)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="270" cy="200" r="30" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
<text x="110" y="310" text-anchor="middle" class="small" style="fill:var(--purple)">Alvéolos</text>
<text x="270" y="256" text-anchor="middle" class="small" style="fill:var(--warn)">Bronquios</text>
<text x="190" y="386" text-anchor="middle" class="lab">Causa principal: humo de tabaco</text>
<text x="190" y="406" text-anchor="middle" class="small" style="fill:var(--muted)">(también humo de leña, polución)</text>
<rect x="376" y="20" width="404" height="250" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="578.0" y="50" text-anchor="middle" class="title">Dos componentes</text>
<text x="476" y="76" text-anchor="middle" class="step">Bronquitis crónica</text>
<circle cx="436" cy="130" r="40" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="436" cy="130" r="26" fill="var(--panel)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="516" cy="130" r="40" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="516" cy="130" r="12" fill="var(--beam)" stroke="var(--warn)" stroke-width="2"/>
<path d="M494,130 Q500,118 508,124" fill="none" stroke="var(--warn)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="436" y="190" text-anchor="middle" class="small">Normal</text>
<text x="516" y="190" text-anchor="middle" class="small">Inflamada,</text>
<text x="516" y="206" text-anchor="middle" class="small">con moco</text>
<text x="676" y="76" text-anchor="middle" class="step">Enfisema</text>
<circle cx="616" cy="110" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<circle cx="636" cy="98" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<circle cx="656" cy="112" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<circle cx="626" cy="130" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<circle cx="646" cy="130" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<circle cx="636" cy="148" r="11" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5"/>
<path d="M720,96 Q750,90 756,120 Q760,150 730,156 Q700,150 702,120 Q704,100 720,96 Z" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="636" y="190" text-anchor="middle" class="small">Normal</text>
<text x="730" y="190" text-anchor="middle" class="small">Alvéolos</text>
<text x="730" y="206" text-anchor="middle" class="small">destruidos</text>
<text x="578" y="250" text-anchor="middle" class="lab" style="fill:var(--muted)">El aire queda atrapado y cuesta sacarlo.</text>
<rect x="376" y="286" width="404" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="392" y="312" class="lab">Síntomas: tos, flemas, falta de aire.</text>
<text x="392" y="336" class="lab">Diagnóstico: espirometría.</text>
<text x="392" y="366" class="step">Tratamiento</text>
<text x="392" y="388" class="lab">Dejar de fumar, inhaladores,</text>
<text x="392" y="408" class="lab">vacunas y rehabilitación respiratoria.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
