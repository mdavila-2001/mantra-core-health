<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo se hace una radiografía de abdomen</title>
  <desc id="d">A la izquierda, un tubo de rayos X sobre un paciente acostado y el detector debajo. A la derecha, un esquema de radiografía abdominal con la columna y la pelvis claras y burbujas de gas oscuras, junto a la lista de lo que puede mostrar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Radiografía de abdomen: una imagen simple con rayos X</text>
  <rect x="20" y="60" width="340" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="190.0" y="88" text-anchor="middle" class="h">Cómo se toma</text>
  <rect x="110" y="106" width="160" height="32" rx="8" fill="var(--accent)" stroke="none"/>
  <text x="190" y="127" text-anchor="middle" class="lab" style="fill:var(--on)">Tubo de rayos X</text>
  <polygon points="165,138 215,138 300,300 80,300" fill="var(--beam)" opacity=".4"/>
  <rect x="60" y="240" width="260" height="50" rx="24" fill="var(--skin)" stroke="var(--muted)"/>
  <text x="190" y="270" text-anchor="middle" class="lab">Paciente acostado</text>
  <rect x="60" y="300" width="260" height="28" rx="6" fill="var(--accent)" stroke="none"/>
  <text x="190" y="319" text-anchor="middle" class="lab" style="fill:var(--on)">Detector</text>
  <text x="190" y="360" text-anchor="middle" class="small">También puede hacerse de pie</text>
  <text x="190" y="378" text-anchor="middle" class="small">para ver niveles de líquido y gas</text>
  <text x="190" y="414" text-anchor="middle" class="small muted">Dura segundos; usa poca radiación</text>
  <rect x="376" y="60" width="404" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="578.0" y="88" text-anchor="middle" class="title">Qué se ve</text>
  <rect x="400" y="104" width="170" height="290" rx="10" fill="#4f5a66" stroke="none"/>
  <rect x="476" y="116" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <rect x="476" y="150" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <rect x="476" y="184" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <rect x="476" y="218" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <rect x="476" y="252" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <rect x="476" y="286" width="18" height="26" rx="4" fill="#e9e4d6" stroke="none"/>
  <path d="M420 330 C430 380 470 390 485 370 M565 330 C555 380 515 390 500 370" fill="none" stroke="#e9e4d6" stroke-width="6"/>
  <ellipse cx="430" cy="160" rx="18" ry="12" fill="#161b21" stroke="none"/>
  <ellipse cx="530" cy="150" rx="22" ry="12" fill="#161b21" stroke="none"/>
  <ellipse cx="440" cy="250" rx="16" ry="10" fill="#161b21" stroke="none"/>
  <ellipse cx="540" cy="260" rx="20" ry="11" fill="#161b21" stroke="none"/>
  <ellipse cx="500" cy="320" rx="14" ry="9" fill="#161b21" stroke="none"/>
  <text x="485" y="412" text-anchor="middle" class="small muted">Gas oscuro, hueso claro</text>
  <text x="588" y="120" class="lab">• Patrón del gas</text>
  <text x="599" y="150" class="lab">intestinal</text>
  <text x="588" y="180" class="lab">• Obstrucción o</text>
  <text x="599" y="210" class="lab">perforación</text>
  <text x="588" y="240" class="lab">• Cálculos que</text>
  <text x="599" y="270" class="lab">absorben rayos X</text>
  <text x="588" y="300" class="lab">• Objetos tragados</text>
  <text x="588" y="330" class="lab">• Posición de sondas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
