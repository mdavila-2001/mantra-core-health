<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo se realiza una mamografía diagnóstica</title>
  <desc id="d">A la izquierda, la mama comprimida entre una placa y el detector bajo el tubo de rayos X, con un pequeño hallazgo marcado. A la derecha, la diferencia entre mamografía de detección y diagnóstica, los motivos para pedirla y los estudios que la complementan.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Mamografía diagnóstica: estudiar un hallazgo concreto</text>
  <rect x="20" y="60" width="360" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="90" text-anchor="middle" class="title">Cómo se toma</text>
  <rect x="120" y="106" width="140" height="32" rx="8" fill="var(--accent)" stroke="none"/>
  <text x="190" y="127" text-anchor="middle" class="lab" style="fill:var(--on)">Tubo de rayos X</text>
  <polygon points="160,138 220,138 270,300 110,300" fill="var(--beam)" opacity=".45"/>
  <rect x="90" y="216" width="200" height="12" rx="3" fill="var(--muted)" stroke="none"/>
  <text x="190" y="209" text-anchor="middle" class="small">Placa de compresión</text>
  <path d="M95 230 C120 290 230 300 285 230 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="205" cy="255" r="7" fill="var(--warn)" stroke="none"/>
  <rect x="90" y="290" width="200" height="14" rx="3" fill="var(--accent)" stroke="none"/>
  <text x="300" y="302" class="small">Detector</text>
  <text x="200" y="345" text-anchor="middle" class="small">La mama se aplana unos segundos</text>
  <text x="200" y="363" text-anchor="middle" class="small">para ver mejor y usar menos radiación</text>
  <text x="200" y="400" text-anchor="middle" class="small muted">Proyecciones adicionales: con lupa</text>
  <text x="200" y="416" text-anchor="middle" class="small muted">o compresión localizada</text>
  <rect x="396" y="60" width="384" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="90" text-anchor="middle" class="title">Cuándo se pide</text>
  <rect x="414" y="104" width="168" height="62" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="498.0" y="132.0" text-anchor="middle" class="lab b">Detección</text>
  <text x="498.0" y="149.0" text-anchor="middle" class="small muted">mujer sin síntomas</text>
  <rect x="594" y="104" width="168" height="62" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="678.0" y="132.0" text-anchor="middle" class="lab b">Diagnóstica</text>
  <text x="678.0" y="149.0" text-anchor="middle" class="small muted">hay un motivo</text>
  <text x="414" y="206" class="lab">• Bulto o engrosamiento</text>
  <text x="414" y="232" class="lab">• Secreción por el pezón</text>
  <text x="414" y="258" class="lab">• Cambios en la piel o el pezón</text>
  <text x="414" y="284" class="lab">• Hallazgo en una mamografía previa</text>
  <text x="414" y="310" class="lab">• Control tras un tratamiento</text>
  <text x="414" y="354" class="lab b">Suele completarse con:</text>
  <text x="414" y="380" class="lab">• Ecografía mamaria</text>
  <text x="414" y="404" class="lab">• Biopsia si hace falta</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
