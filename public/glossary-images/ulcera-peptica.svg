<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Úlcera péptica</title>
  <desc id="d">A la izquierda, el estómago y el duodeno con una úlcera en cada uno, heridas en la mucosa que el ácido no deja cicatrizar. A la derecha, las causas principales, Helicobacter pylori y los antiinflamatorios, los síntomas y las señales de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Dónde aparece</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Causas y señales</text>
<path d="M170 70 C182.5 95.0 157.5 120.0 120.0 157.5 C82.5 207.5 132.5 257.5 195.0 245.0 C245.0 232.5 270.0 207.5 282.5 195.0 L295.0 207.5 L307.5 190.0 C257.5 182.5 232.5 157.5 220.0 107.5 C215.0 82.5 207.5 70 200.0 62.5 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M170 70 L176 54" fill="none" stroke="var(--organ)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M306 196 C326 200 340 220 336 250 C332 280 312 300 300 330" fill="none" stroke="var(--organ)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M306 196 C326 200 340 220 336 250 C332 280 312 300 300 330" fill="none" stroke="var(--organ-l)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="220" cy="200" rx="12" ry="9" fill="var(--bad)"/>
<ellipse cx="330" cy="232" rx="9" ry="7" fill="var(--bad)"/>
<text x="180" y="150" text-anchor="middle" class="lab">Estómago</text>
<text x="200" y="228" text-anchor="middle" class="small" style="fill:var(--bad)">Úlcera gástrica</text>
<text x="240" y="340" text-anchor="end" class="small" style="fill:var(--muted)">Duodeno</text>
<text x="318" y="240" text-anchor="end" class="small" style="fill:var(--bad)">Úlcera</text>
<rect x="40" y="360" width="320" height="64" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="56" y="384" class="small">Herida abierta en la mucosa que el</text>
<text x="56" y="402" class="small">ácido no deja cicatrizar.</text>
<text x="416" y="76" class="h">Causas principales</text>
<rect x="416" y="90" width="166" height="70" rx="10" fill="var(--warn-l)"/>
<text x="499" y="118" text-anchor="middle" class="step">Helicobacter</text>
<text x="499" y="138" text-anchor="middle" class="step">pylori</text>
<rect x="594" y="90" width="166" height="70" rx="10" fill="var(--purple-l)"/>
<text x="677" y="118" text-anchor="middle" class="step">Antiinflamatorios</text>
<text x="677" y="138" text-anchor="middle" class="small">y aspirina</text>
<text x="416" y="190" class="small" style="fill:var(--muted)">Tabaco y alcohol empeoran la curación.</text>
<text x="416" y="228" class="h">Síntomas</text>
<text x="416" y="254" class="lab">• Ardor en la boca del estómago</text>
<text x="416" y="276" class="lab">• Dolor que cambia con las comidas</text>
<text x="416" y="298" class="lab">• Náuseas</text>
<rect x="416" y="330" width="344" height="90" rx="10" fill="var(--bad-l)"/>
<text x="432" y="354" class="step" style="fill:var(--bad)">Urgencia si hay</text>
<text x="432" y="376" class="small">Vómito con sangre, heces negras o</text>
<text x="432" y="394" class="small">dolor brusco e intenso.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
