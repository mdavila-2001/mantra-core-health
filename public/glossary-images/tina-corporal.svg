<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tiña corporal: infección por hongos de la piel</title>
  <desc id="d">A la izquierda, una mancha en forma de anillo con el borde rojo y escamoso y el centro más claro, que crece hacia afuera. A la derecha, las fuentes de contagio, como personas, mascotas y objetos, el tratamiento con cremas antifúngicas y lo que conviene evitar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo es la lesión</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Contagio y tratamiento</text>
<rect x="40" y="70" width="320" height="260" rx="12" fill="var(--skin)"/>
<circle cx="200" cy="200" r="92" fill="var(--skin)"/>
<circle cx="200" cy="200" r="86" fill="none" stroke="var(--bad)" stroke-width="12" opacity=".55"/>
<circle cx="286.0" cy="200.0" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="277.5" cy="237.3" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="253.6" cy="267.2" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="219.1" cy="283.8" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="180.9" cy="283.8" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="146.4" cy="267.2" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="122.5" cy="237.3" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="114.0" cy="200.0" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="122.5" cy="162.7" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="146.4" cy="132.8" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="180.9" cy="116.2" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="219.1" cy="116.2" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="253.6" cy="132.8" r="3" fill="var(--panel)" opacity=".8"/>
<circle cx="277.5" cy="162.7" r="3" fill="var(--panel)" opacity=".8"/>
<text x="200" y="196" text-anchor="middle" class="small" style="fill:var(--muted)">Centro más claro</text>
<text x="200" y="212" text-anchor="middle" class="small" style="fill:var(--muted)">(piel casi normal)</text>
<text x="276" y="96" class="small" style="fill:var(--bad)">Borde rojo,</text>
<text x="276" y="112" class="small" style="fill:var(--bad)">con escamas</text>
<text x="200" y="362" text-anchor="middle" class="lab">Mancha en anillo que crece hacia afuera</text>
<text x="200" y="382" text-anchor="middle" class="lab">y pica. No la causa un gusano: es un hongo.</text>
<text x="200" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Se confirma con raspado si hay dudas.</text>
<text x="416" y="76" class="h">Se contagia por contacto con</text>
<rect x="416" y="92" width="106" height="36" rx="8" fill="var(--accent)"/>
<text x="469.0" y="114.3" text-anchor="middle" class="small" style="fill:var(--on)">Personas</text>
<rect x="532" y="92" width="106" height="36" rx="8" fill="var(--warn)"/>
<text x="585.0" y="114.3" text-anchor="middle" class="small" style="fill:var(--on)">Mascotas</text>
<rect x="648" y="92" width="106" height="36" rx="8" fill="var(--purple)"/>
<text x="701.0" y="114.3" text-anchor="middle" class="small" style="fill:var(--on)">Objetos</text>
<text x="416" y="152" class="small" style="fill:var(--muted)">Toallas, ropa, suelos húmedos, gimnasios.</text>
<text x="416" y="196" class="h">Tratamiento</text>
<text x="416" y="222" class="lab">• Crema antifúngica varias semanas</text>
<text x="416" y="246" class="lab">• Seguir unos días tras mejorar</text>
<text x="416" y="270" class="lab">• Pastillas si es extensa</text>
<text x="416" y="314" class="h" style="fill:var(--bad)">Evitar</text>
<text x="416" y="340" class="lab">• Cremas con corticoide solas:</text>
<text x="427" y="364" class="lab">pueden empeorarla</text>
<text x="416" y="388" class="lab">• Compartir toallas</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
