<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hiperprolactinemia: causas y efectos</title>
  <desc id="d">A la izquierda, la hipófisis produce demasiada prolactina y se conectan cuatro causas: prolactinoma, medicamentos, hipotiroidismo y embarazo. A la derecha, los efectos en mujeres, como reglas irregulares y salida de leche; en hombres, como menos deseo sexual; y en ambos, como pérdida de masa ósea, además del tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Causas del exceso</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Efectos</text>
<ellipse cx="200" cy="120" rx="150" ry="56" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2"/>
<text x="200" y="112" text-anchor="middle" class="h" style="fill:var(--purple)">Hipófisis</text>
<text x="200" y="134" text-anchor="middle" class="small">produce demasiada prolactina</text>
<line x1="200" y1="176" x2="200" y2="346" stroke="var(--purple)" stroke-width="3"/>
<rect x="40" y="204" width="150" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="115" y="226" text-anchor="middle" class="step">Prolactinoma</text>
<text x="115" y="246" text-anchor="middle" class="small" style="fill:var(--muted)">tumor benigno</text>
<rect x="210" y="204" width="150" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="285" y="226" text-anchor="middle" class="step">Medicamentos</text>
<text x="285" y="246" text-anchor="middle" class="small" style="fill:var(--muted)">antipsicóticos, otros</text>
<rect x="40" y="294" width="150" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="115" y="316" text-anchor="middle" class="step">Hipotiroidismo</text>
<text x="115" y="336" text-anchor="middle" class="small" style="fill:var(--muted)">tiroides lenta</text>
<rect x="210" y="294" width="150" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="285" y="316" text-anchor="middle" class="step">Embarazo</text>
<text x="285" y="336" text-anchor="middle" class="small" style="fill:var(--muted)">causa normal</text>
<text x="200" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">También: estrés, enfermedad renal,</text>
<text x="200" y="416" text-anchor="middle" class="small" style="fill:var(--muted)">lesiones del tallo hipofisario.</text>
<text x="416" y="80" class="h" style="fill:var(--vessel)">Mujeres</text>
<text x="500" y="80" class="small">• Reglas irregulares o ausentes</text>
<text x="500" y="102" class="small">• Salida de leche</text>
<text x="500" y="124" class="small">• Infertilidad</text>
<text x="416" y="170" class="h" style="fill:var(--accent)">Hombres</text>
<text x="500" y="170" class="small">• Menos deseo sexual</text>
<text x="500" y="192" class="small">• Disfunción eréctil</text>
<text x="500" y="214" class="small">• Aumento de mamas</text>
<text x="416" y="260" class="h" style="fill:var(--purple)">Ambos</text>
<text x="500" y="260" class="small">• Pérdida de masa ósea</text>
<text x="500" y="282" class="small">• Si hay tumor grande:</text>
<text x="511" y="304" class="small">dolor de cabeza y visión</text>
<rect x="416" y="352" width="344" height="66" rx="10" fill="var(--ok-l)"/>
<text x="432" y="376" class="small">Tratamiento según la causa; los fármacos</text>
<text x="432" y="394" class="small">agonistas de dopamina reducen la prolactina.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
