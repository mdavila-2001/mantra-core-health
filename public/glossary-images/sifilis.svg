<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Sífilis</title>
  <desc id="d">Línea de tiempo con las cuatro fases de la sífilis sin tratamiento: primaria con una úlcera indolora, secundaria con erupción también en palmas y plantas, latente sin síntomas y terciaria con daño de corazón, cerebro o huesos en una minoría. Debajo, el diagnóstico con análisis de sangre y el tratamiento con penicilina.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="270" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Las fases de la sífilis sin tratamiento</text>
  <path d="M60 120 H740" fill="none" stroke="var(--line)" stroke-width="4"/>
  <circle cx="115" cy="120" r="26" fill="var(--warn)"/>
  <text x="115" y="170" text-anchor="middle" class="step">Primaria</text>
  <text x="115" y="194" text-anchor="middle" class="small">Úlcera indolora</text>
  <text x="115" y="212" text-anchor="middle" class="small muted">en la zona de contacto</text>
  <circle cx="305" cy="120" r="26" fill="var(--purple)"/>
  <text x="305" y="170" text-anchor="middle" class="step">Secundaria</text>
  <text x="305" y="194" text-anchor="middle" class="small">Erupción, también</text>
  <text x="305" y="212" text-anchor="middle" class="small muted">en palmas y plantas</text>
  <circle cx="495" cy="120" r="26" fill="var(--muted)"/>
  <text x="495" y="170" text-anchor="middle" class="step">Latente</text>
  <text x="495" y="194" text-anchor="middle" class="small">Sin síntomas</text>
  <text x="495" y="212" text-anchor="middle" class="small muted">puede durar años</text>
  <circle cx="685" cy="120" r="26" fill="var(--vessel)"/>
  <text x="685" y="170" text-anchor="middle" class="step">Terciaria</text>
  <text x="685" y="194" text-anchor="middle" class="small">Corazón, cerebro,</text>
  <text x="685" y="212" text-anchor="middle" class="small muted">huesos (minoría)</text>
  <circle cx="115" cy="120" r="8" fill="var(--panel)"/>
  <circle cx="297" cy="114" r="3" fill="var(--panel)"/>
  <circle cx="311" cy="112" r="3" fill="var(--panel)"/>
  <circle cx="305" cy="126" r="3" fill="var(--panel)"/>
  <circle cx="299" cy="128" r="3" fill="var(--panel)"/>
  <circle cx="314" cy="124" r="3" fill="var(--panel)"/>
  <text x="400" y="254" text-anchor="middle" class="lab">Treponema pallidum: se transmite por vía sexual y de madre a feto</text>
  <rect x="20" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="336" text-anchor="middle" class="title">Diagnóstico</text>
  <rect x="42" y="336" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M44 352 V416 a15 15 0 0 0 30 0 V352 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M46 382 V416 a13 13 0 0 0 26 0 V382 Z" fill="var(--vessel)"/>
  <text x="94" y="366" class="lab">Análisis de sangre</text>
  <text x="94" y="388" class="small muted">(pruebas treponémicas</text>
  <text x="94" y="406" class="small muted">y no treponémicas)</text>
  <rect x="410" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="336" text-anchor="middle" class="title">Tratamiento y prevención</text>
  <text x="430" y="362" class="lab">• Se cura con antibiótico (penicilina)</text>
  <text x="430" y="386" class="lab">• Preservativo y control en el embarazo</text>
  <text x="430" y="410" class="lab">• Tratar también a la pareja</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
