<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">La fiebre y el termostato del cuerpo</title>
  <desc id="d">A la izquierda, una cabeza de perfil con el hipotálamo señalado como termostato; los pirógenos liberados por las defensas llegan por la sangre y suben la temperatura de referencia. A la derecha, un termómetro y dos fases: al subir la fiebre aparecen frío, escalofríos y piel pálida; al bajar aparecen calor, sudor y piel enrojecida.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --head:#f1dccb; --brain:#e7c3d0; --hot:#d0503a; --cold:#3b8fd6; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --head:#5a4a40; --brain:#74505d; --hot:#ef7467; --cold:#7ab8ec; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <!-- Panel izquierdo -->
  <rect x="20" y="20" width="370" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205" y="50" text-anchor="middle" class="title">El hipotálamo, el termostato</text>
  <path d="M110 330 C80 300 70 240 90 190 C110 130 170 100 230 110 C290 120 320 170 315 230 C312 260 300 270 305 290 L320 315 L300 320 L300 345 C300 360 285 365 270 362 L250 360 L248 400 H140 L142 360 C125 350 115 340 110 330 Z" fill="var(--head)" stroke="var(--line)"/>
  <path d="M120 200 C130 150 180 125 230 132 C280 140 300 180 292 220 C284 250 230 255 190 250 C150 246 115 240 120 200 Z" fill="var(--brain)" opacity=".85"/>
  <circle cx="215" cy="240" r="14" fill="var(--hot)"/>
  <line x1="215" y1="240" x2="215" y2="232" stroke="var(--on)" stroke-width="3" stroke-linecap="round"/>
  <line x1="226" y1="248" x2="330" y2="300" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="300" y="318" class="lab">Hipotálamo</text>

  <!-- pirógenos -->
  <circle cx="70" cy="390" r="7" fill="var(--hot)"/>
  <circle cx="92" cy="372" r="6" fill="var(--hot)"/>
  <circle cx="60" cy="362" r="5" fill="var(--hot)"/>
  <path d="M100 360 C150 330 180 300 205 258" fill="none" stroke="var(--hot)" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="205,256 198,270 212,268" fill="var(--hot)"/>
  <text x="40" y="424" class="small">Pirógenos de las defensas</text>
  <text x="40" y="78" class="small muted">Sube la temperatura de referencia:</text>
  <text x="40" y="94" class="small muted">el cerebro «siente frío» y produce calor.</text>

  <!-- Panel derecho -->
  <rect x="406" y="20" width="374" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="593" y="50" text-anchor="middle" class="title">Qué siente el cuerpo</text>

  <!-- termómetro -->
  <rect x="436" y="80" width="26" height="270" rx="13" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/>
  <rect x="443" y="150" width="12" height="210" rx="6" fill="var(--hot)"/>
  <circle cx="449" cy="372" r="22" fill="var(--hot)"/>
  <line x1="462" y1="120" x2="472" y2="120" stroke="var(--muted)" stroke-width="2"/>
  <line x1="462" y1="170" x2="472" y2="170" stroke="var(--muted)" stroke-width="2"/>
  <line x1="462" y1="220" x2="472" y2="220" stroke="var(--muted)" stroke-width="2"/>
  <line x1="462" y1="270" x2="472" y2="270" stroke="var(--muted)" stroke-width="2"/>

  <!-- fase subida -->
  <rect x="492" y="80" width="268" height="140" rx="10" fill="none" stroke="var(--cold)" stroke-width="2"/>
  <text x="508" y="106" class="step" style="fill:var(--cold)">Al subir la fiebre</text>
  <text x="508" y="132" class="lab">• Sensación de frío</text>
  <text x="508" y="154" class="lab">• Escalofríos y temblor</text>
  <text x="508" y="176" class="lab">• Piel pálida, manos frías</text>
  <text x="508" y="200" class="small muted">El cuerpo genera y conserva calor</text>

  <!-- fase bajada -->
  <rect x="492" y="236" width="268" height="140" rx="10" fill="none" stroke="var(--hot)" stroke-width="2"/>
  <text x="508" y="262" class="step" style="fill:var(--hot)">Al bajar la fiebre</text>
  <text x="508" y="288" class="lab">• Sensación de calor</text>
  <text x="508" y="310" class="lab">• Sudor</text>
  <text x="508" y="332" class="lab">• Piel enrojecida</text>
  <text x="508" y="356" class="small muted">El cuerpo elimina el calor sobrante</text>

  <text x="593" y="410" text-anchor="middle" class="small" style="fill:var(--ok)">Lo más importante: cómo está la persona</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
