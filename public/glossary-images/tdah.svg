<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Síntomas y abordaje del TDAH</title>
  <desc id="d">Tres recuadros con los grupos de síntomas del TDAH: inatención, hiperactividad e impulsividad, con ejemplos. Abajo, los requisitos para el diagnóstico y los pilares del tratamiento combinado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Tres grupos de síntomas</text>
<rect x="60" y="56" width="220" height="160" rx="12" fill="var(--accent-l)" stroke-width="1"/>
<text x="170" y="84" text-anchor="middle" class="sub">Inatención</text>
<text x="74" y="118" class="lab">• Se distrae con facilidad</text>
<text x="74" y="144" class="lab">• Olvida y pierde cosas</text>
<text x="74" y="170" class="lab">• Le cuesta organizarse</text>
<rect x="290" y="56" width="220" height="160" rx="12" fill="var(--purple-l)" stroke-width="1"/>
<text x="400" y="84" text-anchor="middle" class="sub">Hiperactividad</text>
<text x="304" y="118" class="lab">• Se mueve sin parar</text>
<text x="304" y="144" class="lab">• Habla en exceso</text>
<text x="304" y="170" class="lab">• Le cuesta estar sentado</text>
<rect x="520" y="56" width="220" height="160" rx="12" fill="var(--warn-l)" stroke-width="1"/>
<text x="630" y="84" text-anchor="middle" class="sub">Impulsividad</text>
<text x="534" y="118" class="lab">• Interrumpe a otros</text>
<text x="534" y="144" class="lab">• No espera su turno</text>
<text x="534" y="170" class="lab">• Actúa sin pensar</text>
<text x="400" y="240" text-anchor="middle" class="small" style="fill:var(--muted)">Pueden predominar unos u otros (presentación combinada, inatenta o hiperactiva).</text>
<rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="316" text-anchor="middle" class="title">Para el diagnóstico</text>
<text x="36" y="344" class="lab">• Síntomas desde la infancia</text>
<text x="36" y="368" class="lab">• En dos ámbitos o más: casa, escuela</text>
<text x="36" y="392" class="lab">• Afectan al día a día</text>
<text x="36" y="416" class="lab">• Evaluación por un especialista</text>
<rect x="406" y="286" width="374" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="316" text-anchor="middle" class="title">Tratamiento combinado</text>
<text x="422" y="344" class="lab">• Información a familia y escuela</text>
<text x="422" y="368" class="lab">• Terapia conductual y apoyo escolar</text>
<text x="422" y="392" class="lab">• Medicación cuando está indicada</text>
<text x="422" y="416" class="lab">• También puede afectar a adultos</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
