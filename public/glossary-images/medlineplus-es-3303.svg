<text x="726" y="150" text-anchor="middle" class="small" style="fill:var(--muted)">Estómago</text>
<text x="726" y="166" text-anchor="middle" class="small" style="fill:var(--muted)">excluido</text>
<path d="M540 130 C540 180 500 200 500 250 C500 300 560 300 600 320" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M700 252 C690 290 650 300 600 320" fill="none" stroke="var(--ok)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 320 C620 340 640 360 640 400" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<text x="430" y="220" class="small" style="fill:var(--warn)">Asa</text>
<text x="430" y="236" class="small" style="fill:var(--warn)">alimentaria</text>
<text x="714" y="272" class="small" style="fill:var(--ok)">Jugos</text>
<text x="714" y="288" class="small" style="fill:var(--ok)">biliares</text>
<text x="660" y="400" class="small" style="fill:var(--muted)">Unión en Y</text>
<text x="416" y="424" class="small" style="fill:var(--muted)">Menos estómago y menos absorción</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
