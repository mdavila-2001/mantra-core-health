<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía para la obesidad: manga y bypass</title>
  <desc id="d">A la izquierda, la gastrectomía en manga: se extirpa gran parte del estómago y queda un tubo estrecho. A la derecha, el bypass gástrico en Y de Roux: una bolsa gástrica pequeña se une a un asa del intestino, el resto del estómago queda excluido y los jugos biliares se unen más abajo en forma de Y.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Gastrectomía en manga</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Bypass gástrico en Y de Roux</text>
<path d="M180 80 C192.0 104.0 168.0 128.0 132.0 164.0 C96.0 212.0 144.0 260.0 204.0 248.0 C252.0 236.0 276.0 212.0 288.0 200.0 L300.0 212.0 L312.0 195.2 C264.0 188.0 240.0 164.0 228.0 116.0 C223.2 92.0 216.0 80 208.8 72.8 Z" fill="var(--tissue)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" opacity=".7"/>
<path d="M212 74 C222 110 222 150 236 176 C252 200 280 206 308 202" fill="none" stroke="var(--organ)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M212 74 C222 110 222 150 236 176 C252 200 280 206 308 202" fill="none" stroke="var(--organ-l)" stroke-width="23" stroke-linejoin="round" stroke-linecap="round"/>
<text x="150" y="132" text-anchor="end" class="small" style="fill:var(--muted)">Parte</text>
<text x="150" y="148" text-anchor="end" class="small" style="fill:var(--muted)">extirpada</text>
<text x="250" y="112" class="lab">Tubo</text>
<text x="250" y="130" class="lab">estrecho</text>
<text x="40" y="80" class="small" style="fill:var(--muted)">Esófago</text>
<rect x="40" y="300" width="320" height="120" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<text x="56" y="326" class="lab">• Se extirpa gran parte del estómago</text>
<text x="56" y="350" class="lab">• Cabe menos comida</text>
<text x="56" y="374" class="lab">• Baja la hormona del hambre</text>
<text x="56" y="398" class="lab">• No cambia el recorrido intestinal</text>
