<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Recuperación después de una cirugía</title>
  <desc id="d">Arriba, cuatro fases de la recuperación: sala de recuperación, planta del hospital, alta y recuperación en casa. Abajo, los cuidados que aceleran la recuperación y los signos que obligan a consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="170" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Fases de la recuperación</text>
<rect x="40" y="64" width="156" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="118.0" y="93.5" text-anchor="middle" class="lab" style="fill:var(--on)">Sala de</text>
<text x="118.0" y="109.5" text-anchor="middle" class="lab" style="fill:var(--on)">recuperación</text>
<line x1="197" y1="97.0" x2="227" y2="97.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="64" width="156" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="308.0" y="93.5" text-anchor="middle" class="lab" style="fill:var(--on)">Planta del</text>
<text x="308.0" y="109.5" text-anchor="middle" class="lab" style="fill:var(--on)">hospital</text>
<line x1="387" y1="97.0" x2="417" y2="97.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="420" y="64" width="156" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="498.0" y="93.5" text-anchor="middle" class="lab" style="fill:var(--on)">Alta con</text>
<text x="498.0" y="109.5" text-anchor="middle" class="lab" style="fill:var(--on)">instrucciones</text>
<line x1="577" y1="97.0" x2="607" y2="97.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="610" y="64" width="156" height="66" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="688.0" y="93.5" text-anchor="middle" class="lab" style="fill:var(--on)">Recuperación</text>
<text x="688.0" y="109.5" text-anchor="middle" class="lab" style="fill:var(--on)">en casa</text>
<text x="118" y="154" text-anchor="middle" class="small" style="fill:var(--muted)">despertar, constantes</text>
<text x="308" y="154" text-anchor="middle" class="small" style="fill:var(--muted)">dolor, movilizarse</text>
<text x="498" y="154" text-anchor="middle" class="small" style="fill:var(--muted)">herida y fármacos</text>
<text x="688" y="154" text-anchor="middle" class="small" style="fill:var(--muted)">retorno gradual</text>
<rect x="20" y="206" width="370" height="234" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="236" text-anchor="middle" class="title">Cuidados que aceleran</text>
<text x="36" y="266" class="lab">• Levantarse y caminar pronto</text>
<text x="36" y="292" class="lab">• Respiraciones profundas y toser</text>
<text x="36" y="318" class="lab">• Controlar bien el dolor</text>
<text x="36" y="344" class="lab">• Comer y beber en cuanto se indique</text>
<text x="36" y="370" class="lab">• Mantener la herida limpia y seca</text>
<text x="36" y="396" class="lab">• Tomar la medicación indicada</text>
<rect x="406" y="206" width="374" height="234" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<rect x="422" y="222" width="342" height="196" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="434" y="244" class="step" style="fill:var(--warn)">Consultar si aparece:</text>
<text x="434" y="271" class="lab">• Fiebre o escalofríos</text>
<text x="434" y="298" class="lab">• Herida roja, caliente o que supura</text>
<text x="434" y="325" class="lab">• Dolor o hinchazón de una pierna</text>
<text x="434" y="352" class="lab">• Falta de aire o dolor en el pecho</text>
<text x="434" y="379" class="lab">• Vómitos persistentes, no orinar</text>
<text x="434" y="406" class="lab">• Dolor que no cede con la medicación</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
