<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Alvéolo sano y alvéolo con neumonía</title>
  <desc id="d">Dos dibujos de un alvéolo pulmonar rodeado de un capilar sanguíneo. A la izquierda, el alvéolo está lleno de aire y el oxígeno pasa a la sangre. A la derecha, con neumonía, el alvéolo está ocupado por líquido, pus y células de defensa, y el paso de oxígeno a la sangre queda limitado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --air:#eaf3fb; --wall:#e9b3a6; --cap:#c0392b; --pus:#e7c85a; --cell:#8b5cf6; --o2:#1f8a5b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --air:#0f1720; --wall:#8a4a40; --cap:#ef7467; --pus:#b39a35; --cell:#a78bfa; --o2:#4cc38a; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>

  <rect x="20" y="20" width="370" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205" y="52" text-anchor="middle" class="title">Alvéolo sano</text>
  <circle cx="205" cy="215" r="112" fill="none" stroke="var(--cap)" stroke-width="14" opacity="0.8"/>
  <circle cx="205" cy="215" r="100" fill="var(--wall)"/>
  <circle cx="205" cy="215" r="90" fill="var(--air)" stroke="var(--line)"/>
  <text x="205" y="212" text-anchor="middle" class="lab">Aire</text>
  <text x="205" y="232" text-anchor="middle" class="small muted">en el alvéolo</text>
  <g fill="var(--o2)" class="lab">
    <circle cx="205" cy="104" r="7"/><circle cx="305" cy="162" r="7"/><circle cx="105" cy="162" r="7"/>
  </g>
  <text x="205" y="378" text-anchor="middle" class="lab">El oxígeno pasa a la sangre</text>
  <text x="205" y="398" text-anchor="middle" class="small muted">Capilar (rojo) rodeando el alvéolo</text>

  <rect x="410" y="20" width="370" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595" y="52" text-anchor="middle" class="title">Alvéolo con neumonía</text>
  <circle cx="595" cy="215" r="112" fill="none" stroke="var(--cap)" stroke-width="14" opacity="0.8"/>
  <circle cx="595" cy="215" r="100" fill="var(--wall)"/>
  <circle cx="595" cy="215" r="90" fill="var(--pus)" stroke="var(--line)"/>
  <g fill="var(--cell)">
    <circle cx="560" cy="190" r="10"/><circle cx="610" cy="175" r="10"/><circle cx="635" cy="225" r="10"/><circle cx="575" cy="245" r="10"/><circle cx="600" cy="215" r="10"/>
  </g>
  <text x="595" y="288" text-anchor="middle" class="lab" style="fill:var(--ink)">Líquido, pus y células</text>
  <text x="595" y="378" text-anchor="middle" class="lab">Entra poco oxígeno a la sangre</text>
  <text x="595" y="398" text-anchor="middle" class="small muted">Respirar duele y cuesta más</text>
</svg>
