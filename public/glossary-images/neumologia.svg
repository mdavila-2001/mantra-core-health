<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Neumología</title>
  <desc id="d">A la izquierda, el aparato respiratorio con la tráquea, los bronquios, los pulmones, la pleura que los recubre y el diafragma. A la derecha, las enfermedades que atiende la neumología, como asma, EPOC o apnea del sueño, y sus pruebas propias, como la espirometría y la broncoscopia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">El aparato respiratorio</text>
  <path d="M200 104.00000000000001 V174.0" fill="none" stroke="var(--muted)" stroke-width="14.0" stroke-linecap="round"/>
  <path d="M200 174.0 L158.0 216.0 M200 174.0 L242.0 216.0" fill="none" stroke="var(--muted)" stroke-width="9.799999999999999" stroke-linecap="round"/>
  <path d="M180.4 146.0 C116.0 118.0 60.0 202.0 60.0 300.0 C60.0 356.0 144.0 356.0 174.8 328.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <path d="M219.6 146.0 C284.0 118.0 340.0 202.0 340.0 300.0 C340.0 356.0 256.0 356.0 225.2 328.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <path d="M60 220 C60 120 120 110 186 140 M340 220 C340 120 280 110 214 140" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="200" y="72" text-anchor="middle" class="small">Tráquea</text>
  <text x="46" y="110" class="small" style="fill:var(--accent)">Pleura</text>
  <text x="300" y="192" class="small">Bronquios</text>
  <path d="M296 188 L246 214" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path d="M70 370 Q200 330 330 370" fill="none" stroke="var(--muted)" stroke-width="5"/>
  <text x="200" y="400" text-anchor="middle" class="small">Diafragma</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <rect x="436" y="66" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Asma</text>
  <rect x="602" y="66" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">EPOC</text>
  <rect x="436" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Neumonía</text>
  <rect x="602" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Apnea del sueño</text>
  <rect x="436" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fibrosis pulmonar</text>
  <rect x="602" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Cáncer de pulmón</text>
  <text x="436" y="226" class="step">Pruebas propias</text>
  <text x="440" y="252" class="lab">• Espirometría: cuánto aire y a qué ritmo</text>
  <text x="440" y="276" class="lab">• Broncoscopia: ver los bronquios</text>
  <text x="440" y="300" class="lab">• Estudio del sueño</text>
  <text x="440" y="324" class="lab">• Imagen del tórax</text>
  <rect x="436" y="356" width="324" height="64" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="382" class="lab">También oxígeno, ventilación</text>
  <text x="452" y="402" class="lab">y ayuda para dejar de fumar</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
