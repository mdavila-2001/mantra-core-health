<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Toxicología médica</title>
  <desc id="d">A la izquierda, los pasos de la atención a una intoxicación: exposición, identificación del tóxico, estabilización, descontaminación y antídoto si existe. A la derecha, las situaciones que atiende y qué hacer ante una intoxicación.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Del tóxico al tratamiento</text>
  <rect x="70" y="66" width="300" height="52" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="220.0" y="88.5" text-anchor="middle" class="lab">Exposición</text>
  <text x="220.0" y="105.5" text-anchor="middle" class="lab">ingerido, inhalado, en la piel</text>
  <line x1="220" y1="118" x2="220" y2="134" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="70" y="136" width="300" height="52" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="220.0" y="158.5" text-anchor="middle" class="lab">Identificar</text>
  <text x="220.0" y="175.5" text-anchor="middle" class="lab">qué, cuánto y cuándo</text>
  <line x1="220" y1="188" x2="220" y2="204" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="70" y="206" width="300" height="52" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="220.0" y="228.5" text-anchor="middle" class="lab">Estabilizar</text>
  <text x="220.0" y="245.5" text-anchor="middle" class="lab">respiración y circulación</text>
  <line x1="220" y1="258" x2="220" y2="274" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="70" y="276" width="300" height="52" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="220.0" y="298.5" text-anchor="middle" class="lab">Descontaminar</text>
  <text x="220.0" y="315.5" text-anchor="middle" class="lab">según el caso</text>
  <line x1="220" y1="328" x2="220" y2="344" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="70" y="346" width="300" height="52" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="220.0" y="368.5" text-anchor="middle" class="lab">Antídoto</text>
  <text x="220.0" y="385.5" text-anchor="middle" class="lab">si existe</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <text x="476" y="80" class="small">• Sobredosis de medicamentos</text>
  <text x="476" y="102" class="small">• Productos del hogar en niños</text>
  <text x="476" y="124" class="small">• Monóxido de carbono</text>
  <text x="476" y="146" class="small">• Mordeduras y picaduras venenosas</text>
  <text x="476" y="168" class="small">• Setas y plantas tóxicas</text>
  <text x="476" y="190" class="small">• Exposición a metales o químicos</text>
  <rect x="476" y="230" width="284" height="192" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="492" y="256" class="step" style="fill:var(--warn)">Ante una intoxicación</text>
  <text x="500" y="280" class="small">• Llamar a emergencias o al</text>
  <text x="500" y="302" class="small">• centro toxicológico</text>
  <text x="500" y="324" class="small">• No provocar el vómito</text>
  <text x="500" y="346" class="small">• Guardar el envase o la etiqueta</text>
  <text x="500" y="368" class="small">• Alejar de la fuente si es seguro</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
