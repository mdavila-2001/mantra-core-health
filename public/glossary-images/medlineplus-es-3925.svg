<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Reemplazo de rodilla</title>
  <desc id="d">A la izquierda, una rodilla con prótesis: componente femoral de metal sobre el fémur, inserto de plástico y bandeja tibial de metal sobre la tibia. A la derecha, cuándo se indica, los tipos total y parcial y la recuperación.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Piezas de la prótesis</text>
  <path d="M160 60 L166 170 C130 186 128 222 156 232 H284 C312 222 310 186 274 170 L280 60 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M132 200 C130 236 170 244 220 244 C270 244 310 236 308 200 L296 196 C296 222 260 228 220 228 C180 228 144 222 144 196 Z" fill="var(--muted)" stroke="var(--ink)" stroke-width="1"/>
  <rect x="140" y="256" width="160" height="18" rx="4" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="136" y="274" width="168" height="12" rx="3" fill="var(--muted)" stroke="var(--ink)" stroke-width="1"/>
  <rect x="208" y="286" width="24" height="46" rx="3" fill="var(--muted)" stroke="var(--ink)" stroke-width="1"/>
  <path d="M150 286 L160 420 H280 L290 286 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5" opacity=".9"/>
  <rect x="208" y="286" width="24" height="46" rx="3" fill="var(--muted)" stroke="var(--ink)" stroke-width="1"/>
  <text x="220" y="120" text-anchor="middle" class="small" style="fill:var(--muted)">Fémur</text>
  <text x="220" y="380" text-anchor="middle" class="small" style="fill:var(--muted)">Tibia</text>
  <text x="400" y="214" text-anchor="end" class="small">Componente</text>
  <text x="400" y="230" text-anchor="end" class="small">femoral (metal)</text>
  <text x="40" y="262" class="small" style="fill:var(--accent)">Inserto de</text>
  <text x="40" y="278" class="small" style="fill:var(--accent)">plástico</text>
  <line x1="98" y1="266" x2="138" y2="264" stroke="var(--accent)" stroke-width="1"/>
  <text x="400" y="300" text-anchor="end" class="small">Bandeja</text>
  <text x="400" y="316" text-anchor="end" class="small">tibial (metal)</text>
  <text x="220" y="434" text-anchor="middle" class="small" style="fill:var(--muted)">Sustituyen las superficies desgastadas</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Antes y después</text>
  <text x="456" y="74" class="step">Cuándo se indica</text>
  <text x="464" y="98" class="small">• Artrosis avanzada con dolor</text>
  <text x="464" y="120" class="small">• que limita la vida diaria</text>
  <text x="464" y="142" class="small">• Sin mejoría con otros tratamientos</text>
  <text x="456" y="186" class="step">Tipos</text>
  <rect x="456" y="198" width="146" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="529.0" y="219.5" text-anchor="middle" class="small">Total</text>
  <text x="529.0" y="236.5" text-anchor="middle" class="small">toda la rodilla</text>
  <rect x="614" y="198" width="146" height="50" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="687.0" y="219.5" text-anchor="middle" class="small">Parcial</text>
  <text x="687.0" y="236.5" text-anchor="middle" class="small">un compartimento</text>
  <rect x="456" y="268" width="304" height="154" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="294" class="step">Recuperación</text>
  <text x="480" y="318" class="small">• Caminar con ayuda desde el inicio</text>
  <text x="480" y="338" class="small">• Fisioterapia para flexión y fuerza</text>
  <text x="480" y="358" class="small">• Prevención de trombos</text>
  <text x="480" y="378" class="small">• Mejoría progresiva durante meses</text>
  <text x="480" y="398" class="small">• Revisiones periódicas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
