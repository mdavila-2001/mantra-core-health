<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Amilasa</title>
  <desc id="d">A la izquierda, una silueta humana con las glándulas salivales y el páncreas resaltados como fuentes de amilasa. A la derecha, el análisis de sangre y las situaciones en que sube, como la pancreatitis.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Quién produce la amilasa</text>
  <path d="M186.0,112.0 L186.0,122.0 C160.0,124.0 142.0,130.0 138.0,150.0 L126.0,260.0 L138.0,262.0 L152.0,170.0 L154.0,250.0 L156.0,410.0 L186.0,410.0 L200.0,275.0 L214.0,410.0 L244.0,410.0 L246.0,250.0 L248.0,170.0 L262.0,262.0 L274.0,260.0 L262.0,150.0 C258.0,130.0 240.0,124.0 214.0,122.0 L214.0,112.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="200" cy="88.0" r="26.0" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="178" cy="108" rx="10" ry="7" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <ellipse cx="222" cy="108" rx="10" ry="7" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <path d="M168 222 C185 212 215 214 236 222 C240 230 225 234 210 230 C195 228 180 232 168 222 Z" fill="var(--warn)" stroke="var(--warn)" stroke-width="1"/>
  <text x="72" y="104" class="small">Glándulas</text>
  <text x="72" y="120" class="small">salivales</text>
  <line x1="124" y1="110" x2="166" y2="108" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="250" y="260" class="small">Páncreas</text>
  <line x1="252" y1="254" x2="232" y2="226" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="200" y="425" text-anchor="middle" class="small" style="fill:var(--muted)">Digiere el almidón de los alimentos</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">El análisis de sangre</text>
  <rect x="424" y="70" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M427 84 V160 a12 12 0 0 0 24 0 V84" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M429 110 V160 a10 10 0 0 0 20 0 V110 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="439" y="192" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
  <line x1="466" y1="120" x2="520" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="528" y="92" width="224" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="640.0" y="116.5" text-anchor="middle" class="lab">Amilasa que pasó</text>
  <text x="640.0" y="133.5" text-anchor="middle" class="lab">a la sangre</text>
  <text x="588" y="222" text-anchor="middle" class="step">Sube cuando...</text>
  <text x="424" y="252" class="lab">• El páncreas se inflama (pancreatitis)</text>
  <text x="424" y="278" class="lab">• Se obstruyen los conductos pancreáticos</text>
  <text x="424" y="304" class="lab">• Se inflaman las glándulas salivales (paperas)</text>
  <text x="424" y="330" class="lab">• El riñón la elimina peor</text>
  <rect x="416" y="362" width="344" height="60" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="588" y="386" text-anchor="middle" class="small">Se suele pedir junto a la lipasa,</text>
  <text x="588" y="404" text-anchor="middle" class="small">más específica del páncreas.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
