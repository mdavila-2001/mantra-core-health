<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Anemia por déficit de vitamina B12</title>
  <desc id="d">A la izquierda, la vitamina B12 de los alimentos de origen animal se une en el estómago al factor intrínseco y se absorbe al final del intestino delgado; se listan las causas frecuentes del déficit. A la derecha, glóbulos rojos normales frente a glóbulos rojos grandes y escasos, y los síntomas generales y neurológicos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se absorbe la B12</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué pasa si falta</text>
<rect x="40" y="70" width="150" height="40" rx="8" fill="var(--warn)"/>
<text x="115.0" y="94.3" text-anchor="middle" class="small" style="fill:var(--on)">Carne, huevo, lácteos</text>
<line x1="115" y1="110" x2="115" y2="140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M70 150 C60 190 90 230 140 226 C180 222 200 200 210 180 L222 186 L226 170 C200 170 190 150 170 140 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="130" y="192" text-anchor="middle" class="small">Estómago</text>
<text x="236" y="150" class="small" style="fill:var(--purple)">Factor intrínseco</text>
<text x="236" y="166" class="small" style="fill:var(--muted)">(lo produce el</text>
<text x="236" y="182" class="small" style="fill:var(--muted)">estómago)</text>
<line x1="200" y1="230" x2="200" y2="266" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M90 290 C120 270 150 310 180 290 S240 270 270 290 S320 310 330 290" fill="none" stroke="var(--warn)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="330" text-anchor="middle" class="small">Íleon: final del intestino delgado</text>
<text x="40" y="370" class="h">Causas frecuentes</text>
<text x="40" y="394" class="small">Anemia perniciosa · cirugía o enfermedad</text>
<text x="40" y="412" class="small">intestinal · dieta vegana estricta · fármacos</text>
<text x="416" y="76" class="h">Glóbulos rojos</text>
<ellipse cx="450" cy="112" rx="16" ry="12" fill="var(--vessel)"/>
<ellipse cx="490" cy="104" rx="16" ry="12" fill="var(--vessel)"/>
<ellipse cx="470" cy="136" rx="16" ry="12" fill="var(--vessel)"/>
<text x="470" y="168" text-anchor="middle" class="small" style="fill:var(--muted)">Normales</text>
<ellipse cx="620" cy="112" rx="26" ry="20" fill="var(--vessel)" opacity=".85"/>
<ellipse cx="680" cy="124" rx="26" ry="20" fill="var(--vessel)" opacity=".85"/>
<text x="650" y="168" text-anchor="middle" class="small" style="fill:var(--muted)">Grandes y escasos</text>
<text x="560" y="116" text-anchor="middle" class="title" style="fill:var(--muted)">→</text>
<text x="416" y="206" class="h">Síntomas</text>
<text x="416" y="232" class="lab">• Cansancio y palidez</text>
<text x="416" y="256" class="lab">• Lengua roja y lisa</text>
<text x="416" y="280" class="lab">• Falta de aire al esfuerzo</text>
<text x="416" y="316" class="h" style="fill:var(--purple)">Nervios</text>
<text x="416" y="342" class="lab">• Hormigueo en pies y manos</text>
<text x="416" y="366" class="lab">• Inestabilidad al caminar</text>
<text x="416" y="390" class="lab">• Problemas de memoria</text>
<text x="760" y="424" text-anchor="end" class="small" style="fill:var(--muted)">Se trata reponiendo B12.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
