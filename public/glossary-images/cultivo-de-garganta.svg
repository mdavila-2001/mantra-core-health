<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cultivo de garganta: toma con hisopo</title>
  <desc id="d">A la izquierda, una boca abierta vista de frente con las amígdalas y la úvula, y un hisopo que toca la parte posterior de la garganta. A la derecha, el germen que se busca, el estreptococo del grupo A, los pasos del cultivo y por qué el resultado importa para decidir el tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Toma de la muestra</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué busca y cómo sigue</text>
<ellipse cx="200" cy="200" rx="120" ry="110" fill="var(--organ)" stroke="var(--organ)" stroke-width="1.5"/>
<ellipse cx="200" cy="210" rx="100" ry="90" fill="var(--bad-l)"/>
<path d="M186 110 Q200 160 214 110" fill="var(--organ)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="200" cy="154" rx="9" ry="16" fill="var(--organ)"/>
<ellipse cx="136" cy="206" rx="22" ry="34" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="1.5"/>
<ellipse cx="264" cy="206" rx="22" ry="34" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="1.5"/>
<path d="M110 270 Q200 230 290 270 L280 296 Q200 280 120 296 Z" fill="var(--organ-l)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="132" cy="200" r="3" fill="var(--panel)"/>
<circle cx="130" cy="214" r="3" fill="var(--panel)"/>
<circle cx="268" cy="196" r="3" fill="var(--panel)"/>
<circle cx="272" cy="212" r="3" fill="var(--panel)"/>
<line x1="362" y1="130" x2="236" y2="196" stroke="var(--muted)" stroke-width="3"/>
<ellipse cx="232" cy="198" rx="10" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<text x="290" y="130" class="lab">Hisopo</text>
<text x="80" y="88" class="lab">Amígdalas</text>
<line x1="110" y1="94" x2="136" y2="168" stroke="var(--muted)" stroke-width="1"/>
<text x="200" y="346" text-anchor="middle" class="lab">Se frota la parte posterior de la garganta</text>
<text x="200" y="366" text-anchor="middle" class="lab">y las amígdalas, sin tocar lengua ni dientes.</text>
<text x="200" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Molesta unos segundos; puede dar arcadas.</text>
<text x="416" y="76" class="h">Busca sobre todo</text>
<text x="416" y="100" class="big" style="fill:var(--bad)">Estreptococo del grupo A</text>
<text x="416" y="120" class="small" style="fill:var(--muted)">causa frecuente de faringitis bacteriana</text>
<rect x="416" y="146" width="104" height="36" rx="8" fill="var(--accent)"/>
<text x="468.0" y="168.3" text-anchor="middle" class="small" style="fill:var(--on)">Placa de cultivo</text>
<line x1="520" y1="164" x2="532" y2="164" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="534" y="146" width="104" height="36" rx="8" fill="var(--warn)"/>
<text x="586.0" y="168.3" text-anchor="middle" class="small" style="fill:var(--on)">24 a 48 h</text>
<line x1="638" y1="164" x2="650" y2="164" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="652" y="146" width="104" height="36" rx="8" fill="var(--ok)"/>
<text x="704.0" y="168.3" text-anchor="middle" class="small" style="fill:var(--on)">Resultado</text>
<text x="416" y="206" class="small" style="fill:var(--muted)">La prueba rápida da respuesta en minutos;</text>
<text x="416" y="222" class="small" style="fill:var(--muted)">el cultivo confirma si aquella es negativa.</text>
<text x="416" y="262" class="h">Por qué importa</text>
<text x="416" y="288" class="lab">• Decide si hacen falta antibióticos</text>
<text x="416" y="312" class="lab">• Evita complicaciones como la</text>
<text x="427" y="336" class="lab">fiebre reumática</text>
<text x="416" y="360" class="lab">• La mayoría de las faringitis son</text>
<text x="427" y="384" class="lab">por virus y no los necesitan</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
