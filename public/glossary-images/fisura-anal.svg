<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Fisura anal</title>
  <desc id="d">A la izquierda, el ano visto de frente con el músculo esfínter y un pequeño desgarro en la piel del canal anal, a menudo en la parte posterior. A la derecha, el círculo vicioso de heces duras, desgarro, dolor y espasmo del esfínter, y los cuidados que ayudan a curarla.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Qué es</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Causas y cuidados</text>
<circle cx="200" cy="200" r="110" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="200" cy="200" r="70" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<circle cx="200" cy="200" r="20" fill="var(--organ)"/>
<path d="M200 222 L194 268 L206 268 Z" fill="var(--bad)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="260" y="296" class="small" style="fill:var(--bad)">Pequeño desgarro</text>
<text x="260" y="312" class="small" style="fill:var(--muted)">(a menudo atrás)</text>
<text x="200" y="82" text-anchor="middle" class="small" style="fill:var(--organ)">Músculo esfínter</text>
<text x="200" y="360" text-anchor="middle" class="lab">Desgarro en la piel del canal anal</text>
<text x="200" y="380" text-anchor="middle" class="lab">que duele mucho al defecar.</text>
<text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">El espasmo del esfínter retrasa la curación.</text>
<rect x="538" y="64" width="100" height="32" rx="8" fill="var(--warn)"/>
<text x="588.0" y="84.3" text-anchor="middle" class="small" style="fill:var(--on)">Heces duras</text>
<rect x="628" y="134" width="100" height="32" rx="8" fill="var(--bad)"/>
<text x="678.0" y="154.3" text-anchor="middle" class="small" style="fill:var(--on)">Desgarro</text>
<rect x="538" y="204" width="100" height="32" rx="8" fill="var(--vessel)"/>
<text x="588.0" y="224.3" text-anchor="middle" class="small" style="fill:var(--on)">Dolor</text>
<rect x="448" y="134" width="100" height="32" rx="8" fill="var(--purple)"/>
<text x="498.0" y="154.3" text-anchor="middle" class="small" style="fill:var(--on)">Espasmo</text>
<path d="M628 90 Q668 100 674 128" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M674 172 Q668 200 640 214" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M536 214 Q508 200 502 172" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<path d="M502 128 Q508 100 536 86" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar)"/>
<text x="416" y="270" class="h" style="fill:var(--ok)">Cuidados</text>
<text x="416" y="296" class="lab">• Fibra y agua para ablandar las heces</text>
<text x="416" y="320" class="lab">• Baños de asiento tibios</text>
<text x="416" y="344" class="lab">• Pomadas que relajan el esfínter</text>
<text x="416" y="388" class="small" style="fill:var(--muted)">Consultar si sangra mucho o no mejora</text>
<text x="416" y="404" class="small" style="fill:var(--muted)">en unas semanas.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
