<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Las etapas de una infección</title>
  <desc id="d">Cuatro paneles en fila. Uno: los microbios entran por una herida o una mucosa. Dos: se multiplican en los tejidos. Tres: los glóbulos blancos acuden, hay inflamación y puede aparecer fiebre. Cuatro: los microbios se eliminan y quedan anticuerpos de memoria. Abajo, los cuatro tipos de microbios: bacterias, virus, hongos y parásitos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --tissue:#f1dccb; --tissue-d:#c9a88f; --germ:#7b4fb0; --wbc:#e9eef5; --wbc-d:#5a6878; --heat:#e0782a; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --tissue:#4a3e36; --tissue-d:#8a7464; --germ:#b48de0; --wbc:#2d3a48; --wbc-d:#b9c6d3; --heat:#f0a060; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <defs>
    <g id="b"><rect x="-9" y="-4" width="18" height="8" rx="4" fill="var(--germ)"/></g>
    <g id="w"><circle r="16" fill="var(--wbc)" stroke="var(--wbc-d)" stroke-width="2"/><circle cx="3" cy="-2" r="6" fill="var(--wbc-d)"/></g>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="42" text-anchor="middle" class="title">Qué ocurre en una infección</text>

  <g>
    <rect x="20" y="60" width="180" height="250" rx="12" fill="var(--panel)" stroke="var(--line)"/>
    <text x="110" y="86" text-anchor="middle" class="step">1 · Entrada</text>
    <rect x="35" y="180" width="150" height="100" rx="6" fill="var(--tissue)"/>
    <path d="M100 180 L110 200 L120 180" fill="var(--panel)"/>
    <use href="#b" x="105" y="130"/><use href="#b" x="90" y="150"/><use href="#b" x="118" y="160"/>
    <text x="110" y="300" text-anchor="middle" class="small muted">Por una herida o mucosa</text>
  </g>
  <g>
    <rect x="213" y="60" width="180" height="250" rx="12" fill="var(--panel)" stroke="var(--line)"/>
    <text x="303" y="86" text-anchor="middle" class="step">2 · Multiplicación</text>
    <rect x="228" y="130" width="150" height="150" rx="6" fill="var(--tissue)"/>
    <use href="#b" x="260" y="160"/><use href="#b" x="290" y="175"/><use href="#b" x="330" y="160"/><use href="#b" x="255" y="210"/><use href="#b" x="300" y="215"/><use href="#b" x="345" y="200"/><use href="#b" x="275" y="250"/><use href="#b" x="330" y="245"/>
    <text x="303" y="300" text-anchor="middle" class="small muted">Los microbios crecen</text>
  </g>
  <g>
    <rect x="406" y="60" width="180" height="250" rx="12" fill="var(--panel)" stroke="var(--line)"/>
    <text x="496" y="86" text-anchor="middle" class="step">3 · Defensa</text>
    <rect x="421" y="130" width="150" height="150" rx="6" fill="var(--tissue)" stroke="var(--heat)" stroke-width="4"/>
    <use href="#w" x="460" y="175"/><use href="#w" x="530" y="230"/>
    <use href="#b" x="500" y="170"/><use href="#b" x="470" y="240"/>
    <path d="M550 110 C545 100 560 95 555 85" stroke="var(--heat)" stroke-width="3" fill="none"/>
    <text x="496" y="118" text-anchor="middle" class="small" style="fill:var(--heat)">Inflamación, fiebre</text>
    <text x="496" y="300" text-anchor="middle" class="small muted">Acuden glóbulos blancos</text>
  </g>
  <g>
    <rect x="599" y="60" width="180" height="250" rx="12" fill="var(--panel)" stroke="var(--line)"/>
    <text x="689" y="86" text-anchor="middle" class="step">4 · Resolución</text>
    <rect x="614" y="130" width="150" height="150" rx="6" fill="var(--tissue)"/>
    <path d="M660 200 L680 220 L720 175" stroke="var(--ok)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M640 255 L648 247 L656 255 M648 247 V265" stroke="var(--accent)" stroke-width="3" fill="none"/>
    <path d="M730 255 L738 247 L746 255 M738 247 V265" stroke="var(--accent)" stroke-width="3" fill="none"/>
    <text x="689" y="300" text-anchor="middle" class="small muted">Quedan anticuerpos</text>
  </g>

  <rect x="20" y="326" width="760" height="134" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="352" text-anchor="middle" class="step">Tipos de microbios</text>
  <use href="#b" x="110" y="395"/><text x="110" y="435" text-anchor="middle" class="small">Bacterias</text>
  <g transform="translate(300 395)"><circle r="12" fill="var(--germ)"/><path d="M0 -12 V-20 M0 12 V20 M-12 0 H-20 M12 0 H20 M8 8 L14 14 M-8 -8 L-14 -14 M8 -8 L14 -14 M-8 8 L-14 14" stroke="var(--germ)" stroke-width="3"/></g>
  <text x="300" y="435" text-anchor="middle" class="small">Virus</text>
  <g transform="translate(500 395)"><circle r="10" fill="var(--germ)"/><circle cx="14" cy="-6" r="7" fill="var(--germ)"/></g>
  <text x="505" y="435" text-anchor="middle" class="small">Hongos (levaduras)</text>
  <path d="M670 395 C680 380 695 410 705 395 C715 380 730 410 740 395" stroke="var(--germ)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="705" y="435" text-anchor="middle" class="small">Parásitos</text>
</svg>
