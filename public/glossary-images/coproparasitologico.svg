<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Examen coproparasitológico paso a paso</title>
  <desc id="d">Arriba, el recorrido de la muestra de heces: frasco con conservante, concentración en tubo, observación al microscopio e informe. Abajo, dibujos de huevos, quistes, larvas y trofozoítos, y la diferencia con el coprocultivo y la sangre oculta.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="190" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Cómo se procesa la muestra</text>
<path d="M70,80 L70,160 Q70,170 80,170 L120,170 Q130,170 130,160 L130,80 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="70" width="72" height="14" rx="4" fill="var(--accent)" stroke-width="1"/>
<rect x="73" y="120" width="54" height="46" rx="4" fill="var(--organ-d)" stroke-width="1" opacity=".5"/>
<text x="100" y="194" text-anchor="middle" class="small">Frasco con conservante</text>
<line x1="160" y1="130" x2="215" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M240,80 L240,150 Q255,175 270,150 L270,80" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="244" y="140" width="22" height="16" rx="4" fill="var(--organ-d)" stroke-width="1"/>
<rect x="244" y="95" width="22" height="40" rx="2" fill="var(--accent-l)" stroke-width="1"/>
<text x="255" y="194" text-anchor="middle" class="small">Concentración</text>
<text x="300" y="110" class="small" style="fill:var(--muted)">sedimento</text>
<line x1="298" y1="114" x2="268" y2="146" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<line x1="395" y1="130" x2="450" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="470" y="172" width="90" height="14" rx="4" fill="var(--ink)" stroke-width="1"/>
<path d="M530,172 L530,102 Q530,82 510,80" fill="none" stroke="var(--ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="488" y="68" width="22" height="46" rx="4" fill="var(--muted)" stroke-width="1" transform="rotate(-20 499 91)"/>
<rect x="480" y="134" width="56" height="6" rx="2" fill="var(--muted)" stroke-width="1"/>
<rect x="498" y="114" width="8" height="18" rx="2" fill="var(--ink)" stroke-width="1"/>
<text x="515" y="202" text-anchor="middle" class="small">Microscopio</text>
<line x1="590" y1="130" x2="640" y2="130" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="650" y="96" width="110" height="60" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="705" y="122" text-anchor="middle" class="step">Informe</text>
<text x="705" y="142" text-anchor="middle" class="small">formas halladas</text>
<rect x="20" y="226" width="500" height="214" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="270.0" y="256" text-anchor="middle" class="title">Qué se puede ver</text>
<ellipse cx="80" cy="300" rx="22" ry="14" fill="var(--beam)" stroke="var(--warn)" stroke-width="2"/>
<ellipse cx="80" cy="300" rx="12" ry="7" fill="var(--warn)" stroke="none" stroke-width="1"/>
<text x="80" y="346" text-anchor="middle" class="lab">Huevos</text>
<circle cx="200" cy="300" r="18" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
<circle cx="194" cy="296" r="3" fill="var(--ok)" stroke="none" stroke-width="1"/>
<circle cx="206" cy="304" r="3" fill="var(--ok)" stroke="none" stroke-width="1"/>
<circle cx="202" cy="292" r="3" fill="var(--ok)" stroke="none" stroke-width="1"/>
<text x="200" y="346" text-anchor="middle" class="lab">Quistes</text>
<path d="M290,300 Q305,280 320,300 T350,300 T380,300" fill="none" stroke="var(--purple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="335" y="346" text-anchor="middle" class="lab">Larvas</text>
<path d="M440,285 Q470,270 480,295 Q500,305 478,318 Q455,330 440,315 Q420,300 440,285 Z" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="346" text-anchor="middle" class="lab">Trofozoítos</text>
<text x="270" y="386" text-anchor="middle" class="lab">Se suelen pedir varias muestras de días distintos,</text>
<text x="270" y="406" text-anchor="middle" class="lab">porque los parásitos se eliminan de forma irregular.</text>
<rect x="536" y="226" width="244" height="214" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="658.0" y="256" text-anchor="middle" class="title">No confundir</text>
<text x="552" y="282" class="lab">Coprocultivo:</text>
<text x="552" y="302" class="lab">busca bacterias</text>
<text x="552" y="340" class="lab">Sangre oculta:</text>
<text x="552" y="360" class="lab">busca sangre</text>
<text x="552" y="404" class="small" style="fill:var(--muted)">Un resultado negativo no</text>
<text x="552" y="420" class="small" style="fill:var(--muted)">descarta del todo la infección.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
