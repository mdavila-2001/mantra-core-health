<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Vértebra lumbar vista desde arriba</title>
  <desc id="d">Vértebra lumbar vista desde arriba, con la parte anterior hacia arriba. El cuerpo vertebral en forma de riñón queda por delante, rodeado por el contorno del disco intervertebral. Hacia atrás salen los dos pedículos, las láminas, la apófisis espinosa, las dos apófisis transversas y las apófisis articulares superiores. En el centro, el agujero vertebral aloja el saco dural con las raíces de la cola de caballo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --bone:#ecd9bd; --bone-d:#b88a4a; --body:#f3e4cd; --canal:#dfeaf6; --dura:#7fa6cf; --nerve:#e3b341; --disc:#8fb7d6; --lead:#5a6878; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --bone:#6c5a3e; --bone-d:#d8b374; --body:#7a6747; --canal:#243546; --dura:#7ea9d6; --nerve:#f0c554; --disc:#5b86a8; --lead:#9fb0c1; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .title { font-size: 18px; font-weight: 700; }
    .sm { font-size: 12.5px; fill: var(--muted); }
    .lab { font-size: 14px; font-weight: 600; }
    .bone { fill: var(--bone); stroke: var(--bone-d); stroke-width: 2; stroke-linejoin: round; }
    .body { fill: var(--body); stroke: var(--bone-d); stroke-width: 2.2; }
    .lead { stroke: var(--lead); stroke-width: 1.3; fill: none; }
    .dot { fill: var(--lead); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="24" y="34" class="title">Vértebra lumbar · vista superior</text>
  <text x="24" y="54" class="sm">Anterior arriba, posterior abajo</text>

  <g transform="translate(100 8)">
    <!-- contorno del disco (debajo) -->
    <path d="M222 150 Q222 98 300 98 Q378 98 378 150 Q378 206 340 216 Q300 200 260 216 Q222 206 222 150 Z" fill="none" stroke="var(--disc)" stroke-width="3" stroke-dasharray="7 5"/>
    <!-- apófisis transversas -->
    <rect x="166" y="236" width="86" height="19" rx="9" class="bone"/>
    <rect x="348" y="236" width="86" height="19" rx="9" class="bone"/>
    <!-- apófisis espinosa -->
    <rect x="289" y="300" width="22" height="64" rx="10" class="bone"/>
    <!-- arco vertebral (pedículos + láminas) con agujero central -->
    <path fill-rule="evenodd" class="bone" d="M262 206 Q238 222 238 262 Q240 304 272 318 Q300 328 328 318 Q360 304 362 262 Q362 222 338 206 L322 206 Q340 226 340 262 Q338 292 316 300 Q300 305 284 300 Q262 292 260 262 Q260 226 278 206 Z"/>
    <!-- apófisis articulares superiores -->
    <ellipse cx="248" cy="232" rx="10" ry="16" class="bone" transform="rotate(-12 248 232)"/>
    <ellipse cx="352" cy="232" rx="10" ry="16" class="bone" transform="rotate(12 352 232)"/>
    <!-- agujero vertebral: saco dural y raíces -->
    <path d="M276 208 Q262 230 262 262 Q264 288 284 298 Q300 303 316 298 Q336 288 338 262 Q338 230 324 208 Z" fill="var(--canal)"/>
    <path d="M286 226 Q300 220 314 226 Q326 250 314 280 Q300 288 286 280 Q274 250 286 226 Z" fill="none" stroke="var(--dura)" stroke-width="2"/>
    <g fill="none" stroke="var(--nerve)" stroke-width="2" stroke-linecap="round">
      <path d="M294 236 v36"/><path d="M300 234 v40"/><path d="M306 236 v36"/><path d="M290 242 v26"/><path d="M310 242 v26"/>
    </g>
    <!-- cuerpo vertebral -->
    <path d="M232 150 Q232 106 300 106 Q368 106 368 150 Q368 198 336 208 Q300 194 264 208 Q232 198 232 150 Z" class="body"/>
    <path d="M254 140 q46 -22 92 0 M250 158 q50 -18 100 0" fill="none" stroke="var(--bone-d)" stroke-width="1" opacity=".55"/>
  </g>

  <!-- rótulos izquierda -->
  <g>
    <text x="248" y="128" text-anchor="end" class="lab">Cuerpo vertebral</text>
    <path d="M254 124 L336 150" class="lead"/><circle cx="337" cy="150" r="3" class="dot"/>
    <text x="248" y="92" text-anchor="end" class="lab" style="fill:var(--muted)">Disco intervertebral</text>
    <text x="248" y="108" text-anchor="end" class="sm">(contorno punteado)</text>
    <path d="M254 90 L338 104" class="lead"/><circle cx="339" cy="104" r="3" class="dot"/>
    <text x="248" y="214" text-anchor="end" class="lab">Pedículo</text>
    <path d="M254 212 L350 226" class="lead"/><circle cx="351" cy="226" r="3" class="dot"/>
    <text x="248" y="278" text-anchor="end" class="lab">Apófisis transversa</text>
    <path d="M254 270 L286 256" class="lead"/><circle cx="287" cy="255" r="3" class="dot"/>
    <text x="248" y="342" text-anchor="end" class="lab">Lámina</text>
    <path d="M254 338 L360 316" class="lead"/><circle cx="361" cy="315" r="3" class="dot"/>
  </g>
  <!-- rótulos derecha -->
  <g>
    <text x="566" y="190" class="lab">Apófisis articular superior</text>
    <path d="M560 194 L458 232" class="lead"/><circle cx="457" cy="233" r="3" class="dot"/>
    <text x="566" y="278" class="lab">Apófisis transversa</text>
    <path d="M560 272 L520 258" class="lead"/><circle cx="519" cy="257" r="3" class="dot"/>
    <text x="566" y="318" class="lab">Agujero vertebral</text>
    <text x="566" y="334" class="sm">saco dural y raíces nerviosas</text>
    <path d="M560 314 L420 268" class="lead"/><circle cx="419" cy="267" r="3" class="dot"/>
    <text x="566" y="394" class="lab">Apófisis espinosa</text>
    <path d="M560 390 L424 366" class="lead"/><circle cx="423" cy="365" r="3" class="dot"/>
  </g>

  <text x="24" y="430" class="sm">Los cuerpos lumbares son los más voluminosos porque soportan más carga.</text>
  <text x="24" y="448" class="sm">Por debajo de L1–L2 el agujero contiene la cola de caballo, no la médula.</text>
  <text x="400" y="472" text-anchor="middle" class="sm">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
