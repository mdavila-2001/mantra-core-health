<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Panel metabólico básico</title>
  <desc id="d">Un tubo de sangre del que salen ocho análisis agrupados en cuatro bloques: azúcar (glucosa), electrolitos (sodio, potasio, cloruro y bicarbonato), función renal (BUN y creatinina) y calcio. Debajo, para qué sirve el conjunto: azúcar, líquidos y sales, equilibrio ácido-base y función de los riñones.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Panel metabólico básico: ocho análisis, una extracción</text>
  <rect x="52" y="160" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M54 176 V240 a15 15 0 0 0 30 0 V176 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M56 206 V240 a13 13 0 0 0 26 0 V206 Z" fill="var(--vessel)"/>
  <text x="69" y="278" text-anchor="middle" class="small muted">Una muestra</text>
  <line x1="100" y1="210" x2="140" y2="210" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="150" y="70" width="140" height="260" rx="10" fill="var(--tissue)"/>
  <text x="220.0" y="96" text-anchor="middle" class="step" style="fill:var(--accent)">Azúcar</text>
  <rect x="160" y="116" width="120" height="36" rx="8" fill="var(--accent)"/>
  <text x="220.0" y="138.32" text-anchor="middle" class="small" style="fill:var(--on)">Glucosa</text>
  <rect x="310" y="70" width="170" height="260" rx="10" fill="var(--tissue)"/>
  <text x="395.0" y="96" text-anchor="middle" class="step" style="fill:var(--purple)">Electrolitos</text>
  <rect x="320" y="116" width="150" height="36" rx="8" fill="var(--purple)"/>
  <text x="395.0" y="138.32" text-anchor="middle" class="small" style="fill:var(--on)">Sodio</text>
  <rect x="320" y="164" width="150" height="36" rx="8" fill="var(--purple)"/>
  <text x="395.0" y="186.32" text-anchor="middle" class="small" style="fill:var(--on)">Potasio</text>
  <rect x="320" y="212" width="150" height="36" rx="8" fill="var(--purple)"/>
  <text x="395.0" y="234.32" text-anchor="middle" class="small" style="fill:var(--on)">Cloruro</text>
  <rect x="320" y="260" width="150" height="36" rx="8" fill="var(--purple)"/>
  <text x="395.0" y="282.32" text-anchor="middle" class="small" style="fill:var(--on)">CO₂ (bicarbonato)</text>
  <rect x="500" y="70" width="130" height="260" rx="10" fill="var(--tissue)"/>
  <text x="565.0" y="96" text-anchor="middle" class="step" style="fill:var(--ok)">Riñón</text>
  <rect x="510" y="116" width="110" height="36" rx="8" fill="var(--ok)"/>
  <text x="565.0" y="138.32" text-anchor="middle" class="small" style="fill:var(--on)">BUN (urea)</text>
  <rect x="510" y="164" width="110" height="36" rx="8" fill="var(--ok)"/>
  <text x="565.0" y="186.32" text-anchor="middle" class="small" style="fill:var(--on)">Creatinina</text>
  <rect x="650" y="70" width="120" height="260" rx="10" fill="var(--tissue)"/>
  <text x="710.0" y="96" text-anchor="middle" class="small" style="fill:var(--warn)">Hueso, nervio y músculo</text>
  <rect x="660" y="116" width="100" height="36" rx="8" fill="var(--warn)"/>
  <text x="710.0" y="138.32" text-anchor="middle" class="small" style="fill:var(--on)">Calcio</text>
  <text x="400" y="366" text-anchor="middle" class="lab">Informa sobre el azúcar en sangre, el equilibrio de líquidos y sales,</text>
  <text x="400" y="388" text-anchor="middle" class="lab">el equilibrio ácido-base y cómo filtran los riñones</text>
  <text x="400" y="418" text-anchor="middle" class="small muted">Se pide en chequeos, urgencias, hospitalización y control de medicamentos</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
