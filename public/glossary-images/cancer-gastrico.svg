<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Localización y claves del cáncer gástrico</title>
  <desc id="d">Estómago con esófago, fondo, píloro y duodeno, y un tumor marcado en la pared. A la derecha, los factores de riesgo como Helicobacter pylori, los síntomas habituales y los signos que obligan a consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Localización en el estómago</text>
<path d="M208,142 L200,70" fill="none" stroke="var(--organ-d)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M208,142 L200,70" fill="none" stroke="var(--organ)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M215,140 C280,120 305,200 275,260 C245,315 155,305 125,262 L105,258 L105,234 L128,236 C170,254 218,242 228,202 C232,172 218,154 202,146 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="250" cy="265" rx="24" ry="14" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="1.5"/>
<text x="212" y="64" class="small">Esófago</text>
<text x="300" y="170" class="small">Fondo</text>
<text x="54" y="212" class="small">Píloro</text>
<text x="58" y="252" class="small">Duodeno</text>
<text x="270" y="322" class="lab">Tumor en</text>
<text x="270" y="338" class="lab">la pared</text>
<line x1="262" y1="282" x2="282" y2="312" stroke="var(--muted)" stroke-width="1.5"/>
<text x="200" y="380" text-anchor="middle" class="lab" style="fill:var(--muted)">La mayoría nace en la capa interna</text>
<text x="200" y="398" text-anchor="middle" class="lab" style="fill:var(--muted)">(adenocarcinoma).</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Claves</text>
<rect x="416" y="52" width="344" height="122" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="428" y="74" class="step">Factores de riesgo</text>
<text x="428" y="98" class="lab">• Infección por Helicobacter pylori</text>
<text x="428" y="120" class="lab">• Tabaco, dieta muy salada o ahumada</text>
<text x="428" y="142" class="lab">• Familiares con cáncer gástrico</text>
<text x="428" y="164" class="lab">• Gastritis atrófica, edad avanzada</text>
<rect x="416" y="192" width="344" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="428" y="214" class="step">Síntomas (a menudo tardíos)</text>
<text x="428" y="238" class="lab">• Molestia o dolor en la parte alta del abdomen</text>
<text x="428" y="260" class="lab">• Sensación de llenarse muy pronto</text>
<text x="428" y="282" class="lab">• Pérdida de peso, anemia, cansancio</text>
<rect x="416" y="316" width="344" height="78" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="428" y="338" class="step" style="fill:var(--warn)">Consultar pronto si:</text>
<text x="428" y="360" class="lab">• Vómitos con sangre o heces negras</text>
<text x="428" y="382" class="lab">• Dificultad para tragar</text>
<text x="588" y="426" text-anchor="middle" class="small" style="fill:var(--muted)">Diagnóstico: endoscopia con biopsia.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
