<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Etapas del trasplante de médula ósea</title>
  <desc id="d">Cuatro pasos en fila: obtener células madre de la sangre, la médula o el cordón; acondicionar con quimioterapia o radioterapia; infundir las células por una vena; y el injerto, en el que anidan en la médula y vuelven a fabricar sangre. Abajo, la diferencia entre trasplante autólogo y alogénico.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Trasplante de médula ósea (progenitores hematopoyéticos)</text>
  <rect x="20" y="60" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="40" y="80" width="166" height="210" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="123" y="106" text-anchor="middle" class="lab b">1 · Obtener células</text>
  <text x="123" y="250" text-anchor="middle" class="small">Sangre periférica,</text>
  <text x="123" y="268" text-anchor="middle" class="small">médula o cordón</text>
  <line x1="208" y1="185" x2="224" y2="185" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="226" y="80" width="166" height="210" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="309" y="106" text-anchor="middle" class="lab b">2 · Acondicionar</text>
  <text x="309" y="250" text-anchor="middle" class="small">Quimioterapia o</text>
  <text x="309" y="268" text-anchor="middle" class="small">radioterapia</text>
  <line x1="394" y1="185" x2="410" y2="185" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="412" y="80" width="166" height="210" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="495" y="106" text-anchor="middle" class="lab b">3 · Infundir</text>
  <text x="495" y="250" text-anchor="middle" class="small">Por una vena,</text>
  <text x="495" y="268" text-anchor="middle" class="small">como una transfusión</text>
  <line x1="580" y1="185" x2="596" y2="185" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="598" y="80" width="166" height="210" rx="12" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="681" y="106" text-anchor="middle" class="lab b">4 · Injerto</text>
  <text x="681" y="250" text-anchor="middle" class="small">Las células anidan</text>
  <text x="681" y="268" text-anchor="middle" class="small">en la médula</text>
  <rect x="105" y="140" width="36" height="70" rx="6" fill="var(--panel)" stroke="var(--red)"/>
  <rect x="109" y="170" width="28" height="36" rx="4" fill="var(--red)" stroke="none"/>
  <text x="123" y="230" text-anchor="middle" class="small muted">Bolsa de células</text>
  <rect x="290" y="130" width="44" height="90" rx="6" fill="var(--panel)" stroke="var(--warn)"/>
  <rect x="294" y="160" width="36" height="56" rx="4" fill="var(--warn-l)" stroke="none"/>
  <text x="312" y="236" text-anchor="middle" class="small muted">Vacía la médula</text>
  <path d="M436 140 L436 180 C436 200 456 210 476 210 L510 210" fill="none" stroke="var(--red)" stroke-width="3"/>
  <rect x="420" y="120" width="32" height="40" rx="6" fill="var(--panel)" stroke="var(--red)"/>
  <text x="498" y="160" text-anchor="middle" class="small muted">Vía central</text>
  <path d="M640 140 C620 140 610 170 640 190 C670 210 700 190 690 160 C682 140 660 140 640 140 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="642" cy="166" r="6" fill="var(--red)" stroke="none"/>
  <circle cx="660" cy="176" r="6" fill="var(--pur)" stroke="none"/>
  <circle cx="672" cy="160" r="6" fill="var(--warn)" stroke="none"/>
  <text x="665" y="226" text-anchor="middle" class="small muted">Sangre nueva</text>
  <rect x="20" y="326" width="372" height="116" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="206.0" y="356" text-anchor="middle" class="title">Autólogo</text>
  <text x="206" y="382" text-anchor="middle" class="lab">Las células son del propio paciente</text>
  <text x="206" y="404" text-anchor="middle" class="small muted">Se recogen y congelan antes del tratamiento</text>
  <rect x="408" y="326" width="372" height="116" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="594.0" y="356" text-anchor="middle" class="title">Alogénico</text>
  <text x="594" y="382" text-anchor="middle" class="lab">Las células vienen de un donante compatible</text>
  <text x="594" y="404" text-anchor="middle" class="small muted">Riesgo de enfermedad de injerto contra huésped</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
