<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Niveles del eje hormonal y causas de amenorrea</title>
  <desc id="d">Esquema vertical del eje hipotálamo, hipófisis, ovarios y útero, con posibles causas de falta de regla en cada nivel. A la derecha, la diferencia entre amenorrea primaria y secundaria y las causas más comunes, empezando por el embarazo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">El eje que regula la regla</text>
<rect x="40" y="62" width="130" height="44" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="105.0" y="88.5" text-anchor="middle" class="lab" style="fill:var(--on)">Hipotálamo</text>
<text x="186" y="82" class="small" style="fill:var(--muted)">Posibles causas:</text>
<text x="186" y="100" class="small">estrés, peso bajo, ejercicio</text>
<line x1="105" y1="108" x2="105" y2="150" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="154" width="130" height="44" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="105.0" y="180.6" text-anchor="middle" class="lab" style="fill:var(--on)">Hipófisis</text>
<text x="186" y="174" class="small" style="fill:var(--muted)">Posibles causas:</text>
<text x="186" y="192" class="small">prolactina alta, tumores</text>
<line x1="105" y1="200" x2="105" y2="242" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="246" width="130" height="44" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="105.0" y="272.6" text-anchor="middle" class="lab" style="fill:var(--on)">Ovarios</text>
<text x="186" y="266" class="small" style="fill:var(--muted)">Posibles causas:</text>
<text x="186" y="284" class="small">ovario poliquístico, insuficiencia</text>
<line x1="105" y1="292" x2="105" y2="334" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="338" width="130" height="44" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="105.0" y="364.6" text-anchor="middle" class="lab" style="fill:var(--on)">Útero y vagina</text>
<text x="186" y="358" class="small" style="fill:var(--muted)">Posibles causas:</text>
<text x="186" y="376" class="small">adherencias, malformaciones</text>
<text x="116" y="418" class="small" style="fill:var(--muted)">hormonas (FSH, LH, estrógenos)</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Dos tipos</text>
<rect x="456" y="62" width="304" height="62" rx="8" fill="var(--purple-l)" stroke-width="1"/>
<text x="608.0" y="89.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Primaria</text>
<text x="608.0" y="105.5" text-anchor="middle" class="lab" style="fill:var(--ink)">no hubo nunca primera regla</text>
<rect x="456" y="136" width="304" height="62" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="608.0" y="163.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Secundaria</text>
<text x="608.0" y="179.6" text-anchor="middle" class="lab" style="fill:var(--ink)">la regla falta durante meses</text>
<rect x="456" y="214" width="304" height="122" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="468" y="236" class="step">Causas fisiológicas y comunes</text>
<text x="468" y="260" class="lab">• Embarazo: la causa más frecuente</text>
<text x="468" y="282" class="lab">• Lactancia y menopausia</text>
<text x="468" y="304" class="lab">• Anticonceptivos hormonales</text>
<text x="468" y="326" class="lab">• Enfermedad de tiroides</text>
<text x="456" y="370" class="step">Primer paso: descartar embarazo.</text>
<text x="456" y="396" class="lab">Luego, análisis hormonales y</text>
<text x="456" y="414" class="lab">ecografía según el caso.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
