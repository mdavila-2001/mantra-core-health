<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Evolución del chikungunya</title>
  <desc id="d">Línea de tiempo en cuatro momentos. La picadura de un mosquito Aedes infectado. La incubación, de 4 a 8 días y hasta de 2 a 12. El inicio brusco de fiebre con dolor articular intenso, hinchazón de articulaciones, dolor muscular, dolor de cabeza, náuseas, cansancio y erupción. La recuperación: la mayoría mejora en alrededor de una semana, pero el dolor articular puede durar semanas, meses o incluso años. Abajo, el cuidado: líquidos, reposo y paracetamol mientras no se descarte el dengue; evitar aspirina y antiinflamatorios por riesgo de sangrado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#1f6fb2; --a-l:#d6e6f5; --b:#b7791f; --b-l:#f7e4bf; --c:#c0392b; --c-l:#f6d5cf; --d:#1f8a5b; --d-l:#d7f0e4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#6aa7e8; --a-l:#1f3347; --b:#e0b25a; --b-l:#4a3b1f; --c:#ef7467; --c-l:#4a2a27; --d:#4cc38a; --d-l:#1f4033; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Chikungunya: de la picadura a la recuperación</text>

  <rect x="40" y="78" width="160" height="150" rx="10" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="120" y="102" text-anchor="middle" class="hd" style="fill:var(--a)">1 · Picadura</text>
  <text x="120" y="130" text-anchor="middle" class="small">Mosquito Aedes</text>
  <text x="120" y="146" text-anchor="middle" class="small">infectado (Ae. aegypti</text>
  <text x="120" y="162" text-anchor="middle" class="small">o Ae. albopictus)</text>
  <text x="120" y="192" text-anchor="middle" class="small muted">Pica de día</text>

  <path d="M202 153 L 218 153" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="222" y="78" width="160" height="150" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text x="302" y="102" text-anchor="middle" class="hd">2 · Incubación</text>
  <text x="302" y="134" text-anchor="middle" class="lab" style="font-weight:700">4 a 8 días</text>
  <text x="302" y="154" text-anchor="middle" class="small muted">(rango de 2 a 12)</text>
  <text x="302" y="190" text-anchor="middle" class="small muted">Sin síntomas todavía</text>

  <path d="M384 153 L 400 153" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="404" y="78" width="190" height="150" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="499" y="102" text-anchor="middle" class="hd" style="fill:var(--c)">3 · Fase aguda</text>
  <text x="499" y="128" text-anchor="middle" class="lab" style="font-weight:700">Fiebre brusca</text>
  <text x="499" y="146" text-anchor="middle" class="lab" style="font-weight:700">Dolor articular intenso</text>
  <text x="499" y="170" text-anchor="middle" class="small">Hinchazón de articulaciones,</text>
  <text x="499" y="186" text-anchor="middle" class="small">dolor muscular y de cabeza,</text>
  <text x="499" y="202" text-anchor="middle" class="small">náuseas, cansancio, erupción</text>

  <path d="M596 153 L 612 153" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="616" y="78" width="144" height="150" rx="10" fill="var(--d-l)" stroke="var(--d)" stroke-width="2"/>
  <text x="688" y="102" text-anchor="middle" class="hd" style="fill:var(--d)">4 · Después</text>
  <text x="688" y="128" text-anchor="middle" class="small">La mayoría mejora</text>
  <text x="688" y="144" text-anchor="middle" class="small">en alrededor de</text>
  <text x="688" y="160" text-anchor="middle" class="small">una semana</text>
  <text x="688" y="186" text-anchor="middle" class="small muted">El dolor articular</text>
  <text x="688" y="202" text-anchor="middle" class="small muted">puede durar meses</text>

  <rect x="40" y="248" width="350" height="136" rx="10" fill="var(--panel)" stroke="var(--d)" stroke-width="2"/>
  <text x="215" y="272" text-anchor="middle" class="hd" style="fill:var(--d)">Qué ayuda</text>
  <text x="215" y="298" text-anchor="middle" class="lab">Líquidos en abundancia y reposo</text>
  <text x="215" y="320" text-anchor="middle" class="lab">Paracetamol, como indique el profesional</text>
  <text x="215" y="342" text-anchor="middle" class="lab">Mosquitero, repelente y ropa que cubra</text>
  <text x="215" y="366" text-anchor="middle" class="small muted">Evitar picaduras la primera semana</text>

  <rect x="410" y="248" width="350" height="136" rx="10" fill="var(--panel)" stroke="var(--c)" stroke-width="2"/>
  <text x="585" y="272" text-anchor="middle" class="hd" style="fill:var(--c)">Qué evitar y cuándo consultar</text>
  <text x="585" y="298" text-anchor="middle" class="lab">Aspirina y antiinflamatorios hasta</text>
  <text x="585" y="316" text-anchor="middle" class="lab">descartar dengue: riesgo de sangrado</text>
  <text x="585" y="342" text-anchor="middle" class="lab">Consulte si es un bebé, persona mayor,</text>
  <text x="585" y="360" text-anchor="middle" class="lab">embarazada o con enfermedad crónica</text>
</svg>
