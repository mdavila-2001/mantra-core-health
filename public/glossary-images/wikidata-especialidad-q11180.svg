  <path d="M376.0 230.0 L250 216" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="120" y="198" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="185.0" y="219.0" text-anchor="middle" class="small">Riñones</text>
