  <path d="M400.0 138.0 L550 116" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="550" y="98" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="615.0" y="119.0" text-anchor="middle" class="small">Hormonas</text>
  <circle cx="460.0" cy="230.0" r="6" fill="var(--accent)"/>
  <path d="M460.0 230.0 L550 166" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="550" y="148" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="615.0" y="169.0" text-anchor="middle" class="small">Sangre</text>
  <circle cx="430.0" cy="260.0" r="6" fill="var(--accent)"/>
  <path d="M430.0 260.0 L550 216" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="550" y="198" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="615.0" y="219.0" text-anchor="middle" class="small">Infecciones</text>
  <circle cx="440.0" cy="380.0" r="6" fill="var(--accent)"/>
  <path d="M440.0 380.0 L550 266" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="550" y="248" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="615.0" y="269.0" text-anchor="middle" class="small">Articulaciones</text>
  <rect x="40" y="330" width="200" height="96" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="140" y="356" text-anchor="middle" class="step">Pacientes típicos</text>
  <text x="140" y="378" text-anchor="middle" class="small">Varias enfermedades</text>
  <text x="140" y="396" text-anchor="middle" class="small">Síntomas sin causa clara</text>
  <text x="140" y="414" text-anchor="middle" class="small">Ingresos hospitalarios</text>
  <rect x="560" y="330" width="200" height="96" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="660" y="356" text-anchor="middle" class="step">Su papel</text>
  <text x="660" y="378" text-anchor="middle" class="small">Integra el diagnóstico</text>
  <text x="660" y="396" text-anchor="middle" class="small">Ajusta tratamientos</text>
  <text x="660" y="414" text-anchor="middle" class="small">Coordina especialistas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
