  <text x="185.0" y="119.0" text-anchor="middle" class="small">Corazón</text>
  <circle cx="376.0" cy="172.0" r="6" fill="var(--accent)"/>
  <path d="M376.0 172.0 L250 166" stroke="var(--accent)" stroke-width="1.2" fill="none"/>
  <rect x="120" y="148" width="130" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="185.0" y="169.0" text-anchor="middle" class="small">Pulmones</text>
