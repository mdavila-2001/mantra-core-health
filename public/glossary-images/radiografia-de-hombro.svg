<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Radiografía de hombro</title>
  <desc id="d">A la izquierda, una persona de pie entre un tubo de rayos X y un detector. A la derecha, una placa esquemática del hombro con la clavícula, el acromion, la escápula y la cabeza del húmero, y lo que permite ver la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se toma</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué se ve en la placa</text>
<circle cx="180" cy="127.6" r="17.6" fill="var(--skin)" stroke="var(--line)"/>
<path d="M170.4 143.6 L140.0 154.8 C132.0 158.0 130.4 166.0 129.6 174.0 L122.4 246.0 L133.6 247.6 L143.2 183.6 L144.8 238.0 L143.2 350.0 L168.8 350.0 L176.8 254.0 L183.2 254.0 L191.2 350.0 L216.8 350.0 L215.2 238.0 L216.8 183.6 L226.4 247.6 L237.6 246.0 L230.4 174.0 C229.6 166.0 228.0 158.0 220.0 154.8 L189.6 143.6 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="300" y="150" width="60" height="56" rx="8" fill="var(--accent)"/>
<text x="330" y="228" text-anchor="middle" class="small" style="fill:var(--accent)">Tubo de</text>
<text x="330" y="244" text-anchor="middle" class="small" style="fill:var(--accent)">rayos X</text>
<polygon points="300,166 300,190 80,236 80,110" fill="var(--yellow)" opacity=".4"/>
<rect x="62" y="100" width="18" height="150" rx="6" fill="var(--accent)"/>
<text x="40" y="274" class="small" style="fill:var(--accent)">Detector</text>
<text x="200" y="80" text-anchor="middle" class="lab">El haz atraviesa el hombro</text>
<text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">De pie o sentado; se toman</text>
<text x="200" y="428" text-anchor="middle" class="small" style="fill:var(--muted)">varias proyecciones</text>
<rect x="416" y="64" width="344" height="300" rx="12" fill="var(--xray)"/>
<path d="M430 110 Q520 96 640 118" fill="none" stroke="var(--xbone)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M630 104 Q680 100 700 130 Q690 150 660 150" fill="var(--xbone)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M600 150 Q560 200 590 330 L660 330 Q650 230 640 160 Z" fill="var(--xbone)" stroke="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="670" cy="182" r="34" fill="var(--xbone)"/>
<path d="M650 200 L660 360 L700 360 L702 200 Z" fill="var(--xbone)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="440" y="92" class="small" style="fill:var(--xtxt)">Clavícula</text>
<text x="700" y="96" class="small" style="fill:var(--xtxt)">Acromion</text>
<text x="706" y="230" class="small" style="fill:var(--xtxt)">Húmero</text>
<text x="480" y="240" class="small" style="fill:var(--xtxt)">Escápula</text>
<text x="416" y="392" class="small">Muestra fracturas, luxaciones, artrosis</text>
<text x="416" y="410" class="small">y calcificaciones; los tendones se ven mejor</text>
<text x="416" y="428" class="small">con ecografía o resonancia.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
