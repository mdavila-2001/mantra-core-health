<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Densitometría ósea (DXA)</title>
  <desc id="d">A la izquierda, una persona tumbada en la camilla del densitómetro, con la fuente de rayos X de baja dosis bajo la camilla y el detector encima recorriendo la cadera y la columna. A la derecha, la comparación entre un hueso denso y uno poroso, y las tres categorías del resultado: normal, osteopenia y osteoporosis.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Cómo se hace la DXA</text>
  <rect x="50" y="260" width="360" height="22" rx="6" fill="var(--bone)"/>
  <rect x="70" y="282" width="20" height="120" fill="var(--bone)"/>
  <rect x="370" y="282" width="20" height="120" fill="var(--bone)"/>
  <path d="M80 232 C90 214 120 212 130 226 L330 232 C360 232 380 244 380 256 L80 256 Z" fill="var(--tissue)" stroke="var(--line)"/>
  <circle cx="102" cy="230" r="20" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="200" y="96" width="120" height="30" rx="8" fill="var(--accent)"/>
  <text x="260" y="116" text-anchor="middle" class="lab" style="fill:var(--on)">Detector</text>
  <path d="M326 110 H360 V300 H326" fill="none" stroke="var(--accent)" stroke-width="8"/>
  <rect x="230" y="296" width="60" height="18" rx="4" fill="var(--accent)"/>
  <text x="260" y="334" text-anchor="middle" class="small">Fuente de rayos X de baja dosis</text>
  <polygon points="250,296 270,296 290,126 230,126" fill="var(--beam)" opacity=".45"/>
  <path d="M160 170 L300 170" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="5 4"/>
  <text x="150" y="166" text-anchor="end" class="small">El brazo recorre</text>
  <text x="150" y="182" text-anchor="end" class="small">cadera y columna</text>
  <text x="230" y="370" text-anchor="middle" class="small muted">La persona permanece tumbada y quieta</text>
  <text x="230" y="388" text-anchor="middle" class="small muted">unos minutos; no duele</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Qué evalúa</text>
  <circle cx="545" cy="120" r="50" fill="var(--bone)"/>
  <circle cx="525" cy="100" r="5" fill="var(--panel)"/>
  <circle cx="560" cy="95" r="5" fill="var(--panel)"/>
  <circle cx="540" cy="130" r="5" fill="var(--panel)"/>
  <circle cx="570" cy="135" r="5" fill="var(--panel)"/>
  <circle cx="515" cy="140" r="5" fill="var(--panel)"/>
  <circle cx="550" cy="112" r="5" fill="var(--panel)"/>
  <circle cx="695" cy="120" r="50" fill="var(--bone)"/>
  <circle cx="675" cy="100" r="13" fill="var(--panel)"/>
  <circle cx="712" cy="96" r="11" fill="var(--panel)"/>
  <circle cx="690" cy="135" r="14" fill="var(--panel)"/>
  <circle cx="722" cy="135" r="9" fill="var(--panel)"/>
  <circle cx="668" cy="140" r="8" fill="var(--panel)"/>
  <circle cx="700" cy="115" r="7" fill="var(--panel)"/>
  <text x="545" y="192" text-anchor="middle" class="small">Hueso denso</text>
  <text x="695" y="192" text-anchor="middle" class="small">Hueso poroso</text>
  <text x="620" y="232" text-anchor="middle" class="step">Densidad mineral ósea</text>
  <rect x="480" y="250" width="90" height="34" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="525.0" y="272.0" text-anchor="middle" class="small">Normal</text>
  <rect x="575" y="250" width="90" height="34" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="620.0" y="272.0" text-anchor="middle" class="small">Osteopenia</text>
  <rect x="670" y="250" width="90" height="34" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="715.0" y="272.0" text-anchor="middle" class="small">Osteoporosis</text>
  <text x="480" y="320" class="small">• Mide sobre todo columna lumbar</text>
  <text x="480" y="344" class="small">• y cadera</text>
  <text x="480" y="368" class="small">• Estima el riesgo de fractura</text>
  <text x="480" y="392" class="small">• Sirve para seguir el tratamiento</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
