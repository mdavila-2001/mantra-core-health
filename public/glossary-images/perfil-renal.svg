<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Perfil renal</title>
  <desc id="d">Un riñón, un tubo de sangre y un frasco de orina, con la lista de pruebas que suele incluir el perfil: creatinina y filtrado, urea, electrolitos, calcio, fósforo, ácido úrico y proteínas en orina. A la derecha, para qué sirve y qué factores influyen.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Qué incluye</text>
<path d="M110,78.0 C63.2,75.4 63.2,184.6 110,182.0 C138.6,179.4 125.6,143.0 117.8,130 C125.6,117.0 138.6,80.6 110,78.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="210" text-anchor="middle" class="step">Riñón</text>
<rect x="200" y="94" width="30" height="96" rx="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
<rect x="203" y="129.5" width="24" height="57.50000000000001" rx="10" fill="var(--vessel)" stroke-width="1" opacity=".8"/>
<rect x="197" y="80" width="36" height="18" rx="4" fill="var(--vessel)" stroke-width="1"/>
<text x="215" y="208" text-anchor="middle" class="small">Sangre</text>
<path d="M300,106 L306,180 Q330,188 354,180 L360,106 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M303,136 L306,178 Q330,185 354,178 L357,136 Z" fill="var(--beam)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="296" y="90" width="68" height="16" rx="4" fill="var(--accent)" stroke-width="1"/>
<text x="330" y="208" text-anchor="middle" class="small">Orina</text>
<text x="40" y="250" class="lab">• Creatinina y filtrado (TFGe)</text>
<text x="40" y="276" class="lab">• Urea (nitrógeno ureico)</text>
<text x="40" y="302" class="lab">• Sodio, potasio, cloro</text>
<text x="40" y="328" class="lab">• Calcio, fósforo, ácido úrico</text>
<text x="40" y="354" class="lab">• En orina: proteínas o albúmina</text>
<text x="220" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">La combinación concreta varía según el laboratorio.</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Para qué sirve</text>
<text x="456" y="76" class="lab">• Saber cuánto filtran los riñones</text>
<text x="456" y="102" class="lab">• Vigilar diabetes e hipertensión</text>
<text x="456" y="128" class="lab">• Controlar fármacos que afectan al riñón</text>
<text x="456" y="154" class="lab">• Detectar deshidratación o desequilibrios</text>
<rect x="456" y="196" width="304" height="96" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="470" y="220" class="step">El filtrado se estima</text>
<text x="470" y="244" class="lab">a partir de la creatinina, la edad</text>
<text x="470" y="264" class="lab">y el sexo.</text>
<text x="456" y="324" class="lab">Influyen: hidratación, masa muscular,</text>
<text x="456" y="344" class="lab">dieta rica en proteínas y fármacos.</text>
<text x="456" y="384" class="small" style="fill:var(--muted)">Un solo valor alterado suele</text>
<text x="456" y="402" class="small" style="fill:var(--muted)">repetirse antes de sacar conclusiones.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
