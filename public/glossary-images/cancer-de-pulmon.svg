<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cáncer de pulmón</title>
  <desc id="d">A la izquierda, los pulmones con un tumor en el pulmón derecho del paciente, ganglios cercanos afectados y una flecha que indica su posible extensión a otros órganos. A la derecha, el tabaco como principal factor de riesgo, los síntomas a vigilar y los dos grandes tipos: no microcítico y microcítico.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dónde crece y hacia dónde va</text>
  <path d="M200 98.49999999999999 V166.0" fill="none" stroke="var(--muted)" stroke-width="13.5" stroke-linecap="round"/>
  <path d="M200 166.0 L159.5 206.5 M200 166.0 L240.5 206.5" fill="none" stroke="var(--muted)" stroke-width="9.450000000000001" stroke-linecap="round"/>
  <path d="M181.1 139.0 C119.0 112.0 65.0 193.0 65.0 287.5 C65.0 341.5 146.0 341.5 175.7 314.5 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <path d="M218.9 139.0 C281.0 112.0 335.0 193.0 335.0 287.5 C335.0 341.5 254.0 341.5 224.3 314.5 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5" opacity=".85"/>
  <circle cx="140" cy="200" r="22" fill="var(--purple)"/>
  <text x="80" y="150" text-anchor="middle" class="step" style="fill:var(--purple)">Tumor</text>
  <path d="M90 156 L128 186" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <circle cx="186" cy="170" r="7" fill="var(--nerve)"/>
  <circle cx="216" cy="176" r="7" fill="var(--nerve)"/>
  <circle cx="206" cy="160" r="7" fill="var(--nerve)"/>
  <text x="260" y="150" class="small">Ganglios</text>
  <path d="M256 148 L218 168" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <path d="M120 222 Q90 300 70 330" fill="none" stroke="var(--purple)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="200" y="360" text-anchor="middle" class="lab">Puede extenderse a ganglios,</text>
  <text x="200" y="380" text-anchor="middle" class="lab">cerebro, hueso, hígado o suprarrenales</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Lo esencial</text>
  <text x="436" y="70" class="step">Principal factor de riesgo</text>
  <rect x="436" y="82" width="324" height="44" rx="10" fill="var(--warn-l)"/>
  <text x="598" y="109" text-anchor="middle" class="lab">Fumar, también el humo ajeno</text>
  <text x="436" y="156" class="small muted">Otros: radón, amianto, contaminación</text>
  <text x="436" y="196" class="step">Síntomas a vigilar</text>
  <text x="440" y="222" class="lab">• Tos nueva que no se va</text>
  <text x="440" y="246" class="lab">• Sangre al toser</text>
  <text x="440" y="270" class="lab">• Falta de aire o dolor de pecho</text>
  <text x="440" y="294" class="lab">• Pérdida de peso sin motivo</text>
  <text x="436" y="340" class="step">Tipos</text>
  <rect x="436" y="352" width="156" height="34" rx="8" fill="var(--accent)"/>
  <text x="514.0" y="373.32" text-anchor="middle" class="small" style="fill:var(--on)">No microcítico</text>
  <rect x="604" y="352" width="156" height="34" rx="8" fill="var(--purple)"/>
  <text x="682.0" y="373.32" text-anchor="middle" class="small" style="fill:var(--on)">Microcítico</text>
  <text x="598" y="410" text-anchor="middle" class="small muted">Diagnóstico con imagen y biopsia</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
