<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Corte de un bronquio: normal, en broncoespasmo y tras un agonista beta 2</title>
  <desc id="d">Tres cortes transversales de un bronquio pequeño. En el primero la luz es amplia. En el segundo el músculo liso se contrae, la mucosa se pliega y la luz queda muy estrecha. En el tercero, tras un agonista beta 2 de acción corta, el músculo se relaja y la luz se ensancha, aunque la inflamación de la mucosa puede persistir.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --musc:#e9b27a; --musc-d:#b9742f; --muc:#f0b9b0; --muc-d:#c0685b; --lum:#f6f8fb; --ok:#1f8a5b; --bad:#c0392b; --acc:#2a6fb0; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --musc:#a86b34; --musc-d:#e0a066; --muc:#9c5a52; --muc-d:#e08a7a; --lum:#0e141b; --ok:#4cc38a; --bad:#ef7467; --acc:#6fb0ee; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 14px; }
    .lab { font-size: 13px; }
    .tag { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="23" y="16" width="244" height="372" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="145" y="46" text-anchor="middle" class="title">Vía aérea abierta</text>
  <rect x="278" y="16" width="244" height="372" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="46" text-anchor="middle" class="title">Broncoespasmo</text>
  <rect x="533" y="16" width="244" height="372" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="655" y="46" text-anchor="middle" class="title">Tras el agonista β2</text>
<circle cx="145" cy="170" r="76" fill="var(--musc)" stroke="var(--musc-d)" stroke-width="2"/>
<circle cx="145" cy="170" r="64" fill="var(--muc)" stroke="var(--muc-d)" stroke-width="2"/>
<circle cx="145" cy="170" r="50" fill="var(--lum)" stroke="var(--muc-d)" stroke-width="2"/>
<circle cx="400" cy="170" r="76" fill="var(--musc)" stroke="var(--musc-d)" stroke-width="2"/>
<circle cx="400" cy="170" r="50" fill="var(--muc)" stroke="var(--muc-d)" stroke-width="2"/>
<polygon points="430.0,170.0 421.9,172.3 429.3,176.2 420.9,176.8 427.4,182.2 419.1,181.0 424.3,187.6 416.3,184.7 420.1,192.3 412.9,187.8 415.0,196.0 408.9,190.1 409.3,198.5 404.6,191.5 403.1,199.8 400.0,192.0 396.9,199.8 395.4,191.5 390.7,198.5 391.1,190.1 385.0,196.0 387.1,187.8 379.9,192.3 383.7,184.7 375.7,187.6 380.9,181.0 372.6,182.2 379.1,176.8 370.7,176.2 378.1,172.3 370.0,170.0 378.1,167.7 370.7,163.8 379.1,163.2 372.6,157.8 380.9,159.0 375.7,152.4 383.7,155.3 379.9,147.7 387.1,152.2 385.0,144.0 391.1,149.9 390.7,141.5 395.4,148.5 396.9,140.2 400.0,148.0 403.1,140.2 404.6,148.5 409.3,141.5 408.9,149.9 415.0,144.0 412.9,152.2 420.1,147.7 416.3,155.3 424.3,152.4 419.1,159.0 427.4,157.8 420.9,163.2 429.3,163.8 421.9,167.7" fill="var(--lum)" stroke="var(--muc-d)" stroke-width="2"/>
<circle cx="655" cy="170" r="76" fill="var(--musc)" stroke="var(--musc-d)" stroke-width="2"/>
<circle cx="655" cy="170" r="60" fill="var(--muc)" stroke="var(--muc-d)" stroke-width="2"/>
<circle cx="655" cy="170" r="38" fill="var(--lum)" stroke="var(--muc-d)" stroke-width="2"/>
  <text x="145" y="175" text-anchor="middle" class="lab muted">luz</text>
  <text x="400" y="175" text-anchor="middle" class="lab muted">luz</text>
  <text x="655" y="175" text-anchor="middle" class="lab muted">luz</text>
  <text x="145" y="278" text-anchor="middle" class="lab">Músculo liso relajado</text>
  <text x="145" y="298" text-anchor="middle" class="lab">Mucosa fina</text>
  <rect x="37" y="322" width="216" height="40" rx="20" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <text x="145" y="347" text-anchor="middle" class="tag" style="fill:var(--ok)">Aire con poca resistencia</text>
  <text x="400" y="278" text-anchor="middle" class="lab">Músculo liso contraído</text>
  <text x="400" y="298" text-anchor="middle" class="lab">Mucosa edematosa y con moco</text>
  <rect x="292" y="322" width="216" height="40" rx="20" fill="none" stroke="var(--bad)" stroke-width="2"/>
  <text x="400" y="347" text-anchor="middle" class="tag" style="fill:var(--bad)">Luz muy estrecha: sibilancias</text>
  <text x="655" y="278" text-anchor="middle" class="lab">Músculo liso relajado</text>
  <text x="655" y="298" text-anchor="middle" class="lab">Inflamación aún presente</text>
  <rect x="547" y="322" width="216" height="40" rx="20" fill="none" stroke="var(--acc)" stroke-width="2"/>
  <text x="655" y="347" text-anchor="middle" class="tag" style="fill:var(--acc)">Alivio de la obstrucción</text>
  <rect x="150" y="402" width="14" height="14" rx="3" fill="var(--musc)" stroke="var(--musc-d)"/>
  <text x="172" y="414" class="lab">Músculo liso</text>
  <rect x="290" y="402" width="14" height="14" rx="3" fill="var(--muc)" stroke="var(--muc-d)"/>
  <text x="312" y="414" class="lab">Mucosa y submucosa</text>
  <rect x="490" y="402" width="14" height="14" rx="3" fill="var(--lum)" stroke="var(--muc-d)"/>
  <text x="512" y="414" class="lab">Luz por donde pasa el aire</text>
  <text x="400" y="444" text-anchor="middle" class="sub muted">El agonista β2 actúa sobre el músculo; el tratamiento de la inflamación es otro.</text>
  <text x="400" y="466" text-anchor="middle" class="sub muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
