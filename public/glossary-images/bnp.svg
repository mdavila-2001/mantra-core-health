<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué mide la prueba de BNP</title>
  <desc id="d">A la izquierda, un corazón con los ventrículos estirados que liberan péptido natriurético tipo B a la sangre. En el centro, un tubo de sangre venosa. A la derecha, lo que ayuda a evaluar: sospecha de insuficiencia cardíaca, gravedad y respuesta al tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">BNP: la hormona del corazón sobrecargado</text>
  <rect x="20" y="60" width="270" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="155.0" y="88" text-anchor="middle" class="h">Dónde se produce</text>
  <path d="M155 315.0 C115.0 285.0 65.0 250.0 65.0 205.0 C65.0 165.0 110.0 150.0 155 185.0 C200.0 150.0 245.0 165.0 245.0 205.0 C245.0 250.0 195.0 285.0 155 315.0 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <text x="155" y="200" text-anchor="middle" class="lab b">Ventrículos</text>
  <line x1="70" y1="210" x2="40" y2="210" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="240" y1="210" x2="270" y2="210" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="155" y1="312" x2="155" y2="340" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="155" y="128" text-anchor="middle" class="small">Pared estirada por presión</text>
  <text x="155" y="144" text-anchor="middle" class="small">o volumen excesivo</text>
  <circle cx="110" cy="360" r="6" fill="var(--pur)"/>
  <circle cx="140" cy="372" r="6" fill="var(--pur)"/>
  <circle cx="175" cy="360" r="6" fill="var(--pur)"/>
  <circle cx="205" cy="374" r="6" fill="var(--pur)"/>
  <circle cx="95" cy="380" r="6" fill="var(--pur)"/>
  <text x="155" y="408" text-anchor="middle" class="lab" style="fill:var(--pur)">Libera BNP a la sangre</text>
  <rect x="306" y="60" width="188" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="88" text-anchor="middle" class="h">La muestra</text>
  <rect x="386" y="120" width="26" height="80" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="388" y="150" width="22" height="48" rx="10" fill="var(--red)" opacity=".85"/>
  <rect x="383" y="112" width="32" height="12" rx="3" fill="var(--accent)"/>
  <text x="399" y="220" text-anchor="middle" class="small muted">Sangre venosa</text>
  <text x="322" y="280" class="small">Se mide la cantidad</text>
  <text x="322" y="302" class="small">de BNP en plasma</text>
  <text x="322" y="324" class="small">o suero.</text>
  <text x="322" y="346" class="small"></text>
  <text x="322" y="368" class="small">Existe una prueba</text>
  <text x="322" y="390" class="small">parecida: NT-proBNP.</text>
  <rect x="510" y="60" width="270" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="645.0" y="88" text-anchor="middle" class="h">Qué ayuda a evaluar</text>
  <text x="528" y="120" class="lab">• Sospecha de insuficiencia</text>
  <text x="539" y="150" class="lab">cardíaca ante disnea</text>
  <text x="528" y="180" class="lab">• Gravedad y pronóstico</text>
  <text x="528" y="210" class="lab">• Respuesta al tratamiento</text>
  <text x="528" y="240" class="lab">• Valor bajo: hace menos</text>
  <text x="539" y="270" class="lab">probable el origen cardíaco</text>
  <text x="528" y="300" class="lab">• Influyen edad, riñón</text>
  <text x="539" y="330" class="lab">y peso corporal</text>
  <line x1="292" y1="250" x2="304" y2="250" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="496" y1="250" x2="508" y2="250" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
