<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Caries dental</title>
  <desc id="d">A la izquierda, un diente con sus capas: esmalte, dentina, pulpa y encía, y una caries oscura en el esmalte que avanza hacia dentro. A la derecha, la cadena que la produce: azúcar, bacterias de la placa, ácido y pérdida de minerales, y las medidas de prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Las capas del diente</text>
  <path d="M89.5 160 C82.60000000000001 79.5 135.5 63.400000000000006 170 79.5 C204.5 63.400000000000006 257.4 79.5 250.5 160 C239.0 229.0 216.0 355.5 195.3 355.5 C179.2 355.5 181.5 252.0 170 240.5 C158.5 252.0 160.8 355.5 144.7 355.5 C124.0 355.5 101.0 229.0 89.5 160 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="M98 160 C92 90 140 76 170 92 C200 76 248 90 242 160 C236 220 200 230 170 226 C140 230 104 220 98 160 Z" fill="var(--beam)" opacity=".55"/>
  <path d="M130 160 C130 130 150 120 170 130 C190 120 210 130 210 160 C210 200 190 210 170 300 C150 210 130 200 130 160 Z" fill="var(--organ)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M206 96 C214 110 216 128 206 140 C198 128 196 110 206 96 Z" fill="var(--ink)" opacity=".75"/>
  <path d="M60 230 Q170 250 280 230" fill="none" stroke="var(--organ)" stroke-width="5" opacity=".6"/>
  <text x="300" y="98" class="lab">Esmalte</text>
  <text x="300" y="150" class="lab">Dentina</text>
  <text x="300" y="190" class="lab">Pulpa (nervio)</text>
  <text x="300" y="240" class="lab">Encía</text>
  <path d="M296 94 L248 106 M296 146 L228 160 M296 186 L196 190 M296 236 L262 234" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="214" y="76" class="step" style="fill:var(--warn)">Caries</text>
  <text x="200" y="396" text-anchor="middle" class="lab">La lesión avanza de fuera hacia dentro</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Cómo se forma</text>
  <rect x="476" y="64" width="244" height="38" rx="8" fill="var(--nerve)"/>
  <text x="598.0" y="87.68" text-anchor="middle" class="lab" style="fill:var(--on)">Azúcar</text>
  <line x1="598" y1="104" x2="598" y2="124" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="476" y="128" width="244" height="38" rx="8" fill="var(--ok)"/>
  <text x="598.0" y="151.68" text-anchor="middle" class="lab" style="fill:var(--on)">Bacterias de la placa</text>
  <line x1="598" y1="168" x2="598" y2="188" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="476" y="192" width="244" height="38" rx="8" fill="var(--warn)"/>
  <text x="598.0" y="215.68" text-anchor="middle" class="lab" style="fill:var(--on)">Ácido</text>
  <line x1="598" y1="232" x2="598" y2="252" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="476" y="256" width="244" height="38" rx="8" fill="var(--purple)"/>
  <text x="598.0" y="279.68" text-anchor="middle" class="lab" style="fill:var(--on)">Pierde minerales</text>
  <text x="436" y="340" class="step">Se previene con</text>
  <text x="440" y="366" class="lab">• Cepillado con pasta con flúor</text>
  <text x="440" y="388" class="lab">• Menos azúcar entre horas</text>
  <text x="440" y="410" class="lab">• Revisiones dentales</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
