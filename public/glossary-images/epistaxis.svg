<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Epistaxis: sangrado nasal</title>
  <desc id="d">A la izquierda, un perfil de la nariz con la zona anterior del tabique, origen de la mayoría de los sangrados, y la zona posterior, menos frecuente y más seria, junto a sus causas habituales. A la derecha, cuatro pasos de primeros auxilios: inclinarse hacia delante, apretar la parte blanda de la nariz, mantener la presión y no tragar sangre, y señales para buscar atención urgente.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">De dónde sangra la nariz</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué hacer</text>
<path d="M40 70 L130 70 C140 100 150 120 160 140 L250 228 C258 238 252 250 240 250 L210 252 C214 262 214 270 208 276 L40 296 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 160 C180 180 210 210 230 234" fill="none" stroke="var(--organ-l)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="226" cy="230" r="13" fill="var(--bad)" opacity=".6"/>
<circle cx="156" cy="166" r="11" fill="var(--purple)" opacity=".5"/>
<text x="56" y="210" class="small" style="fill:var(--purple)">Zona posterior</text>
<text x="56" y="226" class="small" style="fill:var(--muted)">(rara, más seria)</text>
<line x1="110" y1="198" x2="150" y2="172" stroke="var(--purple)" stroke-width="1"/>
<text x="240" y="288" class="small" style="fill:var(--bad)">Zona anterior</text>
<text x="240" y="304" class="small" style="fill:var(--muted)">(la más frecuente)</text>
<line x1="260" y1="276" x2="232" y2="240" stroke="var(--bad)" stroke-width="1"/>
<text x="40" y="330" class="h">Causas frecuentes</text>
<text x="40" y="356" class="lab">• Aire seco</text>
<text x="40" y="378" class="lab">• Hurgarse la nariz</text>
<text x="40" y="400" class="lab">• Resfriados, golpes</text>
<text x="210" y="356" class="lab">• Anticoagulantes</text>
<text x="210" y="378" class="lab">• Hipertensión</text>
<text x="210" y="400" class="lab">• Alergias</text>
<circle cx="432" cy="86" r="14" fill="var(--accent)"/>
<text x="432" y="91" text-anchor="middle" class="step" style="fill:var(--on)">1</text>
<text x="456" y="91" class="lab">Sentarse inclinado hacia delante</text>
<circle cx="432" cy="132" r="14" fill="var(--accent)"/>
<text x="432" y="137" text-anchor="middle" class="step" style="fill:var(--on)">2</text>
<text x="456" y="137" class="lab">Apretar la parte blanda de la nariz</text>
<circle cx="432" cy="178" r="14" fill="var(--accent)"/>
<text x="432" y="183" text-anchor="middle" class="step" style="fill:var(--on)">3</text>
<text x="456" y="183" class="lab">Mantener 10 a 15 minutos sin soltar</text>
<circle cx="432" cy="224" r="14" fill="var(--accent)"/>
<text x="432" y="229" text-anchor="middle" class="step" style="fill:var(--on)">4</text>
<text x="456" y="229" class="lab">Respirar por la boca, no tragar sangre</text>
<text x="416" y="276" class="lab" style="fill:var(--bad)">No echar la cabeza hacia atrás.</text>
<rect x="416" y="296" width="344" height="124" rx="10" fill="var(--bad-l)"/>
<text x="432" y="320" class="h" style="fill:var(--bad)">Buscar atención urgente si</text>
<text x="432" y="346" class="lab">• No para tras 20 minutos</text>
<text x="432" y="368" class="lab">• Sangrado abundante o tras un golpe</text>
<text x="432" y="390" class="lab">• Mareo, palidez o toma anticoagulantes</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
