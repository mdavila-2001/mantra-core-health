<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Rehabilitación</title>
  <desc id="d">En el centro, una persona rodeada por el ciclo de la rehabilitación: valoración de lo que puede hacer, fijación de objetivos, intervención con terapias y ayudas, y reevaluación para ajustar el plan. A los lados, las disciplinas que participan: fisioterapia, terapia ocupacional, logopedia, psicología, productos de apoyo y trabajo social.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">El ciclo de la rehabilitación</text>
  <rect x="310" y="80" width="180" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="400" y="106" text-anchor="middle" class="step">Valoración</text>
  <text x="400" y="126" text-anchor="middle" class="small">Qué puede y qué no</text>
  <rect x="530" y="210" width="180" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="620" y="236" text-anchor="middle" class="step">Objetivos</text>
  <text x="620" y="256" text-anchor="middle" class="small">Metas pactadas</text>
  <rect x="310" y="340" width="180" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="400" y="366" text-anchor="middle" class="step">Intervención</text>
  <text x="400" y="386" text-anchor="middle" class="small">Terapias y ayudas</text>
  <rect x="90" y="210" width="180" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="180" y="236" text-anchor="middle" class="step">Reevaluación</text>
  <text x="180" y="256" text-anchor="middle" class="small">Ajustar el plan</text>
  <path d="M492 100 C560 110 600 150 612 206" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M612 274 C600 330 560 366 494 372" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M308 372 C240 366 200 330 188 274" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M188 206 C200 150 240 110 306 100" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="400" cy="214" r="18" fill="var(--skin)" stroke="var(--line)"/>
  <path d="M400 232 V280 M400 248 L376 268 M400 248 L424 236 M400 280 L384 314 M400 280 L418 312" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="400" y="338" text-anchor="middle" class="small muted">La persona en el centro</text>
  <rect x="40" y="60" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="120.0" y="81.0" text-anchor="middle" class="small">Fisioterapia</text>
  <rect x="40" y="100" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="120.0" y="121.0" text-anchor="middle" class="small">Terapia ocupacional</text>
  <rect x="40" y="140" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="120.0" y="161.0" text-anchor="middle" class="small">Logopedia</text>
  <rect x="600" y="60" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="680.0" y="81.0" text-anchor="middle" class="small">Psicología</text>
  <rect x="600" y="100" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="680.0" y="121.0" text-anchor="middle" class="small">Productos de apoyo</text>
  <rect x="600" y="140" width="160" height="32" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="680.0" y="161.0" text-anchor="middle" class="small">Trabajo social</text>
  <text x="40" y="420" class="small">Para recuperar, conservar o mejorar</text>
  <text x="40" y="436" class="small">las capacidades de la vida diaria</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
