<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué miden las proteínas totales</title>
  <desc id="d">Barra que divide las proteínas totales del suero en albúmina y globulinas, con el hígado que fabrica la albúmina y las células plasmáticas que fabrican los anticuerpos. A la derecha, un tubo de suero y lo que la prueba ayuda a evaluar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Proteínas totales: albúmina más globulinas</text>
  <rect x="20" y="60" width="460" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="90" text-anchor="middle" class="title">Qué se suma</text>
  <rect x="60" y="110" width="380" height="54" rx="8" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="60" y="110" width="220" height="54" rx="8" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="170" y="142" text-anchor="middle" class="lab b">Albúmina</text>
  <text x="360" y="142" text-anchor="middle" class="lab b">Globulinas</text>
  <text x="250" y="186" text-anchor="middle" class="small muted">Proteínas totales del suero</text>
  <rect x="50" y="220" width="190" height="70" rx="10" fill="var(--organ)" stroke="var(--red)"/>
  <text x="145.0" y="252.0" text-anchor="middle" class="lab b">Hígado</text>
  <text x="145.0" y="269.0" text-anchor="middle" class="small muted">fabrica la albúmina</text>
  <rect x="260" y="220" width="190" height="70" rx="10" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="355.0" y="252.0" text-anchor="middle" class="lab b">Células plasmáticas</text>
  <text x="355.0" y="269.0" text-anchor="middle" class="small muted">fabrican anticuerpos</text>
  <text x="50" y="330" class="small">• Retiene líquido en los vasos</text>
  <text x="50" y="352" class="small">• Transporta hormonas</text>
  <text x="260" y="330" class="small">• Defensa (inmunoglobulinas)</text>
  <text x="260" y="352" class="small">• Transporte y coagulación</text>
  <text x="250" y="410" text-anchor="middle" class="small muted">Cada grupo puede cambiar por separado</text>
  <rect x="496" y="60" width="284" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="638.0" y="90" text-anchor="middle" class="title">Qué ayuda a evaluar</text>
  <rect x="526" y="105" width="26" height="80" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="528" y="135" width="22" height="48" rx="10" fill="var(--warn)" opacity=".85"/>
  <rect x="523" y="97" width="32" height="12" rx="3" fill="var(--accent)"/>
  <text x="539" y="205" text-anchor="middle" class="small muted">Suero</text>
  <text x="570" y="130" class="small">Suele pedirse</text>
  <text x="570" y="146" class="small">con la albúmina</text>
  <text x="514" y="250" class="lab">• Función del hígado</text>
  <text x="514" y="280" class="lab">• Pérdida renal de proteínas</text>
  <text x="514" y="310" class="lab">• Estado nutricional</text>
  <text x="514" y="340" class="lab">• Hidratación</text>
  <text x="514" y="370" class="lab">• Exceso de inmunoglobulinas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
