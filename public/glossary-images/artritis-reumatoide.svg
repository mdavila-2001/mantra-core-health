<circle cx="572" cy="104" r="5" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="1"/>
<rect x="587" y="76" width="18" height="70" rx="8" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<circle cx="596" cy="130" r="6" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="1"/>
<circle cx="596" cy="104" r="5" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="1"/>
<rect x="512" y="140" width="96" height="60" rx="16" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<rect x="608" y="150" width="14" height="40" rx="7" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<text x="680" y="100" text-anchor="middle" class="small">Nudillos</text>
<text x="680" y="116" text-anchor="middle" class="small">y dedos</text>
<text x="496" y="236" class="lab">Autoinmune: las defensas atacan</text>
<text x="496" y="258" class="lab">la membrana sinovial</text>
<text x="496" y="280" class="lab">Afecta ambos lados por igual</text>
<text x="496" y="302" class="lab">Rigidez matutina prolongada</text>
<text x="496" y="324" class="lab">Fatiga; puede afectar otros órganos</text>
<text x="496" y="368" class="step">Tratar pronto frena el daño:</text>
<text x="496" y="390" class="lab">fármacos modificadores (FAME),</text>
<text x="496" y="410" class="lab">ejercicio y control reumatológico.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
