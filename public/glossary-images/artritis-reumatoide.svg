<text x="130" y="350" text-anchor="middle" class="step">Sana</text>
<text x="340" y="350" text-anchor="middle" class="step">Artritis reumatoide</text>
<text x="130" y="370" text-anchor="middle" class="small" style="fill:var(--muted)">cartílago liso</text>
<text x="340" y="370" text-anchor="middle" class="small" style="fill:var(--muted)">sinovial inflamada (pannus)</text>
<text x="340" y="388" text-anchor="middle" class="small" style="fill:var(--muted)">y erosiones del hueso</text>
<text x="232" y="195" text-anchor="middle" class="small" style="fill:var(--accent)">Cartílago</text>
<rect x="476" y="20" width="304" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="628.0" y="50" text-anchor="middle" class="title">Cómo se presenta</text>
<rect x="515" y="76" width="18" height="70" rx="8" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<circle cx="524" cy="130" r="6" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="1"/>
<circle cx="524" cy="104" r="5" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="1"/>
