<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tipos de hipoacusia según la parte del oído afectada</title>
  <desc id="d">Esquema del oído dividido en externo, medio e interno, con el conducto, el tímpano, los huesecillos, la cóclea y el nervio auditivo. La hipoacusia conductiva afecta al oído externo o medio y la neurosensorial al interno o al nervio. A la derecha, causas frecuentes de cada tipo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Hipoacusia: dónde puede fallar la audición</text>
  <rect x="20" y="60" width="500" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270.0" y="88" text-anchor="middle" class="title">Partes del oído</text>
  <rect x="40" y="104" width="150" height="300" rx="10" fill="var(--accent-l)" stroke="none" opacity=".6"/>
  <rect x="190" y="104" width="110" height="300" rx="0" fill="var(--warn-l)" stroke="none" opacity=".6"/>
  <rect x="300" y="104" width="200" height="300" rx="10" fill="var(--pur-l)" stroke="none" opacity=".6"/>
  <text x="115" y="124" text-anchor="middle" class="small b">Oído externo</text>
  <text x="245" y="124" text-anchor="middle" class="small b">Medio</text>
  <text x="400" y="124" text-anchor="middle" class="small b">Interno</text>
  <path d="M70 160 C40 200 40 300 80 340 C100 320 90 280 100 260" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="90" y="240" width="104" height="30" rx="4" fill="var(--skin)" stroke="var(--muted)"/>
  <path d="M194 226 L198 284" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <path d="M206 250 l16 -6 l14 10 l14 -4 l12 8" fill="none" stroke="var(--bone)" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 280 C330 240 380 230 400 250 C420 270 400 300 380 296 C362 292 362 270 380 268 C392 266 394 280 386 282" fill="none" stroke="var(--pur)" stroke-width="7" stroke-linecap="round"/>
  <path d="M400 250 C430 220 460 200 490 196" fill="none" stroke="var(--warn)" stroke-width="4"/>
  <text x="120" y="296" text-anchor="middle" class="small">Conducto</text>
  <text x="196" y="310" text-anchor="middle" class="small">Tímpano</text>
  <text x="250" y="230" text-anchor="middle" class="small">Huesecillos</text>
  <text x="370" y="330" text-anchor="middle" class="small">Cóclea</text>
  <text x="460" y="186" text-anchor="middle" class="small">Nervio</text>
  <rect x="50" y="350" width="240" height="44" rx="10" fill="var(--panel)" stroke="var(--warn)"/>
  <text x="170.0" y="377.0" text-anchor="middle" class="small">Conductiva: el sonido no pasa</text>
  <rect x="306" y="350" width="190" height="44" rx="10" fill="var(--panel)" stroke="var(--pur)"/>
  <text x="401.0" y="377.0" text-anchor="middle" class="small">Neurosensorial</text>
  <rect x="536" y="60" width="244" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="658.0" y="88" text-anchor="middle" class="h">Causas frecuentes</text>
  <text x="552" y="110" class="lab b">Conductiva</text>
  <text x="552" y="134" class="small">• Tapón de cera</text>
  <text x="552" y="156" class="small">• Otitis o líquido</text>
  <text x="552" y="178" class="small">• Perforación</text>
  <text x="552" y="220" class="lab b">Neurosensorial</text>
  <text x="552" y="244" class="small">• Edad (presbiacusia)</text>
  <text x="552" y="266" class="small">• Ruido intenso</text>
  <text x="552" y="288" class="small">• Fármacos ototóxicos</text>
  <text x="552" y="310" class="small">• Causas congénitas</text>
  <rect x="552" y="350" width="212" height="74" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="566" y="374" class="small b" style="fill:var(--red)">Urgente: pérdida</text>
  <text x="566" y="392" class="small b" style="fill:var(--red)">brusca en un oído</text>
  <text x="566" y="410" class="small">(consultar en horas)</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
