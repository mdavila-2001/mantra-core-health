<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prolactina: hormona de la hipófisis</title>
  <desc id="d">A la izquierda, el hipotálamo frena con dopamina a la hipófisis, que libera prolactina hacia la mama para producir leche. A la derecha, un tubo de sangre, recomendaciones para la extracción, motivos para pedir la prueba y causas de aumento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se regula</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">La prueba y qué orienta</text>
<path d="M60 180 C60 100 130 70 210 72 C300 74 350 120 350 180 C350 220 320 240 290 244 L120 244 C80 240 60 216 60 180 Z" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="110" y="120" class="lab" style="fill:var(--purple)">Cerebro</text>
<ellipse cx="210" cy="196" rx="46" ry="16" fill="var(--panel)" stroke="var(--purple)" stroke-width="1.5"/>
<text x="210" y="201" text-anchor="middle" class="small">Hipotálamo</text>
<line x1="210" y1="212" x2="210" y2="252" stroke="var(--purple)" stroke-width="3"/>
<ellipse cx="210" cy="266" rx="20" ry="14" fill="var(--organ)"/>
<text x="240" y="271" class="lab">Hipófisis</text>
<text x="222" y="232" class="small" style="fill:var(--bad)">Dopamina: frena</text>
<line x1="210" y1="282" x2="210" y2="330" stroke="var(--organ)" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="220" y="312" class="lab" style="fill:var(--organ)">Prolactina</text>
<path d="M150 400 C150 360 180 340 210 340 C240 340 270 360 270 400" fill="var(--skin)" stroke="var(--muted)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="388" r="5" fill="var(--organ)"/>
<text x="290" y="380" class="lab">Mama:</text>
<text x="290" y="398" class="lab">produce</text>
<text x="290" y="416" class="lab">leche</text>
<rect x="418" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M420 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M421.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="433" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<text x="470" y="92" class="lab">Mejor en reposo y sin estrés,</text>
<text x="470" y="110" class="lab">porque ambos la suben.</text>
<text x="470" y="136" class="small" style="fill:var(--muted)">Se informan los medicamentos.</text>
<text x="416" y="206" class="h">Motivos para pedirla</text>
<text x="416" y="232" class="lab">• Salida de leche sin lactancia</text>
<text x="416" y="254" class="lab">• Reglas irregulares o ausentes</text>
<text x="416" y="276" class="lab">• Infertilidad</text>
<text x="416" y="298" class="lab">• Menos deseo sexual</text>
<text x="416" y="338" class="h">Causas de aumento</text>
<text x="416" y="364" class="lab">• Embarazo y lactancia</text>
<text x="416" y="386" class="lab">• Fármacos</text>
<text x="606" y="364" class="lab">• Hipotiroidismo</text>
<text x="606" y="386" class="lab">• Prolactinoma</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
