<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pasos del urocultivo</title>
  <desc id="d">Cuatro pasos de izquierda a derecha. Uno: recoger orina de la mitad de la micción en un frasco estéril, tras lavar la zona. Dos: el laboratorio siembra una pequeña cantidad en una placa de cultivo. Tres: tras incubar, crecen colonias si hay bacterias. Cuatro: antibiograma, una placa con discos de antibióticos; alrededor de los eficaces aparece una zona sin crecimiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --urine:#f2d36b; --glass:#e9eef5; --agar:#f3c9a6; --agar-d:#c98f62; --col:#7b4fb0; --disc:#ffffff; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --urine:#a88f34; --glass:#2d3a48; --agar:#5c4433; --agar-d:#a87a55; --col:#b48de0; --disc:#d5dde8; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="42" text-anchor="middle" class="title">Del frasco al antibiograma</text>

  <rect x="20" y="64" width="176" height="300" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="108" y="92" text-anchor="middle" class="step">1 · Recogida</text>
  <rect x="78" y="140" width="60" height="90" rx="8" fill="var(--glass)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="80" y="180" width="56" height="48" rx="6" fill="var(--urine)"/>
  <rect x="72" y="126" width="72" height="16" rx="4" fill="var(--accent)"/>
  <text x="108" y="260" text-anchor="middle" class="small">Frasco estéril</text>
  <text x="108" y="290" text-anchor="middle" class="small muted">Lavar la zona</text>
  <text x="108" y="306" text-anchor="middle" class="small muted">y tomar la mitad</text>
  <text x="108" y="322" text-anchor="middle" class="small muted">de la micción</text>

  <rect x="214" y="64" width="176" height="300" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="302" y="92" text-anchor="middle" class="step">2 · Siembra</text>
  <ellipse cx="302" cy="200" rx="66" ry="48" fill="var(--agar)" stroke="var(--agar-d)" stroke-width="3"/>
  <path d="M260 190 C280 175 300 220 320 195 C335 180 340 210 345 200" fill="none" stroke="var(--urine)" stroke-width="3"/>
  <path d="M330 130 L310 185" stroke="var(--muted)" stroke-width="3"/>
  <circle cx="309" cy="188" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <text x="302" y="270" text-anchor="middle" class="small">Placa de cultivo</text>
  <text x="302" y="300" text-anchor="middle" class="small muted">Se extiende una gota</text>
  <text x="302" y="316" text-anchor="middle" class="small muted">medida de orina</text>

  <rect x="408" y="64" width="176" height="300" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="496" y="92" text-anchor="middle" class="step">3 · Crecimiento</text>
  <ellipse cx="496" cy="200" rx="66" ry="48" fill="var(--agar)" stroke="var(--agar-d)" stroke-width="3"/>
  <g fill="var(--col)">
    <circle cx="465" cy="190" r="5"/><circle cx="480" cy="210" r="4"/><circle cx="500" cy="185" r="5"/><circle cx="515" cy="215" r="4"/><circle cx="530" cy="195" r="5"/><circle cx="490" cy="225" r="4"/><circle cx="470" cy="215" r="3"/><circle cx="520" cy="178" r="3"/>
  </g>
  <text x="496" y="270" text-anchor="middle" class="small">Colonias de bacterias</text>
  <text x="496" y="300" text-anchor="middle" class="small muted">Tras incubar</text>
  <text x="496" y="316" text-anchor="middle" class="small muted">uno o dos días</text>

  <rect x="602" y="64" width="178" height="300" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="691" y="92" text-anchor="middle" class="step">4 · Antibiograma</text>
  <ellipse cx="691" cy="200" rx="66" ry="48" fill="var(--col)" opacity=".35"/>
  <ellipse cx="691" cy="200" rx="66" ry="48" fill="none" stroke="var(--agar-d)" stroke-width="3"/>
  <circle cx="660" cy="188" r="20" fill="var(--agar)"/><circle cx="660" cy="188" r="7" fill="var(--disc)" stroke="var(--muted)"/>
  <circle cx="720" cy="186" r="8" fill="var(--agar)"/><circle cx="720" cy="186" r="7" fill="var(--disc)" stroke="var(--muted)"/>
  <circle cx="690" cy="222" r="15" fill="var(--agar)"/><circle cx="690" cy="222" r="7" fill="var(--disc)" stroke="var(--muted)"/>
  <text x="691" y="270" text-anchor="middle" class="small">Discos de antibióticos</text>
  <text x="691" y="300" text-anchor="middle" class="small" style="fill:var(--ok)">Halo grande: eficaz</text>
  <text x="691" y="316" text-anchor="middle" class="small muted">Sin halo: resistente</text>

  <path d="M196 214 H212" stroke="var(--muted)" stroke-width="2" marker-end="url(#a)"/>
  <path d="M390 214 H406" stroke="var(--muted)" stroke-width="2" marker-end="url(#a)"/>
  <path d="M584 214 H600" stroke="var(--muted)" stroke-width="2" marker-end="url(#a)"/>

  <rect x="20" y="382" width="760" height="76" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="410" text-anchor="middle" class="step">Qué informa el laboratorio</text>
  <text x="400" y="434" text-anchor="middle" class="small">Si crecen bacterias, cuáles son y qué antibióticos las frenan · Varias especies suele indicar contaminación</text>
</svg>
