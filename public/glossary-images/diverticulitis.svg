<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Divertículos en el colon sigmoide</title>
  <desc id="d">Tramo del colon sigmoide con varias bolsitas en la pared y una de ellas inflamada. A la derecha, la diferencia entre diverticulosis y diverticulitis, los síntomas y los signos de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">Colon sigmoide con divertículos</text>
<path d="M60,140 Q200,120 260,180 Q320,240 300,360" fill="none" stroke="var(--organ-d)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60,140 Q200,120 260,180 Q320,240 300,360" fill="none" stroke="var(--organ)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="110" cy="104" r="13" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="180" cy="110" r="13" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="250" cy="140" r="13" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="318" cy="200" r="13" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="318" cy="200" r="26" fill="none" stroke="var(--vessel)" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="345" cy="280" r="13" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<circle cx="220" cy="215" r="13" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<text x="120" y="74" class="lab">Divertículos: bolsitas en la pared</text>
<line x1="150" y1="80" x2="120" y2="96" stroke="var(--muted)" stroke-width="1.5"/>
<text x="360" y="140" text-anchor="middle" class="small" style="fill:var(--vessel)">Divertículo</text>
<text x="360" y="156" text-anchor="middle" class="small" style="fill:var(--vessel)">inflamado</text>
<text x="200" y="400" text-anchor="middle" class="lab" style="fill:var(--muted)">Suele doler en la fosa ilíaca izquierda</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Diverticulosis o -itis</text>
<rect x="476" y="58" width="284" height="52" rx="8" fill="var(--ok-l)" stroke-width="1"/>
<text x="618.0" y="80.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Diverticulosis: hay divertículos,</text>
<text x="618.0" y="96.5" text-anchor="middle" class="lab" style="fill:var(--ink)">a menudo sin síntomas</text>
<rect x="476" y="122" width="284" height="52" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="618.0" y="144.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Diverticulitis: uno se inflama</text>
<text x="618.0" y="160.6" text-anchor="middle" class="lab" style="fill:var(--ink)">o se infecta</text>
<rect x="476" y="190" width="284" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="488" y="212" class="step">Síntomas</text>
<text x="488" y="236" class="lab">• Dolor abdominal bajo izquierdo</text>
<text x="488" y="258" class="lab">• Fiebre, náuseas</text>
<text x="488" y="280" class="lab">• Cambio del ritmo intestinal</text>
<rect x="476" y="312" width="284" height="100" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="488" y="334" class="step" style="fill:var(--warn)">Urgencias si:</text>
<text x="488" y="356" class="lab">• Dolor intenso o abdomen rígido</text>
<text x="488" y="378" class="lab">• Fiebre alta o vómitos</text>
<text x="488" y="400" class="lab">• Sangrado rectal abundante</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
