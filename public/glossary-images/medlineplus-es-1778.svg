<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Transfusión y donación de sangre</title>
  <desc id="d">Arriba, el recorrido de la sangre: donación voluntaria, bolsa, análisis y separación en hematíes, plasma y plaquetas, y transfusión por una vena. Abajo, los grupos sanguíneos que se comprueban y los síntomas que deben avisarse durante la transfusión.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="200" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Del donante al receptor</text>
<rect x="36" y="72" width="110" height="60" rx="8" fill="var(--ok)" stroke-width="1"/>
<text x="91.0" y="98.5" text-anchor="middle" class="lab" style="fill:var(--on)">Donación</text>
<text x="91.0" y="114.5" text-anchor="middle" class="lab" style="fill:var(--on)">voluntaria</text>
<line x1="150" y1="102" x2="184" y2="102" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="190" y="64" width="64" height="80" rx="14" fill="var(--vessel)" stroke-width="1"/>
<rect x="206" y="56" width="32" height="12" rx="3" fill="var(--line)" stroke-width="1"/>
<text x="222" y="160" text-anchor="middle" class="small">Bolsa</text>
<line x1="260" y1="102" x2="294" y2="102" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="72" width="120" height="60" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="360.0" y="98.5" text-anchor="middle" class="lab" style="fill:var(--on)">Análisis y</text>
<text x="360.0" y="114.5" text-anchor="middle" class="lab" style="fill:var(--on)">separación</text>
<line x1="424" y1="102" x2="456" y2="102" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="462" y="60" width="30" height="34" rx="8" fill="var(--vessel)" stroke-width="1"/>
<text x="500" y="82" class="small">Hematíes</text>
<rect x="462" y="104" width="30" height="34" rx="8" fill="var(--beam)" stroke-width="1"/>
<text x="500" y="126" class="small">Plasma</text>
<rect x="462" y="148" width="30" height="34" rx="8" fill="var(--warn)" stroke-width="1"/>
<text x="500" y="170" class="small">Plaquetas</text>
<line x1="580" y1="102" x2="614" y2="102" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="620" y="72" width="140" height="60" rx="8" fill="var(--ok)" stroke-width="1"/>
<text x="690.0" y="98.5" text-anchor="middle" class="lab" style="fill:var(--on)">Transfusión por</text>
<text x="690.0" y="114.5" text-anchor="middle" class="lab" style="fill:var(--on)">una vena</text>
<text x="400" y="196" text-anchor="middle" class="lab" style="fill:var(--muted)">Cada paciente recibe solo el componente que necesita.</text>
<rect x="20" y="236" width="370" height="204" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="266" text-anchor="middle" class="title">Compatibilidad</text>
<rect x="40" y="280" width="72" height="44" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="76.0" y="307.2" text-anchor="middle" class="sub" style="fill:var(--ink)">A</text>
<rect x="124" y="280" width="72" height="44" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="160.0" y="307.2" text-anchor="middle" class="sub" style="fill:var(--ink)">B</text>
<rect x="208" y="280" width="72" height="44" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="244.0" y="307.2" text-anchor="middle" class="sub" style="fill:var(--ink)">AB</text>
<rect x="292" y="280" width="72" height="44" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="328.0" y="307.2" text-anchor="middle" class="sub" style="fill:var(--ink)">O</text>
<text x="36" y="356" class="lab">Antes de transfundir se comprueban</text>
<text x="36" y="376" class="lab">grupo ABO, factor Rh y una prueba</text>
<text x="36" y="396" class="lab">cruzada con la sangre del receptor.</text>
<text x="36" y="424" class="small" style="fill:var(--muted)">Se verifica la identidad junto a la cama.</text>
<rect x="406" y="236" width="374" height="204" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<rect x="422" y="252" width="342" height="138" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="434" y="274" class="step" style="fill:var(--warn)">Avisar durante la transfusión si:</text>
<text x="434" y="300" class="lab">• Fiebre o escalofríos</text>
<text x="434" y="326" class="lab">• Falta de aire o dolor en el pecho</text>
<text x="434" y="352" class="lab">• Dolor lumbar, urticaria</text>
<text x="434" y="378" class="lab">• Orina oscura</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
