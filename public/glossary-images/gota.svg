<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mecanismo de la gota</title>
  <desc id="d">Pie con la articulación del dedo gordo roja e hinchada y cristales en forma de aguja. A la derecha, la secuencia de purinas, ácido úrico alto en sangre y formación de cristales que inflaman, con los desencadenantes habituales y el manejo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Gota: cristales de urato en la articulación</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="88" text-anchor="middle" class="h">Ataque típico: dedo gordo del pie</text>
  <path d="M60 330 C60 280 120 250 200 250 L300 240 C340 238 360 260 356 290 C352 320 330 340 300 345 L120 360 C80 362 60 350 60 330 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="300" cy="290" r="34" fill="var(--red)" stroke="none" opacity=".35"/>
  <path d="M286 276 l14 22 M294 270 l10 30 M306 274 l-6 26 M312 282 l-18 14" fill="none" stroke="var(--panel)" stroke-width="2.5"/>
  <line x1="330" y1="270" x2="350" y2="180" stroke="var(--muted)" stroke-width="1"/>
  <text x="330" y="166" text-anchor="middle" class="small b">Articulación roja,</text>
  <text x="330" y="182" text-anchor="middle" class="small">caliente e hinchada</text>
  <text x="150" y="300" text-anchor="middle" class="small muted">Pie</text>
  <text x="60" y="120" class="small">Cristales con</text>
  <text x="60" y="136" class="small">forma de aguja</text>
  <path d="M70 146 l12 30 M84 150 l2 28 M96 148 l-8 30" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <text x="210" y="400" text-anchor="middle" class="small">Dolor muy intenso que empieza de noche</text>
  <text x="210" y="418" text-anchor="middle" class="small muted">También rodilla, tobillo o muñeca</text>
  <rect x="416" y="60" width="364" height="190" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="88" text-anchor="middle" class="h">Cómo se forma</text>
  <rect x="430" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="483.0" y="133.0" text-anchor="middle" class="lab b">Purinas</text>
  <text x="483.0" y="150.0" text-anchor="middle" class="small muted">de la dieta</text>
  <line x1="538" y1="136.0" x2="546" y2="136.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="548" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="601.0" y="133.0" text-anchor="middle" class="lab b">Ácido úrico</text>
  <text x="601.0" y="150.0" text-anchor="middle" class="small muted">alto en sangre</text>
  <line x1="656" y1="136.0" x2="664" y2="136.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="666" y="104" width="106" height="64" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="719.0" y="133.0" text-anchor="middle" class="lab b">Cristales</text>
  <text x="719.0" y="150.0" text-anchor="middle" class="small muted">inflamación</text>
  <text x="598" y="200" text-anchor="middle" class="small">El riñón elimina el ácido úrico; si elimina</text>
  <text x="598" y="218" text-anchor="middle" class="small">poco o se produce mucho, se acumula</text>
  <rect x="416" y="266" width="364" height="174" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="294" text-anchor="middle" class="h">Desencadenantes y manejo</text>
  <text x="434" y="322" class="small">• Alcohol, sobre todo cerveza</text>
  <text x="434" y="346" class="small">• Carnes rojas y mariscos</text>
  <text x="434" y="370" class="small">• Bebidas azucaradas</text>
  <text x="434" y="398" class="small">• Antiinflamatorios en la crisis</text>
  <text x="434" y="420" class="small">• Fármacos que bajan el ácido úrico</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
