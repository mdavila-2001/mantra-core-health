<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Albúmina en sangre</title>
  <desc id="d">A la izquierda, el hígado fabrica la albúmina, que circula en la sangre y retiene el agua dentro de los vasos. A la derecha, el análisis en sangre u orina y lo que ayuda a valorar: hígado, pérdidas por el riñón, nutrición y edemas.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">De dónde viene y qué hace</text>
  <path d="M60 120 C70 80 170 70 250 85 C320 98 330 130 300 160 C260 200 170 200 110 185 C70 175 55 150 60 120 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1" opacity=".85"/>
  <text x="180" y="135" text-anchor="middle" class="big on">Hígado</text>
  <text x="180" y="155" text-anchor="middle" class="small on">fabrica la albúmina</text>
  <line x1="180" y1="200" x2="180" y2="232" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M40 240 H340 V330 H40 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <rect x="40" y="262" width="300" height="46" rx="23" fill="var(--organ)" stroke="var(--vessel)" stroke-width="2"/>
  <circle cx="80" cy="285" r="9" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="130" cy="285" r="9" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="180" cy="285" r="9" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="230" cy="285" r="9" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="280" cy="285" r="9" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="190" y="254" text-anchor="middle" class="small" style="fill:var(--muted)">Vaso sanguíneo</text>
  <text x="60" y="326" class="small" style="fill:var(--muted)">Tejido</text>
  <line x1="130" y1="312" x2="130" y2="296" stroke="var(--accent)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="250" y1="312" x2="250" y2="296" stroke="var(--accent)" stroke-width="2" marker-end="url(#ah)"/>
  <circle cx="56" cy="360" r="8" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="72" y="364" class="small">= albúmina</text>
  <text x="40" y="392" class="small">• Retiene el agua dentro de los vasos</text>
  <text x="40" y="414" class="small">• Transporta hormonas, calcio y fármacos</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">El análisis</text>
  <rect x="420" y="70" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M423 84 V160 a12 12 0 0 0 24 0 V84" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M425 110 V160 a10 10 0 0 0 20 0 V110 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="435" y="192" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
  <line x1="462" y1="120" x2="512" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="518" y="90" width="120" height="60" rx="10" fill="var(--fluid)" stroke="var(--line)"/>
  <text x="578.0" y="116.5" text-anchor="middle" class="lab">Se mide la</text>
  <text x="578.0" y="133.5" text-anchor="middle" class="lab">albúmina</text>
  <line x1="644" y1="120" x2="690" y2="120" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M698 82 L706 162 H750 L758 82 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M702 116 L706 162 H750 L754 116 Z" fill="var(--fluid)" stroke="none" stroke-width="2"/>
  <rect x="694" y="70" width="68" height="12" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="728" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Orina</text>
  <text x="588" y="210" text-anchor="middle" class="step">Ayuda a valorar</text>
  <rect x="416" y="228" width="344" height="42" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="430" y="246" class="lab">Función del hígado</text>
  <text x="430" y="262" class="small" style="fill:var(--muted)">fabrica menos si está dañado</text>
  <rect x="416" y="278" width="344" height="42" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="430" y="296" class="lab">Pérdida por el riñón</text>
  <text x="430" y="312" class="small" style="fill:var(--muted)">se escapa en la orina</text>
  <rect x="416" y="328" width="344" height="42" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="430" y="346" class="lab">Estado de nutrición</text>
  <text x="430" y="362" class="small" style="fill:var(--muted)">falta de proteínas</text>
  <rect x="416" y="378" width="344" height="42" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="430" y="396" class="lab">Edemas</text>
  <text x="430" y="412" class="small" style="fill:var(--muted)">líquido que sale a los tejidos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
