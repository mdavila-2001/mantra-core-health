<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Nefrona sana frente a nefrona dañada por enfermedad renal crónica</title>
  <desc id="d">Dos esquemas de la unidad de filtración del riñón. A la izquierda un glomérulo con capilares abiertos y un túbulo normal que deja pasar la sangre filtrada y retiene la albúmina. A la derecha el glomérulo está cicatrizado, el túbulo está atrófico y rodeado de fibrosis, y la albúmina se escapa a la orina.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --tissue:#e7a79a; --tissue-d:#c9705f; --blood:#d6453d; --scar:#8f8a99; --alb:#e0a325; --ok:#1f8a5b; --bad:#c0392b; --urine:#e9d36a; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --tissue:#b9695c; --tissue-d:#e08a7a; --blood:#e0584f; --scar:#9a95a6; --alb:#f0b93a; --ok:#4cc38a; --bad:#ef7467; --urine:#c9b24e; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 14px; }
    .lbl { font-size: 13px; }
    .tag { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <!-- Panel sano -->
  <rect x="24" y="20" width="372" height="410" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210" y="55" text-anchor="middle" class="title">Nefrona sana</text>
  <text x="210" y="77" text-anchor="middle" class="sub muted">Filtra, reabsorbe y retiene la proteína</text>
  <!-- cápsula y glomérulo -->
  <circle cx="110" cy="150" r="46" fill="none" stroke="var(--tissue-d)" stroke-width="3"/>
  <g fill="none" stroke="var(--blood)" stroke-width="5" stroke-linecap="round">
    <path d="M85 140 q12 -22 28 -4 q14 18 -4 28 q-20 8 -26 -10"/>
    <path d="M100 168 q22 6 30 -14 q4 -16 -12 -22"/>
  </g>
  <!-- arteriola -->
  <path d="M30 120 H74" stroke="var(--blood)" stroke-width="8" stroke-linecap="round"/>
  <path d="M74 182 H30" stroke="var(--blood)" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <!-- túbulo -->
  <path d="M156 150 H210 q30 0 30 30 V260 q0 30 -30 30 H150 q-30 0 -30 30 V345" fill="none" stroke="var(--tissue-d)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M156 150 H210 q30 0 30 30 V260 q0 30 -30 30 H150 q-30 0 -30 30 V345" fill="none" stroke="var(--urine)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- albúmina retenida: sólo cuenta dentro del capilar -->
  <g fill="var(--alb)"><circle cx="96" cy="146" r="4"/><circle cx="118" cy="158" r="4"/><circle cx="108" cy="134" r="4"/></g>
  <text x="270" y="130" class="lbl muted">Glomérulo con</text>
  <text x="270" y="147" class="lbl muted">capilares abiertos</text>
  <path d="M268 140 L152 150" stroke="var(--muted)" stroke-width="1.5" fill="none"/>
  <text x="256" y="236" class="lbl muted">Túbulo normal</text>
  <text x="140" y="378" text-anchor="start" class="lbl muted">Orina con muy poca albúmina</text>
  <rect x="96" y="392" width="228" height="28" rx="14" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <text x="210" y="411" text-anchor="middle" class="tag" style="fill:var(--ok)">Función conservada</text>

  <!-- Panel dañado -->
  <rect x="404" y="20" width="372" height="410" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="590" y="55" text-anchor="middle" class="title">Nefrona dañada</text>
  <text x="590" y="77" text-anchor="middle" class="sub muted">Cicatriz, atrofia y fuga de albúmina</text>
  <circle cx="490" cy="150" r="46" fill="none" stroke="var(--tissue-d)" stroke-width="3"/>
  <!-- glomérulo esclerosado -->
  <circle cx="490" cy="150" r="32" fill="var(--scar)" opacity=".85"/>
  <g stroke="var(--panel)" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M472 140 l36 18 M474 164 l30 -24"/></g>
  <path d="M410 120 H454" stroke="var(--blood)" stroke-width="4" stroke-linecap="round"/>
  <!-- túbulo atrófico con fibrosis -->
  <path d="M536 150 H590 q30 0 30 30 V260 q0 30 -30 30 H530 q-30 0 -30 30 V345" fill="none" stroke="var(--scar)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="var(--scar)" stroke-width="2" opacity=".7" fill="none">
    <path d="M640 190 l22 -8 M640 210 l26 0 M640 230 l22 8 M640 250 l26 6 M640 270 l22 12"/>
    <path d="M556 300 l-10 22 M580 300 l-4 26 M604 300 l6 24"/>
  </g>
  <!-- albúmina escapando -->
  <g fill="var(--alb)">
    <circle cx="560" cy="150" r="5"/><circle cx="580" cy="168" r="5"/><circle cx="600" cy="196" r="5"/><circle cx="600" cy="240" r="5"/><circle cx="572" cy="288" r="5"/><circle cx="520" cy="310" r="5"/>
  </g>
  <text x="634" y="130" class="lbl muted">Glomérulo</text>
  <text x="634" y="147" class="lbl muted">esclerosado</text>
  <path d="M632 140 L528 150" stroke="var(--muted)" stroke-width="1.5" fill="none"/>
  <text x="676" y="226" class="lbl muted">Fibrosis</text>
  <text x="520" y="378" text-anchor="start" class="lbl muted">Albúmina en la orina</text>
  <circle cx="500" cy="373" r="5" fill="var(--alb)"/>
  <rect x="456" y="392" width="268" height="28" rx="14" fill="none" stroke="var(--bad)" stroke-width="2"/>
  <text x="590" y="411" text-anchor="middle" class="tag" style="fill:var(--bad)">Menos nefronas funcionantes</text>

  <text x="400" y="460" text-anchor="middle" class="sub muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
