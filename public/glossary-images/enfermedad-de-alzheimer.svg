<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad de Alzheimer</title>
  <desc id="d">A la izquierda, un cerebro sano y otro con alzhéimer, con surcos más amplios y el hipocampo más pequeño, y el detalle de una neurona con placas de amiloide y ovillos de tau. A la derecha, las tres fases: inicial con olvidos de hechos recientes, moderada con desorientación y problemas de lenguaje, y avanzada con dependencia para la vida diaria.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Cambios en el cerebro</text>
  <g transform="translate(130 170) scale(0.95)">
    <path d="M-90 20 C-100 -50 -40 -80 10 -78 C70 -78 100 -40 92 10 C96 50 60 70 20 66 C-10 80 -50 74 -66 56 C-90 52 -96 40 -90 20 Z" fill="var(--organ)" opacity=".6" stroke="var(--line)" stroke-width="2"/>
    <path d="M-60 -30 C-40 -20 -50 0 -30 6 M-10 -60 C-20 -30 4 -20 -6 6 M40 -50 C30 -24 56 -12 46 18 M-50 40 C-20 30 0 50 30 40" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="10" cy="34" rx="18" ry="9" fill="var(--purple)"/>
  </g>
  <g transform="translate(340 170) scale(0.95)">
    <path d="M-90 20 C-100 -50 -40 -80 10 -78 C70 -78 100 -40 92 10 C96 50 60 70 20 66 C-10 80 -50 74 -66 56 C-90 52 -96 40 -90 20 Z" fill="var(--organ)" opacity=".6" stroke="var(--line)" stroke-width="2"/>
    <path d="M-60 -30 C-40 -20 -50 0 -30 6 M-10 -60 C-20 -30 4 -20 -6 6 M40 -50 C30 -24 56 -12 46 18 M-50 40 C-20 30 0 50 30 40" fill="none" stroke="var(--panel)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="10" cy="34" rx="10" ry="6" fill="var(--purple)"/>
  </g>
  <text x="130" y="262" text-anchor="middle" class="step">Sano</text>
  <text x="340" y="262" text-anchor="middle" class="step">Con alzhéimer</text>
  <text x="340" y="282" text-anchor="middle" class="small">Surcos amplios, hipocampo menor</text>
  <text x="130" y="282" text-anchor="middle" class="small">Hipocampo en morado</text>
  <circle cx="110" cy="360" r="14" fill="var(--purple)"/>
  <path d="M110 360 L96 348" stroke="var(--purple)" stroke-width="3"/>
  <path d="M110 360 L124 348" stroke="var(--purple)" stroke-width="3"/>
  <path d="M110 360 L98 374" stroke="var(--purple)" stroke-width="3"/>
  <path d="M110 360 L124 372" stroke="var(--purple)" stroke-width="3"/>
  <path d="M110 360 L110 342" stroke="var(--purple)" stroke-width="3"/>
  <path d="M110 360 L110 378" stroke="var(--purple)" stroke-width="3"/>
  <circle cx="160" cy="352" r="10" fill="var(--warn)"/><circle cx="168" cy="368" r="7" fill="var(--warn)"/>
  <path d="M100 356 q6 -8 12 0 q6 8 12 0" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="190" y="358" class="small">Placas de amiloide (amarillo)</text>
  <text x="190" y="376" class="small">y ovillos de tau en la neurona</text>
  <text x="240" y="420" text-anchor="middle" class="small muted">Las neuronas pierden conexiones y mueren</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Cómo avanza</text>
  <rect x="500" y="64" width="260" height="84" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="516" y="90" class="big">Inicial</text>
  <text x="516" y="114" class="small">Olvida hechos recientes</text>
  <text x="516" y="132" class="small">repite preguntas</text>
  <path d="M630 150 L630 166" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="500" y="168" width="260" height="84" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="516" y="194" class="big">Moderada</text>
  <text x="516" y="218" class="small">Desorientación, lenguaje</text>
  <text x="516" y="236" class="small">y tareas complejas</text>
  <path d="M630 254 L630 270" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="500" y="272" width="260" height="84" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="516" y="298" class="big">Avanzada</text>
  <text x="516" y="322" class="small">Depende de otros</text>
  <text x="516" y="340" class="small">para la vida diaria</text>
  <text x="630" y="402" text-anchor="middle" class="small muted">Progresa a lo largo de años</text>
  <text x="630" y="420" text-anchor="middle" class="small muted">y a ritmo distinto en cada persona</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
