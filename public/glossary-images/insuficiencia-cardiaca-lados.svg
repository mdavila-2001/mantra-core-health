<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Insuficiencia cardíaca del lado izquierdo y del lado derecho</title>
  <desc id="d">Dos esquemas. A la izquierda, falla del lado izquierdo del corazón: la sangre se acumula en los pulmones y causa falta de aire y tos. A la derecha, falla del lado derecho: la sangre se acumula en las venas del cuerpo y causa hinchazón de tobillos, piernas y abdomen y aumento de peso por líquido.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --heart:#c0392b; --heart-d:#8e2a20; --lung:#9ec5e8; --body:#e9edf2; --warn:#b7791f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --heart:#ef7467; --heart-d:#b24a40; --lung:#33587a; --body:#2a3541; --warn:#e0b25a; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .warn { fill: var(--warn); font-weight: 700; font-size: 13px; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>

  <rect x="20" y="20" width="370" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205" y="52" text-anchor="middle" class="title">Falla el lado izquierdo</text>
  <ellipse cx="130" cy="190" rx="52" ry="78" fill="var(--lung)"/>
  <ellipse cx="280" cy="190" rx="52" ry="78" fill="var(--lung)"/>
  <path d="M205 130 C 150 120, 150 210, 205 290 C 260 210, 260 120, 205 130 Z" fill="var(--heart)"/>
  <path d="M205 130 C 175 126, 168 180, 190 215 L 205 215 Z" fill="var(--heart-d)"/>
  <text x="130" y="195" text-anchor="middle" class="small" style="fill:var(--ink)">Pulmón</text>
  <text x="280" y="195" text-anchor="middle" class="small" style="fill:var(--ink)">Pulmón</text>
  <text x="205" y="320" text-anchor="middle" class="warn">La sangre se acumula en los pulmones</text>
  <text x="205" y="344" text-anchor="middle" class="lab">Falta de aire · tos · cuesta acostarse</text>
  <text x="205" y="400" text-anchor="middle" class="small muted">El lado izquierdo no envía suficiente sangre al cuerpo</text>

  <rect x="410" y="20" width="370" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595" y="52" text-anchor="middle" class="title">Falla el lado derecho</text>
  <path d="M595 80 C 550 78, 550 150, 595 215 C 640 150, 640 78, 595 80 Z" fill="var(--heart)"/>
  <rect x="567" y="215" width="56" height="52" rx="8" fill="var(--body)" stroke="var(--line)"/>
  <rect x="540" y="267" width="40" height="70" rx="10" fill="var(--body)" stroke="var(--line)"/>
  <rect x="610" y="267" width="40" height="70" rx="10" fill="var(--body)" stroke="var(--line)"/>
  <ellipse cx="560" cy="338" rx="26" ry="8" fill="var(--lung)"/>
  <ellipse cx="630" cy="338" rx="26" ry="8" fill="var(--lung)"/>
  <text x="595" y="366" text-anchor="middle" class="warn">La sangre se acumula en el cuerpo</text>
  <text x="595" y="388" text-anchor="middle" class="lab">Hinchazón de tobillos, piernas y abdomen</text>
  <text x="595" y="408" text-anchor="middle" class="small muted">Aumento de peso por líquido</text>
</svg>
