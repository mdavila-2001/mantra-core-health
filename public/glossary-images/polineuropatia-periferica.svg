<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Polineuropatía periférica</title>
  <desc id="d">A la izquierda, una silueta humana con los pies y las manos resaltados, que muestra el patrón en calcetín y guante que empieza en los pies y asciende. A la derecha, una neurona con el extremo largo del nervio dañado, los síntomas y las causas frecuentes, como diabetes, alcohol, falta de vitamina B12 o fármacos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Patrón en calcetín y guante</text>
  <circle cx="200" cy="94.6" r="26.400000000000002" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <path d="M153.8 134.2 Q200 121.0 246.2 134.2 L252.8 253.00000000000003 L233.0 259.6 L233.0 396.0 L206.6 396.0 L200 275.0 L193.4 396.0 L167.0 396.0 L167.0 259.6 L147.2 253.00000000000003 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M153.8 136.4 L127.39999999999999 253.00000000000003 L140.6 255.20000000000002 L158.2 176.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M246.2 136.4 L272.6 253.00000000000003 L259.4 255.20000000000002 L241.8 176.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="162" y="330" width="32" height="60" rx="6" fill="var(--warn)" opacity=".55"/>
  <rect x="206" y="330" width="32" height="60" rx="6" fill="var(--warn)" opacity=".55"/>
  <circle cx="130" cy="254" r="14" fill="var(--warn)" opacity=".55"/>
  <circle cx="270" cy="254" r="14" fill="var(--warn)" opacity=".55"/>
  <text x="300" y="356" class="small">Pies primero</text>
  <text x="300" y="254" class="small">Luego manos</text>
  <path d="M64 380 V200" fill="none" stroke="var(--warn)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="50" y="420" class="small muted">Asciende con el tiempo</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Nervios largos, daño distal</text>
  <rect x="436" y="70" width="324" height="70" rx="10" fill="var(--tissue)"/>
  <circle cx="460" cy="105" r="14" fill="var(--accent)"/>
  <path d="M474 105 H740" fill="none" stroke="var(--nerve)" stroke-width="6"/>
  <path d="M640 105 H740" fill="none" stroke="var(--warn)" stroke-width="6" stroke-dasharray="8 6"/>
  <text x="690" y="132" text-anchor="middle" class="small" style="fill:var(--warn)">Se daña el extremo</text>
  <text x="484" y="132" class="small">Neurona</text>
  <text x="436" y="172" class="step">Síntomas</text>
  <text x="440" y="198" class="lab">• Hormigueo, ardor o adormecimiento</text>
  <text x="440" y="222" class="lab">• Pérdida de sensibilidad en los pies</text>
  <text x="440" y="246" class="lab">• Debilidad, tropiezos</text>
  <text x="436" y="290" class="step">Causas frecuentes</text>
  <rect x="436" y="304" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="325.32" text-anchor="middle" class="small" style="fill:var(--ink)">Diabetes</text>
  <rect x="602" y="304" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="325.32" text-anchor="middle" class="small" style="fill:var(--ink)">Alcohol</text>
  <rect x="436" y="348" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="369.32" text-anchor="middle" class="small" style="fill:var(--ink)">Falta de B12</text>
  <rect x="602" y="348" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="369.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fármacos</text>
  <text x="598" y="420" text-anchor="middle" class="small muted">Revisar los pies a diario</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
