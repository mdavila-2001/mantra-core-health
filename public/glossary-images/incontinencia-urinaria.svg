<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Incontinencia urinaria</title>
  <desc id="d">A la izquierda, la vejiga con su músculo, el esfínter de salida y los músculos del suelo pélvico que la sostienen. A la derecha, los tipos de incontinencia de esfuerzo, de urgencia, por rebosamiento y mixta, y las medidas que ayudan.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Vejiga y suelo pélvico</text>
  <path d="M120 110 C120 70 280 70 280 110 L280 200 C280 250 240 270 200 270 C160 270 120 250 120 200 Z" fill="var(--fluid)" stroke="var(--warn)" stroke-width="2"/>
  <path d="M120 110 C120 70 280 70 280 110" fill="none" stroke="var(--organ-d)" stroke-width="8" opacity=".5"/>
  <text x="200" y="170" text-anchor="middle" class="big">Vejiga</text>
  <text x="200" y="190" text-anchor="middle" class="small" style="fill:var(--muted)">almacena la orina</text>
  <rect x="188" y="268" width="24" height="70" rx="6" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <path d="M184 290 h32" fill="none" stroke="var(--vessel)" stroke-width="6"/>
  <text x="234" y="296" class="small" style="fill:var(--vessel)">Esfínter</text>
  <path d="M50 320 C110 360 290 360 350 320" fill="none" stroke="var(--organ-d)" stroke-width="12" opacity=".7" stroke-linecap="round"/>
  <text x="200" y="384" text-anchor="middle" class="small" style="fill:var(--organ-d)">Músculos del suelo pélvico</text>
  <text x="100" y="120" text-anchor="end" class="small" style="fill:var(--organ-d)">Músculo</text>
  <text x="100" y="136" text-anchor="end" class="small" style="fill:var(--organ-d)">detrusor</text>
  <text x="200" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Sostienen la vejiga y ayudan a cerrar</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Tipos principales</text>
  <rect x="436" y="66" width="324" height="48" rx="8" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="452" y="86" class="lab">De esfuerzo</text>
  <text x="452" y="104" class="small" style="fill:var(--muted)">al toser, reír o saltar</text>
  <rect x="436" y="122" width="324" height="48" rx="8" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <text x="452" y="142" class="lab">De urgencia</text>
  <text x="452" y="160" class="small" style="fill:var(--muted)">ganas súbitas que no dan tiempo</text>
  <rect x="436" y="178" width="324" height="48" rx="8" fill="var(--warn-l)" stroke="none" stroke-width="2"/>
  <text x="452" y="198" class="lab">Por rebosamiento</text>
  <text x="452" y="216" class="small" style="fill:var(--muted)">vejiga que no se vacía</text>
  <rect x="436" y="234" width="324" height="48" rx="8" fill="var(--tissue)" stroke="none" stroke-width="2"/>
  <text x="452" y="254" class="lab">Mixta</text>
  <text x="452" y="272" class="small" style="fill:var(--muted)">combina esfuerzo y urgencia</text>
  <rect x="436" y="300" width="324" height="122" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="452" y="326" class="step">Qué ayuda</text>
  <text x="460" y="350" class="small">• Ejercicios del suelo pélvico</text>
  <text x="460" y="368" class="small">• Entrenamiento de la vejiga</text>
  <text x="460" y="386" class="small">• Controlar peso y tos crónica</text>
  <text x="460" y="404" class="small">• Fármacos o cirugía en algunos casos</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
