<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Coprocultivo: pasos del cultivo de heces</title>
  <desc id="d">Cuatro pasos en fila: la muestra de heces en un frasco estéril, la siembra en placas, la incubación con crecimiento de colonias y la identificación de la bacteria con su sensibilidad a antibióticos. Debajo, las bacterias que busca y cuándo se pide.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Coprocultivo: del frasco al resultado</text>
<text x="120" y="76" text-anchor="middle" class="step">1 · Muestra</text>
<rect x="40" y="90" width="160" height="150" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="91" y="120" width="58" height="10" rx="3" fill="var(--accent)"/>
<path d="M95 130 L99 184 H141 L145 130 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M97 150 L100 182 H140 L143 150 Z" fill="var(--warn)" opacity=".8"/>
<text x="120" y="264" text-anchor="middle" class="small">Heces frescas en</text>
<text x="120" y="280" text-anchor="middle" class="small">frasco estéril</text>
<line x1="204" y1="165" x2="222" y2="165" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<text x="306" y="76" text-anchor="middle" class="step">2 · Siembra</text>
<rect x="226" y="90" width="160" height="150" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<ellipse cx="306" cy="165" rx="56" ry="40" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<path d="M266 160 c10 -10 20 10 30 0 s20 10 30 0 s16 6 20 0" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="306" y="264" text-anchor="middle" class="small">En placas con</text>
<text x="306" y="280" text-anchor="middle" class="small">medios selectivos</text>
<line x1="390" y1="165" x2="408" y2="165" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<text x="492" y="76" text-anchor="middle" class="step">3 · Incubación</text>
<rect x="412" y="90" width="160" height="150" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<ellipse cx="492" cy="165" rx="56" ry="40" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<circle cx="468" cy="155" r="6" fill="var(--warn)"/>
<circle cx="500" cy="147" r="5" fill="var(--warn)"/>
<circle cx="514" cy="173" r="7" fill="var(--warn)"/>
<circle cx="482" cy="181" r="5" fill="var(--warn)"/>
<circle cx="458" cy="175" r="4" fill="var(--warn)"/>
<circle cx="522" cy="153" r="4" fill="var(--warn)"/>
<text x="492" y="264" text-anchor="middle" class="small">Crecen las colonias</text>
<text x="492" y="280" text-anchor="middle" class="small">en uno a tres días</text>
<line x1="576" y1="165" x2="594" y2="165" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<text x="678" y="76" text-anchor="middle" class="step">4 · Identificación</text>
<rect x="598" y="90" width="160" height="150" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<ellipse cx="678" cy="165" rx="56" ry="40" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<circle cx="652" cy="157" r="15" fill="var(--ok-l)"/>
<circle cx="652" cy="157" r="5" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<circle cx="704" cy="157" r="7" fill="var(--ok-l)"/>
<circle cx="704" cy="157" r="5" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<circle cx="678" cy="185" r="11" fill="var(--ok-l)"/>
<circle cx="678" cy="185" r="5" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
<text x="678" y="264" text-anchor="middle" class="small">Qué bacteria es y</text>
<text x="678" y="280" text-anchor="middle" class="small">qué antibiótico sirve</text>
<text x="40" y="326" class="h">Busca bacterias que causan diarrea</text>
<text x="40" y="352" class="lab">• Salmonella</text>
<text x="40" y="374" class="lab">• Shigella</text>
<text x="40" y="396" class="lab">• Campylobacter</text>
<text x="40" y="418" class="lab">• Algunos tipos de E. coli</text>
<text x="420" y="326" class="h">Cuándo se pide</text>
<text x="420" y="352" class="lab">• Diarrea con sangre o fiebre alta</text>
<text x="420" y="374" class="lab">• Diarrea que no cede</text>
<text x="420" y="396" class="lab">• Brotes o viajes recientes</text>
<text x="420" y="418" class="lab">• Personas con defensas bajas</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
