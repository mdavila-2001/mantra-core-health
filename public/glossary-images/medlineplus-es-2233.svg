<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Bypass de la arteria coronaria</title>
  <desc id="d">Corazón con dos arterias coronarias obstruidas y dos injertos que las rodean: la arteria mamaria interna y un segmento de vena safena unido a la aorta. A la derecha, los pasos principales de la operación.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="440" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="240.0" y="50" text-anchor="middle" class="title">Puentes alrededor de la obstrucción</text>
<path d="M220,356.0 C108.0,286.0 80.0,188.0 136.0,146.0 C178.0,118.0 213.0,146.0 220,174.0 C227.0,146.0 262.0,118.0 304.0,146.0 C360.0,188.0 332.0,286.0 220,356.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="200.4" y="76.0" width="39.2" height="84.0" rx="14.0" fill="var(--vessel)" stroke-width="1"/>
<path d="M210,140 C170,170 150,240 160,330" fill="none" stroke="var(--vessel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M230,140 C280,180 290,250 270,320" fill="none" stroke="var(--vessel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="150" y="214" width="22" height="12" rx="3" fill="var(--beam)" stroke="var(--warn)" stroke-width="1"/>
<rect x="276" y="220" width="22" height="12" rx="3" fill="var(--beam)" stroke="var(--warn)" stroke-width="1"/>
<path d="M110,104 C104,170 120,230 158,262" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="74" class="small">Arteria mamaria</text>
<text x="40" y="90" class="small">interna</text>
<path d="M232,108 C340,90 340,200 286,262" fill="none" stroke="var(--purple)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="330" y="92" class="small">Vena safena</text>
<text x="330" y="108" class="small" style="fill:var(--muted)">(de la pierna)</text>
<text x="40" y="270" class="small" style="fill:var(--warn)">Obstrucción</text>
<line x1="80" y1="258" x2="150" y2="228" stroke="var(--warn)" stroke-width="1.5"/>
<text x="240" y="388" text-anchor="middle" class="lab">El injerto lleva sangre más allá del bloqueo.</text>
<text x="240" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">La aorta (arriba) da origen al puente venoso.</text>
<rect x="476" y="20" width="304" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="628.0" y="50" text-anchor="middle" class="title">La operación</text>
<rect x="496" y="58" width="264" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="628.0" y="82.2" text-anchor="middle" class="small" style="fill:var(--on)">Anestesia general</text>
<line x1="628.0" y1="99" x2="628.0" y2="111" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="496" y="114" width="264" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="628.0" y="138.2" text-anchor="middle" class="small" style="fill:var(--on)">Apertura del esternón</text>
<line x1="628.0" y1="155" x2="628.0" y2="167" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="496" y="170" width="264" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="628.0" y="186.7" text-anchor="middle" class="small" style="fill:var(--on)">Bomba de circulación o</text>
<text x="628.0" y="201.7" text-anchor="middle" class="small" style="fill:var(--on)">corazón latiendo</text>
<line x1="628.0" y1="211" x2="628.0" y2="223" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="496" y="226" width="264" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="628.0" y="250.2" text-anchor="middle" class="small" style="fill:var(--on)">Se suturan los injertos</text>
<line x1="628.0" y1="267" x2="628.0" y2="279" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="496" y="282" width="264" height="40" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="628.0" y="306.2" text-anchor="middle" class="small" style="fill:var(--on)">UCI y luego planta</text>
<text x="496" y="360" class="lab">Indicada en enfermedad de varias</text>
<text x="496" y="380" class="lab">arterias o del tronco principal.</text>
<text x="496" y="410" class="step">Después: rehabilitación cardíaca.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
