<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ginecología</title>
  <desc id="d">A la izquierda, el aparato reproductor femenino de frente con el útero, el cuello uterino, las trompas de Falopio, los ovarios y la vagina; se recuerda que la especialidad atiende también las mamas y el suelo pélvico. A la derecha, sus áreas de trabajo: prevención y cribado, anticoncepción, ciclo menstrual, infecciones, menopausia y tumores.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="460" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="50" text-anchor="middle" class="title">Aparato reproductor femenino</text>
  <path d="M200 140 C200 100 280 100 280 140 L270 240 C266 270 256 280 252 300 L228 300 C224 280 214 270 210 240 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M204 132 C160 120 130 100 100 120 M276 132 C320 120 350 100 380 120" fill="none" stroke="var(--organ)" stroke-width="9" stroke-linecap="round"/>
  <path d="M100 120 q-14 6 -10 22 M380 120 q14 6 10 22" fill="none" stroke="var(--organ)" stroke-width="5"/>
  <ellipse cx="112" cy="168" rx="24" ry="16" fill="var(--warn)" opacity=".7"/><ellipse cx="368" cy="168" rx="24" ry="16" fill="var(--warn)" opacity=".7"/>
  <rect x="226" y="300" width="28" height="80" rx="8" fill="var(--organ)" opacity=".6"/>
  <text x="240" y="190" text-anchor="middle" class="step">Útero</text>
  <circle cx="240" cy="290" r="3" fill="var(--ink)"/>
  <path d="M240 290 L320 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="324" y="304" class="lab">Cuello uterino</text>
  <text x="112" y="206" text-anchor="middle" class="small">Ovario</text>
  <text x="368" y="206" text-anchor="middle" class="small">Ovario</text>
  <text x="240" y="86" text-anchor="middle" class="small">Trompas de Falopio</text>
  <text x="240" y="400" text-anchor="middle" class="small">Vagina</text>
  <text x="240" y="436" text-anchor="middle" class="small muted">Incluye también mamas y suelo pélvico</text>
  <rect x="500" y="20" width="280" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="50" text-anchor="middle" class="title">Áreas de trabajo</text>
  <rect x="516" y="58" width="248" height="52" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="532" y="80" class="step">Prevención</text>
  <text x="532" y="98" class="small">Citología, VPH, mamas</text>
  <rect x="516" y="122" width="248" height="52" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="532" y="144" class="step">Anticoncepción</text>
  <text x="532" y="162" class="small">Métodos y consejo</text>
  <rect x="516" y="186" width="248" height="52" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="532" y="208" class="step">Ciclo menstrual</text>
  <text x="532" y="226" class="small">Reglas dolorosas</text>
  <rect x="516" y="250" width="248" height="52" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="532" y="272" class="step">Infecciones</text>
  <text x="532" y="290" class="small">Vaginitis, ITS</text>
  <rect x="516" y="314" width="248" height="52" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="532" y="336" class="step">Menopausia</text>
  <text x="532" y="354" class="small">Síntomas y huesos</text>
  <rect x="516" y="378" width="248" height="52" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="532" y="400" class="step">Tumores</text>
  <text x="532" y="418" class="small">Miomas, cáncer</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
