<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cascada del oxígeno</title>
  <desc id="d">Seis barras descendentes que representan la presión parcial de oxígeno en el aire ambiente, el aire humidificado de las vías aéreas, el alvéolo, la sangre arterial, el capilar tisular y la mitocondria. Entre cada barra se indica la causa de la pérdida: humidificación, dióxido de carbono y mezcla, desajuste y cortocircuito, extracción por los tejidos y consumo celular.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --b1:#2f6fa8; --b2:#3f84bd; --b3:#5499cf; --b4:#74b0de; --b5:#97c6ea; --b6:#bcdcf3; --loss:#c0392b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --b1:#6fb0e0; --b2:#5fa2d4; --b3:#4f93c7; --b4:#3f80b3; --b5:#336c97; --b6:#2a5a7e; --loss:#ef7467; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .name { font-size: 13px; font-weight: 700; }
    .loss { font-size: 12px; fill: var(--loss); font-weight: 600; }
    .cap { font-size: 13px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="16" y="16" width="768" height="448" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="50" text-anchor="middle" class="title">La cascada del oxígeno</text>
  <text x="400" y="72" text-anchor="middle" class="cap muted">La presión parcial de oxígeno desciende en cada paso del aire a la mitocondria</text>

  <rect x="40"  y="100" width="100" height="270" fill="var(--b1)"/>
  <rect x="165" y="130" width="100" height="240" fill="var(--b2)"/>
  <rect x="290" y="160" width="100" height="210" fill="var(--b3)"/>
  <rect x="415" y="185" width="100" height="185" fill="var(--b4)"/>
  <rect x="540" y="250" width="100" height="120" fill="var(--b5)"/>
  <rect x="665" y="335" width="100" height="35" fill="var(--b6)"/>
  <path d="M30 370 H775" stroke="var(--ink)" stroke-width="2"/>

  <text x="90" y="392" text-anchor="middle" class="name">Aire</text>
  <text x="90" y="408" text-anchor="middle" class="name">ambiente</text>
  <text x="215" y="392" text-anchor="middle" class="name">Vías</text>
  <text x="215" y="408" text-anchor="middle" class="name">aéreas</text>
  <text x="340" y="392" text-anchor="middle" class="name">Alvéolo</text>
  <text x="465" y="392" text-anchor="middle" class="name">Sangre</text>
  <text x="465" y="408" text-anchor="middle" class="name">arterial</text>
  <text x="590" y="392" text-anchor="middle" class="name">Capilar</text>
  <text x="590" y="408" text-anchor="middle" class="name">tisular</text>
  <text x="715" y="392" text-anchor="middle" class="name">Mitocondria</text>


  <text x="215" y="104" text-anchor="middle" class="loss">Vapor</text>
  <text x="215" y="118" text-anchor="middle" class="loss">de agua</text>
  <text x="340" y="134" text-anchor="middle" class="loss">CO2 y mezcla con</text>
  <text x="340" y="148" text-anchor="middle" class="loss">gas residual</text>
  <text x="465" y="159" text-anchor="middle" class="loss">Desajuste y</text>
  <text x="465" y="173" text-anchor="middle" class="loss">cortocircuito</text>
  <text x="590" y="224" text-anchor="middle" class="loss">Extracción</text>
  <text x="590" y="238" text-anchor="middle" class="loss">por los tejidos</text>
  <text x="715" y="309" text-anchor="middle" class="loss">Difusión y</text>
  <text x="715" y="323" text-anchor="middle" class="loss">consumo</text>

  <text x="400" y="445" text-anchor="middle" class="cap muted">Alturas ilustrativas, sin escala. Ilustración original de AloVida.</text>
</svg>
