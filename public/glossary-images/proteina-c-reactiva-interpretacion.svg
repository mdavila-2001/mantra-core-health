<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dos usos de la proteína C reactiva y cómo se interpreta cada uno</title>
  <desc id="d">Diagrama con dos ramas. A la izquierda la proteína C reactiva convencional, para inflamación o infección activa, que se interpreta por la tendencia en el tiempo y las horas de evolución. A la derecha la de alta sensibilidad, para riesgo cardiovascular en personas sin infección, con las categorías de la declaración AHA/CDC de 2003: menos de 1, de 1 a 3 y más de 3 miligramos por litro.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#2a6fb0; --a-l:#dbe9f7; --ok:#1f8a5b; --ok-l:#d9f0e5; --mid:#b07a12; --mid-l:#f6e8c4; --bad:#c0392b; --bad-l:#f8dcd8; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#6fb0ee; --a-l:#223a52; --ok:#4cc38a; --ok-l:#1f3d31; --mid:#e8b84a; --mid-l:#44391b; --bad:#ef7467; --bad-l:#4a2622; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .big { font-size: 18px; font-weight: 800; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="34" text-anchor="middle" class="title">Qué pregunta responde cada ensayo</text>

  <!-- Rama izquierda -->
  <rect x="20" y="56" width="372" height="372" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="40" y="74" width="332" height="50" rx="12" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="206" y="105" text-anchor="middle" class="h">PCR convencional</text>
  <text x="206" y="150" text-anchor="middle" class="s">Pregunta: ¿hay inflamación o infección activa?</text>
  <path d="M206 160 v22 m-7 -8 l7 10 l7 -10" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="s">
    <rect x="40" y="192" width="332" height="56" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text x="54" y="215" class="s">• Importa la tendencia: dos medidas</text>
    <text x="64" y="235" class="s muted">separadas 24–48 h informan más que una</text>
    <rect x="40" y="258" width="332" height="56" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text x="54" y="281" class="s">• Importan las horas de evolución:</text>
    <text x="64" y="301" class="s muted">sube a las 4–6 h, máximo a las 36–50 h</text>
    <rect x="40" y="324" width="332" height="56" rx="10" fill="none" stroke="var(--line)" stroke-width="2"/>
    <text x="54" y="347" class="s">• Puede estar atenuada con bloqueo de</text>
    <text x="64" y="367" class="s muted">IL-6, inmunodepresión o lupus sin serositis</text>
  </g>
  <text x="206" y="408" text-anchor="middle" class="s muted">Inespecífica: no dice qué órgano ni qué causa</text>

  <!-- Rama derecha -->
  <rect x="408" y="56" width="372" height="372" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="428" y="74" width="332" height="50" rx="12" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="594" y="105" text-anchor="middle" class="h">PCR de alta sensibilidad</text>
  <text x="594" y="150" text-anchor="middle" class="s">Pregunta: ¿riesgo cardiovascular sin infección?</text>
  <path d="M594 160 v22 m-7 -8 l7 10 l7 -10" stroke="var(--muted)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tres categorías -->
  <rect x="428" y="192" width="104" height="84" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="480" y="224" text-anchor="middle" class="big" style="fill:var(--ok)">&lt; 1</text>
  <text x="480" y="244" text-anchor="middle" class="s">mg/L</text>
  <text x="480" y="264" text-anchor="middle" class="s">riesgo bajo</text>
  <rect x="548" y="192" width="104" height="84" rx="10" fill="var(--mid-l)" stroke="var(--mid)" stroke-width="2"/>
  <text x="600" y="224" text-anchor="middle" class="big" style="fill:var(--mid)">1–3</text>
  <text x="600" y="244" text-anchor="middle" class="s">mg/L</text>
  <text x="600" y="264" text-anchor="middle" class="s">riesgo promedio</text>
  <rect x="668" y="192" width="92" height="84" rx="10" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
  <text x="714" y="224" text-anchor="middle" class="big" style="fill:var(--bad)">&gt; 3</text>
  <text x="714" y="244" text-anchor="middle" class="s">mg/L</text>
  <text x="714" y="264" text-anchor="middle" class="s">riesgo alto</text>
  <text x="594" y="296" text-anchor="middle" class="s muted">Categorías AHA/CDC 2003 (Pearson et al.)</text>
  <g class="s">
    <text x="428" y="326" class="s">• Promediar 2 medidas, ~2 semanas aparte</text>
    <text x="428" y="348" class="s">• Excluir infección o lesión recientes</text>
    <text x="428" y="370" class="s">• Si es persistentemente &gt; 10 mg/L, buscar</text>
    <text x="440" y="390" class="s">otra causa de inflamación</text>
  </g>
  <text x="400" y="458" text-anchor="middle" class="s muted">Sin intervalos de referencia: dependen del método y del laboratorio. Ilustración original de AloVida.</text>
</svg>
