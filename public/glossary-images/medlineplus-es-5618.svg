<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Rehabilitación cardíaca</title>
  <desc id="d">Arriba, las tres fases del programa de rehabilitación cardíaca: en el hospital, un programa supervisado de ejercicio y educación, y el mantenimiento de por vida. Abajo, sus cinco componentes: ejercicio, control de factores de riesgo, tabaco y dieta, aspectos emocionales y medicación.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="210" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Las fases del programa</text>
  <rect x="44" y="66" width="214" height="140" rx="12" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="151" y="96" text-anchor="middle" class="big">Fase I</text>
  <text x="151" y="120" text-anchor="middle" class="lab">En el hospital</text>
  <text x="151" y="144" text-anchor="middle" class="small" style="fill:var(--muted)">Moverse pronto y aprender</text>
  <line x1="260" y1="136" x2="290" y2="136" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="294" y="66" width="214" height="140" rx="12" fill="var(--ok-l)" stroke="none" stroke-width="2"/>
  <text x="401" y="96" text-anchor="middle" class="big">Fase II</text>
  <text x="401" y="120" text-anchor="middle" class="lab">Programa supervisado</text>
  <text x="401" y="144" text-anchor="middle" class="small" style="fill:var(--muted)">Ejercicio y educación, semanas</text>
  <line x1="510" y1="136" x2="540" y2="136" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="544" y="66" width="214" height="140" rx="12" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <text x="651" y="96" text-anchor="middle" class="big">Fase III</text>
  <text x="651" y="120" text-anchor="middle" class="lab">De por vida</text>
  <text x="651" y="144" text-anchor="middle" class="small" style="fill:var(--muted)">Mantener los hábitos</text>
  <path d="M80 186 l20 0 l8 -14 l8 26 l8 -24 l8 12 l40 0" fill="none" stroke="var(--vessel)" stroke-width="2"/>
  <circle cx="390" cy="180" r="14" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M384 194 L370 200 M390 194 V200 L380 204 M390 200 L400 204" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <path d="M600 186 h60" fill="none" stroke="var(--ok)" stroke-width="3"/>
  <rect x="20" y="246" width="760" height="194" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="276" text-anchor="middle" class="title">Los componentes</text>
  <circle cx="104" cy="314" r="26" fill="var(--ok-l)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="104" y="320" text-anchor="middle" class="big">1</text>
  <text x="104" y="366" text-anchor="middle" class="lab">Ejercicio</text>
  <text x="104" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">adaptado y vigilado</text>
  <circle cx="250" cy="314" r="26" fill="var(--warn-l)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="250" y="320" text-anchor="middle" class="big">2</text>
  <text x="250" y="366" text-anchor="middle" class="lab">Factores de riesgo</text>
  <text x="250" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">presión, lípidos, glucosa</text>
  <circle cx="396" cy="314" r="26" fill="var(--accent-l)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="396" y="320" text-anchor="middle" class="big">3</text>
  <text x="396" y="366" text-anchor="middle" class="lab">Tabaco y dieta</text>
  <text x="396" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">dejar de fumar, comer sano</text>
  <circle cx="542" cy="314" r="26" fill="var(--violet-l)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="542" y="320" text-anchor="middle" class="big">4</text>
  <text x="542" y="366" text-anchor="middle" class="lab">Emociones</text>
  <text x="542" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">ansiedad, ánimo, estrés</text>
  <circle cx="688" cy="314" r="26" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="688" y="320" text-anchor="middle" class="big">5</text>
  <text x="688" y="366" text-anchor="middle" class="lab">Medicación</text>
  <text x="688" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">tomarla bien</text>
  <text x="400" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Para personas tras un infarto, cirugía cardíaca, insuficiencia cardíaca y otras</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
