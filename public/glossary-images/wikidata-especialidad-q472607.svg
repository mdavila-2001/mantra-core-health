<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mastología: la especialidad de la mama</title>
  <desc id="d">A la izquierda, una mama de perfil con los lobulillos que producen leche, los conductos que llegan al pezón y los ganglios de la axila. A la derecha, el circuito de estudio: consulta, mamografía y ecografía, biopsia si hay una lesión dudosa, tratamiento y seguimiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Anatomía de la mama</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Circuito de estudio</text>
<path d="M60 360 C60 210 130 120 220 120 C300 120 340 200 340 270 C340 330 300 360 260 360 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="330" cy="262" r="10" fill="var(--organ)"/>
<path d="M326 262 Q280 296 234 346" fill="none" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="233.6" cy="346.3" r="12" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<path d="M326 262 Q260 281 194 308" fill="none" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="194.1" cy="308.5" r="12" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<path d="M326 262 Q253 262 180 262" fill="none" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180.0" cy="262.0" r="12" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<path d="M326 262 Q260 243 194 216" fill="none" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="194.1" cy="215.5" r="12" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<path d="M326 262 Q280 228 234 178" fill="none" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="233.6" cy="177.7" r="12" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2"/>
<circle cx="90" cy="150" r="7" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<circle cx="110" cy="130" r="7" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<circle cx="76" cy="176" r="7" fill="var(--ok)" stroke="var(--panel)" stroke-width="2"/>
<text x="40" y="112" class="small" style="fill:var(--ok)">Ganglios axilares</text>
<text x="200" y="384" text-anchor="middle" class="small">Lobulillos (producen leche) y conductos</text>
<text x="200" y="400" text-anchor="middle" class="small">que llevan hasta el pezón.</text>
<text x="200" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">Atiende patología benigna y maligna.</text>
<rect x="416" y="66" width="170" height="48" rx="8" fill="var(--accent)"/>
<text x="501.0" y="94.3" text-anchor="middle" class="small" style="fill:var(--on)">Consulta</text>
<text x="600" y="95" class="small">bulto, dolor, secreción</text>
<line x1="501" y1="116" x2="501" y2="134" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="136" width="170" height="48" rx="8" fill="var(--purple)"/>
<text x="501.0" y="164.3" text-anchor="middle" class="small" style="fill:var(--on)">Mamografía y ecografía</text>
<text x="600" y="165" class="small">imagen de la mama</text>
<line x1="501" y1="186" x2="501" y2="204" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="206" width="170" height="48" rx="8" fill="var(--warn)"/>
<text x="501.0" y="234.3" text-anchor="middle" class="small" style="fill:var(--on)">Biopsia</text>
<text x="600" y="235" class="small">si hay una lesión dudosa</text>
<line x1="501" y1="256" x2="501" y2="274" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="276" width="170" height="48" rx="8" fill="var(--vessel)"/>
<text x="501.0" y="304.3" text-anchor="middle" class="small" style="fill:var(--on)">Tratamiento</text>
<text x="600" y="305" class="small">cirugía y terapias</text>
<line x1="501" y1="326" x2="501" y2="344" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="416" y="346" width="170" height="48" rx="8" fill="var(--ok)"/>
<text x="501.0" y="374.3" text-anchor="middle" class="small" style="fill:var(--on)">Seguimiento</text>
<text x="600" y="375" class="small">controles periódicos</text>
<text x="416" y="424" class="small" style="fill:var(--muted)">Trabaja en unidades de mama con otros especialistas.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
