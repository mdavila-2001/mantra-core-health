<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Farmacología</title>
  <desc id="d">Arriba, las cuatro etapas de la farmacocinética: absorción, distribución por la sangre, metabolismo sobre todo en el hígado y eliminación por el riñón o la bilis. Abajo, la farmacodinamia, con un fármaco que se une a su receptor, y los usos prácticos de la farmacología, como elegir el medicamento y prevenir interacciones.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Farmacocinética: lo que el cuerpo hace con el fármaco</text>
  <rect x="40" y="76" width="162" height="110" rx="12" fill="var(--tissue)"/>
  <circle cx="121" cy="110" r="20" fill="var(--accent)"/>
  <text x="121" y="115" text-anchor="middle" class="step" style="fill:var(--on)">A</text>
  <text x="121" y="154" text-anchor="middle" class="step">Absorción</text>
  <text x="121" y="174" text-anchor="middle" class="small muted">intestino, piel, músculo</text>
  <line x1="204" y1="131" x2="224" y2="131" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="226" y="76" width="162" height="110" rx="12" fill="var(--tissue)"/>
  <circle cx="307" cy="110" r="20" fill="var(--vessel)"/>
  <text x="307" y="115" text-anchor="middle" class="step" style="fill:var(--on)">D</text>
  <text x="307" y="154" text-anchor="middle" class="step">Distribución</text>
  <text x="307" y="174" text-anchor="middle" class="small muted">por la sangre a tejidos</text>
  <line x1="390" y1="131" x2="410" y2="131" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="412" y="76" width="162" height="110" rx="12" fill="var(--tissue)"/>
  <circle cx="493" cy="110" r="20" fill="var(--nerve)"/>
  <text x="493" y="115" text-anchor="middle" class="step" style="fill:var(--on)">M</text>
  <text x="493" y="154" text-anchor="middle" class="step">Metabolismo</text>
  <text x="493" y="174" text-anchor="middle" class="small muted">sobre todo el hígado</text>
  <line x1="576" y1="131" x2="596" y2="131" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="598" y="76" width="162" height="110" rx="12" fill="var(--tissue)"/>
  <circle cx="679" cy="110" r="20" fill="var(--ok)"/>
  <text x="679" y="115" text-anchor="middle" class="step" style="fill:var(--on)">E</text>
  <text x="679" y="154" text-anchor="middle" class="step">Eliminación</text>
  <text x="679" y="174" text-anchor="middle" class="small muted">riñón, bilis</text>
  <text x="400" y="222" text-anchor="middle" class="lab">Explica cuánto tarda en actuar, cuánto dura y por qué se ajusta la dosis</text>
  <text x="400" y="244" text-anchor="middle" class="small muted">en niños, mayores o personas con enfermedad del hígado o del riñón</text>
  <rect x="20" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">Farmacodinamia</text>
  <rect x="50" y="366" width="110" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <path d="M84 366 L105 392 L126 366 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M84 334 H126 V346 L105 372 L84 346 Z" fill="var(--purple)"/>
  <text x="105" y="412" text-anchor="middle" class="small">Receptor</text>
  <text x="180" y="340" class="small">El fármaco se une</text>
  <text x="180" y="358" class="small">a su diana y produce</text>
  <text x="180" y="376" class="small">el efecto, deseado</text>
  <text x="180" y="394" class="small">o adverso</text>
  <rect x="410" y="286" width="370" height="160" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="316" text-anchor="middle" class="title">Para qué sirve</text>
  <text x="430" y="340" class="lab">• Elegir el medicamento adecuado</text>
  <text x="430" y="364" class="lab">• Prevenir interacciones</text>
  <text x="430" y="388" class="lab">• Vigilar efectos adversos</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
