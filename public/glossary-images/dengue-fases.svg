<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Las tres fases del dengue</title>
  <desc id="d">Línea de tiempo de unos diez días de enfermedad. Una curva de temperatura sube de golpe en la fase febril, que dura entre dos y siete días. Cuando la fiebre baja, entre los días 3 y 7, comienza la fase crítica, donde puede haber fuga de plasma y aparecer los signos de alarma. Después viene la fase de recuperación, con mejoría general.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --fever:#c0392b; --fever-l:#f6d5cf; --crit:#b7791f; --crit-l:#f7e4bf; --rec:#1f8a5b; --rec-l:#cdeedd; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --fever:#ef7467; --fever-l:#4a2a27; --crit:#e0b25a; --crit-l:#4a3b1f; --rec:#4cc38a; --rec-l:#1f4033; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .ph { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Cómo evoluciona el dengue en los primeros días</text>

  <!-- fases -->
  <rect x="60" y="76" width="280" height="190" fill="var(--fever-l)"/>
  <rect x="340" y="76" width="170" height="190" fill="var(--crit-l)"/>
  <rect x="510" y="76" width="230" height="190" fill="var(--rec-l)"/>
  <text x="200" y="98" text-anchor="middle" class="ph" style="fill:var(--fever)">Fase febril</text>
  <text x="425" y="98" text-anchor="middle" class="ph" style="fill:var(--crit)">Fase crítica</text>
  <text x="625" y="98" text-anchor="middle" class="ph" style="fill:var(--rec)">Recuperación</text>

  <!-- ejes -->
  <line x1="60" y1="266" x2="740" y2="266" stroke="var(--muted)"/>
  <line x1="60" y1="76" x2="60" y2="266" stroke="var(--muted)"/>
  <text x="52" y="86" text-anchor="end" class="small muted">Fiebre</text>
  <text x="52" y="262" text-anchor="end" class="small muted">Normal</text>

  <!-- curva de temperatura -->
  <path d="M60 250 C 70 250, 85 126, 105 124 L 300 126 C 330 128, 345 236, 370 244 L 740 246" fill="none" stroke="var(--fever)" stroke-width="4" stroke-linecap="round"/>

  <!-- días -->
  <g class="small muted" text-anchor="middle">
    <text x="60" y="284">Día 1</text><text x="170" y="284">Día 3</text><text x="300" y="284">Día 5</text><text x="425" y="284">Días 3 a 7</text><text x="625" y="284">Después de 48 a 72 h</text>
  </g>

  <!-- notas -->
  <g class="lab">
    <text x="200" y="150" text-anchor="middle">Fiebre alta y brusca,</text>
    <text x="200" y="168" text-anchor="middle">dolor de cabeza, dolor retroocular,</text>
    <text x="200" y="186" text-anchor="middle">dolores musculares y articulares</text>
    <text x="425" y="150" text-anchor="middle">La fiebre baja:</text>
    <text x="425" y="168" text-anchor="middle">puede fugarse plasma</text>
    <text x="425" y="186" text-anchor="middle">de los vasos</text>
    <text x="625" y="150" text-anchor="middle">Mejora el estado general,</text>
    <text x="625" y="168" text-anchor="middle">vuelve el apetito,</text>
    <text x="625" y="186" text-anchor="middle">aumenta la orina</text>
  </g>

  <!-- alarma -->
  <rect x="60" y="310" width="680" height="84" rx="10" fill="var(--panel)" stroke="var(--crit)" stroke-width="2"/>
  <text x="76" y="334" class="ph" style="fill:var(--crit)">Signos de alarma: ir de inmediato al servicio de salud</text>
  <text x="76" y="356" class="lab">Dolor abdominal intenso · vómitos persistentes · sangrado de encías o nariz</text>
  <text x="76" y="376" class="lab">Somnolencia o inquietud · respiración rápida · piel pálida y fría · sed intensa</text>
</svg>
