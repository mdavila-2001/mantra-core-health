<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Segmento móvil de la columna vertebral</title>
  <desc id="d">Corte lateral de dos vértebras unidas por un disco intervertebral con núcleo pulposo y anillo fibroso, los ligamentos longitudinales anterior y posterior, el ligamento amarillo, las articulaciones facetarias y la raíz nerviosa saliendo por el agujero de conjunción, con una hernia discal que la roza.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f7; --art:#c0392b; --art-l:#f6dcd8; --vein:#2f6fbf; --vein-l:#d6e4f6; --ok:#1f8a5b; --ok-l:#d7efe3; --warn:#c77d12; --warn-l:#f8ead2; --purple:#7a4fb5; --purple-l:#e8def5; --nerve:#d9a514; --tissue:#f1e4dc; --bone:#e3dccf; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --art:#ef7467; --art-l:#4a2a2a; --vein:#78a9e6; --vein-l:#22364f; --ok:#4cc38a; --ok-l:#1d3a2e; --warn:#e6a54a; --warn-l:#3f3220; --purple:#b393e3; --purple-l:#352a47; --nerve:#e8c04a; --tissue:#3a302c; --bone:#4f4a40; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .on { fill: var(--on); }
    .b { font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--art)"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--vein)"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="428" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="50" text-anchor="middle" class="title">Segmento móvil de la columna (vista lateral)</text>
  <text x="150" y="76" text-anchor="middle" class="small muted">Anterior</text>
  <text x="640" y="76" text-anchor="middle" class="small muted">Posterior</text>
  <rect x="200" y="86" width="170" height="112" rx="10" fill="var(--bone)" stroke="var(--muted)"/>
  <rect x="200" y="268" width="170" height="112" rx="10" fill="var(--bone)" stroke="var(--muted)"/>
  <rect x="202" y="202" width="166" height="62" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <ellipse cx="286" cy="233" rx="40" ry="18" fill="var(--purple-l)" stroke="var(--purple)"/>
  <path d="M366 218 C392 214 404 228 404 236 C404 246 392 252 366 250 Z" fill="var(--purple-l)" stroke="var(--purple)"/>
  <rect x="190" y="90" width="8" height="286" rx="4" fill="var(--ok)" opacity=".75"/>
  <rect x="372" y="90" width="7" height="122" rx="3" fill="var(--ok)" opacity=".75"/><rect x="372" y="256" width="7" height="120" rx="3" fill="var(--ok)" opacity=".75"/>
  <rect x="368" y="96" width="94" height="48" rx="8" fill="var(--bone)" stroke="var(--muted)"/>
  <rect x="368" y="282" width="94" height="48" rx="8" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M450 110 H510 V236 C498 246 470 246 458 236 Z" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M458 330 V252 C470 242 498 242 510 252 V330 Z" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M458 244 C472 236 496 236 510 244" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M506 104 H560 L690 150 C700 160 694 176 682 176 L560 172 C540 172 520 168 506 160 Z" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M506 290 H560 L690 336 C700 346 694 362 682 362 L560 358 C540 358 520 354 506 346 Z" fill="var(--bone)" stroke="var(--muted)"/>
  <rect x="520" y="176" width="16" height="110" rx="6" fill="var(--warn)" opacity=".7"/>
  <ellipse cx="418" cy="226" rx="16" ry="24" fill="var(--nerve)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="176" y="136" text-anchor="end" class="small">Cuerpo vertebral</text>
  <path d="M180 132 L214 132" stroke="var(--muted)" stroke-width="1"/>
  <text x="176" y="214" text-anchor="end" class="small">Anillo fibroso</text>
  <path d="M180 210 L212 210" stroke="var(--muted)" stroke-width="1"/>
  <text x="176" y="250" text-anchor="end" class="small">Núcleo pulposo</text>
  <path d="M180 246 L250 238" stroke="var(--muted)" stroke-width="1"/>
  <text x="176" y="330" text-anchor="end" class="small">Ligamento</text>
  <text x="176" y="345" text-anchor="end" class="small">longitudinal anterior</text>
  <path d="M180 334 L190 334" stroke="var(--muted)" stroke-width="1"/>
  <text x="300" y="412" text-anchor="middle" class="small">Ligamento longitudinal posterior</text>
  <path d="M375 378 L340 400" stroke="var(--muted)" stroke-width="1"/>
  <text x="470" y="412" text-anchor="start" class="small b" style="fill:var(--purple)">Hernia discal que roza la raíz</text>
  <path d="M470 404 L396 250" stroke="var(--muted)" stroke-width="1"/>
  <text x="560" y="226" text-anchor="start" class="small">Ligamento</text>
  <text x="560" y="241" text-anchor="start" class="small">amarillo</text>
  <path d="M558 230 L536 230" stroke="var(--muted)" stroke-width="1"/>
  <text x="418" y="92" text-anchor="middle" class="small">Pedículo</text>
  <text x="584" y="120" text-anchor="start" class="small">Lámina y apófisis espinosa</text>
  <path d="M640 126 L650 150" stroke="var(--muted)" stroke-width="1"/>
  <text x="600" y="292" text-anchor="start" class="small">Articulación facetaria</text>
  <path d="M598 288 L512 246" stroke="var(--muted)" stroke-width="1"/>
  <text x="392" y="166" text-anchor="start" class="tiny">Agujero de</text>
  <text x="392" y="178" text-anchor="start" class="tiny">conjunción</text>
  <text x="440" y="262" text-anchor="start" class="tiny b">Raíz nerviosa</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
