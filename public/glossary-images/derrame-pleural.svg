<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Derrame pleural</title>
  <desc id="d">A la izquierda, los dos pulmones dentro del tórax; en la base del pulmón derecho se acumula líquido entre las dos capas de la pleura y lo comprime. A la derecha, causas frecuentes como insuficiencia cardíaca, neumonía o cáncer, los síntomas principales y las pruebas para estudiarlo: radiografía, ecografía y toracocentesis.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Líquido entre las pleuras</text>
  <path d="M140 80 C90 100 70 200 80 330 Q130 350 200 330 L200 110 C190 90 170 80 140 80 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M300 80 C350 100 370 200 360 330 Q310 350 240 330 L240 110 C250 90 270 80 300 80 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M362 230 C372 280 370 320 360 340 Q310 362 236 344 L238 300 Q300 300 362 230 Z" fill="var(--beam)" opacity=".8"/>
  <path d="M296 72 C356 92 382 200 372 344 Q310 370 230 352" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M220 58 V110" stroke="var(--accent)" stroke-width="10"/>
  <text x="232" y="80" class="small muted">Tráquea</text>
  <circle cx="320" cy="320" r="3" fill="var(--ink)"/>
  <path d="M320 320 L330 400" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="404" class="lab">Líquido pleural</text>
  <circle cx="375" cy="180" r="3" fill="var(--ink)"/>
  <path d="M375 180 L392 140" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="388" y="144" text-anchor="end" class="lab">Pleura</text>
  <text x="300" y="200" text-anchor="middle" class="small">Pulmón</text>
  <text x="300" y="216" text-anchor="middle" class="small">comprimido</text>
  <text x="140" y="220" text-anchor="middle" class="small">Pulmón sano</text>
  <text x="230" y="436" text-anchor="middle" class="small muted">El líquido se acumula en la base y reduce</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="480" y="74" class="step">Causas frecuentes</text>
  <text x="480" y="98" class="small">• Insuficiencia cardíaca</text>
  <text x="480" y="120" class="small">• Neumonía</text>
  <text x="480" y="142" class="small">• Cáncer</text>
  <text x="480" y="164" class="small">• Embolia pulmonar</text>
  <text x="480" y="196" class="step">Síntomas</text>
  <text x="480" y="222" class="small">• Falta de aire</text>
  <text x="480" y="244" class="small">• Dolor al respirar hondo</text>
  <text x="480" y="266" class="small">• Tos seca</text>
  <text x="480" y="306" class="step">Cómo se estudia</text>
  <rect x="480" y="322" width="90" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="525.0" y="345.0" text-anchor="middle" class="small">Radiografía</text>
  <rect x="576" y="322" width="90" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="621.0" y="345.0" text-anchor="middle" class="small">Ecografía</text>
  <rect x="672" y="322" width="90" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="717.0" y="345.0" text-anchor="middle" class="small">Toracocentesis</text>
  <text x="620" y="388" text-anchor="middle" class="small muted">La toracocentesis extrae líquido</text>
  <text x="620" y="406" text-anchor="middle" class="small muted">para analizarlo y aliviar</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
