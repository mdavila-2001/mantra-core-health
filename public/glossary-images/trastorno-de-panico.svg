<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trastorno de pánico</title>
  <desc id="d">A la izquierda, un ciclo de cuatro pasos: una sensación física, su interpretación catastrófica, el miedo intenso y más síntomas por la alarma, que vuelven a empezar. A la derecha, las características del trastorno, un aviso sobre el dolor de pecho y los tratamientos eficaces.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">El círculo del pánico</text>
  <rect x="150" y="72" width="140" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="220.0" y="96.5" text-anchor="middle" class="small">Sensación física</text>
  <text x="220.0" y="113.5" text-anchor="middle" class="small">palpitaciones, mareo</text>
  <rect x="270" y="202" width="140" height="56" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="340.0" y="226.5" text-anchor="middle" class="small">Interpretación</text>
  <text x="340.0" y="243.5" text-anchor="middle" class="small">catastrófica</text>
  <rect x="150" y="332" width="140" height="56" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="220.0" y="356.5" text-anchor="middle" class="small">Miedo intenso</text>
  <text x="220.0" y="373.5" text-anchor="middle" class="small">«me muero»</text>
  <rect x="30" y="202" width="140" height="56" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="100.0" y="226.5" text-anchor="middle" class="small">Más síntomas</text>
  <text x="100.0" y="243.5" text-anchor="middle" class="small">por la alarma</text>
  <path d="M292 112 C330 130 342 170 342 196" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M340 260 C336 310 310 346 294 356" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M148 362 C110 350 100 300 100 262" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M100 200 C100 150 120 116 146 106" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <text x="220" y="228" text-anchor="middle" class="small">Escala</text>
  <text x="220" y="246" text-anchor="middle" class="small">en minutos</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Qué es y qué ayuda</text>
  <text x="456" y="80" class="small">• Crisis de miedo intenso inesperadas</text>
  <text x="456" y="102" class="small">• Opresión, falta de aire, temblor</text>
  <text x="456" y="124" class="small">• Miedo a nuevas crisis</text>
  <text x="456" y="146" class="small">• Evitar lugares o situaciones</text>
  <rect x="456" y="180" width="304" height="66" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="608" y="206" text-anchor="middle" class="small">Ante dolor en el pecho nuevo,</text>
  <text x="608" y="226" text-anchor="middle" class="small">descartar primero causas físicas</text>
  <rect x="456" y="262" width="304" height="160" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="288" class="step">Tratamientos eficaces</text>
  <text x="480" y="312" class="small">• Terapia cognitivo-conductual</text>
  <text x="480" y="332" class="small">• Exposición gradual a lo temido</text>
  <text x="480" y="352" class="small">• Respiración lenta durante la crisis</text>
  <text x="480" y="372" class="small">• Medicación indicada por el médico</text>
  <text x="480" y="392" class="small">• Reducir cafeína y alcohol</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
