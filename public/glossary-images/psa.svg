<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Antígeno prostático específico (PSA)</title>
  <desc id="d">A la izquierda, la vejiga, la próstata que rodea la uretra y partículas de PSA que pasan a la sangre. A la derecha, un tubo de sangre y cuatro causas que pueden elevar el PSA: hiperplasia benigna, prostatitis, cáncer de próstata y factores como la edad o una sonda.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dónde se produce el PSA</text>
  <ellipse cx="200" cy="120" rx="90" ry="60" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="200" y="116" text-anchor="middle" class="lab">Vejiga</text>
  <ellipse cx="200" cy="222" rx="56" ry="44" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M200 160 V330" fill="none" stroke="var(--nerve)" stroke-width="6"/>
  <text x="268" y="210" class="step">Próstata</text>
  <text x="268" y="230" class="small muted">rodea la uretra</text>
  <text x="214" y="320" class="small muted">Uretra</text>
  <circle cx="176" cy="210" r="5" fill="var(--purple)"/>
  <circle cx="220" cy="232" r="5" fill="var(--purple)"/>
  <circle cx="190" cy="244" r="5" fill="var(--purple)"/>
  <circle cx="226" cy="204" r="5" fill="var(--purple)"/>
  <line x1="150" y1="250" x2="90" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="80" y="320" text-anchor="middle" class="small">Pasa un poco</text>
  <text x="80" y="338" text-anchor="middle" class="small">a la sangre</text>
  <text x="200" y="386" text-anchor="middle" class="lab">Lo fabrican células normales</text>
  <text x="200" y="406" text-anchor="middle" class="lab">y también las tumorales</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué puede elevarlo</text>
  <rect x="438" y="64" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M440 80 V144 a15 15 0 0 0 30 0 V80 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M442 110 V144 a13 13 0 0 0 26 0 V110 Z" fill="var(--vessel)"/>
  <text x="486" y="92" class="lab">Muestra de sangre</text>
  <text x="486" y="114" class="small muted">No hay un valor que separe sano</text>
  <text x="486" y="132" class="small muted">de enfermo</text>
  <rect x="436" y="186" width="324" height="36" rx="8" fill="var(--accent)"/>
  <text x="598.0" y="208.68" text-anchor="middle" class="lab" style="fill:var(--on)">Hiperplasia benigna</text>
  <rect x="436" y="232" width="324" height="36" rx="8" fill="var(--warn)"/>
  <text x="598.0" y="254.68" text-anchor="middle" class="lab" style="fill:var(--on)">Prostatitis o infección</text>
  <rect x="436" y="278" width="324" height="36" rx="8" fill="var(--vessel)"/>
  <text x="598.0" y="300.68" text-anchor="middle" class="lab" style="fill:var(--on)">Cáncer de próstata</text>
  <rect x="436" y="324" width="324" height="36" rx="8" fill="var(--muted)"/>
  <text x="598.0" y="346.68" text-anchor="middle" class="lab" style="fill:var(--on)">Edad, sonda, eyaculación</text>
  <text x="598" y="390" text-anchor="middle" class="lab">Un PSA alto no es un diagnóstico:</text>
  <text x="598" y="410" text-anchor="middle" class="lab">se decide con el médico qué sigue</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
