<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Camino de la bilirrubina en el organismo</title>
  <desc id="d">Esquema de flujo. Los glóbulos rojos envejecidos liberan hemo que se convierte en bilirrubina no conjugada, transportada por la albúmina hasta el hígado. El hígado la conjuga y la excreta con la bilis al intestino, donde se transforma en urobilinógeno. Parte sale en las heces como estercobilina, parte se reabsorbe y sale por la orina como urobilina.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --yel:#c99a00; --yel-l:#fbefc2; --blue:#2f6fb5; --blue-l:#dbe9f7; --grn:#1f8a5b; --grn-l:#d8f0e4; --red:#c0392b; --red-l:#f8dcd8; --brn:#8a5a2b; --brn-l:#efdcc6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --yel:#e0b93a; --yel-l:#4a4224; --blue:#6aa6e6; --blue-l:#22384f; --grn:#4cc38a; --grn-l:#1f3d31; --red:#ef7467; --red-l:#4a2723; --brn:#c99a66; --brn-l:#3d3125; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); font-size: 14px; }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; }
    .arrow { stroke: var(--muted); stroke-width: 2.5; fill: none; marker-end: url(#ah); }
    .dash { stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="32" text-anchor="middle" class="title">Camino de la bilirrubina</text>

  <!-- Fila 1 -->
  <rect x="20" y="56" width="200" height="86" rx="12" fill="var(--red-l)" stroke="var(--red)" stroke-width="2"/>
  <text x="120" y="84" text-anchor="middle" class="h">Glóbulos rojos</text>
  <text x="120" y="104" text-anchor="middle" class="s">envejecidos: se destruyen</text>
  <text x="120" y="122" text-anchor="middle" class="s">en bazo y médula ósea</text>

  <rect x="262" y="56" width="236" height="86" rx="12" fill="var(--yel-l)" stroke="var(--yel)" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" class="h">Bilirrubina no conjugada</text>
  <text x="380" y="102" text-anchor="middle" class="s">(indirecta): poco soluble en agua</text>
  <text x="380" y="122" text-anchor="middle" class="s">hemo → biliverdina → bilirrubina</text>

  <rect x="540" y="56" width="240" height="86" rx="12" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/>
  <text x="660" y="84" text-anchor="middle" class="h">Sangre</text>
  <text x="660" y="104" text-anchor="middle" class="s">viaja unida a la albúmina</text>
  <text x="660" y="122" text-anchor="middle" class="s">hasta el hígado</text>

  <path class="arrow" d="M222 99 H258"/>
  <path class="arrow" d="M500 99 H536"/>

  <!-- Fila 2: hígado -->
  <rect x="440" y="186" width="340" height="100" rx="12" fill="var(--grn-l)" stroke="var(--grn)" stroke-width="2"/>
  <text x="610" y="210" text-anchor="middle" class="h">Hígado</text>
  <text x="610" y="232" text-anchor="middle" class="s">1. captación por el hepatocito</text>
  <text x="610" y="252" text-anchor="middle" class="s">2. conjugación con ácido glucurónico (UGT1A1)</text>
  <text x="610" y="272" text-anchor="middle" class="s">3. bilirrubina conjugada (directa), soluble</text>
  <path class="arrow" d="M660 144 V182"/>

  <!-- Orina -->
  <rect x="20" y="196" width="230" height="80" rx="12" fill="var(--yel-l)" stroke="var(--yel)" stroke-width="2"/>
  <text x="135" y="222" text-anchor="middle" class="h">Riñón y orina</text>
  <text x="135" y="242" text-anchor="middle" class="s">urobilina: color amarillo</text>
  <text x="135" y="260" text-anchor="middle" class="s">de la orina normal</text>

  <!-- Fila 3 -->
  <rect x="540" y="352" width="240" height="84" rx="12" fill="var(--grn-l)" stroke="var(--grn)" stroke-width="2"/>
  <text x="660" y="380" text-anchor="middle" class="h">Vía biliar</text>
  <text x="660" y="400" text-anchor="middle" class="s">la bilis llega al duodeno</text>
  <text x="660" y="418" text-anchor="middle" class="s">(si se obstruye: ictericia)</text>
  <path class="arrow" d="M660 288 V348"/>

  <rect x="262" y="352" width="236" height="84" rx="12" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
  <text x="380" y="380" text-anchor="middle" class="h">Intestino</text>
  <text x="380" y="400" text-anchor="middle" class="s">las bacterias la convierten</text>
  <text x="380" y="418" text-anchor="middle" class="s">en urobilinógeno</text>
  <path class="arrow" d="M538 394 H502"/>

  <rect x="20" y="352" width="200" height="84" rx="12" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
  <text x="120" y="380" text-anchor="middle" class="h">Heces</text>
  <text x="120" y="400" text-anchor="middle" class="s">estercobilina: color pardo</text>
  <text x="120" y="418" text-anchor="middle" class="s">(sin bilis, heces pálidas)</text>
  <path class="arrow" d="M260 394 H224"/>

  <!-- reabsorción -->
  <path class="arrow dash" d="M320 348 C 300 320, 220 310, 170 280"/>
  <text x="150" y="318" class="s muted" text-anchor="middle">parte se reabsorbe</text>
  <path class="arrow dash" d="M440 348 C 440 320, 460 300, 480 290"/>
  <text x="456" y="326" class="s muted" text-anchor="start">ciclo enterohepático</text>

  <text x="400" y="464" text-anchor="middle" class="s muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
