<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Causas de infertilidad femenina según su origen</title>
  <desc id="d">Útero, trompas y ovarios con cuatro zonas numeradas donde puede estar la dificultad: la ovulación, las trompas, el útero y la endometriosis. A la derecha, cuándo empezar el estudio, qué pruebas básicas se hacen y las opciones de tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Infertilidad femenina: dónde puede estar la dificultad</text>
  <rect x="20" y="60" width="500" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270.0" y="90" text-anchor="middle" class="title">Aparato reproductor femenino</text>
  <path d="M210 160 C210 140 310 140 310 160 C310 220 290 250 275 270 L275 320 L245 320 L245 270 C230 250 210 220 210 160 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M212 170 C170 150 140 160 110 190 M308 170 C350 150 380 160 410 190" fill="none" stroke="var(--red)" stroke-width="5"/>
  <ellipse cx="104" cy="210" rx="24" ry="16" fill="var(--pur-l)" stroke="var(--pur)"/>
  <ellipse cx="416" cy="210" rx="24" ry="16" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="260" y="196" text-anchor="middle" class="small b">Útero</text>
  <text x="104" y="250" text-anchor="middle" class="small b">1 · Ovulación</text>
  <text x="104" y="266" text-anchor="middle" class="small muted">SOP, tiroides, edad</text>
  <text x="416" y="250" text-anchor="middle" class="small b">2 · Trompas</text>
  <text x="416" y="266" text-anchor="middle" class="small muted">obstrucción, infección</text>
  <text x="150" y="360" text-anchor="middle" class="small b">3 · Útero</text>
  <text x="150" y="376" text-anchor="middle" class="small muted">miomas, pólipos</text>
  <text x="370" y="360" text-anchor="middle" class="small b">4 · Endometriosis</text>
  <text x="370" y="376" text-anchor="middle" class="small muted">tejido fuera del útero</text>
  <line x1="150" y1="345" x2="230" y2="240" stroke="var(--muted)" stroke-width="1"/>
  <line x1="370" y1="345" x2="290" y2="300" stroke="var(--muted)" stroke-width="1"/>
  <text x="260" y="420" text-anchor="middle" class="small muted">Cuello uterino: moco y paso de espermatozoides</text>
  <rect x="536" y="60" width="244" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="658.0" y="90" text-anchor="middle" class="title">Estudio básico</text>
  <text x="552" y="110" class="small">• Tras 12 meses sin</text>
  <text x="563" y="134" class="small">embarazo (6 si es</text>
  <text x="563" y="158" class="small">mayor de 35 años)</text>
  <text x="552" y="182" class="small">• Estudiar a la pareja</text>
  <text x="563" y="206" class="small">a la vez</text>
  <text x="552" y="230" class="small">• Hormonas en sangre</text>
  <text x="552" y="254" class="small">• Ecografía</text>
  <text x="552" y="278" class="small">• Prueba de trompas</text>
  <text x="552" y="330" class="lab b">Opciones</text>
  <text x="552" y="354" class="small">• Inducir la ovulación</text>
  <text x="552" y="378" class="small">• Cirugía si hay lesión</text>
  <text x="552" y="402" class="small">• Reproducción asistida</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
