<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Uroginecología: el suelo pélvico femenino</title>
  <desc id="d">A la izquierda, un corte lateral simplificado de la pelvis femenina con la vejiga, el útero, la vagina y el recto apoyados sobre los músculos del suelo pélvico, que forman una hamaca. A la derecha, los problemas que trata la uroginecología, como pérdidas de orina y prolapso, y sus tratamientos escalonados: ejercicios, pesario, fármacos y cirugía.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">El suelo pélvico</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué trata</text>
<path d="M50 90 C50 80 350 80 350 90 L350 300 C350 330 50 330 50 300 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="110" cy="210" rx="46" ry="40" fill="var(--yellow)" stroke="var(--warn)" stroke-width="2" opacity=".8"/>
<text x="110" y="214" text-anchor="middle" class="small">Vejiga</text>
<path d="M170 140 C150 140 150 190 170 220 L196 270 L214 266 L210 210 C230 170 220 140 196 136 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="194" y="126" text-anchor="middle" class="small">Útero</text>
<path d="M204 268 L210 316" fill="none" stroke="var(--organ)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="222" y="288" class="small" style="fill:var(--organ)">Vagina</text>
<path d="M290 120 C300 180 290 240 270 290 L262 318" fill="none" stroke="var(--warn)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
<text x="316" y="160" text-anchor="middle" class="small">Recto</text>
<path d="M70 300 C130 350 270 350 330 300" fill="none" stroke="var(--vessel)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".7"/>
<text x="200" y="366" text-anchor="middle" class="lab" style="fill:var(--vessel)">Músculos del suelo pélvico</text>
<text x="200" y="394" text-anchor="middle" class="small" style="fill:var(--muted)">Una hamaca que sostiene los órganos</text>
<text x="200" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">y ayuda a contener orina y heces.</text>
<text x="416" y="76" class="h">Problemas que trata</text>
<text x="416" y="102" class="small">• Pérdidas de orina al toser o</text>
<text x="427" y="124" class="small">al hacer esfuerzo</text>
<text x="416" y="146" class="small">• Urgencia para orinar</text>
<text x="416" y="168" class="small">• Prolapso: descenso de órganos</text>
<text x="416" y="190" class="small">• Dificultad para vaciar la vejiga</text>
<text x="416" y="212" class="small">• Incontinencia fecal</text>
<text x="416" y="252" class="h">Tratamientos escalonados</text>
<rect x="416" y="268" width="166" height="64" rx="8" fill="var(--ok-l)" stroke="var(--ok)"/>
<text x="499" y="296" text-anchor="middle" class="step" style="fill:var(--ok)">Ejercicios</text>
<text x="499" y="316" text-anchor="middle" class="small">del suelo pélvico</text>
<rect x="592" y="268" width="166" height="64" rx="8" fill="var(--accent-l)" stroke="var(--accent)"/>
<text x="675" y="296" text-anchor="middle" class="step" style="fill:var(--accent)">Pesario</text>
<text x="675" y="316" text-anchor="middle" class="small">dispositivo vaginal</text>
<rect x="416" y="344" width="166" height="64" rx="8" fill="var(--purple-l)" stroke="var(--purple)"/>
<text x="499" y="372" text-anchor="middle" class="step" style="fill:var(--purple)">Fármacos</text>
<text x="499" y="392" text-anchor="middle" class="small">para la vejiga</text>
<rect x="592" y="344" width="166" height="64" rx="8" fill="var(--bad-l)" stroke="var(--vessel)"/>
<text x="675" y="372" text-anchor="middle" class="step" style="fill:var(--vessel)">Cirugía</text>
<text x="675" y="392" text-anchor="middle" class="small">reparadora</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
