<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dímero D</title>
  <desc id="d">A la izquierda, el proceso que genera el dímero D: un coágulo de fibrina que la plasmina disuelve en fragmentos que pasan a la sangre. A la derecha, su utilidad para descartar trombosis y embolia, y las situaciones que lo elevan sin trombo.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">De dónde sale el dímero D</text>
  <rect x="40" y="66" width="110" height="50" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="95.0" y="87.5" text-anchor="middle" class="lab">Coágulo</text>
  <text x="95.0" y="104.5" text-anchor="middle" class="lab">de fibrina</text>
  <rect x="170" y="66" width="100" height="50" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="220.0" y="87.5" text-anchor="middle" class="lab">Plasmina</text>
  <text x="220.0" y="104.5" text-anchor="middle" class="lab">lo disuelve</text>
  <rect x="290" y="66" width="110" height="50" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="345.0" y="87.5" text-anchor="middle" class="lab">Fragmentos:</text>
  <text x="345.0" y="104.5" text-anchor="middle" class="lab">dímero D</text>
  <line x1="150" y1="91" x2="168" y2="91" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="270" y1="91" x2="288" y2="91" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="50" y="150" width="340" height="120" rx="12" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <line x1="60" y1="160" x2="100" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="60" y1="260" x2="120" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="96" y1="160" x2="130" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="96" y1="260" x2="148" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="132" y1="160" x2="160" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="132" y1="260" x2="176" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="168" y1="160" x2="190" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="168" y1="260" x2="204" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="204" y1="160" x2="220" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="204" y1="260" x2="232" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="240" y1="160" x2="250" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="240" y1="260" x2="260" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="276" y1="160" x2="280" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="276" y1="260" x2="288" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="312" y1="160" x2="310" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="312" y1="260" x2="316" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="348" y1="160" x2="340" y2="260" stroke="var(--organ-d)" stroke-width="2"/>
  <line x1="348" y1="260" x2="344" y2="160" stroke="var(--organ-d)" stroke-width="2"/>
  <circle cx="120" cy="200" r="9" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <circle cx="190" cy="230" r="9" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <circle cx="250" cy="190" r="9" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <circle cx="310" cy="220" r="9" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="220" y="290" text-anchor="middle" class="small" style="fill:var(--muted)">Malla de fibrina que atrapa glóbulos rojos</text>
  <rect x="110" y="340" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="126" y="340" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="150" y="330" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="166" y="330" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="190" y="345" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="206" y="345" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="230" y="330" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="246" y="330" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="270" y="342" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <rect x="286" y="342" width="14" height="7" rx="2" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="190" y="376" text-anchor="middle" class="small">Al disolverse, pasan a la sangre</text>
  <rect x="350" y="316" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M353 330 V386 a12 12 0 0 0 24 0 V330" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M355 356 V386 a10 10 0 0 0 20 0 V356 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="220" y="422" text-anchor="middle" class="lab">Muestra: sangre</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Para qué sirve</text>
  <rect x="456" y="66" width="304" height="120" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="92" class="step">Ayuda a descartar trombos</text>
  <text x="480" y="118" class="small">• Trombosis venosa profunda</text>
  <text x="480" y="136" class="small">• Embolia pulmonar</text>
  <text x="480" y="154" class="small">• Si sale normal y el riesgo es bajo,</text>
  <text x="480" y="172" class="small">• el trombo es poco probable</text>
  <text x="456" y="220" class="step" style="fill:var(--warn)">También sube sin trombo</text>
  <text x="464" y="246" class="lab">• Embarazo y edad avanzada</text>
  <text x="464" y="270" class="lab">• Cirugía reciente o traumatismo</text>
  <text x="464" y="294" class="lab">• Infecciones e inflamación</text>
  <text x="464" y="318" class="lab">• Cáncer</text>
  <rect x="456" y="352" width="304" height="70" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="608" y="380" text-anchor="middle" class="small">Un valor alto no confirma un trombo:</text>
  <text x="608" y="400" text-anchor="middle" class="small">se necesita una prueba de imagen.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
