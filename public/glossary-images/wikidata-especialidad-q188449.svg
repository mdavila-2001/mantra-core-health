<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Neurocirugía</title>
  <desc id="d">A la izquierda, el campo de la neurocirugía: el encéfalo, la médula espinal dentro de la columna vertebral y los nervios periféricos. A la derecha, las enfermedades que atiende, como tumores, hemorragias, aneurismas, hidrocefalia, hernias de disco o traumatismos craneales, y sus herramientas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Su campo</text>
  <path d="M80.0 140.0 C70.0 80.0 130.0 50.0 180.0 60.0 C240.0 60.0 270.0 100.0 260.0 150.0 C254.0 180.0 220.0 186.0 190.0 180.0 C170 190.0 140.0 186.0 120.0 178.0 C90.0 174.0 82.0 160.0 80.0 140.0 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M120.0 90.0 q20.0 20.0 5.0 40.0 M170 70.0 q20.0 25.0 -5.0 50.0 M215.0 85.0 q-15.0 30.0 10.0 55.0" fill="none" stroke="var(--line)" stroke-width="2"/>
  <rect x="186" y="200" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="184" y="226" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="182" y="252" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="180" y="278" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="178" y="304" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="176" y="330" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="174" y="356" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="172" y="382" width="40" height="20" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <path d="M196 186 C196 260 196 330 186 410" fill="none" stroke="var(--nerve)" stroke-width="5"/>
  <text x="280" y="110" class="small">Encéfalo</text>
  <text x="250" y="280" class="small">Médula y</text>
  <text x="250" y="296" class="small">columna</text>
  <path d="M184 300 L120 340" fill="none" stroke="var(--nerve)" stroke-width="3"/>
  <text x="70" y="360" class="small">Nervios</text>
  <text x="70" y="376" class="small">periféricos</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <rect x="436" y="66" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Tumores cerebrales</text>
  <rect x="602" y="66" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hemorragias</text>
  <rect x="436" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Aneurismas</text>
  <rect x="602" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hidrocefalia</text>
  <rect x="436" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hernia de disco</text>
  <rect x="602" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Traumatismo craneal</text>
  <text x="436" y="226" class="step">Herramientas</text>
  <text x="440" y="252" class="lab">• Microscopio quirúrgico</text>
  <text x="440" y="276" class="lab">• Neuronavegación con imágenes</text>
  <text x="440" y="300" class="lab">• Endoscopia y cirugía mínima</text>
  <text x="440" y="324" class="lab">• Válvulas de derivación</text>
  <rect x="436" y="356" width="324" height="64" rx="10" fill="var(--tissue)"/>
  <text x="452" y="382" class="lab">Muchos pacientes valorados</text>
  <text x="452" y="402" class="lab">no necesitan operarse</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
