<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Evolución de la hepatitis C crónica</title>
  <desc id="d">Cuatro hígados en fila que muestran la evolución posible sin tratamiento: sano, con inflamación crónica, con fibrosis y con cirrosis nodular. Abajo, las vías de contagio por sangre y el tratamiento con antivirales orales, que puede curar la infección.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Hepatitis C crónica: del virus a la cirrosis</text>
  <rect x="20" y="60" width="760" height="240" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="90" text-anchor="middle" class="title">Evolución posible del hígado sin tratamiento</text>
  <path d="M50 160 C70 120 190 115 200 140 C206 170 170 205 120 215 C80 220 44 200 50 160 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M240 160 C260 120 380 115 390 140 C396 170 360 205 310 215 C270 220 234 200 240 160 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <circle cx="280" cy="150" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="320" cy="170" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="350" cy="145" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="300" cy="190" r="5" fill="var(--red)" stroke="none"/>
  <path d="M430 160 C450 120 570 115 580 140 C586 170 550 205 500 215 C460 220 424 200 430 160 Z" fill="var(--bone)" stroke="var(--red)" stroke-width="2"/>
  <path d="M450 150 L560 160 M460 185 L540 140 M490 205 L550 175" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M620 160 C640 120 760 115 770 140 C776 170 740 205 690 215 C650 220 614 200 620 160 Z" fill="var(--warn-l)" stroke="var(--red)" stroke-width="2"/>
  <circle cx="650" cy="160" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="680" cy="145" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="715" cy="150" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="745" cy="145" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="670" cy="190" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="705" cy="185" r="9" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text x="125" y="246" text-anchor="middle" class="lab b">Sano</text>
  <text x="125" y="264" text-anchor="middle" class="small muted"></text>
  <line x1="208" y1="170" x2="230" y2="170" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="315" y="246" text-anchor="middle" class="lab b">Inflamación</text>
  <text x="315" y="264" text-anchor="middle" class="small muted">crónica</text>
  <line x1="398" y1="170" x2="420" y2="170" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="505" y="246" text-anchor="middle" class="lab b">Fibrosis</text>
  <text x="505" y="264" text-anchor="middle" class="small muted">cicatrices</text>
  <line x1="588" y1="170" x2="610" y2="170" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="695" y="246" text-anchor="middle" class="lab b">Cirrosis</text>
  <text x="695" y="264" text-anchor="middle" class="small muted">riesgo de cáncer</text>
  <text x="400" y="290" text-anchor="middle" class="small muted">Suele avanzar en silencio durante años</text>
  <rect x="20" y="316" width="372" height="124" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="206.0" y="346" text-anchor="middle" class="title">Contagio por sangre</text>
  <text x="38" y="370" class="small">• Agujas o material compartido</text>
  <text x="38" y="392" class="small">• Tatuajes sin esterilizar</text>
  <text x="38" y="414" class="small">• Transfusiones antiguas; parto</text>
  <rect x="408" y="316" width="372" height="124" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="594.0" y="346" text-anchor="middle" class="title">Se puede curar</text>
  <text x="426" y="370" class="small">• Antivirales orales unas semanas</text>
  <text x="426" y="392" class="small">• Análisis para detectar el virus</text>
  <text x="426" y="414" class="small">• Vigilar el hígado si hubo fibrosis</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
