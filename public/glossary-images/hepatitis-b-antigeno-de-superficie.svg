<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Antígeno de superficie de la hepatitis B (HBsAg)</title>
  <desc id="d">A la izquierda, un virus de la hepatitis B con su núcleo de ADN y su envoltura cubierta por el antígeno de superficie, que es lo que detecta la prueba. A la derecha, un tubo de suero y la interpretación: positivo indica infección aguda o crónica y negativo que no se detecta el antígeno.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Qué detecta la prueba</text>
  <circle cx="200" cy="200" r="100" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="3"/>
  <circle cx="300.0" cy="200.0" r="9" fill="var(--warn)"/>
  <circle cx="292.3879532511287" cy="238.26834323650897" r="9" fill="var(--warn)"/>
  <circle cx="270.71067811865476" cy="270.71067811865476" r="9" fill="var(--warn)"/>
  <circle cx="238.268343236509" cy="292.3879532511287" r="9" fill="var(--warn)"/>
  <circle cx="200.0" cy="300.0" r="9" fill="var(--warn)"/>
  <circle cx="161.73165676349103" cy="292.3879532511287" r="9" fill="var(--warn)"/>
  <circle cx="129.28932188134524" cy="270.71067811865476" r="9" fill="var(--warn)"/>
  <circle cx="107.61204674887132" cy="238.268343236509" r="9" fill="var(--warn)"/>
  <circle cx="100.0" cy="200.0" r="9" fill="var(--warn)"/>
  <circle cx="107.61204674887132" cy="161.73165676349103" r="9" fill="var(--warn)"/>
  <circle cx="129.28932188134524" cy="129.28932188134524" r="9" fill="var(--warn)"/>
  <circle cx="161.73165676349097" cy="107.61204674887135" r="9" fill="var(--warn)"/>
  <circle cx="199.99999999999997" cy="100.0" r="9" fill="var(--warn)"/>
  <circle cx="238.268343236509" cy="107.61204674887134" r="9" fill="var(--warn)"/>
  <circle cx="270.71067811865476" cy="129.28932188134524" r="9" fill="var(--warn)"/>
  <circle cx="292.38795325112864" cy="161.73165676349095" r="9" fill="var(--warn)"/>
  <circle cx="200" cy="200" r="48" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M176 190 q12 -14 24 0 t24 0 M176 210 q12 -14 24 0 t24 0" fill="none" stroke="var(--accent)" stroke-width="2"/>
  <text x="200" y="268" text-anchor="middle" class="small">Núcleo con ADN</text>
  <text x="200" y="340" text-anchor="middle" class="lab" style="fill:var(--warn)">Envoltura del virus</text>
  <text x="200" y="362" text-anchor="middle" class="step" style="fill:var(--warn)">Antígeno de superficie (HBsAg)</text>
  <text x="200" y="396" text-anchor="middle" class="small muted">Es una parte del propio virus,</text>
  <text x="200" y="414" text-anchor="middle" class="small muted">no un anticuerpo del paciente</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Cómo se interpreta</text>
  <rect x="438" y="64" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M440 80 V144 a15 15 0 0 0 30 0 V80 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M442 110 V144 a13 13 0 0 0 26 0 V110 Z" fill="var(--vessel)"/>
  <text x="486" y="92" class="lab">Muestra de suero</text>
  <text x="486" y="114" class="small muted">Prueba de cribado habitual</text>
  <rect x="436" y="196" width="324" height="74" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="222" class="step" style="fill:var(--warn)">Positivo</text>
  <text x="452" y="246" class="lab">Hay infección por el virus: aguda</text>
  <text x="452" y="264" class="small">o crónica (se confirma con más pruebas)</text>
  <rect x="436" y="282" width="324" height="64" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="308" class="step" style="fill:var(--ok)">Negativo</text>
  <text x="452" y="330" class="lab">No se detecta el antígeno en ese momento</text>
  <text x="436" y="378" class="small">Se pide en embarazo, donantes, contactos</text>
  <text x="436" y="398" class="small">y ante hepatitis o enzimas hepáticas altas</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
