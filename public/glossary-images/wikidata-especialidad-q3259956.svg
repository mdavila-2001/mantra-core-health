<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Atención primaria</title>
  <desc id="d">A la izquierda, una pirámide de niveles de atención con la atención primaria en la base, el nivel secundario de especialistas en el medio y el terciario arriba. A la derecha, los cuatro atributos de la atención primaria, primer contacto, longitudinalidad, integralidad y coordinación, y sus otras funciones.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Niveles de atención</text>
  <path d="M220 76 L290 176 H150 Z" fill="var(--purple)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M150 184 H290 L350 270 H90 Z" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M90 278 H350 L400 380 H40 Z" fill="var(--ok)" stroke="var(--ink)" stroke-width="2"/>
  <text x="220" y="156" text-anchor="middle" class="small" style="fill:var(--on)">Terciario</text>
  <text x="220" y="234" text-anchor="middle" class="small" style="fill:var(--on)">Secundario: especialistas</text>
  <text x="220" y="324" text-anchor="middle" class="step" style="fill:var(--on)">Primario</text>
  <text x="220" y="344" text-anchor="middle" class="small" style="fill:var(--on)">centro de salud, posta</text>
  <text x="220" y="406" text-anchor="middle" class="small">La base resuelve la mayoría de los problemas</text>
  <text x="220" y="424" text-anchor="middle" class="small muted">y coordina con los otros niveles</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Sus atributos</text>
  <rect x="456" y="66" width="304" height="48" rx="10" fill="var(--tissue)"/>
  <text x="472" y="87" class="step">Primer contacto</text>
  <text x="472" y="105" class="small muted">la puerta de entrada</text>
  <rect x="456" y="124" width="304" height="48" rx="10" fill="var(--tissue)"/>
  <text x="472" y="145" class="step">Longitudinalidad</text>
  <text x="472" y="163" class="small muted">acompaña toda la vida</text>
  <rect x="456" y="182" width="304" height="48" rx="10" fill="var(--tissue)"/>
  <text x="472" y="203" class="step">Integralidad</text>
  <text x="472" y="221" class="small muted">cuerpo, mente y entorno</text>
  <rect x="456" y="240" width="304" height="48" rx="10" fill="var(--tissue)"/>
  <text x="472" y="261" class="step">Coordinación</text>
  <text x="472" y="279" class="small muted">con hospital y servicios</text>
  <text x="456" y="318" class="step">Además</text>
  <text x="460" y="344" class="lab">• Prevención y vacunas</text>
  <text x="460" y="368" class="lab">• Control de enfermedades crónicas</text>
  <text x="460" y="392" class="lab">• Salud de la comunidad (Alma-Ata)</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
