<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Causas del sangrado uterino anormal</title>
  <desc id="d">Útero con un pólipo y un mioma señalados. A la derecha, la clasificación PALM-COEIN: causas estructurales, que son pólipo, adenomiosis, leiomioma y malignidad, y causas no estructurales, que son coagulación, ovulación, endometrial, iatrogénica y no clasificada.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Sangrado uterino anormal: causas según PALM-COEIN</text>
  <rect x="20" y="60" width="300" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="170.0" y="88" text-anchor="middle" class="h">El útero</text>
  <path d="M70 140 C70 110 250 110 250 140 C250 230 210 290 185 320 L185 380 L135 380 L135 320 C110 290 70 230 70 140 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <path d="M110 150 C110 140 210 140 210 150 C210 220 180 270 165 300 L155 300 C140 270 110 220 110 150 Z" fill="var(--red-l)" stroke="var(--red)" stroke-width="2"/>
  <ellipse cx="160" cy="190" rx="12" ry="16" fill="var(--warn)" stroke="none"/>
  <circle cx="230" cy="180" r="18" fill="var(--bone)" stroke="var(--muted)"/>
  <line x1="150" y1="186" x2="60" y2="200" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="216" class="small">Pólipo</text>
  <line x1="240" y1="194" x2="270" y2="250" stroke="var(--muted)" stroke-width="1"/>
  <text x="272" y="266" text-anchor="middle" class="small">Mioma</text>
  <text x="160" y="250" text-anchor="middle" class="small">Endometrio</text>
  <text x="160" y="410" text-anchor="middle" class="small muted">Es un síntoma, no un diagnóstico</text>
  <rect x="336" y="60" width="214" height="290" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="443.0" y="88" text-anchor="middle" class="h">Estructurales</text>
  <circle cx="366" cy="116" r="16" fill="var(--warn)" stroke="none"/>
  <text x="366" y="121" text-anchor="middle" class="lab b on">P</text>
  <text x="392" y="121" class="lab">Pólipo</text>
  <circle cx="366" cy="168" r="16" fill="var(--warn)" stroke="none"/>
  <text x="366" y="173" text-anchor="middle" class="lab b on">A</text>
  <text x="392" y="173" class="lab">Adenomiosis</text>
  <circle cx="366" cy="220" r="16" fill="var(--warn)" stroke="none"/>
  <text x="366" y="225" text-anchor="middle" class="lab b on">L</text>
  <text x="392" y="225" class="lab">Leiomioma</text>
  <circle cx="366" cy="272" r="16" fill="var(--warn)" stroke="none"/>
  <text x="366" y="277" text-anchor="middle" class="lab b on">M</text>
  <text x="392" y="277" class="lab">Malignidad</text>
  <text x="443" y="330" text-anchor="middle" class="small muted">Se ven en la ecografía</text>
  <rect x="566" y="60" width="214" height="290" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="673.0" y="88" text-anchor="middle" class="h">No estructurales</text>
  <circle cx="596" cy="112" r="16" fill="var(--pur)" stroke="none"/>
  <text x="596" y="117" text-anchor="middle" class="lab b on">C</text>
  <text x="622" y="117" class="lab">Coagulación</text>
  <circle cx="596" cy="156" r="16" fill="var(--pur)" stroke="none"/>
  <text x="596" y="161" text-anchor="middle" class="lab b on">O</text>
  <text x="622" y="161" class="lab">Ovulación</text>
  <circle cx="596" cy="200" r="16" fill="var(--pur)" stroke="none"/>
  <text x="596" y="205" text-anchor="middle" class="lab b on">E</text>
  <text x="622" y="205" class="lab">Endometrial</text>
  <circle cx="596" cy="244" r="16" fill="var(--pur)" stroke="none"/>
  <text x="596" y="249" text-anchor="middle" class="lab b on">I</text>
  <text x="622" y="249" class="lab">Iatrogénica</text>
  <circle cx="596" cy="288" r="16" fill="var(--pur)" stroke="none"/>
  <text x="596" y="293" text-anchor="middle" class="lab b on">N</text>
  <text x="622" y="293" class="lab">No clasificada</text>
  <rect x="336" y="366" width="444" height="74" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="350" y="390" class="lab b" style="fill:var(--red)">Consultar pronto</text>
  <text x="350" y="414" class="small">• Sangrado abundante con mareo o desmayo, o tras la menopausia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
