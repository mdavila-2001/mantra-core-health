<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Anticuerpos antinucleares</title>
  <desc id="d">A la izquierda, una célula con su núcleo rodeado de anticuerpos en forma de Y que se unen a él por error. A la derecha, cuatro patrones de fluorescencia y las enfermedades autoinmunes hacia las que orienta la prueba.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Qué detecta la prueba</text>
  <ellipse cx="200" cy="200" rx="140" ry="110" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="200" cy="200" r="60" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <circle cx="180" cy="185" r="5" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="215" cy="210" r="5" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="195" cy="225" r="5" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <circle cx="225" cy="180" r="5" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <g transform="translate(200 140) rotate(0)"><path d="M0 0 V-18 M0 -18 L-9 -30 M0 -18 L9 -30" stroke="var(--warn)" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(262 205) rotate(90)"><path d="M0 0 V-18 M0 -18 L-9 -30 M0 -18 L9 -30" stroke="var(--warn)" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(140 205) rotate(-90)"><path d="M0 0 V-18 M0 -18 L-9 -30 M0 -18 L9 -30" stroke="var(--warn)" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <g transform="translate(200 262) rotate(180)"><path d="M0 0 V-18 M0 -18 L-9 -30 M0 -18 L9 -30" stroke="var(--warn)" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <text x="200" y="74" text-anchor="middle" class="lab" style="fill:var(--muted)">Célula</text>
  <text x="200" y="205" text-anchor="middle" class="lab" style="fill:var(--violet)">Núcleo</text>
  <text x="200" y="340" text-anchor="middle" class="small" style="fill:var(--warn)">Anticuerpos que se unen por error</text>
  <text x="200" y="358" text-anchor="middle" class="small" style="fill:var(--warn)">a componentes del núcleo</text>
  <text x="200" y="410" text-anchor="middle" class="lab">Muestra: sangre</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Patrones al microscopio</text>
  <circle cx="446" cy="100" r="30" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="446" cy="100" r="22" fill="var(--ok)" stroke="none" stroke-width="2" opacity=".7"/>
  <text x="446" y="148" text-anchor="middle" class="small">Homogéneo</text>
  <circle cx="540" cy="100" r="30" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="530" cy="92" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="546" cy="88" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="552" cy="104" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="536" cy="108" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="528" cy="106" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="542" cy="98" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="548" cy="114" r="2.5" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <text x="540" y="148" text-anchor="middle" class="small">Moteado</text>
  <circle cx="634" cy="100" r="30" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="628" cy="96" r="7" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="642" cy="106" r="7" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <text x="634" y="148" text-anchor="middle" class="small">Nucleolar</text>
  <circle cx="728" cy="100" r="30" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="716" cy="90" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="728" cy="86" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="740" cy="94" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="714" cy="106" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="734" cy="108" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="726" cy="100" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="742" cy="112" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <circle cx="722" cy="114" r="1.8" fill="var(--ok)" stroke="none" stroke-width="2"/>
  <text x="728" y="148" text-anchor="middle" class="small">Centromérico</text>
  <text x="588" y="192" text-anchor="middle" class="step">Orienta hacia enfermedades autoinmunes</text>
  <text x="424" y="222" class="lab">• Lupus eritematoso sistémico</text>
  <text x="424" y="246" class="lab">• Síndrome de Sjögren</text>
  <text x="424" y="270" class="lab">• Esclerodermia</text>
  <text x="424" y="294" class="lab">• Otras del tejido conectivo</text>
  <rect x="416" y="330" width="344" height="92" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="588" y="356" text-anchor="middle" class="small">Un resultado positivo no es un diagnóstico:</text>
  <text x="588" y="376" text-anchor="middle" class="small">aparece en algunas personas sanas.</text>
  <text x="588" y="400" text-anchor="middle" class="small">Se interpreta junto a síntomas y otras pruebas.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
