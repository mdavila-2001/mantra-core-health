<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina nuclear</title>
  <desc id="d">A la izquierda, una silueta con un radiofármaco inyectado que se concentra en un órgano y emite radiación captada por una gammacámara o un PET, que forma una imagen de la función. A la derecha, estudios y tratamientos frecuentes.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">El trazador emite desde dentro</text>
  <path d="M136.7,119.4 L136.7,128.9 C112.0,130.8 94.9,136.5 91.1,155.5 L79.7,260.0 L91.1,261.9 L104.4,174.5 L106.3,250.5 L108.2,402.5 L136.7,402.5 L150.0,274.2 L163.3,402.5 L191.8,402.5 L193.7,250.5 L195.6,174.5 L208.9,261.9 L220.3,260.0 L208.9,155.5 C205.1,136.5 188.0,130.8 163.3,128.9 L163.3,119.4 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="150" cy="96.6" r="24.7" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="150" cy="160" r="16" fill="var(--organ-d)" stroke="none" stroke-width="2" opacity=".8"/>
  <path d="M136 138 C140 132 160 132 164 138" fill="none" stroke="var(--ok)" stroke-width="0"/>
  <circle cx="150" cy="160" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="130" cy="230" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
  <circle cx="170" cy="230" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1.5"/>
  <path d="M170 160 L300 100" fill="none" stroke="var(--beam)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M170 160 L300 160" fill="none" stroke="var(--beam)" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M170 160 L300 220" fill="none" stroke="var(--beam)" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="300" y="90" width="26" height="150" rx="6" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="313" y="262" text-anchor="middle" class="small" style="fill:var(--accent)">Gammacámara</text>
  <text x="313" y="278" text-anchor="middle" class="small" style="fill:var(--accent)">o PET</text>
  <rect x="340" y="300" width="80" height="100" rx="6" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <circle cx="380" cy="350" r="22" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <circle cx="372" cy="344" r="8" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <text x="380" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Imagen de función</text>
  <text x="60" y="120" class="small" style="fill:var(--warn)">Radiofármaco</text>
  <text x="60" y="136" class="small" style="fill:var(--warn)">inyectado</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Diagnóstico y tratamiento</text>
  <text x="476" y="74" class="step">Estudios frecuentes</text>
  <text x="484" y="98" class="small">• Gammagrafía ósea</text>
  <text x="484" y="120" class="small">• Perfusión del corazón</text>
  <text x="484" y="142" class="small">• Gammagrafía de tiroides</text>
  <text x="484" y="164" class="small">• PET-TC en cáncer</text>
  <text x="484" y="186" class="small">• Función renal</text>
  <text x="476" y="224" class="step">Tratamientos</text>
  <text x="484" y="248" class="small">• Yodo radiactivo en tiroides</text>
  <text x="484" y="270" class="small">• Terapias dirigidas a tumores</text>
  <rect x="476" y="298" width="284" height="124" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="324" class="step">Muestra cómo funciona</text>
  <text x="492" y="346" class="small">un órgano, no solo su forma.</text>
  <text x="492" y="368" class="small">Dosis de radiación controlada;</text>
  <text x="492" y="388" class="small">avisar si hay embarazo o lactancia.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
