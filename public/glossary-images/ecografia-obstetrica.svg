<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ecografía obstétrica</title>
  <desc id="d">Abdomen de una embarazada con un transductor que emite ultrasonidos hacia el útero, donde se ve el feto. A la derecha, qué evalúa la ecografía en el primer, segundo y tercer trimestre.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Cómo se obtiene la imagen</text>
<path d="M40,380 Q40,170 220,150 Q380,170 400,380" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="220" cy="290" rx="110" ry="80" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<ellipse cx="220" cy="290" rx="90" ry="62" fill="var(--accent-l)" stroke="none" stroke-width="1"/>
<circle cx="192.0" cy="269.8" r="28.0" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5"/>
<ellipse cx="236.8" cy="309.0" rx="39.2" ry="28.0" fill="var(--skin)" stroke="var(--muted)" stroke-width="1.5" transform="rotate(30 236.8 309.0)"/>
<rect x="200" y="100" width="40" height="56" rx="8" fill="var(--accent)" stroke-width="1" transform="rotate(-10 220 128)"/>
<rect x="212" y="60" width="16" height="44" rx="4" fill="var(--muted)" stroke-width="1"/>
<path d="M196.0,180.0 Q220,200 244.0,180.0" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<path d="M182.8,196.5 Q220,222 257.2,196.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<path d="M169.6,213.0 Q220,244 270.4,213.0" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<text x="250" y="86" class="small">Transductor con gel</text>
<text x="64" y="380" class="small">Útero</text>
<text x="220" y="400" text-anchor="middle" class="lab" style="fill:var(--ok)">Ultrasonido: sin radiación</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Qué evalúa según el trimestre</text>
<rect x="456" y="60" width="304" height="84" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="472" y="86" class="step">1.º trimestre</text>
<text x="472" y="110" class="lab">Confirma embarazo y latido,</text>
<text x="472" y="130" class="lab">calcula la edad gestacional</text>
<rect x="456" y="156" width="304" height="84" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="472" y="182" class="step">2.º trimestre</text>
<text x="472" y="206" class="lab">Revisa la anatomía fetal</text>
<text x="472" y="226" class="lab">y la placenta</text>
<rect x="456" y="252" width="304" height="84" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="472" y="278" class="step">3.º trimestre</text>
<text x="472" y="302" class="lab">Crecimiento, posición</text>
<text x="472" y="322" class="lab">y líquido amniótico</text>
<text x="456" y="370" class="small" style="fill:var(--muted)">Al inicio puede hacerse por vía</text>
<text x="456" y="388" class="small" style="fill:var(--muted)">vaginal para ver mejor.</text>
<text x="456" y="416" class="lab">No duele y es segura para el bebé.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
