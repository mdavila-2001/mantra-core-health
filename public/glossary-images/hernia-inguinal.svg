<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hernia inguinal</title>
  <desc id="d">A la izquierda, la parte baja del abdomen con el ombligo, los conductos inguinales y un bulto en la ingle. A la derecha, un corte de la pared abdominal por cuyo punto débil sale un asa de intestino, características de la hernia y signos de que se ha atascado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dónde aparece</text>
  <path d="M90 70 H310 L330 250 C300 320 260 330 220 340 L200 360 L180 340 C140 330 100 320 70 250 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M110 230 C150 270 170 290 192 330 M290 230 C250 270 230 290 208 330" fill="none" stroke="var(--line)" stroke-width="3"/>
  <ellipse cx="140" cy="280" rx="26" ry="20" fill="var(--organ)" stroke="var(--warn)" stroke-width="2"/>
  <path d="M112 230 L150 262" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="200" cy="160" r="6" fill="var(--line)"/>
  <text x="200" y="186" text-anchor="middle" class="small muted">Ombligo</text>
  <text x="60" y="380" class="step" style="fill:var(--warn)">Bulto en la ingle</text>
  <path d="M120 366 L134 302" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="240" y="404" text-anchor="middle" class="small">Conducto inguinal</text>
  <path d="M250 392 L262 260" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Cómo se forma</text>
  <rect x="436" y="74" width="324" height="120" rx="10" fill="var(--tissue)"/>
  <path d="M450 100 H746 M450 116 H560 M640 116 H746" fill="none" stroke="var(--vessel)" stroke-width="6" opacity=".6"/>
  <path d="M560 116 C560 170 640 170 640 116" fill="var(--organ)" stroke="var(--warn)" stroke-width="2"/>
  <text x="452" y="92" class="small muted">Pared abdominal</text>
  <text x="600" y="142" text-anchor="middle" class="small">Intestino</text>
  <text x="600" y="186" text-anchor="middle" class="small muted">Sale por un punto débil</text>
  <text x="440" y="230" class="lab">• Más en varones; empeora al hacer fuerza</text>
  <text x="440" y="256" class="lab">• Se reduce a veces al acostarse</text>
  <text x="440" y="282" class="lab">• El tratamiento habitual es cirugía</text>
  <rect x="436" y="320" width="324" height="100" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="344" class="step" style="fill:var(--warn)">Urgente si el bulto</text>
  <text x="456" y="370" class="small">• Duele mucho y no vuelve a entrar</text>
  <text x="456" y="392" class="small">• Se pone duro, rojo, con vómitos</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
