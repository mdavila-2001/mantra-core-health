<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cardiología</title>
  <desc id="d">A la izquierda, un corazón con las arterias coronarias, el músculo cardíaco, el ritmo eléctrico y las válvulas señalados como campos de la especialidad. A la derecha, las enfermedades que atiende, las pruebas habituales y los síntomas que requieren urgencias.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">El campo de la cardiología</text>
  <path d="M220 120 C180 80 110 90 110 160 C110 230 190 280 220 320 C250 280 330 230 330 160 C330 90 260 80 220 120 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M150 140 C170 180 180 220 210 270" fill="none" stroke="var(--vessel)" stroke-width="4"/>
  <path d="M290 150 C270 190 250 220 230 260" fill="none" stroke="var(--vessel)" stroke-width="4"/>
  <path d="M150 210 h30 l8 -16 l8 30 l8 -20 l6 6 h60" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="70" y="90" class="small" style="fill:var(--vessel)">Arterias</text>
  <text x="70" y="106" class="small" style="fill:var(--vessel)">coronarias</text>
  <line x1="110" y1="112" x2="150" y2="140" stroke="var(--vessel)" stroke-width="1"/>
  <text x="370" y="90" text-anchor="end" class="small">Músculo</text>
  <text x="370" y="106" text-anchor="end" class="small">cardíaco</text>
  <line x1="330" y1="112" x2="300" y2="130" stroke="var(--muted)" stroke-width="1"/>
  <text x="70" y="250" class="small">Ritmo</text>
  <text x="70" y="266" class="small">eléctrico</text>
  <line x1="110" y1="244" x2="150" y2="214" stroke="var(--muted)" stroke-width="1"/>
  <text x="370" y="280" text-anchor="end" class="small">Válvulas</text>
  <text x="370" y="296" text-anchor="end" class="small">y pericardio</text>
  <text x="220" y="360" text-anchor="middle" class="lab">Corazón y vasos sanguíneos</text>
  <text x="220" y="384" text-anchor="middle" class="small" style="fill:var(--muted)">prevención, diagnóstico y tratamiento</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Qué atiende y cómo</text>
  <text x="456" y="80" class="small">• Hipertensión y colesterol</text>
  <text x="456" y="102" class="small">• Infarto y angina</text>
  <text x="456" y="124" class="small">• Insuficiencia cardíaca</text>
  <text x="456" y="146" class="small">• Arritmias y palpitaciones</text>
  <text x="456" y="168" class="small">• Enfermedades de las válvulas</text>
  <text x="456" y="210" class="step">Pruebas habituales</text>
  <rect x="456" y="224" width="96" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="504.0" y="247.0" text-anchor="middle" class="small">ECG</text>
  <rect x="558" y="224" width="96" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="606.0" y="247.0" text-anchor="middle" class="small">Ecocardio</text>
  <rect x="660" y="224" width="96" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="708.0" y="247.0" text-anchor="middle" class="small">Holter</text>
  <rect x="456" y="268" width="96" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="504.0" y="291.0" text-anchor="middle" class="small">Esfuerzo</text>
  <rect x="558" y="268" width="96" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="606.0" y="291.0" text-anchor="middle" class="small">Cateterismo</text>
  <rect x="456" y="330" width="304" height="92" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="472" y="356" class="step" style="fill:var(--warn)">Urgencias si hay</text>
  <text x="472" y="380" class="small">Dolor u opresión en el pecho, falta</text>
  <text x="472" y="400" class="small">de aire brusca o desmayo</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
