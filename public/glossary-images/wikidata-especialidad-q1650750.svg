<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo trabaja la neuropatología</title>
  <desc id="d">Cinco pasos del trabajo del neuropatólogo: obtención de la muestra de cerebro, nervio o músculo, procesado en cortes finos con tinciones, examen al microscopio, estudio molecular de genes y proteínas, e informe con un diagnóstico integrado. Abajo, lo que estudia y con quién trabaja.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Neuropatología: diagnóstico a partir del tejido nervioso</text>
  <rect x="20" y="60" width="760" height="230" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="88" text-anchor="middle" class="title">Del tejido al diagnóstico</text>
  <rect x="36" y="104" width="130" height="160" rx="12" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="101" y="128" text-anchor="middle" class="lab b">Muestra</text>
  <text x="101" y="228" text-anchor="middle" class="small">Biopsia de cerebro,</text>
  <text x="101" y="246" text-anchor="middle" class="small">nervio o músculo</text>
  <line x1="168" y1="184" x2="184" y2="184" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="186" y="104" width="130" height="160" rx="12" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="251" y="128" text-anchor="middle" class="lab b">Procesado</text>
  <text x="251" y="228" text-anchor="middle" class="small">Cortes finos</text>
  <text x="251" y="246" text-anchor="middle" class="small">y tinciones</text>
  <line x1="318" y1="184" x2="334" y2="184" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="336" y="104" width="130" height="160" rx="12" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="401" y="128" text-anchor="middle" class="lab b">Microscopio</text>
  <text x="401" y="228" text-anchor="middle" class="small">Células y</text>
  <text x="401" y="246" text-anchor="middle" class="small">estructura</text>
  <line x1="468" y1="184" x2="484" y2="184" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="486" y="104" width="130" height="160" rx="12" fill="var(--pur-l)" stroke="var(--pur)"/>
  <text x="551" y="128" text-anchor="middle" class="lab b">Molecular</text>
  <text x="551" y="228" text-anchor="middle" class="small">Genes y</text>
  <text x="551" y="246" text-anchor="middle" class="small">proteínas</text>
  <line x1="618" y1="184" x2="634" y2="184" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="636" y="104" width="130" height="160" rx="12" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="701" y="128" text-anchor="middle" class="lab b">Informe</text>
  <text x="701" y="228" text-anchor="middle" class="small">Diagnóstico</text>
  <text x="701" y="246" text-anchor="middle" class="small">integrado</text>
  <rect x="80" y="160" width="40" height="40" rx="6" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="100" cy="184" rx="12" ry="9" fill="var(--organ)" stroke="none"/>
  <rect x="216" y="160" width="34" height="44" rx="2" fill="var(--panel)" stroke="var(--muted)"/>
  <ellipse cx="233" cy="182" rx="10" ry="14" fill="var(--pur)" stroke="none" opacity=".6"/>
  <circle cx="401" cy="180" r="24" fill="var(--panel)" stroke="var(--accent)" stroke-width="3"/>
  <path d="M418 196 L436 214" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <path d="M540 150 C560 160 540 175 560 185 C580 195 560 205 566 210 M560 150 C540 160 560 175 540 185 C520 195 540 205 534 210" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <rect x="686" y="156" width="40" height="52" rx="4" fill="var(--panel)" stroke="var(--muted)"/>
  <path d="M694 170 h24 M694 182 h24 M694 194 h16" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <rect x="20" y="306" width="372" height="134" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="206.0" y="334" text-anchor="middle" class="h">Qué estudia</text>
  <text x="38" y="352" class="small">• Tumores cerebrales</text>
  <text x="38" y="376" class="small">• Demencias y Parkinson</text>
  <text x="38" y="400" class="small">• Enfermedades de nervio y músculo</text>
  <rect x="408" y="306" width="372" height="134" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="594.0" y="334" text-anchor="middle" class="h">Con quién trabaja</text>
  <text x="426" y="352" class="small">• Neurocirugía y neurología</text>
  <text x="426" y="376" class="small">• Oncología y radiología</text>
  <text x="426" y="400" class="small">• Autopsias y bancos de cerebros</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
