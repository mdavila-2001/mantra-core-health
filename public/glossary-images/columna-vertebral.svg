<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Columna vertebral en vista lateral: regiones y curvaturas</title>
  <desc id="d">Esquema lateral de la columna vertebral con la parte anterior hacia la derecha. Se distinguen siete vértebras cervicales, doce torácicas, cinco lumbares, el sacro y el cóccix, y las cuatro curvaturas fisiológicas: lordosis cervical, cifosis torácica, lordosis lumbar y cifosis sacra.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --disc:#9fc3e0; --c:#e4cba0; --cs:#b68a3c; --t:#c9d9b4; --ts:#6c8f44; --l:#efc3a6; --ls:#c0693a; --s:#cdbfe3; --ss:#7a5ca8; --o:#d7d7d7; --os:#7d7d7d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --disc:#4e7a9e; --c:#8a7448; --cs:#d9b66c; --t:#5b7345; --ts:#a9cd84; --l:#9c6a4d; --ls:#f0a27a; --s:#6d5c8e; --ss:#c6b0ec; --o:#686868; --os:#bdbdbd; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .title { font-size: 18px; font-weight: 700; }
    .sm { font-size: 12.5px; fill: var(--muted); }
    .reg { font-size: 15px; font-weight: 700; }
    .cv { font-size: 14px; font-weight: 700; }
    .cb { fill: var(--c); stroke: var(--cs); stroke-width: 1.2; } .cp { fill: var(--c); stroke: var(--cs); stroke-width: 1; }
    .tb { fill: var(--t); stroke: var(--ts); stroke-width: 1.2; } .tp { fill: var(--t); stroke: var(--ts); stroke-width: 1; }
    .lb { fill: var(--l); stroke: var(--ls); stroke-width: 1.2; } .lp { fill: var(--l); stroke: var(--ls); stroke-width: 1; }
    .sb { fill: var(--s); stroke: var(--ss); stroke-width: 1.4; stroke-linejoin: round; }
    .cob { fill: var(--o); stroke: var(--os); stroke-width: 1; }
    .fm { fill: var(--panel); stroke: var(--ss); stroke-width: 1; }
    .disc { fill: var(--disc); }
    .br { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ct { stroke: var(--cs); } .tt { stroke: var(--ts); } .lt { stroke: var(--ls); } .st { stroke: var(--ss); } .ot { stroke: var(--os); }
    .cf { fill: var(--cs); } .tf { fill: var(--ts); } .lf { fill: var(--ls); } .sf { fill: var(--ss); } .of { fill: var(--os); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
