<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo actúa la amoxicilina</title>
  <desc id="d">Tres paneles. En el primero, una bacteria con su pared celular entera. En el segundo, la amoxicilina bloquea las enzimas que construyen la pared, que queda con huecos, y la bacteria se rompe. En el tercero, un virus sobre el que el antibiótico no tiene efecto. Abajo, recordatorios de uso responsable: solo con receta, seguir la duración indicada y no compartir ni guardar restos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --bact:#9fd3a8; --wall:#1f8a5b; --drug:#d9822b; --virus:#a98ad8; --warn:#c0392b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --bact:#2f5c3c; --wall:#4cc38a; --drug:#e8a560; --virus:#7a5fa8; --warn:#ef7467; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="42" text-anchor="middle" class="title">Actúa sobre la pared de las bacterias</text>

  <!-- 1 -->
  <rect x="20" y="60" width="240" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="140" y="88" text-anchor="middle" class="step">1 · Bacteria intacta</text>
  <rect x="60" y="130" width="160" height="80" rx="40" fill="var(--bact)" stroke="var(--wall)" stroke-width="6"/>
  <text x="140" y="240" text-anchor="middle" class="lab">Pared celular completa</text>
  <text x="140" y="260" text-anchor="middle" class="small muted">las enzimas la construyen</text>

  <!-- 2 -->
  <rect x="280" y="60" width="240" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="88" text-anchor="middle" class="step">2 · Con amoxicilina</text>
  <rect x="320" y="130" width="160" height="80" rx="40" fill="var(--bact)" stroke="var(--wall)" stroke-width="6" stroke-dasharray="26 12"/>
  <circle cx="356" cy="124" r="7" fill="var(--drug)"/>
  <circle cx="420" cy="122" r="7" fill="var(--drug)"/>
  <circle cx="470" cy="150" r="7" fill="var(--drug)"/>
  <circle cx="380" cy="216" r="7" fill="var(--drug)"/>
  <path d="M488 180 l14 -6 M488 190 l16 4 M484 200 l12 10" stroke="var(--bact)" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="240" text-anchor="middle" class="lab">La pared queda con huecos</text>
  <text x="400" y="260" text-anchor="middle" class="small muted">y la bacteria se rompe</text>
  <circle cx="314" cy="282" r="6" fill="var(--drug)"/>
  <text x="326" y="286" class="small">amoxicilina</text>

  <!-- 3 -->
  <rect x="540" y="60" width="240" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="660" y="88" text-anchor="middle" class="step">3 · Virus</text>
  <circle cx="660" cy="170" r="36" fill="var(--virus)"/>
  <g stroke="var(--virus)" stroke-width="4" stroke-linecap="round">
    <line x1="660" y1="126" x2="660" y2="114"/><line x1="660" y1="214" x2="660" y2="226"/>
    <line x1="616" y1="170" x2="604" y2="170"/><line x1="704" y1="170" x2="716" y2="170"/>
    <line x1="629" y1="139" x2="620" y2="130"/><line x1="691" y1="201" x2="700" y2="210"/>
    <line x1="691" y1="139" x2="700" y2="130"/><line x1="629" y1="201" x2="620" y2="210"/>
  </g>
  <line x1="600" y1="110" x2="720" y2="230" stroke="var(--warn)" stroke-width="5"/>
  <text x="660" y="250" text-anchor="middle" class="lab">No actúa sobre virus</text>
  <text x="660" y="270" text-anchor="middle" class="small muted">resfriado, gripe, la mayoría</text>
  <text x="660" y="286" text-anchor="middle" class="small muted">de las faringitis</text>

  <!-- Uso responsable -->
  <rect x="20" y="326" width="760" height="110" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="40" y="354" class="step">Uso responsable</text>
  <text x="40" y="380" class="lab">• Solo con receta y para quien se recetó</text>
  <text x="40" y="404" class="lab">• Seguir la cantidad, los horarios y la duración indicados</text>
  <text x="420" y="380" class="lab">• No compartir ni guardar restos</text>
  <text x="420" y="404" class="lab">• Avisar de alergias a penicilinas</text>
  <text x="40" y="426" class="small muted">El mal uso favorece bacterias resistentes.</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
