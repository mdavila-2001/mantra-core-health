<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mononucleosis infecciosa</title>
  <desc id="d">A la izquierda, una figura con la garganta inflamada, ganglios del cuello aumentados y el bazo agrandado, causados por el virus de Epstein-Barr que se transmite por la saliva. A la derecha, los síntomas principales de fiebre, dolor de garganta y cansancio, el diagnóstico con análisis de sangre y el aviso de evitar deportes de contacto por el riesgo para el bazo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Cómo se manifiesta</text>
  <circle cx="200" cy="140" r="70" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <rect x="170" y="206" width="60" height="60" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M120 266 Q200 250 280 266 L300 360 L100 360 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="160" cy="212" r="9" fill="var(--bad)" opacity=".7"/>
  <circle cx="240" cy="212" r="9" fill="var(--bad)" opacity=".7"/>
  <circle cx="166" cy="236" r="9" fill="var(--bad)" opacity=".7"/>
  <circle cx="234" cy="236" r="9" fill="var(--bad)" opacity=".7"/>
  <path d="M180 160 Q200 175 220 160" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <ellipse cx="200" cy="168" rx="10" ry="6" fill="var(--bad)" opacity=".6"/>
  <path d="M232 300 C260 296 270 320 252 336 C236 340 228 320 232 300 Z" fill="var(--purple)" opacity=".7"/>
  <circle cx="240" cy="212" r="3" fill="var(--ink)"/>
  <path d="M240 212 L330 200" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="204" class="lab">Ganglios</text>
  <circle cx="200" cy="168" r="3" fill="var(--ink)"/>
  <path d="M200 168 L110 96" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="106" y="100" text-anchor="end" class="lab">Garganta</text>
  <circle cx="252" cy="320" r="3" fill="var(--ink)"/>
  <path d="M252 320 L330 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="304" class="lab">Bazo grande</text>
  <text x="220" y="396" text-anchor="middle" class="small muted">Virus de Epstein-Barr, por la saliva</text>
  <text x="220" y="414" text-anchor="middle" class="small muted">(la «enfermedad del beso»)</text>
  <rect x="440" y="20" width="340" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="50" text-anchor="middle" class="title">Claves</text>
  <rect x="460" y="60" width="300" height="36" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="610.0" y="83.0" text-anchor="middle" class="lab">Fiebre</text>
  <rect x="460" y="106" width="300" height="36" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="610.0" y="129.0" text-anchor="middle" class="lab">Dolor de garganta</text>
  <rect x="460" y="152" width="300" height="36" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="610.0" y="175.0" text-anchor="middle" class="lab">Cansancio intenso</text>
  <text x="460" y="222" class="step">Diagnóstico</text>
  <text x="460" y="248" class="small">• Análisis de sangre</text>
  <text x="460" y="270" class="small">• Prueba de anticuerpos</text>
  <rect x="460" y="296" width="300" height="60" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610" y="320" text-anchor="middle" class="step">Evitar deportes de contacto</text>
  <text x="610" y="340" text-anchor="middle" class="small">varias semanas: riesgo de bazo</text>
  <text x="460" y="388" class="small">Reposo, líquidos y analgésicos.</text>
  <text x="460" y="408" class="small">El cansancio puede durar semanas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
