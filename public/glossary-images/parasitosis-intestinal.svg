<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de contagio de la parasitosis intestinal</title>
  <desc id="d">Ciclo circular de transmisión fecal-oral: los parásitos crecen en el intestino, salen como huevos o quistes en las heces, contaminan el suelo, el agua o las manos y vuelven a entrar por la boca. A la derecha, los helmintos y los protozoos, los síntomas y la prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Parasitosis intestinal: ciclo de contagio fecal-oral</text>
  <rect x="20" y="60" width="440" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="88" text-anchor="middle" class="title">Cómo se transmite</text>
  <rect x="166.0" y="114.0" width="148" height="52" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="240.0" y="137.0" text-anchor="middle" class="small b">Boca</text>
  <text x="240.0" y="154.0" text-anchor="middle" class="small muted">alimento o agua</text>
  <rect x="286.0" y="234.0" width="148" height="52" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="360.0" y="257.0" text-anchor="middle" class="small b">Intestino</text>
  <text x="360.0" y="274.0" text-anchor="middle" class="small muted">el parásito crece</text>
  <rect x="166.0" y="354.0" width="148" height="52" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="240.0" y="377.0" text-anchor="middle" class="small b">Heces</text>
  <text x="240.0" y="394.0" text-anchor="middle" class="small muted">huevos o quistes</text>
  <rect x="46.0" y="234.0" width="148" height="52" rx="10" fill="var(--warn-l)" stroke="var(--warn)"/>
  <text x="120.0" y="257.0" text-anchor="middle" class="small b">Suelo, agua, manos</text>
  <text x="120.0" y="274.0" text-anchor="middle" class="small muted">sin saneamiento</text>
  <path d="M303 158 A120 120 0 0 1 342 197" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M342 323 A120 120 0 0 1 303 362" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M177 362 A120 120 0 0 1 138 323" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M138 197 A120 120 0 0 1 177 158" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="476" y="60" width="304" height="170" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628.0" y="88" text-anchor="middle" class="h">Dos grandes grupos</text>
  <path d="M500 120 C520 100 540 140 560 120 C580 100 600 140 620 120" fill="none" stroke="var(--organ)" stroke-width="7" stroke-linecap="round"/>
  <text x="640" y="125" class="small b">Helmintos</text>
  <text x="640" y="141" class="small muted">gusanos</text>
  <circle cx="520" cy="180" r="9" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="520" cy="180" r="3" fill="var(--ok)" stroke="none"/>
  <circle cx="544" cy="190" r="9" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="544" cy="190" r="3" fill="var(--ok)" stroke="none"/>
  <circle cx="566" cy="176" r="9" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="566" cy="176" r="3" fill="var(--ok)" stroke="none"/>
  <text x="640" y="185" class="small b">Protozoos</text>
  <text x="640" y="201" class="small muted">microscópicos</text>
  <rect x="476" y="246" width="304" height="194" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628.0" y="274" text-anchor="middle" class="h">Síntomas y prevención</text>
  <text x="494" y="294" class="small">• Diarrea, dolor abdominal</text>
  <text x="494" y="320" class="small">• Picor anal nocturno</text>
  <text x="494" y="346" class="small">• Anemia y bajo crecimiento</text>
  <text x="494" y="372" class="small">• Lavado de manos</text>
  <text x="494" y="398" class="small">• Agua segura y letrinas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
