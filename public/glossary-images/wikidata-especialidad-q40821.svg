<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirugía: fases y vías de abordaje</title>
  <desc id="d">Arriba, los tres momentos de la atención quirúrgica: preoperatorio, intraoperatorio y posoperatorio. Abajo, tres abdómenes esquemáticos con cirugía abierta, laparoscópica con pequeñas incisiones y robótica.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="180" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Tres momentos de la atención quirúrgica</text>
<rect x="40" y="64" width="220" height="72" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="150.0" y="89.2" text-anchor="middle" class="small" style="fill:var(--on)">Preoperatorio</text>
<text x="150.0" y="104.2" text-anchor="middle" class="small" style="fill:var(--on)">valoración, consentimiento</text>
<text x="150.0" y="119.2" text-anchor="middle" class="small" style="fill:var(--on)">y preparación</text>
<line x1="261" y1="100.0" x2="287" y2="100.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="290" y="64" width="220" height="72" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="400.0" y="89.2" text-anchor="middle" class="small" style="fill:var(--on)">Intraoperatorio</text>
<text x="400.0" y="104.2" text-anchor="middle" class="small" style="fill:var(--on)">anestesia, técnica estéril</text>
<text x="400.0" y="119.2" text-anchor="middle" class="small" style="fill:var(--on)">y la operación</text>
<line x1="511" y1="100.0" x2="537" y2="100.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="540" y="64" width="220" height="72" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="650.0" y="89.2" text-anchor="middle" class="small" style="fill:var(--on)">Posoperatorio</text>
<text x="650.0" y="104.2" text-anchor="middle" class="small" style="fill:var(--on)">control del dolor,</text>
<text x="650.0" y="119.2" text-anchor="middle" class="small" style="fill:var(--on)">movilización y alta</text>
<text x="400" y="178" text-anchor="middle" class="small" style="fill:var(--muted)">Cirujano, anestesiólogo y enfermería trabajan como un equipo.</text>
<rect x="20" y="216" width="760" height="224" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="246" text-anchor="middle" class="title">Vías de abordaje</text>
<ellipse cx="150" cy="312" rx="70" ry="46" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<path d="M150,280 L150,344" fill="none" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="384" text-anchor="middle" class="step">Abierta</text>
<text x="150" y="404" text-anchor="middle" class="small">una incisión amplia</text>
<ellipse cx="400" cy="312" rx="70" ry="46" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="370" cy="298" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<circle cx="400" cy="326" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<circle cx="430" cy="298" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<path d="M400,326 L440,266" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="384" text-anchor="middle" class="step">Laparoscópica</text>
<text x="400" y="404" text-anchor="middle" class="small">pequeñas incisiones y cámara</text>
<ellipse cx="650" cy="312" rx="70" ry="46" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="620" cy="298" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<circle cx="650" cy="326" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<circle cx="680" cy="298" r="5" fill="var(--panel)" stroke="var(--vessel)" stroke-width="2"/>
<path d="M620,298 L600,262 M680,298 L700,262 M650,326 L650,264" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="650" y="384" text-anchor="middle" class="step">Robótica</text>
<text x="650" y="404" text-anchor="middle" class="small">brazos guiados por el cirujano</text>
<text x="400" y="428" text-anchor="middle" class="small" style="fill:var(--muted)">Menos invasiva suele significar menos dolor y recuperación más rápida.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
