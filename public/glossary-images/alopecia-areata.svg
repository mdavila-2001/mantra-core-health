<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Alopecia areata</title>
  <desc id="d">A la izquierda, una cabeza vista desde arriba con dos placas redondas sin pelo. A la derecha, comparación de un folículo sano con pelo en crecimiento y un folículo rodeado de linfocitos que lo atacan y hacen caer el pelo; un recuadro aclara que no deja cicatriz y el pelo puede volver a crecer.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Placas sin pelo</text>
  <ellipse cx="200" cy="230" rx="120" ry="140" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M82 210 C80 110 140 86 200 86 C260 86 320 110 318 210 C300 170 270 150 200 150 C130 150 100 170 82 210 Z" fill="var(--ink)" opacity=".8"/>
  <ellipse cx="160" cy="122" rx="26" ry="16" fill="var(--skin)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="258" cy="134" rx="16" ry="11" fill="var(--skin)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="200" y="400" text-anchor="middle" class="lab">Placas redondas u ovaladas, piel lisa</text>
  <text x="200" y="420" text-anchor="middle" class="small muted">Puede afectar barba o cejas</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Qué ocurre en el folículo</text>
  <path d="M450 110 H550" fill="none" stroke="var(--skin)" stroke-width="10"/>
  <path d="M482 115 C480 180 476 220 474 250 C474 280 526 280 526 250 C524 220 520 180 518 115" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="500" cy="252" rx="16" ry="14" fill="var(--organ)"/>
  <path d="M500 250 V70" fill="none" stroke="var(--ink)" stroke-width="4"/>
  <text x="500" y="324" text-anchor="middle" class="step">Folículo sano</text>
  <text x="500" y="344" text-anchor="middle" class="small muted">pelo en crecimiento</text>
  <path d="M630 110 H730" fill="none" stroke="var(--skin)" stroke-width="10"/>
  <path d="M662 115 C660 180 656 220 654 250 C654 280 706 280 706 250 C704 220 700 180 698 115" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="680" cy="252" rx="16" ry="14" fill="var(--organ)"/>
  <path d="M680 250 V200" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="636" cy="240" r="8" fill="var(--purple)"/>
  <circle cx="720" cy="230" r="8" fill="var(--purple)"/>
  <circle cx="640" cy="280" r="8" fill="var(--purple)"/>
  <circle cx="724" cy="276" r="8" fill="var(--purple)"/>
  <circle cx="680" cy="300" r="8" fill="var(--purple)"/>
  <text x="680" y="324" text-anchor="middle" class="step">Folículo atacado</text>
  <text x="680" y="344" text-anchor="middle" class="small muted">el pelo se cae</text>
  <text x="746" y="300" text-anchor="end" class="small" style="fill:var(--purple)">Linfocitos</text>
  <rect x="416" y="366" width="344" height="58" rx="10" fill="var(--ok-l)"/>
  <text x="588" y="390" text-anchor="middle" class="lab">No deja cicatriz: el folículo se conserva</text>
  <text x="588" y="410" text-anchor="middle" class="lab">y el pelo puede volver a crecer</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
