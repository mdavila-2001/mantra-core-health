<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Diarrea y deshidratación</title>
  <desc id="d">A la izquierda, un esquema del intestino: normalmente absorbe el agua del contenido intestinal; en la diarrea absorbe menos o segrega más y las heces salen líquidas. A la derecha, los signos de deshidratación y las medidas para reponer líquidos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220" y="50" text-anchor="middle" class="title">Qué pasa en el intestino</text>
  <text x="120" y="82" text-anchor="middle" class="step">Normal</text>
  <rect x="80" y="95" width="80" height="250" rx="40" fill="var(--tissue)" stroke="var(--organ)" stroke-width="3"/>
  <path d="M60 140 h20 M60 190 h20 M60 240 h20 M60 290 h20" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="56,134 46,140 56,146" fill="var(--accent)"/>
  <polygon points="56,184 46,190 56,196" fill="var(--accent)"/>
  <polygon points="56,234 46,240 56,246" fill="var(--accent)"/>
  <polygon points="56,284 46,290 56,296" fill="var(--accent)"/>
  <text x="120" y="370" text-anchor="middle" class="lab">El agua se absorbe</text>
  <text x="120" y="388" text-anchor="middle" class="small muted">Heces formadas</text>
  <ellipse cx="120" cy="320" rx="18" ry="11" fill="var(--warn)"/>
  <text x="320" y="82" text-anchor="middle" class="step">Diarrea</text>
  <rect x="280" y="95" width="80" height="250" rx="40" fill="var(--accent-l)" stroke="var(--organ)" stroke-width="3"/>
  <path d="M380 140 h-20 M380 190 h-20 M380 240 h-20 M380 290 h-20" stroke="var(--accent)" stroke-width="3"/>
  <polygon points="364,134 354,140 364,146" fill="var(--accent)"/>
  <polygon points="364,184 354,190 364,196" fill="var(--accent)"/>
  <polygon points="364,234 354,240 364,246" fill="var(--accent)"/>
  <polygon points="364,284 354,290 364,296" fill="var(--accent)"/>
  <path d="M300 300 q20 20 40 0 q-10 30 -20 30 q-10 0 -20 -30" fill="var(--warn)" opacity=".7"/>
  <text x="320" y="370" text-anchor="middle" class="lab">Entra más agua al intestino</text>
  <text x="320" y="388" text-anchor="middle" class="small muted">Heces blandas o líquidas</text>
  <text x="220" y="424" text-anchor="middle" class="small muted">Con el agua se pierden también sales minerales</text>

  <rect x="436" y="20" width="344" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608" y="50" text-anchor="middle" class="title" style="fill:var(--red)">Signos de deshidratación</text>
  <text x="456" y="82" class="lab">• Mucha sed, boca y lengua secas</text>
  <text x="456" y="106" class="lab">• Orina escasa u oscura</text>
  <text x="456" y="130" class="lab">• Mareo al ponerse de pie, cansancio</text>
  <text x="456" y="154" class="lab">• En bebés: llanto sin lágrimas,</text>
  <text x="468" y="174" class="lab">pañales secos, decaimiento</text>
  <text x="456" y="202" class="small muted">Si aparecen, consulte pronto</text>

  <rect x="436" y="236" width="344" height="204" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608" y="266" text-anchor="middle" class="title" style="fill:var(--ok)">Qué ayuda</text>
  <path d="M470 290 h40 l-6 70 h-28 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M474 312 h32 l-4 46 h-24 Z" fill="var(--accent)" opacity=".6"/>
  <text x="530" y="300" class="lab">• Beber a sorbos frecuentes</text>
  <text x="530" y="324" class="lab">• Solución de rehidratación</text>
  <text x="542" y="342" class="lab">oral según el envase</text>
  <text x="530" y="366" class="lab">• Seguir comiendo ligero</text>
  <text x="530" y="390" class="lab">• Lavarse bien las manos</text>
  <text x="608" y="422" text-anchor="middle" class="small muted">Evitar refrescos y bebidas muy azucaradas</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
