  <text x="200" y="286" text-anchor="middle" class="small" style="fill:var(--warn)">Hemaglutinina</text>
  <text x="200" y="304" text-anchor="middle" class="small" style="fill:var(--accent)">y neuraminidasa en su superficie</text>
  <text x="200" y="340" text-anchor="middle" class="small">Cambia cada año: por eso la vacuna</text>
  <text x="200" y="358" text-anchor="middle" class="small">se actualiza en cada temporada</text>
  <text x="200" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Se contagia por gotas al toser</text>
  <text x="200" y="418" text-anchor="middle" class="small" style="fill:var(--muted)">o estornudar y por las manos</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Gripe frente a resfriado</text>
  <text x="530" y="78" text-anchor="middle" class="step" style="fill:var(--vessel)">Gripe</text>
  <text x="690" y="78" text-anchor="middle" class="step" style="fill:var(--accent)">Resfriado</text>
  <rect x="436" y="92" width="324" height="30" rx="6" fill="var(--tissue)" stroke="none" stroke-width="0"/>
  <text x="530" y="112" text-anchor="middle" class="small">Inicio brusco</text>
  <text x="690" y="112" text-anchor="middle" class="small">Inicio gradual</text>
  <rect x="436" y="126" width="324" height="30" rx="6" fill="var(--panel)" stroke="none" stroke-width="0"/>
  <text x="530" y="146" text-anchor="middle" class="small">Fiebre alta</text>
  <text x="690" y="146" text-anchor="middle" class="small">Fiebre rara</text>
  <rect x="436" y="160" width="324" height="30" rx="6" fill="var(--tissue)" stroke="none" stroke-width="0"/>
  <text x="530" y="180" text-anchor="middle" class="small">Dolor muscular fuerte</text>
  <text x="690" y="180" text-anchor="middle" class="small">Dolor leve</text>
  <rect x="436" y="194" width="324" height="30" rx="6" fill="var(--panel)" stroke="none" stroke-width="0"/>
  <text x="530" y="214" text-anchor="middle" class="small">Agotamiento</text>
  <text x="690" y="214" text-anchor="middle" class="small">Cansancio leve</text>
  <rect x="436" y="228" width="324" height="30" rx="6" fill="var(--tissue)" stroke="none" stroke-width="0"/>
  <text x="530" y="248" text-anchor="middle" class="small">Moco y estornudos a veces</text>
  <text x="690" y="248" text-anchor="middle" class="small">Moco y estornudos</text>
  <line x1="610" y1="92" x2="610" y2="262" stroke="var(--line)" stroke-width="1"/>
  <rect x="436" y="280" width="324" height="142" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="452" y="306" class="step" style="fill:var(--warn)">Más riesgo de complicaciones</text>
  <text x="460" y="330" class="small">• Mayores de 65 años y bebés</text>
  <text x="460" y="350" class="small">• Embarazo</text>
  <text x="460" y="370" class="small">• Enfermedades crónicas</text>
  <text x="460" y="390" class="small">• Vacunarse cada año protege</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
