<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Gripe</title>
  <desc id="d">A la izquierda, el virus de la influenza con su envoltura, las proteínas hemaglutinina y neuraminidasa en la superficie y su material genético en el interior. A la derecha, una tabla que compara la gripe con el resfriado y los grupos con más riesgo de complicaciones.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
