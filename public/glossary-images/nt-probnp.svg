<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Péptido natriurético NT-proBNP</title>
  <desc id="d">Arriba, tres pasos: muestra de sangre, medición del fragmento NT-proBNP liberado por el corazón y orientación sobre insuficiencia cardíaca. Abajo a la izquierda, un corazón con el ventrículo distendido que libera proBNP, el cual se divide en BNP activo y NT-proBNP inactivo, que pasan a la sangre. Abajo a la derecha, factores que influyen en el resultado como la edad, los riñones y la obesidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="30" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="52" cy="54" r="13" fill="var(--accent)"/>
  <text x="52" y="59" text-anchor="middle" class="step on">1</text>
  <text x="72" y="59" class="step">Muestra</text>
  <text x="46" y="84" class="small">Sangre de una vena</text>
  <text x="46" y="103" class="small">del brazo</text>
  <path d="M260 78.0 L283 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="287" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="309" cy="54" r="13" fill="var(--accent)"/>
  <text x="309" y="59" text-anchor="middle" class="step on">2</text>
  <text x="329" y="59" class="step">Se mide</text>
  <text x="303" y="84" class="small">El fragmento NT-proBNP</text>
  <text x="303" y="103" class="small">que libera el corazón</text>
  <path d="M517 78.0 L540 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="544" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="566" cy="54" r="13" fill="var(--accent)"/>
  <text x="566" y="59" text-anchor="middle" class="step on">3</text>
  <text x="586" y="59" class="step">Orienta sobre</text>
  <text x="560" y="84" class="small">Insuficiencia cardíaca</text>
  <text x="560" y="103" class="small">y su evolución</text>
  <rect x="30" y="150" width="460" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="260.0" y="180" text-anchor="middle" class="title">El corazón sometido a tensión</text>
  <path d="M190 420 C120 370 80 320 90 250 C100 190 160 180 190 225 C220 180 290 190 300 250 C310 320 260 370 190 420 Z" fill="var(--vessel)" opacity=".75"/>
  <path d="M196 300 C210 260 240 250 270 270 C280 320 250 360 210 380 Z" fill="var(--bad-l)" opacity=".8"/>
  <path d="M250 320 L300 320" stroke="var(--ink)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M220 340 L180 370" stroke="var(--ink)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="190" y="440" text-anchor="middle" class="small">Ventrículo distendido</text>
  <rect x="330" y="220" width="130" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="395.0" y="245.0" text-anchor="middle" class="lab">proBNP</text>
  <path d="M395 262 L360 300" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M395 262 L430 300" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="310" y="302" width="90" height="36" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="355.0" y="325.0" text-anchor="middle" class="small">BNP</text>
  <rect x="410" y="302" width="70" height="36" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="445" y="324" text-anchor="middle" class="small">NT-pro</text>
  <text x="400" y="370" text-anchor="middle" class="small">Ambos pasan a la sangre;</text>
  <text x="400" y="388" text-anchor="middle" class="small">se mide el fragmento</text>
  <text x="400" y="406" text-anchor="middle" class="small">inactivo, más estable</text>
  <rect x="510" y="150" width="260" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="180" text-anchor="middle" class="title">Tener en cuenta</text>
  <text x="526" y="194" class="small">• Alto: apoya insuficiencia</text>
  <text x="526" y="220" class="small">• cardíaca</text>
  <text x="526" y="246" class="small">• Normal: la hace poco</text>
  <text x="526" y="272" class="small">• probable</text>
  <text x="526" y="298" class="small">• Sube con la edad</text>
  <text x="526" y="324" class="small">• y si fallan los riñones</text>
  <text x="526" y="350" class="small">• Baja con la obesidad</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
