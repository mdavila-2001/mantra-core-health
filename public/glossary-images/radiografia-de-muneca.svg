<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Radiografía de muñeca</title>
  <desc id="d">A la izquierda, un tubo de rayos X sobre el antebrazo y la mano apoyados en el detector. A la derecha, los huesos que se ven: radio, cúbito, huesos del carpo con el escafoides resaltado y metacarpianos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Posición para la radiografía</text>
<rect x="130" y="60" width="140" height="44" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="200" y="87" text-anchor="middle" class="lab" style="fill:var(--on)">Tubo de rayos X</text>
<path d="M170,104 L230,104 L300,330 L100,330 Z" fill="var(--beam)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
<rect x="70" y="330" width="260" height="26" rx="6" fill="var(--accent)" stroke-width="1"/>
<text x="200" y="348" text-anchor="middle" class="small" style="fill:var(--on)">Detector</text>
<rect x="60" y="290" width="120" height="36" rx="16" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<path d="M180,292 L250,288 L300,282 L300,328 L250,326 L180,324 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="280" text-anchor="middle" class="small">Antebrazo</text>
<text x="290" y="272" text-anchor="middle" class="small">Mano</text>
<text x="200" y="388" text-anchor="middle" class="lab">Dos proyecciones: frente</text>
<text x="200" y="406" text-anchor="middle" class="lab">(posteroanterior) y lateral</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Qué se ve</text>
<rect x="486" y="180" width="40" height="160" rx="10" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="540" y="190" width="30" height="150" rx="10" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="484" y="150" width="24" height="22" rx="6" fill="var(--beam)" stroke="var(--muted)" stroke-width="1"/>
<rect x="512" y="146" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="540" y="150" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="566" y="156" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="494" y="124" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="522" y="120" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="550" y="124" width="24" height="22" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="496" y="60" width="14" height="56" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="524" y="60" width="14" height="56" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="552" y="60" width="14" height="56" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<rect x="580" y="60" width="14" height="56" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1"/>
<text x="506" y="360" text-anchor="middle" class="small">Radio</text>
<text x="555" y="360" text-anchor="middle" class="small">Cúbito</text>
<text x="610" y="160" class="small" style="fill:var(--warn)">Escafoides</text>
<line x1="606" y1="156" x2="508" y2="160" stroke="var(--warn)" stroke-width="1.5"/>
<text x="610" y="132" class="small">Carpo</text>
<text x="610" y="88" class="small">Metacarpianos</text>
<text x="456" y="392" class="small">Busca fracturas, luxaciones, artrosis.</text>
<text x="456" y="410" class="small">El escafoides puede requerir otra prueba.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
