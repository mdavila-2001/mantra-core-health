<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">La respuesta de estrés en el cuerpo</title>
  <desc id="d">A la izquierda, el recorrido de la respuesta de estrés: el cerebro percibe una amenaza, el hipotálamo envía la señal y las glándulas suprarrenales, sobre los riñones, liberan adrenalina y cortisol. Al centro, sus efectos: corazón más rápido, respiración acelerada, músculos tensos, más azúcar disponible y digestión en pausa. A la derecha, una gráfica que compara el estrés breve, que sube y vuelve a la calma, con el estrés crónico, que se mantiene alto.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --brain:#e7c3d0; --gland:#d9822b; --kid:#c98a7a; --hot:#c0392b; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --brain:#74505d; --gland:#e8a560; --kid:#8f5a4e; --hot:#ef7467; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 17px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <!-- Recorrido -->
  <rect x="20" y="20" width="250" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="145" y="50" text-anchor="middle" class="title">El recorrido</text>
  <path d="M85 120 C80 85 115 68 145 70 C180 70 210 90 205 122 C200 150 170 154 145 152 C115 150 88 146 85 120 Z" fill="var(--brain)"/>
  <circle cx="148" cy="130" r="9" fill="var(--accent)"/>
  <text x="145" y="176" text-anchor="middle" class="lab">Cerebro e hipotálamo</text>
  <text x="145" y="192" text-anchor="middle" class="small muted">perciben la amenaza</text>
  <path d="M145 200 V258" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="145,266 137,252 153,252" fill="var(--accent)"/>
  <path d="M95 300 C110 286 128 286 132 300 L130 304 Z" fill="var(--gland)"/>
  <path d="M158 300 C162 286 180 286 195 300 L160 304 Z" fill="var(--gland)"/>
  <ellipse cx="112" cy="340" rx="20" ry="34" fill="var(--kid)"/>
  <ellipse cx="178" cy="340" rx="20" ry="34" fill="var(--kid)"/>
  <text x="145" y="398" text-anchor="middle" class="lab">Glándulas suprarrenales</text>
  <text x="145" y="416" text-anchor="middle" class="small" style="fill:var(--gland)">adrenalina y cortisol</text>

  <!-- Efectos -->
  <rect x="284" y="20" width="232" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="50" text-anchor="middle" class="title">Lucha o huida</text>
  <text x="304" y="96" class="lab">♥  Corazón más rápido</text>
  <text x="304" y="136" class="lab">↑  Presión arterial</text>
  <text x="304" y="176" class="lab">≋  Respiración acelerada</text>
  <text x="304" y="216" class="lab">▲  Músculos tensos</text>
  <text x="304" y="256" class="lab">◆  Azúcar disponible</text>
  <text x="304" y="296" class="lab">‖  Digestión en pausa</text>
  <text x="304" y="336" class="lab">◎  Alerta y vigilancia</text>
  <text x="400" y="390" text-anchor="middle" class="small muted">Útil para un esfuerzo breve;</text>
  <text x="400" y="408" text-anchor="middle" class="small muted">dañina si no se apaga.</text>

  <!-- Gráfica -->
  <rect x="530" y="20" width="250" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="655" y="50" text-anchor="middle" class="title">Breve o crónico</text>
  <line x1="556" y1="330" x2="760" y2="330" stroke="var(--muted)" stroke-width="2"/>
  <line x1="556" y1="330" x2="556" y2="90" stroke="var(--muted)" stroke-width="2"/>
  <text x="658" y="352" text-anchor="middle" class="small muted">tiempo</text>
  <text x="548" y="210" text-anchor="middle" class="small muted" transform="rotate(-90 548 210)">activación</text>
  <path d="M560 300 C590 300 595 150 620 150 C645 150 650 300 680 300 H756" fill="none" stroke="var(--ok)" stroke-width="4"/>
  <path d="M560 290 C580 290 590 140 610 130 C640 118 660 140 680 124 C700 110 730 132 756 120" fill="none" stroke="var(--hot)" stroke-width="4" stroke-dasharray="8 5"/>
  <line x1="566" y1="380" x2="592" y2="380" stroke="var(--ok)" stroke-width="4"/>
  <text x="600" y="384" class="small">Breve: vuelve a la calma</text>
  <line x1="566" y1="408" x2="592" y2="408" stroke="var(--hot)" stroke-width="4" stroke-dasharray="8 5"/>
  <text x="600" y="412" class="small">Crónico: no se recupera</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
