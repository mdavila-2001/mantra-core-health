<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Cómo cambian las vías respiratorias en la EPOC</title>
  <desc id="d">Dos paneles. A la izquierda, vía aérea sana: paredes elásticas, luz abierta y alvéolos que se llenan y vacían como globos pequeños. A la derecha, EPOC: las vías y los alvéolos pierden elasticidad, se destruyen las paredes entre muchos alvéolos, las paredes de las vías se engrosan e inflaman y se produce más moco que puede obstruirlas. Debajo, las dos formas, enfisema y bronquitis crónica, y las causas principales: humo de tabaco y contaminación del aire.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --wall:#c0392b; --wall-l:#f6d5cf; --air:#d6e6f5; --air-s:#1f6fb2; --mucus:#d9b84a; --ok:#1f8a5b; --warn:#b7791f; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --wall:#ef7467; --wall-l:#4a2a27; --air:#1f3347; --air-s:#6aa7e8; --mucus:#b39a35; --ok:#4cc38a; --warn:#e0b25a; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 15px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">EPOC: el aire entra y sale con dificultad</text>

  <!-- panel sano -->
  <rect x="40" y="72" width="350" height="230" rx="10" fill="var(--panel)" stroke="var(--ok)" stroke-width="2"/>
  <text x="215" y="98" text-anchor="middle" class="hd" style="fill:var(--ok)">Vía aérea sana</text>
  <path d="M215 112 L 215 170" stroke="var(--air-s)" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
  <path d="M215 170 L 150 215 M215 170 L 280 215" stroke="var(--air-s)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  <circle cx="130" cy="240" r="26" fill="var(--air)" stroke="var(--air-s)" stroke-width="2"/>
  <circle cx="175" cy="255" r="24" fill="var(--air)" stroke="var(--air-s)" stroke-width="2"/>
  <circle cx="255" cy="255" r="24" fill="var(--air)" stroke="var(--air-s)" stroke-width="2"/>
  <circle cx="300" cy="240" r="26" fill="var(--air)" stroke="var(--air-s)" stroke-width="2"/>
  <text x="215" y="290" text-anchor="middle" class="small muted">Paredes elásticas · alvéolos como globos</text>

  <!-- panel EPOC -->
  <rect x="410" y="72" width="350" height="230" rx="10" fill="var(--panel)" stroke="var(--wall)" stroke-width="2"/>
  <text x="585" y="98" text-anchor="middle" class="hd" style="fill:var(--wall)">EPOC</text>
  <path d="M585 112 L 585 170" stroke="var(--wall)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <path d="M585 112 L 585 170" stroke="var(--air-s)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="585" cy="150" r="5" fill="var(--mucus)"/>
  <path d="M585 170 L 520 215 M585 170 L 650 215" stroke="var(--wall)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <circle cx="510" cy="215" r="5" fill="var(--mucus)"/>
  <circle cx="660" cy="215" r="5" fill="var(--mucus)"/>
  <ellipse cx="500" cy="248" rx="52" ry="30" fill="var(--wall-l)" stroke="var(--wall)" stroke-width="2" stroke-dasharray="5 4"/>
  <ellipse cx="670" cy="248" rx="52" ry="30" fill="var(--wall-l)" stroke="var(--wall)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="585" y="290" text-anchor="middle" class="small muted">Alvéolos dañados · paredes gruesas · moco</text>

  <!-- leyenda de cambios -->
  <text x="40" y="332" class="hd">Qué cambia</text>
  <text x="40" y="354" class="lab">· Menos elasticidad en vías y alvéolos</text>
  <text x="40" y="374" class="lab">· Se destruyen las paredes entre los alvéolos</text>
  <text x="40" y="394" class="lab">· Paredes de las vías engrosadas e inflamadas</text>
  <text x="400" y="354" class="lab">· Más moco, que puede obstruir</text>
  <text x="400" y="374" class="lab">· Dos formas: enfisema y bronquitis crónica</text>
  <text x="400" y="394" class="lab">· Causas: humo de tabaco y contaminación del aire</text>
</svg>
