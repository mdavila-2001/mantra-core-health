<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Vaginitis aguda</title>
  <desc id="d">Arriba, las tres causas más frecuentes de vaginitis: vaginosis bacteriana por cambio en las bacterias, candidiasis por un hongo y tricomoniasis por un parásito, con el tipo de flujo de cada una. Abajo, los síntomas comunes y qué hacer.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Causas más frecuentes</text>
  <rect x="40" y="66" width="226" height="156" rx="12" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="153" y="94" text-anchor="middle" class="step">Vaginosis bacteriana</text>
  <text x="153" y="116" text-anchor="middle" class="small" style="fill:var(--muted)">Cambio en las bacterias</text>
  <rect x="103" y="140" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="116" y="152" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="129" y="140" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="142" y="152" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="155" y="140" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="168" y="152" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="181" y="140" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="194" y="152" width="9" height="4" rx="2" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <text x="153" y="200" text-anchor="middle" class="small">Flujo gris, olor a pescado</text>
  <rect x="286" y="66" width="226" height="156" rx="12" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <text x="399" y="94" text-anchor="middle" class="step">Candidiasis</text>
  <text x="399" y="116" text-anchor="middle" class="small" style="fill:var(--muted)">Hongo Candida</text>
  <ellipse cx="369" cy="150" rx="8" ry="6" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <ellipse cx="389" cy="144" rx="8" ry="6" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <ellipse cx="409" cy="152" rx="8" ry="6" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <ellipse cx="429" cy="146" rx="8" ry="6" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <line x1="389" y1="150" x2="439" y2="166" stroke="var(--violet)" stroke-width="3"/>
  <text x="399" y="200" text-anchor="middle" class="small">Picor y flujo blanco espeso</text>
  <rect x="532" y="66" width="226" height="156" rx="12" fill="var(--warn-l)" stroke="none" stroke-width="2"/>
  <text x="645" y="94" text-anchor="middle" class="step">Tricomoniasis</text>
  <text x="645" y="116" text-anchor="middle" class="small" style="fill:var(--muted)">Parásito de transmisión sexual</text>
  <ellipse cx="645" cy="152" rx="18" ry="12" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <path d="M627 150 c-10 -6 -14 -10 -18 -16 M627 154 c-10 4 -14 8 -18 14" fill="none" stroke="var(--warn)" stroke-width="2"/>
  <text x="645" y="200" text-anchor="middle" class="small">Flujo verdoso y espumoso</text>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="286" text-anchor="middle" class="title">Síntomas comunes</text>
  <text x="40" y="300" class="small">• Cambio en el flujo vaginal</text>
  <text x="40" y="326" class="small">• Picor, ardor o irritación</text>
  <text x="40" y="352" class="small">• Molestias al orinar</text>
  <text x="40" y="378" class="small">• Dolor en las relaciones</text>
  <rect x="410" y="256" width="370" height="184" rx="14" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="595" y="286" text-anchor="middle" class="step" style="fill:var(--ok)">Qué hacer</text>
  <text x="430" y="314" class="small">• Consultar para identificar la causa</text>
  <text x="430" y="336" class="small">• Cada causa tiene su tratamiento</text>
  <text x="430" y="358" class="small">• Evitar duchas vaginales</text>
  <text x="430" y="380" class="small">• Tratar a la pareja si es tricomoniasis</text>
  <text x="430" y="402" class="small">• Consultar si hay fiebre o dolor pélvico</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
