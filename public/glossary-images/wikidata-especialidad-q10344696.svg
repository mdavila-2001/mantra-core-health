<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Campo de la parasitología médica</title>
  <desc id="d">Tres grandes grupos de parásitos humanos: protozoos unicelulares como la giardia, helmintos o gusanos como los áscaris, y ectoparásitos de la piel como los piojos. Abajo, los métodos de diagnóstico, desde el microscopio hasta la PCR, y lo que abarca la especialidad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Parasitología médica: parásitos que afectan al ser humano</text>
  <rect x="20" y="60" width="760" height="190" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="88" text-anchor="middle" class="title">Los tres grandes grupos</text>
  <circle cx="110" cy="150" r="26" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="104" cy="146" r="7" fill="var(--ok)" stroke="none"/>
  <path d="M136 150 q14 -8 22 4" fill="none" stroke="var(--ok)" stroke-width="2"/>
  <text x="190" y="140" class="lab b">Protozoos</text>
  <text x="190" y="158" class="small muted">unicelulares</text>
  <text x="190" y="176" class="small">ameba, giardia, malaria</text>
  <path d="M330 160 C350 130 370 180 390 150 C410 120 430 170 450 145" fill="none" stroke="var(--organ)" stroke-width="9" stroke-linecap="round"/>
  <text x="400" y="206" text-anchor="middle" class="lab b">Helmintos</text>
  <text x="400" y="224" text-anchor="middle" class="small">gusanos: áscaris, tenias</text>
  <ellipse cx="620" cy="150" rx="22" ry="14" fill="var(--ink)" stroke="none"/>
  <path d="M604 160 l-8 10 M614 163 l-3 12 M626 163 l3 12 M636 160 l8 10" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="660" y="140" class="lab b">Ectoparásitos</text>
  <text x="660" y="158" class="small muted">en la piel</text>
  <text x="660" y="176" class="small">piojos, sarna</text>
  <rect x="20" y="266" width="372" height="174" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="206.0" y="294" text-anchor="middle" class="h">Cómo se diagnostica</text>
  <circle cx="80" cy="330" r="24" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="3"/>
  <path d="M96 346 L120 370" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <text x="150" y="316" class="small">• Heces al microscopio</text>
  <text x="150" y="342" class="small">• Gota de sangre (malaria)</text>
  <text x="150" y="368" class="small">• Anticuerpos en sangre</text>
  <text x="150" y="394" class="small">• Pruebas moleculares (PCR)</text>
  <rect x="408" y="266" width="372" height="174" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="594.0" y="294" text-anchor="middle" class="h">Qué abarca</text>
  <text x="426" y="316" class="small">• Ciclos de vida y vectores</text>
  <text x="426" y="342" class="small">• Infecciones de viajeros</text>
  <text x="426" y="368" class="small">• Tratamiento antiparasitario</text>
  <text x="426" y="394" class="small">• Agua, saneamiento y prevención</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
