<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba rápida de antígeno de estreptococo</title>
  <desc id="d">Arriba, tres pasos: hisopado de la garganta, prueba rápida que detecta un antígeno del estreptococo del grupo A y resultado en minutos. Abajo a la izquierda, la faringe con las amígdalas inflamadas y el hisopo. Abajo a la derecha, dos tiras reactivas: positiva con línea de control y de prueba, y negativa solo con la línea de control.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="30" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="52" cy="54" r="13" fill="var(--accent)"/>
  <text x="52" y="59" text-anchor="middle" class="step on">1</text>
  <text x="72" y="59" class="step">Hisopado</text>
  <text x="46" y="84" class="small">Se frota la garganta</text>
  <text x="46" y="103" class="small">y las amígdalas</text>
  <path d="M260 78.0 L283 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="287" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="309" cy="54" r="13" fill="var(--accent)"/>
  <text x="309" y="59" text-anchor="middle" class="step on">2</text>
  <text x="329" y="59" class="step">Prueba rápida</text>
  <text x="303" y="84" class="small">Detecta un antígeno del</text>
  <text x="303" y="103" class="small">estreptococo del grupo A</text>
  <path d="M517 78.0 L540 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="544" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="566" cy="54" r="13" fill="var(--accent)"/>
  <text x="566" y="59" text-anchor="middle" class="step on">3</text>
  <text x="586" y="59" class="step">Resultado</text>
  <text x="560" y="84" class="small">En pocos minutos,</text>
  <text x="560" y="103" class="small">en la consulta</text>
  <rect x="30" y="150" width="360" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="180" text-anchor="middle" class="title">Toma de la muestra</text>
  <path d="M90 200 Q210 180 330 200 L330 420 L90 420 Z" fill="var(--organ)" opacity=".35" stroke="var(--line)"/>
  <path d="M150 220 Q210 260 270 220 L270 380 Q210 420 150 380 Z" fill="var(--organ)" opacity=".6"/>
  <ellipse cx="150" cy="300" rx="26" ry="40" fill="var(--organ)" stroke="var(--bad)" stroke-width="2"/>
  <ellipse cx="270" cy="300" rx="26" ry="40" fill="var(--organ)" stroke="var(--bad)" stroke-width="2"/>
  <path d="M210 206 Q204 222 210 238 Q216 222 210 206 Z" fill="var(--organ)"/>
  <path d="M370 180 L262 292" stroke="var(--muted)" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="258" cy="296" rx="9" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="150" cy="300" r="3" fill="var(--ink)"/>
  <path d="M150 300 L60 240" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="244" class="lab">Amígdala</text>
  <text x="352" y="174" text-anchor="end" class="small">Hisopo</text>
  <text x="210" y="440" text-anchor="middle" class="small muted">Faringe vista con la boca abierta</text>
  <rect x="410" y="150" width="360" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="590.0" y="180" text-anchor="middle" class="title">Lectura de la tira</text>
  <rect x="440" y="196" width="130" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="460" y="208" width="90" height="32" rx="4" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="484" y="210" width="5" height="28" fill="var(--accent)"/>
  <text x="486" y="270" text-anchor="middle" class="small muted">C</text>
  <text x="522" y="270" text-anchor="middle" class="small muted">T</text>
  <rect x="520" y="210" width="5" height="28" fill="var(--bad)"/>
  <text x="505" y="296" text-anchor="middle" class="step" style="fill:var(--bad)">Positivo</text>
  <text x="505" y="314" text-anchor="middle" class="small">Estreptococo presente</text>
  <rect x="610" y="196" width="130" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="630" y="208" width="90" height="32" rx="4" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="654" y="210" width="5" height="28" fill="var(--accent)"/>
  <text x="656" y="270" text-anchor="middle" class="small muted">C</text>
  <text x="692" y="270" text-anchor="middle" class="small muted">T</text>
  <text x="675" y="296" text-anchor="middle" class="step" style="fill:var(--ok)">Negativo</text>
  <text x="675" y="314" text-anchor="middle" class="small">No detectado</text>
  <text x="428" y="352" class="small">• C = línea de control: la prueba es válida</text>
  <text x="428" y="374" class="small">• Positivo: suele indicar faringitis bacteriana</text>
  <text x="428" y="396" class="small">• Negativo en niños: a veces se confirma</text>
  <text x="428" y="418" class="small">• con un cultivo de garganta</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
