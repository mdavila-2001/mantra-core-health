<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina familiar</title>
  <desc id="d">A la izquierda, el médico de familia en el centro conectado con la persona, la familia, la comunidad, el hospital, otros especialistas y enfermería. A la derecha, lo que hace y cuándo consultar.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Primer contacto y coordinación</text>
  <circle cx="230" cy="230" r="64" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="230" y="226" text-anchor="middle" class="step">Médico</text>
  <text x="230" y="246" text-anchor="middle" class="step">de familia</text>
  <line x1="230.0" y1="167.0" x2="230.0" y2="129.2" stroke="var(--muted)" stroke-width="2"/>
  <rect x="176" y="70" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="230.0" y="95.0" text-anchor="middle" class="small">Persona</text>
  <line x1="293.0" y1="203.0" x2="330.8" y2="186.8" stroke="var(--muted)" stroke-width="2"/>
  <rect x="316" y="150" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="370.0" y="175.0" text-anchor="middle" class="small">Familia</text>
  <line x1="293.0" y1="261.5" x2="330.8" y2="280.4" stroke="var(--muted)" stroke-width="2"/>
  <rect x="316" y="280" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="370.0" y="305.0" text-anchor="middle" class="small">Comunidad</text>
  <line x1="230.0" y1="297.5" x2="230.0" y2="338.0" stroke="var(--muted)" stroke-width="2"/>
  <rect x="176" y="360" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="230.0" y="385.0" text-anchor="middle" class="small">Hospital</text>
  <line x1="167.0" y1="261.5" x2="129.2" y2="280.4" stroke="var(--muted)" stroke-width="2"/>
  <rect x="36" y="280" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="90.0" y="305.0" text-anchor="middle" class="small">Especialistas</text>
  <line x1="167.0" y1="203.0" x2="129.2" y2="186.8" stroke="var(--muted)" stroke-width="2"/>
  <rect x="36" y="150" width="108" height="40" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="90.0" y="175.0" text-anchor="middle" class="small">Enfermería</text>
  <text x="230" y="428" text-anchor="middle" class="small" style="fill:var(--muted)">Atención continua para todas las edades</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué hace</text>
  <text x="476" y="80" class="small">• Problemas de salud frecuentes</text>
  <text x="476" y="102" class="small">• Enfermedades crónicas</text>
  <text x="476" y="124" class="small">• Vacunas y cribados</text>
  <text x="476" y="146" class="small">• Salud mental y social</text>
  <text x="476" y="168" class="small">• Cuidados en casa y al final</text>
  <text x="476" y="190" class="small">• de la vida</text>
  <rect x="476" y="228" width="284" height="194" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="492" y="254" class="step">Cuándo consultar</text>
  <text x="500" y="278" class="small">• Síntomas nuevos o que no ceden</text>
  <text x="500" y="300" class="small">• Revisiones y prevención</text>
  <text x="500" y="322" class="small">• Dudas sobre medicamentos</text>
  <text x="500" y="344" class="small">• Antes de ir a otro especialista</text>
  <text x="492" y="386" class="small" style="fill:var(--vessel)">Urgencias vitales: llamar</text>
  <text x="492" y="404" class="small" style="fill:var(--vessel)">directamente a emergencias</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
