<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mecanismo de la diabetes tipo 1</title>
  <desc id="d">Páncreas con un islote ampliado cuyas células beta son atacadas por linfocitos del propio sistema inmunitario, lo que deja al cuerpo sin insulina y hace subir la glucosa en la sangre. A la derecha, los síntomas típicos y los pilares del tratamiento con insulina.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Diabetes tipo 1: el cuerpo deja de fabricar insulina</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="90" text-anchor="middle" class="title">Ataque autoinmune al páncreas</text>
  <path d="M50 160 C80 120 180 120 260 140 C320 150 360 170 350 200 C340 230 280 220 220 220 C150 220 60 220 50 160 Z" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <text x="120" y="175" text-anchor="middle" class="lab b">Páncreas</text>
  <circle cx="250" cy="180" r="26" fill="var(--panel)" stroke="var(--warn)" stroke-width="2"/>
  <circle cx="244" cy="172" r="6" fill="var(--ok)" stroke="none" opacity=".35"/>
  <circle cx="258" cy="186" r="6" fill="var(--ok)" stroke="none" opacity=".35"/>
  <circle cx="242" cy="190" r="6" fill="var(--ok)" stroke="none" opacity=".35"/>
  <line x1="270" y1="196" x2="300" y2="250" stroke="var(--muted)" stroke-width="1"/>
  <text x="250" y="266" class="small">Islote: células beta</text>
  <circle cx="160" cy="300" r="14" fill="var(--pur-l)" stroke="var(--pur)"/>
  <circle cx="160" cy="300" r="5" fill="var(--pur)" stroke="none"/>
  <circle cx="200" cy="320" r="14" fill="var(--pur-l)" stroke="var(--pur)"/>
  <circle cx="200" cy="320" r="5" fill="var(--pur)" stroke="none"/>
  <circle cx="240" cy="300" r="14" fill="var(--pur-l)" stroke="var(--pur)"/>
  <circle cx="240" cy="300" r="5" fill="var(--pur)" stroke="none"/>
  <line x1="200" y1="300" x2="238" y2="214" stroke="var(--pur)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="200" y="350" text-anchor="middle" class="small">Linfocitos que atacan por error</text>
  <text x="200" y="366" text-anchor="middle" class="small">a las células beta</text>
  <text x="200" y="410" text-anchor="middle" class="lab b">Sin insulina, la glucosa no entra</text>
  <text x="200" y="428" text-anchor="middle" class="small">en las células y sube en la sangre</text>
  <rect x="416" y="60" width="364" height="190" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="90" text-anchor="middle" class="title">Síntomas típicos</text>
  <text x="434" y="110" class="small">• Mucha sed y mucha orina</text>
  <text x="434" y="136" class="small">• Hambre con pérdida de peso</text>
  <text x="434" y="162" class="small">• Cansancio</text>
  <text x="434" y="188" class="small">• Visión borrosa</text>
  <text x="434" y="214" class="small">• Aliento afrutado: cetoacidosis</text>
  <rect x="416" y="266" width="364" height="174" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="296" text-anchor="middle" class="title">Tratamiento</text>
  <text x="434" y="326" class="small">• Insulina de por vida</text>
  <text x="445" y="348" class="small">(inyecciones o bomba)</text>
  <text x="434" y="370" class="small">• Control de glucosa: capilar</text>
  <text x="445" y="392" class="small">o sensor continuo</text>
  <text x="434" y="414" class="small">• Educación, comida y ejercicio</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
