<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El reflejo de la tos</title>
  <desc id="d">A la izquierda, la tráquea y los bronquios con una irritación que activa receptores; una señal nerviosa llega al centro de la tos del tronco del encéfalo. A la derecha, las tres fases: inspiración, cierre de la glotis y expulsión del aire.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --warn:#c0392b; --ok:#1f8a5b; --beam:#f2c46d; --violet:#7b5ea7; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --warn:#ef7467; --ok:#4cc38a; --beam:#8a6f2f; --violet:#b39ddb; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210" y="50" text-anchor="middle" class="title">El reflejo de la tos</text>
  <ellipse cx="300" cy="96" rx="58" ry="30" fill="var(--violet)" opacity=".25" stroke="var(--violet)"/>
  <text x="300" y="92" text-anchor="middle" class="small">Centro de la tos</text>
  <text x="300" y="108" text-anchor="middle" class="small muted">(tronco del encéfalo)</text>
  <rect x="120" y="80" width="30" height="150" rx="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M135 230 C120 260 90 280 70 320" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" opacity=".55"/>
  <path d="M135 230 C150 260 180 280 200 320" fill="none" stroke="var(--accent)" stroke-width="18" stroke-linecap="round" opacity=".55"/>
  <text x="160" y="160" class="lab">Tráquea</text>
  <text x="34" y="350" class="lab">Bronquios</text>
  <circle cx="120" cy="268" r="7" fill="var(--warn)"/>
  <circle cx="186" cy="290" r="5" fill="var(--warn)"/>
  <text x="208" y="268" class="lab" style="fill:var(--warn)">Irritación: moco,</text>
  <text x="208" y="284" class="lab" style="fill:var(--warn)">humo, microbios</text>
  <path d="M200 252 C260 220 300 170 300 128" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="250" y="190" class="small muted">Señal nerviosa</text>
  <path d="M135 76 V40" stroke="var(--ok)" stroke-width="4" marker-end="url(#a)"/>
  <text x="34" y="400" class="small muted">Los receptores de la vía aérea avisan al</text>
  <text x="34" y="418" class="small muted">cerebro, que ordena expulsar el aire.</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598" y="50" text-anchor="middle" class="title">Tres fases</text>
  <rect x="436" y="74" width="324" height="100" rx="10" fill="var(--tissue)"/>
  <text x="452" y="102" class="step">1 · Inspiración</text>
  <text x="452" y="126" class="lab">Se toma aire profundamente y</text>
  <text x="452" y="146" class="lab">los pulmones se llenan.</text>
  <rect x="436" y="188" width="324" height="100" rx="10" fill="var(--tissue)"/>
  <text x="452" y="216" class="step">2 · Cierre de la glotis</text>
  <text x="452" y="240" class="lab">Los músculos del pecho y del abdomen</text>
  <text x="452" y="260" class="lab">aprietan y sube la presión.</text>
  <rect x="436" y="302" width="324" height="100" rx="10" fill="var(--tissue)"/>
  <text x="452" y="330" class="step" style="fill:var(--ok)">3 · Expulsión</text>
  <text x="452" y="354" class="lab">La glotis se abre de golpe y el aire</text>
  <text x="452" y="374" class="lab">sale rápido, arrastrando lo que irrita.</text>
</svg>
