<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hipotensión arterial</title>
  <desc id="d">A la izquierda, una persona que pasa de estar tumbada a estar de pie; la sangre baja a las piernas y llega menos riego al cerebro, lo que causa mareo, visión borrosa, debilidad o desmayo. A la derecha, causas frecuentes como la deshidratación o los fármacos, medidas como sentarse y levantarse despacio, y los motivos de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Al ponerse de pie</text>
  <circle cx="110" cy="250" r="16" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="126" y="240" width="130" height="22" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="170" y="290" text-anchor="middle" class="small">Tumbado</text>
  <path d="M220 220 L260 170" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <g transform="translate(320 80) scale(0.8)" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5">
    <circle cx="0" cy="26" r="24"/>
    <rect x="-9" y="48" width="18" height="12"/>
    <path d="M-52 62 Q0 52 52 62 L56 200 Q0 214 -56 200 Z"/>
    <path d="M-52 64 Q-70 70 -74 120 L-80 200 Q-82 210 -72 210 L-64 130 L-56 100 Z"/>
    <path d="M52 64 Q70 70 74 120 L80 200 Q82 210 72 210 L64 130 L56 100 Z"/>
    <path d="M-54 198 L-50 320 Q-48 330 -36 330 L-28 330 L-6 214 Z"/>
    <path d="M54 198 L50 320 Q48 330 36 330 L28 330 L6 214 Z"/>
  </g>
  <path d="M300 300 V330 M340 300 V330" stroke="var(--vessel)" stroke-width="10" stroke-linecap="round" opacity=".7"/>
  <path d="M354 120 L354 230" stroke="var(--vessel)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="250" y="312" text-anchor="end" class="small">La sangre baja</text>
  <text x="250" y="328" text-anchor="end" class="small">a las piernas</text>
  <circle cx="320" cy="101" r="26" fill="var(--warn)" opacity=".3"/>
  <text x="270" y="72" text-anchor="middle" class="small">Menos riego al cerebro</text>
  <text x="220" y="380" text-anchor="middle" class="step">Síntomas</text>
  <rect x="40" y="394" width="86" height="32" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="83.0" y="415.0" text-anchor="middle" class="small">Mareo</text>
  <rect x="132" y="394" width="86" height="32" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="175.0" y="415.0" text-anchor="middle" class="small">Visión borrosa</text>
  <rect x="224" y="394" width="86" height="32" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="267.0" y="415.0" text-anchor="middle" class="small">Debilidad</text>
  <rect x="316" y="394" width="86" height="32" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="359.0" y="415.0" text-anchor="middle" class="small">Desmayo</text>
  <rect x="440" y="20" width="340" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="50" text-anchor="middle" class="title">Causas y qué hacer</text>
  <text x="460" y="74" class="step">Causas frecuentes</text>
  <text x="460" y="98" class="small">• Deshidratación, calor</text>
  <text x="460" y="120" class="small">• Fármacos para la tensión</text>
  <text x="460" y="142" class="small">• Problemas del corazón</text>
  <text x="460" y="164" class="small">• Infección grave (sepsis)</text>
  <text x="460" y="186" class="small">• Hemorragia</text>
  <text x="460" y="222" class="step">Qué hacer</text>
  <rect x="460" y="236" width="146" height="38" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="533.0" y="260.0" text-anchor="middle" class="small">Sentarse o tumbarse</text>
  <rect x="614" y="236" width="146" height="38" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="687.0" y="260.0" text-anchor="middle" class="small">Elevar las piernas</text>
  <rect x="460" y="284" width="146" height="38" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="533.0" y="308.0" text-anchor="middle" class="small">Levantarse despacio</text>
  <rect x="614" y="284" width="146" height="38" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="687.0" y="308.0" text-anchor="middle" class="small">Beber líquidos</text>
  <rect x="460" y="348" width="300" height="64" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610" y="372" text-anchor="middle" class="step">Urgencia si hay desmayo,</text>
  <text x="610" y="392" text-anchor="middle" class="small">dolor de pecho o confusión</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
