<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ecografía mamaria</title>
  <desc id="d">A la izquierda, una mama esquemática con un transductor apoyado sobre la piel con gel. A la derecha, dos pantallas de ecografía: un quiste líquido, negro y de bordes lisos, y un nódulo sólido de contorno irregular, junto a los usos de la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo se hace</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué distingue</text>
<path d="M60 330 C60 230 110 150 200 150 C290 150 340 230 340 330 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="200" cy="236" r="7" fill="var(--organ)"/>
<text x="200" y="360" text-anchor="middle" class="small" style="fill:var(--muted)">Acostada, con el brazo detrás de la cabeza</text>
<rect x="236" y="160" width="60" height="26" rx="8" fill="var(--accent)" transform="rotate(30 266 173)"/>
<line x1="290" y1="150" x2="350" y2="96" stroke="var(--accent)" stroke-width="3"/>
<text x="260" y="86" class="lab">Transductor</text>
<text x="40" y="110" class="small" style="fill:var(--muted)">Gel</text>
<line x1="66" y1="108" x2="236" y2="190" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
<text x="200" y="394" text-anchor="middle" class="lab">Sin radiación; no duele.</text>
<text x="200" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Complementa a la mamografía.</text>
<rect x="416" y="70" width="160" height="140" rx="10" fill="var(--xray)"/>
<path d="M496.0 82 L560 198 L432 198 Z" fill="#3a4654"/>
<ellipse cx="496" cy="150" rx="22" ry="16" fill="var(--xray)" stroke="var(--xbone)" stroke-width="2"/>
<text x="496" y="232" text-anchor="middle" class="step" style="fill:var(--ok)">Quiste</text>
<text x="496" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">líquido, negro y liso</text>
<rect x="596" y="70" width="164" height="140" rx="10" fill="var(--xray)"/>
<path d="M678.0 82 L744 198 L612 198 Z" fill="#3a4654"/>
<path d="M660 136 l10 -8 l8 6 l12 -4 l4 12 l10 6 l-8 10 l2 12 l-14 0 l-8 8 l-8 -8 l-10 -2 l2 -12 l-8 -8 Z" fill="var(--tissue)" stroke="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" opacity=".6"/>
<text x="678" y="232" text-anchor="middle" class="step" style="fill:var(--warn)">Nódulo sólido</text>
<text x="678" y="250" text-anchor="middle" class="small" style="fill:var(--muted)">se valora su forma</text>
<text x="416" y="292" class="h">Se usa para</text>
<text x="416" y="318" class="lab">• Estudiar un bulto palpable</text>
<text x="416" y="342" class="lab">• Mamas densas</text>
<text x="416" y="366" class="lab">• Embarazo y lactancia</text>
<text x="416" y="390" class="lab">• Guiar una biopsia</text>
<text x="416" y="420" class="small" style="fill:var(--muted)">El informe usa una categoría de riesgo (BI-RADS).</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
