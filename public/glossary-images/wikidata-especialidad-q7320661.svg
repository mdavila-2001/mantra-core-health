<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Rinología: la fosa nasal</title>
  <desc id="d">Corte lateral de la fosa nasal con los cornetes superior, medio e inferior y los senos frontal y esfenoidal. A la derecha, las enfermedades que atiende la rinología y sus herramientas, como la endoscopia nasal.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">Fosa nasal vista de lado</text>
<path d="M60,320 L60,120 Q90,70 160,72 L330,90 Q380,110 386,170 L392,330 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M330,90 L330,330" fill="none" stroke="var(--organ-d)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
<ellipse cx="120" cy="118" rx="40" ry="26" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="350" cy="150" rx="28" ry="26" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<ellipse cx="200" cy="180" rx="65.0" ry="14" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<ellipse cx="200" cy="230" rx="85.0" ry="14" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<ellipse cx="200" cy="282" rx="100.0" ry="14" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<text x="120" y="72" text-anchor="middle" class="small">Seno frontal</text>
<text x="350" y="206" text-anchor="middle" class="small">Seno</text>
<text x="350" y="222" text-anchor="middle" class="small">esfenoidal</text>
<text x="200" y="184" text-anchor="middle" class="small">Cornete superior</text>
<text x="200" y="234" text-anchor="middle" class="small">Cornete medio</text>
<text x="200" y="286" text-anchor="middle" class="small">Cornete inferior</text>
<text x="220" y="366" text-anchor="middle" class="lab">El aire se calienta, humedece y filtra</text>
<text x="220" y="386" text-anchor="middle" class="lab">al pasar entre los cornetes.</text>
<text x="220" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Delante: narinas. Detrás: rinofaringe.</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
<text x="476" y="76" class="lab">• Rinitis y obstrucción nasal</text>
<text x="476" y="102" class="lab">• Sinusitis crónica</text>
<text x="476" y="128" class="lab">• Pólipos nasales</text>
<text x="476" y="154" class="lab">• Desviación del tabique</text>
<text x="476" y="180" class="lab">• Sangrado nasal (epistaxis)</text>
<text x="476" y="206" class="lab">• Pérdida del olfato</text>
<text x="476" y="232" class="lab">• Tumores nasosinusales</text>
<rect x="476" y="262" width="284" height="104" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="286" class="step">Herramientas</text>
<text x="490" y="310" class="lab">• Endoscopia nasal</text>
<text x="490" y="330" class="lab">• TAC de senos</text>
<text x="490" y="350" class="lab">• Cirugía endoscópica</text>
<text x="476" y="400" class="small" style="fill:var(--muted)">Subespecialidad de otorrinolaringología.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
