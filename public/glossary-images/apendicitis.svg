<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Localización del apéndice y recorrido típico del dolor</title>
  <desc id="d">Silueta del abdomen con el intestino grueso enmarcando el intestino delgado y el apéndice saliendo del ciego en la parte inferior derecha de la persona. Una flecha discontinua muestra cómo el dolor suele comenzar alrededor del ombligo y desplazarse hacia esa zona.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="460" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250" y="50" text-anchor="middle" class="title">Dónde está el apéndice</text>
  <path d="M120 70 C110 160 100 300 130 410 H370 C400 300 390 160 380 70 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <path d="M170 360 V170 C170 140 190 130 250 130 C310 130 330 140 330 170 V330 C330 350 320 360 300 365" fill="none" stroke="var(--organ)" stroke-width="22" stroke-linejoin="round" opacity=".8"/>
  <path d="M200 200 q30 -20 60 0 q30 20 50 0 M200 240 q30 -20 60 0 q30 20 50 0 M200 280 q30 -20 60 0 q30 20 50 0 M210 320 q30 -20 50 0 q20 20 40 0" fill="none" stroke="var(--warn)" stroke-width="9" stroke-linecap="round" opacity=".65"/>
  <path d="M168 372 C160 395 150 400 140 392" fill="none" stroke="var(--red)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="148" cy="392" r="22" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="100" y="432" class="lab" style="fill:var(--red)">Apéndice</text>
  <text x="182" y="400" class="small">Ciego</text>
  <circle cx="250" cy="250" r="6" fill="var(--ink)"/>
  <text x="262" y="254" class="small">Ombligo</text>
  <path d="M240 258 C220 300 200 330 170 365" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="166,352 164,372 180,362" fill="var(--accent)"/>
  <text x="40" y="96" class="small muted">Derecha</text>
  <text x="40" y="112" class="small muted">del paciente</text>
  <text x="460" y="96" text-anchor="end" class="small muted">Izquierda</text>

  <rect x="496" y="20" width="284" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="638" y="50" text-anchor="middle" class="title">Cómo suele evolucionar</text>
  <circle cx="522" cy="88" r="13" fill="var(--accent)"/>
  <text x="522" y="93" text-anchor="middle" class="small" style="fill:var(--on)">1</text>
  <text x="544" y="86" class="lab">Dolor vago junto al</text>
  <text x="544" y="104" class="lab">ombligo, sin apetito</text>
  <circle cx="522" cy="148" r="13" fill="var(--accent)"/>
  <text x="522" y="153" text-anchor="middle" class="small" style="fill:var(--on)">2</text>
  <text x="544" y="146" class="lab">El dolor baja a la parte</text>
  <text x="544" y="164" class="lab">inferior derecha</text>
  <circle cx="522" cy="208" r="13" fill="var(--accent)"/>
  <text x="522" y="213" text-anchor="middle" class="small" style="fill:var(--on)">3</text>
  <text x="544" y="206" class="lab">Empeora al moverse o</text>
  <text x="544" y="224" class="lab">toser; náuseas, fiebre</text>
  <rect x="512" y="256" width="252" height="120" rx="10" fill="var(--red-l)"/>
  <text x="528" y="282" class="step" style="fill:var(--ink)">Es una urgencia</text>
  <text x="528" y="306" class="lab">• Acuda a urgencias</text>
  <text x="528" y="328" class="lab">• No tome laxantes</text>
  <text x="528" y="350" class="lab">• No aplique calor ni coma</text>
  <text x="638" y="410" text-anchor="middle" class="small muted">Los síntomas pueden no ser típicos</text>
  <text x="638" y="426" text-anchor="middle" class="small muted">en niños, embarazadas y mayores</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
