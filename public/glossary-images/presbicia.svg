<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Presbicia</title>
  <desc id="d">Arriba, dos ojos que miran un texto cercano: en el ojo joven el cristalino se abomba y enfoca la luz sobre la retina, y en el ojo con presbicia el cristalino rígido deja el foco detrás de la retina. Abajo, cómo se nota y cómo se corrige.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Enfocar de cerca</text>
  <rect x="40" y="130" width="10" height="30" rx="2" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <text x="46" y="186" class="small" style="fill:var(--muted)">Texto cercano</text>
  <circle cx="260" cy="146" r="70" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <ellipse cx="216" cy="146" rx="18" ry="30" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M190 116 C180 136 180 156 190 176" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="70" y1="136.4" x2="216" y2="122" stroke="var(--beam)" stroke-width="2"/>
  <line x1="216" y1="122" x2="328" y2="146" stroke="var(--beam)" stroke-width="2"/>
  <line x1="70" y1="155.6" x2="216" y2="170" stroke="var(--beam)" stroke-width="2"/>
  <line x1="216" y1="170" x2="328" y2="146" stroke="var(--beam)" stroke-width="2"/>
  <circle cx="328" cy="146" r="5" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <line x1="328" y1="106" x2="328" y2="186" stroke="var(--organ-d)" stroke-width="3"/>
  <text x="260" y="242" text-anchor="middle" class="small">Cristalino joven: se abomba y enfoca en la retina</text>
  <rect x="420" y="130" width="10" height="30" rx="2" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <circle cx="640" cy="146" r="70" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
  <ellipse cx="596" cy="146" rx="8" ry="30" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M570 116 C560 136 560 156 570 176" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="450" y1="136.4" x2="596" y2="122" stroke="var(--beam)" stroke-width="2"/>
  <line x1="596" y1="122" x2="740" y2="146" stroke="var(--beam)" stroke-width="2"/>
  <line x1="450" y1="155.6" x2="596" y2="170" stroke="var(--beam)" stroke-width="2"/>
  <line x1="596" y1="170" x2="740" y2="146" stroke="var(--beam)" stroke-width="2"/>
  <circle cx="740" cy="146" r="5" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <line x1="708" y1="106" x2="708" y2="186" stroke="var(--organ-d)" stroke-width="3"/>
  <text x="640" y="242" text-anchor="middle" class="small">Cristalino rígido: el foco cae detrás</text>
  <text x="708" y="226" text-anchor="middle" class="small" style="fill:var(--vessel)">Imagen borrosa</text>
  <rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="316" text-anchor="middle" class="title">Cómo se nota</text>
  <text x="40" y="340" class="small">• Alejar el texto para leerlo</text>
  <text x="40" y="364" class="small">• Necesitar más luz</text>
  <text x="40" y="388" class="small">• Cansancio visual al leer</text>
  <text x="40" y="412" class="small">• Aparece hacia los 40-45 años</text>
  <rect x="410" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="316" text-anchor="middle" class="title">Cómo se corrige</text>
  <text x="430" y="340" class="small">• Gafas de lectura o multifocales</text>
  <text x="430" y="364" class="small">• Lentes de contacto</text>
  <text x="430" y="388" class="small">• Algunas cirugías en casos elegidos</text>
  <text x="430" y="412" class="small">• Es normal con la edad: no es enfermedad</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
