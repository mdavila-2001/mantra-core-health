  <rect x="436" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Obesidad</text>
  <rect x="602" y="110" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Osteoporosis</text>
  <rect x="436" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hipófisis</text>
  <rect x="602" y="154" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Suprarrenales</text>
  <rect x="436" y="198" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="219.32" text-anchor="middle" class="small" style="fill:var(--ink)">Lípidos</text>
  <rect x="602" y="198" width="158" height="34" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="219.32" text-anchor="middle" class="small" style="fill:var(--ink)">Hormonas sexuales</text>
  <text x="436" y="268" class="step">Cómo trabaja</text>
  <text x="440" y="294" class="lab">• Análisis de hormonas en sangre</text>
  <text x="440" y="318" class="lab">• Pruebas de estímulo o supresión</text>
  <text x="440" y="342" class="lab">• Ecografía y otras imágenes</text>
  <text x="440" y="366" class="lab">• Tratamientos de larga duración</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
