  <path d="M152.95999999999998 135.44 Q200 122.0 247.04000000000002 135.44 L253.76 256.4 L233.6 263.12 L233.6 402.00000000000006 L206.72 402.00000000000006 L200 278.8 L193.28 402.00000000000006 L166.4 402.00000000000006 L166.4 263.12 L146.24 256.4 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M152.95999999999998 137.68 L126.08 256.4 L139.51999999999998 258.64 L157.44 178.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M247.04000000000002 137.68 L273.92 256.4 L260.48 258.64 L242.56 178.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
