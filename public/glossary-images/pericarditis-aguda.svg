<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pericarditis aguda y su dolor característico</title>
  <desc id="d">Corazón rodeado por el pericardio inflamado, un saco de dos hojas entre las que puede acumularse líquido. A la derecha, el dolor torácico típico que mejora al inclinarse hacia delante, el tratamiento y las señales de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Pericarditis aguda: inflamación del saco que rodea el corazón</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="88" text-anchor="middle" class="h">El pericardio</text>
  <path d="M210 405 C150 360 80 300 80 230 C80 160 140 125 210 165 C280 125 340 160 340 230 C340 300 270 360 210 405 Z" fill="var(--red-l)" stroke="var(--red)" stroke-width="4"/>
  <path d="M210 375 C160 335 105 285 105 230 C105 175 155 150 210 185 C265 150 315 175 315 230 C315 285 260 335 210 375 Z" fill="var(--organ)" stroke="var(--red)" stroke-width="2"/>
  <text x="210" y="270" text-anchor="middle" class="h">Corazón</text>
  <line x1="330" y1="210" x2="350" y2="150" stroke="var(--muted)" stroke-width="1"/>
  <text x="320" y="120" text-anchor="middle" class="small b">Pericardio</text>
  <text x="320" y="136" text-anchor="middle" class="small">inflamado</text>
  <text x="210" y="428" text-anchor="middle" class="small muted">Puede acumularse líquido entre las hojas</text>
  <rect x="416" y="60" width="364" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="88" text-anchor="middle" class="h">El dolor típico</text>
  <text x="434" y="110" class="small">• En el pecho, punzante</text>
  <text x="434" y="136" class="small">• Empeora al acostarse</text>
  <text x="445" y="162" class="small">y al respirar hondo</text>
  <text x="434" y="188" class="small">• Mejora al sentarse e</text>
  <text x="445" y="214" class="small">inclinarse hacia delante</text>
  <text x="434" y="240" class="small">• A menudo tras un virus</text>
  <rect x="416" y="296" width="174" height="144" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="503.0" y="324" text-anchor="middle" class="h">Tratamiento</text>
  <text x="430" y="344" class="small">• Antiinflamatorios</text>
  <text x="430" y="366" class="small">• Colchicina</text>
  <text x="430" y="388" class="small">• Evitar deporte</text>
  <text x="441" y="410" class="small">intenso</text>
  <rect x="606" y="296" width="174" height="144" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="620" y="320" class="lab b" style="fill:var(--red)">Urgencias si</text>
  <text x="620" y="344" class="small">• Falta de aire</text>
  <text x="620" y="366" class="small">• Mareo o desmayo</text>
  <text x="620" y="388" class="small">• Fiebre alta</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
