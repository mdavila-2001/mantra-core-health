<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina física y rehabilitación</title>
  <desc id="d">A la izquierda, un ciclo de cuatro pasos centrado en la función: evaluar lo que la persona puede hacer, fijar objetivos con ella, aplicar terapias en equipo y reevaluar, con más autonomía en el centro. A la derecha, los recursos de la especialidad, como fisioterapia, terapia ocupacional, logopedia u ortesis, y ejemplos de afecciones que atiende.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Un ciclo centrado en la función</text>
  <circle cx="220" cy="230" r="100" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="M272.2687228930659 144.74754779404944 A100 100 0 0 1 304.1470984807896 175.96976941318604" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M305.2524522059506 282.2687228930659 A100 100 0 0 1 274.03023058681396 314.1470984807896" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M167.7312771069341 315.2524522059506 A100 100 0 0 1 135.85290151921035 284.03023058681396" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M134.7475477940494 177.7312771069341 A100 100 0 0 1 165.96976941318601 145.85290151921038" fill="none" stroke="var(--muted)" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="158" y="72" width="124" height="56" rx="12" fill="var(--accent)"/>
  <text x="220" y="96" text-anchor="middle" class="step" style="fill:var(--on)">Evaluar</text>
  <text x="220" y="116" text-anchor="middle" class="small" style="fill:var(--on)">qué puede hacer</text>
  <rect x="288" y="202" width="124" height="56" rx="12" fill="var(--accent)"/>
  <text x="350" y="226" text-anchor="middle" class="step" style="fill:var(--on)">Objetivos</text>
  <text x="350" y="246" text-anchor="middle" class="small" style="fill:var(--on)">con la persona</text>
  <rect x="158" y="332" width="124" height="56" rx="12" fill="var(--accent)"/>
  <text x="220" y="356" text-anchor="middle" class="step" style="fill:var(--on)">Terapias</text>
  <text x="220" y="376" text-anchor="middle" class="small" style="fill:var(--on)">equipo</text>
  <rect x="28" y="202" width="124" height="56" rx="12" fill="var(--accent)"/>
  <text x="90" y="226" text-anchor="middle" class="step" style="fill:var(--on)">Reevaluar</text>
  <text x="90" y="246" text-anchor="middle" class="small" style="fill:var(--on)">y ajustar</text>
  <text x="220" y="236" text-anchor="middle" class="small muted">Más autonomía</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Recursos</text>
  <rect x="456" y="66" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="86.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fisioterapia</text>
  <rect x="456" y="108" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="128.32" text-anchor="middle" class="small" style="fill:var(--ink)">Terapia ocupacional</text>
  <rect x="456" y="150" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="170.32" text-anchor="middle" class="small" style="fill:var(--ink)">Logopedia</text>
  <rect x="456" y="192" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="212.32" text-anchor="middle" class="small" style="fill:var(--ink)">Ortesis y prótesis</text>
  <rect x="456" y="234" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="254.32" text-anchor="middle" class="small" style="fill:var(--ink)">Ayudas técnicas</text>
  <rect x="456" y="276" width="304" height="32" rx="8" fill="var(--accent-l)"/>
  <text x="608.0" y="296.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fármacos e infiltraciones</text>
  <text x="456" y="344" class="step">Atiende, por ejemplo</text>
  <text x="460" y="370" class="small">• Ictus, lesión medular, amputación</text>
  <text x="460" y="392" class="small">• Dolor de espalda, parálisis cerebral</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
