<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Angioplastia</title>
  <desc id="d">Tres pasos de una angioplastia: una arteria estrechada por una placa, un balón que se infla dentro del vaso y comprime la placa, y un stent en forma de malla metálica que queda colocado manteniendo la arteria abierta. Debajo, cómo se accede por la muñeca o la ingle y los cuidados posteriores.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="270" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Angioplastia con balón y stent</text>
  <text x="154" y="80" text-anchor="middle" class="step">1 · Arteria estrechada</text>
  <path d="M44 110 H264 M44 210 H264" fill="none" stroke="var(--vessel)" stroke-width="8"/>
  <rect x="44" y="114" width="220" height="92" rx="0" fill="var(--organ)" opacity=".35"/>
  <path d="M104 114 C134 150 174 150 204 114 Z M104 206 C134 176 174 176 204 206 Z" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2"/>
  <text x="154" y="166" text-anchor="middle" class="small">Placa</text>
  <text x="402" y="80" text-anchor="middle" class="step">2 · Se infla el balón</text>
  <path d="M292 110 H512 M292 210 H512" fill="none" stroke="var(--vessel)" stroke-width="8"/>
  <rect x="292" y="114" width="220" height="92" rx="0" fill="var(--organ)" opacity=".35"/>
  <path d="M352 114 C382 122 422 122 452 114 Z M352 206 C382 198 422 198 452 206 Z" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2"/>
  <line x1="292" y1="160" x2="512" y2="160" stroke="var(--ink)" stroke-width="2"/>
  <rect x="356" y="128" width="92" height="64" rx="30" fill="var(--accent)" opacity=".8"/>
  <text x="402" y="165" text-anchor="middle" class="small" style="fill:var(--on)">Balón</text>
  <text x="650" y="80" text-anchor="middle" class="step">3 · Queda el stent</text>
  <path d="M540 110 H760 M540 210 H760" fill="none" stroke="var(--vessel)" stroke-width="8"/>
  <rect x="540" y="114" width="220" height="92" rx="0" fill="var(--organ)" opacity=".35"/>
  <path d="M600 114 C630 120 670 120 700 114 Z M600 206 C630 200 670 200 700 206 Z" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M604 122 L616 198 M616 122 L604 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M616 122 L628 198 M628 122 L616 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M628 122 L640 198 M640 122 L628 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M640 122 L652 198 M652 122 L640 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M652 122 L664 198 M664 122 L652 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M664 122 L676 198 M676 122 L664 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M676 122 L688 198 M688 122 L676 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M688 122 L700 198 M700 122 L688 198" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <text x="650" y="236" text-anchor="middle" class="small">Malla metálica</text>
  <text x="400" y="268" text-anchor="middle" class="small muted">Todo se hace desde dentro del vaso, guiado con rayos X</text>
  <rect x="20" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="336" text-anchor="middle" class="title">Cómo se llega</text>
  <text x="40" y="360" class="lab">• Punción en la muñeca o la ingle</text>
  <text x="40" y="384" class="lab">• Catéter fino hasta la arteria</text>
  <text x="40" y="408" class="lab">• Con anestesia local</text>
  <rect x="410" y="306" width="370" height="140" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="336" text-anchor="middle" class="title">Después</text>
  <text x="430" y="360" class="lab">• Antiagregantes para evitar trombos</text>
  <text x="430" y="384" class="lab">• Vigilar la zona de punción</text>
  <text x="430" y="408" class="lab">• Cuidar los factores de riesgo</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
