<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">De una infección a la sepsis y al choque séptico</title>
  <desc id="d">Cadena de cuatro pasos. Una infección, a menudo de pulmón, abdomen, riñón o vejiga, o una herida infectada. La respuesta extrema del cuerpo ante la infección. Disfunción de órganos: eso es la sepsis. Choque séptico: la presión baja a un nivel peligroso y varios órganos pueden fallar. Debajo, las señales de alarma: fiebre o temperatura baja con escalofríos, confusión, dificultad para respirar, piel pegajosa y sudorosa, dolor extremo, pulso rápido o débil, poca orina. Es una emergencia médica: busque atención de inmediato.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#1f6fb2; --a-l:#d6e6f5; --b:#b7791f; --b-l:#f7e4bf; --c:#c0392b; --c-l:#f6d5cf; --d:#8e2a20; --d-l:#eab7ae; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#6aa7e8; --a-l:#1f3347; --b:#e0b25a; --b-l:#4a3b1f; --c:#ef7467; --c-l:#4a2a27; --d:#ff9d90; --d-l:#5e312c; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Sepsis: la respuesta del cuerpo a una infección se descontrola</text>

  <rect x="40" y="76" width="160" height="128" rx="10" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="120" y="100" text-anchor="middle" class="hd" style="fill:var(--a)">1 · Infección</text>
  <text x="120" y="124" text-anchor="middle" class="small">Pulmón, abdomen,</text>
  <text x="120" y="140" text-anchor="middle" class="small">riñón o vejiga,</text>
  <text x="120" y="156" text-anchor="middle" class="small">o una herida</text>
  <text x="120" y="172" text-anchor="middle" class="small">infectada</text>

  <path d="M202 140 L 218 140" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="222" y="76" width="160" height="128" rx="10" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="302" y="100" text-anchor="middle" class="hd" style="fill:var(--b)">2 · Respuesta</text>
  <text x="302" y="124" text-anchor="middle" class="small">El sistema inmunitario</text>
  <text x="302" y="140" text-anchor="middle" class="small">reacciona de forma</text>
  <text x="302" y="156" text-anchor="middle" class="small">extrema ante la</text>
  <text x="302" y="172" text-anchor="middle" class="small">infección</text>

  <path d="M384 140 L 400 140" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="404" y="76" width="160" height="128" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="484" y="100" text-anchor="middle" class="hd" style="fill:var(--c)">3 · Sepsis</text>
  <text x="484" y="124" text-anchor="middle" class="small">La reacción daña los</text>
  <text x="484" y="140" text-anchor="middle" class="small">propios tejidos:</text>
  <text x="484" y="156" text-anchor="middle" class="small">disfunción de</text>
  <text x="484" y="172" text-anchor="middle" class="small">órganos</text>

  <path d="M566 140 L 582 140" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="586" y="76" width="174" height="128" rx="10" fill="var(--d-l)" stroke="var(--d)" stroke-width="2"/>
  <text x="673" y="100" text-anchor="middle" class="hd" style="fill:var(--d)">4 · Choque séptico</text>
  <text x="673" y="124" text-anchor="middle" class="small">La presión cae a un</text>
  <text x="673" y="140" text-anchor="middle" class="small">nivel peligroso y</text>
  <text x="673" y="156" text-anchor="middle" class="small">varios órganos</text>
  <text x="673" y="172" text-anchor="middle" class="small">pueden fallar</text>

  <rect x="40" y="224" width="720" height="92" rx="10" fill="var(--panel)" stroke="var(--c)" stroke-width="2"/>
  <text x="400" y="248" text-anchor="middle" class="hd" style="fill:var(--c)">Señales de alarma</text>
  <text x="400" y="270" text-anchor="middle" class="lab">Fiebre o temperatura baja con escalofríos · confusión · dificultad para respirar</text>
  <text x="400" y="290" text-anchor="middle" class="lab">Piel pegajosa y sudorosa · dolor extremo · pulso rápido o débil · poca orina</text>
  <text x="400" y="308" text-anchor="middle" class="small muted">En niños: respiración rápida, convulsiones, piel pálida, letargo</text>

  <rect x="40" y="332" width="720" height="62" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="3"/>
  <text x="400" y="360" text-anchor="middle" class="title" style="fill:var(--c)">Es una emergencia médica: busque atención de inmediato</text>
  <text x="400" y="380" text-anchor="middle" class="small">El tratamiento es más eficaz cuanto antes se empieza · consulte también si una infección no mejora</text>
</svg>
