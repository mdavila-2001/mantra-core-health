<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dismenorrea: dolor menstrual</title>
  <desc id="d">A la izquierda, el útero con el endometrio, que libera prostaglandinas que contraen el músculo uterino y producen dolor tipo cólico bajo el ombligo. A la derecha, la diferencia entre dismenorrea primaria, sin enfermedad de fondo, y secundaria, por endometriosis, miomas u otras causas, y señales para consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Por qué duele</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Tipos y cuándo consultar</text>
<path d="M120 110 C120 80 280 80 280 110 C280 170 250 220 225 250 L225 290 L175 290 L175 250 C150 220 120 170 120 110 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 116 C150 100 250 100 250 116 C250 160 230 200 212 230 L188 230 C170 200 150 160 150 116 Z" fill="var(--bad-l)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="156" text-anchor="middle" class="small">Endometrio</text>
<path d="M104 120 L84 110" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M296 120 L316 110" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M110 180 L88 190" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M290 180 L312 190" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="60" y="96" class="small" style="fill:var(--bad)">Contracciones</text>
<text x="200" y="320" text-anchor="middle" class="lab">Las prostaglandinas del endometrio</text>
<text x="200" y="340" text-anchor="middle" class="lab">contraen el útero y reducen su riego:</text>
<text x="200" y="360" text-anchor="middle" class="lab">aparece el dolor tipo cólico.</text>
<text x="200" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Dolor bajo el ombligo, que puede irradiar</text>
<text x="200" y="416" text-anchor="middle" class="small" style="fill:var(--muted)">a la espalda y los muslos.</text>
<rect x="416" y="66" width="344" height="110" rx="10" fill="var(--ok-l)"/>
<text x="432" y="92" class="h" style="fill:var(--ok)">Primaria</text>
<text x="432" y="116" class="small">Sin enfermedad de fondo; empieza</text>
<text x="432" y="134" class="small">en la adolescencia. Mejora con calor,</text>
<text x="432" y="152" class="small">ejercicio y antiinflamatorios.</text>
<rect x="416" y="188" width="344" height="110" rx="10" fill="var(--warn-l)"/>
<text x="432" y="214" class="h" style="fill:var(--warn)">Secundaria</text>
<text x="432" y="238" class="small">Por otra causa: endometriosis,</text>
<text x="432" y="256" class="small">miomas, adenomiosis o infección.</text>
<text x="432" y="274" class="small">Suele aparecer más tarde.</text>
<text x="416" y="330" class="h" style="fill:var(--bad)">Consultar si</text>
<text x="416" y="356" class="lab">• El dolor impide la vida diaria</text>
<text x="416" y="378" class="lab">• Empeora con los años</text>
<text x="416" y="400" class="lab">• Hay fiebre o sangrado anormal</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
