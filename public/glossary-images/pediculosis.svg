<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pediculosis de la cabeza (piojos)</title>
  <desc id="d">A la izquierda, un piojo adulto de la cabeza ampliado y un pelo con liendres pegadas, con la aclaración de que el piojo no salta ni vuela y se transmite por contacto directo. A la derecha, los síntomas y los pasos para detectarlo y tratarlo, con la nota de que no indica falta de higiene.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">El piojo y sus liendres</text>
  <ellipse cx="170" cy="200" rx="46" ry="80" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2" opacity=".85"/>
  <circle cx="170" cy="112" r="22" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2"/>
  <ellipse cx="170" cy="160" rx="30" ry="20" fill="var(--nerve)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M142 150 L100 136 L90 156" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M142 166 L100 168 L90 188" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M142 182 L100 200 L90 220" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M198 150 L240 136 L250 156" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M198 166 L240 168 L250 188" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M198 182 L240 200 L250 220" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M160 92 L148 70 M180 92 L192 70" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <text x="170" y="316" text-anchor="middle" class="step">Piojo adulto</text>
  <text x="170" y="336" text-anchor="middle" class="small muted">como un grano de sésamo</text>
  <line x1="320" y1="80" x2="320" y2="300" stroke="var(--ink)" stroke-width="2"/>
  <ellipse cx="320" cy="120" rx="9" ry="16" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
  <ellipse cx="320" cy="180" rx="9" ry="16" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
  <ellipse cx="320" cy="240" rx="9" ry="16" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="320" y="316" text-anchor="middle" class="step">Liendres</text>
  <text x="320" y="336" text-anchor="middle" class="small muted">pegadas al pelo</text>
  <rect x="40" y="360" width="340" height="64" rx="10" fill="var(--tissue)"/>
  <text x="210" y="386" text-anchor="middle" class="lab">No salta ni vuela: se pasa por</text>
  <text x="210" y="406" text-anchor="middle" class="lab">contacto directo cabeza con cabeza</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Detectar y tratar</text>
  <text x="436" y="76" class="step">Síntomas</text>
  <text x="440" y="102" class="lab">• Picor en el cuero cabelludo</text>
  <text x="440" y="126" class="lab">• Sobre todo detrás de orejas y nuca</text>
  <text x="436" y="170" class="step">Cómo actuar</text>
  <circle cx="449" cy="202" r="13" fill="var(--accent)"/>
  <text x="449" y="207" text-anchor="middle" class="step" style="fill:var(--on)">1</text>
  <text x="470" y="207" class="lab">Peinar el pelo húmedo con lendrera</text>
  <circle cx="449" cy="244" r="13" fill="var(--accent)"/>
  <text x="449" y="249" text-anchor="middle" class="step" style="fill:var(--on)">2</text>
  <text x="470" y="249" class="lab">Aplicar el tratamiento indicado</text>
  <circle cx="449" cy="286" r="13" fill="var(--accent)"/>
  <text x="449" y="291" text-anchor="middle" class="step" style="fill:var(--on)">3</text>
  <text x="470" y="291" class="lab">Repetir según indicación</text>
  <circle cx="449" cy="328" r="13" fill="var(--accent)"/>
  <text x="449" y="333" text-anchor="middle" class="step" style="fill:var(--on)">4</text>
  <text x="470" y="333" class="lab">Revisar a la familia</text>
  <rect x="436" y="368" width="324" height="52" rx="10" fill="var(--ok-l)"/>
  <text x="598" y="391" text-anchor="middle" class="lab">No indica falta de higiene</text>
  <text x="598" y="409" text-anchor="middle" class="small">Es muy común en edad escolar</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
