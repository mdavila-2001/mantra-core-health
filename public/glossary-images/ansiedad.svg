<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">El círculo de la ansiedad y cómo romperlo</title>
  <desc id="d">A la izquierda, un círculo con tres elementos conectados por flechas: pensamientos de amenaza, síntomas en el cuerpo y evitación, que alivia a corto plazo pero mantiene el miedo. A la derecha, estrategias que ayudan: respiración lenta, exposición gradual, cuestionar los pensamientos, ejercicio y sueño, y pedir ayuda profesional.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#e3eefa; --warm:#c0562b; --warm-l:#fbe3d6; --ok:#1f8a5b; --ok-l:#dcf2e7; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22344a; --warm:#f0956a; --warm-l:#4a2e22; --ok:#4cc38a; --ok-l:#1d3a2e; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--warm)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="440" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240" y="50" text-anchor="middle" class="title">El círculo que mantiene la ansiedad</text>

  <rect x="150" y="80" width="180" height="70" rx="12" fill="var(--warm-l)" stroke="var(--warm)"/>
  <text x="240" y="108" text-anchor="middle" class="h">Pensamientos</text>
  <text x="240" y="128" text-anchor="middle" class="small">«Algo malo va a pasar»</text>

  <rect x="270" y="250" width="170" height="80" rx="12" fill="var(--warm-l)" stroke="var(--warm)"/>
  <text x="355" y="276" text-anchor="middle" class="h">Cuerpo</text>
  <text x="355" y="296" text-anchor="middle" class="small">Palpitaciones, tensión,</text>
  <text x="355" y="312" text-anchor="middle" class="small">falta de aire</text>

  <rect x="40" y="250" width="170" height="80" rx="12" fill="var(--warm-l)" stroke="var(--warm)"/>
  <text x="125" y="276" text-anchor="middle" class="h">Conducta</text>
  <text x="125" y="296" text-anchor="middle" class="small">Evitar la situación,</text>
  <text x="125" y="312" text-anchor="middle" class="small">buscar seguridad</text>

  <path d="M320 150 C350 180 360 210 358 245" fill="none" stroke="var(--warm)" stroke-width="3" marker-end="url(#a)"/>
  <path d="M268 300 L216 300" fill="none" stroke="var(--warm)" stroke-width="3" marker-end="url(#a)"/>
  <path d="M120 248 C120 200 130 170 148 150" fill="none" stroke="var(--warm)" stroke-width="3" marker-end="url(#a)"/>
  <text x="240" y="206" text-anchor="middle" class="small muted">El miedo crece</text>
  <text x="240" y="222" text-anchor="middle" class="small muted">si se repite</text>
  <text x="240" y="370" text-anchor="middle" class="small">Evitar alivia ahora,</text>
  <text x="240" y="386" text-anchor="middle" class="small">pero refuerza el miedo después</text>
  <text x="240" y="430" text-anchor="middle" class="small muted">La ansiedad es una emoción normal; preocupa si es excesiva</text>

  <rect x="476" y="20" width="304" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628" y="50" text-anchor="middle" class="title">Lo que ayuda</text>
  <g>
    <rect x="496" y="72" width="264" height="56" rx="10" fill="var(--ok-l)"/>
    <text x="512" y="96" class="h">Respiración lenta</text>
    <text x="512" y="116" class="small">Calma la respuesta del cuerpo</text>
    <rect x="496" y="138" width="264" height="56" rx="10" fill="var(--ok-l)"/>
    <text x="512" y="162" class="h">Exposición gradual</text>
    <text x="512" y="182" class="small">Afrontar poco a poco lo temido</text>
    <rect x="496" y="204" width="264" height="56" rx="10" fill="var(--ok-l)"/>
    <text x="512" y="228" class="h">Revisar los pensamientos</text>
    <text x="512" y="248" class="small">¿Qué pruebas hay de la amenaza?</text>
    <rect x="496" y="270" width="264" height="56" rx="10" fill="var(--ok-l)"/>
    <text x="512" y="294" class="h">Ejercicio y sueño</text>
    <text x="512" y="314" class="small">Menos cafeína y alcohol</text>
    <rect x="496" y="336" width="264" height="56" rx="10" fill="var(--accent-l)"/>
    <text x="512" y="360" class="h">Ayuda profesional</text>
    <text x="512" y="380" class="small">Psicoterapia y, si hace falta, fármacos</text>
  </g>
  <text x="628" y="430" text-anchor="middle" class="small muted">Tiene tratamiento eficaz</text>
</svg>
