<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trasplante de hígado</title>
  <desc id="d">A la izquierda, el hígado donado colocado en el lugar del hígado enfermo y conectado a la vena cava, la vena porta, la arteria hepática y la vía biliar. A la derecha, los tipos de donante, fallecido o vivo con una parte del hígado, cuándo se plantea el trasplante y los cuidados posteriores con inmunosupresores y controles.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="460" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="250.0" y="50" text-anchor="middle" class="title">Cómo se conecta el nuevo hígado</text>
  <path d="M110 170 C150 110 330 110 380 160 C390 230 300 270 200 260 C130 260 100 220 110 170 Z" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <text x="250" y="190" text-anchor="middle" class="step">Hígado donado</text>
  <path d="M300 60 V140 M300 270 V400" stroke="var(--vein)" stroke-width="16"/>
  <text x="316" y="80" class="small">Vena cava</text>
  <path d="M200 400 C200 330 210 290 220 262" fill="none" stroke="var(--vein)" stroke-width="10"/>
  <text x="150" y="410" text-anchor="middle" class="small">Vena porta</text>
  <path d="M240 400 C240 330 240 300 236 262" fill="none" stroke="var(--vessel)" stroke-width="5"/>
  <text x="250" y="382" class="small">Arteria hepática</text>
  <path d="M170 258 C160 300 150 330 130 360" fill="none" stroke="var(--ok)" stroke-width="5"/>
  <text x="126" y="372" text-anchor="end" class="small">Vía biliar</text>
  <text x="250" y="430" text-anchor="middle" class="small muted">Se coloca en el mismo lugar que el hígado enfermo</text>
  <rect x="500" y="20" width="280" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="640.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="520" y="62" class="step">Donante</text>
  <rect x="520" y="74" width="116" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="578" y="94" text-anchor="middle" class="small">Fallecido</text>
  <text x="578" y="110" text-anchor="middle" class="small">hígado entero</text>
  <rect x="644" y="74" width="116" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="702" y="94" text-anchor="middle" class="small">Vivo</text>
  <text x="702" y="110" text-anchor="middle" class="small">una parte</text>
  <text x="520" y="152" class="step">Cuándo se plantea</text>
  <text x="520" y="176" class="small">• Cirrosis avanzada</text>
  <text x="520" y="198" class="small">• Fallo hepático agudo</text>
  <text x="520" y="220" class="small">• Algunos cánceres de hígado</text>
  <text x="520" y="260" class="step">Después</text>
  <text x="520" y="284" class="small">• Inmunosupresores de por vida</text>
  <text x="520" y="306" class="small">• Controles y análisis</text>
  <text x="520" y="328" class="small">• Vigilar rechazo e infección</text>
  <text x="640" y="404" text-anchor="middle" class="small muted">El hígado de un donante vivo</text>
  <text x="640" y="422" text-anchor="middle" class="small muted">vuelve a crecer</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
