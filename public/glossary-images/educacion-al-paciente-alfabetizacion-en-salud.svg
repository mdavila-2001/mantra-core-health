<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Niveles de alfabetización en salud</title>
  <desc id="d">Tres escalones ascendentes que representan los niveles de alfabetización en salud descritos por Nutbeam: funcional, interactiva y crítica. Una flecha indica que al subir aumentan la autonomía y la participación en las decisiones sobre la propia salud.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#2f6fb3; --a-l:#dbe8f6; --b:#1f8a5b; --b-l:#d9f0e5; --c:#a86a0f; --c-l:#f8ebd0; --d:#c0392b; --d-l:#f7dcd8; --skin:#f0c9b0; --fat:#f4e3a8; --mus:#d98a7c; --bone:#e9e4d6; --p:#7b3b6e; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#7fb3ea; --a-l:#243a52; --b:#4cc38a; --b-l:#1f3b30; --c:#e3b04f; --c-l:#42361b; --d:#ef7467; --d-l:#47241f; --skin:#a8745e; --fat:#8a7a3a; --mus:#a65a4e; --bone:#8d8a7c; --p:#b77ab0; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .m { fill: var(--muted); }
    .t { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 14px; }
    .n { font-size: 13px; }
    .k { font-size: 24px; font-weight: 800; }
    .ln { stroke: var(--muted); stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="34" text-anchor="middle" class="t">Tres niveles de alfabetización en salud (Nutbeam)</text>
  <rect x="24" y="300" width="236" height="120" rx="10" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="142" y="328" text-anchor="middle" class="h" style="fill:var(--a)">1  Funcional</text>
  <text x="142" y="354" text-anchor="middle" class="n">Leer y entender lo básico:</text>
  <text x="142" y="372" text-anchor="middle" class="n">instrucciones, citas,</text>
  <text x="142" y="390" text-anchor="middle" class="n">etiquetas y folletos</text>
  <rect x="282" y="240" width="236" height="180" rx="10" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="400" y="268" text-anchor="middle" class="h" style="fill:var(--b)">2  Interactiva</text>
  <text x="400" y="294" text-anchor="middle" class="n">Comunicarse, buscar y</text>
  <text x="400" y="312" text-anchor="middle" class="n">extraer información, y</text>
  <text x="400" y="330" text-anchor="middle" class="n">aplicarla a situaciones</text>
  <text x="400" y="348" text-anchor="middle" class="n">nuevas con apoyo social</text>
  <rect x="540" y="180" width="236" height="240" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="658" y="208" text-anchor="middle" class="h" style="fill:var(--c)">3  Crítica</text>
  <text x="658" y="234" text-anchor="middle" class="n">Analizar la información con</text>
  <text x="658" y="252" text-anchor="middle" class="n">juicio propio y usarla para</text>
  <text x="658" y="270" text-anchor="middle" class="n">tener más control sobre las</text>
  <text x="658" y="288" text-anchor="middle" class="n">decisiones y las condiciones</text>
  <text x="658" y="306" text-anchor="middle" class="n">que afectan la salud</text>
  <path d="M60 250 L500 120" stroke="var(--muted)" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="60" y="278" class="s">Más autonomía y participación</text>
  <text x="400" y="448" text-anchor="middle" class="n">La educación al paciente busca desarrollar los tres niveles, no sólo el primero.</text>
  <text x="400" y="470" text-anchor="middle" class="n m">Esquema ilustrativo. Ilustración original de AloVida.</text>
</svg>
