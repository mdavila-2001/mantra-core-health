<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cervicalgia</title>
  <desc id="d">A la izquierda, la columna cervical con siete vértebras, los discos entre ellas y los músculos del cuello. A la derecha, las causas frecuentes del dolor de cuello y las señales de alarma para consultar pronto.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">La columna cervical</text>
  <path d="M140 62 C140 70 160 76 200 76 C240 76 260 70 260 62" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="200" y="94" text-anchor="middle" class="small" style="fill:var(--muted)">Base del cráneo</text>
  <rect x="184" y="108" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="254" y="127" class="small" style="fill:var(--muted)">C1</text>
  <rect x="188" y="137" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="177" y="148" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="247" y="167" class="small" style="fill:var(--muted)">C2</text>
  <rect x="181" y="177" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="172" y="188" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="242" y="207" class="small" style="fill:var(--muted)">C3</text>
  <rect x="176" y="217" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="170" y="228" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="240" y="247" class="small" style="fill:var(--muted)">C4</text>
  <rect x="174" y="257" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="172" y="268" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="242" y="287" class="small" style="fill:var(--muted)">C5</text>
  <rect x="176" y="297" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="177" y="308" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="247" y="327" class="small" style="fill:var(--muted)">C6</text>
  <rect x="181" y="337" width="52" height="10" rx="4" fill="var(--accent-l)" stroke="none" stroke-width="0"/>
  <rect x="184" y="348" width="60" height="28" rx="6" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="254" y="367" class="small" style="fill:var(--muted)">C7</text>
  <path d="M120 110 C104 200 104 300 124 392" fill="none" stroke="var(--organ-d)" stroke-width="8" opacity=".6"/>
  <text x="110" y="250" text-anchor="end" class="small" style="fill:var(--organ-d)">Músculos</text>
  <text x="300" y="300" class="small" style="fill:var(--accent)">Discos</text>
  <line x1="296" y1="296" x2="232" y2="270" stroke="var(--accent)" stroke-width="1"/>
  <text x="200" y="425" text-anchor="middle" class="small" style="fill:var(--muted)">Siete vértebras sostienen la cabeza</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Dolor de cuello</text>
  <text x="416" y="80" class="step">Causas frecuentes</text>
  <text x="424" y="104" class="lab">• Contractura muscular y mala postura</text>
  <text x="424" y="128" class="lab">• Desgaste de discos y articulaciones</text>
  <text x="424" y="152" class="lab">• Latigazo cervical tras un golpe</text>
  <text x="424" y="176" class="lab">• Estrés y tensión mantenida</text>
  <rect x="416" y="202" width="344" height="150" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="432" y="226" class="step" style="fill:var(--warn)">Señales de alarma: consultar pronto</text>
  <text x="440" y="250" class="small">• Fiebre con cuello rígido</text>
  <text x="440" y="270" class="small">• Hormigueo o debilidad en brazos</text>
  <text x="440" y="290" class="small">• Dolor tras un accidente fuerte</text>
  <text x="440" y="310" class="small">• Dolor nocturno o pérdida de peso</text>
  <text x="440" y="330" class="small">• Dolor con presión en el pecho</text>
  <text x="416" y="382" class="step" style="fill:var(--ok)">La mayoría mejora en semanas</text>
  <text x="416" y="404" class="small">con movimiento suave, calor y analgesia.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
