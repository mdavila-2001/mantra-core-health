<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona un endoscopio flexible</title>
  <desc id="d">A la izquierda, un endoscopio flexible con mango de control avanza por el esófago hasta el estómago. A la derecha, la punta ampliada muestra la luz, la cámara, el canal de aire y agua y el canal de trabajo con una pinza de biopsia, y un monitor muestra la imagen de la mucosa.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --organ:#f3c9c0; --organ-d:#d98b7c; --scope:#3d4a5a; --light:#f2c46d; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --organ:#5a3a37; --organ-d:#a8675c; --scope:#b9c6d3; --light:#8a6f2f; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="370" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205" y="50" text-anchor="middle" class="title">Recorrido del endoscopio</text>

  <!-- esófago y estómago -->
  <path d="M190 80 V230" stroke="var(--organ)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M190 225 C150 250 140 330 190 370 C240 410 320 380 330 320 C340 260 300 220 250 225 C230 227 210 235 190 225 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M325 330 C340 350 345 370 335 395" stroke="var(--organ)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <text x="140" y="140" text-anchor="end" class="lab">Esófago</text>
  <text x="240" y="300" text-anchor="middle" class="lab">Estómago</text>
  <text x="352" y="420" text-anchor="end" class="small">Duodeno</text>

  <!-- tubo -->
  <path d="M70 70 C120 70 190 60 190 110 V240 C190 280 230 300 270 280" fill="none" stroke="var(--scope)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="272" cy="279" r="7" fill="var(--light)" stroke="var(--scope)" stroke-width="2"/>
  <path d="M278 274 L320 250 L322 296 Z" fill="var(--light)" opacity=".5"/>
  <!-- mango -->
  <rect x="38" y="58" width="36" height="70" rx="10" fill="var(--accent)"/>
  <circle cx="56" cy="80" r="7" fill="var(--on)"/>
  <text x="56" y="148" text-anchor="middle" class="small">Mango</text>
  <text x="56" y="163" text-anchor="middle" class="small muted">de control</text>
  <text x="205" y="445" text-anchor="middle" class="small muted">Entra por la boca; se insufla aire para ver mejor</text>

  <!-- panel derecho -->
  <rect x="406" y="20" width="374" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="593" y="50" text-anchor="middle" class="title">La punta, ampliada</text>
  <circle cx="530" cy="160" r="80" fill="var(--scope)"/>
  <circle cx="530" cy="160" r="72" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="500" cy="125" r="16" fill="var(--accent)"/>
  <circle cx="500" cy="125" r="7" fill="var(--on)"/>
  <circle cx="565" cy="125" r="11" fill="var(--light)"/>
  <circle cx="490" cy="190" r="11" fill="var(--light)"/>
  <circle cx="568" cy="188" r="18" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M560 188 L576 188 M568 180 L568 196" stroke="var(--ok)" stroke-width="3"/>
  <circle cx="530" cy="210" r="7" fill="var(--accent-l)" stroke="var(--accent)"/>
  <line x1="516" y1="125" x2="640" y2="88" stroke="var(--line)"/><text x="644" y="92" class="lab">Cámara</text>
  <line x1="576" y1="125" x2="640" y2="120" stroke="var(--line)"/><text x="644" y="124" class="lab">Luz</text>
  <line x1="586" y1="188" x2="640" y2="168" stroke="var(--line)"/><text x="644" y="166" class="lab">Canal de trabajo</text>
  <text x="644" y="181" class="small muted">(pinza de biopsia)</text>
  <line x1="537" y1="210" x2="640" y2="214" stroke="var(--line)"/><text x="644" y="218" class="lab">Aire y agua</text>

  <!-- monitor -->
  <rect x="440" y="270" width="200" height="130" rx="10" fill="var(--scope)"/>
  <rect x="450" y="280" width="180" height="104" rx="6" fill="var(--organ)"/>
  <path d="M460 330 C500 300 560 360 620 320" stroke="var(--organ-d)" stroke-width="3" fill="none"/>
  <path d="M460 355 C510 335 560 380 620 350" stroke="var(--organ-d)" stroke-width="3" fill="none"/>
  <rect x="525" y="400" width="30" height="14" fill="var(--scope)"/>
  <text x="710" y="320" text-anchor="middle" class="lab">Monitor:</text>
  <text x="710" y="338" text-anchor="middle" class="small muted">imagen en</text>
  <text x="710" y="353" text-anchor="middle" class="small muted">tiempo real</text>
  <text x="593" y="440" text-anchor="middle" class="small muted">El médico ve la mucosa y puede tomar muestras</text>
</svg>
