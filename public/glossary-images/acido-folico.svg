<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de folato (ácido fólico) en sangre</title>
  <desc id="d">A la izquierda, el folato de verduras, legumbres y cereales enriquecidos llega a la médula ósea, donde permite sintetizar ADN; con folato suficiente se forman glóbulos rojos normales y, si falta, glóbulos rojos grandes y escasos propios de la anemia megaloblástica. A la derecha, un tubo de sangre y los motivos por los que se pide la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Del alimento al glóbulo rojo</text>
  <rect x="36" y="66" width="104" height="30" rx="8" fill="var(--ok-l)"/>
  <text x="88.0" y="85.32" text-anchor="middle" class="small" style="fill:var(--ink)">Verduras de hoja</text>
  <rect x="148" y="66" width="104" height="30" rx="8" fill="var(--ok-l)"/>
  <text x="200.0" y="85.32" text-anchor="middle" class="small" style="fill:var(--ink)">Legumbres</text>
  <rect x="260" y="66" width="104" height="30" rx="8" fill="var(--ok-l)"/>
  <text x="312.0" y="85.32" text-anchor="middle" class="small" style="fill:var(--ink)">Cereal enriquecido</text>
  <line x1="88" y1="98" x2="200" y2="140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="200" y1="98" x2="200" y2="140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="312" y1="98" x2="200" y2="140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="200" cy="168" r="28" fill="var(--nerve)"/>
  <text x="200" y="173" text-anchor="middle" class="step" style="fill:var(--on)">Folato</text>
  <text x="240" y="172" class="small muted">vitamina B9</text>
  <line x1="200" y1="198" x2="200" y2="228" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="80" y="232" width="240" height="34" rx="8" fill="var(--accent)"/>
  <text x="200.0" y="253.68" text-anchor="middle" class="lab" style="fill:var(--on)">Médula ósea: síntesis de ADN</text>
  <line x1="160" y1="268" x2="110" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="240" y1="268" x2="290" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="110" y="318" text-anchor="middle" class="lab" style="fill:var(--ok)">Folato suficiente</text>
  <circle cx="76" cy="352" r="14" fill="var(--vessel)"/>
  <circle cx="76" cy="352" r="6.3" fill="var(--organ)"/>
  <circle cx="110" cy="352" r="14" fill="var(--vessel)"/>
  <circle cx="110" cy="352" r="6.3" fill="var(--organ)"/>
  <circle cx="144" cy="352" r="14" fill="var(--vessel)"/>
  <circle cx="144" cy="352" r="6.3" fill="var(--organ)"/>
  <text x="110" y="392" text-anchor="middle" class="small muted">Glóbulos rojos normales</text>
  <text x="290" y="318" text-anchor="middle" class="lab" style="fill:var(--warn)">Falta de folato</text>
  <circle cx="262" cy="354" r="22" fill="var(--vessel)"/>
  <circle cx="262" cy="354" r="9.9" fill="var(--organ)"/>
  <circle cx="316" cy="354" r="22" fill="var(--vessel)"/>
  <circle cx="316" cy="354" r="9.9" fill="var(--organ)"/>
  <text x="290" y="392" text-anchor="middle" class="small muted">Grandes y escasos</text>
  <text x="200" y="420" text-anchor="middle" class="step" style="fill:var(--warn)">Anemia megaloblástica</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">La prueba</text>
  <rect x="422" y="64" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M424 80 V144 a15 15 0 0 0 30 0 V80 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M426 110 V144 a13 13 0 0 0 26 0 V110 Z" fill="var(--vessel)"/>
  <text x="472" y="92" class="lab">Muestra de sangre: suero o plasma</text>
  <text x="472" y="116" class="lab">Mide el folato total</text>
  <text x="472" y="140" class="small muted">No distingue alimento de suplemento</text>
  <text x="416" y="214" class="step">Se pide sobre todo para estudiar</text>
  <text x="420" y="242" class="lab">• Anemia con glóbulos rojos grandes</text>
  <text x="420" y="268" class="lab">• Malnutrición o malabsorción</text>
  <text x="420" y="294" class="lab">• Respuesta a un tratamiento con folato</text>
  <text x="420" y="320" class="lab">• El folato antes y durante el embarazo</text>
  <rect x="416" y="360" width="344" height="60" rx="10" fill="var(--accent-l)"/>
  <text x="432" y="386" class="lab">Suele pedirse junto con la vitamina B12:</text>
  <text x="432" y="406" class="lab">ambas faltas dan una anemia parecida.</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
