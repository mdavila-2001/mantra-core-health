<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad celíaca</title>
  <desc id="d">A la izquierda, la pared del intestino delgado con vellosidades largas en una persona sana y aplanadas en la enfermedad celíaca, y la secuencia gluten, reacción inmune y daño de la mucosa. A la derecha, síntomas, diagnóstico y dieta sin gluten.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Pared del intestino delgado</text>
  <rect x="40" y="160" width="150" height="40" rx="4" fill="var(--organ-d)" stroke="none" stroke-width="0" opacity=".6"/>
  <path d="M50 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M72 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M93 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M115 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M137 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M158 160 V90 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <rect x="210" y="160" width="150" height="40" rx="4" fill="var(--organ-d)" stroke="none" stroke-width="0" opacity=".6"/>
  <path d="M220 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M242 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M263 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M285 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M307 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M328 160 V152 a8.8 10 0 0 1 17.7 0 V160" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <text x="115" y="234" text-anchor="middle" class="step">Normal</text>
  <text x="285" y="234" text-anchor="middle" class="step">Celiaquía</text>
  <text x="115" y="254" text-anchor="middle" class="small" style="fill:var(--muted)">Vellosidades largas</text>
  <text x="285" y="254" text-anchor="middle" class="small" style="fill:var(--muted)">Vellosidades aplanadas</text>
  <rect x="40" y="286" width="100" height="44" rx="10" fill="var(--fluid)" stroke="var(--line)"/>
  <text x="90.0" y="313.0" text-anchor="middle" class="lab">Gluten</text>
  <rect x="160" y="286" width="100" height="44" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="210.0" y="304.5" text-anchor="middle" class="lab">Reacción</text>
  <text x="210.0" y="321.5" text-anchor="middle" class="lab">inmune</text>
  <rect x="280" y="286" width="100" height="44" rx="10" fill="var(--organ)" stroke="var(--line)"/>
  <text x="330.0" y="304.5" text-anchor="middle" class="lab">Daño en la</text>
  <text x="330.0" y="321.5" text-anchor="middle" class="lab">mucosa</text>
  <line x1="140" y1="308" x2="158" y2="308" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="260" y1="308" x2="278" y2="308" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <text x="210" y="366" text-anchor="middle" class="lab">Trigo, cebada y centeno</text>
  <text x="210" y="388" text-anchor="middle" class="small" style="fill:var(--muted)">Se absorben peor los nutrientes</text>
  <text x="210" y="410" text-anchor="middle" class="small" style="fill:var(--muted)">Enfermedad autoinmune con base genética</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síntomas, diagnóstico y tratamiento</text>
  <text x="436" y="80" class="small">• Diarrea, hinchazón, pérdida de peso</text>
  <text x="436" y="104" class="small">• Anemia y cansancio</text>
  <text x="436" y="128" class="small">• En niños: talla baja</text>
  <text x="436" y="152" class="small">• A veces sin síntomas digestivos</text>
  <text x="436" y="196" class="step">Diagnóstico</text>
  <text x="444" y="220" class="small">• Anticuerpos en sangre</text>
  <text x="444" y="242" class="small">• Biopsia por endoscopia</text>
  <text x="444" y="264" class="small">• Sin dejar el gluten antes</text>
  <rect x="436" y="300" width="324" height="122" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="452" y="328" class="step">Tratamiento</text>
  <text x="452" y="354" class="small">Dieta estricta sin gluten de por vida.</text>
  <text x="452" y="376" class="small">La mucosa se recupera con el tiempo.</text>
  <text x="452" y="398" class="small">Cuidado con la contaminación cruzada.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
