<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">PCR ultrasensible</title>
  <desc id="d">A la izquierda, una placa inflamada en la pared de una arteria que envía señales inflamatorias al hígado, que produce proteína C reactiva, medida en una muestra de sangre. A la derecha, su uso para estimar el riesgo cardiovascular y otras causas de elevación.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Inflamación y proteína C reactiva</text>
  <path d="M60 230 C60 200 80 180 110 180 L150 180 L150 280 L110 280 C80 280 60 260 60 230 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <text x="105" y="300" text-anchor="middle" class="small" style="fill:var(--muted)">Pared de la arteria</text>
  <path d="M150 200 C170 196 180 210 170 230 C160 250 150 250 150 250" fill="var(--fluid)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="105" y="160" text-anchor="middle" class="small" style="fill:var(--warn)">Placa con inflamación</text>
  <line x1="160" y1="230" x2="200" y2="230" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="204" y="200" width="70" height="60" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="239.0" y="226.5" text-anchor="middle" class="small">Señales</text>
  <text x="239.0" y="243.5" text-anchor="middle" class="small">inflamat.</text>
  <line x1="276" y1="230" x2="300" y2="230" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M310 200 C310 180 400 180 400 210 C400 250 350 270 330 260 C310 250 300 230 310 200 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="355" y="226" text-anchor="middle" class="small on">Hígado</text>
  <text x="355" y="290" text-anchor="middle" class="small">Produce PCR</text>
  <line x1="355" y1="300" x2="355" y2="330" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="340" y="334" width="30" height="14" rx="3" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <path d="M343 348 V394 a12 12 0 0 0 24 0 V348" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M345 374 V394 a10 10 0 0 0 20 0 V374 Z" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="200" y="360" text-anchor="middle" class="small">La versión ultrasensible detecta</text>
  <text x="200" y="378" text-anchor="middle" class="small">niveles muy bajos de PCR</text>
  <text x="200" y="420" text-anchor="middle" class="lab">Muestra: sangre</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Para qué se usa</text>
  <rect x="456" y="66" width="304" height="110" rx="10" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="472" y="92" class="step">Riesgo cardiovascular</text>
  <text x="472" y="116" class="small">Afina el cálculo de riesgo de infarto</text>
  <text x="472" y="136" class="small">e ictus junto a colesterol, presión,</text>
  <text x="472" y="156" class="small">tabaco y diabetes</text>
  <text x="456" y="210" class="step" style="fill:var(--warn)">Puede subir por otras causas</text>
  <text x="464" y="236" class="small">• Infecciones recientes</text>
  <text x="464" y="258" class="small">• Enfermedades inflamatorias</text>
  <text x="464" y="280" class="small">• Lesiones o cirugía</text>
  <text x="464" y="302" class="small">• Obesidad y tabaco</text>
  <rect x="456" y="340" width="304" height="82" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="608" y="366" text-anchor="middle" class="small">Se repite si sale alta, y no se mide</text>
  <text x="608" y="386" text-anchor="middle" class="small">durante una infección aguda. No</text>
  <text x="608" y="406" text-anchor="middle" class="small">señala dónde está la inflamación.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
