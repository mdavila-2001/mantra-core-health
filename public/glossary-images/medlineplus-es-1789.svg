<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Reconstrucción mamaria</title>
  <desc id="d">A la izquierda, una silueta del torso con un implante en una mama y las zonas de donde puede obtenerse tejido propio: el abdomen y el músculo de la espalda. A la derecha, las opciones de reconstrucción y si se hace en el mismo acto o más tarde.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">De dónde sale el nuevo volumen</text>
  <path d="M206.0,118.0 L206.0,128.0 C180.0,130.0 162.0,136.0 158.0,156.0 L146.0,266.0 L158.0,268.0 L172.0,176.0 L174.0,256.0 L176.0,416.0 L206.0,416.0 L220.0,281.0 L234.0,416.0 L264.0,416.0 L266.0,256.0 L268.0,176.0 L282.0,268.0 L294.0,266.0 L282.0,156.0 C278.0,136.0 260.0,130.0 234.0,128.0 L234.0,118.0 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="220" cy="94.0" r="26.0" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="196" cy="168" r="14" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="244" cy="168" r="14" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M190 238 C200 250 240 250 250 238 L250 262 C240 272 200 272 190 262 Z" fill="var(--warn)" stroke="var(--warn)" stroke-width="1" opacity=".7"/>
  <path d="M268 140 C284 150 286 180 270 196 L262 150 Z" fill="var(--violet)" stroke="none" stroke-width="2" opacity=".7"/>
  <text x="110" y="150" text-anchor="end" class="small" style="fill:var(--accent)">Implante</text>
  <text x="110" y="166" text-anchor="end" class="small" style="fill:var(--accent)">o expansor</text>
  <line x1="114" y1="158" x2="180" y2="166" stroke="var(--accent)" stroke-width="1"/>
  <text x="310" y="120" class="small" style="fill:var(--violet)">Músculo de</text>
  <text x="310" y="136" class="small" style="fill:var(--violet)">la espalda</text>
  <line x1="308" y1="132" x2="278" y2="160" stroke="var(--violet)" stroke-width="1"/>
  <text x="110" y="262" text-anchor="end" class="small" style="fill:var(--warn)">Piel y grasa</text>
  <text x="110" y="278" text-anchor="end" class="small" style="fill:var(--warn)">del abdomen</text>
  <line x1="114" y1="266" x2="188" y2="254" stroke="var(--warn)" stroke-width="1"/>
  <text x="220" y="432" text-anchor="middle" class="small" style="fill:var(--muted)">Implante o tejido propio (colgajo)</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Opciones y momento</text>
  <rect x="456" y="66" width="304" height="48" rx="8" fill="var(--accent-l)" stroke="none" stroke-width="2"/>
  <text x="472" y="86" class="lab">Implantes</text>
  <text x="472" y="104" class="small" style="fill:var(--muted)">a veces tras un expansor</text>
  <rect x="456" y="122" width="304" height="48" rx="8" fill="var(--warn-l)" stroke="none" stroke-width="2"/>
  <text x="472" y="142" class="lab">Tejido propio</text>
  <text x="472" y="160" class="small" style="fill:var(--muted)">colgajo de abdomen o espalda</text>
  <rect x="456" y="178" width="304" height="48" rx="8" fill="var(--violet-l)" stroke="none" stroke-width="2"/>
  <text x="472" y="198" class="lab">Combinadas</text>
  <text x="472" y="216" class="small" style="fill:var(--muted)">colgajo más implante</text>
  <text x="456" y="258" class="step">Cuándo</text>
  <rect x="456" y="270" width="146" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="529.0" y="294.5" text-anchor="middle" class="small">Inmediata</text>
  <text x="529.0" y="311.5" text-anchor="middle" class="small">en la mastectomía</text>
  <rect x="614" y="270" width="146" height="56" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="687.0" y="294.5" text-anchor="middle" class="small">Diferida</text>
  <text x="687.0" y="311.5" text-anchor="middle" class="small">meses o años después</text>
  <rect x="456" y="344" width="304" height="78" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="608" y="370" text-anchor="middle" class="small">Puede completarse con la</text>
  <text x="608" y="390" text-anchor="middle" class="small">reconstrucción del pezón y retoques</text>
  <text x="608" y="410" text-anchor="middle" class="small">para lograr simetría.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
