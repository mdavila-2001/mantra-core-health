<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Depresión</title>
  <desc id="d">Esquema radial con un círculo central que indica una duración de al menos dos semanas y ocho síntomas alrededor: tristeza o vacío, pérdida de interés, sueño alterado, cansancio, culpa, dificultad de concentración, cambios de apetito e ideas de muerte. Debajo, su repercusión en la vida diaria y que tiene tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Depresión: más que tristeza</text>
  <line x1="400" y1="200" x2="400" y2="82" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="590" y2="120" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="640" y2="210" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="590" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="400" y2="330" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="210" y2="300" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="160" y2="210" stroke="var(--line)" stroke-width="2"/>
  <line x1="400" y1="200" x2="210" y2="120" stroke="var(--line)" stroke-width="2"/>
  <circle cx="400" cy="200" r="70" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="400" y="196" text-anchor="middle" class="small">Al menos</text>
  <text x="400" y="214" text-anchor="middle" class="step">2 semanas</text>
  <rect x="325" y="65" width="150" height="34" rx="8" fill="var(--accent)"/>
  <text x="400.0" y="86.32" text-anchor="middle" class="small" style="fill:var(--on)">Tristeza o vacío</text>
  <rect x="515" y="103" width="150" height="34" rx="8" fill="var(--accent)"/>
  <text x="590.0" y="124.32" text-anchor="middle" class="small" style="fill:var(--on)">Pérdida de interés</text>
  <rect x="565" y="193" width="150" height="34" rx="8" fill="var(--purple)"/>
  <text x="640.0" y="214.32" text-anchor="middle" class="small" style="fill:var(--on)">Sueño alterado</text>
  <rect x="515" y="283" width="150" height="34" rx="8" fill="var(--purple)"/>
  <text x="590.0" y="304.32" text-anchor="middle" class="small" style="fill:var(--on)">Cansancio</text>
  <rect x="325" y="313" width="150" height="34" rx="8" fill="var(--purple)"/>
  <text x="400.0" y="334.32" text-anchor="middle" class="small" style="fill:var(--on)">Culpa o inutilidad</text>
  <rect x="135" y="283" width="150" height="34" rx="8" fill="var(--purple)"/>
  <text x="210.0" y="304.32" text-anchor="middle" class="small" style="fill:var(--on)">Concentración</text>
  <rect x="85" y="193" width="150" height="34" rx="8" fill="var(--purple)"/>
  <text x="160.0" y="214.32" text-anchor="middle" class="small" style="fill:var(--on)">Apetito o peso</text>
  <rect x="135" y="103" width="150" height="34" rx="8" fill="var(--warn)"/>
  <text x="210.0" y="124.32" text-anchor="middle" class="small" style="fill:var(--on)">Ideas de muerte</text>
  <rect x="40" y="366" width="340" height="60" rx="10" fill="var(--tissue)"/>
  <text x="210" y="390" text-anchor="middle" class="lab">Afecta al trabajo, las relaciones</text>
  <text x="210" y="410" text-anchor="middle" class="lab">y el cuidado personal</text>
  <rect x="420" y="366" width="340" height="60" rx="10" fill="var(--ok-l)"/>
  <text x="590" y="390" text-anchor="middle" class="lab">Tiene tratamiento: psicoterapia,</text>
  <text x="590" y="410" text-anchor="middle" class="lab">medicación o ambas</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Ante ideas de muerte, pedir ayuda inmediata. Ilustración original de AloVida.</text>
</svg>
