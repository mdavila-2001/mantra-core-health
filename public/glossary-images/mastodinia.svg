<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mastodinia (dolor de mama)</title>
  <desc id="d">A la izquierda, un calendario de cuatro semanas en el que los días previos a la regla están marcados como días con dolor, que corresponde al dolor cíclico, y debajo las causas del dolor no cíclico. A la derecha, los motivos para consultar, como un bulto nuevo o una secreción con sangre, y medidas que suelen ayudar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dolor cíclico o no cíclico</text>
  <rect x="44" y="74" width="42" height="36" rx="6" fill="var(--accent-l)" stroke="var(--line)"/>
  <rect x="92" y="74" width="42" height="36" rx="6" fill="var(--accent-l)" stroke="var(--line)"/>
  <rect x="140" y="74" width="42" height="36" rx="6" fill="var(--accent-l)" stroke="var(--line)"/>
  <rect x="188" y="74" width="42" height="36" rx="6" fill="var(--accent-l)" stroke="var(--line)"/>
  <rect x="236" y="74" width="42" height="36" rx="6" fill="var(--accent-l)" stroke="var(--line)"/>
  <rect x="284" y="74" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="332" y="74" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="44" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="92" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="140" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="188" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="236" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="284" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="332" y="118" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="44" y="162" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="92" y="162" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="140" y="162" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="188" y="162" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="236" y="162" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="284" y="162" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="332" y="162" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="44" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="92" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="140" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="188" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="236" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="284" y="206" width="42" height="36" rx="6" fill="var(--bad-l)" stroke="var(--line)"/>
  <rect x="332" y="206" width="42" height="36" rx="6" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="210" y="270" text-anchor="middle" class="step">Cíclico: antes de la regla</text>
  <text x="210" y="290" text-anchor="middle" class="small">en ambas mamas, mejora al bajar</text>
  <rect x="44" y="306" width="14" height="12" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="64" y="316" class="small">Días con dolor</text>
  <rect x="190" y="306" width="14" height="12" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="210" y="316" class="small">Regla</text>
  <text x="210" y="356" text-anchor="middle" class="step">No cíclico: no sigue el ciclo</text>
  <text x="44" y="382" class="small">• Quistes, sujetador inadecuado</text>
  <text x="44" y="404" class="small">• Fármacos, dolor de la pared torácica</text>
  <rect x="420" y="20" width="360" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="600.0" y="50" text-anchor="middle" class="title">Cuándo consultar</text>
  <rect x="440" y="60" width="320" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="600.0" y="83.0" text-anchor="middle" class="small">Bulto nuevo</text>
  <rect x="440" y="106" width="320" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="600.0" y="129.0" text-anchor="middle" class="small">Dolor en un solo punto que persiste</text>
  <rect x="440" y="152" width="320" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="600.0" y="175.0" text-anchor="middle" class="small">Secreción con sangre por el pezón</text>
  <rect x="440" y="198" width="320" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="600.0" y="221.0" text-anchor="middle" class="small">Piel enrojecida o retraída</text>
  <rect x="440" y="244" width="320" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="600.0" y="267.0" text-anchor="middle" class="small">Fiebre o calor local</text>
  <text x="440" y="312" class="step">Qué suele ayudar</text>
  <text x="440" y="338" class="small">• Sujetador firme y bien ajustado</text>
  <text x="440" y="362" class="small">• Calor o frío local</text>
  <text x="440" y="386" class="small">• Analgésicos si hace falta</text>
  <text x="600" y="428" text-anchor="middle" class="small muted">Casi siempre tiene causa benigna</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
