<rect x="630" y="240" width="110" height="32" rx="8" fill="var(--purple)" stroke-width="1"/>
<text x="685.0" y="260.2" text-anchor="middle" class="small" style="fill:var(--on)">Glándula</text>
<line x1="588" y1="250" x2="626" y2="250" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M684,274 Q610,312 532,276" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="608" y="312" text-anchor="middle" class="small" style="fill:var(--muted)">la hormona frena a la hipófisis</text>
<text x="456" y="356" class="lab">Herramientas: análisis hormonales,</text>
