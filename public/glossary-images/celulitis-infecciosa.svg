<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo se produce la celulitis infecciosa</title>
  <desc id="d">Corte de la piel con epidermis, dermis y tejido subcutáneo, en el que las bacterias entran por una herida y se extienden por la dermis y la grasa formando una zona inflamada sin borde nítido. A la derecha, los signos en la piel y las señales de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Celulitis infecciosa: bacterias en las capas profundas de la piel</text>
  <rect x="20" y="60" width="440" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="90" text-anchor="middle" class="title">Corte de la piel</text>
  <rect x="40" y="130" width="400" height="36" rx="2" fill="var(--skin)" stroke="var(--muted)"/>
  <rect x="40" y="166" width="400" height="100" rx="0" fill="var(--organ)" stroke="none" opacity=".45"/>
  <rect x="40" y="266" width="400" height="124" rx="2" fill="var(--beam)" stroke="none" opacity=".45"/>
  <text x="56" y="153" class="small">Epidermis</text>
  <text x="56" y="188" class="small">Dermis</text>
  <text x="56" y="290" class="small">Tejido subcutáneo</text>
  <path d="M220 130 L232 166 L214 168 Z" fill="var(--panel)" stroke="var(--red)" stroke-width="2"/>
  <text x="226" y="120" text-anchor="middle" class="small b">Herida o grieta</text>
  <ellipse cx="240" cy="240" rx="140" ry="70" fill="var(--red)" stroke="none" opacity=".25"/>
  <circle cx="220" cy="180" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="250" cy="210" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="200" cy="230" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="290" cy="240" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="230" cy="270" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="180" cy="260" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="300" cy="200" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="330" cy="260" r="5" fill="var(--red)" stroke="none"/>
  <circle cx="160" cy="210" r="5" fill="var(--red)" stroke="none"/>
  <text x="240" y="418" text-anchor="middle" class="small muted">La infección se extiende sin borde nítido</text>
  <rect x="476" y="60" width="304" height="210" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628.0" y="90" text-anchor="middle" class="title">Signos en la piel</text>
  <text x="494" y="110" class="small">• Enrojecimiento que crece</text>
  <text x="494" y="136" class="small">• Calor</text>
  <text x="494" y="162" class="small">• Hinchazón</text>
  <text x="494" y="188" class="small">• Dolor al tocar</text>
  <text x="494" y="214" class="small">• Marcar el borde ayuda a</text>
  <text x="505" y="240" class="small">ver si avanza</text>
  <rect x="476" y="286" width="304" height="154" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="490" y="310" class="lab b" style="fill:var(--red)">Consultar de urgencia si</text>
  <text x="490" y="334" class="small">• Fiebre o escalofríos</text>
  <text x="490" y="356" class="small">• Avance rápido o ampollas</text>
  <text x="490" y="378" class="small">• Dolor muy intenso</text>
  <text x="490" y="400" class="small">• Zona en la cara o el ojo</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
