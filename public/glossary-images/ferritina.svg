<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ferritina: el depósito de hierro</title>
  <desc id="d">Tubo de sangre y una molécula de ferritina dibujada como una cubierta con hierro en su interior; se indica que se almacena en hígado, bazo y médula ósea. A la derecha, qué sugiere un valor bajo o alto y por qué la inflamación también la eleva.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Qué es la ferritina</text>
<rect x="50" y="104" width="30" height="96" rx="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
<rect x="53" y="139.5" width="24" height="57.50000000000001" rx="10" fill="var(--vessel)" stroke-width="1" opacity=".8"/>
<rect x="47" y="90" width="36" height="18" rx="4" fill="var(--vessel)" stroke-width="1"/>
<text x="65" y="222" text-anchor="middle" class="lab">Sangre</text>
<line x1="96" y1="150" x2="140" y2="150" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="250" cy="150" r="80" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="6"/>
<circle cx="258" cy="150" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="237" cy="162" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="252" cy="128" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="265" cy="170" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="222" cy="145" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="276" cy="134" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="242" cy="181" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="234" cy="119" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="284" cy="163" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="215" cy="165" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="267" cy="114" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="262" cy="190" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="213" cy="128" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="293" cy="140" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="224" cy="187" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="244" cy="103" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="287" cy="181" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="200" cy="152" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="286" cy="114" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="248" cy="202" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="216" cy="109" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="304" cy="157" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="204" cy="182" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<circle cx="262" cy="95" r="5" fill="var(--warn)" stroke="none" stroke-width="1"/>
<text x="250" y="256" text-anchor="middle" class="step">Proteína que guarda hierro</text>
<text x="250" y="276" text-anchor="middle" class="small" style="fill:var(--muted)">(cubierta y núcleo de hierro)</text>
<rect x="40" y="300" width="360" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="52" y="322" class="step">Dónde se almacena</text>
<text x="52" y="346" class="lab">Hígado, bazo y médula ósea</text>
<text x="52" y="368" class="lab">Una pequeña parte pasa a la sangre y</text>
<text x="52" y="390" class="lab">refleja el tamaño de esos depósitos</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Cómo se interpreta</text>
<rect x="456" y="62" width="304" height="74" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="608.0" y="87.5" text-anchor="middle" class="lab" style="fill:var(--ink)">Baja</text>
<text x="608.0" y="103.5" text-anchor="middle" class="lab" style="fill:var(--ink)">depósitos de hierro agotados</text>
<text x="608.0" y="119.5" text-anchor="middle" class="lab" style="fill:var(--ink)">antes incluso de la anemia</text>
<rect x="456" y="152" width="304" height="74" rx="8" fill="var(--vessel-l)" stroke-width="1"/>
<text x="608.0" y="177.6" text-anchor="middle" class="lab" style="fill:var(--ink)">Alta</text>
<text x="608.0" y="193.6" text-anchor="middle" class="lab" style="fill:var(--ink)">sobrecarga de hierro</text>
<text x="608.0" y="209.6" text-anchor="middle" class="lab" style="fill:var(--ink)">(p. ej., hemocromatosis)</text>
<rect x="456" y="242" width="304" height="104" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1"/>
<text x="470" y="268" class="step" style="fill:var(--warn)">Ojo: también sube con</text>
<text x="470" y="292" class="lab">• inflamación o infección</text>
<text x="470" y="314" class="lab">• enfermedad del hígado, alcohol</text>
<text x="456" y="380" class="lab">Suele pedirse junto con hemograma,</text>
<text x="456" y="400" class="lab">hierro, transferrina y su saturación.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
