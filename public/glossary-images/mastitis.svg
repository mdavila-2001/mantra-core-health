<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mastitis</title>
  <desc id="d">A la izquierda, un corte lateral de la mama con lóbulos y conductos, un conducto obstruido y una zona en forma de cuña roja, caliente y dolorosa. A la derecha, los síntomas, los cuidados que ayudan y cuándo consultar pronto.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Zona inflamada de la mama</text>
  <path d="M70 80 C150 80 240 120 290 200 C320 250 320 290 296 320 C260 370 170 380 110 360 L70 350 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="70" y1="80" x2="70" y2="350" stroke="var(--bone)" stroke-width="6"/>
  <circle cx="306" cy="280" r="9" fill="var(--organ-d)" stroke="none" stroke-width="2"/>
  <path d="M300 278 L150 140 C180 120 230 130 250 160 Z" fill="var(--vessel)" stroke="none" stroke-width="2" opacity=".35"/>
  <path d="M300 280 Q230.0 207.0 160 150" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="160" cy="150" r="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M300 280 Q255.0 222.0 210 180" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="210" cy="180" r="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M300 280 Q215.0 282.0 130 300" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="130" cy="300" r="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M300 280 Q265.0 287.0 230 310" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
  <circle cx="230" cy="310" r="12" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="244" y="222" width="16" height="8" rx="2" fill="var(--warn)" stroke="none" stroke-width="2" transform="rotate(40 252 226)"/>
  <text x="250" y="120" class="small" style="fill:var(--vessel)">Roja, caliente</text>
  <text x="250" y="136" class="small" style="fill:var(--vessel)">y dolorosa</text>
  <text x="200" y="250" text-anchor="end" class="small" style="fill:var(--warn)">Conducto</text>
  <text x="200" y="266" text-anchor="end" class="small" style="fill:var(--warn)">obstruido</text>
  <text x="200" y="400" text-anchor="middle" class="small">Suele aparecer durante la lactancia</text>
  <text x="200" y="418" text-anchor="middle" class="small" style="fill:var(--muted)">por leche retenida o bacterias de la piel</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síntomas y cuidados</text>
  <text x="436" y="80" class="small">• Zona roja, hinchada y dolorosa</text>
  <text x="436" y="104" class="small">• Fiebre, escalofríos y malestar</text>
  <text x="436" y="128" class="small">• Sensación de gripe</text>
  <rect x="436" y="156" width="324" height="142" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="452" y="182" class="step">Qué ayuda</text>
  <text x="460" y="206" class="small">• Seguir amamantando con buen agarre</text>
  <text x="460" y="224" class="small">• Frío local y descanso</text>
  <text x="460" y="242" class="small">• Analgésico compatible con la lactancia</text>
  <text x="460" y="260" class="small">• Antibiótico si lo indica el médico</text>
  <text x="460" y="278" class="small">• Evitar masajes bruscos</text>
  <rect x="436" y="316" width="324" height="106" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="452" y="342" class="step" style="fill:var(--warn)">Consultar pronto si</text>
  <text x="460" y="366" class="small">• No mejora en uno o dos días</text>
  <text x="460" y="384" class="small">• Aparece un bulto blando (absceso)</text>
  <text x="460" y="402" class="small">• Fiebre alta o mal estado general</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
