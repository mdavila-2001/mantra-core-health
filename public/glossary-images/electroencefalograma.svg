  <text x="573" y="276" text-anchor="middle" class="small muted">Cada línea refleja un grupo de electrodos</text>
  <rect x="366" y="306" width="414" height="134" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="573.0" y="334" text-anchor="middle" class="title">Para qué sirve</text>
  <text x="384" y="358" class="lab">• Epilepsia y convulsiones</text>
  <text x="384" y="382" class="lab">• Alteraciones de la conciencia</text>
  <text x="384" y="406" class="lab">• Trastornos del sueño</text>
  <text x="764" y="358" text-anchor="end" class="lab">No duele</text>
