<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona el electroencefalograma</title>
  <desc id="d">Cabeza vista desde arriba con electrodos repartidos sobre el cuero cabelludo y un cable hacia el equipo. A la derecha, tres trazados de ondas cerebrales de distinta frecuencia y los usos principales de la prueba, que no duele ni aplica corriente.</desc>
