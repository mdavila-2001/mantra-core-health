<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">LDL colesterol: cómo contribuye a la placa</title>
  <desc id="d">A la izquierda, tres cortes de arteria: sana, con partículas LDL que entran en la pared y con una placa que estrecha la luz. A la derecha, un tubo de sangre del perfil de lípidos y listas de factores que elevan y que reducen el LDL.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Del LDL a la placa</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">La prueba y qué la modifica</text>
<text x="40" y="76" class="step">1 · Arteria sana</text>
<rect x="40" y="88" width="320" height="64" rx="22" fill="var(--organ-l)" stroke="var(--organ)"/>
<rect x="40" y="100" width="320" height="40" rx="14" fill="var(--panel)"/>
<circle cx="70" cy="120" r="7" fill="var(--warn)"/>
<circle cx="130" cy="120" r="7" fill="var(--warn)"/>
<circle cx="250" cy="120" r="7" fill="var(--warn)"/>
<circle cx="320" cy="120" r="7" fill="var(--warn)"/>
<text x="40" y="196" class="step">2 · El LDL entra en la pared</text>
<rect x="40" y="208" width="320" height="64" rx="22" fill="var(--organ-l)" stroke="var(--organ)"/>
<rect x="40" y="220" width="320" height="40" rx="14" fill="var(--panel)"/>
<circle cx="70" cy="240" r="7" fill="var(--warn)"/>
<circle cx="130" cy="240" r="7" fill="var(--warn)"/>
<circle cx="250" cy="240" r="7" fill="var(--warn)"/>
<circle cx="320" cy="240" r="7" fill="var(--warn)"/>
<circle cx="180" cy="214" r="6" fill="var(--warn)"/>
<circle cx="210" cy="212" r="6" fill="var(--warn)"/>
<circle cx="196" cy="217" r="6" fill="var(--warn)"/>
<text x="40" y="316" class="step">3 · Placa que estrecha la luz</text>
<rect x="40" y="328" width="320" height="64" rx="22" fill="var(--organ-l)" stroke="var(--organ)"/>
<rect x="40" y="340" width="320" height="40" rx="14" fill="var(--panel)"/>
<circle cx="70" cy="360" r="7" fill="var(--warn)"/>
<circle cx="130" cy="360" r="7" fill="var(--warn)"/>
<circle cx="250" cy="360" r="7" fill="var(--warn)"/>
<circle cx="320" cy="360" r="7" fill="var(--warn)"/>
<path d="M140 340 C170 368 230 368 260 340 Z" fill="var(--warn)" stroke="var(--organ)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="424" text-anchor="middle" class="small" style="fill:var(--muted)">Partículas LDL en amarillo</text>
<rect x="418" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M420 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M421.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="433" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<text x="470" y="92" class="lab">Se mide o se calcula en</text>
<text x="470" y="110" class="lab">el perfil de lípidos.</text>
<text x="470" y="136" class="lab">Es el principal objetivo</text>
<text x="470" y="154" class="lab">del tratamiento.</text>
<text x="416" y="214" class="h" style="fill:var(--bad)">Lo elevan</text>
<text x="606" y="214" class="h" style="fill:var(--ok)">Lo reducen</text>
<text x="416" y="242" class="lab">• Grasas saturadas</text>
<text x="416" y="266" class="lab">• Herencia familiar</text>
<text x="416" y="290" class="lab">• Hipotiroidismo</text>
<text x="416" y="314" class="lab">• Sobrepeso</text>
<text x="606" y="242" class="lab">• Dieta saludable</text>
<text x="606" y="266" class="lab">• Actividad física</text>
<text x="606" y="290" class="lab">• Estatinas y otros</text>
<text x="617" y="314" class="lab">fármacos</text>
<text x="416" y="380" class="small" style="fill:var(--muted)">La meta depende del riesgo</text>
<text x="416" y="398" class="small" style="fill:var(--muted)">cardiovascular de cada persona.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
