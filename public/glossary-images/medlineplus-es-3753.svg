<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mastectomía: estructuras y tipos</title>
  <desc id="d">Corte lateral de la mama con costillas, músculo pectoral, glándula, piel, pezón y ganglios axilares. A la derecha, los tipos de mastectomía según lo que se extirpa y la posibilidad de reconstrucción.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="340" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="190.0" y="50" text-anchor="middle" class="title">Estructuras de la mama</text>
<rect x="40" y="70" width="40" height="330" rx="6" fill="var(--bone)" stroke-width="1"/>
<text x="60" y="420" text-anchor="middle" class="small">Costillas</text>
<rect x="80" y="90" width="26" height="290" rx="6" fill="var(--vessel-l)" stroke="var(--organ-d)" stroke-width="1"/>
<text x="93" y="84" text-anchor="middle" class="small">Músculo</text>
<path d="M106,110 Q260,140 270,240 L284,246 L270,252 Q260,350 106,370 Z" fill="var(--beam)" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
<path d="M106,110 Q275,130 284,240 L296,246 L284,252 Q275,360 106,378" fill="none" stroke="var(--skin)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="290" cy="246" r="7" fill="var(--organ-d)" stroke="none" stroke-width="1"/>
<text x="300" y="232" class="small">Pezón</text>
<circle cx="170" cy="110" r="7" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
<circle cx="190" cy="96" r="7" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
<circle cx="210" cy="84" r="7" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
<text x="226" y="76" class="small">Ganglios axilares</text>
<text x="180" y="250" text-anchor="middle" class="lab">Glándula</text>
<text x="180" y="330" text-anchor="middle" class="small" style="fill:var(--muted)">Piel</text>
<rect x="376" y="20" width="404" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="578.0" y="50" text-anchor="middle" class="title">Tipos de mastectomía</text>
<rect x="396" y="58" width="364" height="50" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="410" y="79" class="step">Simple o total</text>
<text x="410" y="98" class="lab">glándula, piel, pezón y areola</text>
<rect x="396" y="118" width="364" height="50" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="410" y="139" class="step">Ahorradora de piel</text>
<text x="410" y="158" class="lab">conserva casi toda la piel</text>
<rect x="396" y="178" width="364" height="50" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="410" y="199" class="step">Ahorradora de pezón</text>
<text x="410" y="218" class="lab">conserva piel, pezón y areola</text>
<rect x="396" y="238" width="364" height="50" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="410" y="259" class="step">Radical modificada</text>
<text x="410" y="278" class="lab">total + ganglios de la axila</text>
<rect x="396" y="298" width="364" height="50" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="410" y="319" class="step">Profiláctica</text>
<text x="410" y="338" class="lab">para reducir riesgo hereditario</text>
<text x="396" y="374" class="lab">Puede hacerse reconstrucción en el</text>
<text x="396" y="394" class="lab">mismo acto o más adelante.</text>
<text x="396" y="420" class="small" style="fill:var(--muted)">La elección depende del tumor y la persona.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
