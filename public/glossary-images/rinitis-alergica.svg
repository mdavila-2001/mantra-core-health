<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Rinitis alérgica</title>
  <desc id="d">Cadena de la reacción: el alérgeno es reconocido por la IgE de los mastocitos, que liberan histamina y causan síntomas en minutos. Abajo, tres paneles con los síntomas, los desencadenantes y el tratamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">La reacción alérgica en la nariz</text>
<rect x="40" y="74" width="146" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="113.0" y="102.5" text-anchor="middle" class="lab" style="fill:var(--on)">Alérgeno</text>
<text x="113.0" y="118.5" text-anchor="middle" class="lab" style="fill:var(--on)">(polen, ácaros)</text>
<line x1="187" y1="106.0" x2="229" y2="106.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="232" y="74" width="146" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="305.0" y="102.5" text-anchor="middle" class="lab" style="fill:var(--on)">IgE en mastocitos</text>
<text x="305.0" y="118.5" text-anchor="middle" class="lab" style="fill:var(--on)">lo reconoce</text>
<line x1="379" y1="106.0" x2="421" y2="106.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="424" y="74" width="146" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="497.0" y="102.5" text-anchor="middle" class="lab" style="fill:var(--on)">Liberación de</text>
<text x="497.0" y="118.5" text-anchor="middle" class="lab" style="fill:var(--on)">histamina</text>
<line x1="571" y1="106.0" x2="613" y2="106.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="616" y="74" width="146" height="64" rx="8" fill="var(--accent)" stroke-width="1"/>
<text x="689.0" y="102.5" text-anchor="middle" class="lab" style="fill:var(--on)">Síntomas en</text>
<text x="689.0" y="118.5" text-anchor="middle" class="lab" style="fill:var(--on)">minutos</text>
<circle cx="115" cy="166" r="6" fill="var(--beam)" stroke="var(--warn)" stroke-width="1"/>
<circle cx="132" cy="176" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1"/>
<circle cx="100" cy="180" r="5" fill="var(--beam)" stroke="var(--warn)" stroke-width="1"/>
<circle cx="560" cy="170" r="5" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="580" cy="180" r="5" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="600" cy="168" r="5" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<text x="400" y="214" text-anchor="middle" class="lab" style="fill:var(--muted)">La mucosa se hincha y produce moco acuoso.</text>
<rect x="20" y="256" width="250" height="184" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="145.0" y="286" text-anchor="middle" class="title">Síntomas</text>
<text x="36" y="314" class="lab">• Estornudos en salva</text>
<text x="36" y="338" class="lab">• Moco claro</text>
<text x="36" y="362" class="lab">• Picor de nariz y ojos</text>
<text x="36" y="386" class="lab">• Congestión</text>
<rect x="286" y="256" width="240" height="184" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="406.0" y="286" text-anchor="middle" class="title">Desencadenantes</text>
<text x="302" y="314" class="lab">• Pólenes (estacional)</text>
<text x="302" y="338" class="lab">• Ácaros del polvo</text>
<text x="302" y="362" class="lab">• Epitelio de animales</text>
<text x="302" y="386" class="lab">• Hongos</text>
<rect x="542" y="256" width="238" height="184" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="661.0" y="286" text-anchor="middle" class="title">Tratamiento</text>
<text x="558" y="314" class="lab">• Evitar el alérgeno</text>
<text x="558" y="338" class="lab">• Lavados nasales</text>
<text x="558" y="362" class="lab">• Antihistamínicos</text>
<text x="558" y="386" class="lab">• Corticoide nasal</text>
<text x="558" y="410" class="lab">• Inmunoterapia</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
