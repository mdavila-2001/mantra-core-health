<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Geriatría</title>
  <desc id="d">A la izquierda, la valoración geriátrica integral: la persona mayor en el centro y cuatro áreas a su alrededor, clínica, funcional, mental y social. A la derecha, los síndromes geriátricos que atiende, como caídas, fragilidad, delirium o polifarmacia, y la forma de trabajo en equipo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Valoración geriátrica integral</text>
  <line x1="200" y1="240" x2="200" y2="106" stroke="var(--line)" stroke-width="2"/>
  <circle cx="200" cy="106" r="42" fill="var(--vessel)"/>
  <text x="200" y="111" text-anchor="middle" class="small" style="fill:var(--on)">Clínica</text>
  <line x1="200" y1="240" x2="330" y2="240" stroke="var(--line)" stroke-width="2"/>
  <circle cx="330" cy="240" r="42" fill="var(--ok)"/>
  <text x="330" y="245" text-anchor="middle" class="small" style="fill:var(--on)">Funcional</text>
  <line x1="200" y1="240" x2="200" y2="374" stroke="var(--line)" stroke-width="2"/>
  <circle cx="200" cy="374" r="42" fill="var(--purple)"/>
  <text x="200" y="379" text-anchor="middle" class="small" style="fill:var(--on)">Mental</text>
  <line x1="200" y1="240" x2="70" y2="240" stroke="var(--line)" stroke-width="2"/>
  <circle cx="70" cy="240" r="42" fill="var(--nerve)"/>
  <text x="70" y="245" text-anchor="middle" class="small" style="fill:var(--on)">Social</text>
  <circle cx="200" cy="240" r="50" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <text x="200" y="236" text-anchor="middle" class="step">Persona</text>
  <text x="200" y="254" text-anchor="middle" class="step">mayor</text>
  <text x="250" y="100" class="small muted">enfermedades,</text>
  <text x="250" y="116" class="small muted">fármacos</text>
  <text x="200" y="432" text-anchor="middle" class="small muted">Busca conservar la autonomía</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síndromes geriátricos</text>
  <rect x="436" y="66" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Caídas</text>
  <rect x="602" y="66" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="87.32" text-anchor="middle" class="small" style="fill:var(--ink)">Fragilidad</text>
  <rect x="436" y="110" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Delirium</text>
  <rect x="602" y="110" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="131.32" text-anchor="middle" class="small" style="fill:var(--ink)">Deterioro cognitivo</text>
  <rect x="436" y="154" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Polifarmacia</text>
  <rect x="602" y="154" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="175.32" text-anchor="middle" class="small" style="fill:var(--ink)">Incontinencia</text>
  <rect x="436" y="198" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="515.0" y="219.32" text-anchor="middle" class="small" style="fill:var(--ink)">Desnutrición</text>
  <rect x="602" y="198" width="158" height="34" rx="8" fill="var(--warn-l)"/>
  <text x="681.0" y="219.32" text-anchor="middle" class="small" style="fill:var(--ink)">Inmovilidad</text>
  <text x="436" y="268" class="step">Cómo trabaja</text>
  <text x="440" y="294" class="lab">• Equipo con enfermería y fisioterapia</text>
  <text x="440" y="318" class="lab">• Trabajo social y familia</text>
  <text x="440" y="342" class="lab">• Revisa y simplifica medicamentos</text>
  <text x="440" y="366" class="lab">• Planifica según lo que la persona valora</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
