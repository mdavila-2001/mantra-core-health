<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hernia de hiato</title>
  <desc id="d">A la izquierda, dos esquemas del esófago, el diafragma y el estómago: en el normal el estómago queda por debajo del diafragma; en la hernia de hiato una parte del estómago sube por encima del diafragma a través del orificio por el que pasa el esófago. A la derecha, síntomas como ardor y regurgitación y medidas que ayudan.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="500" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270.0" y="50" text-anchor="middle" class="title">Normal frente a hernia de hiato</text>
  <path d="M70 250 Q130 236 210 250" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
  <path d="M130 70 V250" stroke="var(--organ)" stroke-width="16"/>
  <path d="M122 250 C90 290 100 380 160 390 C210 392 230 330 200 280 C180 260 150 250 138 250 Z" fill="var(--organ)" opacity=".8"/>
  <path d="M310 250 Q370 236 450 250" fill="none" stroke="var(--warn)" stroke-width="10" stroke-linecap="round"/>
  <path d="M370 70 V160" stroke="var(--organ)" stroke-width="16"/>
  <path d="M362 160 C340 180 344 240 364 254 C330 300 340 380 400 390 C450 392 470 330 440 280 C420 260 390 254 376 254 C394 230 394 180 378 160 Z" fill="var(--organ)" opacity=".8"/>
  <ellipse cx="370" cy="206" rx="34" ry="52" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="130" y="416" text-anchor="middle" class="step">Normal</text>
  <text x="370" y="416" text-anchor="middle" class="step">Hernia de hiato</text>
  <text x="144" y="90" class="small">Esófago</text>
  <text x="210" y="240" class="small">Diafragma</text>
  <text x="160" y="330" text-anchor="middle" class="small">Estómago</text>
  <text x="412" y="200" class="small">Estómago</text>
  <text x="412" y="216" class="small">por encima</text>
  <text x="412" y="232" class="small">del diafragma</text>
  <rect x="540" y="20" width="240" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="660.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="560" y="62" class="step">Síntomas</text>
  <text x="560" y="88" class="small">• Ardor (pirosis)</text>
  <text x="560" y="110" class="small">• Regurgitación</text>
  <text x="560" y="132" class="small">• Dolor en el pecho</text>
  <text x="560" y="154" class="small">• Muchas veces nada</text>
  <text x="560" y="196" class="step">Qué ayuda</text>
  <text x="560" y="222" class="small">• Comidas pequeñas</text>
  <text x="560" y="244" class="small">• No acostarse tras comer</text>
  <text x="560" y="266" class="small">• Elevar la cabecera</text>
  <text x="560" y="288" class="small">• Bajar de peso</text>
  <text x="560" y="310" class="small">• Fármacos antiácidos</text>
  <text x="560" y="358" class="small muted">Se ve con endoscopia,</text>
  <text x="560" y="376" class="small muted">radiografía con contraste</text>
  <text x="560" y="394" class="small muted">o manometría</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
