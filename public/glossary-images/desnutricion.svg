<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Desnutrición: tipos, causas y señales</title>
  <desc id="d">A la izquierda, tres tipos de desnutrición: bajo peso para la talla, talla baja por retraso del crecimiento y carencias de vitaminas y minerales, con siluetas de distinto tamaño y los grupos más vulnerables. A la derecha, las causas, las señales y cómo se evalúa.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Tipos de desnutrición</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Causas y señales</text>
<rect x="40" y="70" width="320" height="64" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="40" y="70" width="10" height="64" rx="4" fill="var(--warn)"/>
<text x="66" y="98" class="step" style="fill:var(--warn)">Bajo peso</text>
<text x="66" y="118" class="small" style="fill:var(--muted)">para la talla</text>
<rect x="40" y="146" width="320" height="64" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="40" y="146" width="10" height="64" rx="4" fill="var(--purple)"/>
<text x="66" y="174" class="step" style="fill:var(--purple)">Talla baja</text>
<text x="66" y="194" class="small" style="fill:var(--muted)">retraso del crecimiento</text>
<rect x="40" y="222" width="320" height="64" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="40" y="222" width="10" height="64" rx="4" fill="var(--accent)"/>
<text x="66" y="250" class="step" style="fill:var(--accent)">Carencias</text>
<text x="66" y="270" class="small" style="fill:var(--muted)">de vitaminas y minerales</text>
<circle cx="270" cy="78.0" r="4.0" fill="var(--skin)" stroke="var(--line)"/>
