<text x="200" y="312" text-anchor="middle" class="small" style="fill:var(--muted)">También existe por exceso: sobrepeso</text>
<text x="200" y="328" text-anchor="middle" class="small" style="fill:var(--muted)">con carencias de nutrientes.</text>
<rect x="40" y="346" width="320" height="74" rx="10" fill="var(--warn-l)"/>
<text x="56" y="370" class="step">Más vulnerables</text>
<text x="56" y="392" class="small">Niños pequeños, embarazadas, adultos</text>
<text x="56" y="408" class="small">mayores y personas con enfermedades.</text>
<text x="416" y="76" class="h">Causas</text>
<text x="416" y="102" class="lab">• Poca comida o de mala calidad</text>
<text x="416" y="126" class="lab">• Enfermedades que impiden</text>
<text x="427" y="150" class="lab">comer o absorber</text>
<text x="416" y="174" class="lab">• Necesidades aumentadas</text>
<text x="416" y="220" class="h">Señales</text>
<text x="416" y="246" class="lab">• Pérdida de peso y de músculo</text>
<text x="416" y="270" class="lab">• Cansancio y debilidad</text>
<text x="416" y="294" class="lab">• Infecciones frecuentes</text>
<text x="416" y="318" class="lab">• Heridas que tardan en curar</text>
<text x="416" y="360" class="h">Se evalúa con</text>
<text x="416" y="384" class="lab">Peso, talla, curvas de crecimiento</text>
<text x="416" y="402" class="lab">y perímetro del brazo.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
