<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Trastorno temporomandibular</title>
  <desc id="d">A la izquierda, perfil de la cara con la articulación temporomandibular resaltada delante del oído, la mandíbula y el músculo masetero. A la derecha, los síntomas típicos como dolor, chasquidos y dificultad para abrir la boca, los factores que lo favorecen y las medidas con las que suele mejorar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">La articulación de la mandíbula</text>
  <path d="M80 80 C180 60 300 90 320 180 C330 230 300 260 280 270 L250 330 C240 360 200 380 160 370 L120 340 C90 300 70 200 80 80 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M180 250 C200 270 230 280 260 270 L250 330 C230 350 190 352 160 340 Z" fill="var(--bone)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M250 270 V200 C250 190 262 186 266 196" fill="none" stroke="var(--bone)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="262" cy="196" r="14" fill="var(--warn)" opacity=".7"/>
  <ellipse cx="220" cy="150" rx="46" ry="30" fill="var(--organ)" opacity=".5"/>
  <circle cx="290" cy="190" r="12" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <text x="296" y="120" class="step" style="fill:var(--warn)">ATM</text>
  <path d="M300 124 L268 186" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="104" text-anchor="middle" class="small">Músculo masetero</text>
  <text x="120" y="392" class="small">Mandíbula</text>
  <text x="310" y="210" class="small">Oído</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síntomas y cuidados</text>
  <text x="436" y="80" class="lab">• Dolor delante del oído o al masticar</text>
  <text x="436" y="106" class="lab">• Chasquidos al abrir la boca</text>
  <text x="436" y="132" class="lab">• Dificultad para abrir del todo</text>
  <text x="436" y="158" class="lab">• Dolor de cabeza o de cara</text>
  <text x="436" y="200" class="step">Factores</text>
  <text x="440" y="226" class="lab">• Apretar o rechinar los dientes</text>
  <text x="440" y="250" class="lab">• Estrés, malas posturas</text>
  <rect x="436" y="290" width="324" height="130" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="314" class="step" style="fill:var(--ok)">Suele mejorar con</text>
  <text x="456" y="340" class="small">• Dieta blanda y reposo mandibular</text>
  <text x="456" y="360" class="small">• Calor local y ejercicios suaves</text>
  <text x="456" y="380" class="small">• Férula de descarga nocturna</text>
  <text x="456" y="400" class="small">• Manejo del estrés</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
