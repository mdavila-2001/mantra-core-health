<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Epididimitis</title>
  <desc id="d">A la izquierda, corte esquemático de un lado del escroto con el testículo y el epidídimo hinchado, y una flecha que indica cómo las bacterias suben por el conducto deferente. A la derecha, las causas según la edad, los síntomas, el aviso de que un dolor muy brusco puede ser una torsión y el tratamiento con antibiótico.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Inflamación del epidídimo</text>
  <path d="M140 110 C120 200 110 330 230 380 C350 330 340 200 320 110 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="200" cy="260" rx="44" ry="62" fill="var(--organ)" opacity=".6"/>
  <path d="M240 200 C272 214 272 306 236 324" fill="none" stroke="var(--bad)" stroke-width="22" stroke-linecap="round" opacity=".8"/>
  <path d="M240 60 C240 120 250 160 246 196" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <path d="M300 70 L262 150" stroke="var(--purple)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="304" y="66" class="small">Bacterias que</text>
  <text x="304" y="82" class="small">suben por el conducto</text>
  <circle cx="180" cy="260" r="3" fill="var(--ink)"/>
  <path d="M180 260 L60 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="304" class="lab">Testículo</text>
  <circle cx="266" cy="280" r="3" fill="var(--ink)"/>
  <path d="M266 280 L330 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="334" y="304" class="lab">Epidídimo</text>
  <text x="334" y="320" class="small">hinchado</text>
  <text x="230" y="420" text-anchor="middle" class="small muted">Corte esquemático de un lado del escroto</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="480" y="62" class="step">Causas</text>
  <text x="480" y="88" class="small">• Jóvenes: ITS (clamidia, gonorrea)</text>
  <text x="480" y="110" class="small">• Mayores: infección urinaria</text>
  <text x="480" y="154" class="step">Síntomas</text>
  <text x="480" y="180" class="small">• Dolor que aumenta poco a poco</text>
  <text x="480" y="202" class="small">• Hinchazón y calor</text>
  <text x="480" y="224" class="small">• Fiebre, escozor al orinar</text>
  <rect x="480" y="262" width="280" height="64" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="620" y="286" text-anchor="middle" class="step">Dolor muy brusco</text>
  <text x="620" y="306" text-anchor="middle" class="small">urgencia: puede ser torsión</text>
  <rect x="480" y="342" width="280" height="72" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="620" y="366" text-anchor="middle" class="step">Tratamiento</text>
  <text x="620" y="386" text-anchor="middle" class="small">Antibiótico, reposo, frío</text>
  <text x="620" y="402" text-anchor="middle" class="small">y tratar a la pareja si es ITS</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
