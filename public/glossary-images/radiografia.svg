<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo se forma una radiografía</title>
  <desc id="d">A la izquierda, un tubo de rayos X emite un haz que atraviesa un brazo y llega a un detector digital. A la derecha, la imagen resultante: el hueso aparece blanco, los tejidos blandos grises y el aire negro.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --warn:#c0392b; --ok:#1f8a5b; --beam:#f2c46d; --violet:#7b5ea7; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --warn:#ef7467; --ok:#4cc38a; --beam:#8a6f2f; --violet:#b39ddb; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230" y="50" text-anchor="middle" class="title">Cómo se toma la imagen</text>
  <rect x="150" y="68" width="160" height="34" rx="8" fill="var(--accent)"/>
  <text x="230" y="90" text-anchor="middle" class="lab" style="fill:var(--on)">Tubo de rayos X</text>
  <polygon points="190,102 270,102 360,360 100,360" fill="var(--beam)" opacity=".45"/>
  <rect x="90" y="190" width="280" height="90" rx="40" fill="var(--tissue)" stroke="var(--line)"/>
  <rect x="120" y="222" width="220" height="26" rx="13" fill="var(--bone)"/>
  <circle cx="122" cy="235" r="18" fill="var(--bone)"/>
  <circle cx="338" cy="235" r="18" fill="var(--bone)"/>
  <text x="230" y="182" text-anchor="middle" class="lab">Brazo: piel, músculo y hueso</text>
  <rect x="90" y="360" width="280" height="30" rx="8" fill="var(--accent)"/>
  <text x="230" y="380" text-anchor="middle" class="lab" style="fill:var(--on)">Detector digital</text>
  <text x="230" y="420" text-anchor="middle" class="small muted">El hueso frena más rayos que los tejidos blandos</text>
  <path d="M440 230 H470" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
  <rect x="480" y="20" width="300" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630" y="50" text-anchor="middle" class="title">La imagen resultante</text>
  <rect x="510" y="70" width="240" height="190" rx="8" fill="#10161d"/>
  <rect x="530" y="110" width="200" height="110" rx="50" fill="#4a5561"/>
  <rect x="550" y="152" width="160" height="22" rx="11" fill="#eef2f6"/>
  <circle cx="552" cy="163" r="15" fill="#eef2f6"/>
  <circle cx="708" cy="163" r="15" fill="#eef2f6"/>
  <rect x="525" y="290" width="22" height="22" rx="4" fill="#eef2f6" stroke="var(--line)"/>
  <text x="557" y="306" class="lab">Blanco: hueso y metal</text>
  <rect x="525" y="324" width="22" height="22" rx="4" fill="#4a5561"/>
  <text x="557" y="340" class="lab">Gris: músculo, grasa, órganos</text>
  <rect x="525" y="358" width="22" height="22" rx="4" fill="#10161d" stroke="var(--line)"/>
  <text x="557" y="374" class="lab">Negro: aire</text>
  <text x="630" y="414" text-anchor="middle" class="small muted">Imagen plana: las estructuras se superponen</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
</svg>
