<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Glaucoma</title>
  <desc id="d">A la izquierda, corte del ojo con el cristalino, el drenaje del líquido bloqueado y el nervio óptico dañado por el aumento de presión. A la derecha, una escena en la que la visión periférica se oscurece y solo queda la visión central, junto a las pruebas para detectarlo: tonometría, fondo de ojo y campo visual.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Presión dentro del ojo</text>
  <circle cx="230" cy="230" r="140" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M100 160 Q80 230 100 300" fill="none" stroke="var(--accent)" stroke-width="6"/>
  <ellipse cx="140" cy="230" rx="22" ry="54" fill="var(--accent-l)" stroke="var(--accent)"/>
  <path d="M110 176 L124 196 M110 284 L124 264" stroke="var(--warn)" stroke-width="6"/>
  <path d="M370 230 C390 230 410 226 430 220" stroke="var(--beam)" stroke-width="16" fill="none"/>
  <circle cx="368" cy="230" r="14" fill="var(--bad)" opacity=".6"/>
  <path d="M124 200 C110 210 108 220 108 230" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="230" y="246" text-anchor="middle" class="small muted">Humor vítreo</text>
  <circle cx="140" cy="230" r="3" fill="var(--ink)"/>
  <path d="M140 230 L170 128" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="174" y="132" class="lab">Cristalino</text>
  <circle cx="112" cy="182" r="3" fill="var(--ink)"/>
  <path d="M112 182 L60 100" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="64" y="104" class="lab">Drenaje bloqueado</text>
  <circle cx="380" cy="226" r="3" fill="var(--ink)"/>
  <path d="M380 226 L330 396" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="326" y="400" text-anchor="end" class="lab">Nervio óptico dañado</text>
  <text x="60" y="424" class="small muted">El líquido no drena bien, la presión sube</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Efecto en la visión</text>
  <rect x="510" y="60" width="240" height="140" rx="10" fill="var(--accent-l)"/>
  <ellipse cx="630" cy="130" rx="70" ry="48" fill="var(--panel)"/>
  <rect x="510" y="60" width="240" height="140" rx="10" fill="none" stroke="var(--ink)" stroke-width="40" opacity=".55"/>
  <text x="630" y="134" text-anchor="middle" class="small">Visión central</text>
  <text x="630" y="222" text-anchor="middle" class="small">Se pierde primero la periferia</text>
  <text x="500" y="262" class="step">Cómo se detecta</text>
  <rect x="500" y="276" width="86" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="543.0" y="299.0" text-anchor="middle" class="small">Tonometría</text>
  <rect x="592" y="276" width="86" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="635.0" y="299.0" text-anchor="middle" class="small">Fondo de ojo</text>
  <rect x="684" y="276" width="86" height="36" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="727.0" y="299.0" text-anchor="middle" class="small">Campo visual</text>
  <text x="500" y="346" class="small">• Al principio no da síntomas</text>
  <text x="500" y="370" class="small">• Revisiones si hay riesgo</text>
  <text x="500" y="394" class="small">• Gotas, láser o cirugía</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
