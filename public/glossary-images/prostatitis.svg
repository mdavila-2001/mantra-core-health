<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prostatitis: localización y tipos</title>
  <desc id="d">Corte lateral de la pelvis masculina con la vejiga, la próstata inflamada que rodea la uretra y el recto detrás. A la derecha, los tipos de prostatitis, los síntomas y cuándo acudir a urgencias.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Dónde está la próstata</text>
<path d="M120,80 Q220,60 300,90 Q330,150 290,200 Q220,230 150,200 Q100,150 120,80 Z" fill="var(--beam)" stroke="var(--warn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
<text x="212" y="140" text-anchor="middle" class="step">Vejiga</text>
<ellipse cx="212" cy="240" rx="46" ry="32" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="2.5"/>
<path d="M212,206 L212,360" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="330" y="150" width="40" height="230" rx="18" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<text x="350" y="400" text-anchor="middle" class="small">Recto</text>
<text x="60" y="244" class="step">Próstata</text>
<text x="60" y="262" class="small" style="fill:var(--vessel)">inflamada</text>
<line x1="124" y1="240" x2="164" y2="240" stroke="var(--muted)" stroke-width="1.5"/>
<text x="222" y="330" class="small">Uretra</text>
<text x="212" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Rodea la uretra bajo la vejiga</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Tipos y síntomas</text>
<rect x="456" y="58" width="304" height="46" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="470" y="77" class="step">Bacteriana aguda</text>
<text x="470" y="95" class="lab">fiebre, escalofríos, urgencia</text>
<rect x="456" y="114" width="304" height="46" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="470" y="133" class="step">Bacteriana crónica</text>
<text x="470" y="151" class="lab">infecciones urinarias repetidas</text>
<rect x="456" y="170" width="304" height="46" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="470" y="189" class="step">Dolor pélvico crónico</text>
<text x="470" y="207" class="lab">la forma más frecuente</text>
<rect x="456" y="226" width="304" height="46" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="470" y="245" class="step">Asintomática</text>
<text x="470" y="263" class="lab">hallazgo en análisis</text>
<text x="456" y="300" class="lab">Dolor perineal, ardor y dificultad</text>
<text x="456" y="320" class="lab">para orinar, dolor al eyacular.</text>
<rect x="456" y="338" width="304" height="58" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="468" y="360" class="step" style="fill:var(--warn)">Urgencias si:</text>
<text x="468" y="384" class="lab">• Fiebre alta y no poder orinar</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
