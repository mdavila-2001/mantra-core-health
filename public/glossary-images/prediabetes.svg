<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prediabetes: un estado intermedio</title>
  <desc id="d">Una barra de tres zonas, de glucosa normal a prediabetes y a diabetes tipo 2, con las pruebas que la detectan. Abajo, los factores de riesgo y los cambios de hábitos que pueden revertirla.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="200" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Un estado intermedio</text>
<rect x="40" y="80" width="720" height="34" rx="17" fill="var(--ok-l)" stroke-width="1"/>
<rect x="40" y="80" width="240" height="34" rx="17" fill="var(--ok)" stroke-width="1"/>
<rect x="280" y="80" width="240" height="34" rx="0" fill="var(--beam)" stroke-width="1"/>
<rect x="520" y="80" width="240" height="34" rx="17" fill="var(--vessel)" stroke-width="1"/>
<text x="160" y="102" text-anchor="middle" class="step" style="fill:var(--on)">Glucosa normal</text>
<text x="400" y="102" text-anchor="middle" class="step" style="fill:var(--ink)">Prediabetes</text>
<text x="640" y="102" text-anchor="middle" class="step" style="fill:var(--on)">Diabetes tipo 2</text>
<path d="M400,124 L400,150" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="170" text-anchor="middle" class="lab">Glucosa por encima de lo normal, aún sin llegar a diabetes</text>
<text x="400" y="196" text-anchor="middle" class="small" style="fill:var(--muted)">Se detecta con glucemia en ayunas, hemoglobina glicada (HbA1c) o curva de glucosa.</text>
<rect x="20" y="236" width="370" height="204" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="266" text-anchor="middle" class="title">Más riesgo si</text>
<text x="36" y="286" class="lab">• Sobrepeso, sobre todo abdominal</text>
<text x="36" y="310" class="lab">• Poca actividad física</text>
<text x="36" y="334" class="lab">• Familiares con diabetes</text>
<text x="36" y="358" class="lab">• Diabetes gestacional previa</text>
<text x="36" y="382" class="lab">• Hipertensión o colesterol alto</text>
<rect x="406" y="236" width="374" height="204" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="266" text-anchor="middle" class="title">Se puede revertir</text>
<text x="422" y="286" class="lab">• Perder algo de peso ayuda mucho</text>
<text x="422" y="310" class="lab">• Unos 150 min de actividad por semana</text>
<text x="422" y="334" class="lab">• Más verdura, fibra y menos azúcar</text>
<text x="422" y="358" class="lab">• Dormir bien y no fumar</text>
<text x="422" y="382" class="lab">• Control de glucosa periódico</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
