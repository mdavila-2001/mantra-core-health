<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad mano-pie-boca</title>
  <desc id="d">Silueta de un niño con lesiones marcadas en la boca, las palmas de las manos y las plantas de los pies. A la derecha, el virus causante, cómo se contagia y los signos que obligan a consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="210.0" y="50" text-anchor="middle" class="title">Dónde aparecen las lesiones</text>
<path d="M150.0,137.5 Q112.5,140.0 107.5,178.8 L95.0,322.5 Q100.0,337.5 112.5,325.0 L122.5,197.5 L125.0,347.5 Q125.0,387.5 145.0,400.0 L255.0,400.0 Q275.0,387.5 275.0,347.5 L277.5,197.5 L287.5,325.0 Q300.0,337.5 305.0,322.5 L292.5,178.8 Q287.5,140.0 250.0,137.5 L215.0,132.5 L215.0,117.5 L185.0,117.5 L185.0,132.5 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="90.0" r="30.0" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="90" cy="325" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="98" cy="335" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="302" cy="330" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="310" cy="322" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="160" cy="404" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="170" cy="410" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="238" cy="408" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<circle cx="230" cy="402" r="5" fill="var(--vessel)" stroke="var(--on)" stroke-width="1"/>
<rect x="160" y="382" width="30" height="40" rx="10" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<rect x="210" y="382" width="30" height="40" rx="10" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<circle cx="166" cy="404" r="4" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="176" cy="412" r="4" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="226" cy="404" r="4" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="232" cy="412" r="4" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<ellipse cx="200" cy="106" rx="10" ry="5" fill="var(--vessel-l)" stroke="var(--vessel)" stroke-width="2"/>
<circle cx="194" cy="105" r="2" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<circle cx="206" cy="107" r="2" fill="var(--vessel)" stroke="none" stroke-width="1"/>
<text x="256" y="100" class="lab">Boca: llagas</text>
<line x1="212" y1="104" x2="250" y2="98" stroke="var(--muted)" stroke-width="1.5"/>
<text x="40" y="300" class="lab">Manos</text>
<text x="250" y="428" class="lab">Pies</text>
<rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="598.0" y="50" text-anchor="middle" class="title">Claves</text>
<text x="436" y="78" class="lab">• Virus (enterovirus, Coxsackie)</text>
<text x="436" y="100" class="lab">• Frecuente en menores de 5 años</text>
<text x="436" y="122" class="lab">• Fiebre, dolor de garganta, ampollitas</text>
<rect x="436" y="148" width="324" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="448" y="170" class="step">Se contagia por</text>
<text x="448" y="194" class="lab">• Saliva y gotitas respiratorias</text>
<text x="448" y="216" class="lab">• Contacto con ampollas</text>
<text x="448" y="238" class="lab">• Heces (pañales)</text>
<text x="436" y="272" class="step">Mejora sola en 7 a 10 días.</text>
<text x="436" y="294" class="lab">Lavado de manos y líquidos frecuentes.</text>
<rect x="436" y="310" width="324" height="100" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="448" y="332" class="step" style="fill:var(--warn)">Consultar pronto si:</text>
<text x="448" y="354" class="lab">• Bebe poco, orina muy poco</text>
<text x="448" y="376" class="lab">• Somnolencia, rigidez o convulsión</text>
<text x="448" y="398" class="lab">• Fiebre que dura más de 3 días</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
