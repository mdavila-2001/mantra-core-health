<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Chikungunya</title>
  <desc id="d">A la izquierda, el ciclo de transmisión: el mosquito Aedes pica a una persona infectada y luego transmite el virus a una persona sana. A la derecha, una silueta humana con las articulaciones dolorosas marcadas en manos, muñecas y tobillos, y recuadros con los síntomas: fiebre alta brusca, dolor articular, erupción y cansancio.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Cómo se transmite</text>
  <g transform="translate(210 110)"><ellipse cx="0" cy="0" rx="22" ry="7" fill="var(--ink)"/><circle cx="-26" cy="-2" r="7" fill="var(--ink)"/><path d="M-32 0 l-16 6" stroke="var(--ink)" stroke-width="2"/><ellipse cx="-2" cy="-16" rx="14" ry="6" fill="var(--accent-l)" opacity=".8" transform="rotate(-20)"/><ellipse cx="8" cy="-14" rx="14" ry="6" fill="var(--accent-l)" opacity=".8" transform="rotate(15)"/><path d="M-10 6 l-8 18 M0 6 l0 20 M10 6 l8 18" stroke="var(--ink)" stroke-width="1.5"/><path d="M-12 -4 h4 M0 -5 h4 M10 -4 h4" stroke="var(--panel)" stroke-width="2"/></g>
  <text x="210" y="150" text-anchor="middle" class="step">Mosquito Aedes</text>
  <text x="210" y="168" text-anchor="middle" class="small">pica sobre todo de día</text>
  <rect x="50" y="250" width="130" height="60" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="115" y="276" text-anchor="middle" class="step">Persona</text>
  <text x="115" y="294" text-anchor="middle" class="small">infectada</text>
  <rect x="240" y="250" width="130" height="60" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="305" y="276" text-anchor="middle" class="step">Persona</text>
  <text x="305" y="294" text-anchor="middle" class="small">sana</text>
  <path d="M130 244 L180 175" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M240 175 L290 244" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="110" y="205" text-anchor="end" class="small">Pica</text>
  <text x="300" y="205" class="small">Transmite</text>
  <text x="210" y="352" text-anchor="middle" class="small muted">No se contagia de persona a persona</text>
  <text x="210" y="390" text-anchor="middle" class="small">Prevención: repelente, mosquiteros</text>
  <text x="210" y="410" text-anchor="middle" class="small">y eliminar agua estancada</text>
  <rect x="420" y="20" width="360" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="600.0" y="50" text-anchor="middle" class="title">Síntomas principales</text>
  <g transform="translate(530 70) scale(0.95)" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5">
    <circle cx="0" cy="26" r="24"/>
    <rect x="-9" y="48" width="18" height="12"/>
    <path d="M-52 62 Q0 52 52 62 L56 200 Q0 214 -56 200 Z"/>
    <path d="M-52 64 Q-70 70 -74 120 L-80 200 Q-82 210 -72 210 L-64 130 L-56 100 Z"/>
    <path d="M52 64 Q70 70 74 120 L80 200 Q82 210 72 210 L64 130 L56 100 Z"/>
    <path d="M-54 198 L-50 320 Q-48 330 -36 330 L-28 330 L-6 214 Z"/>
    <path d="M54 198 L50 320 Q48 330 36 330 L28 330 L6 214 Z"/>
  </g>
  <circle cx="459.7" cy="255.2" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="600.3" cy="255.2" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="455.9" cy="241.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="604.1" cy="241.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="492.0" cy="374.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="568.0" cy="374.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="482.5" cy="260.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="577.5" cy="260.0" r="7" fill="var(--bad)" opacity=".7"/>
  <circle cx="530.0" cy="94.7" r="10" fill="var(--warn)" opacity=".7"/>
  <rect x="630" y="70" width="140" height="54" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="700" y="93" text-anchor="middle" class="step">Fiebre alta</text>
  <text x="700" y="111" text-anchor="middle" class="small">brusca</text>
  <rect x="630" y="140" width="140" height="70" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="700" y="163" text-anchor="middle" class="step">Dolor articular</text>
  <text x="700" y="181" text-anchor="middle" class="small">manos, muñecas,</text>
  <text x="700" y="197" text-anchor="middle" class="small">tobillos</text>
  <rect x="630" y="226" width="140" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="700" y="249" text-anchor="middle" class="step">Erupción</text>
  <text x="700" y="267" text-anchor="middle" class="small">en la piel</text>
  <rect x="630" y="296" width="140" height="54" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="700" y="319" text-anchor="middle" class="step">Cansancio</text>
  <text x="700" y="337" text-anchor="middle" class="small">y dolor muscular</text>
  <text x="600" y="400" text-anchor="middle" class="small muted">El dolor de las articulaciones</text>
  <text x="600" y="418" text-anchor="middle" class="small muted">puede durar meses</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
