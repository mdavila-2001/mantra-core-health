  <circle cx="120" cy="160" r="5" fill="var(--blood)"/>
  <circle cx="170" cy="150" r="5" fill="var(--dial)"/>
  <circle cx="200" cy="230" r="5" fill="var(--dial)"/>
  <circle cx="225" cy="270" r="5" fill="var(--dial)"/>
  <path d="M124 170 H170" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ak)"/>
  <path d="M124 215 H170" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ak)"/>
  <path d="M124 260 H170" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ak)"/>
  <circle cx="320" cy="125" r="5" fill="var(--blood)"/>
  <circle cx="340" cy="175" r="5" fill="var(--blood)"/>
  <circle cx="365" cy="140" r="5" fill="var(--blood)"/>
  <circle cx="375" cy="200" r="5" fill="var(--blood)"/>
  <circle cx="315" cy="240" r="5" fill="var(--blood)"/>
  <circle cx="380" cy="265" r="5" fill="var(--blood)"/>
  <circle cx="375" cy="285" r="5" fill="var(--blood)"/>
  <circle cx="385" cy="185" r="5" fill="var(--blood)"/>
  <path d="M296 118 V288" stroke="var(--bad)" stroke-width="3"/>
  <path d="M302 150 h18" stroke="var(--bad)" stroke-width="3" marker-end="url(#ax)"/>
  <path d="M302 200 h18" stroke="var(--bad)" stroke-width="3" marker-end="url(#ax)"/>
  <path d="M302 250 h18" stroke="var(--bad)" stroke-width="3" marker-end="url(#ax)"/>
  <path d="M412 151 C420 160 420 168 412 168 C404 168 404 160 412 151z" fill="var(--dial)"/>
  <path d="M445 191 C453 200 453 208 445 208 C437 208 437 200 445 191z" fill="var(--dial)"/>
  <path d="M430 241 C438 250 438 258 430 258 C422 258 422 250 430 241z" fill="var(--dial)"/>
  <path d="M475 121 C483 130 483 138 475 138 C467 138 467 130 475 121z" fill="var(--dial)"/>
  <path d="M480 261 C488 270 488 278 480 278 C472 278 472 270 480 261z" fill="var(--dial)"/>
