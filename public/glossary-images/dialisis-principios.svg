<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Difusión, ultrafiltración y convección en la diálisis</title>
  <desc id="d">Tres paneles que comparan el transporte a través de una membrana semipermeable. En la difusión, los solutos pequeños pasan del lado de mayor concentración al de menor. En la ultrafiltración, una diferencia de presión empuja el agua y los solutos quedan. En la convección, los solutos son arrastrados con el agua que atraviesa la membrana. Las moléculas grandes, como las proteínas, no atraviesan la membrana.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --blood:#d6453d; --blood-l:#f2a9a3; --dial:#2a7fb8; --dial-l:#a9d3ee; --mem:#8a6bbf; --ok:#1f8a5b; --warn:#b7791f; --bad:#c0392b; --soft:#eef2f7; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --blood:#e0584f; --blood-l:#7d3a36; --dial:#5aaee0; --dial-l:#27465c; --mem:#b79be6; --ok:#4cc38a; --warn:#e3b04b; --bad:#ef7467; --soft:#243140; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .lab { font-size: 14px; font-weight: 600; }
    .sm { font-size: 13px; }
  </style>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--ink)"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--muted)"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--blood)"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--dial)"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--ok)"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--warn)"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--bad)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="34" text-anchor="middle" class="title">Cómo atraviesan las sustancias la membrana</text>
  <rect x="20" y="56" width="240" height="326" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text x="140" y="84" text-anchor="middle" class="lab">Difusión</text>
  <rect x="32" y="108" width="102" height="190" rx="8" fill="var(--blood-l)" opacity=".45"/>
  <rect x="146" y="108" width="102" height="190" rx="8" fill="var(--dial-l)" opacity=".55"/>
  <path d="M140 104 V302" stroke="var(--mem)" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="80" y="324" text-anchor="middle" class="sm" style="fill:var(--blood)">Sangre</text>
  <text x="200" y="324" text-anchor="middle" class="sm" style="fill:var(--dial)">Dializado</text>
  <text x="140" y="98" text-anchor="middle" class="sm muted"></text>
  <text x="140" y="350" text-anchor="middle" class="sm muted">Los solutos van de donde hay</text>
  <text x="140" y="368" text-anchor="middle" class="sm muted">más a donde hay menos</text>
  <circle cx="82" cy="150" r="10" fill="var(--mem)"/>
  <circle cx="98" cy="262" r="10" fill="var(--mem)"/>
  <circle cx="70" cy="215" r="10" fill="var(--mem)"/>
  <rect x="280" y="56" width="240" height="326" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text x="400" y="84" text-anchor="middle" class="lab">Ultrafiltración</text>
  <rect x="292" y="108" width="102" height="190" rx="8" fill="var(--blood-l)" opacity=".45"/>
  <rect x="406" y="108" width="102" height="190" rx="8" fill="var(--dial-l)" opacity=".55"/>
  <path d="M400 104 V302" stroke="var(--mem)" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="340" y="324" text-anchor="middle" class="sm" style="fill:var(--blood)">Sangre</text>
  <text x="460" y="324" text-anchor="middle" class="sm" style="fill:var(--dial)">Dializado</text>
  <text x="400" y="98" text-anchor="middle" class="sm muted"></text>
  <text x="400" y="350" text-anchor="middle" class="sm muted">El agua pasa por una diferencia</text>
  <text x="400" y="368" text-anchor="middle" class="sm muted">de presión; los solutos quedan</text>
  <circle cx="342" cy="150" r="10" fill="var(--mem)"/>
  <circle cx="358" cy="262" r="10" fill="var(--mem)"/>
  <circle cx="330" cy="215" r="10" fill="var(--mem)"/>
  <rect x="540" y="56" width="240" height="326" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <text x="660" y="84" text-anchor="middle" class="lab">Convección</text>
  <rect x="552" y="108" width="102" height="190" rx="8" fill="var(--blood-l)" opacity=".45"/>
  <rect x="666" y="108" width="102" height="190" rx="8" fill="var(--dial-l)" opacity=".55"/>
  <path d="M660 104 V302" stroke="var(--mem)" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="600" y="324" text-anchor="middle" class="sm" style="fill:var(--blood)">Sangre</text>
  <text x="720" y="324" text-anchor="middle" class="sm" style="fill:var(--dial)">Dializado</text>
  <text x="660" y="98" text-anchor="middle" class="sm muted"></text>
  <text x="660" y="350" text-anchor="middle" class="sm muted">Los solutos viajan arrastrados</text>
  <text x="660" y="368" text-anchor="middle" class="sm muted">con el agua que cruza la membrana</text>
  <circle cx="602" cy="150" r="10" fill="var(--mem)"/>
  <circle cx="618" cy="262" r="10" fill="var(--mem)"/>
  <circle cx="590" cy="215" r="10" fill="var(--mem)"/>
  <circle cx="60" cy="125" r="5" fill="var(--blood)"/>
