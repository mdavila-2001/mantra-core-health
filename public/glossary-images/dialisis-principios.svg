  <path d="M384 230 H404" stroke="var(--dial)" stroke-width="2.5" marker-end="url(#ad)"/>
  <circle cx="580" cy="125" r="5" fill="var(--blood)"/>
  <circle cx="600" cy="175" r="5" fill="var(--blood)"/>
  <circle cx="625" cy="140" r="5" fill="var(--blood)"/>
  <circle cx="590" cy="240" r="5" fill="var(--blood)"/>
  <circle cx="630" cy="265" r="5" fill="var(--blood)"/>
  <circle cx="615" cy="285" r="5" fill="var(--blood)"/>
  <path d="M675 161 C683 170 683 178 675 178 C667 178 667 170 675 161z" fill="var(--dial)"/>
  <circle cx="692" cy="172" r="5" fill="var(--blood)"/>
  <path d="M644 170 H658" stroke="var(--dial)" stroke-width="2.5" marker-end="url(#ad)"/>
  <path d="M675 216 C683 225 683 233 675 233 C667 233 667 225 675 216z" fill="var(--dial)"/>
  <circle cx="692" cy="227" r="5" fill="var(--blood)"/>
  <circle cx="708" cy="227" r="5" fill="var(--blood)"/>
  <path d="M644 225 H658" stroke="var(--dial)" stroke-width="2.5" marker-end="url(#ad)"/>
  <path d="M675 256 C683 265 683 273 675 273 C667 273 667 265 675 256z" fill="var(--dial)"/>
  <circle cx="692" cy="267" r="5" fill="var(--blood)"/>
  <path d="M644 265 H658" stroke="var(--dial)" stroke-width="2.5" marker-end="url(#ad)"/>
  <circle cx="60" cy="410" r="5" fill="var(--blood)"/><text x="72" y="415" class="sm">Solutos pequeños (urea, potasio)</text>
  <circle cx="320" cy="410" r="9" fill="var(--mem)"/><text x="336" y="415" class="sm">Moléculas grandes (proteínas): no pasan</text>
  <path d="M640 401 C648 410 648 418 640 418 C632 418 632 410 640 401z" fill="var(--dial)"/>
  <text x="654" y="415" class="sm">Agua</text>
  <text x="400" y="445" text-anchor="middle" class="sm muted">La hemodiálisis usa sobre todo difusión; la hemofiltración, convección; la hemodiafiltración, ambas.</text>
  <text x="400" y="468" text-anchor="middle" class="sm muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
