<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Células madre</title>
  <desc id="d">A la izquierda, una célula madre que se divide: una hija se renueva y sigue siendo célula madre y otras se especializan en células de la sangre, del músculo o del nervio; debajo, los tipos de células madre. A la derecha, los pasos del trasplante de células madre hematopoyéticas, autólogo o alogénico, y una advertencia sobre terapias sin aval.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Dos propiedades</text>
  <circle cx="200" cy="120" r="34" fill="var(--purple)"/>
  <text x="200" y="125" text-anchor="middle" class="step" style="fill:var(--on)">Madre</text>
  <path d="M176 144 C140 170 120 190 110 210" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M224 144 C260 170 280 190 290 210" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="100" cy="240" r="24" fill="var(--purple)"/>
  <text x="100" y="286" text-anchor="middle" class="step">Se renueva</text>
  <text x="100" y="304" text-anchor="middle" class="small muted">sigue siendo madre</text>
  <circle cx="250" cy="240" r="16" fill="var(--vessel)"/>
  <circle cx="300" cy="236" r="16" fill="var(--nerve)"/>
  <circle cx="340" cy="250" r="16" fill="var(--ok)"/>
  <text x="300" y="286" text-anchor="middle" class="step">Se especializa</text>
  <text x="300" y="304" text-anchor="middle" class="small muted">sangre, músculo, nervio</text>
  <rect x="40" y="330" width="340" height="94" rx="10" fill="var(--tissue)"/>
  <text x="56" y="354" class="step">Tipos</text>
  <text x="60" y="378" class="small">• Embrionarias, adultas y reprogramadas (iPS)</text>
  <text x="60" y="400" class="small">• Hematopoyéticas: forman la sangre</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Trasplante hematopoyético</text>
  <circle cx="449" cy="80" r="13" fill="var(--accent)"/>
  <text x="449" y="85" text-anchor="middle" class="step" style="fill:var(--on)">1</text>
  <text x="470" y="85" class="lab">Obtener células madre</text>
  <circle cx="449" cy="122" r="13" fill="var(--accent)"/>
  <text x="449" y="127" text-anchor="middle" class="step" style="fill:var(--on)">2</text>
  <text x="470" y="127" class="lab">Quimio o radioterapia previa</text>
  <circle cx="449" cy="164" r="13" fill="var(--accent)"/>
  <text x="449" y="169" text-anchor="middle" class="step" style="fill:var(--on)">3</text>
  <text x="470" y="169" class="lab">Infusión por una vena</text>
  <circle cx="449" cy="206" r="13" fill="var(--accent)"/>
  <text x="449" y="211" text-anchor="middle" class="step" style="fill:var(--on)">4</text>
  <text x="470" y="211" class="lab">Anidan en la médula ósea</text>
  <circle cx="449" cy="248" r="13" fill="var(--accent)"/>
  <text x="449" y="253" text-anchor="middle" class="step" style="fill:var(--on)">5</text>
  <text x="470" y="253" class="lab">Nueva sangre y defensas</text>
  <rect x="436" y="296" width="324" height="52" rx="10" fill="var(--accent-l)"/>
  <text x="598" y="318" text-anchor="middle" class="small">Autólogo: del propio paciente</text>
  <text x="598" y="336" text-anchor="middle" class="small">Alogénico: de un donante compatible</text>
  <rect x="436" y="360" width="324" height="60" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="384" class="lab">Desconfiar de clínicas que ofrecen</text>
  <text x="452" y="404" class="lab">«curas» con células madre sin aval</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
