<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Testosterona total en sangre</title>
  <desc id="d">A la izquierda, una silueta humana con los órganos que producen testosterona, testículos u ovarios y suprarrenales, y un recuadro que muestra cómo viaja en la sangre: unida a SHBG, unida a albúmina o libre. A la derecha, un tubo de sangre y las situaciones que ayuda a estudiar la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">De dónde viene y cómo viaja</text>
  <circle cx="200" cy="76.12" r="14.879999999999999" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <path d="M173.96 98.44 Q200 91.0 226.04 98.44 L229.76 165.4 L218.6 169.12 L218.6 246.0 L203.72 246.0 L200 177.8 L196.28 246.0 L181.4 246.0 L181.4 169.12 L170.24 165.4 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M173.96 99.68 L159.07999999999998 165.4 L166.52 166.64 L176.44 122.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M226.04 99.68 L240.92000000000002 165.4 L233.48 166.64 L223.56 122.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="200" cy="176" rx="12" ry="8" fill="var(--accent)"/>
  <ellipse cx="186" cy="176" rx="6" ry="5" fill="var(--purple)"/>
  <ellipse cx="214" cy="176" rx="6" ry="5" fill="var(--purple)"/>
  <ellipse cx="194" cy="125" rx="8" ry="6" fill="var(--nerve)"/>
  <ellipse cx="206" cy="125" rx="8" ry="6" fill="var(--nerve)"/>
  <path d="M214 125 L290 96" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="294" y="100" class="small">Suprarrenales</text>
  <path d="M216 178 L290 160" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="294" y="156" class="small">Testículos</text>
  <text x="294" y="174" class="small">u ovarios</text>
  <rect x="44" y="268" width="332" height="140" rx="10" fill="var(--tissue)"/>
  <text x="60" y="290" class="small muted">En la sangre</text>
  <rect x="66" y="310" width="40" height="26" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <circle cx="86" cy="323" r="6" fill="var(--purple)"/>
  <rect x="120" y="310" width="40" height="26" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <circle cx="140" cy="323" r="6" fill="var(--purple)"/>
  <rect x="174" y="310" width="40" height="26" rx="12" fill="var(--accent-l)" stroke="var(--accent)"/>
  <circle cx="194" cy="323" r="6" fill="var(--purple)"/>
  <text x="136" y="360" text-anchor="middle" class="small">Unida a SHBG</text>
  <rect x="250" y="310" width="40" height="26" rx="12" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="270" cy="323" r="6" fill="var(--purple)"/>
  <rect x="300" y="310" width="40" height="26" rx="12" fill="var(--ok-l)" stroke="var(--ok)"/>
  <circle cx="320" cy="323" r="6" fill="var(--purple)"/>
  <text x="296" y="360" text-anchor="middle" class="small">Unida a albúmina</text>
  <circle cx="340" cy="390" r="6" fill="var(--purple)"/>
  <text x="326" y="395" text-anchor="end" class="small">Libre</text>
  <text x="60" y="395" class="step">Total = todas</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">La prueba de testosterona total</text>
  <rect x="438" y="64" width="34" height="16" rx="4" fill="var(--vessel)"/>
  <path d="M440 80 V144 a15 15 0 0 0 30 0 V80 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <path d="M442 110 V144 a13 13 0 0 0 26 0 V110 Z" fill="var(--vessel)"/>
  <text x="486" y="92" class="lab">Suero o plasma, mejor por la mañana</text>
  <text x="486" y="114" class="small muted">Mide la unida más la libre</text>
  <text x="436" y="196" class="step">Ayuda a estudiar</text>
  <text x="440" y="224" class="lab">• Hipogonadismo en el varón</text>
  <text x="440" y="250" class="lab">• Exceso de vello o ciclos irregulares</text>
  <text x="440" y="276" class="lab">• Pubertad adelantada o retrasada</text>
  <text x="440" y="302" class="lab">• Problemas de fertilidad</text>
  <text x="440" y="328" class="lab">• Control de tratamientos hormonales</text>
  <text x="598" y="380" text-anchor="middle" class="small muted">Si la SHBG está alterada,</text>
  <text x="598" y="398" text-anchor="middle" class="small muted">puede pedirse la testosterona libre</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
