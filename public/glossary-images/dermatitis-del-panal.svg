<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Causas y cuidados de la dermatitis del pañal</title>
  <desc id="d">Esquema de un pañal con la zona irritada y cuatro factores que dañan la piel: humedad, fricción, contacto con orina y heces, y calor por oclusión. A la derecha, medidas de prevención como cambiar el pañal a menudo y usar crema barrera, y cuándo consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Dermatitis del pañal: qué la causa y cómo prevenirla</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="88" text-anchor="middle" class="h">Factores que dañan la piel</text>
  <path d="M110 170 L290 170 C300 260 260 330 200 340 C140 330 100 260 110 170 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <ellipse cx="160" cy="220" rx="26" ry="16" fill="var(--red)" stroke="none" opacity=".35"/>
  <ellipse cx="240" cy="220" rx="26" ry="16" fill="var(--red)" stroke="none" opacity=".35"/>
  <ellipse cx="200" cy="254" rx="22" ry="12" fill="var(--red)" stroke="none" opacity=".35"/>
  <text x="200" y="290" text-anchor="middle" class="small b">Zona del pañal</text>
  <text x="70" y="130" text-anchor="middle" class="lab">Humedad</text>
  <text x="330" y="130" text-anchor="middle" class="lab">Fricción</text>
  <text x="70" y="390" text-anchor="middle" class="lab">Orina y heces</text>
  <text x="330" y="390" text-anchor="middle" class="lab">Calor y oclusión</text>
  <line x1="90" y1="140" x2="140" y2="190" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="310" y1="140" x2="260" y2="190" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="100" y1="376" x2="150" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="300" y1="376" x2="250" y2="300" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="200" y="428" text-anchor="middle" class="small muted">La barrera de la piel se debilita y se irrita</text>
  <rect x="416" y="60" width="364" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="88" text-anchor="middle" class="h">Prevención y cuidado</text>
  <text x="434" y="110" class="small">• Cambiar el pañal a menudo</text>
  <text x="434" y="136" class="small">• Limpiar con agua tibia, sin frotar</text>
  <text x="434" y="162" class="small">• Secar bien con toques</text>
  <text x="434" y="188" class="small">• Crema barrera (óxido de zinc)</text>
  <text x="434" y="214" class="small">• Ratos sin pañal</text>
  <text x="434" y="240" class="small">• Evitar toallitas con perfume</text>
  <rect x="416" y="296" width="364" height="144" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="430" y="320" class="lab b" style="fill:var(--red)">Consultar si aparecen</text>
  <text x="430" y="344" class="small">• Granos con pus o ampollas</text>
  <text x="430" y="366" class="small">• Fiebre</text>
  <text x="430" y="388" class="small">• Lesiones fuera del pañal</text>
  <text x="430" y="410" class="small">• Sin mejoría en pocos días</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
