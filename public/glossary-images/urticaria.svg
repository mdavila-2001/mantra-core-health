<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mecanismo de la urticaria y el angioedema</title>
  <desc id="d">Corte de la piel con un mastocito que libera histamina en la dermis, un habón elevado en la superficie y una zona de angioedema más profunda en el tejido subcutáneo. A la derecha, los desencadenantes habituales y las señales de urgencia de una posible anafilaxia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Urticaria: habones por liberación de histamina</text>
  <rect x="20" y="60" width="440" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="88" text-anchor="middle" class="title">Corte de la piel</text>
  <path d="M40 140 L150 140 C170 110 230 110 250 140 L440 140" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <path d="M40 140 L150 140 C170 110 230 110 250 140 L440 140 L440 170 L40 170 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <rect x="40" y="170" width="400" height="100" rx="0" fill="var(--organ)" stroke="none" opacity=".4"/>
  <rect x="40" y="270" width="400" height="120" rx="0" fill="var(--beam)" stroke="none" opacity=".4"/>
  <ellipse cx="200" cy="160" rx="60" ry="22" fill="var(--red)" stroke="none" opacity=".3"/>
  <circle cx="120" cy="220" r="18" fill="var(--pur-l)" stroke="var(--pur)"/>
  <circle cx="140" cy="200" r="3" fill="var(--pur)" stroke="none"/>
  <circle cx="150" cy="216" r="3" fill="var(--pur)" stroke="none"/>
  <circle cx="146" cy="236" r="3" fill="var(--pur)" stroke="none"/>
  <circle cx="160" cy="190" r="3" fill="var(--pur)" stroke="none"/>
  <circle cx="170" cy="210" r="3" fill="var(--pur)" stroke="none"/>
  <line x1="120" y1="238" x2="100" y2="300" stroke="var(--muted)" stroke-width="1"/>
  <text x="60" y="316" class="small b">Mastocito</text>
  <text x="60" y="332" class="small">libera histamina</text>
  <line x1="230" y1="128" x2="290" y2="118" stroke="var(--muted)" stroke-width="1"/>
  <text x="294" y="122" class="small b">Habón: roncha</text>
  <ellipse cx="340" cy="300" rx="60" ry="40" fill="var(--accent)" stroke="none" opacity=".25"/>
  <line x1="380" y1="290" x2="410" y2="360" stroke="var(--muted)" stroke-width="1"/>
  <text x="410" y="376" text-anchor="middle" class="small b">Angioedema:</text>
  <text x="410" y="392" text-anchor="middle" class="small">más profundo</text>
  <text x="60" y="196" class="small muted">Dermis</text>
  <text x="60" y="292" class="small muted">Tejido subcutáneo</text>
  <text x="240" y="428" text-anchor="middle" class="small muted">Cada habón dura menos de 24 horas</text>
  <rect x="476" y="60" width="304" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="628.0" y="88" text-anchor="middle" class="h">Desencadenantes</text>
  <text x="494" y="110" class="small">• Infecciones virales</text>
  <text x="494" y="138" class="small">• Alimentos o fármacos</text>
  <text x="494" y="166" class="small">• Picaduras</text>
  <text x="494" y="194" class="small">• Frío, presión, calor</text>
  <text x="494" y="222" class="small">• A menudo sin causa clara</text>
  <rect x="476" y="276" width="304" height="164" rx="10" fill="var(--red-l)" stroke="var(--red)"/>
  <text x="490" y="300" class="lab b" style="fill:var(--red)">Urgencias si</text>
  <text x="490" y="324" class="small">• Hinchazón de lengua o garganta</text>
  <text x="490" y="346" class="small">• Dificultad para respirar</text>
  <text x="490" y="368" class="small">• Mareo o desmayo</text>
  <text x="490" y="390" class="small">• Puede ser anafilaxia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
