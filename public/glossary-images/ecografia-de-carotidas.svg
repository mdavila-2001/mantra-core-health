<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ecografía de carótidas (dúplex)</title>
  <desc id="d">A la izquierda, una persona con la arteria carótida dibujada en el cuello y una sonda de ecografía apoyada sobre él. A la derecha, una imagen ecográfica esquemática de la arteria con una placa que estrecha su luz y el flujo de sangre en color, y la lista de lo que valora la prueba.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">La exploración</text>
  <circle cx="200" cy="110" r="46" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M160 150 L150 260 H250 L240 150" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M120 270 C160 250 240 250 280 270 L300 420 H100 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="2"/>
  <path d="M178 156 V258" fill="none" stroke="var(--vessel)" stroke-width="6"/>
  <path d="M178 200 L172 160 M178 200 L186 160" fill="none" stroke="var(--vessel)" stroke-width="4"/>
  <g transform="rotate(-60 136 218)">
  <rect x="122" y="168" width="28" height="46" rx="8" fill="var(--accent)"/>
  <rect x="116" y="212" width="40" height="12" rx="4" fill="var(--ink)"/>
  </g>
  <text x="260" y="190" class="small" style="fill:var(--vessel)">Arteria</text>
  <text x="260" y="206" class="small" style="fill:var(--vessel)">carótida</text>
  <path d="M256 196 L184 196" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="70" y="300" class="small">Sonda con gel</text>
  <text x="200" y="400" text-anchor="middle" class="small muted">Sin radiación ni pinchazos</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Lo que muestra (dúplex)</text>
  <rect x="416" y="66" width="344" height="130" rx="10" fill="var(--ink)" opacity=".88"/>
  <path d="M430 110 H740 M430 160 H740" fill="none" stroke="var(--bone)" stroke-width="4"/>
  <path d="M560 160 C580 140 620 140 640 160 Z" fill="var(--nerve)"/>
  <path d="M440 135 H550 M650 135 H730" fill="none" stroke="var(--vessel)" stroke-width="10" opacity=".55"/>
  <path d="M560 132 H640" fill="none" stroke="var(--warn)" stroke-width="4" opacity=".9"/>
  <text x="600" y="186" text-anchor="middle" class="small" style="fill:var(--on)">Placa que estrecha la luz</text>
  <text x="436" y="230" class="step">Imagen + Doppler</text>
  <text x="440" y="256" class="lab">• Grosor de la pared</text>
  <text x="440" y="280" class="lab">• Placas de ateroma</text>
  <text x="440" y="304" class="lab">• Velocidad del flujo de sangre</text>
  <text x="440" y="328" class="lab">• Grado de estrechamiento</text>
  <rect x="416" y="360" width="344" height="60" rx="10" fill="var(--accent-l)"/>
  <text x="588" y="386" text-anchor="middle" class="lab">Ayuda a valorar el riesgo de ictus</text>
  <text x="588" y="406" text-anchor="middle" class="small">y a decidir el tratamiento</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
