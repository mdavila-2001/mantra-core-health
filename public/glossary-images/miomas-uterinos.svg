<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Miomas uterinos</title>
  <desc id="d">A la izquierda, el útero con las trompas y los ovarios y tres miomas en distintas posiciones: subseroso hacia fuera, intramural en la pared y submucoso hacia la cavidad. A la derecha, síntomas, diagnóstico y opciones de tratamiento.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Dónde pueden crecer</text>
  <path d="M140 150 C140 110 320 110 320 150 C320 230 270 270 254 310 L254 350 H206 L206 310 C190 270 140 230 140 150 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M180 160 C180 140 280 140 280 160 C280 210 240 250 230 290 C220 250 180 210 180 160 Z" fill="var(--skin)" stroke="var(--organ-d)" stroke-width="1"/>
  <path d="M140 140 C100 120 80 140 70 160 M320 140 C360 120 380 140 390 160" fill="none" stroke="var(--organ-d)" stroke-width="5"/>
  <ellipse cx="62" cy="170" rx="14" ry="10" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <ellipse cx="398" cy="170" rx="14" ry="10" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <circle cx="230" cy="98" r="22" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <circle cx="306" cy="200" r="20" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <circle cx="200" cy="180" r="16" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <text x="230" y="74" text-anchor="middle" class="small" style="fill:var(--violet)">Subseroso (hacia fuera)</text>
  <text x="400" y="190" text-anchor="end" class="small" style="fill:var(--violet)">Intramural</text>
  <text x="400" y="206" text-anchor="end" class="small" style="fill:var(--violet)">(en la pared)</text>
  <text x="60" y="262" class="small" style="fill:var(--violet)">Submucoso</text>
  <text x="60" y="278" class="small" style="fill:var(--violet)">(hacia dentro)</text>
  <line x1="120" y1="256" x2="190" y2="192" stroke="var(--violet)" stroke-width="1"/>
  <text x="230" y="380" text-anchor="middle" class="small" style="fill:var(--muted)">Cuello uterino</text>
  <text x="230" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Tumores benignos del músculo del útero</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Síntomas y opciones</text>
  <text x="476" y="80" class="small">• Muchos no dan síntomas</text>
  <text x="476" y="102" class="small">• Reglas abundantes o largas</text>
  <text x="476" y="124" class="small">• Anemia y cansancio</text>
  <text x="476" y="146" class="small">• Dolor o presión en la pelvis</text>
  <text x="476" y="168" class="small">• Orinar con frecuencia</text>
  <text x="476" y="210" class="step">Diagnóstico</text>
  <text x="476" y="232" class="small">Exploración y ecografía</text>
  <rect x="476" y="256" width="284" height="166" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="492" y="282" class="step">Tratamiento según el caso</text>
  <text x="500" y="306" class="small">• Vigilancia si no molestan</text>
  <text x="500" y="324" class="small">• Medicamentos para el sangrado</text>
  <text x="500" y="342" class="small">• Extirpar el mioma</text>
  <text x="500" y="360" class="small">• Embolización de sus arterias</text>
  <text x="500" y="378" class="small">• Extirpar el útero en algunos casos</text>
  <text x="500" y="396" class="small">• Suelen reducirse tras la menopausia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
