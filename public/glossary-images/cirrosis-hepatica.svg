<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cirrosis hepática</title>
  <desc id="d">A la izquierda, un hígado sano de superficie lisa y, tras años de daño por alcohol, hepatitis o hígado graso, un hígado cirrótico más pequeño, lleno de nódulos y cicatriz. A la derecha, las consecuencias: hipertensión portal con várices, ascitis, ictericia, encefalopatía y mayor riesgo de cáncer de hígado.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Del hígado sano a la cirrosis</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Consecuencias</text>
<path d="M40 120 C40 86 100 74 160 78 C200 80 220 92 220 110 C220 140 190 160 150 176 C110 190 70 190 54 172 C44 160 40 140 40 120 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="130" y="206" text-anchor="middle" class="small" style="fill:var(--ok)">Sano: liso</text>
<path d="M210 280 C206 250 250 234 300 238 C340 240 360 256 356 280 C352 306 330 320 300 332 C270 344 230 344 220 326 C212 312 212 296 210 280 Z" fill="var(--warn-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="240" cy="260" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="270" cy="252" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="300" cy="258" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="330" cy="268" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="250" cy="292" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="284" cy="286" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="318" cy="296" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="262" cy="320" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<circle cx="296" cy="318" r="11" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
<text x="284" y="362" text-anchor="middle" class="small" style="fill:var(--bad)">Cirrosis: nódulos y cicatriz</text>
<line x1="150" y1="220" x2="220" y2="250" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="40" y="250" class="lab">Daño durante años:</text>
<text x="40" y="270" class="small" style="fill:var(--muted)">alcohol, hepatitis,</text>
<text x="40" y="286" class="small" style="fill:var(--muted)">hígado graso</text>
<text x="40" y="404" class="small" style="fill:var(--muted)">La fibrosis reemplaza al tejido sano</text>
<text x="40" y="420" class="small" style="fill:var(--muted)">y frena la sangre que entra al hígado.</text>
<rect x="416" y="70" width="8" height="46" rx="3" fill="var(--vessel)"/>
<text x="436" y="90" class="step">Hipertensión portal</text>
<text x="436" y="110" class="small" style="fill:var(--muted)">várices y sangrado</text>
<rect x="416" y="134" width="8" height="46" rx="3" fill="var(--accent)"/>
<text x="436" y="154" class="step">Ascitis</text>
<text x="436" y="174" class="small" style="fill:var(--muted)">líquido en el abdomen</text>
<rect x="416" y="198" width="8" height="46" rx="3" fill="var(--yellow)"/>
<text x="436" y="218" class="step">Ictericia</text>
<text x="436" y="238" class="small" style="fill:var(--muted)">piel y ojos amarillos</text>
<rect x="416" y="262" width="8" height="46" rx="3" fill="var(--purple)"/>
<text x="436" y="282" class="step">Encefalopatía</text>
<text x="436" y="302" class="small" style="fill:var(--muted)">confusión y somnolencia</text>
<rect x="416" y="326" width="8" height="46" rx="3" fill="var(--bad)"/>
<text x="436" y="346" class="step">Mayor riesgo</text>
<text x="436" y="366" class="small" style="fill:var(--muted)">de cáncer de hígado</text>
<text x="416" y="410" class="small" style="fill:var(--muted)">Tratar la causa puede frenar el avance.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
