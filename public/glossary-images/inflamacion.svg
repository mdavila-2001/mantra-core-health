<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Qué ocurre en una inflamación</title>
  <desc id="d">En el centro, un tejido con una pequeña lesión: los vasos se dilatan, sale líquido y los glóbulos blancos acuden al foco. Alrededor, los cinco signos clásicos: enrojecimiento, calor, hinchazón, dolor y pérdida de función.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --red:#c0392b; --red-l:#f3c9c3; --blue:#2f6fc0; --ok:#1f8a5b; --warn:#c77d12; --plasma:#f2d77a; --tissue:#e9edf2; --organ:#a8473b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --red:#ef7467; --red-l:#5a2b28; --blue:#79a8ea; --ok:#4cc38a; --warn:#e2a54a; --plasma:#8a7432; --tissue:#2a3541; --organ:#c4685c; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="500" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270" y="50" text-anchor="middle" class="title">En el tejido lesionado</text>
  <rect x="40" y="70" width="460" height="300" rx="10" fill="var(--tissue)"/>
  <path d="M40 100 H500" stroke="var(--line)" stroke-width="2"/>
  <text x="50" y="92" class="small muted">Piel</text>
  <path d="M250 100 l-10 40 l14 -6 l-8 30" fill="none" stroke="var(--ink)" stroke-width="2.5"/>
  <text x="270" y="130" class="small">Lesión o microbio</text>
  <rect x="40" y="250" width="460" height="56" fill="var(--red-l)"/>
  <path d="M40 250 H500 M40 306 H500" stroke="var(--red)" stroke-width="3"/>
  <text x="50" y="324" class="small muted">Vaso sanguíneo dilatado</text>
  <ellipse cx="90" cy="278" rx="12" ry="7" fill="var(--red)"/>
  <ellipse cx="420" cy="282" rx="12" ry="7" fill="var(--red)"/>
  <circle cx="180" cy="278" r="11" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="230" cy="215" r="11" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="275" cy="180" r="11" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M188 268 L224 226 M238 205 L266 190" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="300" y="220" class="lab" style="fill:var(--accent)">Glóbulos blancos</text>
  <text x="300" y="238" class="lab" style="fill:var(--accent)">acuden al foco</text>
  <g fill="var(--blue)" opacity=".6"><circle cx="340" cy="244" r="4"/><circle cx="360" cy="236" r="4"/><circle cx="380" cy="244" r="4"/><circle cx="350" cy="226" r="4"/></g>
  <text x="400" y="200" class="small">Sale líquido:</text>
  <text x="400" y="216" class="small">hinchazón</text>
  <text x="270" y="400" text-anchor="middle" class="lab">Mediadores químicos dilatan los vasos y</text>
  <text x="270" y="420" text-anchor="middle" class="lab">sensibilizan los nervios</text>

  <rect x="536" y="20" width="244" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="658" y="50" text-anchor="middle" class="title">Signos clásicos</text>
  <circle cx="566" cy="94" r="12" fill="var(--red)"/>
  <text x="588" y="90" class="step">Enrojecimiento</text>
  <text x="588" y="108" class="small muted">rubor · llega más sangre</text>
  <circle cx="566" cy="162" r="12" fill="var(--warn)"/>
  <text x="588" y="158" class="step">Calor</text>
  <text x="588" y="176" class="small muted">calor · mayor flujo</text>
  <circle cx="566" cy="230" r="12" fill="var(--blue)"/>
  <text x="588" y="226" class="step">Hinchazón</text>
  <text x="588" y="244" class="small muted">tumor · sale líquido</text>
  <circle cx="566" cy="298" r="12" fill="var(--accent)"/>
  <text x="588" y="294" class="step">Dolor</text>
  <text x="588" y="312" class="small muted">dolor · nervios sensibles</text>
  <circle cx="566" cy="366" r="12" fill="var(--muted)"/>
  <text x="588" y="362" class="step">Pérdida de función</text>
  <text x="588" y="380" class="small muted">cuesta mover la zona</text>
  <text x="658" y="420" text-anchor="middle" class="small muted">Defensa útil si se apaga a tiempo</text>

  <text x="400" y="464" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
