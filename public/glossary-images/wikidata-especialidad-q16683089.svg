<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Oncología endocrina</title>
  <desc id="d">A la izquierda, una silueta humana con las glándulas endocrinas donde pueden aparecer tumores: hipófisis, tiroides, paratiroides, suprarrenales y páncreas, además del pulmón y el intestino, donde surgen tumores neuroendocrinos. A la derecha, que estos tumores pueden producir hormonas, que existen síndromes hereditarios y el equipo que los trata.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="440" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="240.0" y="50" text-anchor="middle" class="title">Glándulas donde nacen los tumores</text>
  <g transform="translate(240 60) scale(1.12)" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5">
    <circle cx="0" cy="26" r="24"/>
    <rect x="-9" y="48" width="18" height="12"/>
    <path d="M-52 62 Q0 52 52 62 L56 200 Q0 214 -56 200 Z"/>
    <path d="M-52 64 Q-70 70 -74 120 L-80 200 Q-82 210 -72 210 L-64 130 L-56 100 Z"/>
    <path d="M52 64 Q70 70 74 120 L80 200 Q82 210 72 210 L64 130 L56 100 Z"/>
    <path d="M-54 198 L-50 320 Q-48 330 -36 330 L-28 330 L-6 214 Z"/>
    <path d="M54 198 L50 320 Q48 330 36 330 L28 330 L6 214 Z"/>
  </g>
  <circle cx="240.0" cy="93.6" r="6" fill="var(--purple)"/>
  <path d="M240.0 93.6 L130 80" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="126" y="84" text-anchor="end" class="small">Hipófisis</text>
  <circle cx="233.3" cy="122.7" r="6" fill="var(--purple)"/>
  <path d="M233.3 122.7 L130 130" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="126" y="134" text-anchor="end" class="small">Tiroides</text>
  <circle cx="246.7" cy="118.2" r="6" fill="var(--purple)"/>
  <path d="M246.7 118.2 L340 110" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="344" y="114" class="small">Paratiroides</text>
  <circle cx="213.1" cy="163.0" r="6" fill="var(--purple)"/>
  <path d="M213.1 163.0 L130 190" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="126" y="194" text-anchor="end" class="small">Pulmón</text>
  <circle cx="264.6" cy="216.8" r="6" fill="var(--purple)"/>
  <path d="M264.6 216.8 L340 180" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="344" y="184" class="small">Suprarrenales</text>
  <circle cx="244.5" cy="228.0" r="6" fill="var(--purple)"/>
  <path d="M244.5 228.0 L340 240" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="344" y="244" class="small">Páncreas</text>
  <circle cx="226.6" cy="261.6" r="6" fill="var(--purple)"/>
  <path d="M226.6 261.6 L130 260" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="126" y="264" text-anchor="end" class="small">Intestino</text>
  <text x="240" y="440" text-anchor="middle" class="small muted">Los neuroendocrinos pueden surgir en pulmón e intestino</text>
  <rect x="480" y="20" width="300" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="630.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="500" y="74" class="step">Pueden producir hormonas</text>
  <text x="500" y="94" class="small">y dar síntomas por exceso:</text>
  <text x="500" y="118" class="small">• Sofocos, diarrea</text>
  <text x="500" y="140" class="small">• Tensión alta, palpitaciones</text>
  <text x="500" y="162" class="small">• Azúcar baja</text>
  <text x="500" y="212" class="step">Síndromes hereditarios</text>
  <text x="500" y="232" class="small">Algunas familias tienen varios</text>
  <text x="500" y="250" class="small">tumores endocrinos (MEN)</text>
  <text x="500" y="296" class="step">Equipo</text>
  <rect x="500" y="310" width="128" height="34" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="564.0" y="332.0" text-anchor="middle" class="small">Endocrinología</text>
  <rect x="636" y="310" width="128" height="34" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="700.0" y="332.0" text-anchor="middle" class="small">Cirugía</text>
  <rect x="500" y="354" width="128" height="34" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="564.0" y="376.0" text-anchor="middle" class="small">Oncología</text>
  <rect x="636" y="354" width="128" height="34" rx="10" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="700.0" y="376.0" text-anchor="middle" class="small">Medicina nuclear</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
