<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Quién accede a la historia clínica y con qué principios</title>
  <desc id="d">Círculos concéntricos: en el centro el paciente y su equipo asistencial, con acceso pleno según su función; en el anillo medio los servicios de apoyo con acceso limitado; en el externo los usos secundarios como investigación y gestión, con datos anonimizados o autorización. A la derecha, los principios de mínimo necesario, finalidad, trazabilidad y derechos del paciente.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#c9d3df; --ink:#1c2733; --muted:#566576; --a:#2f6fb3; --a-l:#dbe8f6; --b:#1f8a6b; --b-l:#d9f0e8; --c:#b86e0a; --c-l:#fbecd2; --bad:#c0392b; --bad-l:#f9dcd8; --p:#7a4bb0; --p-l:#ebe0f6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#3a4958; --ink:#e8eef5; --muted:#a3b3c4; --a:#7db4ea; --a-l:#223a54; --b:#4cc38a; --b-l:#1d3a31; --c:#e8b04a; --c-l:#43361d; --bad:#ef7467; --bad-l:#4a2723; --p:#b794e0; --p-l:#35294a; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; }
    .t { font-size: 13px; }
    .big { font-size: 28px; font-weight: 800; }
    .w { font-weight: 700; }
    .mid { text-anchor: middle; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--muted)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="34" class="title mid">Acceso a la historia clínica</text>
  <circle cx="160" cy="246" r="136" fill="var(--p-l)" stroke="var(--p)" stroke-width="2"/>
  <circle cx="160" cy="246" r="92" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <circle cx="160" cy="246" r="48" fill="var(--b-l)" stroke="var(--b)" stroke-width="2.4"/>
  <circle cx="160" cy="240" r="13" fill="var(--b)"/>
  <text x="160" y="245" class="h mid" style="fill:var(--bg)">1</text>
  <text x="160" y="268" class="s w mid">Paciente</text>
  <text x="160" y="283" class="s w mid">y equipo</text>
  <circle cx="160" cy="176" r="13" fill="var(--c)"/>
  <text x="160" y="181" class="h mid" style="fill:var(--bg)">2</text>
  <circle cx="160" cy="132" r="13" fill="var(--p)"/>
  <text x="160" y="137" class="h mid" style="fill:var(--bg)">3</text>
  <text x="330" y="66" class="h">Círculos de acceso</text>
  <circle cx="344" cy="100" r="13" fill="var(--b)"/>
  <text x="344" y="105" class="h mid" style="fill:var(--bg)">1</text>
  <text x="368" y="96" class="h">Equipo asistencial y la propia persona</text>
  <text x="368" y="114" class="s muted">Según su función y su relación con el caso</text>
  <circle cx="344" cy="156" r="13" fill="var(--c)"/>
  <text x="344" y="161" class="h mid" style="fill:var(--bg)">2</text>
  <text x="368" y="152" class="h">Servicios de apoyo</text>
  <text x="368" y="170" class="s muted">Administración, laboratorio, farmacia: lo necesario</text>
  <circle cx="344" cy="212" r="13" fill="var(--p)"/>
  <text x="344" y="217" class="h mid" style="fill:var(--bg)">3</text>
  <text x="368" y="208" class="h">Usos secundarios</text>
  <text x="368" y="226" class="s muted">Investigación, gestión, docencia: con anonimización</text>
  <line x1="330" y1="266" x2="776" y2="266" stroke="var(--line)" stroke-width="1.6"/>
  <text x="330" y="292" class="h">Principios que limitan el acceso</text>
  <circle cx="338" cy="316" r="4" fill="var(--a)"/>
  <text x="352" y="321" class="s">Mínimo necesario para el fin asistencial</text>
  <circle cx="338" cy="342" r="4" fill="var(--a)"/>
  <text x="352" y="347" class="s">Finalidad: no reutilizar sin base adecuada</text>
  <circle cx="338" cy="368" r="4" fill="var(--a)"/>
  <text x="352" y="373" class="s">Trazabilidad: cada acceso queda registrado</text>
  <circle cx="338" cy="394" r="4" fill="var(--a)"/>
  <text x="352" y="399" class="s">Derechos del paciente: acceso y rectificación</text>
  <circle cx="338" cy="420" r="4" fill="var(--a)"/>
  <text x="352" y="425" class="s">Excepciones: consentimiento, riesgo grave o ley</text>
  <text x="400" y="468" class="s muted mid">Esquema ilustrativo. Ilustración original de AloVida.</text>
</svg>
