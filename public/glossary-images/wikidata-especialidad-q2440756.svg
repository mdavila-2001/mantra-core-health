<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Campo de la flebología</title>
  <desc id="d">Dos tramos de vena comparados: con válvulas sanas, la sangre sube hacia el corazón; con válvulas insuficientes, refluye hacia abajo y dilata la vena. A la derecha, las enfermedades venosas que atiende la flebología y los tratamientos habituales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Flebología: las venas de las piernas</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="88" text-anchor="middle" class="h">Válvulas venosas</text>
  <rect x="80" y="110" width="80" height="250" rx="30" fill="var(--accent-l)" stroke="var(--accent)"/>
  <path d="M84 170 L120 144 L156 170" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M84 270 L120 244 L156 270" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="120" y1="340" x2="120" y2="130" stroke="var(--accent)" stroke-width="3" marker-end="url(#ar)"/>
  <text x="120" y="384" text-anchor="middle" class="small b">Válvula sana</text>
  <rect x="240" y="110" width="80" height="250" rx="30" fill="var(--accent-l)" stroke="var(--accent)"/>
  <path d="M244 170 L266 148 M316 170 L294 148" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M244 270 L266 248 M316 270 L294 248" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <line x1="270" y1="140" x2="270" y2="330" stroke="var(--red)" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="292" y1="330" x2="292" y2="140" stroke="var(--accent)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="280" y="384" text-anchor="middle" class="small b">Válvula insuficiente</text>
  <text x="120" y="404" text-anchor="middle" class="small">La sangre sube al corazón</text>
  <text x="280" y="404" text-anchor="middle" class="small">Refluye y dilata la vena</text>
  <text x="210" y="428" text-anchor="middle" class="small muted">Abajo: pie · Arriba: corazón</text>
  <rect x="416" y="60" width="364" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="88" text-anchor="middle" class="h">Qué atiende</text>
  <text x="434" y="108" class="small">• Várices y arañas vasculares</text>
  <text x="434" y="134" class="small">• Insuficiencia venosa crónica</text>
  <text x="434" y="160" class="small">• Piernas pesadas e hinchadas</text>
  <text x="434" y="186" class="small">• Úlceras venosas</text>
  <text x="434" y="212" class="small">• Trombosis venosa</text>
  <rect x="416" y="276" width="364" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="304" text-anchor="middle" class="h">Tratamientos</text>
  <text x="434" y="322" class="small">• Medias de compresión</text>
  <text x="434" y="348" class="small">• Escleroterapia</text>
  <text x="434" y="374" class="small">• Ablación térmica de la vena</text>
  <text x="434" y="400" class="small">• Ejercicio y elevar las piernas</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo de la especialidad. Ilustración original de AloVida.</text>
</svg>
