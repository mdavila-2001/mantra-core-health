<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Partes de un hueso largo</title>
  <desc id="d">A la izquierda, corte longitudinal de un hueso largo en posición horizontal, con el cartílago articular en los extremos, las epífisis de hueso esponjoso, la diáfisis de hueso compacto, la cavidad medular con médula ósea, el periostio y una arteria nutricia. A la derecha, las tres células del hueso: osteoblasto, que forma hueso; osteocito, que lo vigila; y osteoclasto, que lo reabsorbe.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --bone:#efe4cc; --bone-d:#b8a47a; --spongy:#e2d2ad; --marrow:#e8a07a; --cart:#bcd6f2; --peri:#8a6f4a; --vessel:#c0392b; --ok:#1f8a5b; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --bone:#4a4334; --bone-d:#a8946a; --spongy:#5c523d; --marrow:#9a5a3e; --cart:#27405c; --peri:#c9ad80; --vessel:#ef7467; --ok:#4cc38a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .h { font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <pattern id="sp" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="var(--spongy)"/><circle cx="6" cy="6" r="3" fill="var(--marrow)"/></pattern>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>

  <rect x="20" y="20" width="520" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="280" y="50" text-anchor="middle" class="title">Corte de un hueso largo</text>
  <!-- contorno hueso -->
  <path d="M60 180 C60 140 100 130 130 150 C150 162 160 180 180 190 H380 C400 180 410 162 430 150 C460 130 500 140 500 180 V260 C500 300 460 310 430 290 C410 278 400 260 380 250 H180 C160 260 150 278 130 290 C100 310 60 300 60 260 Z" fill="var(--bone)" stroke="var(--peri)" stroke-width="4"/>
  <!-- epífisis esponjosas -->
  <path d="M70 185 C70 155 100 148 125 162 C142 172 152 186 165 196 V244 C152 254 142 268 125 278 C100 292 70 285 70 255 Z" fill="url(#sp)"/>
  <path d="M490 185 C490 155 460 148 435 162 C418 172 408 186 395 196 V244 C408 254 418 268 435 278 C460 292 490 285 490 255 Z" fill="url(#sp)"/>
  <!-- cavidad medular -->
  <rect x="170" y="206" width="220" height="28" rx="12" fill="var(--marrow)"/>
  <!-- cartílago -->
  <path d="M62 170 C55 200 55 240 62 270" fill="none" stroke="var(--cart)" stroke-width="10" stroke-linecap="round"/>
  <path d="M498 170 C505 200 505 240 498 270" fill="none" stroke="var(--cart)" stroke-width="10" stroke-linecap="round"/>
  <!-- arteria -->
  <path d="M290 330 C290 300 285 270 280 238" fill="none" stroke="var(--vessel)" stroke-width="4"/>

  <line x1="60" y1="150" x2="60" y2="110" stroke="var(--line)"/><text x="44" y="102" class="small">Cartílago articular</text>
  <line x1="110" y1="225" x2="110" y2="350" stroke="var(--line)"/><text x="70" y="366" class="small">Epífisis</text><text x="56" y="381" class="small muted">(hueso esponjoso)</text>
  <line x1="240" y1="190" x2="240" y2="110" stroke="var(--line)"/><text x="200" y="102" class="small">Hueso compacto</text>
  <line x1="350" y1="220" x2="400" y2="120" stroke="var(--line)"/><text x="360" y="112" class="small">Cavidad con médula</text>
  <line x1="300" y1="252" x2="370" y2="352" stroke="var(--line)"/><text x="340" y="368" class="small">Periostio</text>
  <text x="290" y="348" text-anchor="middle" class="small" style="fill:var(--vessel)">Arteria nutricia</text>
  <text x="280" y="410" text-anchor="middle" class="lab">← Diáfisis (cuerpo) en el centro →</text>
  <text x="280" y="440" text-anchor="middle" class="small muted">El hueso es un tejido vivo, con vasos y nervios</text>

  <rect x="556" y="20" width="224" height="440" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="668" y="50" text-anchor="middle" class="title">Sus células</text>
  <ellipse cx="610" cy="110" rx="26" ry="18" fill="var(--ok)"/>
  <text x="646" y="106" class="h">Osteoblasto</text>
  <text x="646" y="124" class="small">forma hueso</text>
  <circle cx="610" cy="210" r="14" fill="var(--accent)"/>
  <path d="M596 210 H580 M624 210 H640 M610 196 V182 M610 224 V238" stroke="var(--accent)" stroke-width="2"/>
  <text x="646" y="206" class="h">Osteocito</text>
  <text x="646" y="224" class="small">detecta cargas</text>
  <ellipse cx="610" cy="310" rx="32" ry="22" fill="var(--marrow)"/>
  <circle cx="598" cy="306" r="4" fill="var(--on)"/><circle cx="612" cy="314" r="4" fill="var(--on)"/><circle cx="622" cy="304" r="4" fill="var(--on)"/>
  <text x="646" y="306" class="h">Osteoclasto</text>
  <text x="646" y="324" class="small">reabsorbe hueso</text>
  <text x="668" y="390" text-anchor="middle" class="small muted">Juntas renuevan el</text>
  <text x="668" y="406" text-anchor="middle" class="small muted">hueso toda la vida</text>
</svg>
