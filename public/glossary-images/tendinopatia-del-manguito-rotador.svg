<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tendinopatía del manguito rotador</title>
  <desc id="d">A la izquierda, un hombro visto de frente con la clavícula, el acromion, la escápula y el húmero, y el tendón supraespinoso con una zona dañada donde roza bajo el acromion. A la derecha, síntomas, causas y tratamiento.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Hombro visto de frente</text>
  <path d="M60 90 C120 76 220 80 300 96 L300 120 C220 108 120 106 60 118 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="90" y="80" class="small" style="fill:var(--muted)">Clavícula</text>
  <path d="M300 96 C340 96 360 120 350 140 L270 140 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="400" y="120" text-anchor="end" class="small" style="fill:var(--muted)">Acromion</text>
  <path d="M180 140 L250 150 L200 360 L160 320 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="140" y="260" text-anchor="end" class="small" style="fill:var(--muted)">Escápula</text>
  <circle cx="290" cy="186" r="40" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M260 210 L276 420 H330 L326 210 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <text x="300" y="400" text-anchor="middle" class="small" style="fill:var(--muted)">Húmero</text>
  <path d="M190 180 C230 150 280 140 320 156" fill="none" stroke="var(--organ-d)" stroke-width="12" opacity=".75" stroke-linecap="round"/>
  <path d="M290 150 C310 148 320 152 324 160" fill="none" stroke="var(--vessel)" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 230 C240 220 270 214 300 216" fill="none" stroke="var(--organ-d)" stroke-width="10" opacity=".5" stroke-linecap="round"/>
  <text x="110" y="186" text-anchor="middle" class="small" style="fill:var(--organ-d)">Supraespinoso</text>
  <line x1="150" y1="182" x2="190" y2="180" stroke="var(--organ-d)" stroke-width="1"/>
  <text x="370" y="196" class="small" style="fill:var(--vessel)">Zona dañada</text>
  <line x1="368" y1="192" x2="326" y2="160" stroke="var(--vessel)" stroke-width="1"/>
  <text x="110" y="230" text-anchor="middle" class="small" style="fill:var(--organ-d)">Otros</text>
  <text x="110" y="246" text-anchor="middle" class="small" style="fill:var(--organ-d)">tendones</text>
  <text x="230" y="434" text-anchor="middle" class="small" style="fill:var(--muted)">El tendón roza bajo el acromion</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Síntomas y manejo</text>
  <text x="476" y="80" class="small">• Dolor en la parte externa del hombro</text>
  <text x="476" y="102" class="small">• Duele al levantar el brazo</text>
  <text x="476" y="124" class="small">• Dolor nocturno al apoyarse</text>
  <text x="476" y="146" class="small">• Debilidad en movimientos altos</text>
  <text x="476" y="186" class="step">Causas</text>
  <text x="484" y="210" class="small">• Movimientos repetidos por encima</text>
  <text x="484" y="230" class="small">• de la cabeza</text>
  <text x="484" y="250" class="small">• Desgaste con la edad</text>
  <rect x="476" y="280" width="284" height="142" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="492" y="306" class="step">Tratamiento</text>
  <text x="500" y="330" class="small">• Ajustar la actividad</text>
  <text x="500" y="348" class="small">• Ejercicios de fisioterapia</text>
  <text x="500" y="366" class="small">• Analgésicos y frío o calor</text>
  <text x="500" y="384" class="small">• Infiltración en algunos casos</text>
  <text x="500" y="402" class="small">• Cirugía si hay rotura importante</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
