<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Ácido úrico: origen, eliminación y usos de la prueba</title>
  <desc id="d">A la izquierda, las purinas de los alimentos y el recambio celular llegan al hígado, que forma ácido úrico; pasa a la sangre y se elimina sobre todo por el riñón y en menor medida por el intestino. A la derecha, un tubo de sangre y un frasco de orina, una articulación con cristales de urato y una lista de situaciones que la prueba ayuda a evaluar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">De dónde viene y adónde va</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué ayuda a evaluar</text>
<rect x="40" y="70" width="150" height="44" rx="8" fill="var(--warn)"/>
<text x="115.0" y="88.7" text-anchor="middle" class="lab" style="fill:var(--on)">Purinas de la</text>
<text x="115.0" y="104.7" text-anchor="middle" class="lab" style="fill:var(--on)">alimentación</text>
<rect x="210" y="70" width="150" height="44" rx="8" fill="var(--purple)"/>
<text x="285.0" y="88.7" text-anchor="middle" class="lab" style="fill:var(--on)">Recambio de las</text>
<text x="285.0" y="104.7" text-anchor="middle" class="lab" style="fill:var(--on)">propias células</text>
<line x1="115" y1="114" x2="175" y2="150" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<line x1="285" y1="114" x2="225" y2="150" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="110" y="154" width="180" height="40" rx="8" fill="var(--organ)"/>
<text x="200.0" y="178.7" text-anchor="middle" class="lab" style="fill:var(--on)">Hígado: se forma</text>
<line x1="200" y1="194" x2="200" y2="222" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="90" y="226" width="220" height="40" rx="8" fill="var(--vessel)"/>
<text x="200.0" y="250.7" text-anchor="middle" class="lab" style="fill:var(--on)">Ácido úrico en la sangre</text>
<line x1="170" y1="266" x2="110" y2="302" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="266" x2="290" y2="302" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<ellipse cx="110" cy="330" rx="34" ry="24" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="1.5"/>
<text x="110" y="335" text-anchor="middle" class="lab">Riñón</text>
<ellipse cx="290" cy="330" rx="44" ry="24" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="290" y="335" text-anchor="middle" class="lab">Intestino</text>
<text x="110" y="374" text-anchor="middle" class="small" style="fill:var(--muted)">Orina: vía principal</text>
<text x="290" y="374" text-anchor="middle" class="small" style="fill:var(--muted)">Heces</text>
<text x="200" y="414" text-anchor="middle" class="small" style="fill:var(--muted)">Exceso: se forma más o se elimina menos</text>
<rect x="418" y="70" width="30" height="14" rx="3" fill="var(--accent)"/>
<path d="M420 84 V150 a13 13 0 0 0 26 0 V84 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M421.5 110 V150 a11.5 11.5 0 0 0 23 0 V110 Z" fill="var(--vessel)"/>
<text x="433" y="186" text-anchor="middle" class="small" style="fill:var(--muted)">Sangre</text>
<rect x="486" y="92" width="58" height="10" rx="3" fill="var(--accent)"/>
<path d="M490 102 L494 156 H536 L540 102 Z" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
<path d="M492 122 L495 154 H535 L538 122 Z" fill="var(--yellow)" opacity=".8"/>
<text x="515" y="176" text-anchor="middle" class="small" style="fill:var(--muted)">Orina (a veces)</text>
<rect x="590" y="72" width="46" height="120" rx="18" fill="var(--bone)" stroke="var(--line)"/>
<rect x="650" y="72" width="46" height="120" rx="18" fill="var(--bone)" stroke="var(--line)"/>
<ellipse cx="643" cy="132" rx="22" ry="34" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="1.5" opacity=".7"/>
<line x1="632" y1="116" x2="642" y2="124" stroke="var(--purple)" stroke-width="2.5"/>
<line x1="648" y1="118" x2="656" y2="110" stroke="var(--purple)" stroke-width="2.5"/>
<line x1="636" y1="140" x2="646" y2="146" stroke="var(--purple)" stroke-width="2.5"/>
<line x1="650" y1="142" x2="658" y2="150" stroke="var(--purple)" stroke-width="2.5"/>
<line x1="640" y1="130" x2="650" y2="128" stroke="var(--purple)" stroke-width="2.5"/>
<text x="712" y="112" class="small">Cristales</text>
<text x="712" y="128" class="small">de urato</text>
<text x="643" y="212" text-anchor="middle" class="small" style="fill:var(--muted)">Articulación (gota)</text>
<text x="416" y="260" class="lab">• Gota y ataques de dolor articular</text>
<text x="416" y="286" class="lab">• Cálculos (piedras) en el riñón</text>
<text x="416" y="312" class="lab">• Seguimiento del tratamiento de la gota</text>
<text x="416" y="338" class="lab">• Quimioterapia: riesgo de lisis tumoral</text>
<text x="416" y="364" class="lab">• Junto con pruebas de función renal</text>
<text x="416" y="410" class="small" style="fill:var(--muted)">Un valor alto aislado no es sinónimo de gota.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
