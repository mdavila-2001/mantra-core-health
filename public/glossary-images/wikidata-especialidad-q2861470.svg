<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Medicina de emergencia: triaje y ABCDE</title>
  <desc id="d">Escala de triaje de cinco niveles por colores, de resucitación a no urgente. A la derecha, la evaluación ordenada ABCDE: vía aérea, respiración, circulación, estado neurológico y exposición.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Triaje: quién va primero</text>
<rect x="40" y="62" width="360" height="54" rx="10" fill="var(--vessel)" stroke-width="1"/>
<text x="60" y="96" class="big" style="fill:var(--on)">1</text>
<text x="96" y="86" class="step" style="fill:var(--on)">Resucitación</text>
<text x="96" y="104" class="small" style="fill:var(--on)">inmediata</text>
<rect x="40" y="128" width="330" height="54" rx="10" fill="var(--warn)" stroke-width="1"/>
<text x="60" y="162" class="big" style="fill:var(--on)">2</text>
<text x="96" y="152" class="step" style="fill:var(--on)">Emergencia</text>
<text x="96" y="170" class="small" style="fill:var(--on)">muy urgente</text>
<rect x="40" y="194" width="300" height="54" rx="10" fill="var(--beam)" stroke-width="1"/>
<text x="60" y="228" class="big" style="fill:var(--ink)">3</text>
<text x="96" y="218" class="step" style="fill:var(--ink)">Urgencia</text>
<text x="96" y="236" class="small" style="fill:var(--ink)">urgente</text>
<rect x="40" y="260" width="270" height="54" rx="10" fill="var(--ok)" stroke-width="1"/>
<text x="60" y="294" class="big" style="fill:var(--on)">4</text>
<text x="96" y="284" class="step" style="fill:var(--on)">Menos urgente</text>
<text x="96" y="302" class="small" style="fill:var(--on)">puede esperar</text>
<rect x="40" y="326" width="240" height="54" rx="10" fill="var(--accent)" stroke-width="1"/>
<text x="60" y="360" class="big" style="fill:var(--on)">5</text>
<text x="96" y="350" class="step" style="fill:var(--on)">No urgente</text>
<text x="96" y="368" class="small" style="fill:var(--on)">atención diferida</text>
<text x="220" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Se prioriza por gravedad, no por orden de llegada</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Evaluación ABCDE</text>
<circle cx="476" cy="76" r="18" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="476" y="82" text-anchor="middle" class="sub" style="fill:var(--on)">A</text>
<text x="506" y="81" class="lab">Vía aérea</text>
<circle cx="476" cy="124" r="18" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="476" y="130" text-anchor="middle" class="sub" style="fill:var(--on)">B</text>
<text x="506" y="129" class="lab">Respiración</text>
<circle cx="476" cy="172" r="18" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="476" y="178" text-anchor="middle" class="sub" style="fill:var(--on)">C</text>
<text x="506" y="177" class="lab">Circulación</text>
<circle cx="476" cy="220" r="18" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="476" y="226" text-anchor="middle" class="sub" style="fill:var(--on)">D</text>
<text x="506" y="225" class="lab">Neurológico</text>
<circle cx="476" cy="268" r="18" fill="var(--accent)" stroke="none" stroke-width="1"/>
<text x="476" y="274" text-anchor="middle" class="sub" style="fill:var(--on)">E</text>
<text x="506" y="273" class="lab">Exposición</text>
<text x="456" y="316" class="lab">Atiende cualquier edad y problema</text>
<text x="456" y="336" class="lab">agudo: traumatismos, infartos, ictus,</text>
<text x="456" y="356" class="lab">intoxicaciones, infecciones graves.</text>
<text x="456" y="392" class="step">Ante riesgo vital: llamar al</text>
<text x="456" y="412" class="step">número de emergencias local.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
