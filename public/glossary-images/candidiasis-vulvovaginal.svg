<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Desequilibrio en la candidiasis vulvovaginal</title>
  <desc id="d">Balanza inclinada: en un platillo los lactobacilos de la flora protectora y en el otro, más pesado, las levaduras de Candida que crecen de más. A la derecha, los factores que favorecen el sobrecrecimiento, como antibióticos, embarazo o diabetes, y los síntomas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Candidiasis vulvovaginal: cuando la levadura crece de más</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="88" text-anchor="middle" class="h">Un equilibrio que se rompe</text>
  <path d="M200 330 L170 400 L230 400 Z" fill="var(--muted)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M70 200 L330 260" fill="none" stroke="var(--muted)" stroke-width="5"/>
  <path d="M60 210 L140 210 L120 240 L80 240 Z" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <path d="M260 270 L340 270 L320 300 L280 300 Z" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="2"/>
  <path d="M200 230 L200 330" fill="none" stroke="var(--muted)" stroke-width="4"/>
  <rect x="70" y="180" width="8" height="24" rx="4" fill="var(--ok)" stroke="none"/>
  <rect x="86" y="180" width="8" height="24" rx="4" fill="var(--ok)" stroke="none"/>
  <rect x="102" y="180" width="8" height="24" rx="4" fill="var(--ok)" stroke="none"/>
  <rect x="118" y="180" width="8" height="24" rx="4" fill="var(--ok)" stroke="none"/>
  <circle cx="276" cy="252" r="8" fill="var(--warn)" stroke="none"/>
  <circle cx="283" cy="245" r="4" fill="var(--warn)" stroke="none"/>
  <circle cx="296" cy="246" r="8" fill="var(--warn)" stroke="none"/>
  <circle cx="303" cy="239" r="4" fill="var(--warn)" stroke="none"/>
  <circle cx="316" cy="254" r="8" fill="var(--warn)" stroke="none"/>
  <circle cx="323" cy="247" r="4" fill="var(--warn)" stroke="none"/>
  <circle cx="306" cy="236" r="8" fill="var(--warn)" stroke="none"/>
  <circle cx="313" cy="229" r="4" fill="var(--warn)" stroke="none"/>
  <circle cx="286" cy="234" r="8" fill="var(--warn)" stroke="none"/>
  <circle cx="293" cy="227" r="4" fill="var(--warn)" stroke="none"/>
  <text x="100" y="166" text-anchor="middle" class="small b">Lactobacilos</text>
  <text x="100" y="262" text-anchor="middle" class="small muted">flora protectora</text>
  <text x="300" y="216" text-anchor="middle" class="small b">Candida</text>
  <text x="300" y="322" text-anchor="middle" class="small muted">levaduras</text>
  <text x="210" y="428" text-anchor="middle" class="small muted">No se considera una infección de transmisión sexual</text>
  <rect x="416" y="60" width="364" height="186" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="88" text-anchor="middle" class="h">Factores que la favorecen</text>
  <text x="434" y="110" class="small">• Antibióticos</text>
  <text x="434" y="136" class="small">• Embarazo</text>
  <text x="434" y="162" class="small">• Diabetes mal controlada</text>
  <text x="434" y="188" class="small">• Defensas bajas</text>
  <text x="434" y="214" class="small">• Humedad y ropa ajustada</text>
  <rect x="416" y="262" width="364" height="178" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="290" text-anchor="middle" class="h">Síntomas</text>
  <text x="434" y="312" class="small">• Picor y ardor vulvar</text>
  <text x="434" y="338" class="small">• Flujo blanco y grumoso</text>
  <text x="434" y="364" class="small">• Enrojecimiento e hinchazón</text>
  <text x="434" y="390" class="small">• Molestia al orinar o en relaciones</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
