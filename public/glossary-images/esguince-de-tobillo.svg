<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Esguince de tobillo</title>
  <desc id="d">A la izquierda, el tobillo con la tibia, el peroné y el pie, y un ligamento externo roto cuando el pie se tuerce hacia dentro. A la derecha, los tres grados de esguince, de estiramiento a rotura completa, los cuidados de los primeros días y cuándo consultar para descartar una fractura.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Ligamentos del lado externo</text>
  <rect x="150" y="60" width="40" height="170" rx="10" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="206" y="70" width="22" height="160" rx="8" fill="var(--bone)" stroke="var(--line)"/>
  <text x="140" y="100" text-anchor="end" class="small">Tibia</text>
  <text x="236" y="100" class="small">Peroné</text>
  <path d="M140 230 C150 210 230 210 240 236 L250 270 L140 270 Z" fill="var(--bone)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M120 270 H330 C350 270 360 300 340 310 L120 316 C90 316 90 270 120 270 Z" fill="var(--bone)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="260" y="300" class="small muted">Pie</text>
  <path d="M218 228 L250 262" fill="none" stroke="var(--warn)" stroke-width="7" stroke-linecap="round"/>
  <path d="M222 232 L234 245 M240 252 L250 262" fill="none" stroke="var(--panel)" stroke-width="2"/>
  <path d="M222 230 L200 280" fill="none" stroke="var(--ok)" stroke-width="6" stroke-linecap="round"/>
  <text x="270" y="246" class="small" style="fill:var(--warn)">Ligamento roto</text>
  <path d="M60 210 C70 250 90 270 110 280" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <text x="56" y="200" class="small">Giro hacia dentro</text>
  <text x="200" y="352" text-anchor="middle" class="lab">El pie se tuerce hacia dentro</text>
  <text x="200" y="372" text-anchor="middle" class="lab">y los ligamentos externos</text>
  <text x="200" y="392" text-anchor="middle" class="lab">se estiran o se desgarran</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Grados y cuidados</text>
  <rect x="436" y="60" width="110" height="38" rx="8" fill="var(--ok)"/>
  <text x="491.0" y="84.04" text-anchor="middle" class="step" style="fill:var(--on)">Grado I</text>
  <text x="560" y="84" class="lab">Estiramiento leve</text>
  <rect x="436" y="108" width="110" height="38" rx="8" fill="var(--nerve)"/>
  <text x="491.0" y="132.04" text-anchor="middle" class="step" style="fill:var(--on)">Grado II</text>
  <text x="560" y="132" class="lab">Rotura parcial</text>
  <rect x="436" y="156" width="110" height="38" rx="8" fill="var(--warn)"/>
  <text x="491.0" y="180.04" text-anchor="middle" class="step" style="fill:var(--on)">Grado III</text>
  <text x="560" y="180" class="lab">Rotura completa</text>
  <text x="436" y="230" class="step">Los primeros días</text>
  <text x="440" y="256" class="lab">• Reposo relativo y hielo</text>
  <text x="440" y="280" class="lab">• Compresión y pie en alto</text>
  <text x="440" y="304" class="lab">• Movilidad precoz según tolerancia</text>
  <rect x="436" y="340" width="324" height="80" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="364" class="lab">Consultar si no puede apoyar el pie</text>
  <text x="452" y="384" class="lab">o duele mucho el hueso: descartar</text>
  <text x="452" y="404" class="lab">una fractura</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
