<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Enfermedad inflamatoria pélvica</title>
  <desc id="d">A la izquierda, bacterias que ascienden desde la vagina por el cuello uterino hasta el útero y las trompas, que aparecen inflamadas. A la derecha, los síntomas, las complicaciones si no se trata, como infertilidad y embarazo ectópico, y la importancia de los antibióticos y la prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Cómo asciende la infección</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Síntomas y riesgos</text>
<path d="M153.5 121.0 C107.0 105.5 76.0 121.0 60.5 152.0" fill="none" stroke="var(--organ)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M246.5 121.0 C293.0 105.5 324.0 121.0 339.5 152.0" fill="none" stroke="var(--organ)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="57.400000000000006" cy="176.8" rx="24.8" ry="17.05" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="1.5"/>
<ellipse cx="342.6" cy="176.8" rx="24.8" ry="17.05" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="1.5"/>
<path d="M147.3 114.8 C147.3 90 252.7 90 252.7 114.8 C252.7 167.5 227.9 198.5 221.7 214.0 L178.3 214.0 C172.1 198.5 147.3 167.5 147.3 114.8 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="178.3" y="214.0" width="43.4" height="24.8" rx="4" fill="var(--organ)"/>
<path d="M181.4 238.8 L175.2 291.5 L224.8 291.5 L218.6 238.8" fill="var(--skin)" stroke="var(--organ)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="192" cy="290" r="4" fill="var(--bad)"/>
<circle cx="208" cy="296" r="4" fill="var(--bad)"/>
<circle cx="192" cy="260" r="4" fill="var(--bad)"/>
<circle cx="208" cy="266" r="4" fill="var(--bad)"/>
<circle cx="192" cy="226" r="4" fill="var(--bad)"/>
<circle cx="208" cy="232" r="4" fill="var(--bad)"/>
<line x1="232" y1="300" x2="232" y2="170" stroke="var(--bad)" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M147 121 C100 106 76 124 62 152" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
<path d="M253 121 C300 106 324 124 338 152" fill="none" stroke="var(--bad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
<text x="200" y="150" text-anchor="middle" class="lab">Útero</text>
<text x="60" y="84" class="small" style="fill:var(--bad)">Trompas inflamadas</text>
<text x="244" y="300" class="small" style="fill:var(--bad)">Bacterias</text>
<text x="244" y="316" class="small" style="fill:var(--muted)">desde la vagina</text>
<text x="200" y="350" text-anchor="middle" class="lab">Suele empezar con una infección de</text>
<text x="200" y="370" text-anchor="middle" class="lab">transmisión sexual, como clamidia o</text>
<text x="200" y="390" text-anchor="middle" class="lab">gonorrea, que sube al útero y trompas.</text>
<text x="416" y="76" class="h">Síntomas</text>
<text x="416" y="102" class="lab">• Dolor en la parte baja del vientre</text>
<text x="416" y="126" class="lab">• Flujo anormal</text>
<text x="416" y="150" class="lab">• Fiebre</text>
<text x="416" y="174" class="lab">• Dolor en las relaciones</text>
<text x="416" y="198" class="lab">• Sangrado entre reglas</text>
<text x="416" y="236" class="h" style="fill:var(--bad)">Si no se trata</text>
<text x="416" y="262" class="lab">• Infertilidad</text>
<text x="416" y="286" class="lab">• Embarazo ectópico</text>
<text x="416" y="310" class="lab">• Dolor pélvico crónico</text>
<text x="416" y="334" class="lab">• Absceso</text>
<rect x="416" y="360" width="344" height="60" rx="10" fill="var(--ok-l)"/>
<text x="432" y="384" class="lab">Antibióticos a tiempo y tratar también</text>
<text x="432" y="404" class="lab">a la pareja; preservativo para prevenir.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
