<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Radiografía de tórax</title>
  <desc id="d">A la izquierda, una persona de pie de espaldas al tubo de rayos X y con el pecho apoyado en el detector, en proyección posteroanterior. A la derecha, una imagen esquemática de la radiografía con los pulmones oscuros, las costillas, el corazón claro y el diafragma, y lo que ayuda a detectar: neumonía, derrame pleural, corazón grande y neumotórax.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="330" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="185.0" y="50" text-anchor="middle" class="title">Posición habitual</text>
  <rect x="60" y="80" width="60" height="44" rx="8" fill="var(--accent)"/>
  <text x="90" y="106" text-anchor="middle" class="small" style="fill:var(--on)">Tubo</text>
  <polygon points="120,90 120,114 268,80 268,320" fill="var(--beam)" opacity=".4"/>
  <circle cx="240" cy="110" r="18" fill="var(--skin)" stroke="var(--line)"/>
  <path d="M226 130 Q216 210 226 300 L262 300 Q268 210 260 130 Z" fill="var(--skin)" stroke="var(--line)"/>
  <rect x="270" y="70" width="20" height="260" rx="5" fill="var(--accent)"/>
  <text x="280" y="350" text-anchor="middle" class="small">Detector</text>
  <text x="185" y="390" text-anchor="middle" class="small">De pie, de espaldas al tubo</text>
  <text x="185" y="408" text-anchor="middle" class="small muted">(proyección posteroanterior)</text>
  <text x="185" y="428" text-anchor="middle" class="small muted">Se pide coger aire y no moverse</text>
  <rect x="370" y="20" width="410" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="575.0" y="50" text-anchor="middle" class="title">Qué se ve en la imagen</text>
  <rect x="400" y="62" width="200" height="240" rx="10" fill="var(--ink)"/>
  <path d="M430 110 C420 160 420 240 440 280 L490 280 L494 110 Z M570 110 C580 160 580 240 560 280 L510 280 L506 110 Z" fill="#3a4654"/>
  <path d="M420 110 Q500 96 580 110" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M420 138 Q500 124 580 138" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M420 166 Q500 152 580 166" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M420 194 Q500 180 580 194" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M420 222 Q500 208 580 222" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M420 250 Q500 236 580 250" fill="none" stroke="#cfd6df" stroke-width="3" opacity=".6"/>
  <path d="M496 70 V140" stroke="#cfd6df" stroke-width="10" opacity=".6"/>
  <path d="M480 190 C470 240 500 270 550 260 C560 230 540 190 500 186 Z" fill="#cfd6df" opacity=".85"/>
  <path d="M420 284 Q460 260 490 284 M510 284 Q540 258 580 284" fill="none" stroke="#cfd6df" stroke-width="3"/>
  <text x="620" y="96" class="small">Pulmones: oscuros</text>
  <text x="620" y="126" class="small muted">(lleno de aire)</text>
  <text x="620" y="216" class="small">Corazón: claro</text>
  <text x="620" y="166" class="small">Costillas</text>
  <text x="620" y="276" class="small">Diafragma</text>
  <text x="390" y="334" class="step">Ayuda a detectar</text>
  <rect x="390" y="348" width="180" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="480.0" y="370.0" text-anchor="middle" class="small">Neumonía</text>
  <rect x="580" y="348" width="180" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="670.0" y="370.0" text-anchor="middle" class="small">Derrame pleural</text>
  <rect x="390" y="392" width="180" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="480.0" y="414.0" text-anchor="middle" class="small">Corazón grande</text>
  <rect x="580" y="392" width="180" height="34" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="670.0" y="414.0" text-anchor="middle" class="small">Neumotórax</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
