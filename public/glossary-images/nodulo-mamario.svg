<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Nódulo mamario</title>
  <desc id="d">Arriba, los pasos para estudiar un bulto en la mama: hallazgo, exploración, ecografía o mamografía, biopsia si hay dudas y resultado. Abajo, los rasgos que orientan a un nódulo benigno, liso y móvil, frente a los que requieren estudio rápido, como un nódulo duro e irregular.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="220" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Cómo se estudia un bulto en la mama</text>
  <rect x="40" y="90" width="128" height="64" rx="10" fill="var(--tissue)" stroke="var(--line)"/>
  <text x="104.0" y="118.5" text-anchor="middle" class="small">Lo nota la persona</text>
  <text x="104.0" y="135.5" text-anchor="middle" class="small">o aparece en un control</text>
  <line x1="170" y1="122" x2="186" y2="122" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="188" y="90" width="128" height="64" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="252.0" y="118.5" text-anchor="middle" class="small">Exploración</text>
  <text x="252.0" y="135.5" text-anchor="middle" class="small">en consulta</text>
  <line x1="318" y1="122" x2="334" y2="122" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="336" y="90" width="128" height="64" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="400.0" y="118.5" text-anchor="middle" class="small">Imagen</text>
  <text x="400.0" y="135.5" text-anchor="middle" class="small">ecografía o mamografía</text>
  <line x1="466" y1="122" x2="482" y2="122" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="484" y="90" width="128" height="64" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="548.0" y="118.5" text-anchor="middle" class="small">Biopsia</text>
  <text x="548.0" y="135.5" text-anchor="middle" class="small">si hay dudas</text>
  <line x1="614" y1="122" x2="630" y2="122" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="632" y="90" width="128" height="64" rx="10" fill="var(--ok-l)" stroke="var(--line)"/>
  <text x="696.0" y="118.5" text-anchor="middle" class="small">Resultado</text>
  <text x="696.0" y="135.5" text-anchor="middle" class="small">y plan</text>
  <text x="400" y="196" text-anchor="middle" class="lab">La mayoría de los nódulos mamarios son benignos, pero todos deben valorarse.</text>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <rect x="20" y="256" width="370" height="184" rx="14" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="205" y="284" text-anchor="middle" class="step" style="fill:var(--ok)">Rasgos que orientan a benigno</text>
  <ellipse cx="80" cy="340" rx="26" ry="18" fill="var(--violet-l)" stroke="var(--violet)" stroke-width="2"/>
  <text x="130" y="320" class="small">• Bordes lisos y definidos</text>
  <text x="130" y="342" class="small">• Se mueve al tocarlo</text>
  <text x="130" y="364" class="small">• Quistes con líquido</text>
  <text x="130" y="386" class="small">• Cambia con el ciclo</text>
  <rect x="410" y="256" width="370" height="184" rx="14" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="595" y="284" text-anchor="middle" class="step" style="fill:var(--warn)">Rasgos que requieren estudio rápido</text>
  <path d="M470 340 l10 -22 l12 10 l14 -14 l6 20 l14 8 l-12 14 l4 18 l-18 -6 l-14 12 l-6 -18 l-16 -4 Z" fill="var(--organ)" stroke="var(--vessel)" stroke-width="1.5"/>
  <text x="530" y="320" class="small">• Duro, irregular y fijo</text>
  <text x="530" y="342" class="small">• Piel retraída o con hoyuelos</text>
  <text x="530" y="364" class="small">• Secreción con sangre</text>
  <text x="530" y="386" class="small">• Ganglio en la axila</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
