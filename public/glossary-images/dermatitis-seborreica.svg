<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dermatitis seborreica</title>
  <desc id="d">A la izquierda, una cara de frente con las zonas habitualmente afectadas resaltadas: cuero cabelludo, cejas, pliegues de la nariz y detrás de las orejas. A la derecha, los tres factores que se suman (grasa, levadura Malassezia e inflamación), su evolución y qué ayuda a controlarla.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="200.0" y="50" text-anchor="middle" class="title">Zonas con más grasa</text>
  <ellipse cx="200" cy="220" rx="92" ry="118" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="104" cy="224" rx="12" ry="26" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="296" cy="224" rx="12" ry="26" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="166" cy="210" rx="12" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <ellipse cx="234" cy="210" rx="12" ry="6" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M200 216 L190 256 H210" fill="none" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M176 282 Q200 294 224 282" fill="none" stroke="var(--organ-d)" stroke-width="2"/>
  <path d="M112 180 C110 110 150 96 200 96 C250 96 290 110 288 180 C270 140 240 128 200 128 C160 128 130 140 112 180 Z" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <path d="M150 196 Q166 188 182 196 M218 196 Q234 188 250 196" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linecap="round"/>
  <path d="M182 248 Q176 266 186 276 M218 248 Q224 266 214 276" fill="none" stroke="var(--warn)" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="104" cy="224" rx="6" ry="18" fill="var(--warn)" stroke="none" stroke-width="2" opacity=".7"/>
  <ellipse cx="296" cy="224" rx="6" ry="18" fill="var(--warn)" stroke="none" stroke-width="2" opacity=".7"/>
  <text x="200" y="82" text-anchor="middle" class="small">Cuero cabelludo (caspa)</text>
  <text x="40" y="176" class="small">Cejas</text>
  <line x1="70" y1="180" x2="150" y2="194" stroke="var(--muted)" stroke-width="1"/>
  <text x="40" y="290" class="small">Pliegues</text>
  <text x="40" y="306" class="small">de la nariz</text>
  <line x1="104" y1="294" x2="180" y2="266" stroke="var(--muted)" stroke-width="1"/>
  <text x="360" y="290" text-anchor="end" class="small">Detrás de</text>
  <text x="360" y="306" text-anchor="end" class="small">las orejas</text>
  <line x1="330" y1="286" x2="300" y2="240" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="372" text-anchor="middle" class="small" style="fill:var(--muted)">También: centro del pecho y pliegues</text>
  <text x="200" y="410" text-anchor="middle" class="small">Placas rojas con escamas grasas amarillentas</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Por qué aparece</text>
  <rect x="416" y="66" width="104" height="56" rx="10" fill="var(--fluid)" stroke="var(--line)"/>
  <text x="468.0" y="90.5" text-anchor="middle" class="lab">Grasa</text>
  <text x="468.0" y="107.5" text-anchor="middle" class="lab">de la piel</text>
  <rect x="530" y="66" width="108" height="56" rx="10" fill="var(--violet-l)" stroke="var(--line)"/>
  <text x="584.0" y="90.5" text-anchor="middle" class="lab">Levadura</text>
  <text x="584.0" y="107.5" text-anchor="middle" class="lab">Malassezia</text>
  <rect x="648" y="66" width="112" height="56" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="704.0" y="90.5" text-anchor="middle" class="lab">Respuesta</text>
  <text x="704.0" y="107.5" text-anchor="middle" class="lab">inflamatoria</text>
  <text x="588" y="150" text-anchor="middle" class="small" style="fill:var(--muted)">Se suman y producen enrojecimiento y escamas</text>
  <text x="416" y="186" class="step">Cómo se comporta</text>
  <text x="424" y="212" class="lab">• Crónica, con brotes y mejorías</text>
  <text x="424" y="236" class="lab">• Empeora con estrés, frío y cansancio</text>
  <text x="424" y="260" class="lab">• En bebés: costra láctea</text>
  <text x="424" y="284" class="lab">• No es contagiosa ni por falta de higiene</text>
  <rect x="416" y="318" width="344" height="106" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="432" y="344" class="step">Qué ayuda a controlarla</text>
  <text x="440" y="368" class="small">• Champús y cremas antifúngicos</text>
  <text x="440" y="388" class="small">• Antiinflamatorios suaves en brotes</text>
  <text x="440" y="408" class="small">• Limpieza suave y constante</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
