<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Triyodotironina total (T3 total)</title>
  <desc id="d">Arriba, tres pasos: muestra de sangre, medición conjunta de la T3 unida a proteínas y la T3 libre, y orientación sobre hipertiroidismo. Abajo a la izquierda, la glándula tiroides delante de la tráquea, que produce mucha T4 y algo de T3, y la conversión de T4 en T3 en los tejidos. Abajo a la derecha, la T3 en la sangre, casi toda unida a proteínas y una pequeña parte libre.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="30" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="52" cy="54" r="13" fill="var(--accent)"/>
  <text x="52" y="59" text-anchor="middle" class="step on">1</text>
  <text x="72" y="59" class="step">Muestra</text>
  <text x="46" y="84" class="small">Sangre de una vena</text>
  <text x="46" y="103" class="small">del brazo</text>
  <path d="M260 78.0 L283 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="287" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="309" cy="54" r="13" fill="var(--accent)"/>
  <text x="309" y="59" text-anchor="middle" class="step on">2</text>
  <text x="329" y="59" class="step">Se mide</text>
  <text x="303" y="84" class="small">La T3 unida a proteínas</text>
  <text x="303" y="103" class="small">y la T3 libre, juntas</text>
  <path d="M517 78.0 L540 78.0" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="544" y="30" width="226" height="96" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="566" cy="54" r="13" fill="var(--accent)"/>
  <text x="566" y="59" text-anchor="middle" class="step on">3</text>
  <text x="586" y="59" class="step">Orienta sobre</text>
  <text x="560" y="84" class="small">Hipertiroidismo</text>
  <text x="560" y="103" class="small">y su seguimiento</text>
  <rect x="30" y="150" width="400" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="180" text-anchor="middle" class="title">De dónde viene la T3</text>
  <path d="M130 240 C110 200 150 190 170 220 Q200 250 230 220 C250 190 290 200 270 240 C260 280 230 290 210 270 Q200 262 190 270 C170 290 140 280 130 240 Z" fill="var(--purple)" opacity=".6" stroke="var(--purple)"/>
  <path d="M200 194 V300" stroke="var(--accent)" stroke-width="10" opacity=".4"/>
  <path d="M120 250 C100 210 140 196 166 224 Q200 256 234 224 C260 196 300 210 280 250 C268 290 236 298 214 278 Q200 268 186 278 C164 298 132 290 120 250 Z" fill="var(--purple)" opacity=".6" stroke="var(--purple)"/>
  <text x="112" y="214" text-anchor="end" class="step">Tiroides</text>
  <text x="200" y="316" text-anchor="middle" class="small muted">Tráquea</text>
  <rect x="300" y="206" width="110" height="32" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="355.0" y="227.0" text-anchor="middle" class="small">Mucha T4</text>
  <rect x="300" y="248" width="110" height="32" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="355.0" y="269.0" text-anchor="middle" class="small">Algo de T3</text>
  <path d="M282 236 L298 224" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M282 254 L298 262" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="60" y="356" class="small">En los tejidos la T4 se transforma en T3,</text>
  <text x="60" y="374" class="small">la forma más activa</text>
  <text x="60" y="404" class="small muted">La hipófisis regula la tiroides con la TSH</text>
  <rect x="450" y="150" width="320" height="300" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="180" text-anchor="middle" class="title">En la sangre</text>
  <rect x="490" y="218" width="36" height="22" rx="10" fill="var(--bone)"/>
  <circle cx="508" cy="216" r="7" fill="var(--warn)"/>
  <rect x="542" y="218" width="36" height="22" rx="10" fill="var(--bone)"/>
  <circle cx="560" cy="216" r="7" fill="var(--warn)"/>
  <rect x="594" y="218" width="36" height="22" rx="10" fill="var(--bone)"/>
  <circle cx="612" cy="216" r="7" fill="var(--warn)"/>
  <rect x="646" y="218" width="36" height="22" rx="10" fill="var(--bone)"/>
  <circle cx="664" cy="216" r="7" fill="var(--warn)"/>
  <rect x="698" y="218" width="36" height="22" rx="10" fill="var(--bone)"/>
  <circle cx="716" cy="216" r="7" fill="var(--warn)"/>
  <circle cx="530" cy="262" r="7" fill="var(--warn)"/>
  <text x="544" y="267" class="small">T3 libre (pequeña parte)</text>
  <text x="470" y="200" class="small">T3 unida a proteínas</text>
  <text x="470" y="300" class="small">• La T3 total suma ambas</text>
  <text x="470" y="324" class="small">• Cambia si varían las proteínas</text>
  <text x="470" y="348" class="small">• (embarazo, algunos fármacos)</text>
  <text x="470" y="372" class="small">• Se valora junto a TSH y T4</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
