<text x="400" y="40" text-anchor="middle" class="title">Exceso de hormona tiroidea: todo se acelera</text>
<text x="250" y="110" text-anchor="end" class="lab">Nerviosismo, insomnio</text>
<line x1="256" y1="106" x2="330" y2="106" stroke="var(--line)" stroke-width="1.5"/>
<text x="250" y="150" text-anchor="end" class="lab">Ojos saltones (Graves)</text>
<line x1="256" y1="146" x2="330" y2="146" stroke="var(--line)" stroke-width="1.5"/>
