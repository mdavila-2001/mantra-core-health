<circle cx="400" cy="91.2" r="31.2" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
<ellipse cx="390.1" cy="146" rx="7.2" ry="13.5" fill="var(--vessel-l)" stroke="var(--purple)" stroke-width="2" transform="rotate(-12 390.1 146)"/>
