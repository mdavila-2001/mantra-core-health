<line x1="470" y1="186" x2="544" y2="186" stroke="var(--line)" stroke-width="1.5"/>
<text x="550" y="240" class="lab">Calor y sudoración</text>
<line x1="470" y1="236" x2="544" y2="236" stroke="var(--line)" stroke-width="1.5"/>
<text x="550" y="290" class="lab">Reglas irregulares</text>
<line x1="470" y1="286" x2="544" y2="286" stroke="var(--line)" stroke-width="1.5"/>
<text x="550" y="340" class="lab">Debilidad muscular</text>
<line x1="470" y1="336" x2="544" y2="336" stroke="var(--line)" stroke-width="1.5"/>
<rect x="40" y="370" width="330" height="56" rx="10" fill="var(--purple-l)" stroke-width="1"/>
<text x="54" y="394" class="lab">Causas: enfermedad de Graves,</text>
<text x="54" y="414" class="lab">nódulos tóxicos, tiroiditis</text>
<rect x="430" y="370" width="330" height="56" rx="10" fill="var(--accent-l)" stroke-width="1"/>
<text x="444" y="394" class="lab">Análisis: TSH baja, T4 y T3 altas</text>
<text x="444" y="414" class="lab">Tratamiento: fármacos, yodo o cirugía</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
