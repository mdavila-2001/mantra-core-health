<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Podología: la especialidad del pie</title>
  <desc id="d">A la izquierda, la planta de un pie con los problemas frecuentes señalados: uña encarnada, juanete, callos, hongos, úlcera del pie diabético y dolor de talón. A la derecha, el estudio de la pisada con plataforma de presiones, los tratamientos habituales del podólogo y la importancia del cuidado del pie diabético.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Problemas frecuentes del pie</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Cómo trabaja el podólogo</text>
<g transform="translate(0 22)">
<path d="M200 70 C240 70 262 110 262 160 C262 220 250 250 252 300 C254 350 240 410 200 412 C160 414 144 370 148 320 C152 270 140 230 140 170 C140 110 160 70 200 70 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="70" r="15" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="190" cy="58" r="12" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="216" cy="58" r="11" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="238" cy="64" r="10" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="256" cy="76" r="9" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<circle cx="160" cy="70" r="7" fill="var(--bad)" opacity=".6"/>
<ellipse cx="178" cy="132" rx="16" ry="10" fill="var(--warn)" opacity=".6"/>
<circle cx="200" cy="380" r="16" fill="var(--bad)" opacity=".4"/>
<path d="M150 110 C134 104 128 120 136 136" fill="none" stroke="var(--purple)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="230" cy="300" r="10" fill="var(--vessel)" opacity=".6"/>
</g>
<text x="40" y="84" class="small">Uña encarnada</text>
<line x1="127.8" y1="80" x2="154" y2="88" stroke="var(--muted)" stroke-width="1"/>
<text x="40" y="142" class="small">Juanete</text>
<line x1="88.2" y1="138" x2="136" y2="144" stroke="var(--muted)" stroke-width="1"/>
<text x="40" y="178" class="small">Callos</text>
<line x1="81.6" y1="174" x2="166" y2="158" stroke="var(--muted)" stroke-width="1"/>
<text x="268" y="284" class="small">Úlcera diabética</text>
<line x1="266" y1="280" x2="236" y2="318" stroke="var(--muted)" stroke-width="1"/>
<text x="250" y="394" class="small">Dolor de talón</text>
<line x1="248" y1="390" x2="216" y2="402" stroke="var(--muted)" stroke-width="1"/>
<text x="274" y="182" class="small">Hongos</text>
<text x="274" y="198" class="small" style="fill:var(--muted)">en uñas y piel</text>
<text x="416" y="76" class="h">Estudio de la pisada</text>
<rect x="420" y="96" width="22" height="60" rx="10" fill="var(--accent)" opacity="0.30"/>
<rect x="450" y="102" width="22" height="60" rx="10" fill="var(--accent)" opacity="0.42"/>
<rect x="480" y="96" width="22" height="60" rx="10" fill="var(--accent)" opacity="0.54"/>
<rect x="510" y="102" width="22" height="60" rx="10" fill="var(--accent)" opacity="0.66"/>
<rect x="540" y="96" width="22" height="60" rx="10" fill="var(--accent)" opacity="0.78"/>
<text x="580" y="116" class="small">Plataforma de presiones</text>
<text x="580" y="132" class="small" style="fill:var(--muted)">y análisis de la marcha</text>
<text x="416" y="200" class="h">Tratamientos</text>
<text x="416" y="226" class="lab">• Quiropodia: callos y uñas</text>
<text x="416" y="250" class="lab">• Plantillas a medida</text>
<text x="416" y="274" class="lab">• Cirugía menor de la uña</text>
<text x="416" y="298" class="lab">• Curas del pie diabético</text>
<rect x="416" y="336" width="344" height="84" rx="10" fill="var(--warn-l)"/>
<text x="432" y="360" class="step" style="fill:var(--warn)">Pie diabético</text>
<text x="432" y="382" class="small">Revisar los pies a diario y acudir ante</text>
<text x="432" y="400" class="small">heridas: prevenir amputaciones.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
