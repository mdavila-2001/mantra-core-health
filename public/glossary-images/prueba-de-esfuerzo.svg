<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de esfuerzo</title>
  <desc id="d">A la izquierda, una persona caminando en una cinta con electrodos en el pecho conectados a un electrocardiograma y un manguito de presión, con la carga que aumenta por etapas. A la derecha, qué busca la prueba, para qué se usa y cuándo se detiene.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Ejercicio con vigilancia</text>
  <path d="M60 360 L340 330 L350 350 L70 380 Z" fill="var(--muted)" stroke="none" stroke-width="2"/>
  <line x1="330" y1="330" x2="340" y2="230" stroke="var(--muted)" stroke-width="6"/>
  <rect x="310" y="214" width="70" height="24" rx="4" fill="var(--ink)" stroke="none" stroke-width="2"/>
  <circle cx="220" cy="120" r="20" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M220 140 L214 240 M216 170 L256 200 L300 222 M216 170 L190 210 M214 240 L240 290 L250 336 M214 240 L190 290 L170 344" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="206" cy="168" r="4" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <circle cx="226" cy="176" r="4" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <circle cx="212" cy="196" r="4" fill="var(--accent)" stroke="none" stroke-width="2"/>
  <rect x="60" y="70" width="120" height="74" rx="6" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M66 112 h14 l6 -20 l6 34 l6 -14 h16 l6 -20 l6 34 l6 -14 h16 l6 -20 l6 34 l6 -14 h8" fill="none" stroke="var(--vessel)" stroke-width="2"/>
  <text x="120" y="162" text-anchor="middle" class="small">Electrocardiograma</text>
  <rect x="60" y="190" width="40" height="30" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="80" y="240" text-anchor="middle" class="small">Presión</text>
  <text x="430" y="280" text-anchor="end" class="small" style="fill:var(--muted)">Cinta</text>
  <text x="430" y="296" text-anchor="end" class="small" style="fill:var(--muted)">o bicicleta</text>
  <text x="230" y="414" text-anchor="middle" class="small">La carga aumenta por etapas</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué busca</text>
  <text x="476" y="74" class="step">Cómo responde el corazón</text>
  <text x="484" y="98" class="small">• Dolor u opresión en el pecho</text>
  <text x="484" y="120" class="small">• Cambios en el electrocardiograma</text>
  <text x="484" y="142" class="small">• Ritmo y presión arterial</text>
  <text x="484" y="164" class="small">• Capacidad de ejercicio</text>
  <text x="476" y="210" class="step">Se usa para</text>
  <text x="484" y="234" class="small">• Estudiar dolor torácico</text>
  <text x="484" y="256" class="small">• Valorar enfermedad coronaria</text>
  <text x="484" y="278" class="small">• Planificar ejercicio tras un infarto</text>
  <rect x="476" y="314" width="284" height="108" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="492" y="340" class="step" style="fill:var(--warn)">Se detiene si aparece</text>
  <text x="500" y="364" class="small">• Dolor, mareo o mucha falta de aire</text>
  <text x="500" y="382" class="small">• Alteraciones del ritmo o la presión</text>
  <text x="500" y="400" class="small">• Cansancio que impide seguir</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
