<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d">
  <title id="t">Las formas de la malnutrición y cómo se mide la desnutrición infantil</title>
  <desc id="d">Tres grupos según la OMS. Desnutrición: emaciación (bajo peso para la talla, pérdida reciente y grave de peso), retraso del crecimiento (baja talla para la edad, desnutrición crónica o repetida) y bajo peso para la edad. Malnutrición por micronutrientes: falta o exceso de vitaminas y minerales; yodo, vitamina A y hierro son los más importantes en salud pública. Sobrepeso, obesidad y enfermedades no transmisibles relacionadas con la dieta. Debajo, los primeros 1000 días, desde la concepción hasta el segundo cumpleaños.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --a:#c0392b; --a-l:#f6d5cf; --b:#b7791f; --b-l:#f7e4bf; --c:#1f6fb2; --c-l:#d6e6f5; --ok:#1f8a5b; --ok-l:#d7f0e4; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --a:#ef7467; --a-l:#4a2a27; --b:#e0b25a; --b-l:#4a3b1f; --c:#6aa7e8; --c-l:#1f3347; --ok:#4cc38a; --ok-l:#1f4033; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .hd { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="440" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="400" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="52" text-anchor="middle" class="title">Malnutrición: tres grupos de problemas</text>

  <rect x="40" y="76" width="238" height="250" rx="10" fill="var(--a-l)" stroke="var(--a)" stroke-width="2"/>
  <text x="159" y="102" text-anchor="middle" class="hd" style="fill:var(--a)">Desnutrición</text>
  <text x="159" y="132" text-anchor="middle" class="lab" style="font-weight:700">Emaciación</text>
  <text x="159" y="150" text-anchor="middle" class="small">Bajo peso para la talla</text>
  <text x="159" y="166" text-anchor="middle" class="small muted">Pérdida reciente y grave</text>
  <text x="159" y="196" text-anchor="middle" class="lab" style="font-weight:700">Retraso del crecimiento</text>
  <text x="159" y="214" text-anchor="middle" class="small">Baja talla para la edad</text>
  <text x="159" y="230" text-anchor="middle" class="small muted">Desnutrición crónica o repetida</text>
  <text x="159" y="260" text-anchor="middle" class="lab" style="font-weight:700">Bajo peso</text>
  <text x="159" y="278" text-anchor="middle" class="small">Bajo peso para la edad</text>
  <text x="159" y="304" text-anchor="middle" class="small muted">Se puede tratar</text>

  <rect x="281" y="76" width="238" height="250" rx="10" fill="var(--b-l)" stroke="var(--b)" stroke-width="2"/>
  <text x="400" y="102" text-anchor="middle" class="hd" style="fill:var(--b)">Micronutrientes</text>
  <text x="400" y="134" text-anchor="middle" class="lab">Falta o exceso de</text>
  <text x="400" y="152" text-anchor="middle" class="lab">vitaminas y minerales</text>
  <text x="400" y="190" text-anchor="middle" class="small muted">Los más importantes en</text>
  <text x="400" y="206" text-anchor="middle" class="small muted">salud pública:</text>
  <text x="400" y="232" text-anchor="middle" class="lab" style="font-weight:700">Yodo · vitamina A · hierro</text>
  <text x="400" y="268" text-anchor="middle" class="small">Ejemplos: escorbuto (vitamina C),</text>
  <text x="400" y="284" text-anchor="middle" class="small">raquitismo (vitamina D),</text>
  <text x="400" y="300" text-anchor="middle" class="small">anemia (hierro o B12)</text>

  <rect x="522" y="76" width="238" height="250" rx="10" fill="var(--c-l)" stroke="var(--c)" stroke-width="2"/>
  <text x="641" y="102" text-anchor="middle" class="hd" style="fill:var(--c)">Exceso</text>
  <text x="641" y="134" text-anchor="middle" class="lab">Sobrepeso y obesidad</text>
  <text x="641" y="172" text-anchor="middle" class="lab">Enfermedades no</text>
  <text x="641" y="190" text-anchor="middle" class="lab">transmisibles de la dieta:</text>
  <text x="641" y="214" text-anchor="middle" class="small">enfermedad del corazón,</text>
  <text x="641" y="230" text-anchor="middle" class="small">accidente cerebrovascular,</text>
  <text x="641" y="246" text-anchor="middle" class="small">diabetes, algunos cánceres</text>
  <text x="641" y="284" text-anchor="middle" class="small muted">En un mismo país pueden</text>
  <text x="641" y="300" text-anchor="middle" class="small muted">convivir varias formas</text>

  <rect x="40" y="342" width="720" height="54" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
  <text x="400" y="365" text-anchor="middle" class="hd" style="fill:var(--ok)">Los primeros 1000 días: de la concepción al segundo cumpleaños</text>
  <text x="400" y="384" text-anchor="middle" class="small">Son clave para el mejor comienzo de la vida, con beneficios a largo plazo</text>
</svg>
