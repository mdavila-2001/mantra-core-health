<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cómo funciona una vacuna</title>
  <desc id="d">Tres pasos: la vacuna muestra al cuerpo una parte inofensiva del microbio; las defensas aprenden y fabrican anticuerpos y células de memoria; cuando llega el microbio real, la respuesta es rápida y se evita la enfermedad grave.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --warn:#c0392b; --ok:#1f8a5b; --beam:#f2c46d; --violet:#7b5ea7; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --warn:#ef7467; --ok:#4cc38a; --beam:#8a6f2f; --violet:#b39ddb; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <text x="400" y="42" text-anchor="middle" class="title">Una vacuna entrena a las defensas</text>
  <rect x="20" y="64" width="240" height="340" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="140" y="92" text-anchor="middle" class="step">1 · La vacuna</text>
  <rect x="70" y="140" width="110" height="34" rx="6" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <rect x="180" y="150" width="30" height="14" fill="var(--muted)"/>
  <path d="M70 157 H40" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="125" cy="235" r="22" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>
  <g fill="var(--beam)" stroke="var(--warn)"><circle cx="125" cy="213" r="5"/><circle cx="147" cy="235" r="5"/><circle cx="103" cy="235" r="5"/><circle cx="125" cy="257" r="5"/></g>
  <text x="140" y="300" text-anchor="middle" class="lab">Muestra una parte inofensiva</text>
  <text x="140" y="320" text-anchor="middle" class="lab">del microbio (antígeno)</text>
  <text x="140" y="346" text-anchor="middle" class="small muted">No causa la enfermedad</text>
  <path d="M262 230 H290" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
  <rect x="292" y="64" width="240" height="340" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="412" y="92" text-anchor="middle" class="step">2 · Aprendizaje</text>
  <circle cx="370" cy="170" r="28" fill="var(--violet)" opacity=".3" stroke="var(--violet)" stroke-width="2"/>
  <text x="370" y="175" text-anchor="middle" class="small">Defensa</text>
  <g stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M430 150 V170 M430 170 L420 160 M430 170 L440 160"/><path d="M465 175 V195 M465 195 L455 185 M465 195 L475 185"/><path d="M440 205 V225 M440 225 L430 215 M440 225 L450 215"/>
  </g>
  <text x="452" y="250" text-anchor="middle" class="small">Anticuerpos</text>
  <circle cx="370" cy="250" r="16" fill="var(--ok)" opacity=".35" stroke="var(--ok)" stroke-width="2"/>
  <text x="370" y="284" text-anchor="middle" class="small">Memoria</text>
  <text x="412" y="320" text-anchor="middle" class="lab">Se fabrican anticuerpos</text>
  <text x="412" y="340" text-anchor="middle" class="lab">y células de memoria</text>
  <path d="M534 230 H562" stroke="var(--muted)" stroke-width="3" marker-end="url(#a)"/>
  <rect x="564" y="64" width="216" height="340" rx="14" fill="var(--panel)" stroke="var(--ok)" stroke-width="2"/>
  <text x="672" y="92" text-anchor="middle" class="step" style="fill:var(--ok)">3 · Protección</text>
  <circle cx="672" cy="200" r="30" fill="var(--beam)" stroke="var(--warn)" stroke-width="2"/>
  <text x="672" y="205" text-anchor="middle" class="small">Microbio</text>
  <path d="M612 160 L640 180 M732 160 L704 180 M672 260 V232" stroke="var(--accent)" stroke-width="3" marker-end="url(#a)"/>
  <text x="672" y="300" text-anchor="middle" class="lab">Si llega el microbio real,</text>
  <text x="672" y="320" text-anchor="middle" class="lab">la respuesta es rápida</text>
  <text x="672" y="346" text-anchor="middle" class="small muted">Se evita o se suaviza la enfermedad</text>
  <text x="400" y="440" text-anchor="middle" class="lab">Cuantas más personas vacunadas, menos circula el microbio: inmunidad de grupo.</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
