<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hipotiroidismo</title>
  <desc id="d">A la izquierda, una persona con la tiroides en forma de mariposa en el cuello, que produce poca hormona; en el análisis la TSH sale alta y la T4 libre baja. A la derecha, los síntomas frecuentes, como cansancio, frío, aumento de peso o estreñimiento, la causa más común y el tratamiento con levotiroxina.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Poca hormona tiroidea</text>
  <circle cx="200" cy="160" r="74" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <path d="M150 250 C150 220 250 220 250 250 V300 H150 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="184.6" cy="262" rx="12.100000000000001" ry="20.900000000000002" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <ellipse cx="215.4" cy="262" rx="12.100000000000001" ry="20.900000000000002" fill="var(--organ)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="191.2" y="264.2" width="17.6" height="8.8" rx="3.3000000000000003" fill="var(--organ)"/>
  <path d="M234 262 L300 262" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="304" y="266" class="small">Tiroides</text>
  <text x="200" y="340" text-anchor="middle" class="lab">La tiroides produce poca T4 y T3</text>
  <text x="200" y="360" text-anchor="middle" class="lab">y el cuerpo funciona más despacio</text>
  <rect x="60" y="384" width="130" height="34" rx="8" fill="var(--warn)"/>
  <text x="125.0" y="405.68" text-anchor="middle" class="lab" style="fill:var(--on)">TSH alta</text>
  <rect x="210" y="384" width="130" height="34" rx="8" fill="var(--accent)"/>
  <text x="275.0" y="405.68" text-anchor="middle" class="lab" style="fill:var(--on)">T4 libre baja</text>
  <circle cx="176" cy="150" r="5" fill="var(--ink)"/>
  <circle cx="224" cy="150" r="5" fill="var(--ink)"/>
  <path d="M180 190 H220" fill="none" stroke="var(--ink)" stroke-width="2"/>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Síntomas frecuentes</text>
  <rect x="436" y="74" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="96.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Cansancio</text>
  <rect x="602" y="74" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="96.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Frío</text>
  <rect x="436" y="120" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="142.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Aumento de peso</text>
  <rect x="602" y="120" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="142.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Estreñimiento</text>
  <rect x="436" y="166" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="188.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Piel seca</text>
  <rect x="602" y="166" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="188.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Ánimo bajo</text>
  <rect x="436" y="212" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="515.0" y="234.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Pulso lento</text>
  <rect x="602" y="212" width="158" height="36" rx="8" fill="var(--accent-l)"/>
  <text x="681.0" y="234.68" text-anchor="middle" class="lab" style="fill:var(--ink)">Reglas alteradas</text>
  <text x="436" y="290" class="step">Causa más común</text>
  <text x="436" y="312" class="lab">Tiroiditis autoinmune (Hashimoto)</text>
  <rect x="436" y="340" width="324" height="80" rx="10" fill="var(--ok-l)"/>
  <text x="452" y="366" class="lab">Se trata reponiendo la hormona</text>
  <text x="452" y="386" class="lab">con levotiroxina y controles</text>
  <text x="452" y="406" class="lab">periódicos de TSH</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
