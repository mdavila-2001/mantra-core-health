<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Toxicología: vías de entrada y dosis</title>
  <desc id="d">A la izquierda, una silueta con las vías de entrada de un tóxico, inhalación, ingestión, piel e inyección, y los órganos que lo transforman y eliminan, el hígado y el riñón. A la derecha, una curva sin escala muestra que el efecto depende de la dosis, de inocuo a tóxico, y la lista de situaciones que atiende la toxicología.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Recorrido de un tóxico</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">La dosis hace el veneno</text>
<circle cx="200" cy="96.9" r="20.9" fill="var(--skin)" stroke="var(--line)"/>
<path d="M188.6 115.9 L152.5 129.2 C143.0 133.0 141.1 142.5 140.2 152.0 L131.6 237.5 L144.9 239.4 L156.3 163.4 L158.2 228.0 L156.3 361.0 L186.7 361.0 L196.2 247.0 L203.8 247.0 L213.3 361.0 L243.7 361.0 L241.8 228.0 L243.7 163.4 L255.1 239.4 L268.4 237.5 L259.9 152.0 C258.9 142.5 257.0 133.0 247.5 129.2 L211.4 115.9 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="204" cy="98" r="6" fill="var(--bad)"/>
<line x1="110.0" y1="88" x2="204" y2="98" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="92" class="small" style="fill:var(--bad)">Inhalación</text>
<circle cx="200" cy="110" r="6" fill="var(--bad)"/>
<line x1="103.4" y1="132" x2="200" y2="110" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="136" class="small" style="fill:var(--bad)">Ingestión</text>
<circle cx="252" cy="230" r="6" fill="var(--bad)"/>
<line x1="286" y1="256" x2="252" y2="230" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="290" y="260" class="small" style="fill:var(--bad)">Piel</text>
<circle cx="146" cy="230" r="6" fill="var(--bad)"/>
<line x1="103.4" y1="256" x2="146" y2="230" stroke="var(--bad)" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="260" class="small" style="fill:var(--bad)">Inyección</text>
<ellipse cx="186" cy="186" rx="18" ry="10" fill="var(--organ)"/>
<text x="290" y="180" class="small">Hígado: lo</text>
<text x="290" y="196" class="small">transforma</text>
<line x1="206" y1="186" x2="286" y2="178" stroke="var(--muted)" stroke-width="1"/>
<ellipse cx="214" cy="214" rx="6" ry="9" fill="var(--organ)"/>
<text x="290" y="220" class="small">Riñón: lo</text>
<text x="290" y="236" class="small">elimina</text>
<line x1="222" y1="214" x2="286" y2="216" stroke="var(--muted)" stroke-width="1"/>
<text x="200" y="408" text-anchor="middle" class="small" style="fill:var(--muted)">Absorción · distribución · transformación · eliminación</text>
<path d="M430 80 V250 H760" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M440 244 C540 240 570 220 600 170 C630 120 660 100 750 96" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="436" y="270" class="small" style="fill:var(--muted)">Dosis</text>
<text x="760" y="270" text-anchor="end" class="small" style="fill:var(--muted)">Más</text>
<text x="446" y="92" class="small" style="fill:var(--muted)">Efecto</text>
<rect x="450" y="196" width="110" height="30" rx="6" fill="var(--ok-l)"/>
<text x="505" y="216" text-anchor="middle" class="small">Inocuo o útil</text>
<rect x="640" y="112" width="110" height="30" rx="6" fill="var(--bad-l)"/>
<text x="695" y="132" text-anchor="middle" class="small">Tóxico</text>
<text x="416" y="306" class="h">Atiende</text>
<text x="416" y="332" class="small">• Intoxicaciones por fármacos</text>
<text x="416" y="354" class="small">• Productos químicos y del hogar</text>
<text x="416" y="376" class="small">• Picaduras y mordeduras</text>
<text x="416" y="398" class="small">• Drogas y alcohol</text>
<text x="416" y="424" class="small" style="fill:var(--muted)">Antídotos y centros de información toxicológica.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
