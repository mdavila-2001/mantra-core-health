<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Narcología</title>
  <desc id="d">A la izquierda, un cerebro con el circuito de la recompensa en el que la dopamina activa el placer y la motivación, y el ciclo de consumo, tolerancia y abstinencia. A la derecha, las sustancias que atiende la especialidad y cómo ayuda.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">El circuito de la recompensa</text>
  <path d="M100 220 C90 140 160 90 240 92 C330 94 370 150 360 220 C352 280 300 310 240 304 C200 330 140 320 120 290 C100 270 100 250 100 220 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" opacity=".7"/>
  <circle cx="250" cy="250" r="12" fill="var(--warn)" stroke="none" stroke-width="2"/>
  <circle cx="180" cy="170" r="14" fill="var(--violet)" stroke="none" stroke-width="2"/>
  <path d="M250 250 C230 220 200 190 184 176" fill="none" stroke="var(--warn)" stroke-width="4" marker-end="url(#ah)"/>
  <text x="266" y="272" class="small" style="fill:var(--warn)">Dopamina</text>
  <text x="180" y="140" text-anchor="middle" class="small" style="fill:var(--violet)">Placer y</text>
  <text x="180" y="156" text-anchor="middle" class="small" style="fill:var(--violet)">motivación</text>
  <rect x="68" y="340" width="104" height="40" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="120.0" y="365.0" text-anchor="middle" class="small">Consumo</text>
  <rect x="178" y="340" width="104" height="40" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="230.0" y="365.0" text-anchor="middle" class="small">Tolerancia</text>
  <rect x="288" y="340" width="104" height="40" rx="10" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="340.0" y="365.0" text-anchor="middle" class="small">Abstinencia</text>
  <line x1="172" y1="360" x2="176" y2="360" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="282" y1="360" x2="286" y2="360" stroke="var(--muted)" stroke-width="2" marker-end="url(#ah)"/>
  <text x="230" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">Las sustancias alteran este circuito</text>
  <rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="618.0" y="50" text-anchor="middle" class="title">Qué atiende</text>
  <text x="476" y="80" class="small">• Alcohol</text>
  <text x="476" y="102" class="small">• Tabaco y nicotina</text>
  <text x="476" y="124" class="small">• Opioides</text>
  <text x="476" y="146" class="small">• Cocaína y estimulantes</text>
  <text x="476" y="168" class="small">• Cannabis y sedantes</text>
  <text x="476" y="190" class="small">• Nuevas drogas sintéticas</text>
  <rect x="476" y="226" width="284" height="196" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="492" y="252" class="step">Cómo ayuda</text>
  <text x="500" y="276" class="small">• Desintoxicación segura</text>
  <text x="500" y="298" class="small">• Medicamentos que reducen el deseo</text>
  <text x="500" y="320" class="small">• Psicoterapia y grupos de apoyo</text>
  <text x="500" y="342" class="small">• Prevención de recaídas</text>
  <text x="500" y="364" class="small">• Reducción de daños</text>
  <text x="500" y="386" class="small">• Es una enfermedad tratable</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
