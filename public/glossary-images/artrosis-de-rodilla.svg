<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Artrosis de rodilla</title>
  <desc id="d">A la izquierda, una rodilla sana con cartílago grueso junto a una rodilla con artrosis, con cartílago gastado, espacio articular estrecho y osteofitos. A la derecha, síntomas, factores de riesgo y bases del tratamiento.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="110" y="50" text-anchor="middle" class="step">Rodilla sana</text>
  <text x="290" y="50" text-anchor="middle" class="step">Con artrosis</text>
  <path d="M70 60 L76 170 C50 190 54 222 80 226 H140 C166 222 170 190 144 170 L150 60 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M62 390 L70 280 C48 270 50 250 62 246 H158 C170 250 172 270 150 280 L158 390 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M60 214 C70 232 150 232 160 214" fill="none" stroke="var(--accent)" stroke-width="8"/>
  <path d="M60 254 C70 244 150 244 160 254" fill="none" stroke="var(--accent)" stroke-width="8"/>
  <path d="M250 60 L256 170 C230 190 234 222 260 226 H320 C346 222 350 190 324 170 L330 60 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M242 390 L250 280 C228 270 230 250 242 246 H338 C350 250 352 270 330 280 L338 390 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="1.5"/>
  <path d="M240 218 C250 236 280 238 290 236" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M240 250 C250 242 280 240 290 240" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <path d="M234 218 l-10 6 l8 4 Z M346 218 l10 6 l-8 4 Z M238 252 l-10 -4 l6 -6 Z" fill="var(--warn)" stroke="var(--warn)" stroke-width="1"/>
  <text x="110" y="410" text-anchor="middle" class="small" style="fill:var(--accent)">Cartílago grueso</text>
  <text x="290" y="410" text-anchor="middle" class="small" style="fill:var(--accent)">Cartílago gastado</text>
  <text x="200" y="140" text-anchor="middle" class="small" style="fill:var(--muted)">Fémur</text>
  <text x="200" y="330" text-anchor="middle" class="small" style="fill:var(--muted)">Tibia</text>
  <text x="290" y="160" text-anchor="middle" class="small" style="fill:var(--warn)">Osteofitos</text>
  <line x1="318" y1="166" x2="340" y2="206" stroke="var(--warn)" stroke-width="1"/>
  <line x1="290" y1="238" x2="290" y2="300" stroke="var(--ink)" stroke-width="1"/>
  <text x="290" y="316" text-anchor="middle" class="small">Espacio estrecho</text>
  <rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="588.0" y="50" text-anchor="middle" class="title">Qué ocurre y qué ayuda</text>
  <text x="416" y="80" class="step">Síntomas típicos</text>
  <text x="424" y="104" class="lab">• Dolor al caminar o subir escaleras</text>
  <text x="424" y="128" class="lab">• Rigidez breve al levantarse</text>
  <text x="424" y="152" class="lab">• Crujidos e hinchazón</text>
  <text x="424" y="176" class="lab">• Menos movilidad con los años</text>
  <text x="416" y="214" class="step">Factores de riesgo</text>
  <text x="424" y="238" class="lab">• Edad y sobrepeso</text>
  <text x="424" y="262" class="lab">• Lesiones previas de la rodilla</text>
  <text x="424" y="286" class="lab">• Desalineación (piernas en O o en X)</text>
  <rect x="416" y="320" width="344" height="104" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="432" y="346" class="step">Base del tratamiento</text>
  <text x="440" y="370" class="small">• Ejercicio de fuerza y bajar de peso</text>
  <text x="440" y="390" class="small">• Analgésicos y fisioterapia</text>
  <text x="440" y="410" class="small">• Prótesis si el daño es grave</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
