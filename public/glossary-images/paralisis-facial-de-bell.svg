<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Parálisis facial de Bell</title>
  <desc id="d">Rostro con una mitad sana y la otra caída: ceja baja, ojo que no cierra bien y boca desviada, por inflamación del nervio facial. A la derecha, las características, el tratamiento y los signos que hacen pensar en un ictus.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Debilidad de una mitad de la cara</text>
<ellipse cx="220" cy="210" rx="100" ry="130" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<path d="M150,150 Q180,138 206,150" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M234,158 Q260,154 290,160" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="180" cy="180" rx="14" ry="7" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
<circle cx="180" cy="180" r="4" fill="var(--ink)" stroke="none" stroke-width="1"/>
<ellipse cx="260" cy="184" rx="14" ry="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
<circle cx="260" cy="186" r="4" fill="var(--ink)" stroke="none" stroke-width="1"/>
<path d="M220,190 L214,230 L226,232" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M174,270 Q210,280 240,282 Q260,286 270,294" fill="none" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="120" text-anchor="middle" class="small">Lado sano</text>
<text x="370" y="120" text-anchor="middle" class="small" style="fill:var(--vessel)">Lado</text>
<text x="370" y="136" text-anchor="middle" class="small" style="fill:var(--vessel)">afectado</text>
<text x="370" y="200" text-anchor="middle" class="small">Ojo no</text>
<text x="370" y="216" text-anchor="middle" class="small">cierra bien</text>
<text x="370" y="300" text-anchor="middle" class="small">Boca</text>
<text x="370" y="316" text-anchor="middle" class="small">caída</text>
<text x="370" y="160" text-anchor="middle" class="small">Frente lisa</text>
<text x="220" y="374" text-anchor="middle" class="lab">Nervio facial inflamado (VII par),</text>
<text x="220" y="394" text-anchor="middle" class="lab">probablemente por un virus.</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Claves</text>
<text x="456" y="76" class="lab">• Aparece en horas o 1 a 2 días</text>
<text x="456" y="100" class="lab">• Afecta frente, ojo y boca del mismo lado</text>
<text x="456" y="124" class="lab">• Puede haber dolor tras la oreja</text>
<text x="456" y="148" class="lab">• Casi siempre mejora en semanas o meses</text>
<rect x="456" y="180" width="304" height="64" rx="10" fill="var(--ok-l)" stroke-width="1"/>
<text x="470" y="204" class="lab">Corticoides en los primeros días</text>
<text x="470" y="226" class="lab">Proteger el ojo: lágrimas, parche</text>
<rect x="456" y="262" width="304" height="130" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="468" y="284" class="step" style="fill:var(--warn)">Puede ser un ictus si hay:</text>
<text x="468" y="308" class="lab">• Debilidad de brazo o pierna</text>
<text x="468" y="332" class="lab">• Habla torpe o confusión</text>
<text x="468" y="356" class="lab">• La frente se mueve con normalidad</text>
<text x="468" y="380" class="lab">• Dolor de cabeza intenso</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
