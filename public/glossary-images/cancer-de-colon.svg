<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Colon y secuencia del pólipo al cáncer</title>
  <desc id="d">A la izquierda, el colon y el recto con sus tramos y dos pólipos marcados. A la derecha, cuatro etapas de la mucosa, de normal a pólipo, adenoma y cáncer invasivo, las pruebas de cribado y los signos que motivan consulta.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Colon y recto</text>
<path d="M100,320 L100,120 Q100,100 120,100 L290,100 Q310,100 310,120 L310,280 Q310,320 270,320 Q230,320 220,345 L215,400" fill="none" stroke="var(--organ-d)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M100,320 L100,120 Q100,100 120,100 L290,100 Q310,100 310,120 L310,280 Q310,320 270,320 Q230,320 220,345 L215,400" fill="none" stroke="var(--organ)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="100" cy="330" rx="20" ry="16" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2"/>
<text x="60" y="250" text-anchor="middle" class="small">Colon</text>
<text x="60" y="264" text-anchor="middle" class="small">ascendente</text>
<text x="205" y="90" text-anchor="middle" class="small">Colon transverso</text>
<text x="345" y="200" text-anchor="middle" class="small">Colon</text>
<text x="345" y="214" text-anchor="middle" class="small">descendente</text>
<text x="275" y="350" text-anchor="middle" class="small">Sigma</text>
<text x="255" y="398" class="small">Recto</text>
<circle cx="310" cy="250" r="9" fill="var(--purple)" stroke="var(--on)" stroke-width="2"/>
<circle cx="180" cy="100" r="7" fill="var(--purple)" stroke="var(--on)" stroke-width="2"/>
<text x="200" y="180" text-anchor="middle" class="lab" style="fill:var(--purple)">Pólipos</text>
<line x1="200" y1="186" x2="182" y2="104" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<line x1="220" y1="186" x2="302" y2="246" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Del pólipo al cáncer</text>
<rect x="420" y="120" width="70" height="16" rx="3" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<text x="455" y="176" text-anchor="middle" class="small">Mucosa</text>
<text x="455" y="192" text-anchor="middle" class="small">normal</text>
<line x1="492" y1="128" x2="506" y2="128" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="508" y="120" width="70" height="16" rx="3" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<ellipse cx="543" cy="120" rx="14.0" ry="8" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
<text x="543" y="176" text-anchor="middle" class="small">Pólipo</text>
<text x="543" y="192" text-anchor="middle" class="small">pequeño</text>
<line x1="580" y1="128" x2="594" y2="128" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="596" y="120" width="70" height="16" rx="3" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<ellipse cx="631" cy="120" rx="18.0" ry="16" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1.5"/>
<text x="631" y="176" text-anchor="middle" class="small">Adenoma</text>
<text x="631" y="192" text-anchor="middle" class="small">grande</text>
<line x1="668" y1="128" x2="682" y2="128" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="684" y="120" width="70" height="16" rx="3" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<ellipse cx="719" cy="120" rx="21.0" ry="22" fill="var(--vessel)" stroke="var(--organ-d)" stroke-width="1.5"/>
<path d="M704,136 L709,150 M729,136 L726,152" fill="none" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="719" y="176" text-anchor="middle" class="small">Cáncer</text>
<text x="719" y="192" text-anchor="middle" class="small">invasivo</text>
<text x="588" y="224" text-anchor="middle" class="lab" style="fill:var(--muted)">Suele tardar muchos años en avanzar.</text>
<rect x="416" y="246" width="344" height="78" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="428" y="268" class="step">Cribado: detectar antes de síntomas</text>
<text x="428" y="292" class="lab">• Test de sangre oculta en heces</text>
<text x="428" y="314" class="lab">• Colonoscopia: ve y extirpa pólipos</text>
<rect x="416" y="340" width="344" height="78" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="428" y="362" class="step" style="fill:var(--warn)">Consultar si:</text>
<text x="428" y="384" class="lab">• Sangre en heces o cambio del ritmo</text>
<text x="428" y="406" class="lab">• Anemia o pérdida de peso sin causa</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
