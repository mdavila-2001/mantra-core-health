<rect x="652" y="192" width="34" height="24" rx="4" fill="var(--bad-l)" stroke="var(--bad)" opacity=".5" stroke-dasharray="4 3"/>
<text x="669" y="270" text-anchor="middle" class="small">Útero, tejidos vecinos</text>
<text x="669" y="286" text-anchor="middle" class="small">y parte de la vagina</text>
<text x="40" y="334" class="small" style="fill:var(--muted)">En gris discontinuo: lo que se extirpa.</text>
<text x="40" y="364" class="h">Vías de acceso</text>
<text x="40" y="392" class="lab" style="fill:var(--accent)">Abdominal</text>
<text x="40" y="410" class="small" style="fill:var(--muted)">incisión en el vientre</text>
<text x="222" y="392" class="lab" style="fill:var(--accent)">Vaginal</text>
<text x="222" y="410" class="small" style="fill:var(--muted)">sin cicatriz externa</text>
<text x="404" y="392" class="lab" style="fill:var(--accent)">Laparoscópica</text>
<text x="404" y="410" class="small" style="fill:var(--muted)">pequeñas incisiones</text>
<text x="586" y="392" class="lab" style="fill:var(--accent)">Robótica</text>
<text x="586" y="410" class="small" style="fill:var(--muted)">laparoscopia asistida</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
