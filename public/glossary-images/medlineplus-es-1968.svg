<ellipse cx="597.24" cy="163.68" rx="12.48" ry="8.58" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="1.5"/>
<ellipse cx="740.76" cy="163.68" rx="12.48" ry="8.58" fill="var(--purple-l)" stroke="var(--purple)" stroke-width="1.5"/>
