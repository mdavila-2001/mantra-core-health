<path d="M96.48 132.48 C96.48 120 149.52 120 149.52 132.48 C149.52 159.0 137.04 174.6 133.92 182.4 L112.08 182.4 C108.96 174.6 96.48 159.0 96.48 132.48 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" opacity=".35"/>
<rect x="112.08" y="182.4" width="21.84" height="12.48" rx="4" fill="var(--organ)"/>
<path d="M113.64 194.88 L110.52 221.4 L135.48 221.4 L132.36 194.88" fill="var(--skin)" stroke="var(--organ)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
