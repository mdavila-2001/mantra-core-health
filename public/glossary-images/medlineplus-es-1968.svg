<path d="M460.48 132.48 C460.48 120 513.52 120 513.52 132.48 C513.52 159.0 501.04 174.6 497.92 182.4 L476.08 182.4 C472.96 174.6 460.48 159.0 460.48 132.48 Z" fill="var(--organ-l)" stroke="var(--organ)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" opacity=".35"/>
<rect x="476.08" y="182.4" width="21.84" height="12.48" rx="4" fill="var(--organ)" stroke-dasharray="4 3" opacity=".35"/>
<path d="M477.64 194.88 L474.52 221.4 L499.48 221.4 L496.36 194.88" fill="var(--skin)" stroke="var(--organ)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="487" y="270" text-anchor="middle" class="small">Además trompas</text>
<text x="487" y="286" text-anchor="middle" class="small">y ovarios</text>
<rect x="586" y="66" width="166" height="244" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<text x="669" y="92" text-anchor="middle" class="step">Radical</text>
<path d="M645.6 135.6 C622.2 127.8 606.6 135.6 598.8 151.2" fill="none" stroke="var(--organ)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" opacity=".35"/>
