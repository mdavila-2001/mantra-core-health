<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Grupo sanguíneo</title>
  <desc id="d">Arriba, cuatro glóbulos rojos de los grupos A, B, AB y O, con sus antígenos en la superficie y los anticuerpos que hay en el plasma de cada grupo. Abajo a la izquierda, el factor Rh positivo o negativo según exista el antígeno D. Abajo a la derecha, cómo se determina: la sangre se mezcla con reactivos anti-A, anti-B y anti-D y la formación de grumos indica reacción.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400.0" y="50" text-anchor="middle" class="title">Sistema ABO: antígenos en el glóbulo rojo</text>
  <circle cx="120" cy="140" r="44" fill="var(--vessel)" opacity=".85"/>
  <circle cx="120" cy="140" r="20" fill="var(--bad)" opacity=".4"/>
  <path d="M172 133 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M157 170 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M120 185 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M83 170 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M68 133 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M83 96 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M120 81 l7 12 h-14 Z" fill="var(--accent)"/>
  <path d="M157 96 l7 12 h-14 Z" fill="var(--accent)"/>
  <text x="120" y="146" text-anchor="middle" class="step on">Grupo A</text>
  <text x="120" y="222" text-anchor="middle" class="small">Anti-B en plasma</text>
  <circle cx="306" cy="140" r="44" fill="var(--vessel)" opacity=".85"/>
  <circle cx="306" cy="140" r="20" fill="var(--bad)" opacity=".4"/>
  <circle cx="358" cy="140" r="6" fill="var(--warn)"/>
  <circle cx="343" cy="177" r="6" fill="var(--warn)"/>
  <circle cx="306" cy="192" r="6" fill="var(--warn)"/>
  <circle cx="269" cy="177" r="6" fill="var(--warn)"/>
  <circle cx="254" cy="140" r="6" fill="var(--warn)"/>
  <circle cx="269" cy="103" r="6" fill="var(--warn)"/>
  <circle cx="306" cy="88" r="6" fill="var(--warn)"/>
  <circle cx="343" cy="103" r="6" fill="var(--warn)"/>
  <text x="306" y="146" text-anchor="middle" class="step on">Grupo B</text>
  <text x="306" y="222" text-anchor="middle" class="small">Anti-A en plasma</text>
  <circle cx="492" cy="140" r="44" fill="var(--vessel)" opacity=".85"/>
  <circle cx="492" cy="140" r="20" fill="var(--bad)" opacity=".4"/>
  <path d="M544 133 l7 12 h-14 Z" fill="var(--accent)"/>
  <circle cx="529" cy="177" r="6" fill="var(--warn)"/>
  <path d="M492 185 l7 12 h-14 Z" fill="var(--accent)"/>
  <circle cx="455" cy="177" r="6" fill="var(--warn)"/>
  <path d="M440 133 l7 12 h-14 Z" fill="var(--accent)"/>
  <circle cx="455" cy="103" r="6" fill="var(--warn)"/>
  <path d="M492 81 l7 12 h-14 Z" fill="var(--accent)"/>
  <circle cx="529" cy="103" r="6" fill="var(--warn)"/>
  <text x="492" y="146" text-anchor="middle" class="step on">Grupo AB</text>
  <text x="492" y="222" text-anchor="middle" class="small">Sin anti-A ni anti-B</text>
  <circle cx="678" cy="140" r="44" fill="var(--vessel)" opacity=".85"/>
  <circle cx="678" cy="140" r="20" fill="var(--bad)" opacity=".4"/>
  <text x="678" y="146" text-anchor="middle" class="step on">Grupo O</text>
  <text x="678" y="222" text-anchor="middle" class="small">Anti-A y anti-B</text>
  <path d="M300 250 l7 12 h-14 Z" fill="var(--accent)"/>
  <text x="314" y="261" class="small">Antígeno A</text>
  <circle cx="440" cy="256" r="6" fill="var(--warn)"/>
  <text x="452" y="261" class="small">Antígeno B</text>
  <rect x="20" y="284" width="370" height="166" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="205.0" y="314" text-anchor="middle" class="title">Factor Rh</text>
  <rect x="40" y="330" width="160" height="50" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="120" y="352" text-anchor="middle" class="step">Rh positivo</text>
  <text x="120" y="370" text-anchor="middle" class="small">tiene antígeno D</text>
  <rect x="210" y="330" width="160" height="50" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="290" y="352" text-anchor="middle" class="step">Rh negativo</text>
  <text x="290" y="370" text-anchor="middle" class="small">no lo tiene</text>
  <text x="205" y="410" text-anchor="middle" class="small muted">Importa en transfusiones y en el embarazo</text>
  <rect x="410" y="284" width="370" height="166" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="595.0" y="314" text-anchor="middle" class="title">Cómo se determina</text>
  <rect x="440" y="330" width="26" height="70" rx="12" fill="var(--panel)" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="443" y="356" width="20" height="41" rx="9" fill="var(--vessel)"/>
  <rect x="437" y="322" width="32" height="14" rx="4" fill="var(--accent)"/>
  <circle cx="530" cy="364" r="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="522" cy="358" r="5" fill="var(--vessel)"/>
  <circle cx="536" cy="356" r="5" fill="var(--vessel)"/>
  <circle cx="526" cy="372" r="5" fill="var(--vessel)"/>
  <circle cx="539" cy="369" r="5" fill="var(--vessel)"/>
  <circle cx="530" cy="364" r="5" fill="var(--vessel)"/>
  <text x="530" y="406" text-anchor="middle" class="small">Anti-A</text>
  <circle cx="610" cy="364" r="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="610" cy="364" r="18" fill="var(--vessel)" opacity=".35"/>
  <text x="610" y="406" text-anchor="middle" class="small">Anti-B</text>
  <circle cx="690" cy="364" r="24" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="682" cy="358" r="5" fill="var(--vessel)"/>
  <circle cx="696" cy="356" r="5" fill="var(--vessel)"/>
  <circle cx="686" cy="372" r="5" fill="var(--vessel)"/>
  <circle cx="699" cy="369" r="5" fill="var(--vessel)"/>
  <circle cx="690" cy="364" r="5" fill="var(--vessel)"/>
  <text x="690" y="406" text-anchor="middle" class="small">Anti-D</text>
  <text x="610" y="432" text-anchor="middle" class="small muted">Grumos = reacción. Ejemplo: A positivo</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
