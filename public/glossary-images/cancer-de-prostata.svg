<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Cáncer de próstata</title>
  <desc id="d">A la izquierda, corte lateral de la pelvis masculina con la vejiga, la próstata rodeando la uretra, un tumor en su parte posterior y el recto detrás. A la derecha, cómo se estudia: PSA en sangre, tacto rectal, resonancia y biopsia, y algunos datos a tener en cuenta como la ausencia de síntomas al inicio y el aumento del riesgo con la edad.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="420" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="230.0" y="50" text-anchor="middle" class="title">Dónde está la próstata</text>
  <path d="M120 90 C120 60 260 60 260 90 L260 180 C260 210 120 210 120 180 Z" fill="var(--beam)" opacity=".55" stroke="var(--line)" stroke-width="2"/>
  <text x="190" y="140" text-anchor="middle" class="step">Vejiga</text>
  <ellipse cx="190" cy="240" rx="56" ry="40" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <path d="M190 200 V360" stroke="var(--beam)" stroke-width="8"/>
  <ellipse cx="218" cy="258" rx="16" ry="12" fill="var(--purple)"/>
  <path d="M300 60 C330 140 320 220 280 290 C260 330 270 380 300 420" fill="none" stroke="var(--organ)" stroke-width="30" stroke-linecap="round" opacity=".5"/>
  <text x="330" y="140" class="lab">Recto</text>
  <circle cx="150" cy="240" r="3" fill="var(--ink)"/>
  <path d="M150 240 L48 300" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="52" y="304" class="lab">Próstata</text>
  <circle cx="218" cy="258" r="3" fill="var(--ink)"/>
  <path d="M218 258 L260 330" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="264" y="334" class="lab">Tumor</text>
  <text x="190" y="380" text-anchor="middle" class="small muted">Uretra</text>
  <text x="60" y="420" class="small muted">Corte lateral. El tumor suele crecer en la</text>
  <text x="60" y="436" class="small muted">parte posterior, junto al recto</text>
  <rect x="460" y="20" width="320" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="620.0" y="50" text-anchor="middle" class="title">Cómo se estudia</text>
  <rect x="480" y="60" width="280" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="496" y="80" class="step">PSA</text>
  <text x="496" y="98" class="small">Análisis de sangre</text>
  <rect x="480" y="122" width="280" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="496" y="142" class="step">Tacto rectal</text>
  <text x="496" y="160" class="small">Exploración física</text>
  <rect x="480" y="184" width="280" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="496" y="204" class="step">Resonancia</text>
  <text x="496" y="222" class="small">Localiza zonas sospechosas</text>
  <rect x="480" y="246" width="280" height="48" rx="10" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="496" y="266" class="step">Biopsia</text>
  <text x="496" y="284" class="small">Confirma el diagnóstico</text>
  <text x="480" y="330" class="step">A tener en cuenta</text>
  <text x="480" y="356" class="small">• Al inicio no suele dar síntomas</text>
  <text x="480" y="378" class="small">• Riesgo mayor con la edad</text>
  <text x="480" y="400" class="small">• Antecedentes familiares</text>
  <text x="480" y="422" class="small">• Muchos crecen muy despacio</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
