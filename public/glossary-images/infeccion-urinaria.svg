<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Infección urinaria por niveles</title>
  <desc id="d">Aparato urinario con riñones, uréteres, vejiga y uretra, señalando pielonefritis en el riñón, cistitis en la vejiga y uretritis en la uretra. A la derecha, un frasco de orina con las pruebas diagnósticas y medidas de prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="220.0" y="50" text-anchor="middle" class="title">Según el nivel afectado</text>
<path d="M110,74.0 C77.6,72.2 77.6,147.8 110,146.0 C129.8,144.2 120.8,119.0 115.4,110 C120.8,101.0 129.8,75.8 110,74.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M250,74.0 C282.4,72.2 282.4,147.8 250,146.0 C230.2,144.2 239.2,119.0 244.6,110 C239.2,101.0 230.2,75.8 250,74.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120,146 Q140,220 160,262 M240,146 Q220,220 200,262" fill="none" stroke="var(--organ-d)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M130,280 Q130,250 180,250 Q230,250 230,280 Q230,330 180,334 Q130,330 130,280 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="173" y="334" width="14" height="40" rx="4" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="1"/>
<rect x="276" y="84" width="128" height="52" rx="8" fill="var(--vessel)" stroke-width="1"/>
<text x="340.0" y="106.7" text-anchor="middle" class="small" style="fill:var(--on)">Pielonefritis</text>
<text x="340.0" y="121.7" text-anchor="middle" class="small" style="fill:var(--on)">riñón: vías altas</text>
<line x1="270" y1="110" x2="262" y2="110" stroke="var(--vessel)" stroke-width="2"/>
<rect x="276" y="262" width="128" height="52" rx="8" fill="var(--warn)" stroke-width="1"/>
<text x="340.0" y="284.7" text-anchor="middle" class="small" style="fill:var(--on)">Cistitis</text>
<text x="340.0" y="299.7" text-anchor="middle" class="small" style="fill:var(--on)">vejiga</text>
<line x1="236" y1="288" x2="272" y2="288" stroke="var(--warn)" stroke-width="2"/>
<rect x="276" y="346" width="128" height="46" rx="8" fill="var(--beam)" stroke-width="1"/>
<text x="340.0" y="365.7" text-anchor="middle" class="small" style="fill:var(--ink)">Uretritis</text>
<text x="340.0" y="380.7" text-anchor="middle" class="small" style="fill:var(--ink)">uretra</text>
<line x1="190" y1="360" x2="272" y2="368" stroke="var(--warn)" stroke-width="2"/>
<text x="180" y="72" text-anchor="middle" class="small">Riñones</text>
<text x="60" y="300" text-anchor="middle" class="small" style="fill:var(--muted)">Vías bajas</text>
<text x="76" y="190" text-anchor="middle" class="small" style="fill:var(--vessel)">Fiebre, dolor</text>
<text x="76" y="206" text-anchor="middle" class="small" style="fill:var(--vessel)">lumbar</text>
<text x="180" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Ardor, urgencia y ganas frecuentes</text>
<rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="608.0" y="50" text-anchor="middle" class="title">Diagnóstico y prevención</text>
<path d="M460,78 L466,152 Q490,160 514,152 L520,78 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M463,108 L466,150 Q490,157 514,150 L517,108 Z" fill="var(--beam)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="456" y="62" width="68" height="16" rx="4" fill="var(--accent)" stroke-width="1"/>
<text x="490" y="172" text-anchor="middle" class="small">Orina</text>
<text x="546" y="84" class="lab">Tira reactiva</text>
<text x="546" y="106" class="lab">Urocultivo y</text>
<text x="546" y="128" class="lab">antibiograma</text>
<text x="546" y="160" class="small" style="fill:var(--muted)">(muestra del chorro medio)</text>
<rect x="456" y="196" width="304" height="122" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="468" y="218" class="step">Ayuda a prevenir</text>
<text x="468" y="242" class="lab">• Beber agua suficiente</text>
<text x="468" y="264" class="lab">• No retener la orina</text>
<text x="468" y="286" class="lab">• Orinar después de las relaciones</text>
<text x="468" y="308" class="lab">• Higiene de delante hacia atrás</text>
<text x="456" y="350" class="lab">Más riesgo: mujeres, embarazo,</text>
<text x="456" y="370" class="lab">diabetes, sonda o cálculos.</text>
<text x="456" y="404" class="step">El antibiótico lo indica el médico.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
