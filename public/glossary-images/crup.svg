<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Crup (laringotraqueítis)</title>
  <desc id="d">A la izquierda, comparación de la vía aérea de un niño normal y con crup, en la que la región subglótica, justo debajo de las cuerdas vocales, está hinchada y estrechada. A la derecha, los signos característicos, tos perruna, estridor, ronquera y empeoramiento nocturno, y los signos que obligan a acudir a urgencias.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Vía aérea del niño</text>
  <path d="M98.0 90 V150 L105.0 200 V240 L98.0 280 V380 H142.0 V280 L135.0 240 V200 L142.0 150 V90 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <line x1="98.0" y1="295" x2="142.0" y2="295" stroke="var(--line)" stroke-width="2"/>
  <line x1="98.0" y1="313" x2="142.0" y2="313" stroke="var(--line)" stroke-width="2"/>
  <line x1="98.0" y1="331" x2="142.0" y2="331" stroke="var(--line)" stroke-width="2"/>
  <line x1="98.0" y1="349" x2="142.0" y2="349" stroke="var(--line)" stroke-width="2"/>
  <line x1="98.0" y1="367" x2="142.0" y2="367" stroke="var(--line)" stroke-width="2"/>
  <path d="M258.0 90 V150 L274.0 200 V240 L258.0 280 V380 H302.0 V280 L286.0 240 V200 L302.0 150 V90 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M258.0 190 L274.0 200 V240 L258.0 260 Z M302.0 190 L286.0 200 V240 L302.0 260 Z" fill="var(--warn)" opacity=".7"/>
  <line x1="258.0" y1="295" x2="302.0" y2="295" stroke="var(--line)" stroke-width="2"/>
  <line x1="258.0" y1="313" x2="302.0" y2="313" stroke="var(--line)" stroke-width="2"/>
  <line x1="258.0" y1="331" x2="302.0" y2="331" stroke="var(--line)" stroke-width="2"/>
  <line x1="258.0" y1="349" x2="302.0" y2="349" stroke="var(--line)" stroke-width="2"/>
  <line x1="258.0" y1="367" x2="302.0" y2="367" stroke="var(--line)" stroke-width="2"/>
  <text x="120" y="74" text-anchor="middle" class="step" style="fill:var(--ok)">Normal</text>
  <text x="280" y="74" text-anchor="middle" class="step" style="fill:var(--warn)">Crup</text>
  <text x="200" y="214" text-anchor="middle" class="small">Subglotis</text>
  <path d="M176 210 L146 216 M224 210 L266 220" fill="none" stroke="var(--muted)" stroke-width="1"/>
  <text x="200" y="330" text-anchor="middle" class="small muted">Tráquea</text>
  <text x="200" y="404" text-anchor="middle" class="lab">Una hinchazón pequeña estrecha</text>
  <text x="200" y="422" text-anchor="middle" class="lab">mucho el paso del aire</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Cómo se reconoce</text>
  <rect x="436" y="62" width="324" height="44" rx="10" fill="var(--tissue)"/>
  <text x="452" y="89" class="step">Tos perruna</text>
  <text x="590" y="89" class="small muted">como un ladrido</text>
  <rect x="436" y="116" width="324" height="44" rx="10" fill="var(--tissue)"/>
  <text x="452" y="143" class="step">Estridor</text>
  <text x="590" y="143" class="small muted">ruido agudo al inspirar</text>
  <rect x="436" y="170" width="324" height="44" rx="10" fill="var(--tissue)"/>
  <text x="452" y="197" class="step">Ronquera</text>
  <text x="590" y="197" class="small muted">voz apagada</text>
  <rect x="436" y="224" width="324" height="44" rx="10" fill="var(--tissue)"/>
  <text x="452" y="251" class="step">Peor de noche</text>
  <text x="590" y="251" class="small muted">tras un catarro</text>
  <rect x="436" y="290" width="324" height="130" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="314" class="step" style="fill:var(--warn)">Urgencias si</text>
  <text x="456" y="340" class="small">• Estridor también en reposo</text>
  <text x="456" y="362" class="small">• Se hunde la piel entre costillas</text>
  <text x="456" y="384" class="small">• Labios azulados o babeo</text>
  <text x="456" y="406" class="small">• Agitación o mucho decaimiento</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
