<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Partes principales del encéfalo</title>
  <desc id="d">Vista lateral simplificada del encéfalo con los lóbulos frontal, parietal, temporal y occipital en colores distintos, el cerebelo y el tronco del encéfalo, y una leyenda con la función principal de cada parte.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --warn:#c0392b; --ok:#1f8a5b; --beam:#f2c46d; --violet:#7b5ea7; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --warn:#ef7467; --ok:#4cc38a; --beam:#8a6f2f; --violet:#b39ddb; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="500" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="270" y="50" text-anchor="middle" class="title">El encéfalo visto de lado</text>
  <path d="M80 250 C60 150 150 80 250 80 C280 80 300 84 310 90 L290 260 C230 290 160 300 120 290 C100 285 85 270 80 250 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M310 90 C360 100 390 120 400 150 L330 230 L290 260 Z" fill="var(--ok)" opacity=".35" stroke="var(--ok)" stroke-width="2"/>
  <path d="M400 150 C430 180 440 230 420 270 L360 290 L330 230 Z" fill="var(--violet)" opacity=".35" stroke="var(--violet)" stroke-width="2"/>
  <path d="M120 290 C160 300 230 290 290 260 L330 230 L360 290 C330 330 250 340 200 330 C160 322 130 310 120 290 Z" fill="var(--beam)" opacity=".7" stroke="var(--warn)" stroke-width="2"/>
  <path d="M340 300 C360 290 410 290 420 310 C428 330 400 352 370 350 C345 348 330 325 340 300 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M290 320 C300 340 300 380 296 410 L320 410 C322 380 326 345 330 325 Z" fill="var(--tissue)" stroke="var(--muted)" stroke-width="2"/>
  <g fill="none" stroke="var(--muted)" stroke-width="1.5" opacity=".7">
    <path d="M140 140 C170 160 150 200 180 220"/><path d="M200 110 C220 140 200 170 230 200"/><path d="M340 130 C350 160 330 180 350 200"/><path d="M180 300 C220 300 250 290 280 280"/>
  </g>
  <text x="170" y="180" text-anchor="middle" class="step">Frontal</text>
  <text x="345" y="150" text-anchor="middle" class="step">Parietal</text>
  <text x="392" y="250" text-anchor="middle" class="step">Occipital</text>
  <text x="230" y="312" text-anchor="middle" class="step">Temporal</text>
  <text x="380" y="378" text-anchor="middle" class="lab">Cerebelo</text>
  <text x="250" y="432" class="lab">Tronco del encéfalo</text>
  <text x="60" y="80" class="small muted">Delante</text>
  <text x="460" y="80" class="small muted">Detrás</text>
  <rect x="536" y="20" width="244" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="658" y="50" text-anchor="middle" class="title">Funciones</text>
  <rect x="552" y="72" width="14" height="14" rx="3" fill="var(--accent-l)" stroke="var(--accent)"/>
  <text x="574" y="84" class="step">Frontal</text>
  <text x="574" y="104" class="small">Planificar, decidir, moverse,</text>
  <text x="574" y="120" class="small">hablar, personalidad</text>
  <rect x="552" y="140" width="14" height="14" rx="3" fill="var(--ok)" opacity=".5"/>
  <text x="574" y="152" class="step">Parietal</text>
  <text x="574" y="172" class="small">Tacto, dolor, posición,</text>
  <text x="574" y="188" class="small">orientación en el espacio</text>
  <rect x="552" y="208" width="14" height="14" rx="3" fill="var(--beam)"/>
  <text x="574" y="220" class="step">Temporal</text>
  <text x="574" y="240" class="small">Audición, memoria,</text>
  <text x="574" y="256" class="small">comprensión del lenguaje</text>
  <rect x="552" y="276" width="14" height="14" rx="3" fill="var(--violet)" opacity=".5"/>
  <text x="574" y="288" class="step">Occipital</text>
  <text x="574" y="308" class="small">Visión</text>
  <rect x="552" y="328" width="14" height="14" rx="3" fill="var(--bone)"/>
  <text x="574" y="340" class="step">Cerebelo</text>
  <text x="574" y="360" class="small">Equilibrio y coordinación</text>
  <rect x="552" y="380" width="14" height="14" rx="3" fill="var(--tissue)" stroke="var(--muted)"/>
  <text x="574" y="392" class="step">Tronco del encéfalo</text>
  <text x="574" y="412" class="small">Respiración, latido,</text>
  <text x="574" y="428" class="small">vigilia y sueño</text>
  <text x="400" y="472" text-anchor="middle" class="small muted">Esquema simplificado, sin escala. Ilustración original de AloVida.</text>
</svg>
