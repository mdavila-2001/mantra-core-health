<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mecanismos de hipoxemia y respuesta al oxígeno</title>
  <desc id="d">Cinco filas, una por mecanismo de hipoxemia: aire inspirado pobre en oxígeno, hipoventilación, desajuste entre ventilación y perfusión, alteración de la difusión y cortocircuito. Cada fila muestra un ejemplo clínico y una barra con la respuesta esperada al oxígeno suplementario, que es alta en los tres primeros mecanismos, buena en la difusión y escasa en el cortocircuito.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --bar:#1f8a5b; --barbg:#e4ebf3; --warn:#c0392b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --bar:#4cc38a; --barbg:#2a3746; --warn:#ef7467; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .name { font-size: 15px; font-weight: 700; }
    .cap { font-size: 13px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="16" y="16" width="768" height="448" rx="16" fill="var(--panel)" stroke="var(--line)"/>
  <text x="400" y="48" text-anchor="middle" class="title">Cinco mecanismos de hipoxemia</text>
  <text x="40" y="82" class="h muted">MECANISMO Y EJEMPLO</text>
  <text x="500" y="82" class="h muted">RESPUESTA AL OXÍGENO</text>

  <g>
    <text x="40" y="112" class="name">Aire con poco oxígeno</text>
    <text x="40" y="131" class="cap muted">Altitud, espacios cerrados</text>
    <rect x="500" y="100" width="240" height="22" rx="11" fill="var(--barbg)"/>
    <rect x="500" y="100" width="228" height="22" rx="11" fill="var(--bar)"/>
    <text x="500" y="144" class="cap">Muy buena</text>
  </g>
  <path d="M40 158 H760" stroke="var(--line)"/>
  <g>
    <text x="40" y="188" class="name">Hipoventilación</text>
    <text x="40" y="207" class="cap muted">Opioides, debilidad muscular; sube el CO2</text>
    <rect x="500" y="176" width="240" height="22" rx="11" fill="var(--barbg)"/>
    <rect x="500" y="176" width="190" height="22" rx="11" fill="var(--bar)"/>
    <text x="500" y="220" class="cap">Buena, pero no corrige la ventilación</text>
  </g>
  <path d="M40 234 H760" stroke="var(--line)"/>
  <g>
    <text x="40" y="264" class="name">Desajuste ventilación-perfusión</text>
    <text x="40" y="283" class="cap muted">EPOC, asma, neumonía, atelectasia</text>
    <rect x="500" y="252" width="240" height="22" rx="11" fill="var(--barbg)"/>
    <rect x="500" y="252" width="212" height="22" rx="11" fill="var(--bar)"/>
    <text x="500" y="296" class="cap">Buena</text>
  </g>
  <path d="M40 310 H760" stroke="var(--line)"/>
  <g>
    <text x="40" y="340" class="name">Alteración de la difusión</text>
    <text x="40" y="359" class="cap muted">Enfermedad intersticial, enfisema</text>
    <rect x="500" y="328" width="240" height="22" rx="11" fill="var(--barbg)"/>
    <rect x="500" y="328" width="190" height="22" rx="11" fill="var(--bar)"/>
    <text x="500" y="372" class="cap">Buena</text>
  </g>
  <path d="M40 386 H760" stroke="var(--line)"/>
  <g>
    <text x="40" y="416" class="name">Cortocircuito (shunt)</text>
    <text x="40" y="435" class="cap muted">Alvéolos llenos de líquido, cardiopatía congénita</text>
    <rect x="500" y="404" width="240" height="22" rx="11" fill="var(--barbg)"/>
    <rect x="500" y="404" width="46" height="22" rx="11" fill="var(--warn)"/>
    <text x="500" y="448" class="cap">Escasa: hay que reabrir o tratar la causa</text>
  </g>
</svg>
