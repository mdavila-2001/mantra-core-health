<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Partes de una prótesis de pierna</title>
  <desc id="d">A la izquierda, una prótesis por debajo de la rodilla con el muñón, el liner, el encaje hecho a medida, el pilón y el pie protésico. A la derecha, los tipos de prótesis de pierna y de brazo y las etapas de adaptación: muñón curado, molde, prueba y entrenamiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Prótesis de extremidad: partes y adaptación</text>
  <rect x="20" y="60" width="380" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="90" text-anchor="middle" class="title">Prótesis por debajo de la rodilla</text>
  <path d="M150 102 L230 102 L232 190 C232 220 212 236 190 236 C168 236 148 220 148 190 Z" fill="var(--skin)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M140 160 L240 160 L236 250 C230 270 150 270 144 250 Z" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2" opacity=".9"/>
  <path d="M152 172 L228 172" fill="none" stroke="var(--pur)" stroke-width="4"/>
  <rect x="182" y="268" width="16" height="110" rx="4" fill="var(--muted)" stroke="none"/>
  <path d="M170 378 L210 378 C230 380 268 392 270 410 L150 410 C150 392 158 380 170 378 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <line x1="236" y1="120" x2="280" y2="110" stroke="var(--muted)" stroke-width="1"/>
  <text x="284" y="114" class="lab">Muñón</text>
  <line x1="238" y1="175" x2="280" y2="160" stroke="var(--muted)" stroke-width="1"/>
  <text x="284" y="164" class="lab">Liner</text>
  <line x1="236" y1="230" x2="280" y2="210" stroke="var(--muted)" stroke-width="1"/>
  <text x="284" y="214" class="lab">Encaje</text>
  <text x="284" y="230" class="small muted">a medida</text>
  <line x1="198" y1="320" x2="280" y2="300" stroke="var(--muted)" stroke-width="1"/>
  <text x="284" y="304" class="lab">Pilón</text>
  <line x1="260" y1="400" x2="290" y2="380" stroke="var(--muted)" stroke-width="1"/>
  <text x="294" y="384" class="lab">Pie</text>
  <text x="294" y="400" class="lab">protésico</text>
  <text x="60" y="280" class="small">Suspensión:</text>
  <text x="60" y="296" class="small">vacío, pin</text>
  <text x="60" y="312" class="small">o correas</text>
  <rect x="416" y="60" width="364" height="200" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="90" text-anchor="middle" class="title">Tipos</text>
  <text x="434" y="112" class="lab">• Transtibial y transfemoral</text>
  <text x="434" y="142" class="lab">• De brazo: estética, por cable</text>
  <text x="445" y="172" class="lab">o mioeléctrica (señal del músculo)</text>
  <text x="434" y="202" class="lab">• Deportivas y para el agua</text>
  <rect x="416" y="276" width="364" height="164" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="306" text-anchor="middle" class="title">El proceso</text>
  <rect x="430" y="316" width="80" height="60" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="470.0" y="343.0" text-anchor="middle" class="lab b">Muñón</text>
  <text x="470.0" y="360.0" text-anchor="middle" class="small muted">curado</text>
  <line x1="512" y1="346.0" x2="518" y2="346.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="520" y="316" width="80" height="60" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="560.0" y="351.0" text-anchor="middle" class="lab">Molde</text>
  <line x1="602" y1="346.0" x2="608" y2="346.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="610" y="316" width="80" height="60" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="650.0" y="351.0" text-anchor="middle" class="lab">Prueba</text>
  <line x1="692" y1="346.0" x2="698" y2="346.0" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="700" y="316" width="80" height="60" rx="10" fill="var(--ok-l)" stroke="var(--ok)"/>
  <text x="740.0" y="351.0" text-anchor="middle" class="lab">Entreno</text>
  <text x="598" y="410" text-anchor="middle" class="small muted">Fisioterapia y revisiones del encaje</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
