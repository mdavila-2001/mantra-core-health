<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Verrugas: cómo se forman y tipos</title>
  <desc id="d">Corte de la piel con una verruga elevada y la epidermis engrosada por el virus del papiloma humano. A la derecha, los tipos común, plantar, plana y filiforme, y las medidas de manejo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="420" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="230.0" y="50" text-anchor="middle" class="title">Una verruga en la piel</text>
<rect x="40" y="210" width="380" height="40" rx="2" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<rect x="40" y="250" width="380" height="130" rx="2" fill="var(--vessel-l)" stroke="var(--line)" stroke-width="1" opacity=".6"/>
<path d="M160,210 Q170,130 230,128 Q290,130 300,210 L300,250 Q230,270 160,250 Z" fill="var(--skin)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="176" y1="176" x2="176" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="192" y1="176" x2="192" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="208" y1="150" x2="208" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="224" y1="150" x2="224" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="240" y1="150" x2="240" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="256" y1="150" x2="256" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="272" y1="176" x2="272" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<line x1="288" y1="176" x2="288" y2="240" stroke="var(--organ-d)" stroke-width="1"/>
<circle cx="200" cy="170" r="4" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="230" cy="160" r="4" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="260" cy="176" r="4" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="214" cy="200" r="4" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="248" cy="206" r="4" fill="var(--purple)" stroke="none" stroke-width="1"/>
<text x="330" y="140" class="small" style="fill:var(--purple)">Virus del papiloma</text>
<text x="330" y="156" class="small" style="fill:var(--purple)">humano (VPH)</text>
<line x1="326" y1="150" x2="266" y2="176" stroke="var(--purple)" stroke-width="1.5"/>
<text x="48" y="232" class="small">Epidermis engrosada</text>
<text x="48" y="370" class="small">Dermis</text>
<text x="230" y="410" text-anchor="middle" class="lab">El virus entra por pequeñas heridas.</text>
<rect x="456" y="20" width="324" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="618.0" y="50" text-anchor="middle" class="title">Tipos frecuentes</text>
<rect x="476" y="56" width="284" height="44" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="74" class="step">Común</text>
<text x="490" y="92" class="small">manos y dedos, superficie rugosa</text>
<rect x="476" y="108" width="284" height="44" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="490" y="126" class="step">Plantar</text>
<text x="490" y="144" class="small">planta del pie, duele al pisar</text>
<rect x="476" y="160" width="284" height="44" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="490" y="178" class="step">Plana</text>
<text x="490" y="196" class="small">cara y piernas, lisas y pequeñas</text>
<rect x="476" y="212" width="284" height="44" rx="8" fill="var(--tissue)" stroke-width="1"/>
<text x="490" y="230" class="step">Filiforme</text>
<text x="490" y="248" class="small">alargadas, cerca de boca u ojos</text>
<rect x="476" y="272" width="284" height="122" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="488" y="294" class="step">Manejo</text>
<text x="488" y="318" class="lab">• Muchas desaparecen solas</text>
<text x="488" y="340" class="lab">• Ácido salicílico o crioterapia</text>
<text x="488" y="362" class="lab">• No rascar ni compartir toallas</text>
<text x="488" y="384" class="lab">• Calzado en duchas comunes</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
