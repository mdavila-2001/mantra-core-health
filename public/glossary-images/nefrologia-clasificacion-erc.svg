<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Mapa de riesgo de la enfermedad renal crónica (KDIGO 2024)</title>
  <desc id="d">Cuadrícula que cruza las seis categorías de filtrado glomerular, de G1 a G5, con las tres categorías de albuminuria, de A1 a A3. Las celdas se colorean de verde a rojo según el riesgo de progresión y de complicaciones: bajo, moderado, alto y muy alto.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --r0:#bfe3cc; --r1:#f6e3a1; --r2:#f4b97d; --r3:#e88a80; --r0t:#14532d; --r1t:#5c4300; --r2t:#6b3300; --r3t:#6e140c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --r0:#245c3d; --r1:#6b5a1c; --r2:#82501f; --r3:#8e3a33; --r0t:#d6f2e0; --r1t:#fbefc2; --r2t:#fde0c2; --r3t:#fcd5d0; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .lab { font-size: 13px; }
    .col { font-size: 15px; font-weight: 700; }
    .g { font-size: 16px; font-weight: 800; }
    .cell { font-size: 13px; font-weight: 700; }
    .r0 { fill: var(--r0); } .r1 { fill: var(--r1); } .r2 { fill: var(--r2); } .r3 { fill: var(--r3); }
    .t0 { fill: var(--r0t); } .t1 { fill: var(--r1t); } .t2 { fill: var(--r2t); } .t3 { fill: var(--r3t); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="24" y="36" class="title">Riesgo en la enfermedad renal crónica: filtrado y albuminuria</text>
  <rect x="24" y="52" width="752" height="388" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="165" y="84" text-anchor="middle" class="col">Filtrado glomerular</text>
  <text x="165" y="102" text-anchor="middle" class="lab muted">ml/min/1,73 m²</text>
  <text x="360.0" y="72" text-anchor="middle" class="col">A1</text>
  <text x="360.0" y="89" text-anchor="middle" class="lab">&lt; 30 mg/g</text>
  <text x="360.0" y="106" text-anchor="middle" class="lab muted" style="font-size:11.5px">normal o leve</text>
  <text x="480.0" y="72" text-anchor="middle" class="col">A2</text>
  <text x="480.0" y="89" text-anchor="middle" class="lab">30–300 mg/g</text>
  <text x="480.0" y="106" text-anchor="middle" class="lab muted" style="font-size:11.5px">moderada</text>
  <text x="600.0" y="72" text-anchor="middle" class="col">A3</text>
  <text x="600.0" y="89" text-anchor="middle" class="lab">&gt; 300 mg/g</text>
  <text x="600.0" y="106" text-anchor="middle" class="lab muted" style="font-size:11.5px">grave</text>
  <text x="44" y="146" class="g">G1</text>
  <text x="92" y="139" class="lab" style="font-weight:700">≥ 90</text>
  <text x="92" y="154" class="lab muted" style="font-size:11.5px">Normal o alto</text>
  <rect x="302" y="122" width="116" height="40" rx="6" class="r0"/>
  <text x="360.0" y="147.0" text-anchor="middle" class="cell t0">Bajo</text>
  <rect x="422" y="122" width="116" height="40" rx="6" class="r1"/>
  <text x="480.0" y="147.0" text-anchor="middle" class="cell t1">Moderado</text>
  <rect x="542" y="122" width="116" height="40" rx="6" class="r2"/>
  <text x="600.0" y="147.0" text-anchor="middle" class="cell t2">Alto</text>
  <text x="44" y="190" class="g">G2</text>
  <text x="92" y="183" class="lab" style="font-weight:700">60–89</text>
  <text x="92" y="198" class="lab muted" style="font-size:11.5px">Levemente disminuido</text>
  <rect x="302" y="166" width="116" height="40" rx="6" class="r0"/>
  <text x="360.0" y="191.0" text-anchor="middle" class="cell t0">Bajo</text>
  <rect x="422" y="166" width="116" height="40" rx="6" class="r1"/>
  <text x="480.0" y="191.0" text-anchor="middle" class="cell t1">Moderado</text>
  <rect x="542" y="166" width="116" height="40" rx="6" class="r2"/>
  <text x="600.0" y="191.0" text-anchor="middle" class="cell t2">Alto</text>
  <text x="44" y="234" class="g">G3a</text>
  <text x="92" y="227" class="lab" style="font-weight:700">45–59</text>
  <text x="92" y="242" class="lab muted" style="font-size:11.5px">Leve a moderadamente disminuido</text>
  <rect x="302" y="210" width="116" height="40" rx="6" class="r1"/>
  <text x="360.0" y="235.0" text-anchor="middle" class="cell t1">Moderado</text>
  <rect x="422" y="210" width="116" height="40" rx="6" class="r2"/>
  <text x="480.0" y="235.0" text-anchor="middle" class="cell t2">Alto</text>
  <rect x="542" y="210" width="116" height="40" rx="6" class="r3"/>
  <text x="600.0" y="235.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <text x="44" y="278" class="g">G3b</text>
  <text x="92" y="271" class="lab" style="font-weight:700">30–44</text>
  <text x="92" y="286" class="lab muted" style="font-size:11.5px">Moderada a gravemente disminuido</text>
  <rect x="302" y="254" width="116" height="40" rx="6" class="r2"/>
  <text x="360.0" y="279.0" text-anchor="middle" class="cell t2">Alto</text>
  <rect x="422" y="254" width="116" height="40" rx="6" class="r3"/>
  <text x="480.0" y="279.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="542" y="254" width="116" height="40" rx="6" class="r3"/>
  <text x="600.0" y="279.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <text x="44" y="322" class="g">G4</text>
  <text x="92" y="315" class="lab" style="font-weight:700">15–29</text>
  <text x="92" y="330" class="lab muted" style="font-size:11.5px">Gravemente disminuido</text>
  <rect x="302" y="298" width="116" height="40" rx="6" class="r3"/>
  <text x="360.0" y="323.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="422" y="298" width="116" height="40" rx="6" class="r3"/>
  <text x="480.0" y="323.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="542" y="298" width="116" height="40" rx="6" class="r3"/>
  <text x="600.0" y="323.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <text x="44" y="366" class="g">G5</text>
  <text x="92" y="359" class="lab" style="font-weight:700">&lt; 15</text>
  <text x="92" y="374" class="lab muted" style="font-size:11.5px">Fallo renal</text>
  <rect x="302" y="342" width="116" height="40" rx="6" class="r3"/>
  <text x="360.0" y="367.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="422" y="342" width="116" height="40" rx="6" class="r3"/>
  <text x="480.0" y="367.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="542" y="342" width="116" height="40" rx="6" class="r3"/>
  <text x="600.0" y="367.0" text-anchor="middle" class="cell t3">Muy alto</text>
  <rect x="672" y="140" width="14" height="14" rx="3" class="r0"/><text x="692" y="152" class="lab" style="font-size:12px">Riesgo bajo</text>
  <rect x="672" y="170" width="14" height="14" rx="3" class="r1"/><text x="692" y="182" class="lab" style="font-size:12px">Riesgo moderado</text>
  <rect x="672" y="200" width="14" height="14" rx="3" class="r2"/><text x="692" y="212" class="lab" style="font-size:12px">Riesgo alto</text>
  <rect x="672" y="230" width="14" height="14" rx="3" class="r3"/><text x="692" y="242" class="lab" style="font-size:12px">Riesgo muy alto</text>
  <text x="44" y="412" class="lab muted">Se requiere daño o filtrado alterado durante más de 3 meses. Cuanto más abajo y a la derecha,</text>
  <text x="44" y="430" class="lab muted">mayor el riesgo de progresión, de complicaciones y de muerte cardiovascular.</text>
  <text x="400" y="464" text-anchor="middle" class="lab muted">Clasificación de la guía KDIGO 2024. Ilustración original de AloVida.</text>
</svg>