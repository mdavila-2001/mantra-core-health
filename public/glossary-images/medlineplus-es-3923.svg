<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Partes de una prótesis total de cadera</title>
  <desc id="d">A la izquierda, una cadera con artrosis con el cartílago gastado y osteofitos entre la pelvis y el fémur. A la derecha, la articulación reemplazada con la copa acetabular, el inserto, la cabeza femoral artificial y el vástago dentro del fémur.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f6; --ok:#1f8a5b; --ok-l:#d9f0e5; --warn:#b7651a; --warn-l:#f8ebd0; --red:#c0392b; --red-l:#f7dcd8; --pur:#7b3b8e; --pur-l:#eadcf0; --skin:#f0cdb6; --organ:#e7a39a; --bone:#e3dccb; --tissue:#e9edf2; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a157; --warn-l:#3d2f1c; --red:#ef7467; --red-l:#43241f; --pur:#c08ad4; --pur-l:#36283f; --skin:#8a6a58; --organ:#9a5a52; --bone:#6b6556; --tissue:#2a3541; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .b { font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="40" text-anchor="middle" class="title">Reemplazo de cadera: partes de la prótesis</text>
  <rect x="20" y="60" width="300" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="170.0" y="88" text-anchor="middle" class="h">Cadera con artrosis</text>
  <path d="M60 110 C120 100 200 120 230 170 L200 210 C170 180 130 170 70 180 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="190" cy="205" r="34" fill="var(--bone)" stroke="var(--muted)"/>
  <path d="M170 230 L210 230 L230 420 L180 420 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <text x="110" y="150" text-anchor="middle" class="lab b">Pelvis</text>
  <text x="250" y="330" class="lab b">Fémur</text>
  <text x="60" y="270" class="small">Cartílago</text>
  <text x="60" y="286" class="small">gastado y</text>
  <text x="60" y="302" class="small">osteofitos</text>
  <line x1="118" y1="282" x2="160" y2="214" stroke="var(--muted)" stroke-width="1"/>
  <rect x="336" y="60" width="444" height="380" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="558.0" y="88" text-anchor="middle" class="title">Componentes artificiales</text>
  <path d="M376 110 C436 100 516 120 546 170 L516 210 C486 180 446 170 386 180 Z" fill="var(--bone)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M470 200 A40 40 0 0 1 550 200 Z" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>
  <path d="M478 200 A32 32 0 0 1 542 200 Z" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <circle cx="510" cy="205" r="24" fill="var(--muted)" stroke="none"/>
  <path d="M502 226 L518 226 L524 270 L516 400 L504 400 L496 270 Z" fill="var(--muted)" stroke="var(--muted)" stroke-width="2"/>
  <path d="M486 240 L530 240 L540 420 L480 420 Z" fill="var(--bone)" stroke="var(--line)" stroke-width="2" opacity=".5"/>
  <line x1="550" y1="190" x2="600" y2="140" stroke="var(--muted)" stroke-width="1"/>
  <text x="604" y="136" class="lab">Copa acetabular</text>
  <text x="604" y="152" class="small muted">metal</text>
  <line x1="542" y1="200" x2="600" y2="190" stroke="var(--muted)" stroke-width="1"/>
  <text x="604" y="186" class="lab">Inserto</text>
  <text x="604" y="202" class="small muted">polietileno o cerámica</text>
  <line x1="530" y1="214" x2="600" y2="244" stroke="var(--muted)" stroke-width="1"/>
  <text x="604" y="240" class="lab">Cabeza femoral</text>
  <text x="604" y="256" class="small muted">metal o cerámica</text>
  <line x1="522" y1="330" x2="600" y2="320" stroke="var(--muted)" stroke-width="1"/>
  <text x="604" y="316" class="lab">Vástago</text>
  <text x="604" y="332" class="small muted">dentro del fémur</text>
  <text x="352" y="370" class="small b">Objetivo:</text>
  <text x="352" y="388" class="small">menos dolor</text>
  <text x="352" y="406" class="small">y más movilidad</text>
  <text x="760" y="410" text-anchor="end" class="small muted">Rehabilitación desde el día siguiente</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
