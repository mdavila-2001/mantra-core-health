<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Conjuntivitis</title>
  <desc id="d">A la izquierda, un ojo visto de frente con la conjuntiva enrojecida y vasos dilatados, y una lista de señales de alarma como dolor intenso, visión borrosa o sensibilidad a la luz. A la derecha, las tres causas frecuentes: vírica con lagrimeo acuoso, bacteriana con secreción espesa y alérgica con picor en ambos ojos.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">El ojo con conjuntivitis</text>
  <path d="M60 200 Q220 80 380 200 Q220 320 60 200 Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M60 200 Q220 80 380 200 Q220 320 60 200 Z" fill="var(--bad)" opacity=".18"/>
  <circle cx="220" cy="200" r="58" fill="var(--accent)"/>
  <circle cx="220" cy="200" r="24" fill="var(--ink)"/>
  <circle cx="232" cy="188" r="7" fill="var(--panel)"/>
  <path d="M100 196 q20 -10 40 -2 M104 214 q20 6 42 0 M300 190 q20 -6 40 4 M298 214 q22 8 42 -2 M120 180 q8 -8 20 -10 M310 226 q10 6 22 4" fill="none" stroke="var(--vessel)" stroke-width="1.6"/>
  <circle cx="110" cy="200" r="3" fill="var(--ink)"/>
  <path d="M110 200 L70 280" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="74" y="284" class="lab">Conjuntiva enrojecida</text>
  <circle cx="250" cy="170" r="3" fill="var(--ink)"/>
  <path d="M250 170 L300 110" stroke="var(--muted)" stroke-width="1.2" fill="none"/>
  <text x="304" y="114" class="lab">Córnea e iris</text>
  <text x="220" y="330" text-anchor="middle" class="small muted">La conjuntiva es la capa fina que cubre</text>
  <text x="220" y="346" text-anchor="middle" class="small muted">el blanco del ojo y el interior del párpado</text>
  <text x="40" y="386" text-anchor="fill:var(--bad)" class="step">Señales de alarma</text>
  <text x="40" y="410" class="small">• Dolor intenso o visión borrosa</text>
  <text x="40" y="430" class="small">• Molestia fuerte con la luz</text>
  <text x="250" y="410" class="small">• Usa lentes de contacto</text>
  <text x="250" y="430" class="small">• Recién nacido</text>
  <rect x="440" y="20" width="340" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="50" text-anchor="middle" class="title">Tres causas frecuentes</text>
  <rect x="460" y="64" width="300" height="96" rx="12" fill="var(--accent-l)" stroke="var(--line)"/>
  <text x="480" y="92" class="big">Vírica</text>
  <text x="480" y="118" class="lab">Lagrimeo acuoso</text>
  <text x="480" y="140" class="small muted">Muy contagiosa</text>
  <rect x="460" y="176" width="300" height="96" rx="12" fill="var(--warn-l)" stroke="var(--line)"/>
  <text x="480" y="204" class="big">Bacteriana</text>
  <text x="480" y="230" class="lab">Secreción espesa</text>
  <text x="480" y="252" class="small muted">Párpados pegados</text>
  <rect x="460" y="288" width="300" height="96" rx="12" fill="var(--purple-l)" stroke="var(--line)"/>
  <text x="480" y="316" class="big">Alérgica</text>
  <text x="480" y="342" class="lab">Picor intenso</text>
  <text x="480" y="364" class="small muted">Ambos ojos, no contagia</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
