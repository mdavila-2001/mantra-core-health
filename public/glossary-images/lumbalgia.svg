<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Lumbalgia (dolor lumbar)</title>
  <desc id="d">A la izquierda, una silueta humana con las vértebras lumbares y la zona baja de la espalda resaltada; una nota explica que casi siempre es inespecífica. A la derecha, las medidas que ayudan, como mantenerse activo y el calor, y una lista de señales de alarma que requieren valoración médica.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">La zona lumbar</text>
  <circle cx="200" cy="93.12" r="26.880000000000003" fill="var(--tissue)" stroke="var(--line)" stroke-width="1"/>
  <path d="M152.95999999999998 133.44 Q200 120.0 247.04000000000002 133.44 L253.76 254.4 L233.6 261.12 L233.6 400.00000000000006 L206.72 400.00000000000006 L200 276.8 L193.28 400.00000000000006 L166.4 400.00000000000006 L166.4 261.12 L146.24 254.4 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M152.95999999999998 135.68 L126.08 254.4 L139.51999999999998 256.64 L157.44 176.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M247.04000000000002 135.68 L273.92 254.4 L260.48 256.64 L242.56 176.0 Z" fill="var(--tissue)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="188" y="120" width="24" height="16" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="188" y="142" width="24" height="16" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="188" y="164" width="24" height="16" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="188" y="186" width="24" height="16" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <rect x="188" y="208" width="24" height="16" rx="6" fill="var(--bone)" stroke="var(--line)"/>
  <ellipse cx="200" cy="228" rx="52" ry="34" fill="var(--warn)" opacity=".35"/>
  <text x="270" y="228" class="step" style="fill:var(--warn)">Lumbar</text>
  <rect x="40" y="360" width="340" height="66" rx="10" fill="var(--tissue)"/>
  <text x="210" y="386" text-anchor="middle" class="lab">Casi siempre es inespecífica:</text>
  <text x="210" y="406" text-anchor="middle" class="lab">músculos y ligamentos, sin lesión grave</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Qué ayuda y qué alarma</text>
  <text x="436" y="76" class="step" style="fill:var(--ok)">Lo que ayuda</text>
  <text x="440" y="102" class="lab">• Mantenerse activo, sin reposo en cama</text>
  <text x="440" y="126" class="lab">• Calor local</text>
  <text x="440" y="150" class="lab">• Analgésicos si hacen falta</text>
  <text x="440" y="174" class="lab">• Ejercicio cuando mejore</text>
  <rect x="436" y="210" width="324" height="210" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="236" class="step" style="fill:var(--warn)">Señales de alarma</text>
  <text x="456" y="264" class="small">• Pérdida de control de orina o heces</text>
  <text x="456" y="286" class="small">• Adormecimiento en la zona genital</text>
  <text x="456" y="308" class="small">• Debilidad en las piernas</text>
  <text x="456" y="330" class="small">• Fiebre o pérdida de peso</text>
  <text x="456" y="352" class="small">• Antecedente de cáncer</text>
  <text x="456" y="374" class="small">• Tras un golpe fuerte o caída</text>
  <text x="456" y="396" class="small">• Dolor nocturno que no cede</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
