<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Prueba de la fóvea: edema con y sin godet</title>
  <desc id="d">Comparación en cuatro escenas. A la izquierda, edema con fóvea: al presionar con el dedo unos segundos sobre la piel se forma una depresión que persiste al retirar el dedo. A la derecha, edema sin fóvea: la piel se hunde poco y recupera su forma de inmediato, como ocurre en el linfedema y el mixedema. Una nota explica la graduación de 1 más a 4 más.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --yel:#c99a00; --yel-l:#fbefc2; --blue:#2f6fb5; --blue-l:#dbe9f7; --grn:#1f8a5b; --grn-l:#d8f0e4; --red:#c0392b; --red-l:#f8dcd8; --brn:#8a5a2b; --brn-l:#efdcc6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --yel:#e0b93a; --yel-l:#4a4224; --blue:#6aa6e6; --blue-l:#22384f; --grn:#4cc38a; --grn-l:#1f3d31; --red:#ef7467; --red-l:#4a2723; --brn:#c99a66; --brn-l:#3d3125; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); font-size: 13px; text-anchor: middle; }
    .muted { fill: var(--muted); }
    .title { font-size: 20px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 13px; }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="28" class="title">Prueba de la fóvea (signo del godet)</text>

  <rect x="20" y="44" width="372" height="40" rx="10" fill="var(--blue-l)" stroke="var(--blue)" stroke-width="2"/>
  <text x="206" y="70" class="h">Edema con fóvea</text>
  <rect x="408" y="44" width="372" height="40" rx="10" fill="var(--yel-l)" stroke="var(--yel)" stroke-width="2"/>
  <text x="594" y="70" class="h">Edema sin fóvea</text>

  <!-- fila 1 -->
  <text x="206" y="112" class="s muted">1. Se presiona con el dedo unos segundos</text>
  <text x="594" y="112" class="s muted">1. Se presiona con el dedo unos segundos</text>
  <g transform="translate(46 172)">
    <path d="M0 0 H116 Q160 36 204 0 H320 V46 H0 Z" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
    <rect x="132" y="-46" width="56" height="70" rx="26" fill="var(--yel-l)" stroke="var(--yel)" stroke-width="2"/>
    <text x="10" y="38" class="s" style="text-anchor:start">piel y tejido con líquido</text>
  </g>
  <g transform="translate(434 172)">
    <path d="M0 0 H128 Q160 10 192 0 H320 V46 H0 Z" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
    <rect x="132" y="-46" width="56" height="56" rx="26" fill="var(--yel-l)" stroke="var(--yel)" stroke-width="2"/>
    <text x="10" y="38" class="s" style="text-anchor:start">piel firme, tejido fibroso</text>
  </g>

  <!-- fila 2 -->
  <text x="206" y="274" class="s muted">2. Se retira el dedo</text>
  <text x="594" y="274" class="s muted">2. Se retira el dedo</text>
  <g transform="translate(46 316)">
    <path d="M0 0 H128 Q160 22 192 0 H320 V46 H0 Z" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
    <path d="M160 -26 V4" stroke="var(--red)" stroke-width="3" stroke-linecap="round" marker-end="url(#hr)"/>
  </g>
  <g transform="translate(434 316)">
    <path d="M0 0 H320 V46 H0 Z" fill="var(--brn-l)" stroke="var(--brn)" stroke-width="2"/>
  </g>
  <text x="206" y="392" class="h" style="fill:var(--red)">La marca persiste</text>
  <text x="206" y="410" class="s">tarda segundos o minutos en borrarse</text>
  <text x="594" y="392" class="h" style="fill:var(--grn)">La piel recupera su forma</text>
  <text x="594" y="410" class="s">típico del linfedema, el mixedema y el lipedema</text>

  <rect x="20" y="424" width="760" height="30" rx="8" fill="none" stroke="var(--line)"/>
  <text x="400" y="444" class="s">Se gradúa de 1+ (leve, se borra pronto) a 4+ (profundo y persistente); los criterios varían entre autores.</text>
  <text x="400" y="472" class="s muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
  <defs><marker id="hr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--red)"/></marker></defs>
</svg>
