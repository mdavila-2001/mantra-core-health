<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Síndrome metabólico</title>
  <desc id="d">Silueta con la grasa abdominal marcada y cinco etiquetas unidas a ella: cintura grande, presión alta, glucosa alta, triglicéridos altos y colesterol HDL bajo. A la derecha, los riesgos que aumenta, la base común de grasa abdominal y resistencia a la insulina, y las medidas que ayudan.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Componentes</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Por qué importa</text>
<circle cx="200" cy="138.0" r="18.0" fill="var(--skin)" stroke="var(--line)"/>
<path d="M190.2 154.4 L159.0 165.9 C150.8 169.2 149.2 177.4 148.3 185.6 L141.0 259.4 L152.4 261.0 L162.3 195.4 L163.9 251.2 L162.3 366.0 L188.5 366.0 L196.7 267.6 L203.3 267.6 L211.5 366.0 L237.7 366.0 L236.1 251.2 L237.7 195.4 L247.6 261.0 L259.0 259.4 L251.7 185.6 C250.8 177.4 249.2 169.2 241.0 165.9 L209.8 154.4 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>
<ellipse cx="200" cy="214" rx="46" ry="34" fill="var(--warn)" opacity=".45"/>
<rect x="40" y="90" width="126.2" height="30" rx="8" fill="var(--warn-l)" stroke="var(--warn)"/>
<text x="103.1" y="110" text-anchor="middle" class="lab">Cintura grande</text>
<line x1="103.1" y1="120" x2="176" y2="210" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="260" y="90" width="111.6" height="30" rx="8" fill="var(--purple-l)" stroke="var(--purple)"/>
<text x="315.8" y="110" text-anchor="middle" class="lab">Presión alta</text>
<line x1="315.8" y1="120" x2="226" y2="160" stroke="var(--purple)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="40" y="356" width="111.6" height="30" rx="8" fill="var(--tissue)" stroke="var(--vessel)"/>
<text x="95.8" y="376" text-anchor="middle" class="lab">Glucosa alta</text>
<line x1="95.8" y1="356" x2="176" y2="262" stroke="var(--vessel)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="206" y="356" width="162.7" height="30" rx="8" fill="var(--tissue)" stroke="var(--yellow)"/>
<text x="287.35" y="376" text-anchor="middle" class="lab">Triglicéridos altos</text>
<line x1="287.4" y1="356" x2="226" y2="262" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="40" y="210" width="82.4" height="30" rx="8" fill="var(--accent-l)" stroke="var(--accent)"/>
<text x="81.2" y="230" text-anchor="middle" class="lab">HDL bajo</text>
<line x1="122.4" y1="225" x2="166" y2="230" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="200" y="412" text-anchor="middle" class="small" style="fill:var(--muted)">Se diagnostica cuando se juntan</text>
<text x="200" y="428" text-anchor="middle" class="small" style="fill:var(--muted)">varios de estos factores.</text>
<text x="416" y="76" class="h" style="fill:var(--bad)">Aumenta el riesgo de</text>
<text x="416" y="102" class="lab">• Infarto e ictus</text>
<text x="416" y="126" class="lab">• Diabetes tipo 2</text>
<text x="416" y="150" class="lab">• Hígado graso</text>
<text x="416" y="192" class="h">Base común</text>
<text x="416" y="216" class="lab">Exceso de grasa abdominal y</text>
<text x="416" y="234" class="lab">resistencia a la insulina.</text>
<text x="416" y="276" class="h" style="fill:var(--ok)">Qué ayuda</text>
<text x="416" y="302" class="lab">• Alimentación saludable</text>
<text x="416" y="326" class="lab">• Actividad física regular</text>
<text x="416" y="350" class="lab">• Bajar de peso</text>
<text x="416" y="374" class="lab">• No fumar</text>
<text x="416" y="398" class="lab">• Tratar cada factor</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
