<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Psiquiatría de la adicción</title>
  <desc id="d">A la izquierda, dos círculos superpuestos que representan la patología dual: una adicción al alcohol u otras drogas y otro trastorno mental como depresión o ansiedad, que llevan a un tratamiento integrado por el mismo equipo. A la derecha, los pasos del trabajo, desde la evaluación hasta la prevención de recaídas.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Patología dual</text>
  <circle cx="160" cy="200" r="96" fill="var(--warn)" opacity=".35"/>
  <circle cx="280" cy="200" r="96" fill="var(--purple)" opacity=".35"/>
  <text x="126" y="190" text-anchor="middle" class="step">Adicción</text>
  <text x="126" y="210" text-anchor="middle" class="small muted">alcohol, drogas</text>
  <text x="314" y="190" text-anchor="middle" class="step">Otro trastorno</text>
  <text x="314" y="210" text-anchor="middle" class="small muted">depresión, ansiedad</text>
  <text x="220" y="204" text-anchor="middle" class="small">Ambos</text>
  <line x1="220" y1="300" x2="220" y2="340" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="70" y="344" width="300" height="70" rx="12" fill="var(--ok-l)"/>
  <text x="220" y="372" text-anchor="middle" class="step" style="fill:var(--ok)">Tratamiento integrado</text>
  <text x="220" y="394" text-anchor="middle" class="small">por el mismo equipo</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Cómo trabaja</text>
  <circle cx="469" cy="80" r="13" fill="var(--accent)"/>
  <text x="469" y="85" text-anchor="middle" class="step" style="fill:var(--on)">1</text>
  <text x="490" y="85" class="lab">Evaluación completa</text>
  <circle cx="469" cy="124" r="13" fill="var(--accent)"/>
  <text x="469" y="129" text-anchor="middle" class="step" style="fill:var(--on)">2</text>
  <text x="490" y="129" class="lab">Manejo de la abstinencia</text>
  <circle cx="469" cy="168" r="13" fill="var(--accent)"/>
  <text x="469" y="173" text-anchor="middle" class="step" style="fill:var(--on)">3</text>
  <text x="490" y="173" class="lab">Psicoterapia</text>
  <circle cx="469" cy="212" r="13" fill="var(--accent)"/>
  <text x="469" y="217" text-anchor="middle" class="step" style="fill:var(--on)">4</text>
  <text x="490" y="217" class="lab">Medicación si ayuda</text>
  <circle cx="469" cy="256" r="13" fill="var(--accent)"/>
  <text x="469" y="261" text-anchor="middle" class="step" style="fill:var(--on)">5</text>
  <text x="490" y="261" class="lab">Prevención de recaídas</text>
  <rect x="456" y="310" width="304" height="110" rx="10" fill="var(--tissue)"/>
  <text x="472" y="334" class="lab">La adicción es una enfermedad</text>
  <text x="472" y="354" class="lab">tratable; las recaídas forman</text>
  <text x="472" y="374" class="lab">parte del proceso y no son</text>
  <text x="472" y="394" class="lab">un fracaso</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
