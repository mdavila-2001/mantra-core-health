<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Urea en sangre</title>
  <desc id="d">Cadena de proteínas a aminoácidos y amoníaco, que el hígado convierte en urea; la urea viaja en la sangre y los riñones la eliminan. Abajo, situaciones en que puede subir o bajar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">De las proteínas a la orina</text>
<rect x="40" y="78" width="128" height="60" rx="8" fill="var(--beam)" stroke-width="1"/>
<text x="104.0" y="104.7" text-anchor="middle" class="small" style="fill:var(--ink)">Proteínas de</text>
<text x="104.0" y="119.7" text-anchor="middle" class="small" style="fill:var(--ink)">la dieta y tejidos</text>
<line x1="172" y1="108" x2="204" y2="108" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="208" y="78" width="120" height="60" rx="8" fill="var(--accent-l)" stroke-width="1"/>
<text x="268.0" y="104.7" text-anchor="middle" class="small" style="fill:var(--ink)">Aminoácidos</text>
<text x="268.0" y="119.7" text-anchor="middle" class="small" style="fill:var(--ink)">→ amoníaco</text>
<line x1="332" y1="108" x2="364" y2="108" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M372,80 Q420,62 470,74 Q500,86 488,120 Q470,146 420,140 Q376,134 372,80 Z" fill="var(--organ-d)" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="430" y="108" text-anchor="middle" class="step" style="fill:var(--on)">Hígado</text>
<text x="430" y="166" text-anchor="middle" class="small">forma urea</text>
<line x1="500" y1="108" x2="532" y2="108" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<rect x="546" y="78" width="30" height="96" rx="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>
<rect x="549" y="113.5" width="24" height="57.50000000000001" rx="10" fill="var(--vessel)" stroke-width="1" opacity=".8"/>
<rect x="543" y="64" width="36" height="18" rx="4" fill="var(--vessel)" stroke-width="1"/>
<text x="561" y="190" text-anchor="middle" class="small">Sangre</text>
<line x1="590" y1="108" x2="622" y2="108" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
<path d="M660,72.0 C627.6,70.2 627.6,145.8 660,144.0 C679.8,142.2 670.8,117.0 665.4,108 C670.8,99.0 679.8,73.8 660,72.0 Z" fill="var(--organ)" stroke="var(--organ-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="170" text-anchor="middle" class="small">Riñones la</text>
<text x="690" y="186" text-anchor="middle" class="small">eliminan</text>
<text x="400" y="232" text-anchor="middle" class="lab" style="fill:var(--muted)">El análisis mide la urea (o su nitrógeno, BUN) que circula en la sangre.</text>
<rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="316" text-anchor="middle" class="title">Puede subir con</text>
<text x="36" y="344" class="lab">• Función renal disminuida</text>
<text x="36" y="368" class="lab">• Deshidratación</text>
<text x="36" y="392" class="lab">• Dieta muy rica en proteínas</text>
<text x="36" y="416" class="lab">• Sangrado digestivo</text>
<rect x="406" y="286" width="374" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="316" text-anchor="middle" class="title">Puede bajar con</text>
<text x="422" y="344" class="lab">• Enfermedad hepática grave</text>
<text x="422" y="368" class="lab">• Dieta pobre en proteínas</text>
<text x="422" y="392" class="lab">• Embarazo, sobrehidratación</text>
<text x="592" y="420" text-anchor="middle" class="small" style="fill:var(--muted)">Se interpreta junto con la creatinina.</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
