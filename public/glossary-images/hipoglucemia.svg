<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Hipoglucemia</title>
  <desc id="d">A la izquierda, una curva de glucosa en sangre que baja hasta la zona de hipoglucemia y se recupera tras tomar azúcar, con sus causas habituales. A la derecha, los primeros avisos, los signos de gravedad y qué hacer.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Azúcar en sangre que cae</text>
  <line x1="60" y1="340" x2="400" y2="340" stroke="var(--ink)" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="60" y2="70" stroke="var(--ink)" stroke-width="1.5"/>
  <rect x="62" y="250" width="336" height="88" rx="0" fill="var(--warn-l)" stroke="none" stroke-width="0" opacity=".8"/>
  <text x="390" y="330" text-anchor="end" class="small" style="fill:var(--warn)">Hipoglucemia</text>
  <path d="M70 150 C130 140 170 160 220 220 C250 260 270 300 290 300 C310 300 320 220 340 170 C360 140 380 150 396 150" fill="none" stroke="var(--accent)" stroke-width="3"/>
  <circle cx="290" cy="300" r="6" fill="var(--vessel)" stroke="none" stroke-width="2"/>
  <text x="290" y="236" text-anchor="middle" class="small" style="fill:var(--vessel)">Bajada</text>
  <text x="340" y="130" text-anchor="middle" class="small" style="fill:var(--ok)">Tras tomar azúcar</text>
  <text x="66" y="64" class="small" style="fill:var(--muted)">Glucosa</text>
  <text x="230" y="362" text-anchor="middle" class="small" style="fill:var(--muted)">Tiempo</text>
  <text x="220" y="392" text-anchor="middle" class="small">Causas: insulina u otros fármacos, saltar</text>
  <text x="220" y="410" text-anchor="middle" class="small">comidas, ejercicio intenso o alcohol</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Señales y qué hacer</text>
  <text x="456" y="74" class="step">Primeros avisos</text>
  <text x="464" y="98" class="small">• Temblor, sudor y palpitaciones</text>
  <text x="464" y="120" class="small">• Hambre intensa y nerviosismo</text>
  <text x="456" y="160" class="step" style="fill:var(--warn)">Si sigue bajando</text>
  <text x="464" y="184" class="small">• Confusión y visión borrosa</text>
  <text x="464" y="206" class="small">• Conducta extraña o somnolencia</text>
  <text x="464" y="228" class="small">• Convulsiones o pérdida de conciencia</text>
  <rect x="456" y="262" width="304" height="160" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="288" class="step">Actuar rápido</text>
  <text x="480" y="312" class="small">• Tomar azúcar de absorción rápida</text>
  <text x="480" y="332" class="small">• Volver a medir al rato</text>
  <text x="480" y="352" class="small">• Luego un alimento con carbohidratos</text>
  <text x="480" y="372" class="small">• Si está inconsciente: nada por boca</text>
  <text x="480" y="392" class="small">• y llamar a emergencias</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
