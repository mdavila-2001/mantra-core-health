<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Tipos de anestesia</title>
  <desc id="d">Cuatro columnas comparan la anestesia local, que adormece una zona de la piel; la regional, que bloquea los nervios de una región del cuerpo; la sedación, que relaja y adormece; y la general, que produce inconsciencia con control de la vía aérea. Debajo se recuerda la vigilancia continua de las funciones vitales.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Tipos de anestesia</text>
<rect x="40" y="70" width="166" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="40" y="70" width="166" height="36" rx="8" fill="var(--accent)"/>
<text x="123.0" y="93.0" text-anchor="middle" class="step" style="fill:var(--on)">Local</text>
<path d="M73 200 Q123 170 173 200 L173 230 L73 230 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="123" cy="206" r="18" fill="var(--accent)" opacity=".35"/>
<line x1="163" y1="140" x2="129" y2="198" stroke="var(--muted)" stroke-width="2"/>
<text x="123" y="296" text-anchor="middle" class="small">Adormece una zona</text>
<text x="123" y="312" text-anchor="middle" class="small">pequeña de la piel</text>
<text x="123" y="352" text-anchor="middle" class="small" style="fill:var(--accent)">Despierto</text>
<rect x="222" y="70" width="166" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="222" y="70" width="166" height="36" rx="8" fill="var(--ok)"/>
<text x="305.0" y="93.0" text-anchor="middle" class="step" style="fill:var(--on)">Regional</text>
<circle cx="305" cy="129.0" r="11.0" fill="var(--skin)" stroke="var(--line)"/>
<path d="M299.0 139.0 L280.0 146.0 C275.0 148.0 274.0 153.0 273.5 158.0 L269.0 203.0 L276.0 204.0 L282.0 164.0 L283.0 198.0 L282.0 268.0 L298.0 268.0 L303.0 208.0 L307.0 208.0 L312.0 268.0 L328.0 268.0 L327.0 198.0 L328.0 164.0 L334.0 204.0 L341.0 203.0 L336.5 158.0 C336.0 153.0 335.0 148.0 330.0 146.0 L311.0 139.0 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="281" y="205" width="48" height="70" rx="8" fill="var(--ok)" opacity=".35"/>
<text x="305" y="296" text-anchor="middle" class="small">Bloquea los nervios</text>
<text x="305" y="312" text-anchor="middle" class="small">de una región</text>
<text x="305" y="352" text-anchor="middle" class="small" style="fill:var(--ok)">Despierto o sedado</text>
<rect x="404" y="70" width="166" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="404" y="70" width="166" height="36" rx="8" fill="var(--purple)"/>
<text x="487.0" y="93.0" text-anchor="middle" class="step" style="fill:var(--on)">Sedación</text>
<circle cx="487" cy="190" r="34" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<path d="M469 186 q8 6 14 0 M491 186 q8 6 14 0" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="521" y="160" class="step" style="fill:var(--purple)">z</text>
<text x="533" y="146" class="step" style="fill:var(--purple)">z</text>
<line x1="427" y1="250" x2="477" y2="214" stroke="var(--purple)" stroke-width="3"/>
<text x="487" y="296" text-anchor="middle" class="small">Relaja y adormece</text>
<text x="487" y="312" text-anchor="middle" class="small">con fármacos</text>
<text x="487" y="352" text-anchor="middle" class="small" style="fill:var(--purple)">Somnoliento</text>
<rect x="586" y="70" width="166" height="260" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="586" y="70" width="166" height="36" rx="8" fill="var(--vessel)"/>
<text x="669.0" y="93.0" text-anchor="middle" class="step" style="fill:var(--on)">General</text>
<circle cx="669" cy="190" r="34" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
<path d="M651 184 h14 M673 184 h14" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M649 206 q20 16 40 0" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="669" y1="214" x2="719" y2="254" stroke="var(--accent)" stroke-width="3"/>
<text x="669" y="296" text-anchor="middle" class="small">Inconsciencia total</text>
<text x="669" y="312" text-anchor="middle" class="small">y sin dolor</text>
<text x="669" y="352" text-anchor="middle" class="small" style="fill:var(--vessel)">Dormido, con vía aérea</text>
<rect x="40" y="372" width="720" height="54" rx="10" fill="var(--accent-l)"/>
<text x="56" y="396" class="lab">En todos los casos el equipo de anestesia vigila sin pausa el pulso,</text>
<text x="56" y="416" class="lab">la presión arterial, la respiración y el oxígeno, y controla el despertar.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
