<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Dermatitis de contacto irritativa y alérgica</title>
  <desc id="d">Dos cortes de piel: en la irritativa la sustancia daña directamente la superficie; en la alérgica el sistema inmune reacciona tras uno a tres días. Abajo, cómo se ve la lesión y qué ayuda a tratarla.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="250" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Dos mecanismos</text>
<text x="215" y="64" text-anchor="middle" class="sub">Irritativa</text>
<rect x="40" y="90" width="350" height="30" rx="3" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<rect x="40" y="120" width="350" height="60" rx="3" fill="var(--vessel-l)" stroke="var(--line)" stroke-width="1" opacity=".6"/>
<circle cx="70" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="125" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="180" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="235" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="290" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="345" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<path d="M140,90 L150,104 L160,90 M250,90 L260,106 L270,90" fill="none" stroke="var(--vessel)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="215" y="206" text-anchor="middle" class="lab">La sustancia daña la piel</text>
<text x="215" y="224" text-anchor="middle" class="lab">directamente: jabón, detergente</text>
<text x="215" y="242" text-anchor="middle" class="small" style="fill:var(--muted)">Aparece rápido, más en manos</text>
<text x="585" y="64" text-anchor="middle" class="sub">Alérgica</text>
<rect x="410" y="90" width="350" height="30" rx="3" fill="var(--skin)" stroke="var(--line)" stroke-width="1"/>
<rect x="410" y="120" width="350" height="60" rx="3" fill="var(--vessel-l)" stroke="var(--line)" stroke-width="1" opacity=".6"/>
<circle cx="440" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="495" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="550" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="605" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="660" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="715" cy="80" r="6" fill="var(--purple)" stroke="none" stroke-width="1"/>
<circle cx="480" cy="150" r="9" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="550" cy="150" r="9" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="620" cy="150" r="9" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<circle cx="690" cy="150" r="9" fill="var(--accent-l)" stroke="var(--accent)" stroke-width="2"/>
<text x="585" y="206" text-anchor="middle" class="lab">El sistema inmune reacciona</text>
<text x="585" y="224" text-anchor="middle" class="lab">a un alérgeno: níquel, perfume</text>
<text x="585" y="242" text-anchor="middle" class="small" style="fill:var(--muted)">Aparece de 1 a 3 días después</text>
<text x="400" y="82" text-anchor="middle" class="small">Sustancia</text>
<rect x="20" y="286" width="370" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="205.0" y="316" text-anchor="middle" class="title">Cómo se ve</text>
<text x="36" y="336" class="lab">• Enrojecimiento y picor</text>
<text x="36" y="358" class="lab">• Ampollas o descamación</text>
<text x="36" y="380" class="lab">• Limitada a la zona de contacto</text>
<text x="36" y="402" class="lab">• Piel engrosada si se repite</text>
<rect x="406" y="286" width="374" height="154" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="593.0" y="316" text-anchor="middle" class="title">Qué ayuda</text>
<text x="422" y="336" class="lab">• Identificar y evitar el agente</text>
<text x="422" y="358" class="lab">• Guantes y cremas barrera</text>
<text x="422" y="380" class="lab">• Corticoide tópico si se indica</text>
<text x="422" y="402" class="lab">• Pruebas del parche si es alérgica</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
