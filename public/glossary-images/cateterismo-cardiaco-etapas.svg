<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Etapas de un cateterismo cardíaco</title>
  <desc id="d">Flujo de siete etapas consecutivas: indicación y evaluación, consentimiento y preparación, acceso vascular, mediciones y angiografía, tratamiento si procede, cierre y hemostasia, observación y seguimiento.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#dbe8f7; --art:#c0392b; --art-l:#f6dcd8; --vein:#2f6fbf; --vein-l:#d6e4f6; --ok:#1f8a5b; --ok-l:#d7efe3; --warn:#c77d12; --warn-l:#f8ead2; --purple:#7a4fb5; --purple-l:#e8def5; --nerve:#d9a514; --tissue:#f1e4dc; --bone:#e3dccf; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#22374f; --art:#ef7467; --art-l:#4a2a2a; --vein:#78a9e6; --vein-l:#22364f; --ok:#4cc38a; --ok-l:#1d3a2e; --warn:#e6a54a; --warn-l:#3f3220; --purple:#b393e3; --purple-l:#352a47; --nerve:#e8c04a; --tissue:#3a302c; --bone:#4f4a40; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .on { fill: var(--on); }
    .b { font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--art)"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--vein)"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ok)"/></marker>
  </defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <text x="400" y="46" text-anchor="middle" class="title">Etapas de un cateterismo cardíaco</text>
  <rect x="24" y="80" width="176" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="52" cy="110" r="16" fill="var(--accent)"/>  <text x="52" y="115" text-anchor="middle" class="h on">1</text>
  <text x="76" y="108" text-anchor="start" class="h">Indicación y</text>
  <text x="76" y="126" text-anchor="start" class="h">evaluación</text>
  <text x="40" y="162" text-anchor="start" class="small muted">Historia clínica y</text>
  <text x="40" y="178" text-anchor="start" class="small muted">pruebas previas</text>
  <path d="M202 140 L214 140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="216" y="80" width="176" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="244" cy="110" r="16" fill="var(--accent)"/>  <text x="244" y="115" text-anchor="middle" class="h on">2</text>
  <text x="268" y="108" text-anchor="start" class="h">Consentimiento</text>
  <text x="268" y="126" text-anchor="start" class="h">y preparación</text>
  <text x="232" y="162" text-anchor="start" class="small muted">Ayuno, alergias,</text>
  <text x="232" y="178" text-anchor="start" class="small muted">medicación</text>
  <path d="M394 140 L406 140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="408" y="80" width="176" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="436" cy="110" r="16" fill="var(--accent)"/>  <text x="436" y="115" text-anchor="middle" class="h on">3</text>
  <text x="460" y="108" text-anchor="start" class="h">Acceso</text>
  <text x="460" y="126" text-anchor="start" class="h">vascular</text>
  <text x="424" y="162" text-anchor="start" class="small muted">Arteria radial o</text>
  <text x="424" y="178" text-anchor="start" class="small muted">femoral; vena</text>
  <path d="M586 140 L598 140" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="600" y="80" width="176" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="628" cy="110" r="16" fill="var(--art)"/>  <text x="628" y="115" text-anchor="middle" class="h on">4</text>
  <text x="652" y="108" text-anchor="start" class="h">Mediciones y</text>
  <text x="652" y="126" text-anchor="start" class="h">angiografía</text>
  <text x="616" y="162" text-anchor="start" class="small muted">Presiones e imágenes con</text>
  <text x="616" y="178" text-anchor="start" class="small muted">contraste</text>
  <path d="M688 202 C688 236 688 236 640 240 L176 240 C120 240 120 250 120 262" fill="none" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="268" width="208" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="68" cy="298" r="16" fill="var(--art)"/>  <text x="68" y="303" text-anchor="middle" class="h on">5</text>
  <text x="92" y="296" text-anchor="start" class="h">Tratamiento si</text>
  <text x="92" y="314" text-anchor="start" class="h">procede</text>
  <text x="56" y="350" text-anchor="start" class="small muted">Por ejemplo,</text>
  <text x="56" y="366" text-anchor="start" class="small muted">angioplastia con stent</text>
  <path d="M250 328 L294 328" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="296" y="268" width="208" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="324" cy="298" r="16" fill="var(--ok)"/>  <text x="324" y="303" text-anchor="middle" class="h on">6</text>
  <text x="348" y="296" text-anchor="start" class="h">Cierre y</text>
  <text x="348" y="314" text-anchor="start" class="h">hemostasia</text>
  <text x="312" y="350" text-anchor="start" class="small muted">Compresión o dispositivo</text>
  <text x="312" y="366" text-anchor="start" class="small muted">de cierre</text>
  <path d="M506 328 L550 328" stroke="var(--muted)" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="552" y="268" width="208" height="120" rx="12" fill="var(--panel)" stroke="var(--line)"/>
  <circle cx="580" cy="298" r="16" fill="var(--ok)"/>  <text x="580" y="303" text-anchor="middle" class="h on">7</text>
  <text x="604" y="296" text-anchor="start" class="h">Observación y</text>
  <text x="604" y="314" text-anchor="start" class="h">seguimiento</text>
  <text x="568" y="350" text-anchor="start" class="small muted">Vigilancia del acceso,</text>
  <text x="568" y="366" text-anchor="start" class="small muted">alta y control</text>
  <text x="400" y="424" text-anchor="middle" class="small muted">El equipo decide en cada paso; no todos los cateterismos incluyen un tratamiento.</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
