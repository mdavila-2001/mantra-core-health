<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Bronquiolitis</title>
  <desc id="d">A la izquierda, el árbol bronquial de un lactante y dos cortes de bronquiolo: uno sano con la luz abierta y otro con la pared hinchada y moco que estrechan el paso del aire. A la derecha, claves de la enfermedad: menores de dos años, causa vírica, inicio como resfriado, y los signos para acudir de urgencia.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d9c6; --organ:#e8a598; --vessel:#c0392b; --vein:#3d6fb6; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c77d12; --warn-l:#f8e3bf; --bad:#b83a2e; --bad-l:#f6d3cf; --beam:#f2c46d; --on:#ffffff; --purple:#7b4fb0; --purple-l:#e2d6f2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4537; --organ:#9a5a50; --vessel:#ef7467; --vein:#7aa3e0; --ok:#4cc38a; --ok-l:#1d3a2d; --warn:#e3a84a; --warn-l:#4a3a1c; --bad:#ef7467; --bad-l:#4a2522; --beam:#8a6f2f; --on:#0f1720; --purple:#b495e0; --purple-l:#352a47; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Bronquiolos inflamados</text>
  <path d="M210 60 V130 M210 130 C180 150 150 160 130 200 M210 130 C240 150 270 160 290 200" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M130 200 C110 240 80 270 70 300 M130 200 C140 240 150 270 140 300 M290 200 C280 240 270 270 280 300 M290 200 C310 240 340 270 350 300" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
  <text x="222" y="84" class="small muted">Tráquea</text>
  <text x="100" y="330" text-anchor="middle" class="step">Sano</text>
  <text x="310" y="330" text-anchor="middle" class="step">Con bronquiolitis</text>
  <circle cx="100" cy="385" r="38" fill="var(--organ)" opacity=".6"/>
  <circle cx="100" cy="385" r="26" fill="var(--panel)"/>
  <circle cx="310" cy="385" r="38" fill="var(--bad)" opacity=".55"/>
  <circle cx="310" cy="385" r="12" fill="var(--panel)"/>
  <path d="M298 380 q6 -10 14 -2 q8 6 10 -4" fill="none" stroke="var(--beam)" stroke-width="5"/>
  <text x="205" y="380" text-anchor="middle" class="small">Pared hinchada</text>
  <text x="205" y="396" text-anchor="middle" class="small">y moco</text>
  <path d="M250 388 L268 388" stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="310" y="440" text-anchor="middle" class="small muted">El aire pasa con dificultad</text>
  <rect x="440" y="20" width="340" height="430" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="610.0" y="50" text-anchor="middle" class="title">Claves</text>
  <text x="460" y="64" class="lab">• Menores de 2 años</text>
  <text x="460" y="88" class="lab">• Causa vírica, sobre todo VSR</text>
  <text x="460" y="112" class="lab">• Empieza como un resfriado</text>
  <text x="460" y="136" class="lab">• Tos, pitidos, respiración rápida</text>
  <text x="610" y="180" text-anchor="middle" class="step" style="fill:var(--bad)">Acudir de urgencia si:</text>
  <rect x="460" y="196" width="300" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610.0" y="219.0" text-anchor="middle" class="lab">Se le hunden las costillas</text>
  <rect x="460" y="242" width="300" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610.0" y="265.0" text-anchor="middle" class="lab">Pausas en la respiración</text>
  <rect x="460" y="288" width="300" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610.0" y="311.0" text-anchor="middle" class="lab">Labios azulados</text>
  <rect x="460" y="334" width="300" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610.0" y="357.0" text-anchor="middle" class="lab">No come ni moja pañales</text>
  <rect x="460" y="380" width="300" height="36" rx="10" fill="var(--bad-l)" stroke="var(--line)"/>
  <text x="610.0" y="403.0" text-anchor="middle" class="lab">Mucho decaimiento</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
