<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Angiología: arterias, venas y linfáticos</title>
  <desc id="d">A la izquierda, una pierna con tres redes de vasos: las arterias en rojo, que llevan la sangre; las venas en azul, que la devuelven y pueden formar varices; y los linfáticos en verde, que drenan líquido. A la derecha, las enfermedades frecuentes de cada red y el estudio con eco-Doppler.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Tres redes de vasos</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Qué trata y cómo estudia</text>
<path d="M130 70 L270 70 C272 140 262 200 250 260 C244 300 246 340 250 380 L270 410 L190 412 C188 380 186 340 180 300 C170 240 140 160 130 70 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M180 70 C186 150 196 230 206 300 C210 340 212 370 214 400" fill="none" stroke="var(--vessel)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M226 70 C226 150 222 230 226 300 C230 340 236 370 240 400" fill="none" stroke="var(--vein)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M200 290 C214 296 218 310 230 312 C240 316 236 330 232 336" fill="none" stroke="var(--vein)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M150 80 C160 160 176 240 190 300 C196 340 196 370 198 396" fill="none" stroke="var(--ok)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="40" y="120" class="step" style="fill:var(--vessel)">Arterias</text>
<text x="40" y="138" class="small" style="fill:var(--muted)">llevan sangre</text>
<text x="286" y="120" class="step" style="fill:var(--vein)">Venas</text>
<text x="286" y="138" class="small" style="fill:var(--muted)">la devuelven</text>
<text x="40" y="260" class="step" style="fill:var(--ok)">Linfáticos</text>
<text x="40" y="278" class="small" style="fill:var(--muted)">drenan líquido</text>
<text x="286" y="330" class="small" style="fill:var(--vein)">Varices</text>
<text x="416" y="76" class="h">Enfermedades frecuentes</text>
<text x="416" y="100" class="step" style="fill:var(--vessel)">Arterias</text>
<text x="510" y="100" class="small">• Enfermedad arterial periférica</text>
<text x="510" y="120" class="small">• Aneurismas, carótidas</text>
<text x="416" y="154" class="step" style="fill:var(--vein)">Venas</text>
<text x="510" y="154" class="small">• Varices, insuficiencia venosa</text>
<text x="510" y="174" class="small">• Trombosis venosa</text>
<text x="416" y="208" class="step" style="fill:var(--ok)">Linfáticos</text>
<text x="510" y="208" class="small">• Linfedema</text>
<text x="416" y="270" class="h">Eco-Doppler</text>
<rect x="416" y="284" width="150" height="100" rx="8" fill="var(--xray)"/>
<path d="M430 330 C460 316 500 344 552 330" fill="none" stroke="var(--vessel)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>
<path d="M430 360 C460 352 520 370 552 356" fill="none" stroke="var(--vein)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>
<text x="580" y="300" class="small">Muestra el flujo de la</text>
<text x="580" y="316" class="small">sangre sin pinchazos.</text>
<text x="580" y="348" class="small">También: índice tobillo</text>
<text x="580" y="364" class="small">brazo, angiografía.</text>
<text x="416" y="410" class="small" style="fill:var(--muted)">Trata con fármacos, compresión y procedimientos.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
