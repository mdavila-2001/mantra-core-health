<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Gonorrea: localización y prevención</title>
  <desc id="d">Silueta humana con los lugares donde puede asentarse la infección: uretra o cuello uterino, recto, garganta y ojos. A la derecha, cómo se transmite, sus complicaciones, el diagnóstico y la prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --vessel-l:#f5d0cc; --ok:#1f8a5b; --ok-l:#d3efe2; --beam:#f2c46d; --on:#ffffff; --warn:#b85c00; --warn-l:#fdf0e1; --skin:#f3dccb; --organ:#e9a39b; --organ-d:#b8574e; --purple:#6b4fa0; --purple-l:#e3dcf2; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --vessel-l:#4a2a2a; --ok:#4cc38a; --ok-l:#1d3b2f; --beam:#8a6f2f; --on:#0f1720; --warn:#f0a050; --warn-l:#3a2a18; --skin:#4a3a30; --organ:#8f4f49; --organ-d:#e08a80; --purple:#b49be0; --purple-l:#2e2640; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 15px; font-weight: 700; }
    .step { font-size: 14px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .big { font-size: 22px; font-weight: 700; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Lugares de infección</text>
<path d="M148.0,136.6 Q109.0,139.2 103.8,179.5 L90.8,329.0 Q96.0,344.6 109.0,331.6 L119.4,199.0 L122.0,355.0 Q122.0,396.6 142.8,409.6 L257.2,409.6 Q278.0,396.6 278.0,355.0 L280.6,199.0 L291.0,331.6 Q304.0,344.6 309.2,329.0 L296.2,179.5 Q291.0,139.2 252.0,136.6 L215.6,131.4 L215.6,115.8 L184.4,115.8 L184.4,131.4 Z" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="200" cy="87.2" r="31.2" fill="var(--skin)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="200" cy="90" r="7" fill="var(--vessel)" stroke="var(--on)" stroke-width="2"/>
<text x="280" y="92" class="small">Garganta</text>
<line x1="208" y1="90" x2="276" y2="88" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="186" cy="82" r="7" fill="var(--vessel)" stroke="var(--on)" stroke-width="2"/>
<text x="90" y="72" text-anchor="end" class="small">Ojos</text>
<line x1="178" y1="82" x2="94" y2="68" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="200" cy="330" r="7" fill="var(--vessel)" stroke="var(--on)" stroke-width="2"/>
<text x="282" y="322" class="small">Uretra/cuello</text>
<line x1="208" y1="330" x2="278" y2="318" stroke="var(--muted)" stroke-width="1.5"/>
<circle cx="200" cy="350" r="7" fill="var(--vessel)" stroke="var(--on)" stroke-width="2"/>
<text x="282" y="360" class="small">Recto</text>
<line x1="208" y1="350" x2="278" y2="356" stroke="var(--muted)" stroke-width="1.5"/>
<text x="200" y="430" text-anchor="middle" class="small" style="fill:var(--muted)">Bacteria Neisseria gonorrhoeae</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Claves</text>
<text x="416" y="78" class="lab">• Transmisión sexual: vaginal, anal u oral</text>
<text x="416" y="102" class="lab">• A menudo sin síntomas, sobre todo en mujeres</text>
<text x="416" y="126" class="lab">• Puede dar secreción y ardor al orinar</text>
<rect x="416" y="150" width="344" height="100" rx="10" fill="none" stroke="var(--line)" stroke-width="1"/>
<text x="428" y="172" class="step">Si no se trata</text>
<text x="428" y="196" class="lab">• Enfermedad inflamatoria pélvica</text>
<text x="428" y="218" class="lab">• Infertilidad, embarazo ectópico</text>
<text x="428" y="240" class="lab">• Infección del recién nacido en el parto</text>
<rect x="416" y="276" width="344" height="140" rx="10" fill="var(--ok-l)" stroke-width="1"/>
<text x="430" y="302" class="step">Diagnóstico y prevención</text>
<text x="430" y="328" class="lab">• Prueba de orina o hisopo (PCR)</text>
<text x="430" y="350" class="lab">• Antibiótico indicado por el médico</text>
<text x="430" y="372" class="lab">• Tratar también a las parejas sexuales</text>
<text x="430" y="394" class="lab">• Preservativo en todas las relaciones</text>
<text x="400" y="466" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
