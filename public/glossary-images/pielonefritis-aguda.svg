<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Pielonefritis aguda</title>
  <desc id="d">A la izquierda, el aparato urinario con un riñón sano y otro inflamado por bacterias que ascienden desde la vejiga por el uréter. A la derecha, los síntomas, el diagnóstico, el tratamiento antibiótico y cuándo acudir a urgencias.</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --vessel:#c0392b; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c96a1b; --warn-l:#f8e0c8; --beam:#f2c46d; --on:#ffffff; --organ:#e7a598; --organ-d:#b8665a; --skin:#f1d3bd; --nerve:#d9a521; --fluid:#f1df8f; --violet:#7b5ea7; --violet-l:#e2d8f1; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --vessel:#ef7467; --ok:#4cc38a; --ok-l:#1d4434; --warn:#f0a35e; --warn-l:#4a3320; --beam:#8a6f2f; --on:#0f1720; --organ:#9a5a50; --organ-d:#d58b7e; --skin:#7a5e4c; --nerve:#e6c35c; --fluid:#8c7a32; --violet:#b39ddb; --violet-l:#3a2f4f; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .on { fill: var(--on); }
  </style>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="400" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="220.0" y="50" text-anchor="middle" class="title">Infección que sube al riñón</text>
  <path d="M110 80 C160 78 162 202 110 200 C70 198 80 160 94 140 C80 120 70 82 110 80 Z" fill="var(--organ-d)" stroke="var(--organ-d)" stroke-width="1.5"/>
  <path d="M330 80 C280 82 278 200 330 200 C370 198 380 170 364 140 C380 110 370 78 330 80 Z" fill="var(--vessel)" stroke="var(--vessel)" stroke-width="1.5" opacity=".7"/>
  <text x="110" y="226" text-anchor="middle" class="small">Riñón sano</text>
  <text x="330" y="226" text-anchor="middle" class="small" style="fill:var(--vessel)">Riñón infectado</text>
  <path d="M96 140 C90 220 140 280 190 330" fill="none" stroke="var(--fluid)" stroke-width="5"/>
  <path d="M318 140 C320 220 260 280 230 330" fill="none" stroke="var(--fluid)" stroke-width="5"/>
  <path d="M150 330 C150 300 270 300 270 330 C270 380 240 396 210 396 C180 396 150 380 150 330 Z" fill="var(--fluid)" stroke="var(--warn)" stroke-width="2"/>
  <text x="210" y="360" text-anchor="middle" class="small">Vejiga</text>
  <line x1="210" y1="396" x2="210" y2="424" stroke="var(--warn)" stroke-width="5"/>
  <ellipse cx="290" cy="250" rx="6" ry="3" fill="var(--ok)" stroke="none" stroke-width="2" transform="rotate(-50 290 250)"/>
  <ellipse cx="306" cy="210" rx="6" ry="3" fill="var(--ok)" stroke="none" stroke-width="2" transform="rotate(-50 306 210)"/>
  <ellipse cx="316" cy="172" rx="6" ry="3" fill="var(--ok)" stroke="none" stroke-width="2" transform="rotate(-50 316 172)"/>
  <ellipse cx="262" cy="290" rx="6" ry="3" fill="var(--ok)" stroke="none" stroke-width="2" transform="rotate(-50 262 290)"/>
  <text x="370" y="270" text-anchor="end" class="small" style="fill:var(--ok)">Bacterias</text>
  <text x="370" y="286" text-anchor="end" class="small" style="fill:var(--ok)">que ascienden</text>
  <rect x="436" y="20" width="344" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="608.0" y="50" text-anchor="middle" class="title">Síntomas y tratamiento</text>
  <text x="456" y="80" class="small">• Fiebre alta y escalofríos</text>
  <text x="456" y="104" class="small">• Dolor en el costado o la espalda</text>
  <text x="456" y="128" class="small">• Náuseas o vómitos</text>
  <text x="456" y="152" class="small">• Ardor y ganas frecuentes de orinar</text>
  <text x="456" y="196" class="step">Diagnóstico</text>
  <text x="456" y="218" class="small">Análisis y cultivo de orina, y de sangre</text>
  <rect x="456" y="240" width="304" height="84" rx="10" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="1.5"/>
  <text x="472" y="266" class="step">Tratamiento</text>
  <text x="472" y="290" class="small">Antibiótico indicado por el médico,</text>
  <text x="472" y="308" class="small">hidratación y control de la fiebre.</text>
  <rect x="456" y="338" width="304" height="84" rx="10" fill="var(--warn-l)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="472" y="362" class="step" style="fill:var(--warn)">Urgencias si</text>
  <text x="472" y="384" class="small">Vómitos que impiden tomar la medicación,</text>
  <text x="472" y="402" class="small">embarazo, confusión o mal estado.</text>

  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
