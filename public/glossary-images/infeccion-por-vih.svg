<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Infección por VIH</title>
  <desc id="d">A la izquierda, el virus de la inmunodeficiencia humana ataca a un linfocito CD4 y una curva sin escala muestra que, sin tratamiento, los CD4 bajan con los años hasta el sida, mientras que con tratamiento se mantienen. A la derecha, las vías de transmisión, lo que no transmite el virus, el tratamiento antirretroviral con el principio indetectable igual a intransmisible y las medidas de prevención.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="360" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="200.0" y="50" text-anchor="middle" class="title">Qué hace el virus</text>
<rect x="396" y="20" width="384" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="588.0" y="50" text-anchor="middle" class="title">Transmisión y tratamiento</text>
<circle cx="120" cy="130" r="46" fill="var(--ok-l)" stroke="var(--ok)" stroke-width="2"/>
<text x="120" y="135" text-anchor="middle" class="step" style="fill:var(--ok)">CD4</text>
<text x="120" y="196" text-anchor="middle" class="small" style="fill:var(--muted)">Linfocito CD4</text>
<text x="120" y="212" text-anchor="middle" class="small" style="fill:var(--muted)">(defensa)</text>
<circle cx="270" cy="120" r="22" fill="var(--bad-l)" stroke="var(--bad)" stroke-width="2"/>
<line x1="292.0" y1="120.0" x2="300.0" y2="120.0" stroke="var(--bad)" stroke-width="2"/>
<line x1="287.8" y1="132.9" x2="294.3" y2="137.6" stroke="var(--bad)" stroke-width="2"/>
<line x1="276.8" y1="140.9" x2="279.3" y2="148.5" stroke="var(--bad)" stroke-width="2"/>
<line x1="263.2" y1="140.9" x2="260.7" y2="148.5" stroke="var(--bad)" stroke-width="2"/>
<line x1="252.2" y1="132.9" x2="245.7" y2="137.6" stroke="var(--bad)" stroke-width="2"/>
<line x1="248.0" y1="120.0" x2="240.0" y2="120.0" stroke="var(--bad)" stroke-width="2"/>
<line x1="252.2" y1="107.1" x2="245.7" y2="102.4" stroke="var(--bad)" stroke-width="2"/>
<line x1="263.2" y1="99.1" x2="260.7" y2="91.5" stroke="var(--bad)" stroke-width="2"/>
<line x1="276.8" y1="99.1" x2="279.3" y2="91.5" stroke="var(--bad)" stroke-width="2"/>
<line x1="287.8" y1="107.1" x2="294.3" y2="102.4" stroke="var(--bad)" stroke-width="2"/>
<text x="270" y="172" text-anchor="middle" class="step" style="fill:var(--bad)">VIH</text>
<line x1="240" y1="128" x2="172" y2="132" stroke="var(--bad)" stroke-width="2" marker-end="url(#ar)"/>
<text x="40" y="252" class="small">Sin tratamiento, los CD4 bajan con los años</text>
<path d="M60 270 V370 H350" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M64 280 C120 300 200 320 250 345 C290 362 320 366 346 368" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M64 280 C120 284 250 286 346 290" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="346" y="284" text-anchor="end" class="small" style="fill:var(--accent)">Con tratamiento</text>
<text x="346" y="360" text-anchor="end" class="small" style="fill:var(--bad)">Sin tratamiento: sida</text>
<text x="204" y="390" text-anchor="middle" class="small" style="fill:var(--muted)">Tiempo</text>
<text x="40" y="416" class="small" style="fill:var(--muted)">Esquema sin escala</text>
<text x="416" y="76" class="h">Se transmite por</text>
<text x="416" y="102" class="lab">• Relaciones sexuales sin protección</text>
<text x="416" y="124" class="lab">• Sangre: agujas compartidas</text>
<text x="416" y="146" class="lab">• Embarazo, parto o lactancia</text>
<text x="416" y="186" class="small" style="fill:var(--ok)">No por besos, abrazos, saliva</text>
<text x="416" y="202" class="small" style="fill:var(--ok)">ni por compartir baño o comida.</text>
<text x="416" y="240" class="h">Tratamiento antirretroviral</text>
<text x="416" y="264" class="lab">Frena la multiplicación del virus.</text>
<rect x="416" y="282" width="344" height="54" rx="10" fill="var(--accent-l)"/>
<text x="588" y="306" text-anchor="middle" class="step">Indetectable = intransmisible</text>
<text x="588" y="326" text-anchor="middle" class="small" style="fill:var(--muted)">por vía sexual</text>
<text x="416" y="366" class="h">Prevención</text>
<text x="416" y="390" class="small">Preservativo, prueba periódica, PrEP y PEP.</text>
<text x="416" y="410" class="small" style="fill:var(--muted)">Con tratamiento, la esperanza de vida es casi normal.</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
