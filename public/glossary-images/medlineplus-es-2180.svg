<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Etapas y tipos de cirugía</title>
  <desc id="d">Tres columnas con flechas muestran las etapas de una cirugía: antes, con evaluación, estudios, ayuno y consentimiento; durante, con anestesia, campo estéril, incisión y cierre; y después, con recuperación, control del dolor, cuidado de la herida y rehabilitación. Debajo, las vías de acceso y la clasificación según la urgencia y el objetivo.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --skin:#f3d9c4; --tissue:#e9edf2; --organ:#c9705f; --organ-l:#f4cfc6; --vessel:#c0392b; --vein:#3f6fb5; --bone:#cfd6df; --ok:#1f8a5b; --ok-l:#cdeedd; --warn:#c77700; --warn-l:#fbe3bf; --bad:#b83232; --bad-l:#f6d0d0; --purple:#7b4bb7; --purple-l:#e3d6f3; --yellow:#e8b923; --on:#ffffff; --xray:#18212b; --xbone:#dfe6ee; --xtxt:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --skin:#5a4436; --tissue:#2a3541; --organ:#d98a79; --organ-l:#5a3530; --vessel:#ef7467; --vein:#7aa3e0; --bone:#566472; --ok:#4cc38a; --ok-l:#1f4434; --warn:#f0a43a; --warn-l:#4d3a1c; --bad:#f07a7a; --bad-l:#4f2626; --purple:#b48ae6; --purple-l:#3a2d4d; --yellow:#c9a43a; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .w { fill: var(--on); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
  </defs>
<rect width="800" height="480" fill="var(--bg)"/>
<rect x="20" y="20" width="760" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
<text x="400.0" y="50" text-anchor="middle" class="title">Las etapas de una cirugía</text>
<rect x="40" y="66" width="224" height="200" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="40" y="66" width="224" height="38" rx="8" fill="var(--accent)"/>
<text x="152.0" y="90.0" text-anchor="middle" class="step" style="fill:var(--on)">Antes</text>
<text x="56" y="134" class="lab">• Evaluación médica</text>
<text x="56" y="162" class="lab">• Estudios previos</text>
<text x="56" y="190" class="lab">• Ayuno</text>
<text x="56" y="218" class="lab">• Consentimiento</text>
<line x1="266" y1="166" x2="286" y2="166" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="288" y="66" width="224" height="200" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="288" y="66" width="224" height="38" rx="8" fill="var(--vessel)"/>
<text x="400.0" y="90.0" text-anchor="middle" class="step" style="fill:var(--on)">Durante</text>
<text x="304" y="134" class="lab">• Anestesia</text>
<text x="304" y="162" class="lab">• Campo estéril</text>
<text x="304" y="190" class="lab">• Incisión y reparación</text>
<text x="304" y="218" class="lab">• Cierre de la herida</text>
<line x1="514" y1="166" x2="534" y2="166" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="536" y="66" width="224" height="200" rx="12" fill="var(--tissue)" stroke="var(--line)"/>
<rect x="536" y="66" width="224" height="38" rx="8" fill="var(--ok)"/>
<text x="648.0" y="90.0" text-anchor="middle" class="step" style="fill:var(--on)">Después</text>
<text x="552" y="134" class="lab">• Sala de recuperación</text>
<text x="552" y="162" class="lab">• Control del dolor</text>
<text x="552" y="190" class="lab">• Cuidado de la herida</text>
<text x="552" y="218" class="lab">• Rehabilitación</text>
<text x="40" y="302" class="h">Cómo se accede</text>
<text x="40" y="330" class="lab" style="fill:var(--accent)">Abierta</text>
<text x="40" y="348" class="small" style="fill:var(--muted)">una incisión amplia</text>
<text x="288" y="330" class="lab" style="fill:var(--accent)">Mínimamente invasiva</text>
<text x="288" y="348" class="small" style="fill:var(--muted)">laparoscopia, endoscopia</text>
<text x="536" y="330" class="lab" style="fill:var(--accent)">Robótica</text>
<text x="536" y="348" class="small" style="fill:var(--muted)">brazos guiados por el cirujano</text>
<text x="40" y="386" class="h">Según la urgencia</text>
<text x="40" y="412" class="lab">Programada · Urgente · Emergencia</text>
<text x="420" y="386" class="h">Según el objetivo</text>
<text x="420" y="412" class="lab">Diagnóstica · Curativa · Reparadora · Paliativa</text>
<text x="400" y="464" text-anchor="middle" class="small" style="fill:var(--muted)">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
