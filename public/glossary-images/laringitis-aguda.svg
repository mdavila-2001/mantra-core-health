<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="t d">
  <title id="t">Laringitis aguda</title>
  <desc id="d">A la izquierda, la laringe vista desde arriba con dos cuerdas vocales normales que vibran bien y, al lado, cuerdas vocales inflamadas y engrosadas que vibran peor y producen ronquera. A la derecha, causas frecuentes, cuidados para la recuperación y cuándo consultar.</desc>
  <style>
    :root { --bg:#f6f8fb; --panel:#ffffff; --line:#d5dde8; --ink:#1c2733; --muted:#5a6878; --accent:#2b6cb0; --accent-l:#bcd6f2; --bone:#cfd6df; --tissue:#e9edf2; --skin:#f1d6bf; --organ:#e6a3a0; --vessel:#c0392b; --vein:#3d5fa8; --nerve:#d39b1c; --ok:#1f8a5b; --ok-l:#cdebdc; --warn:#c2571a; --warn-l:#f8dccb; --purple:#7a4fb0; --beam:#f2c46d; --on:#ffffff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#141b24; --panel:#1d2733; --line:#33414f; --ink:#e8eef5; --muted:#9fb0c1; --accent:#6aa7e8; --accent-l:#27405c; --bone:#566472; --tissue:#2a3541; --skin:#5a4636; --organ:#8f4f4c; --vessel:#ef7467; --vein:#7e9be0; --nerve:#e0b54a; --ok:#4cc38a; --ok-l:#1d3d2f; --warn:#f0965f; --warn-l:#4a2d1d; --purple:#b48ee6; --beam:#8a6f2f; --on:#0f1720; } }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .title { font-size: 18px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .lab { font-size: 13px; }
    .small { font-size: 12px; }
    .step { font-size: 14px; font-weight: 700; }
    .op { font-size: 26px; font-weight: 700; fill: var(--muted); }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--muted)"/></marker></defs>
  <rect width="800" height="480" fill="var(--bg)"/>
  <rect x="20" y="20" width="380" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="210.0" y="50" text-anchor="middle" class="title">Cuerdas vocales vistas desde arriba</text>
  <ellipse cx="110" cy="210" rx="74" ry="100" fill="var(--skin)" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="110" cy="210" rx="52" ry="78" fill="var(--ink)" opacity=".8"/>
  <path d="M110 140 L80 280" fill="none" stroke="var(--panel)" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 140 L140 280" fill="none" stroke="var(--panel)" stroke-width="6" stroke-linecap="round"/>
  <text x="110" y="340" text-anchor="middle" class="step" style="fill:var(--ok)">Normales</text>
  <ellipse cx="290" cy="210" rx="74" ry="100" fill="var(--organ)" stroke="var(--line)" stroke-width="2"/>
  <ellipse cx="290" cy="210" rx="52" ry="78" fill="var(--ink)" opacity=".8"/>
  <path d="M290 140 L260 280" fill="none" stroke="var(--panel)" stroke-width="19.200000000000003" stroke-linecap="round"/>
  <path d="M290 140 L320 280" fill="none" stroke="var(--panel)" stroke-width="19.200000000000003" stroke-linecap="round"/>
  <text x="290" y="340" text-anchor="middle" class="step" style="fill:var(--warn)">Inflamadas</text>
  <text x="110" y="362" text-anchor="middle" class="small muted">vibran bien</text>
  <text x="290" y="362" text-anchor="middle" class="small muted">hinchadas, vibran peor</text>
  <text x="200" y="404" text-anchor="middle" class="lab">Resultado: voz ronca o afonía</text>
  <rect x="416" y="20" width="364" height="420" rx="14" fill="var(--panel)" stroke="var(--line)"/>
  <text x="598.0" y="50" text-anchor="middle" class="title">Causas y cuidados</text>
  <text x="436" y="76" class="step">Causas frecuentes</text>
  <text x="440" y="102" class="lab">• Infección por virus (catarro)</text>
  <text x="440" y="126" class="lab">• Forzar la voz: gritar, cantar</text>
  <text x="440" y="150" class="lab">• Humo, aire seco, reflujo</text>
  <text x="436" y="192" class="step">Ayuda a curar</text>
  <text x="440" y="218" class="lab">• Reposo de la voz</text>
  <text x="440" y="242" class="lab">• Beber líquidos y humidificar</text>
  <text x="440" y="266" class="lab">• Evitar el tabaco</text>
  <text x="440" y="290" class="lab">• No susurrar: también fuerza</text>
  <rect x="436" y="328" width="324" height="92" rx="10" fill="var(--warn-l)"/>
  <text x="452" y="352" class="step" style="fill:var(--warn)">Consultar si</text>
  <text x="456" y="376" class="small">• Dificultad para respirar o tragar</text>
  <text x="456" y="398" class="small">• Ronquera más de 3 semanas</text>
  <text x="400" y="466" text-anchor="middle" class="small muted">Esquema ilustrativo, sin escala. Ilustración original de AloVida.</text>
</svg>
