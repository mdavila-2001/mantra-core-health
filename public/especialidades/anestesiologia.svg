<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="640" height="360" role="img">
<title>Anestesiología</title>
<style>
.f{animation:f 4.8s ease-in-out infinite alternate;transform-box:view-box;transform-origin:160px 150px}
.s{animation:s 4.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.i{animation:i 7s ease-in-out infinite alternate;transform-box:view-box;transform-origin:160px 90px}
.g{animation:g 6s ease-in-out infinite}
.t{animation:t 3.6s ease-in-out infinite alternate}.t2{animation-delay:-1.8s}.t3{animation-delay:-.9s}
.b{animation:b 9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}.b2{animation-duration:12s;animation-direction:alternate-reverse}
@keyframes f{to{transform:translateY(-6px)}}
@keyframes s{to{transform:scale(.82);opacity:.55}}
@keyframes i{from{transform:rotate(-3deg) skewX(1.5deg)}to{transform:rotate(3deg) skewX(-1.5deg)}}
@keyframes g{0%,55%{transform:translateX(-150px)}100%{transform:translateX(150px)}}
@keyframes t{from{opacity:.35;transform:translateY(2px)}to{opacity:1;transform:translateY(-3px)}}
@keyframes b{to{transform:translate(8px,-6px) scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1FAF7"/><stop offset="1" stop-color="#D2ECE5"/></linearGradient>
<radialGradient id="glow" cx="160" cy="84" r="130" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="orb" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#E4F5F0"/><stop offset=".82" stop-color="#A7DBCF"/><stop offset="1" stop-color="#78BFB0"/></radialGradient>
<linearGradient id="ink" x1="0" y1="14" x2="0" y2="82" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#17A898"/><stop offset="1" stop-color="#0B5E57"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0A4F49" flood-opacity=".28"/></filter>
<clipPath id="clip"><circle cx="160" cy="88" r="56"/></clipPath>
</defs>
<rect width="320" height="180" fill="url(#bg)"/>
<rect width="320" height="180" fill="url(#glow)"/>
<g filter="url(#blur6)" fill="#0F766E" fill-opacity=".16"><circle class="b" cx="42" cy="46" r="18"/><circle class="b b2" cx="282" cy="134" r="20"/><circle class="b b2" cx="258" cy="34" r="9"/><circle class="b" cx="66" cy="146" r="10"/></g>
<g fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"><path class="t" d="M270 78 V96 M261 87 H279"/><path class="t t2" d="M50 96 V110 M43 103 H57"/><path class="t t3" d="M90 34 h9 M220 150 h9"/></g>
<g fill="#fff"><circle class="t t2" cx="112" cy="58" r="1.8"/><circle class="t" cx="214" cy="120" r="1.5"/><circle class="t t3" cx="230" cy="62" r="2"/></g>
<ellipse class="s" cx="160" cy="158" rx="48" ry="7" fill="#0A4F49" fill-opacity=".3" filter="url(#blur3)"/>
<g class="f">
<g filter="url(#drop)"><circle cx="160" cy="88" r="56" fill="url(#orb)"/></g>
<circle cx="160" cy="88" r="55" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
<ellipse cx="140" cy="58" rx="20" ry="9" fill="#fff" fill-opacity=".75" transform="rotate(-28 140 58)" filter="url(#blur3)"/>
<g clip-path="url(#clip)"><rect class="g" x="130" y="20" width="40" height="140" fill="url(#shine)" transform="skewX(-20)"/></g>
<g class="i">
<g transform="translate(0 3)"><g transform="translate(83.2 13.2) scale(1.6)" fill="none" stroke="#073B37" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M30 40 C30 32 66 32 66 40 L58 60 H38Z"/><path d="M48 60 V68 C48 74 62 74 62 66"/><path d="M42 46 H54" stroke="#92400E"/><circle cx="48" cy="52" r="3" fill="#F59E0B" stroke="none"/><path d="M30 40 L24 36 M66 40 L72 36"/></g></g>
<g transform="translate(0 2)"><g transform="translate(83.2 13.2) scale(1.6)" fill="none" stroke="#0A4F49" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M30 40 C30 32 66 32 66 40 L58 60 H38Z"/><path d="M48 60 V68 C48 74 62 74 62 66"/><path d="M42 46 H54" stroke="#B45309"/><circle cx="48" cy="52" r="3" fill="#F59E0B" stroke="none"/><path d="M30 40 L24 36 M66 40 L72 36"/></g></g>
<g transform="translate(0 1)"><g transform="translate(83.2 13.2) scale(1.6)" fill="none" stroke="#0C5F58" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M30 40 C30 32 66 32 66 40 L58 60 H38Z"/><path d="M48 60 V68 C48 74 62 74 62 66"/><path d="M42 46 H54" stroke="#C2620A"/><circle cx="48" cy="52" r="3" fill="#F59E0B" stroke="none"/><path d="M30 40 L24 36 M66 40 L72 36"/></g></g>
<g transform="translate(83.2 13.2) scale(1.6)" fill="none" stroke="url(#ink)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M30 40 C30 32 66 32 66 40 L58 60 H38Z"/><path d="M48 60 V68 C48 74 62 74 62 66"/><path d="M42 46 H54" stroke="#F59E0B"/><circle cx="48" cy="52" r="3" fill="#F59E0B" stroke="none"/><path d="M30 40 L24 36 M66 40 L72 36"/></g>
</g>
</g>
</svg>
