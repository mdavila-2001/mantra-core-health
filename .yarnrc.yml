npmMinimalAgeGate: 0

# Instalación en `node_modules`, no en PnP.
#
# Sin esta línea Yarn 4 instala en modo Plug'n'Play, que era lo que ocurría acá
# por omisión y no por decisión. PnP no trae `node_modules`, así que cualquier
# herramienta que resuelva dependencias por su cuenta —un `ng` global, un editor
# que busca los tipos, un script que hace `require` fuera del runtime de Yarn—
# deja de encontrarlas, y el error que muestra rara vez apunta a la causa.
#
# `mantra-core-health-api` ya declara `nodeLinker: node-modules`. Con esta línea
# los dos repositorios del proyecto instalan igual, que es lo que se espera de
# dos repos del mismo equipo.
nodeLinker: node-modules
